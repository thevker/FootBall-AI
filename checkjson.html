<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FootyStats 相差值與賽果分析</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #121212; color: #e0e0e0; margin: 0; padding: 15px;
  display: flex; justify-content: center; min-height: 100vh;
}
.container { width: 100%; max-width: 900px; }
h1 { font-size: 22px; text-align: center; margin: 0 0 6px; color: #fff; }
.subtitle { text-align: center; font-size: 13px; color: #4ade80; margin: 0 0 20px; font-weight: bold; }

textarea {
  width: 100%; min-height: 140px; padding: 12px; background: #1e1e1e;
  border: 1px solid #333; border-radius: 10px; color: #e0e0e0;
  font-family: monospace; font-size: 13px; resize: vertical; outline: none;
}
textarea:focus { border-color: #4ade80; }

.btn-row { display: flex; gap: 10px; margin-top: 10px; }
button { padding: 12px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
.btn-primary { background: #4ade80; color: #121212; flex: 1; }
.btn-primary:hover { background: #3bc76d; }
.btn-secondary { background: #333; color: #ccc; }
.btn-secondary:hover { background: #444; }
.btn-copy { background: #3a7bd5; color: #fff; margin-top: 15px; width: 100%; }
.btn-copy:hover { background: #2a5fa5; }

.error { color: #f87171; background: #331a1a; border: 1px solid #7a3a3a; padding: 12px; border-radius: 8px; margin-top: 10px; display: none; font-size: 13px; line-height: 1.5; }

#result { margin-top: 25px; }
h2 { font-size: 16px; color: #fff; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
.count { font-size: 12px; color: #888; font-weight: normal; }

/* 新增：相差值分佈區塊 */
.dist-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 20px; }
.dist-card { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 12px; text-align: center; }
.dist-title { font-size: 12px; color: #aaa; margin-bottom: 6px; }
.dist-val { font-size: 20px; font-weight: bold; color: #4ade80; }
.dist-pct { font-size: 11px; color: #888; margin-top: 4px; }

.table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #2a2a2a; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead { background: #1a1a1a; position: sticky; top: 0; }
th { padding: 10px 8px; text-align: center; color: #aaa; font-weight: bold; border-bottom: 1px solid #333; white-space: nowrap; }
td { padding: 8px; text-align: center; border-bottom: 1px solid #222; white-space: nowrap; }
tbody tr:hover { background: #1a1a1a; }
.row-home { border-left: 3px solid #4ade80; }
.row-away { border-left: 3px solid #f87171; }
.row-draw { border-left: 3px solid #fbbf24; }
.score-h { color: #4ade80; font-weight: bold; }
.score-a { color: #f87171; font-weight: bold; }
.total { font-weight: bold; color: #fff; }
.highlight { background: rgba(74, 222, 128, 0.1); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #4ade80; color: #121212; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 14px; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 999; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <h1>📊 相差值與賽果分析</h1>
  <p class="subtitle">容錯提取：直接找出主客得失球、A值、B值與相差值</p>

  <div class="input-section">
    <textarea id="jsonInput" placeholder='直接貼上 API 內容，包含 "homeGoalCount" 及 "awayGoalCount" 即可。'></textarea>
    <div class="btn-row">
      <button class="btn-primary" onclick="analyze()">開始分析</button>
      <button class="btn-secondary" onclick="clearAll()">清除</button>
    </div>
    <div id="errorMessage" class="error"></div>
  </div>

  <div id="result" style="display:none;">
    <!-- 主勝相差值分佈 -->
    <div class="summary-section">
      <h2>🏆 真實主勝時的相差值分佈 <span class="count" id="homeWinCount"></span></h2>
      <div class="dist-grid" id="distGrid"></div>
    </div>

    <div class="detail-section" style="margin-top: 25px;">
      <h2>📋 每場明細</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>主得分(h)</th>
              <th>客得分(a)</th>
              <th>A值 (h+h)</th>
              <th>B值 (a+a)</th>
              <th>相差值 (A-B)</th>
              <th>真實賽果</th>
            </tr>
          </thead>
          <tbody id="detailBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function analyze() {
  const raw = document.getElementById('jsonInput').value.trim();
  const errEl = document.getElementById('errorMessage');
  errEl.style.display = 'none';

  if (!raw) { showError('請先貼上內容'); return; }

  let matches = [];

  // 第一步：嘗試正常解析 JSON
  try {
    const parsed = JSON.parse(raw);
    const data = Array.isArray(parsed) ? parsed : parsed.data;
    if (Array.isArray(data)) {
      data.forEach(m => {
        if (m && m.homeGoalCount !== undefined && m.awayGoalCount !== undefined) {
          matches.push({ h: Number(m.homeGoalCount), a: Number(m.awayGoalCount) });
        }
      });
    }
  } catch (e) {
    // 第二步：如果解析失敗，用正則提取
    const regexAdjacent = /"homeGoalCount"\s*:\s*(\d+)[^}]{0,100}?"awayGoalCount"\s*:\s*(\d+)/g;
    let match;
    while ((match = regexAdjacent.exec(raw)) !== null) {
      matches.push({ h: parseInt(match[1]), a: parseInt(match[2]) });
    }

    if (matches.length === 0) {
      const hRegex = /"homeGoalCount"\s*:\s*(\d+)/g;
      const aRegex = /"awayGoalCount"\s*:\s*(\d+)/g;
      const hs = [], as = [];
      let mh, ma;
      while ((mh = hRegex.exec(raw)) !== null) hs.push(parseInt(mh[1]));
      while ((ma = aRegex.exec(raw)) !== null) as.push(parseInt(ma[1]));
      const len = Math.min(hs.length, as.length);
      for (let i = 0; i < len; i++) matches.push({ h: hs[i], a: as[i] });
    }
  }

  if (matches.length === 0) {
    showError('❌ 找不到進球數據！請確保文字中包含 "homeGoalCount" 和 "awayGoalCount"。');
    return;
  }

  let homeWins = 0, draws = 0, awayWins = 0;
  let diffCounts = {}; // 記錄主勝時，各相差值的次數

  const rows = matches.map((m, idx) => {
    const h = m.h;
    const a = m.a;
    
    // 計算 A值、B值、相差值
    const A = h + h;
    const B = a + a;
    const diff = A - B; // 因為單場客失=主得，主失=客得
    
    let resultText = '';
    let rowCls = '';
    
    if (h > a) {
      resultText = '主勝';
      rowCls = 'row-home highlight';
      homeWins++;
      diffCounts[diff] = (diffCounts[diff] || 0) + 1;
    } else if (h < a) {
      resultText = '客勝';
      rowCls = 'row-away';
      awayWins++;
    } else {
      resultText = '和局';
      rowCls = 'row-draw';
      draws++;
    }

    return { idx: idx + 1, h, a, A, B, diff, resultText, rowCls };
  });

  const n = matches.length;

  // ===== 頂部：主勝相差值分佈 =====
  const diffs = Object.keys(diffCounts).sort((a,b) => Number(a) - Number(b));
  document.getElementById('homeWinCount').innerText = `（主勝共 ${homeWins} 場）`;
  
  const distGrid = document.getElementById('distGrid');
  if (diffs.length === 0) {
    distGrid.innerHTML = '<div style="color:#888; grid-column: 1/-1;">沒有任何主勝場次。</div>';
  } else {
    distGrid.innerHTML = diffs.map(d => {
      const count = diffCounts[d];
      const pct = ((count / homeWins) * 100).toFixed(1);
      return `<div class="dist-card">
        <div class="dist-title">相差值 = ${d}</div>
        <div class="dist-val">${count} 場</div>
        <div class="dist-pct">佔主勝 ${pct}%</div>
      </div>`;
    }).join('');
  }

  // ===== 每場明細 =====
  const tbody = document.getElementById('detailBody');
  tbody.innerHTML = rows.map(r => {
    return `<tr class="${r.rowCls}">
      <td>${r.idx}</td>
      <td class="score-h">${r.h}</td>
      <td class="score-a">${r.a}</td>
      <td>${r.A}</td>
      <td>${r.B}</td>
      <td class="total">${r.diff > 0 ? '+' : ''}${r.diff}</td>
      <td style="font-weight:bold;">${r.resultText}</td>
    </tr>`;
  }).join('');

  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}

function showError(msg) {
  const el = document.getElementById('errorMessage');
  el.innerHTML = msg;
  el.style.display = 'block';
}

function clearAll() {
  document.getElementById('jsonInput').value = '';
  document.getElementById('result').style.display = 'none';
  document.getElementById('errorMessage').style.display = 'none';
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
</script>
</body>
</html>
