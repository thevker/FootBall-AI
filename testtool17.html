<script>
'use strict';

/* ==================== 全域設定 ==================== */
var CFG = {
  minBets: 0,
  splitRatio: 1.0,
  useCV: false,
  cvFolds: 5,
  penaltyUnit: 10000
};

/* ==================== 翻譯 ==================== */
var TXT = {
  zh: {
    title:'🧬 智慧規則優化器 v17 — Train/Test + 最少命中',
    desc:'A/B/C = 勝率(%)　D/E/F = 賠率(×100)。目標：找出最高盈利且泛化良好的規則。',
    strength:'搜尋強度：', run:'🚀 開始搜尋', stop:'⏹ 停止',

    thRule:'規則', thOn:'啟用', thCond:'條件', thThen:'指向',
    thHit:'命中', thCorrect:'對', thWrong:'錯', thProfit:'盈利',
    noData:'沒有有效數據'
  },
  en: {
    title:'🧬 Smart Rule Optimizer v17',
    desc:'A/B/C = win%　D/E/F = odds(×100). Goal: max profit with generalization.',
    strength:'Strength: ', run:'🚀 Search', stop:'⏹ Stop',
    hRule:'📋 Evolved Rules (on full data)', waiting:'Waiting...',
    thRule:'Rule', thOn:'On', thCond:'Conds', thThen:'Then',
    thHit:'Hit', thCorrect:'OK', thWrong:'Err', thProfit:'Profit',
    noData:'No valid data'
  }
};
var LANG='zh';
function t(k){return (TXT[LANG]&&TXT[LANG][k])||k;}
function setLang(lang){
  LANG=lang;
  document.getElementById('btn-zh').className='lang-btn'+(lang==='zh'?' active':'');
  document.getElementById('btn-en').className='lang-btn'+(lang==='en'?' active':'');
  document.getElementById('title').textContent=t('title');
  document.getElementById('desc').textContent=t('desc');
  document.getElementById('lbl-strength').textContent=t('strength');
  document.getElementById('btnRun').textContent=t('run');
  document.getElementById('btnStop').textContent=t('stop');
  document.getElementById('h-rule').textContent=t('hRule');
}

/* ==================== 初始規則 ==================== */
var INIT_RULES = [
  {on:1, then:'D', cond:[['B','>=',32],['|A-C|','<=',6]]},
  {on:1, then:'H', cond:[['A','>=',60],['C','<=',11],['D','>=',140],['D','<=',190],['F','>=',400],['F','<=',480]]},
  {on:1, then:'D', cond:[['|A-C|','<=',3],['E','<',380],['|D-F|','<',40]]},
  {on:1, then:'D', cond:[['A','>=',45],['C','<=',20],['|D-F|','<',70],['D','<',400]]},
  {on:1, then:'D', cond:[['|D-F|','<',18]]},
  {on:1, then:'D', cond:[['A','>=',42],['D','>=',155],['D','<',205],['D-F','!=',0],['F-D','>',0],['|A-C|','>=',50]]},
  {on:1, then:'H', cond:[['A','>=',42],['D','>=',155],['D','<',205],['D-F','!=',0]]},
  {on:1, then:'D', cond:[['A','>=',34],['D','>',205],['D','<=',235],['D-F','!=',0]]},
  {on:1, then:'D', cond:[['D','>=',400],['A','>=',42]]},
  {on:1, then:'D', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0],['F','<',200],['|A-C|','<=',5]]},
  {on:1, then:'A', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0],['F','<',200]]},
  {on:1, then:'D', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0]]},
  {on:1, then:'D', cond:[['E','<=',315],['B','>=',27],['|A-C|','<=',25],['D','>=',250],['D','<=',350],['E-D','>',0]]},
  {on:1, then:'D', cond:[['C-A','>',0],['F','>=',490],['F','<=',560],['D','<',200]]},
  {on:1, then:'H', cond:[['C-A','>',0],['F-D','>',0],['F','<',550],['E','>',320]]},
  {on:1, then:'A', cond:[['C-A','>',0],['F','>=',184],['F','<=',216],['C','>=',40]]},
  {on:1, then:'D', cond:[['C-A','>',0],['F-D','>',0],['F','<',300],['C','<',45],['D','<',250]]},
  {on:1, then:'A', cond:[['D-F','>',0],['F','<=',150],['C','>=',65]]},
  {on:1, then:'A', cond:[['D-F','>',0],['D','>',1500],['C','>=',50]]},
  {on:1, then:'D', cond:[['D-F','>',0],['D','>',1500],['A-C','>',0]]},
  {on:1, then:'skip', cond:[['D-F','>',0],['D','>',1500]]},
  {on:1, then:'D', cond:[['D-F','>',0],['A','>=',33],['D','>=',350]]},
  {on:1, then:'H', cond:[['D-F','>',0]]},
  {on:1, then:'H', cond:[['F-D','>',0],['A','>=',50],['F-D','>=',400]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['A','>=',80]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['C-A','>',0]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['A','<',45]]},
  {on:1, then:'skip', cond:[['F-D','>',0],['F','>=',700]]},
  {on:1, then:'D', cond:[['F-D','>',0],['E','>=',470],['F','>=',500]]},
  {on:1, then:'H', cond:[['F-D','>',0],['A','>=',47],['D','<=',140]]},
  {on:1, then:'A', cond:[['F-D','>',0]]},
  {on:1, then:'H', cond:[['A-C','>',0]]},
  {on:1, then:'A', cond:[['C-A','>',0]]},
  {on:1, then:'skip', cond:[]}
];

var RESULTS = ['H','D','A','skip'];
var COLS = [
  'A','B','C','D','E','F',
  '|A-C|','|D-F|','D-F','F-D','A-C','C-A','E-D','E-F','D-E',
  'impA','impB','impC',
  'valA','valB','valC',
  'ratioA','ratioB','ratioC',
  'A+B','B+C','A+C','A+B+C'
];
var OPS = ['>','>=','<','<=','==','!='];

/* ==================== 全域變數 ==================== */
var data=[];
var running=false;
var startTime=0;
var evalCount=0;
var logBuffer=[];
var logTimer=null;
var LOG_MAX=4000;

/* ==================== 工具函式 ==================== */
function tick(){ return new Promise(function(resolve){ setTimeout(resolve, 0); }); }
function ri(min,max){ return min+Math.floor(Math.random()*(max-min+1)); }

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ==================== 日誌 ==================== */
function nowTime(){
  if(!startTime) return '[00:00.000]';
  var ms=Date.now()-startTime;
  var s=Math.floor(ms/1000);
  var m=Math.floor(s/60);
  var sec=s%60;
  var frac=ms%1000;
  return '['+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')+'.'+String(frac).padStart(3,'0')+']';
}
function pushLog(text, cls){
  logBuffer.push({text:text, cls:cls||''});
  if(!logTimer) logTimer=setTimeout(flushLog, 60);
}
function flushLog(){
  logTimer=null;
  if(logBuffer.length===0) return;
  var logEl=document.getElementById('log');
  if(!logEl.dataset.started){ logEl.innerHTML=''; logEl.dataset.started='1'; }
  var frag=document.createDocumentFragment();
  for(var i=0;i<logBuffer.length;i++){
    var e=logBuffer[i];
    var div=document.createElement('div');
    if(e.cls) div.className='l-'+e.cls;
    div.textContent=e.text;
    frag.appendChild(div);
  }
  logBuffer=[];
  logEl.appendChild(frag);
  while(logEl.children.length>LOG_MAX) logEl.removeChild(logEl.firstChild);
  if(document.getElementById('autoScroll').checked) logEl.scrollTop=logEl.scrollHeight;
}
function clearLog(){
  var logEl=document.getElementById('log');
  logEl.innerHTML=''; logEl.dataset.started='1';
  logBuffer=[];
}

/* CV 模式下強制精簡日誌 */
function isVerbose(){ return CFG.useCV ? false : document.getElementById('verbose').checked; }
function isShowBad(){ return CFG.useCV ? false : document.getElementById('showBad').checked; }

/* ==================== 資料解析 ==================== */
function parseData(text){
  var rows=[];
  var seen={};
  var dups=0;
  var totalValid=0;
  var lines=text.split('\n');
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line) continue;
    var p=line.split(/\s+/);
    if(p.length<8) continue;
    var v=p.slice(0,6).map(Number);
    var score=p[6];
    var r=p[7].toUpperCase();
    if(v.some(isNaN)) continue;
    if(['H','D','A'].indexOf(r)===-1) continue;
    totalValid++;
    var sig=v[0]+'|'+v[1]+'|'+v[2]+'|'+v[3]+'|'+v[4]+'|'+v[5]+'|'+score+'|'+r;
    if(seen[sig]){ dups++; continue; }
    seen[sig]=1;
    rows.push({A:v[0],B:v[1],C:v[2],D:v[3],E:v[4],F:v[5],score:score,result:r,sig:sig});
  }
  return {rows:rows,total:totalValid,dups:dups};
}

/* ==================== 分割 ==================== */
function shuffle(arr, rng){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(rng()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function splitData(rows, ratio, seed){
  var rng=mulberry32(seed || 12345);
  var sh=shuffle(rows, rng);
  var nTrain=Math.floor(rows.length*ratio);
  return {train: sh.slice(0,nTrain), test: sh.slice(nTrain)};
}

function getFold(rows, fold, folds, seed){
  var rng=mulberry32(seed || 12345);
  var sh=shuffle(rows, rng);
  var n=rows.length;
  var foldSize=Math.floor(n/folds);
  var start=fold*foldSize;
  var end=(fold===folds-1) ? n : start+foldSize;
  var test=sh.slice(start,end);
  var train=sh.slice(0,start).concat(sh.slice(end));
  return {train:train, test:test};
}

/* ==================== 取值 ==================== */
function getVal(row, col){
  switch(col){
    case 'A': return row.A;
    case 'B': return row.B;
    case 'C': return row.C;
    case 'D': return row.D;
    case 'E': return row.E;
    case 'F': return row.F;
    case '|A-C|': return Math.abs(row.A-row.C);
    case '|D-F|': return Math.abs(row.D-row.F);
    case 'D-F': return row.D-row.F;
    case 'F-D': return row.F-row.D;
    case 'A-C': return row.A-row.C;
    case 'C-A': return row.C-row.A;
    case 'E-D': return row.E-row.D;
    case 'E-F': return row.E-row.F;
    case 'D-E': return row.D-row.E;
    case 'impA': return row.D>0 ? Math.round(10000/row.D) : 0;
    case 'impB': return row.E>0 ? Math.round(10000/row.E) : 0;
    case 'impC': return row.F>0 ? Math.round(10000/row.F) : 0;
    case 'valA': return row.A - (row.D>0 ? 10000/row.D : 0);
    case 'valB': return row.B - (row.E>0 ? 10000/row.E : 0);
    case 'valC': return row.C - (row.F>0 ? 10000/row.F : 0);
    case 'ratioA': return row.D>0 ? (row.A * row.D / 100) : 0;
    case 'ratioB': return row.E>0 ? (row.B * row.E / 100) : 0;
    case 'ratioC': return row.F>0 ? (row.C * row.F / 100) : 0;
    case 'A+B': return row.A + row.B;
    case 'B+C': return row.B + row.C;
    case 'A+C': return row.A + row.C;
    case 'A+B+C': return row.A + row.B + row.C;
  }
  return 0;
}

function cmp(a,op,b){
  if(op==='>') return a>b;
  if(op==='>=') return a>=b;
  if(op==='<') return a<b;
  if(op==='<=') return a<=b;
  if(op==='==') return Math.abs(a-b)<1e-9;
  if(op==='!=') return Math.abs(a-b)>=1e-9;
  return false;
}
function matchRule(row, rule){
  for(var i=0;i<rule.cond.length;i++){
    var c=rule.cond[i];
    if(!cmp(getVal(row,c[0]), c[1], c[2])) return false;
  }
  return true;
}
function predict(row, rules){
  for(var i=0;i<rules.length;i++){
    var r=rules[i];
    if(!r.on) continue;
    if(matchRule(row,r)) return r.then;
  }
  return 'skip';
}

/* ==================== 盈利計算 ==================== */
/* 純盈利評估（無懲罰），用於最終驗證 */
function evalRules(rows, rules){
  var profit=0, hits=0, correct=0, wrong=0;
  for(var i=0;i<rows.length;i++){
    var row=rows[i];
    var p=predict(row,rules);
    if(p==='skip') continue;
    hits++;
    if(p===row.result){
      correct++;
      if(p==='H') profit += (row.D-100);
      else if(p==='D') profit += (row.E-100);
      else if(p==='A') profit += (row.F-100);
    } else {
      wrong++;
      profit -= 100;
    }
  }
  return {profit:profit, hits:hits, correct:correct, wrong:wrong};
}

/* 搜尋用（含最少命中懲罰） */
function calcProfitFull(rows, rules){
  evalCount++;
  var r=evalRules(rows, rules);
  var penalty=0;
  if(CFG.minBets>0 && r.hits<CFG.minBets){
    penalty=(CFG.minBets-r.hits)*CFG.penaltyUnit;
  }
  return {
    profit: r.profit - penalty,
    rawProfit: r.profit,
    hits: r.hits,
    penalty: penalty,
    violated: penalty>0
  };
}
function calcProfit(rows, rules){
  return calcProfitFull(rows, rules).profit;
}

/* ==================== 複製 ==================== */
function cloneRules(rules){
  var out=[];
  for(var i=0;i<rules.length;i++){
    var r=rules[i];
    var c=[];
    for(var j=0;j<r.cond.length;j++) c.push([r.cond[j][0],r.cond[j][1],r.cond[j][2]]);
    out.push({on:r.on, then:r.then, cond:c});
  }
  return out;
}
function cloneConds(cond){
  var out=[];
  for(var i=0;i<cond.length;i++) out.push([cond[i][0],cond[i][1],cond[i][2]]);
  return out;
}

/* ==================== 格式化 ==================== */
function fmtCond(c){ return c[0]+c[1]+c[2]; }
function fmtRule(rule){ return rule.cond.map(fmtCond).join(' & ')+' → '+rule.then; }
function fmtShortRule(rule){
  var s=rule.cond.map(fmtCond).join('&');
  if(s.length>60) s=s.slice(0,57)+'...';
  return s+'→'+rule.then;
}

/* ==================== 變體 ==================== */
function randValFor(col){
  if(col==='A'||col==='B'||col==='C') return ri(15,80);
  if(col==='D'||col==='E'||col==='F') return ri(100,800);
  if(col==='|A-C|'||col==='A+C'||col==='A+B'||col==='B+C') return ri(2,80);
  if(col==='|D-F|') return ri(10,300);
  if(col==='impA'||col==='impB'||col==='impC') return ri(10,70);
  if(col==='valA'||col==='valB'||col==='valC') return ri(-30,30);
  if(col==='ratioA'||col==='ratioB'||col==='ratioC') return ri(50,180);
  return ri(-100,100);
}
function addRandomCondition(rule){
  var newRule={on:rule.on, then:rule.then, cond:cloneConds(rule.cond)};
  var col=COLS[ri(0,COLS.length-1)];
  var op=OPS[ri(0,OPS.length-1)];
  var val=randValFor(col);
  newRule.cond.push([col,op,val]);
  return newRule;
}
function removeRandomCondition(rule){
  if(rule.cond.length<=1) return null;
  var newRule={on:rule.on, then:rule.then, cond:cloneConds(rule.cond)};
  var idx=ri(0,newRule.cond.length-1);
  newRule.cond.splice(idx,1);
  return newRule;
}

/* ==================== 座標下降 ==================== */
function optimizeOneRule(rows, rules, ruleIdx, curProfit){
  var verbose=isVerbose();
  var showBad=isShowBad();
  var base=cloneRules(rules);
  var best=base;
  var bestProfit=curProfit;
  var changed=false;
  var prefix='  '+nowTime()+' [R'+(ruleIdx+1)+'] ';

  /* 1. 試所有 then */
  for(var ti=0;ti<RESULTS.length;ti++){
    var then=RESULTS[ti];
    if(base[ruleIdx].then===then) continue;
    var test=cloneRules(base);
    test[ruleIdx].then=then;
    var p=calcProfit(rows, test);
    if(p>bestProfit){
      pushLog(prefix+'then '+best[ruleIdx].then+'→'+then+' 盈利 '+bestProfit+'→'+p+' ✓','ok');
      best=test; bestProfit=p; changed=true;
    } else if(showBad){
      pushLog(prefix+'then '+best[ruleIdx].then+'→'+then+' ✗ '+p,'bad');
    }
  }

  /* 2. 試 on/off */
  {
    var t2=cloneRules(best);
    t2[ruleIdx].on=best[ruleIdx].on?0:1;
    var p2=calcProfit(rows, t2);
    if(p2>bestProfit){
      pushLog(prefix+'toggle '+(best[ruleIdx].on?'ON→OFF':'OFF→ON')+' 盈利 '+bestProfit+'→'+p2+' ✓','ok');
      best=t2; bestProfit=p2; changed=true;
    } else if(showBad){
      pushLog(prefix+'toggle ✗ '+p2,'bad');
    }
  }

  /* 3. 試刪除單一條件 */
  if(best[ruleIdx].cond.length>1){
    for(var rci=0;rci<best[ruleIdx].cond.length;rci++){
      var t4=cloneRules(best);
      var rc=t4[ruleIdx].cond[rci];
      t4[ruleIdx].cond.splice(rci,1);
      var p4=calcProfit(rows, t4);
      if(p4>bestProfit){
        pushLog(prefix+'remove '+fmtCond(rc)+' 盈利 '+bestProfit+'→'+p4+' ✓','ok');
        best=t4; bestProfit=p4; changed=true;
        break;
      } else if(showBad){
        pushLog(prefix+'remove '+fmtCond(rc)+' ✗ '+p4,'bad');
      }
    }
  }

  /* 4. 閾值掃描 + 運算子交換 */
  var condCount=best[ruleIdx].cond.length;
  for(var ci=0;ci<condCount;ci++){
    var c=best[ruleIdx].cond[ci];
    var curVal=c[2];
    var step=1, window=20;
    var av=Math.abs(curVal);
    if(av>=50){ step=1; window=30; }
    if(av>=100){ step=2; window=50; }
    if(av>=300){ step=5; window=100; }
    if(av>=700){ step=10; window=150; }

    if(verbose) pushLog(prefix+'scan '+c[0]+c[1]+' around '+curVal+' ['+(curVal-window)+'~'+(curVal+window)+']','scan');

    var bestV=curVal;
    var bestVP=bestProfit;
    for(var v=curVal-window; v<=curVal+window; v+=step){
      if(v<0 && curVal>=0) continue;
      var t3=cloneRules(best);
      t3[ruleIdx].cond[ci][2]=v;
      var p3=calcProfit(rows, t3);
      if(p3>bestVP){ bestV=v; bestVP=p3; }
    }
    if(bestV!==curVal){
      pushLog(prefix+'  ↳ '+c[0]+c[1]+' '+curVal+'→'+bestV+' 盈利 '+bestProfit+'→'+bestVP+' ✓','ok');
      best[ruleIdx].cond[ci][2]=bestV;
      bestProfit=bestVP;
      changed=true;
    } else if(verbose){
      pushLog(prefix+'  ↳ 無改進（維持 '+curVal+'）','dim');
    }

    /* 運算子交換 */
    var c2=best[ruleIdx].cond[ci];
    var origOp=c2[1];
    var bestOp=origOp, bestOpP=bestProfit;
    for(var oi=0;oi<OPS.length;oi++){
      var op=OPS[oi];
      if(op===origOp) continue;
      var t5=cloneRules(best);
      t5[ruleIdx].cond[ci][1]=op;
      var p5=calcProfit(rows, t5);
      if(p5>bestOpP){ bestOp=op; bestOpP=p5; }
    }
    if(bestOp!==origOp){
      pushLog(prefix+'  ↳ op '+origOp+'→'+bestOp+' 盈利 '+bestProfit+'→'+bestOpP+' ✓','ok');
      best[ruleIdx].cond[ci][1]=bestOp;
      bestProfit=bestOpP;
      changed=true;
    }
  }

  return {rules:best, profit:bestProfit, changed:changed};
}

function coordinateDescent(rows, startRules, label){
  var cur=cloneRules(startRules);
  var curProfit=calcProfit(rows, cur);
  var improved=true;
  var totalIter=0;
  var pass=0;
  pushLog('  '+nowTime()+' '+label+' 起始盈利: '+curProfit,'gen');

  while(improved && running){
    pass++;
    improved=false;
    pushLog('  '+nowTime()+' ── '+label+' 掃描第 '+pass+' 輪 ──','dim');

    for(var i=0;i<cur.length;i++){
      if(!running){
        pushLog('  '+nowTime()+' ⏹ 中斷','warn');
        return {rules:cur, profit:curProfit, iter:totalIter};
      }
      var res=optimizeOneRule(rows, cur, i, curProfit);
      totalIter++;
      if(res.profit>curProfit){
        cur=res.rules;
        curProfit=res.profit;
        improved=true;
      }
    }
    pushLog('  '+nowTime()+' 第 '+pass+' 輪完成，盈利: '+curProfit, improved?'ok':'dim');
  }
  pushLog('  '+nowTime()+' ✓ '+label+' 收斂於 '+curProfit+'（掃描 '+totalIter+' 次）','success');
  return {rules:cur, profit:curProfit, iter:totalIter};
}

/* ==================== 結構搜尋 ==================== */
function structureSearch(rows, startRules, maxAttempts){
  pushLog('');
  pushLog('  '+nowTime()+' ━━━ 結構搜尋（最多 '+maxAttempts+' 次）━━━','struct');

  var cur=cloneRules(startRules);
  var curProfit=calcProfit(rows, cur);
  var bestProfit=curProfit;
  var bestRules=cloneRules(cur);
  var attempts=0, successes=0, lastReport=0;

  while(running && attempts<maxAttempts){
    attempts++;
    var test=cloneRules(cur);
    var p=Math.random();
    var action='', detail='';

    if(p<0.22){
      var idx=ri(0,test.length-1);
      test[idx]=addRandomCondition(test[idx]);
      var added=test[idx].cond[test[idx].cond.length-1];
      action='ADD_COND';
      detail='R'+(idx+1)+' +'+fmtCond(added);
    } else if(p<0.40){
      var idx2=ri(0,test.length-1);
      var removed=test[idx2].cond.length>0?test[idx2].cond[test[idx2].cond.length-1]:null;
      var newR=removeRandomCondition(test[idx2]);
      if(newR){
        test[idx2]=newR;
        action='DEL_COND';
        detail='R'+(idx2+1)+' -'+fmtCond(removed);
      } else continue;
    } else if(p<0.55){
      if(test.length>5){
        var minIdx=Math.min(3,test.length-1);
        var delIdx=ri(minIdx,test.length-1);
        var delRule=test[delIdx];
        test.splice(delIdx,1);
        action='DEL_RULE';
        detail='刪除 R'+(delIdx+1);
      } else continue;
    } else if(p<0.72){
      var srcIdx=ri(0,test.length-1);
      var copy={on:test[srcIdx].on, then:test[srcIdx].then, cond:cloneConds(test[srcIdx].cond)};
      copy=addRandomCondition(copy);
      test.splice(srcIdx+1,0,copy);
      action='SPLIT';
      detail='R'+(srcIdx+1)+' 分裂';
      if(test.length>100) continue;
    } else if(p<0.85){
      if(test.length>=2){
        var i2=ri(0,test.length-2);
        var tmp=test[i2]; test[i2]=test[i2+1]; test[i2+1]=tmp;
        action='SWAP';
        detail='交換 R'+(i2+1)+' ↔ R'+(i2+2);
      } else continue;
    } else {
      var idx3=ri(0,test.length-1);
      var oldThen=test[idx3].then;
      var opts=RESULTS.filter(function(x){return x!==oldThen;});
      var newThen=opts[ri(0,opts.length-1)];
      test[idx3].then=newThen;
      action='CHANGE_THEN';
      detail='R'+(idx3+1)+' '+oldThen+' → '+newThen;
    }

    var newProfit=calcProfit(rows, test);
    var delta=newProfit-curProfit;

    if(newProfit>curProfit){
      cur=test;
      curProfit=newProfit;
      successes++;
      pushLog('  '+nowTime()+' ['+attempts+'] '+action+' '+detail+' → '+newProfit+' (Δ+'+(delta>=0?'+':'')+delta+') ✓','ok');
      if(newProfit>bestProfit){
        bestProfit=newProfit;
        bestRules=cloneRules(test);
        pushLog('  '+nowTime()+' ★★★ 結構新最優：'+bestProfit+'（規則數 '+test.length+'）','best');
      }
    } else if(isShowBad()){
      pushLog('  '+nowTime()+' ['+attempts+'] '+action+' '+detail+' → '+newProfit+' (Δ'+delta+') ✗','bad');
    }

    if(attempts-lastReport>=20){
      lastReport=attempts;
      pushLog('  '+nowTime()+' 進度 '+attempts+'/'+maxAttempts+'，成功 '+successes,'info');
    }
  }
  pushLog('  '+nowTime()+' 結構搜尋結束：'+attempts+' 次，'+successes+' 次改進，最佳 '+bestProfit,'struct');
  pushLog('');
  return {rules:bestRules, profit:bestProfit, attempts:attempts, successes:successes};
}

/* ==================== 隨機重啟 ==================== */
function randomRestart(nMut){
  var r=cloneRules(INIT_RULES);
  for(var k=0;k<nMut;k++){
    var p=Math.random();
    if(p<0.35){
      var idx=ri(0,r.length-1);
      if(r[idx].cond.length===0) continue;
      var ci=ri(0,r[idx].cond.length-1);
      var v=r[idx].cond[ci][2];
      var step=1;
      if(Math.abs(v)>=50) step=2;
      if(Math.abs(v)>=100) step=5;
      if(Math.abs(v)>=300) step=10;
      if(Math.abs(v)>=700) step=20;
      var delta=ri(-10,10)*step;
      r[idx].cond[ci][2]=v+delta;
      var col=r[idx].cond[ci][0];
      if(col==='A'||col==='B'||col==='C') r[idx].cond[ci][2]=Math.max(0,Math.min(100,r[idx].cond[ci][2]));
    } else if(p<0.50){
      var idx2=ri(0,r.length-1);
      var opts=RESULTS.filter(function(x){return x!==r[idx2].then;});
      r[idx2].then=opts[ri(0,opts.length-1)];
    } else if(p<0.62){
      var idx3=ri(0,r.length-1);
      r[idx3].on=r[idx3].on?0:1;
    } else if(p<0.72){
      var i2=ri(0,r.length-2);
      var tmp=r[i2]; r[i2]=r[i2+1]; r[i2+1]=tmp;
    } else if(p<0.80){
      if(r.length>5){
        var minIdx=Math.min(3,r.length-1);
        r.splice(ri(minIdx,r.length-1),1);
      }
    } else if(p<0.90){
      var idx4=ri(0,r.length-1);
      r[idx4]=addRandomCondition(r[idx4]);
    } else {
      var srcIdx=ri(0,r.length-1);
      var copy={on:r[srcIdx].on, then:r[srcIdx].then, cond:cloneConds(r[srcIdx].cond)};
      copy=addRandomCondition(copy);
      r.splice(srcIdx+1,0,copy);
    }
  }
  return r;
}

/* ==================== 診斷 ==================== */
function diagnose(rows, rules){
  var stats=[];
  for(var i=0;i<rules.length;i++) stats.push({idx:i, rule:rules[i], hit:0, correct:0, wrong:0, profit:0});
  for(var i=0;i<rows.length;i++){
    var row=rows[i];
    var p='skip', hitRule=-1;
    for(var j=0;j<rules.length;j++){
      if(!rules[j].on) continue;
      if(matchRule(row,rules[j])){ p=rules[j].then; hitRule=j; break; }
    }
    if(p==='skip'||hitRule===-1) continue;
    var s=stats[hitRule];
    s.hit++;
    var gp;
    if(p===row.result){
      s.correct++;
      if(p==='H') gp=row.D-100;
      else if(p==='D') gp=row.E-100;
      else gp=row.F-100;
    } else { s.wrong++; gp=-100; }
    s.profit+=gp;
  }
  return stats;
}

/* ==================== Google Sheets 公式 ==================== */
function sheetOp(op){ if(op==='!=') return '<>'; if(op==='==') return '='; return op; }
function buildCond(c){
  var col=c[0], op=c[1], val=c[2];
  var sop=sheetOp(op);
  switch(col){
    case 'A': return '(A2:A'+sop+val+')';
    case 'B': return '(B2:B'+sop+val+')';
    case 'C': return '(C2:C'+sop+val+')';
    case 'D': return '(D2:D'+sop+val+')';
    case 'E': return '(E2:E'+sop+val+')';
    case 'F': return '(F2:F'+sop+val+')';
    case '|A-C|': return '(ABS(A2:A-C2:C)'+sop+val+')';
    case '|D-F|': return '(ABS(D2:D-F2:F)'+sop+val+')';
    case 'D-F': return '((D2:D-F2:F)'+sop+val+')';
    case 'F-D': return '((F2:F-D2:D)'+sop+val+')';
    case 'A-C': return '((A2:A-C2:C)'+sop+val+')';
    case 'C-A': return '((C2:C-A2:A)'+sop+val+')';
    case 'E-D': return '((E2:E-D2:D)'+sop+val+')';
    case 'E-F': return '((E2:E-F2:F)'+sop+val+')';
    case 'D-E': return '((D2:D-E2:E)'+sop+val+')';
    case 'impA': return '(ROUND(10000/D2:D,0)'+sop+val+')';
    case 'impB': return '(ROUND(10000/E2:E,0)'+sop+val+')';
    case 'impC': return '(ROUND(10000/F2:F,0)'+sop+val+')';
    case 'valA': return '((A2:A-10000/D2:D)'+sop+val+')';
    case 'valB': return '((B2:B-10000/E2:E)'+sop+val+')';
    case 'valC': return '((C2:C-10000/F2:F)'+sop+val+')';
    case 'ratioA': return '((A2:A*D2:D/100)'+sop+val+')';
    case 'ratioB': return '((B2:B*E2:E/100)'+sop+val+')';
    case 'ratioC': return '((C2:C*F2:F/100)'+sop+val+')';
    case 'A+B': return '((A2:A+B2:B)'+sop+val+')';
    case 'B+C': return '((B2:B+C2:C)'+sop+val+')';
    case 'A+C': return '((A2:A+C2:C)'+sop+val+')';
    case 'A+B+C': return '((A2:A+B2:B+C2:C)'+sop+val+')';
    default: return 'FALSE';
  }
}
function buildCondExpr(rule){
  if(rule.cond.length===0) return 'TRUE';
  var parts=[];
  for(var i=0;i<rule.cond.length;i++) parts.push(buildCond(rule.cond[i]));
  return parts.join('*');
}
function genFormula(rules){
  var active=[];
  for(var i=0;i<rules.length;i++) if(rules[i].on) active.push(rules[i]);
  if(active.length===0) return '=ARRAYFORMULA(IF(A2:A="","","skip"))';
  var body='';
  for(var i=0;i<active.length;i++){
    body+='IF('+buildCondExpr(active[i])+',"'+active[i].then+'",';
  }
  body+='"skip"';
  for(var j=0;j<active.length;j++) body+=')';
  return '=ARRAYFORMULA(IF((A2:A="")+(B2:B="")+(C2:C="")+(D2:D="")+(E2:E="")+(F2:F=""),"",'+body+'))';
}

/* ==================== 單次優化 ==================== */
async function optimizeOnce(trainRows, N, label){
  var globalBest=null;
  var globalProfit=-Infinity;

  /* 階段 1 */
  pushLog('');
  pushLog('═══════════════════════════════════════════════════════════','head');
  pushLog(nowTime()+' '+label+' ▶ 階段 1：初始規則座標下降','fold');
  pushLog('═══════════════════════════════════════════════════════════','head');
  var baseP=calcProfit(trainRows, INIT_RULES);
  pushLog(nowTime()+' 初始盈利：'+baseP,'info');
  var r0=coordinateDescent(trainRows, INIT_RULES, label+' 初始');
  globalBest=r0.rules;
  globalProfit=r0.profit;
  pushLog('');
  pushLog(nowTime()+' ✓ 階段 1 完成：'+baseP+' → '+r0.profit+' (Δ+'+(r0.profit-baseP)+')','success');
  updateStats(0, globalProfit);
  document.getElementById('progbar').style.width=(1/(N+1)*100).toFixed(1)+'%';
  await tick();

  for(var k=1;k<=N;k++){
    if(!running) return {rules:globalBest, profit:globalProfit};

    if(k%10===0){
      pushLog('');
      pushLog('═══════════════════════════════════════════════════════════','head');
      pushLog(nowTime()+' '+label+' ▶ 結構搜尋（起點 #'+k+' 觸發）','fold');
      pushLog('═══════════════════════════════════════════════════════════','head');
      var beforeProfit=globalProfit;
      var sres=structureSearch(trainRows, globalBest, 200);
      if(sres.profit>globalProfit){
        globalProfit=sres.profit;
        globalBest=sres.rules;
        pushLog('  ✓ 結構搜尋成功：'+beforeProfit+' → '+globalProfit,'success');
      } else {
        pushLog('  ✗ 結構搜尋無改進（'+sres.attempts+' 次嘗試）','warn');
      }
    }

    var nMut=3+ri(0,15);
    pushLog('');
    pushLog('═══════════════════════════════════════════════════════════','head');
    pushLog(nowTime()+' '+label+' ▶ 起點 #'+k+'/'+N+'：'+nMut+' 次隨機變異','fold');
    pushLog('═══════════════════════════════════════════════════════════','head');
    var startRules=randomRestart(nMut);
    var r=coordinateDescent(trainRows, startRules, label+' #'+k);

    if(r.profit>globalProfit){
      var diff=r.profit-globalProfit;
      globalProfit=r.profit;
      globalBest=r.rules;
      pushLog('');
      pushLog('  ★★★ 新全局最優：'+globalProfit+' (Δ+'+(diff>=0?'+':'')+diff+')','best');
    } else {
      pushLog('  ✗ 收斂於 '+r.profit+'（低於最優 '+globalProfit+'）','dim');
    }
    pushLog('');

    updateStats(k, globalProfit);
    document.getElementById('progbar').style.width=((k+1)/(N+1)*100).toFixed(1)+'%';
    await tick();
  }

  return {rules:globalBest, profit:globalProfit};
}

/* ==================== 主流程 ==================== */
async function start(){
  var parsed=parseData(document.getElementById('input').value);
  data=parsed.rows;
  if(data.length===0){ alert(t('noData')); return; }

  /* 讀取設定 */
  CFG.minBets=parseInt(document.getElementById('minBets').value)||0;
  CFG.splitRatio=parseFloat(document.getElementById('splitRatio').value);
  CFG.useCV=document.getElementById('useCV').checked;
  CFG.cvFolds=parseInt(document.getElementById('cvFolds').value);

  /* 檢查：最少命中數是否超過資料量 */
  var folds=CFG.useCV?CFG.cvFolds:1;
  var minTrainSize=CFG.useCV
    ? Math.floor(data.length*(1-1/CFG.cvFolds))
    : (CFG.splitRatio<1 ? Math.floor(data.length*CFG.splitRatio) : data.length);
  if(CFG.minBets>minTrainSize){
    if(!confirm('⚠ 最少命中數 '+CFG.minBets+' 大於訓練集大小 '+minTrainSize+'，無法滿足約束。仍要繼續嗎？')) return;
  }

  running=true;
  startTime=Date.now();
  evalCount=0;
  document.getElementById('btnRun').disabled=true;
  document.getElementById('btnStop').disabled=false;
  document.getElementById('diag').style.display='none';
  document.getElementById('best').style.display='none';
  document.getElementById('cvResult').style.display='none';
  document.getElementById('liveStats').style.display='flex';
  document.getElementById('progbar').style.width='0%';
  clearLog();

  var N=parseInt(document.getElementById('strength').value);

  pushLog('═══════════════════════════════════════════════════════════','head');
  pushLog('🧬 智慧規則優化器 v17 啟動','head');
  pushLog('═══════════════════════════════════════════════════════════','head');
  pushLog(nowTime()+' 解析輸入資料...','info');
  pushLog(nowTime()+' ├─ 原始有效行數：'+parsed.total,'info');
  pushLog(nowTime()+' ├─ 重複行數：'+parsed.dups+'（已忽略）','warn');
  pushLog(nowTime()+' └─ 去重後使用：'+data.length+' 筆','success');
  pushLog(nowTime()+' 搜尋起點數：'+(N+1)+'（含初始）','info');
  pushLog(nowTime()+' 初始規則數：'+INIT_RULES.length,'info');
  pushLog('');
  pushLog(nowTime()+' 🔬 驗證設定：','fold');
  pushLog(nowTime()+'   ├─ 最少命中：'+(CFG.minBets>0?CFG.minBets+' 筆（違反懲罰 '+(CFG.penaltyUnit)+'/筆）':'無限制'),'info');
  if(CFG.useCV){
    pushLog(nowTime()+'   ├─ 模式：K-Fold 交叉驗證（K='+CFG.cvFolds+'）','info');
    pushLog(nowTime()+'   └─ 每 fold 約 '+Math.floor(data.length/CFG.cvFolds)+' 筆測試','info');
  } else if(CFG.splitRatio<1){
    pushLog(nowTime()+'   ├─ 模式：單次分割','info');
    pushLog(nowTime()+'   ├─ Train：'+Math.floor(data.length*CFG.splitRatio)+' 筆','info');
    pushLog(nowTime()+'   └─ Test：'+(data.length-Math.floor(data.length*CFG.splitRatio))+' 筆','info');
  } else {
    pushLog(nowTime()+'   ├─ 模式：全部訓練（無驗證）','warn');
    pushLog(nowTime()+'   └─ ⚠ 沒有測試集，可能過擬合','warn');
  }
  pushLog('');

  /* 跑 K 次或 1 次 */
  var foldResults=[];

  for(var f=0;f<folds;f++){
    if(!running) break;

    var fold, label;
    if(CFG.useCV){
      label='[Fold '+(f+1)+'/'+folds+']';
      fold=getFold(data, f, folds, 12345);
    } else if(CFG.splitRatio<1){
      label='[Split]';
      fold=splitData(dataG, CF.splitRatio, 12345);
    } else {
      label='[Full]';
      fold={train:data, test:data};
    }

    pushLog('');
    pushLog('╔═══════════════════════════════════════════════════════════╗','head');
    pushLog('║ 📂 '+label+'  Train: '+fold.train.length+' 筆 / Test: '+fold.test.length+' 筆','fold');
    pushLog('╚═══════════════════════════════════════════════════════════╝','head');

    var result=await optimizeOnce(fold.train, N, label);

    if(!running){
      break;
    }

    /* 評估 */
    var trainEval=evalRules(fold.train, result.rules);
    var testEval=evalRules(fold.test, result.rules);

    pushLog('');
    pushLog('📊 '+label+' 結果：','fold');
    pushLog('   Train 盈利：'+trainEval.profit+'（命中 '+trainEval.hits+'，對 '+trainEval.correct+'，錯 '+trainEval.wrong+'）','info');
    if(fold.test!==fold.train){
      pushLog('   Test  盈利：'+testEval.profit+'（命中 '+testEval.hits+'，對 '+testEval.correct+'，錯 '+testEval.wrong+'）','success');

      /* 過擬合警示 */
      var gap=trainEval.profit-testEval.profit;
      var threshold=Math.max(500, Math.abs(trainEval.profit)*0.5);
      if(gap>threshold && trainEval.profit>0){
        pushLog('   ⚠ 過擬合警示：Train 比 Test 高 '+gap+'（差距 '+(gap/trainEval.profit*100).toFixed(0)+'%）','warn');
      }
      /* 最少命中檢查 */
      if(CFG.minBets>0){
        if(testEval.hits<CFG.minBets){
          pushLog('   ⚠ Test 命中 '+testEval.hits+' 筆 < 要求 '+CFG.minBets+' 筆','err');
        } else {
          pushLog('   ✓ Test 命中 '+testEval.hits+' 筆 ≥ 要求 '+CFG.minBets,'ok');
        }
      }
    }

    foldResults.push({
      label:label,
      rules:result.rules,
      trainEval:trainEval,
      testEval:testEval,
      trainProfit:result.profit,
      isTrain:fold.train!==fold.test
    });

    await tick();
  }

  if(!running){
    pushLog('');
    pushLog('⏹ 使用者停止，輸出目前最佳結果','warn');
  }

  if(foldResults.length===0){
    running=false;
    document.getElementById('btnRun').disabled=false;
    document.getElementById('btnStop').disabled=true;
    return;
  }

  finish(parsed, foldResults, N);
}

/* ==================== 完成 ==================== */
function finish(parsed, foldResults, N){
  var elapsed=((Date.now()-startTime)/1000).toFixed(1);

  /* 選擇最終規則：trainProfit 最高（含懲罰的目標值） */
  var best=foldResults[0];
  for(var i=1;i<foldResults.length;i++){
    if(foldResults[i].trainProfit>best.trainProfit) best=foldResults[i];
  }
  var finalRules=best.rules;

  pushLog('');
  pushLog('═══════════════════════════════════════════════════════════','head');
  pushLog('🏆 完成！','head');
  pushLog('═══════════════════════════════════════════════════════════','head');
  pushLog('   去重前：'+parsed.total+' 筆','info');
  pushLog('   重複：'+parsed.dups+' 筆','info');
  pushLog('   實際分析：'+data.length+' 筆','info');
  pushLog('   總耗時：'+elapsed+' 秒','info');
  pushLog('   總掃描：'+evalCount+' 次','info');
  pushLog('   最終規則數：'+finalRules.length,'info');
  pushLog('');

  /* CV 匯總 */
  if(CFG.useCV && foldResults.length>1){
    var avgTrain=0, avgTest=0, avgHits=0;
    for(var i=0;i<foldResults.length;i++){
      avgTrain+=foldResults[i].trainEval.profit;
      avgTest+=foldResults[i].testEval.profit;
      avgHits+=foldResults[i].testEval.hits;
    }
    avgTrain/=foldResults.length;
    avgTest/=foldResults.length;
    avgHits/=foldResults.length;

    var sd=0;
    for(var i=0;i<foldResults.length;i++){
      sd+=Math.pow(foldResults[i].testEval.profit-avgTest, 2);
    }
    sd=Math.sqrt(sd/foldResults.length);

    /* 簡易 t 統計（平均 / 標準誤） */
    var se=sd/Math.sqrt(foldResults.length);

    pushLog('═══════════════════════════════════════════════════════════','head');
    pushLog('📈 K-Fold 交叉驗證匯總（K='+CFG.cvFolds+'）','fold');
    pushLog('═══════════════════════════════════════════════════════════','head');
    pushLog('   平均 Train 盈利：'+avgTrain.toFixed(0),'info');
    pushLog('   平均 Test  盈利：'+avgTest.toFixed(0)+'（±'+sd.toFixed(0)+'）','success');
    pushLog('   平均 Test  命中：'+avgHits.toFixed(1)+' 筆','info');
    pushLog('   Test 標準誤：'+se.toFixed(0),'dim');
    if(avgTrain>0){
      pushLog('   Train/Test 比值：'+(avgTrain/Math.max(1,Math.abs(avgTest))*100).toFixed(0)+'%','dim');
    }
    if(avgTest<0){
      pushLog('   ⚠ 平均 Test 盈利為負，規則可能無法泛化','err');
    } else if(sd>Math.abs(avgTest)){
      pushLog('   ⚠ Test 波動很大（SD > 平均），結果不穩定','warn');
    } else {
      pushLog('   ✓ Test 盈利穩定，泛化良好','ok');
    }
    pushLog('');

    /* 顯示 CV 結果表 */
    var cvHtml='<div class="cv-result">';
    cvHtml+='<b style="color:#007bff">📈 K-Fold 交叉驗證結果</b>';
    cvHtml+='<div style="margin-top:8px;font-size:11px;color:#666">每 fold 獨立優化，各自評估泛化能力</div>';
    for(var i=0;i<foldResults.length;i++){
      var fr=foldResults[i];
      cvHtml+='<div class="cv-row"><span>'+fr.label+'</span><span>Train '+fr.trainEval.profit+' | Test <b style="color:'+(fr.testEval.profit>0?'#0a7a0a':'#c00')+'">'+fr.testEval.profit+'</b></span></div>';
    }
    cvHtml+='<div class="cv-row"><span>平均 Test 盈利</span><span>'+avgTest.toFixed(0)+' ± '+sd.toFixed(0)+'</span></div>';
    cvHtml+='</div>';
    document.getElementById('cvResult').innerHTML=cvHtml;
    document.getElementById('cvResult').style.display='block';
  } else if(CFG.splitRatio<1){
    /* 單次分割的匯總 */
    var fr=foldResults[0];
    var cvHtml='<div class="cv-result">';
    cvHtml+='<b style="color:#007bff">📊 Train/Test 分割結果</b>';
    cvHtml+='<div class="cv-row"><span>Train（'+fr.trainEval.hits+' 命中 / 對 '+fr.trainEval.correct+' / 錯 '+fr.trainEval.wrong+'）</span><span><b>'+fr.trainEval.profit+'</b></span></div>';
    cvHtml+='<div class="cv-row"><span>Test（'+fr.testEval.hits+' 命中 / 對 '+fr.testEval.correct+' / 錯 '+fr.testEval.wrong+'）</span><span><b style="color:'+(fr.testEval.profit>0?'#0a7a0a':'#c00')+'">'+fr.testEval.profit+'</b></span></div>';
    var gap=fr.trainEval.profit-fr.testEval.profit;
    var gapPct=fr.trainEval.profit!==0?(gap/Math.abs(fr.trainEval.profit)*100).toFixed(0):'—';
    cvHtml+='<div class="cv-row"><span>衰減</span><span>'+(gap>=0?'-':'+')+Math.abs(gap)+'（'+gapPct+'%）</span></div>';
    cvHtml+='</div>';
    document.getElementById('cvResult').innerHTML=cvHtml;
    document.getElementById('cvResult').style.display='block';
  }

  /* 在全部資料上評估最終規則 */
  var fullEval=evalRules(data, finalRules);

  var formula=genFormula(finalRules);
  document.getElementById('best').style.display='block';

  var summaryHtml='🏆 最終規則在全部資料上：<b>盈利 '+fullEval.profit+'</b>（命中 '+fullEval.hits+' 筆，對 '+fullEval.correct+'，錯 '+fullEval.wrong+'）';
  if(CFG.minBets>0 && fullEval.hits<CFG.minBets){
    summaryHtml+='　<span style="color:#c00">⚠ 命中數未達約束 '+CFG.minBets+'</span>';
  }
  document.getElementById('summary').innerHTML=summaryHtml;
  document.getElementById('params').textContent=JSON.stringify(finalRules);
  document.getElementById('txtOut').value=formula;

  var stats=diagnose(data, finalRules);
  renderRuleTable(stats);
  document.getElementById('diag').style.display='block';

  running=false;
  document.getElementById('btnRun').disabled=false;
  document.getElementById('btnStop').disabled=true;
  document.getElementById('progbar').style.width='100%';
  updateStats(N, fullEval.profit);
}

function stop(){
  running=false;
  document.getElementById('btnStop').disabled=true;
  pushLog('⏹ 使用者手動停止','warn');
}

/* ==================== 複製工具 ==================== */
function copyIt(id){
  var el=document.getElementById(id);
  if(!el) return;
  var txt=el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      showMsg('✅ 已複製 '+txt.length+' 字元', true);
    }).catch(function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  var ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg('✅ 已複製 '+text.length+' 字元', true);
  else showMsg('❌ 複製失敗，請手動選取', false);
}
function showMsg(text, ok){
  var m=document.getElementById('msg');
  m.textContent=text;
  m.className=ok?'ok':'err';
  m.style.display='block';
  setTimeout(function(){ m.style.display='none'; }, 3000);
}
