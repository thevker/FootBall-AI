<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>xG 賽事分析器 (Poisson 預測版)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh; -webkit-overflow-scrolling: touch; }
.container { background: #1a1a1a; padding: 15px; border-radius: 12px; width: 100%; max-width: 500px; position: relative; margin-bottom: 20px; }
h2 { text-align: center; color: #fff; margin-top: 0; font-size: 20px; margin-bottom: 5px; }
p.subtitle { font-size: 12px; color: #aaa; text-align: center; margin-bottom: 4px; }
p.warning-hint { font-size: 11px; color: #ff6b6b; text-align: center; margin: 0 0 12px 0; font-weight: bold; }
p.data-hint { font-size: 11px; color: #3a7bd5; text-align: center; margin: 0 0 15px 0; font-weight: bold; }

#errorMessage { display: none; background-color: #331a1a; color: #ff4d4d; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 10px; border: 1px solid #7a3a3a; }

.mode-switch { display: flex; gap: 10px; margin-bottom: 15px; background: #222; padding: 5px; border-radius: 8px; }
.mode-btn { flex: 1; padding: 10px; background: transparent; color: #888; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
.mode-btn.active { background: #3a7bd5; color: white; }

.input-section { margin-bottom: 15px; }
.section-header { font-size: 14px; font-weight: bold; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #333; }
.section-header.home { color: #ff6b6b; }
.section-header.away { color: #6b9fff; }
.input-row { display: flex; gap: 10px; margin-bottom: 10px; }
.input-box { display: flex; flex-direction: column; flex: 1; min-width: 0; }
label { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #bbb; }
input[type="text"] { width: 100%; padding: 12px 8px; background-color: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 16px; outline: none; text-align: center; }
input[type="text"]:focus { border-color: #4da6ff; }

button.btn-calculate { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; background: #3a7bd5; color: white; }
button.btn-clear { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; background: #5a2a2a; color: #ff9999; margin-top: 8px; border: 1px solid #7a3a3a; }

#result { display: none; }
.result-card { background: #222; border: 1px solid #3a3a3a; border-radius: 16px; padding: 15px; margin-bottom: 15px; }
.btn-card { padding: 10px; display: flex; gap: 8px; background: #1a1a1a; }
.btn-action { flex: 1; color:#fff; padding:10px; font-size:13px; border-radius:12px; border:none; cursor:pointer; font-weight: bold; }
.btn-return { background:#444; }
.btn-save-pred { background:#3a7bd5; }
.btn-save-ana { background:#28a745; }

.section-label { font-size: 13px; font-weight: bold; color: #aaa; margin: 14px 0 10px; text-align: center; letter-spacing: 1px; }
.section-label:first-child { margin-top: 4px; }

/* ===== 比分卡片（test2 風格） ===== */
.scores-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.score-card { position: relative; background: linear-gradient(160deg, #173049, #101b2c); border: 1px solid #3a3a3a; border-radius: 14px; padding: 26px 10px 12px; text-align: center; }
.score-card.one { border-color: rgba(61,220,151,.55); box-shadow: 0 0 0 1px rgba(61,220,151,.15) inset, 0 8px 20px -14px #3ddc97; }
.score-card .tag-label { font-size: 11px; color: #888; margin-bottom: 4px; }
.score-card .big { font-size: 28px; font-weight: 800; color: #c0c0c0; margin: 4px 0; letter-spacing: 1px; }
.score-card.one .big { color: #4ade80; }
.score-card .pct { font-size: 12px; color: #888; }
.score-card .pct b { color: #fff; }
.score-card .badges { position: absolute; top: 6px; left: 6px; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.sc-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 800; line-height: 1.2; letter-spacing: 0.5px; }
.sc-badge.over { background: rgba(255,77,77,0.2); color: #ff6b6b; border: 1px solid rgba(255,77,77,0.3); }
.sc-badge.under { background: rgba(77,163,255,0.2); color: #7fc1ff; border: 1px solid rgba(77,163,255,0.3); }
.sc-badge.btts { background: rgba(61,220,151,0.2); color: #3ddc97; border: 1px solid rgba(61,220,151,0.3); }
.score-card .star { position: absolute; top: 5px; right: 8px; font-size: 18px; line-height: 1; }
.star.gold { color: #FFD700; text-shadow: 0 0 8px rgba(255,215,0,0.8); }
.star.silver { color: #c0c0c0; text-shadow: 0 0 6px rgba(192,192,192,0.6); }
.star.bronze { color: #cd7f32; text-shadow: 0 0 6px rgba(205,127,50,0.6); }

/* ===== 球隊入球 ===== */
.team-goals-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tg-card { background: #0e1626; border: 1px solid #333; border-radius: 10px; padding: 10px 6px; text-align: center; }
.tg-card.one { border-color: rgba(77,163,255,.55); background: #15233a; }
.tg-card .tag { font-size: 10px; color: #888; }
.tg-card .val { font-size: 20px; font-weight: 800; color: #4da3ff; margin: 4px 0; }
.tg-card.one .val { color: #4ade80; }
.tg-card .pct { font-size: 11px; color: #aaa; }

/* ===== 市場機率 ===== */
.market-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mk-card { background: #0e1626; border: 1px solid #333; border-radius: 10px; padding: 12px 6px; text-align: center; }
.mk-card .tag { font-size: 11px; color: #888; margin-bottom: 4px; }
.mk-card .val { font-size: 18px; font-weight: 800; }
.mk-card.over .val { color: #ff6b6b; }
.mk-card.under .val { color: #7fc1ff; }
.mk-card.btts .val { color: #4ade80; }

/* ===== λ 信息 ===== */
.lambda-info { display: flex; justify-content: center; gap: 20px; font-size: 12px; color: #888; padding: 8px 0; }
.lambda-info b { color: #fff; }

/* ===== 波膽網格 ===== */
.bet-box { text-align: center; padding: 12px; border-radius: 12px; border: 1px solid #3a3a3a; background-color: #181818; }
.bet-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.bet-cell { aspect-ratio: 1 / 1; display: flex; justify-content: center; align-items: center; background-color: #2a2a2a; color: #555; border: 1px solid #444; border-radius: 6px; font-size: 13px; font-weight: bold; }
.bet-cell.active { background-color: #1a3324; color: #4ade80; border-color: #4ade80; }
.bet-cell.yellow { background-color: #3b331c; color: #ffd700; border-color: #ffd700; }
.bet-cell.red { background-color: #3b1c1c; color: #f87171; border-color: #f87171; }

/* ===== 雷達圖 + 能力值 ===== */
.radar-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 15px; background: #181818; border-radius: 16px; border: 1px solid #333; }
.vertical-text { width: 30px; font-size: 14px; font-weight: bold; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; line-height: 1.2; }
.vertical-text.home { color: #ff6b6b; }
.vertical-text.away { color: #6b9fff; }
.radar-svg-box { flex: 1; display: flex; justify-content: space-around; align-items: center; }
svg { width: 140px; height: 140px; }
.team-rating-block { margin-bottom: 20px; }
.team-rating-block:last-child { margin-bottom: 0; }
.team-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; min-height: 24px; white-space: nowrap; }
.left-area { flex: 1; display: flex; align-items: center; gap: 6px; }
.right-area { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
.team-title { font-size: 15px; font-weight: bold; }
.badge { font-size: 11px; padding: 3px 6px; border-radius: 10px; font-weight: bold; white-space: nowrap; }
.overall-badge { font-size: 12px; padding: 4px 8px; border-radius: 8px; background-color: #333; border: 1px solid #555; white-space: nowrap; font-style: italic; font-weight: 900; }

@keyframes glow-green { 0% { box-shadow: 0 0 2px #4ade80; } 50% { box-shadow: 0 0 8px #4ade80; } 100% { box-shadow: 0 0 2px #4ade80; } }
@keyframes glow-cyan { 0% { box-shadow: 0 0 2px #0adeff; } 50% { box-shadow: 0 0 8px #0adeff; } 100% { box-shadow: 0 0 2px #0adeff; } }
.status-glow-green { color: #4ade80 !important; background-color: #1c3b24 !important; animation: glow-green 1.5s infinite alternate; }
.status-glow-cyan { color: #0adeff !important; background-color: #0e2e36 !important; animation: glow-cyan 1.5s infinite alternate; }
@keyframes glow-gold { 0% { box-shadow: 0 0 2px #FFD700; } 50% { box-shadow: 0 0 8px #FFD700; } 100% { box-shadow: 0 0 2px #FFD700; } }
@keyframes glow-silver { 0% { box-shadow: 0 0 2px #f4f4f4; } 50% { box-shadow: 0 0 8px #f4f4f4; } 100% { box-shadow: 0 0 2px #f4f4f4; } }
@keyframes glow-bronze { 0% { box-shadow: 0 0 2px #cd7f32; } 50% { box-shadow: 0 0 8px #cd7f32; } 100% { box-shadow: 0 0 2px #cd7f32; } }
.rank-glow-gold { color: #FFD700 !important; background-color: #3b331c !important; animation: glow-gold 1.5s infinite alternate; }
.rank-glow-silver { color: #f4f4f4 !important; background-color: #666 !important; animation: glow-silver 1.5s infinite alternate; }
.rank-glow-bronze { color: #cd7f32 !important; background-color: #3b1c1c !important; animation: glow-bronze 1.5s infinite alternate; }

.rating-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 12px; }
.rating-label { width: 45px; font-weight: bold; color: #aaa; text-align: right; padding-right: 6px; white-space: nowrap; }
.rating-display { width: 70px; text-align: left; font-weight: bold; font-size: 12px; padding-left: 8px; white-space: nowrap; }
.rating-bar-bg { flex: 1; background: #181818; height: 20px; border-radius: 6px; overflow: hidden; border: 1px solid #333; }
.rating-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
.bar-attack { background: #ff6b6b; }
.bar-defense { background: #6b9fff; }
.bar-status { background: #fbc02d; }
.bar-odds { background: #4caf50; }
.bar-conv { background: #00e5ff; }
.bar-rank { background: #888; }

/* ===== 圖片預覽 ===== */
#imageModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
#imageModal img { max-width: 100%; max-height: 80vh; border-radius: 12px; }
.modal-hint { color: #fff; font-size: 14px; font-weight: bold; margin-top: 15px; text-align: center; }
.modal-close { margin-top: 15px; padding: 10px 20px; background: #3a7bd5; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

.std-only { display: flex; }
</style>
</head>
<body>
<div class="container">
<h2>📊 xG 賽事分析器</h2>
<p class="subtitle">Poisson 預測終極版</p>
<p class="warning-hint">⚠️ 工具只作娛樂分析 切勿沉迷賭博</p>
<p class="data-hint">📥 數據請使用 FootyStats 匯入</p>

<div id="errorMessage">⚠️ 數據不完整，請填寫所有輸入欄位！</div>

<div class="mode-switch">
<button id="btnStd" class="mode-btn active" onclick="switchMode('standard')">標準模式</button>
<button id="btnMin" class="mode-btn" onclick="switchMode('minimal')">極簡模式</button>
</div>

<div id="inputSection">
  <div class="input-section">
    <div class="section-header home">🏠 主隊數據</div>
    <div class="input-row std-only"><div class="input-box"><label>狀態 (0-3)</label><input type="text" inputmode="decimal" id="homeStatus" placeholder="例：1.50" oninput="limitInput(this)" onblur="formatInput(this)"></div><div class="input-box"></div></div>
    <div class="input-row"><div class="input-box"><label>得分</label><input type="text" inputmode="decimal" id="homeGoals" placeholder="例：1.50" oninput="limitInput(this)" onblur="formatInput(this)"></div><div class="input-box"><label>失球</label><input type="text" inputmode="decimal" id="homeConceded" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div></div>
    <div class="input-row std-only"><div class="input-box"><label>主隊 xG</label><input type="text" inputmode="decimal" id="homeXg" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div><div class="input-box"><label>主隊 xGA</label><input type="text" inputmode="decimal" id="homeXga" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div></div>
    <div class="input-row std-only"><div class="input-box"><label>排名 (選填)</label><input type="text" inputmode="numeric" id="homeRank" placeholder="例：1" oninput="limitInteger(this)"></div><div class="input-box"><label>賠率</label><input type="text" inputmode="decimal" id="homeOdds" placeholder="例：1.67" oninput="limitInput(this)" onblur="formatInput(this)"></div></div>
  </div>
  <div class="input-section">
    <div class="section-header away">✈️ 客隊數據</div>
    <div class="input-row std-only"><div class="input-box"><label>狀態 (0-3)</label><input type="text" inputmode="decimal" id="awayStatus" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div><div class="input-box"></div></div>
    <div class="input-row"><div class="input-box"><label>得分</label><input type="text" inputmode="decimal" id="awayGoals" placeholder="例：0.50" oninput="limitInput(this)" onblur="formatInput(this)"></div><div class="input-box"><label>失球</label><input type="text" inputmode="decimal" id="awayConceded" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div></div>
    <div class="input-row std-only"><div class="input-box"><label>客隊 xG</label><input type="text" inputmode="decimal" id="awayXg" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div><div class="input-box"><label>客隊 xGA</label><input type="text" inputmode="decimal" id="awayXga" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div></div>
    <div class="input-row std-only"><div class="input-box"><label>排名 (選填)</label><input type="text" inputmode="numeric" id="awayRank" placeholder="例：2" oninput="limitInteger(this)"></div><div class="input-box"><label>賠率</label><input type="text" inputmode="decimal" id="awayOdds" placeholder="例：1.27" oninput="limitInput(this)" onblur="formatInput(this)"></div></div>
  </div>
  <button class="btn-calculate" onclick="calculate()">開始分析</button>
  <button class="btn-clear" onclick="clearData()">清除數據</button>
</div>

<div id="result">
  <div class="btn-card">
    <button class="btn-action btn-return" onclick="showInput()">⬅️ 返回</button>
    <button class="btn-action btn-save-pred" id="btnSavePred" onclick="savePrediction()">📸 保存預測</button>
    <button class="btn-action btn-save-ana" id="btnSaveAna" onclick="saveAnalysis()">📸 保存分析</button>
  </div>

  <div class="result-card" id="predictionCard">
    <div class="section-label">🎯 預測比分分佈</div>
    <div class="scores-grid" id="scoresGrid"></div>

    <div class="section-label">⚽ 球隊入球數預測</div>
    <div class="team-goals-row" id="teamGoalsRow"></div>

    <div class="section-label">📈 市場機率</div>
    <div class="market-row" id="marketRow"></div>

    <div class="lambda-info" id="lambdaInfo"></div>

    <div class="section-label">🎲 波膽概率分佈</div>
    <div class="bet-box"><div class="bet-grid" id="betGrid"></div></div>
  </div>

  <div class="result-card" id="analysisCard">
    <div class="radar-container">
      <div class="vertical-text home">主<br>隊</div>
      <div class="radar-svg-box"><svg id="radar-home" viewBox="0 0 200 200"></svg><svg id="radar-away" viewBox="0 0 200 200"></svg></div>
      <div class="vertical-text away">客<br>隊</div>
    </div>

    <div class="team-rating-block">
      <div class="team-header"><div class="left-area"><span class="team-title" style="color:#ff6b6b;">🏠 主隊</span><span class="overall-badge" id="hOverall">-</span></div><div class="right-area"><span class="badge" id="hStyle">-</span><span class="badge" id="hStatusBadge">-</span><span class="badge" id="hOddsBadge" style="display:none;">-</span><span class="badge" id="hRankBadge" style="display:none;">-</span></div></div>
      <div class="rating-row"><div class="rating-label">進攻</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-attack" id="hAttBar"></div></div><div class="rating-display" id="hAttDisplay">-</div></div>
      <div class="rating-row"><div class="rating-label">防守</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-defense" id="hDefBar"></div></div><div class="rating-display" id="hDefDisplay">-</div></div>
      <div class="rating-row"><div class="rating-label">狀態</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-status" id="hStatBar"></div></div><div class="rating-display" id="hStatDisplay">-</div></div>
      <div class="rating-row"><div class="rating-label">賠率</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-odds" id="hOddsBar"></div></div><div class="rating-display" id="hOddsDisplay">-</div></div>
      <div class="rating-row"><div class="rating-label">轉換</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-conv" id="hConvBar"></div></div><div class="rating-display" id="hConvDisplay">-</div></div>
      <div class="rating-row" id="hRankRow" style="display:none;"><div class="rating-label">排名</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-rank" id="hRankBar"></div></div><div class="rating-display" id="hRankDisplay">-</div></div>
    </div>

    <div class="team-rating-block">
      <div class="team-header"><div class="left-area"><span class="team-title" style="color:#6b9fff;">✈️ 客隊</span><span class="overall-badge" id="aOverall">-</span></div><div class="right-area"><span class="badge" id="aStyle">-</span><span class="badge" id="aStatusBadge">-</span><span class="badge" id="aOddsBadge" style="display:none;">-</span><span class="badge" id="aRankBadge" style="display:none;">-</span></div></div>
      <div class="rating-row"><div class="rating-label">進攻</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-attack" id="aAttBar"></div></div><div class="rating-display" id="aAttDisplay">-</div></div>
      <div class="rating-row"><div class="rating-label">防守</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-defense" id="aDefBar"></div></div><div class="rating-display" id="aDefDisplay">-</div></div>
      <div class="rating-row"><div class="rating-label">狀態</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-status" id="aStatBar"></div></div><div class="rating-display" id="aStatDisplay">-</div></div>
      <div class="rating-row"><div class="rating-label">賠率</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-odds" id="aOddsBar"></div></div><div class="rating-display" id="aOddsDisplay">-</div></div>
      <div class="rating-row"><div class="rating-label">轉換</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-conv" id="aConvBar"></div></div><div class="rating-display" id="aConvDisplay">-</div></div>
      <div class="rating-row" id="aRankRow" style="display:none;"><div class="rating-label">排名</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-rank" id="aRankBar"></div></div><div class="rating-display" id="aRankDisplay">-</div></div>
    </div>
  </div>
</div>
</div>

<div id="imageModal"><img id="previewImg" src="" alt="分析結果"><div class="modal-hint">👇 請「長按」上方圖片，選擇「儲存到相片」</div><button class="modal-close" onclick="closeModal()">關閉</button></div>

<script>
/* ============ 共用工具 ============ */
let currentMode = 'standard';

function switchMode(mode) {
    currentMode = mode;
    if (mode === 'standard') {
        document.getElementById('btnStd').classList.add('active');
        document.getElementById('btnMin').classList.remove('active');
        document.querySelectorAll('.std-only').forEach(el => el.style.display = 'flex');
    } else {
        document.getElementById('btnStd').classList.remove('active');
        document.getElementById('btnMin').classList.add('active');
        document.querySelectorAll('.std-only').forEach(el => el.style.display = 'none');
        ['homeStatus','homeXg','homeXga','homeRank','homeOdds','awayStatus','awayXg','awayXga','awayRank','awayOdds'].forEach(id => { document.getElementById(id).value = ''; });
    }
}

function initBetGrid() {
    const grid = document.getElementById('betGrid');
    if (grid.children.length === 0) {
        for (let h = 0; h <= 4; h++) {
            for (let a = 0; a <= 4; a++) {
                const cell = document.createElement('div');
                cell.className = 'bet-cell';
                cell.id = `cell-${h}-${a}`;
                cell.innerText = `${h}:${a}`;
                grid.appendChild(cell);
            }
        }
    }
}
window.addEventListener('load', () => { initBetGrid(); });

function closeModal() { document.getElementById('imageModal').style.display = 'none'; }

function captureElement(targetId, btnElement) {
    const target = document.getElementById(targetId);
    const originalText = btnElement.innerHTML;
    btnElement.innerHTML = '⏳ 生成中...';
    btnElement.disabled = true;
    setTimeout(() => {

            btnElement.disabled = false;
        });
    }, 100);
}

function limitInput(input) {
    let val = input.value.replace(/[^0-9.]/g, '');
    let parts = val.split('.');
    if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
    if (val.replace(/\./g, '').length > 4) {
        let newVal = '', count = 0;
        for (let char of val) {
            if (char !== '.') { if (count >= 4) break; count++; }
            newVal += char;
        }
        val = newVal;
    }
    input.value = val;
}
function formatInput(input) {
    let val = input.value;
    if (!val || val === '.') { input.value = ''; return; }
    if (!val.includes('.')) {
        if (val.length === 3) val = val.substring(0, 1) + '.' + val.substring(1);
        else if (val.length === 2) { let num = parseInt(val); val = num > 30 ? '0.' + val : val.substring(0, 1) + '.' + val.substring(1) + '0'; }
        else if (val.length === 1) val = val + '.00';
    } else {
        let parts = val.split('.');
        val = (parts[0] || '0') + '.' + (parts[1] || '').padEnd(2, '0').substring(0, 2);
    }
    let num = parseFloat(val);
    input.value = isNaN(num) ? '0.00' : num.toFixed(2);
}
function limitInteger(input) {
    let val = input.value.replace(/[^0-9]/g, '');
    if (val.length > 2) val = val.substring(0, 2);
    input.value = val;
}

/* ============ 評級 / 雷達 / 能力值 ============ */
function getGradeByPercent(pct) {
    if (pct < 20) return { grade: 'E', color: '#c0c0c0' };
    if (pct < 40) return { grade: 'D', color: '#cd7f32' };
    if (pct < 60) return { grade: 'C', color: '#ff4d4d' };
    if (pct < 75) return { grade: 'B', color: '#4ade80' };
    if (pct < 85) return { grade: 'A', color: '#4da6ff' };
    if (pct < 95) return { grade: 'S', color: '#FFD700' };
    return { grade: 'X', color: '#9b59b6' };
}

function drawRadar(svgId, data, labels, color, fillColor) {
    const svg = document.getElementById(svgId);
    svg.innerHTML = '';
    const cx = 100, cy = 100, maxR = 65, numAxes = data.length;
    const angleStep = (Math.PI * 2) / numAxes;
    const startAngle = -Math.PI / 2;

    for (let l = 1; l <= 4; l++) {
        const r = (maxR / 4) * l;
        let points = [];
        for (let i = 0; i < numAxes; i++) {
            const angle = startAngle + i * angleStep;
            points.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
        }
        const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        polygon.setAttribute('points', points.join(' '));
        polygon.setAttribute('fill', 'none');
        polygon.setAttribute('stroke', '#444');
        polygon.setAttribute('stroke-width', '1');
        svg.appendChild(polygon);
    }

    for (let i = 0; i < numAxes; i++) {
        const angle = startAngle + i * angleStep;
        const x = cx + maxR * Math.cos(angle), y = cy + maxR * Math.sin(angle);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', cx); line.setAttribute('y1', cy);
        line.setAttribute('x2', x); line.setAttribute('y2', y);
        line.setAttribute('stroke', '#444'); line.setAttribute('stroke-width', '1');
        svg.appendChild(line);
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', cx + (maxR + 15) * Math.cos(angle));
        text.setAttribute('y', cy + (maxR + 15) * Math.sin(angle));
        text.setAttribute('fill', '#aaa');
        text.setAttribute('font-size', '9');
        text.setAttribute('font-weight', 'bold');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'middle');
        text.textContent = labels[i];
        svg.appendChild(text);
    }

    let dataPoints = [];
    for (let i = 0; i < numAxes; i++) {
        let pct = Math.min(Math.max(data[i], 5), 100) / 100;
        const r = maxR * pct, angle = startAngle + i * angleStep;
        dataPoints.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
    }
    const dataPolygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    dataPolygon.setAttribute('points', dataPoints.join(' '));
    dataPolygon.setAttribute('fill', fillColor);
    dataPolygon.setAttribute('stroke', color);
    dataPolygon.setAttribute('stroke-width', '2');
    svg.appendChild(dataPolygon);
}

/* 能力值：以模型 λ 換算
   lAtt = 該隊的 λ（進攻強度）
   lOpp = 對手的 λ（防守指標，越低越好）
*/
function updateTeamUI(prefix, lAtt, lOpp, status, convPct, rankPct, oddsPct, hasRank) {
    let attPct = Math.min(Math.max(((lAtt - 0.5) / 2.0) * 100, 0), 100);
    let defPct = Math.min(Math.max(((2.5 - lOpp) / 2.0) * 100, 0), 100);
    let statPct = Math.min(Math.max((status / 3.0) * 100, 0), 100);

    document.getElementById(prefix + 'AttBar').style.width = Math.max(attPct, 1) + '%';
    document.getElementById(prefix + 'DefBar').style.width = Math.max(defPct, 1) + '%';
    document.getElementById(prefix + 'StatBar').style.width = Math.max(statPct, 1) + '%';
    document.getElementById(prefix + 'OddsBar').style.width = Math.max(oddsPct, 1) + '%';
    document.getElementById(prefix + 'ConvBar').style.width = Math.max(convPct, 1) + '%';

    const attData = getGradeByPercent(attPct), defData = getGradeByPercent(defPct);
    const statData = getGradeByPercent(statPct), oddsData = getGradeByPercent(oddsPct), convData = getGradeByPercent(convPct);

    document.getElementById(prefix + 'AttDisplay').innerText = `${attData.grade} (${attPct.toFixed(1)})`;
    document.getElementById(prefix + 'AttDisplay').style.color = attData.color;
    document.getElementById(prefix + 'DefDisplay').innerText = `${defData.grade} (${defPct.toFixed(1)})`;
    document.getElementById(prefix + 'DefDisplay').style.color = defData.color;
    document.getElementById(prefix + 'StatDisplay').innerText = `${statData.grade} (${statPct.toFixed(1)})`;
    document.getElementById(prefix + 'StatDisplay').style.color = statData.color;
    document.getElementById(prefix + 'OddsDisplay').innerText = `${oddsData.grade} (${oddsPct.toFixed(1)})`;
    document.getElementById(prefix + 'OddsDisplay').style.color = oddsData.color;
    document.getElementById(prefix + 'ConvDisplay').innerText = `${convData.grade} (${convPct.toFixed(1)})`;
    document.getElementById(prefix + 'ConvDisplay').style.color = convData.color;

    let radarData = [], labels = [], overallPct = 0;
    if (hasRank) {
        document.getElementById(prefix + 'RankRow').style.display = 'flex';
        document.getElementById(prefix + 'RankBar').style.width = Math.max(rankPct, 1) + '%';
        const rankData = getGradeByPercent(rankPct);
        document.getElementById(prefix + 'RankDisplay').innerText = `${rankData.grade} (${rankPct.toFixed(1)})`;
        document.getElementById(prefix + 'RankDisplay').style.color = rankData.color;
        radarData = [attPct, defPct, statPct, oddsPct, convPct, rankPct];
        labels = ['ATK', 'DEF', 'STA', 'ODD', 'COV', 'RNK'];
        overallPct = (attPct + defPct + statPct + oddsPct + convPct + rankPct) / 6;
    } else {
        document.getElementById(prefix + 'RankRow').style.display = 'none';
        radarData = [attPct, defPct, statPct, oddsPct, convPct];
        labels = ['ATK', 'DEF', 'STA', 'ODD', 'COV'];
        overallPct = (attPct + defPct + statPct + oddsPct + convPct) / 5;
    }

    const overallData = getGradeByPercent(overallPct);
    const overallEl = document.getElementById(prefix + 'Overall');
    if (overallEl) {
        overallEl.innerText = `戰力: ${overallData.grade} (${overallPct.toFixed(1)})`;
        overallEl.style.color = overallData.color;
        overallEl.style.borderColor = overallData.color;
    }

    drawRadar(prefix === 'h' ? 'radar-home' : 'radar-away', radarData, labels,
              prefix === 'h' ? '#ff6b6b' : '#6b9fff',
              prefix === 'h' ? 'rgba(255,107,107,0.3)' : 'rgba(107,159,255,0.3)');

    const styleEl = document.getElementById(prefix + 'Style');
    const pctDiff = Math.round((attPct - defPct) * 10) / 10;
    if (pctDiff >= 25.0) { styleEl.innerText = "進攻型"; styleEl.style.color = "#ff8c8c"; styleEl.style.backgroundColor = "#3b1c1c"; }
    else if (pctDiff <= -25.0) { styleEl.innerText = "防守型"; styleEl.style.color = "#8cb8ff"; styleEl.style.backgroundColor = "#1a2633"; }
    else { styleEl.innerText = "平衡型"; styleEl.style.color = "#ccc"; styleEl.style.backgroundColor = "#333"; }

    const statusBadge = document.getElementById(prefix + 'StatusBadge');
    statusBadge.className = 'badge'; statusBadge.style.color = ''; statusBadge.style.backgroundColor = '';
    if (status <= 0.5) { statusBadge.innerText = "狀態極差"; statusBadge.style.color = "#ff3333"; statusBadge.style.backgroundColor = "#550000"; }
    else if (status <= 1.0) { statusBadge.innerText = "狀態欠佳"; statusBadge.style.color = "#ff6b6b"; statusBadge.style.backgroundColor = "#3b1c1c"; }
    else if (status <= 1.5) { statusBadge.innerText = "狀態一般"; statusBadge.style.color = "#ffd700"; statusBadge.style.backgroundColor = "#3b331c"; }
    else if (status <= 2.0) { statusBadge.innerText = "狀態微優"; statusBadge.style.color = "#a3e635"; statusBadge.style.backgroundColor = "#263b1c"; }
    else if (status <= 2.5) { statusBadge.innerText = "狀態良好"; statusBadge.classList.add('status-glow-green'); }
    else { statusBadge.innerText = "狀態極好"; statusBadge.classList.add('status-glow-cyan'); }

    return overallPct;
}

/* ============ Poisson 核心 ============ */
const fact = n => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
const poisson = (k, l) => Math.exp(-l) * Math.pow(l, k) / fact(k);
const pctFmt = p => (p * 100).toFixed(1) + '%';

/* ============ 主流程 ============ */
function calculate() {
    const isStd = currentMode === 'standard';

    /* --- 1. 驗證必填 --- */
    const hGoalsStr = document.getElementById('homeGoals').value;
    const hConcededStr = document.getElementById('homeConceded').value;
    const aGoalsStr = document.getElementById('awayGoals').value;
    const aConcededStr = document.getElementById('awayConceded').value;

    if (!hGoalsStr || !hConcededStr || !aGoalsStr || !aConcededStr) {
        document.getElementById('errorMessage').style.display = 'block';
        document.getElementById('errorMessage').innerText = '⚠️ 請填寫主客隊的得分與失球！';
        return;
    }

    if (isStd) {
        const req = ['homeXg','homeXga','homeStatus','homeOdds','awayXg','awayXga','awayStatus','awayOdds'];
        for (const id of req) {
            if (!document.getElementById(id).value) {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').innerText = '⚠️ 數據不完整，請填寫所有輸入欄位！';
                return;
            }
        }
    }
    document.getElementById('errorMessage').style.display = 'none';

    /* --- 2. 解析 --- */
    const hGoals = parseFloat(hGoalsStr) || 0;
    const hConceded = parseFloat(hConcededStr) || 0;
    const aGoals = parseFloat(aGoalsStr) || 0;
    const aConceded = parseFloat(aConcededStr) || 0;

    /* --- 3. 基礎 λ（test2 公式） --- */
    let baseLH = Math.min(Math.max((hGoals + aConceded) / 2, 0.05), 6);
    let baseLA = Math.min(Math.max((aGoals + hConceded) / 2, 0.05), 6);

    let lH = baseLH, lA = baseLA;
    let oddsApplied = false;

    if (isStd) {
        const hO = parseFloat(document.getElementById('homeOdds').value);
        const aO = parseFloat(document.getElementById('awayOdds').value);
        if (isFinite(hO) && isFinite(aO) && hO > 1 && aO > 1) {
            const ratioH = Math.sqrt(aO / hO);
            const ratioA = Math.sqrt(hO / aO);
            lH = Math.min(Math.max(baseLH * ratioH, 0.05), 6);
            lA = Math.min(Math.max(baseLA * ratioA, 0.05), 6);
            oddsApplied = true;
        }
    }

    /* --- 4. Poisson 矩陣 --- */
    const MAXG = 10;
    const m = [];
    let finalTotal = 0;
    for (let i = 0; i <= MAXG; i++) {
        m[i] = [];
        for (let j = 0; j <= MAXG; j++) {
            const p = poisson(i, lH) * poisson(j, lA);
            m[i][j] = p;
            finalTotal += p;
        }
    }

    let homeWin = 0, draw = 0, awayWin = 0, over25 = 0, btts = 0;
    let final_lH = 0, final_lA = 0;
    const list = [];
    const hGoalProbs = Array(MAXG + 1).fill(0);
    const aGoalProbs = Array(MAXG + 1).fill(0);

    for (let i = 0; i <= MAXG; i++) {
        for (let j = 0; j <= MAXG; j++) {
            m[i][j] /= finalTotal;
            const p = m[i][j];

            if (i > j) homeWin += p;
            else if (i === j) draw += p;
            else awayWin += p;

            if (i + j >= 3) over25 += p;
            if (i > 0 && j > 0) btts += p;

            final_lH += i * p;
            final_lA += j * p;
            hGoalProbs[i] += p;
            aGoalProbs[j] += p;

            list.push({ h: i, a: j, p });
        }
    }

    /* --- 5. 排序（test2 規則） --- */
    const isHomeFav = lH >= lA;
    list.sort((x, y) => {
        if (Math.abs(x.p - y.p) > 1e-6) return y.p - x.p;
        if (isHomeFav) {
            if (x.h > x.a && y.h <= y.a) return -1;
            if (y.h > y.a && x.h <= x.a) return 1;
        } else {
            if (x.a > x.h && y.a <= y.h) return -1;
            if (y.a > y.h && x.a <= x.h) return 1;
        }
        return 0;
    });

    const topScores = list.slice(0, 4);

    /* --- 6. 標籤門檻 --- */
    const big25 = over25 >= 0.70;
    const small25 = (1 - over25) >= 0.70;
    const bttsHot = btts >= 0.70;

    /* --- 7. 比分卡片 --- */
    const scoreLabels = ['首選比分', '次選比分', '三選比分', '四選比分'];
    document.getElementById('scoresGrid').innerHTML = topScores.map((s, idx) => {
        let tags = '';
        if (big25 && (s.h + s.a) >= 3) tags += '<span class="sc-badge over">入球大</span>';
        if (small25 && (s.h + s.a) <= 2) tags += '<span class="sc-badge under">入球小</span>';
        if (bttsHot && s.h > 0 && s.a > 0) tags += '<span class="sc-badge btts">BTTS</span>';

        let starClass = '';
        if (s.p >= 0.20) starClass = 'gold';
        else if (s.p >= 0.15) starClass = 'silver';
        else if (s.p >= 0.10) starClass = 'bronze';

        return `
        <div class="score-card ${idx === 0 ? 'one' : ''}">
            ${tags ? `<div class="badges">${tags}</div>` : ''}
            ${starClass ? `<div class="star ${starClass}">★</div>` : ''}
            <div class="tag-label">${scoreLabels[idx]}</div>
            <div class="big">${s.h} - ${s.a}</div>
            <div class="pct">機率 <b>${pctFmt(s.p)}</b></div>
        </div>`;
    }).join('');

    /* --- 8. 球隊入球數 --- */
    const getTop2 = arr => arr.map((p, val) => ({ val, p })).sort((a, b) => b.p - a.p).slice(0, 2);
    const top2H = getTop2(hGoalProbs);
    const top2A = getTop2(aGoalProbs);

    document.getElementById('teamGoalsRow').innerHTML = `
        <div class="tg-card one">
            <div class="tag">主首選</div>
            <div class="val">${top2H[0].val}</div>
            <div class="pct">${pctFmt(top2H[0].p)}</div>
        </div>
        <div class="tg-card">
            <div class="tag">主次選</div>
            <div class="val">${top2H[1].val}</div>
            <div class="pct">${pctFmt(top2H[1].p)}</div>
        </div>
        <div class="tg-card one">
            <div class="tag">客首選</div>
            <div class="val">${top2A[0].val}</div>
            <div class="pct">${pctFmt(top2A[0].p)}</div>
        </div>
        <div class="tg-card">
            <div class="tag">客次選</div>
            <div class="val">${top2A[1].val}</div>
            <div class="pct">${pctFmt(top2A[1].p)}</div>
        </div>`;

    /* --- 9. 市場機率 --- */
    document.getElementById('marketRow').innerHTML = `
        <div class="mk-card over"><div class="tag">大 2.5</div><div class="val">${pctFmt(over25)}</div></div>
        <div class="mk-card under"><div class="tag">小 2.5</div><div class="val">${pctFmt(1 - over25)}</div></div>
        <div class="mk-card btts"><div class="tag">BTTS</div><div class="val">${pctFmt(btts)}</div></div>`;

    /* --- 10. λ 資訊 --- */
    document.getElementById('lambdaInfo').innerHTML = `
        <div>主隊 λ <b>${final_lH.toFixed(2)}</b></div>
        <div>客隊 λ <b>${final_lA.toFixed(2)}</b></div>
        <div>模式 <b>${oddsApplied ? '賠率放大' : '純數據'}</b></div>`;

    /* --- 11. 波膽網格（相對熱度） --- */
    let maxProb = 0;
    for (let h = 0; h <= 4; h++) for (let a = 0; a <= 4; a++) if (m[h][a] > maxProb) maxProb = m[h][a];
    for (let h = 0; h <= 4; h++) {
        for (let a = 0; a <= 4; a++) {
            const cell = document.getElementById(`cell-${h}-${a}`);
            cell.className = 'bet-cell';
            const ratio = maxProb > 0 ? m[h][a] / maxProb : 0;
            if (ratio >= 0.75) cell.classList.add('active');
            else if (ratio >= 0.40) cell.classList.add('yellow');
            else cell.classList.add('red');
        }
    }

    /* --- 12. 分析卡（能力值）--- */
    if (isStd) {
        const hStatus = parseFloat(document.getElementById('homeStatus').value) || 0;
        const aStatus = parseFloat(document.getElementById('awayStatus').value) || 0;
        const hRankStr = document.getElementById('homeRank').value.trim();
        const aRankStr = document.getElementById('awayRank').value.trim();
        const hasRank = hRankStr !== '' && aRankStr !== '';
        const hRank = hasRank ? parseInt(hRankStr) : 0;
        const aRank = hasRank ? parseInt(aRankStr) : 0;

        let hRankPct = 50, aRankPct = 50;
        if (hasRank) {
            const totalRank = hRank + aRank;
            hRankPct = totalRank > 0 ? (aRank / totalRank) * 100 : 50;
            aRankPct = totalRank > 0 ? (hRank / totalRank) * 100 : 50;
        }

        const hO = parseFloat(document.getElementById('homeOdds').value) || 0;
        const aO = parseFloat(document.getElementById('awayOdds').value) || 0;
        const totalOdds = hO + aO;
        const hOddsPct = totalOdds > 0 ? (aO / totalOdds) * 100 : 50;
        const aOddsPct = totalOdds > 0 ? (hO / totalOdds) * 100 : 50;

        const hConv = hGoals + aConceded;
        const aConv = aGoals + hConceded;
        const convTotal = hConv + aConv;
        const hConvPct = convTotal > 0 ? (hConv / convTotal) * 100 : 50;
        const aConvPct = convTotal > 0 ? (aConv / convTotal) * 100 : 50;

        /* 賠率徽章 */
        const hOddsBadge = document.getElementById('hOddsBadge');
        const aOddsBadge = document.getElementById('aOddsBadge');
        hOddsBadge.style.display = 'inline-block';
        aOddsBadge.style.display = 'inline-block';
        if (hO < aO) {
            hOddsBadge.innerText = "上盤"; hOddsBadge.style.color = "#bbf7d0"; hOddsBadge.style.backgroundColor = "#15803d";
            aOddsBadge.innerText = "下盤"; aOddsBadge.style.color = "#ccc"; aOddsBadge.style.backgroundColor = "#333";
        } else if (hO > aO) {
            hOddsBadge.innerText = "下盤"; hOddsBadge.style.color = "#ccc"; hOddsBadge.style.backgroundColor = "#333";
            aOddsBadge.innerText = "上盤"; aOddsBadge.style.color = "#bbf7d0"; aOddsBadge.style.backgroundColor = "#15803d";
        } else {
            hOddsBadge.style.display = 'none'; aOddsBadge.style.display = 'none';
        }

        /* 排名徽章 */
        const hRankBadge = document.getElementById('hRankBadge');
        const aRankBadge = document.getElementById('aRankBadge');
        if (hasRank) {
            hRankBadge.style.display = 'inline-block'; hRankBadge.innerText = `第${hRank}名`; hRankBadge.className = 'badge';
            if (hRank === 1) hRankBadge.classList.add('rank-glow-gold');
            else if (hRank === 2) hRankBadge.classList.add('rank-glow-silver');
            else if (hRank === 3) hRankBadge.classList.add('rank-glow-bronze');
            else { hRankBadge.style.color = '#ccc'; hRankBadge.style.backgroundColor = '#333'; }

            aRankBadge.style.display = 'inline-block'; aRankBadge.innerText = `第${aRank}名`; aRankBadge.className = 'badge';
            if (aRank === 1) aRankBadge.classList.add('rank-glow-gold');
            else if (aRank === 2) aRankBadge.classList.add('rank-glow-silver');
            else if (aRank === 3) aRankBadge.classList.add('rank-glow-bronze');
            else { aRankBadge.style.color = '#ccc'; aRankBadge.style.backgroundColor = '#333'; }
        } else {
            hRankBadge.style.display = 'none'; aRankBadge.style.display = 'none';
        }

        /* 能力值：傳入 λ */
        updateTeamUI('h', lH, lA, hStatus, hConvPct, hRankPct, hOddsPct, hasRank);
        updateTeamUI('a', lA, lH, aStatus, aConvPct, aRankPct, aOddsPct, hasRank);

        document.getElementById('analysisCard').style.display = 'block';
        document.getElementById('btnSaveAna').style.display = 'block';
    } else {
        document.getElementById('analysisCard').style.display = 'none';
        document.getElementById('btnSaveAna').style.display = 'none';
    }

    /* --- 13. 切換視圖 --- */
    document.getElementById('inputSection').style.display = 'none';
    document.getElementById('result').style.display = 'block';
}
</script>
</body>
