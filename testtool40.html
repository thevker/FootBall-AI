<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 v42.1 — 勝率 × 賠率 價值套利器 (修正版)</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;padding:16px;max-width:1400px;margin:auto;background:#f0f2f5;color:#333}
h2{margin:0 0 8px 0}
textarea{width:100%;font-family:monospace;font-size:12px;padding:8px;border:1px solid #ccc;border-radius:4px}
#input{height:100px}
button{padding:10px 22px;font-size:15px;margin:6px 4px 6px 0;cursor:pointer;background:#007bff;color:#fff;border:none;border-radius:5px;font-weight:bold}
button:hover{background:#0056b3}
button:disabled{background:#999}
#log{background:#0c0c0c;color:#d4d4d4;border-radius:6px;padding:14px;margin-top:12px;height:200px;overflow-y:auto;font-family:Consolas,monospace;font-size:12px;white-space:pre;line-height:1.5;border:1px solid #222}
.l-head{color:#fff;font-weight:bold}
.l-ok{color:#4ade80;font-weight:bold}.l-warn{color:#ffc107}.l-err{color:#f87171}
.l-info{color:#4ea3ff}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
select,input[type=number]{padding:6px;border-radius:4px;border:1px solid #ccc;font-size:14px}
.chk{padding:4px 10px;font-size:12px;background:#fff;border:1px solid #ccc;border-radius:4px;cursor:pointer;user-select:none}
.best{background:#d4edda;padding:16px;border-radius:6px;margin-top:12px;border:1px solid #c3e6cb;display:none}
.verdict{padding:16px;border-radius:8px;text-align:center;margin:10px 0;font-size:18px;font-weight:bold}
.big{font-size:40px;font-weight:bold;text-align:center;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
.cell{background:#fff;padding:12px;border-radius:6px;text-align:center;border:1px solid #ddd}
.cell .n{font-size:22px;font-weight:bold;color:#0a7a0a}
.cell .l{font-size:11px;color:#666;margin-top:4px}
.cell.warn .n{color:#c00}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:10px;background:#fff}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#e9ecef;font-weight:bold}
td.left{text-align:left}
.pos{color:#0a7a0a;font-weight:bold}.neg{color:#c00;font-weight:bold}
.section{background:#fff;padding:12px;border-radius:6px;margin-top:12px;border:1px solid #ddd}
h3{margin-top:0;margin-bottom:6px;font-size:15px}
.notice{background:#dcfce7;border:1px solid #22c55e;padding:12px 16px;border-radius:6px;font-size:13px;color:#14532d;line-height:1.7;margin-bottom:12px}
.notice b{color:#166534}
.chart-container{height:150px;display:flex;align-items:flex-end;gap:2px;margin-top:10px;padding:10px;background:#f8f9fa;border-radius:4px}
.chart-bar{flex:1;background:#3b82f6;min-height:1px;transition:height 0.3s;border-radius:2px 2px 0 0}
.chart-bar.pos{background:#22c55e}
.chart-bar.neg{background:#ef4444}
</style>
</head>
<body>

<h2>🚀 v42.1 — 勝率 × 賠率 價值套利器 (修正版)</h2>
<div class="notice">
  <b>🎯 核心邏輯：</b>不再猜勝負！直接用你提供的 <b>A, B, C (勝率)</b> 對比 <b>D, E, F (賠率)</b>。<br>
  只要計算出的期望值 (EV) > 0，就是莊家開錯賠率，值得下注！
</div>

<textarea id="input" placeholder="23	27	49	355	385	169	0:3	A
62	27	9	158	395	405	3:0	H"></textarea>

<div class="row">
  <label class="chk"><input type="checkbox" id="oddsDiv100" checked> 賠率已乘以100 (如 355 -> 3.55)</label>
</div>

<div class="row">
  <label>本金：</label>
  <input type="number" id="bankroll" value="10000" style="width:100px">
  <label>最小 EV：</label>
  <select id="minEV">
    <option value="0.02">2%</option>
    <option value="0.05" selected>5%</option>
    <option value="0.08">8%</option>
    <option value="0.10">10%</option>
  </select>
  <label>凱利分數：</label>
  <select id="kellyFrac">
    <option value="0.1">1/10 (極保守)</option>
    <option value="0.25" selected>1/4 (保守)</option>
    <option value="0.5">1/2 (中等)</option>
    <option value="1.0">全凱利 (激進)</option>
  </select>
  <button id="btnRun" onclick="start()">🚀 開始回測</button>
</div>

<div id="log">等待開始...</div>

<div class="best" id="best">
  <div class="verdict" id="verdict">-</div>
  <div class="big" id="big">-</div>
  <div style="text-align:center;font-size:13px;color:#666" id="detail"></div>

  <div class="grid">
    <div class="cell" id="c1"><div class="n" id="n1">-</div><div class="l">總下注場次</div></div>
    <div class="cell" id="c2"><div class="n" id="n2">-</div><div class="l">總利潤</div></div>
    <div class="cell" id="c3"><div class="n" id="n3">-</div><div class="l">ROI</div></div>
    <div class="cell" id="c4"><div class="n" id="n4">-</div><div class="l">最終本金</div></div>
  </div>

  <div class="section">
    <h3>📈 資金曲線</h3>
    <div class="chart-container" id="chart"></div>
  </div>

  <div class="section">
    <h3>📋 下注記錄 (前 50 場)</h3>
    <div id="bets" style="max-height:400px;overflow:auto"></div>
  </div>
</div>

<script>
'use strict';

function log(text, cls){
  var el = document.getElementById('log');
  if(el.dataset.started !== '1'){ el.textContent = ''; el.dataset.started = '1'; }
  var div = document.createElement('div');
  if(cls) div.className = 'l-' + cls;
  div.textContent = text;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function parseData(text){
  var rows = [];
  var lines = text.split('\n');
  var div100 = document.getElementById('oddsDiv100').checked;
  
  for(var i=0;i<lines.length;i++){
    var p = lines[i].trim().split(/\s+/);
    if(p.length < 8) continue;
    var vals = p.slice(0,6).map(Number);
    var r = p[7];
    if(vals.some(isNaN)) continue;
    if(r !== 'H' && r !== 'D' && r !== 'A') continue;
    
    // 關鍵修正：如果勾選了「賠率已乘以100」，就把 D/E/F 除以 100
    var divisor = div100 ? 100 : 1;
    
    var pH = vals[0] / 100;
    var pD = vals[1] / 100;
    var pA = vals[2] / 100;
    var oH = vals[3] / divisor;
    var oD = vals[4] / divisor;
    var oA = vals[5] / divisor;
    
    rows.push({ 
      pH: pH, pD: pD, pA: pA,
      oH: oH, oD: oD, oA: oA,
      result: r 
    });
  }
  return rows;
}

/* 凱利公式 */
function kellyFraction(prob, payout){
  var b = payout - 1;
  if(b <= 0) return 0;
  var q = 1 - prob;
  var f = (b * prob - q) / b;
  return Math.max(0, f);
}

function start(){
  document.getElementById('log').textContent = '';
  document.getElementById('log').dataset.started = '1';
  document.getElementById('best').style.display = 'none';
  document.getElementById('btnRun').disabled = true;

  var rows = parseData(document.getElementById('input').value);
  if(rows.length < 20){ alert('至少需要 20 筆'); document.getElementById('btnRun').disabled=false; return; }

  var bankrollInit = parseFloat(document.getElementById('bankroll').value);
  var minEV = parseFloat(document.getElementById('minEV').value);
  var kellyFrac = parseFloat(document.getElementById('kellyFrac').value);

  log('═════════════════════════════════', 'head');
  log('🚀 v42.1 — 勝率 × 賠率 價值套利器', 'head');
  log('═════════════════════════════════', 'head');
  log('資料：' + rows.length + ' 筆', 'info');
  log('本金：' + bankrollInit, 'info');
  log('最小 EV 門檻：' + (minEV*100) + '%', 'info');
  log('凱利分數：' + kellyFrac, 'info');
  log('');

  var bets = [];
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    
    // 計算三個結果的期望值 EV (修正後的數學)
    var evH = r.pH * r.oH - 1;
    var evD = r.pD * r.oD - 1;
    var evA = r.pA * r.oA - 1;
    
    var bestEV = Math.max(evH, evD, evA);
    var pick = -1;
    if(bestEV === evH) pick = 0;
    else if(bestEV === evD) pick = 1;
    else pick = 2;
    
    if(bestEV < minEV) continue; // 期望值太低，跳過
    
    var payout = pick === 0 ? r.oH : (pick === 1 ? r.oD : r.oA);
    var prob = pick === 0 ? r.pH : (pick === 1 ? r.pD : r.pA);
    var pickStr = pick === 0 ? 'H' : (pick === 1 ? 'D' : 'A');
    
    var f = kellyFraction(prob, payout);
    var actualF = f * kellyFrac;
    
    bets.push({
      idx: i,
      pickStr: pickStr,
      pick: pick,
      payout: payout,
      prob: prob,
      ev: bestEV,
      kellyF: actualF,
      stake: 0,
      result: r.result,
      profit: 0
    });
  }

  log('🎯 符合 EV 門檻的下注：' + bets.length + ' / ' + rows.length + ' 場', 
      bets.length > 0 ? 'ok' : 'warn');
  log('');

  var bankroll = bankrollInit;
  var chart = [];
  chart.push({ idx: 0, bal: bankroll });

  for(var bi=0;bi<bets.length;bi++){
    var b = bets[bi];
    var stake = bankroll * b.kellyF;
    stake = Math.min(stake, bankroll * 0.05); // 限制最大下注 5%
    stake = Math.round(stake);
    if(stake < 10){ stake = 0; b.stake = 0; continue; }
    b.stake = stake;

    if(b.result === b.pickStr){
      b.profit = stake * (b.payout - 1);
    } else {
      b.profit = -stake;
    }
    bankroll += b.profit;
    chart.push({ idx: bi+1, bal: bankroll });
  }

  var totalStake = 0;
  for(var bi2=0;bi2<bets.length;bi2++) totalStake += bets[bi2].stake;
  var totalProfit = bankroll - bankrollInit;
  var roi = totalStake > 0 ? totalProfit / totalStake : 0;

  log('═════════════════════════════════', 'head');
  log('📊 回測結果', 'head');
  log('═════════════════════════════════', 'head');
  log('總下注場次：' + bets.length);
  log('總下注金額：' + totalStake);
  log('總利潤：' + Math.round(totalProfit), totalProfit > 0 ? 'ok' : 'err');
  log('ROI（利潤/下注額）：' + (roi*100).toFixed(2) + '%', roi > 0 ? 'ok' : 'err');
  log('最終本金：' + Math.round(bankroll), bankroll > bankrollInit ? 'ok' : 'err');
  log('');

  document.getElementById('best').style.display = 'block';
  var v = document.getElementById('verdict');
  if(roi > 0.05){
    v.textContent = '✅ 找到價值！長期有正期望值';
    v.style.background = '#dcfce7';
  } else if(roi > 0){
    v.textContent = '🟡 微幅正期望值，可以嘗試';
    v.style.background = '#fef3c7';
  } else {
    v.textContent = '❌ 負期望值，這批資料沒有套利空間';
    v.style.background = '#fecaca';
  }
  v.style.color = '#333';

  document.getElementById('big').textContent = (roi*100).toFixed(2) + '%';
  document.getElementById('detail').textContent = 
    'ROI 只算下注場次｜共下注 ' + bets.length + ' 場｜' + 
    '平均 EV ' + (bets.length > 0 ? (bets.reduce(function(s,b){return s+b.ev;},0)/bets.length*100).toFixed(2) + '%' : '0%');

  document.getElementById('n1').textContent = bets.length;
  document.getElementById('n2').textContent = Math.round(totalProfit);
  document.getElementById('n3').textContent = (roi*100).toFixed(2) + '%';
  document.getElementById('n4').textContent = Math.round(bankroll);

  document.getElementById('c2').className = 'cell' + (totalProfit < 0 ? ' warn' : '');
  document.getElementById('c3').className = 'cell' + (roi < 0 ? ' warn' : '');
  document.getElementById('c4').className = 'cell' + (bankroll < bankrollInit ? ' warn' : '');

  // 資金曲線
  var maxBal = Math.max.apply(null, chart.map(function(c){ return c.bal; }));
  var minBal = Math.min.apply(null, chart.map(function(c){ return c.bal; }));
  var range = maxBal - minBal || 1;
  var chartHTML = '';
  var step = Math.max(1, Math.floor(chart.length / 50));
  for(var ci=0;ci<chart.length;ci+=step){
    var bal = chart[ci].bal;
    var heightPct = ((bal - minBal) / range) * 100;
    var cls = bal >= bankrollInit ? 'pos' : 'neg';
    chartHTML += '<div class="chart-bar ' + cls + '" style="height:' + heightPct + '%" title="場次' + ci + ': ' + Math.round(bal) + '"></div>';
  }
  document.getElementById('chart').innerHTML = chartHTML;

  // 下注表
  var html = '<table><thead><tr><th>#</th><th>選擇</th><th>賠率</th><th>你的勝率</th><th>EV</th><th>凱利%</th><th>下注</th><th>結果</th><th>利潤</th></tr></thead><tbody>';
  for(var bi3=0;bi3<Math.min(50, bets.length);bi3++){
    var b2 = bets[bi3];
    if(b2.stake === 0) continue;
    var cls2 = b2.profit > 0 ? 'pos' : 'neg';
    html += '<tr>' +
      '<td>' + (bi3+1) + '</td>' +
      '<td><b>' + b2.pickStr + '</b></td>' +
      '<td>' + b2.payout.toFixed(2) + '</td>' +
      '<td>' + (b2.prob*100).toFixed(1) + '%</td>' +
      '<td class="pos">' + (b2.ev*100).toFixed(1) + '%</td>' +
      '<td>' + (b2.kellyF*100).toFixed(2) + '%</td>' +
      '<td>' + b2.stake + '</td>' +
      '<td>' + b2.result + '</td>' +
      '<td class="' + cls2 + '">' + Math.round(b2.profit) + '</td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('bets').innerHTML = html;

  document.getElementById('btnRun').disabled = false;
}
</script>
</body>
</html>
