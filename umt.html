/* ============================================================
   精靈繪製
   ============================================================ */
function drawSprite(sprite, px, py, size, flip) {
  const art = sprite.art, pal = sprite.pal;
  const rows = art.length, cols = art[0].length;
  const sw = size / cols, sh = size / rows;
  for (let r = 0; r < rows; r++) {
    const row = art[r];
    for (let c = 0; c < cols; c++) {
      const ch = row[c];
      if (ch === '.') continue;
      const col = pal[ch];
      if (!col) continue;
      ctx.fillStyle = col;
      const dc = flip ? cols - 1 - c : c;
      ctx.fillRect(Math.floor(px + dc * sw), Math.floor(py + r * sh),
                   Math.ceil(sw), Math.ceil(sh));
    }
  }
}

/* ============================================================
   場景繪製
   ============================================================ */
function drawWall(px, py) {
  ctx.save();
  ctx.beginPath(); ctx.rect(px, py, TILE, TILE); ctx.clip();
  ctx.fillStyle = '#23232f'; ctx.fillRect(px, py, TILE, TILE);
  const bh = TILE / 4, bw = TILE / 2;
  for (let r = 0; r < 4; r++) {
    const off = (r % 2) ? bw / 2 : 0;
    for (let c = -1; c < 3; c++) {
      ctx.fillStyle = '#35354a';
      ctx.fillRect(px + c * bw + off + 1, py + r * bh + 1, bw - 2, bh - 2);
    }
  }
  ctx.restore();
}

function drawFloor(px, py, x, y) {
  ctx.fillStyle = '#16161f';
  ctx.fillRect(px, py, TILE, TILE);
  ctx.fillStyle = ((x + y) % 2 === 0) ? '#1c1c28' : '#181822';
  ctx.fillRect(px + 1, py + 1, TILE - 2, TILE - 2);
}

/* ============================================================
   遊戲狀態
   ============================================================ */
let LEVELS, player, gameOver, victory;

function initGame() {
  LEVELS = buildLevels();
  player = { hp:1000, atk:10, def:10, keys:0, bkeys:0, rkeys:0, x:5, y:9, floor:0 };
  gameOver = false;
  victory = false;
  document.getElementById('restart').style.display = 'none';
  updateHUD();
  draw();
  message('使用方向鍵移動，找到上樓梯前往下一層！');
}

function message(t) { document.getElementById('msg').textContent = t; }

function updateHUD() {
  document.getElementById('hp').textContent = player.hp;
  document.getElementById('atk').textContent = player.atk;
  document.getElementById('def').textContent = player.def;
  document.getElementById('keys').textContent = player.keys;
  document.getElementById('bkeys').textContent = player.bkeys;
  document.getElementById('rkeys').textContent = player.rkeys;
  document.getElementById('floor').textContent = player.floor + 1;
}

function findTile(floorIdx, ch) {
  const tiles = LEVELS[floorIdx].tiles;
  for (let y = 0; y < ROWS; y++) {
    const x = tiles[y].indexOf(ch);
    if (x !== -1) return { x, y };
  }
  return { x: 5, y: 1 };
}

function setTile(floorIdx, x, y, ch) {
  const lv = LEVELS[floorIdx];
  lv.tiles[y] = lv.tiles[y].substring(0, x) + ch + lv.tiles[y].substring(x + 1);
}

/* ============================================================
   戰鬥
   ============================================================ */
function fight(monsterId, mx, my) {
  const m = MONSTERS[monsterId];
  const dmgToMonster = Math.max(1, player.atk - m.def);
  const dmgToPlayer  = Math.max(0, m.atk - player.def);
  const turns = Math.ceil(m.hp / dmgToMonster);
  const totalDamage = turns * dmgToPlayer;

  if (totalDamage >= player.hp) {
    player.hp = 0;
    gameOver = true;
    message(`你被${m.name}擊敗了！遊戲結束`);
    document.getElementById('restart').style.display = 'block';
    updateHUD(); draw();
    return;
  }

  player.hp -= totalDamage;
  delete LEVELS[player.floor].monsters[`${mx},${my}`];
  player.x = mx; player.y = my;

  if (monsterId === 8) {
    gameOver = true; victory = true;
    message('🎉 擊敗大魔王！恭喜通關全部十層！');
    document.getElementById('restart').style.display = 'block';
  } else {
    message(`擊敗${m.name}，損失 ${totalDamage} HP`);
  }
  updateHUD(); draw();
}

   ============================================================ */
function move(dx, dy) {
  if (gameOver) return;
  const nx = player.x + dx, ny = player.y + dy;
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return;

  const lv = LEVELS[player.floor];
  const tile = lv.tiles[ny][nx];
  const mKey = `${nx},${ny}`;
  const monsterId = lv.monsters[mKey];

  if (tile === '#') return;
  if (monsterId) { fight(monsterId, nx, ny); return; }

  if (tile === 'Y') {
    if (player.keys <= 0) { message('需要黃鑰匙'); return; }
    player.keys--; setTile(player.floor, nx, ny, '.');
    message('使用黃鑰匙開門');
  } else if (tile === 'B') {
    if (player.bkeys <= 0) { message('需要藍鑰匙'); return; }
    player.bkeys--; setTile(player.floor, nx, ny, '.');
    message('使用藍鑰匙開門');
  } else if (tile === 'R') {
    if (player.rkeys <= 0) { message('需要紅鑰匙'); return; }
    player.rkeys--; setTile(player.floor, nx, ny, '.');
    message('使用紅鑰匙開門');
  } else if (tile === 'y') {
    player.keys++; setTile(player.floor, nx, ny, '.');
    message('獲得黃鑰匙');
  } else if (tile === 'b') {
    player.bkeys++; setTile(player.floor, nx, ny, '.');
    message('獲得藍鑰匙');
  } else if (tile === 'r') {
    player.rkeys++; setTile(player.floor, nx, ny, '.');
    message('獲得紅鑰匙');
  } else if (tile === 'h') {
    player.hp += 100; setTile(player.floor, nx, ny, '.');
    message('紅藥水 +100 HP');
  } else if (tile === 'H') {
    player.hp += 300; setTile(player.floor, nx, ny, '.');
    message('藍藥水 +300 HP');
  } else if (tile === 'a') {
    player.atk += 3; setTile(player.floor, nx, ny, '.');
    message('撿到劍！攻擊 +3');
  } else if (tile === 'd') {
    player.def += 3; setTile(player.floor, nx, ny, '.');
    message('撿到盾！防禦 +3');
  } else if (tile === '>') {
    if (player.floor < LEVELS.length - 1) {
      player.floor++;
      const pos = findTile(player.floor, '<');
      player.x = pos.x; player.y = pos.y;
      message(`進入第 ${player.floor + 1} 層`);
    }
    updateHUD(); draw(); return;
  } else if (tile === '<') {
    if (player.floor > 0) {
      player.floor--;
      const pos = findTile(player.floor, '>');
      player.x = pos.x; player.y = pos.y;
      message(`回到第 ${player.floor + 1} 層`);
    }
    updateHUD(); draw(); return;
  }

  player.x = nx; player.y = ny;
  updateHUD(); draw();
}

/* ============================================================
   渲染
   ============================================================ */
function draw() {
  const lv = LEVELS[player.floor];

  // 地面與牆 + 道具
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const tile = lv.tiles[y][x];
      const px = x * TILE, py = y * TILE;

      if (tile === '#') { drawWall(px, py); continue; }
      drawFloor(px, py, x, y);

      switch (tile) {
        case 'h': drawSprite(POTION, px, py, TILE); break;
        case 'H': {
          const p = { art: POTION.art, pal: { b:'#d0d0e0', p:'#4070d0' } };
          drawSprite(p, px, py, TILE); break;
        }
        case 'a': drawSprite(SWORD, px, py, TILE); break;
        case 'd': drawSprite(SHIELD, px, py, TILE); break;
        case 'y': {
          const k = { art: KEY.art, pal: { k:'#ffd700' } };
          drawSprite(k, px, py, TILE); break;
        }
        case 'b': {
          const k = { art: KEY.art, pal: { k:'#4a90ff' } };
          drawSprite(k, px, py, TILE); break;
        }
        case 'r': {
          const k = { art: KEY.art, pal: { k:'#ff5050' } };
          drawSprite(k, px, py, TILE); break;
        }
        case 'Y': {
          const d = { art: DOOR.art, pal: { d:'#b8860b', w:'#ffd700', k:'#5c4300' } };
          drawSprite(d, px, py, TILE); break;
        }
        case 'B': {
          const d = { art: DOOR.art, pal: { d:'#2a4fa0', w:'#6fa8ff', k:'#0a1a40' } };
          drawSprite(d, px, py, TILE); break;
        }
        case 'R': {
          const d = { art: DOOR.art, pal: { d:'#a02020', w:'#ff6060', k:'#400000' } };
          drawSprite(d, px, py, TILE); break;
        }
        case '>': drawSprite(STAIR, px, py, TILE); break;
        case '<': drawSprite(STAIR, px, py, TILE, false); break;
      }
    }
  }

  // 怪物
  for (const key in lv.monsters) {
    const [mx, my] = key.split(',').map(Number);
    const m = MONSTERS[lv.monsters[key]];
    const px = mx * TILE, py = my * TILE;

    // 大魔王稍微放大
    const size = (lv.monsters[key] === 8) ? TILE * 1.15 : TILE;
    const off = (TILE - size) / 2;
    drawSprite(m.sprite, px + off, py + off, size);

    // 血條
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(px + 4, py + TILE - 7, TILE - 8, 4);
    ctx.fillStyle = '#e04040';
    ctx.fillRect(px + 4, py + TILE - 7, (TILE - 8) * Math.min(1, m.hp / 500), 4);
  }

  // 英雄
  if (!gameOver || victory) {
    const px = player.x * TILE, py = player.y * TILE;
    // 影子
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(px + TILE/2, py + TILE - 5, TILE*0.28, TILE*0.10, 0, 0, Math.PI*2);
    ctx.fill();
    drawSprite(HERO, px, py, TILE);
  }
}

/* ============================================================
   輸入
   ============================================================ */
document.addEventListener('keydown', (e) => {
  if (gameOver) return;
  switch (e.key) {
    case 'ArrowUp':    case 'w': case 'W': move(0, -1); break;
    case 'ArrowDown':  case 's': case 'S': move(0,  1); break;
    case 'ArrowLeft':  case 'a': case 'A': move(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': move( 1, 0); break;
    default: return;
  }
  e.preventDefault();
});

document.querySelectorAll('#dpad button').forEach(btn => {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (gameOver) return;
    const d = btn.dataset.dir;
    if (d === 'up')         move(0, -1);
    else if (d === 'down')  move(0,  1);
    else if (d === 'left')  move(-1, 0);
    else if (d === 'right') move( 1, 0);
  });
});

document.getElementById('restart').addEventListener('click', initGame);

/* ============================================================
   啟動
   ============================================================ */
initGame();
</script>
