/* ============================================================
   精靈繪製
   ============================================================ */
function drawSprite(sprite, px, py, size, flip) {
  const art = sprite.art, pal = sprite.pal;
  const rows = art.length, cols = art[0].length;
  const sw = size / cols, sh = size / rows;
  for (let r = 0; r < rows; r++) {
    const row = art[r];
    for (let c = 0; c < cols; c++) {
      const ch = row[c];
      if (ch === '.') continue;
      const col = pal[ch];
      if (!col) continue;
      ctx.fillStyle = col;
      const dc = flip ? cols - 1 - c : c;
      ctx.fillRect(Math.floor(px + dc * sw), Math.floor(py + r * sh),
                   Math.ceil(sw), Math.ceil(sh));
    }
  }
}

/* ============================================================
   場景繪製
   ============================================================ */
function drawWall(px, py) {
  ctx.save();
  ctx.beginPath(); ctx.rect(px, py, TILE, TILE); ctx.clip();
  ctx.fillStyle = '#23232f'; ctx.fillRect(px, py, TILE, TILE);
  const bh = TILE / 4, bw = TILE / 2;
  for (let r = 0; r < 4; r++) {
    const off = (r % 2) ? bw / 2 : 0;
    for (let c = -1; c < 3; c++) {
      ctx.fillStyle = '#35354a';
      ctx.fillRect(px + c * bw + off + 1, py + r * bh + 1, bw - 2, bh - 2);
    }
  }
  ctx.restore();
}
function drawFloor(px, py, x, y) {
  ctx.fillStyle = ((x + y) % 2 === 0) ? '#1c1c28' : '#181822';
  ctx.fillRect(px + 1, py + 1, TILE - 2, TILE - 2);
}

let levels, player, gameOver, victory;

function initGame() {
  levels = buildLevels();
  player = {
    hp:100, maxHp:100, atk:10, def:5,
    lv:1, exp:0, gold:0,
    keys:{y:0,b:0,r:0},
    x:5, y:9, floor:0
  };
  gameOver = false;
  victory = false;
  document.getElementById('restart').style.display = 'none';
  updateHUD();
  draw();
  message('使用方向鍵移動，撞向怪物即發動回合制攻擊！');
}

function expNeeded(lv) { return 25 * lv; }

function checkLevel() {
  while (player.exp >= expNeeded(player.lv)) {
    player.exp -= expNeeded(player.lv);
    player.lv++;
    player.maxHp += 25;
    player.hp = player.maxHp;
    player.atk += 3;
    player.def += 2;
    message(`🎉 升級！Lv.${player.lv}  生命上限+25  攻擊+3  防禦+2`);
  }
}

function message(t) { document.getElementById('msg').textContent = t; }

function updateHUD() {
  document.getElementById('hp').textContent = `${player.hp}/${player.maxHp}`;
  document.getElementById('atk').textContent = player.atk;
  document.getElementById('def').textContent = player.def;
  document.getElementById('lv').textContent = player.lv;
  document.getElementById('exp').textContent = player.exp;
  document.getElementById('expNext').textContent = expNeeded(player.lv);
  document.getElementById('gold').textContent = player.gold;
  document.getElementById('keyY').textContent = player.keys.y;
  document.getElementById('keyB').textContent = player.keys.b;
  document.getElementById('keyR').textContent = player.keys.r;
  document.getElementById('floor').textContent = player.floor + 1;
}

function findTile(fi, ch) {
  const t = levels[fi].tiles;
  for (let y = 0; y < ROWS; y++) {
    const x = t[y].indexOf(ch);
    if (x !== -1) return {x, y};
  }
  return {x:5, y:1};
}
function setTile(fi, x, y, ch) {
  const lv = levels[fi];
  lv.tiles[y] = lv.tiles[y].substring(0,x) + ch + lv.tiles[y].substring(x+1);
}

/* ============================================================
   回合制戰鬥
   ============================================================ */
function tryFight(nx, ny) {
  const lv = levels[player.floor];
  const key = `${nx},${ny}`;
  const m = lv.monsters[key];
  if (!m) return 'none';

  const t = MTYPE[m.type];

  // ── 玩家攻擊 ──
  const pdmg = Math.max(1, player.atk - t.def);
  m.hp -= pdmg;
  let msg = `你對${t.name}造成 ${pdmg} 傷害（剩 ${Math.max(0,m.hp)}/${m.maxHp}）`;

  if (m.hp <= 0) {
    // 擊殺
    delete lv.monsters[key];
    player.exp += t.exp;
    player.gold += t.gold;
    msg += `。擊敗${t.name}！+${t.exp} EXP、+${t.gold} 金幣`;
    checkLevel();
    message(msg);
    updateHUD();
    draw();
    return 'killed';
  }

  // ── 怪物反擊 ──
  const mdmg = Math.max(1, t.atk - player.def);
  player.hp -= mdmg;
  msg += `；${t.name}反擊 ${mdmg} 傷害（你剩 ${Math.max(0,player.hp)} HP）`;

  if (player.hp <= 0) {
    player.hp = 0;
    gameOver = true;
    message(msg + '。你被擊敗了…');
    document.getElementById('restart').style.display = 'block';
    updateHUD();
    draw();
    return 'dead';
  }

  message(msg);
  updateHUD();
  draw();
  return 'ongoing';
}

/* ============================================================
   移動
   ============================================================ */
function move(dx, dy) {
  if (gameOver) return;
  const nx = player.x + dx, ny = player.y + dy;
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return;

  const lv = levels[player.floor];
  const tile = lv.tiles[ny][nx];
  const key = `${nx},${ny}`;

  if (tile === '#') return;

  // 怪物 → 回合制戰鬥
  if (lv.monsters[key]) {
    const r = tryFight(nx, ny);
    if (r === 'killed') {
      player.x = nx; player.y = ny;
      draw();
    }
    return;
  }

  // 門與道具
  if (tile === 'Y') {
    if (player.keys.y <= 0) { message('需要黃鑰匙'); return; }
    player.keys.y--; setTile(player.floor, nx, ny, '.');
    message('使用黃鑰匙開門');
  } else if (tile === 'B') {
    if (player.keys.b <= 0) { message('需要藍鑰匙'); return; }
    player.keys.b--; setTile(player.floor, nx, ny, '.');
    message('使用藍鑰匙開門');
  } else if (tile === 'R') {
    if (player.keys.r <= 0) { message('需要紅鑰匙'); return; }
    player.keys.r--; setTile(player.floor, nx, ny, '.');
    message('使用紅鑰匙開門');
  } else if (tile === 'y') {
    player.keys.y++; setTile(player.floor, nx, ny, '.');
    message('獲得黃鑰匙');
  } else if (tile === 'b') {
    player.keys.b++; setTile(player.floor, nx, ny, '.');
    message('獲得藍鑰匙');
  } else if (tile === 'r') {
    player.keys.r++; setTile(player.floor, nx, ny, '.');
    message('獲得紅鑰匙');
  } else if (tile === 'h') {
    player.hp = Math.min(player.maxHp, player.hp + 50);
    setTile(player.floor, nx, ny, '.');
    message('喝下小藥水 +50 HP');
  } else if (tile === 'H') {
    player.hp = Math.min(player.maxHp, player.hp + 200);
    setTile(player.floor, nx, ny, '.');
    message('喝下大藥水 +200 HP');
  } else if (tile === 'a') {
    player.atk += 3; setTile(player.floor, nx, ny, '.');
    message('撿到劍！攻擊 +3');
  } else if (tile === 'd') {
    player.def += 3; setTile(player.floor, nx, ny, '.');
    message('撿到盾！防禦 +3');
  } else if (tile === '$') {
    openShop(); return;
  } else if (tile === '>') {
    if (player.floor < levels.length - 1) {
      player.floor++;
      const p = findTile(player.floor, '<');
      player.x = p.x; player.y = p.y;
      message(`進入第 ${player.floor + 1} 層`);
    }
    updateHUD(); draw(); return;
  } else if (tile === '<') {
    if (player.floor > 0) {
      player.floor--;
      const p = findTile(player.floor, '>');
      player.x = p.x; player.y = p.y;
      message(`回到第 ${player.floor + 1} 層`);
    }
    updateHUD(); draw(); return;
  }

  player.x = nx; player.y = ny;
  updateHUD(); draw();
}

/* ============================================================
   渲染
   ============================================================ */
function draw() {
  const lv = levels[player.floor];

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const tile = lv.tiles[y][x];
      const px = x * TILE, py = y * TILE;

      if (tile === '#') { drawWall(px, py); continue; }
      drawFloor(px, py, x, y);

      switch (tile) {
        case 'h': drawSprite(POTION, px, py, TILE); break;
        case 'H': drawSprite(POTION_BIG, px, py, TILE); break;
        case 'a': drawSprite(SWORD, px, py, TILE); break;
        case 'd': drawSprite(SHIELD, px, py, TILE); break;
        case 'y': drawSprite({art:KEY.art,pal:{k:'#ffd700'}}, px, py, TILE); break;
        case 'b': drawSprite({art:KEY.art,pal:{k:'#4a90ff'}}, px, py, TILE); break;
        case 'r': drawSprite({art:KEY.art,pal:{k:'#ff5050'}}, px, py, TILE); break;
        case 'Y': drawSprite({art:DOOR.art,pal:{d:'#b8860b',w:'#ffd700',k:'#5c4300'}}, px, py, TILE); break;
        case 'B': drawSprite({art:DOOR.art,pal:{d:'#2a4fa0',w:'#6fa8ff',k:'#0a1a40'}}, px, py, TILE); break;
        case 'R': drawSprite({art:DOOR.art,pal:{d:'#a02020',w:'#ff6060',k:'#400000'}}, px, py, TILE); break;
        case '>': drawSprite(STAIR, px, py, TILE); break;
        case '<': drawSprite(STAIR, px, py, TILE); break;
        case '$': drawSprite(SHOP, px, py, TILE); break;
      }
    }
  }

  // 怪物
  for (const key in lv.monsters) {
    const [mx, my] = key.split(',').map(Number);
    const m = lv.monsters[key];
    const t = MTYPE[m.type];
    const px = mx * TILE, py = my * TILE;

    drawSprite(t.sprite, px, py, TILE);

    // HP 條
    const ratio = Math.max(0, m.hp / m.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(px + 3, py + TILE - 8, TILE - 6, 5);
    ctx.fillStyle = ratio > 0.5 ? '#40d040' : (ratio > 0.25 ? '#e0c020' : '#e04040');
    ctx.fillRect(px + 3, py + TILE - 8, (TILE - 6) * ratio, 5);
  }

  // 英雄
  if (!gameOver || victory) {
    const px = player.x * TILE, py = player.y * TILE;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(px + TILE/2, py + TILE - 5, TILE*0.28, TILE*0.10, 0, 0, Math.PI*2);
    ctx.fill();
    drawSprite(HERO, px, py, TILE);
  }
}

/* ============================================================
   商店
   ============================================================ */
function openShop() {
  document.getElementById('shop').style.display = 'flex';
}
function closeShop() {
  document.getElementById('shop').style.display = 'none';
}
function buyItem(type) {
  const costs = {hp:10, hp2:30, key:20, atk:50, def:50};
  const cost = costs[type];
  if (player.gold < cost) { message(`金幣不足！需要 ${cost} 金`); return; }
  player.gold -= cost;
  if (type === 'hp')  { player.hp = Math.min(player.maxHp, player.hp + 50); message('購買小藥水 +50 HP'); }
  if (type === 'hp2') { player.hp = Math.min(player.maxHp, player.hp + 200); message('購買大藥水 +200 HP'); }
  if (type === 'key') { player.keys.y++; message('購買黃鑰匙 ×1'); }
  if (type === 'atk') { player.atk += 3; message('攻擊力 +3'); }
  if (type === 'def') { player.def += 2; message('防禦力 +2'); }
  updateHUD();
}

/* ============================================================
   輸入
   ============================================================ */
document.addEventListener('keydown', (e) => {
  if (gameOver) return;
  if (document.getElementById('shop').style.display === 'flex') return;
  switch (e.key) {
    case 'ArrowUp':    case 'w': case 'W': move(0,-1); break;
    case 'ArrowDown':  case 's': case 'S': move(0, 1); break;
    case 'ArrowLeft':  case 'a': case 'A': move(-1,0); break;
    case 'ArrowRight': case 'd': case 'D': move( 1,0); break;
    default: return;
  }
  e.preventDefault();
});

document.querySelectorAll('#dpad button').forEach(btn => {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (gameOver) return;
    if (document.getElementById('shop').style.display === 'flex') return;
    const d = btn.dataset.dir;
    if (d === 'up')         move(0,-1);
    else if (d === 'down')  move(0, 1);
    else if (d === 'left')  move(-1,0);
    else if (d === 'right') move( 1,0);
  });
});

document.getElementById('restart').addEventListener('click', initGame);

/* ============================================================
   啟動
   ============================================================ */
initGame();
</script>
