<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>終極魔塔 - 前十層</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#0b0b10;color:#cfefff;font-family:system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;}
  #hud{display:flex;gap:10px;font-size:13px;padding:5px 10px;background:#15151f;
    border:1px solid #333;border-radius:8px;flex-wrap:wrap;justify-content:center;}
  #hud span{white-space:nowrap;}
  #msg{font-size:13px;color:#ffd070;min-height:18px;text-align:center;padding:0 8px;}
  canvas{border:2px solid #444;display:block;max-width:96vw;height:auto;}
  #dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;}
  #dpad button{font-size:22px;color:#cfefff;background:#22222e;border:2px solid #3c3c4e;border-radius:12px;
    display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;
    touch-action:none;-webkit-tap-highlight-color:transparent;}
  #dpad button:active{background:#3c3c4e;}
  #dpad button[data-dir="up"]{grid-area:1/2;}
  #dpad button[data-dir="left"]{grid-area:2/1;}
  #dpad button[data-dir="right"]{grid-area:2/3;}
  #dpad button[data-dir="down"]{grid-area:3/2;}
  #restart{display:none;padding:8px 20px;font-size:15px;background:#d03030;color:#fff;
    border:none;border-radius:8px;cursor:pointer;}
</style>
</head>
<body>
<div id="hud">
  <span>❤ <b id="hp">1000</b></span>
  <span>⚔ <b id="atk">10</b></span>
  <span>🛡 <b id="def">10</b></span>
  <span>🔑 <b id="keys">0</b></span>
  <span>🔷 <b id="bkeys">0</b></span>
  <span>🔴 <b id="rkeys">0</b></span>
  <span>🏢 <b id="floor">1</b>F</span>
</div>
<div id="msg"></div>
<canvas id="game"></canvas>
<button id="restart">重新開始</button>
<div id="dpad">
  <button data-dir="up">▲</button>
  <button data-dir="left">◀</button>
  <button data-dir="right">▶</button>
  <button data-dir="down">▼</button>
</div>
<script>
const COLS = 11, ROWS = 11, TILE = 48;
const canvas = document.getElementById('game');
canvas.width = COLS * TILE;
canvas.height = ROWS * TILE;
const ctx = canvas.getContext('2d');

// ===== 怪物 =====
const MONSTERS = {
  1:{name:'綠頭怪',hp:20,atk:8,def:2,color:'#5fbf5f'},
  2:{name:'紅頭怪',hp:40,atk:15,def:5,color:'#d05050'},
  3:{name:'小蝙蝠',hp:30,atk:12,def:3,color:'#a070d0'},
  4:{name:'骷髏人',hp:60,atk:20,def:8,color:'#d0d0d0'},
  5:{name:'獸人',hp:100,atk:28,def:12,color:'#c08040'},
  6:{name:'石頭人',hp:150,atk:35,def:18,color:'#808080'},
  7:{name:'鬼戰士',hp:200,atk:45,def:22,color:'#4060c0'},
  8:{name:'大魔王',hp:500,atk:55,def:28,color:'#ff3030'}
};

// ===== 關卡資料 =====
const LEVELS = [
  // 第 1 層
  {
    tiles:[
      "###########",
      "#h........#",
      "#..#...#..#",
      "#...y.....#",
      "#..#...#..#",
      "#....>....#",
      "#..#...#..#",
      "#........a#",
      "#..#...#..#",
      "#....S....#",
      "###########"
    ],
    monsters:{"5,7":1,"4,8":1,"6,8":1,"3,3":2}
  },
  // 第 2 層
  {
    tiles:[
      "###########",
      "#..y.<....#",
      "#......a..#",
      "#.#######.#",
      "#.#.....#.#",
      "#.#..>..#.#",
      "#.#.....#.#",
      "#.###Y###.#",
      "#.d.......#",
      "#........h#",
      "###########"
    ],
    monsters:{"2,2":2,"8,2":2,"5,4":3,"1,6":1}
  },
  // 第 3 層
  {
    tiles:[
      "###########",
      "#....<....#",
      "#..#...#..#",
      "#..y...y..#",
      "#..#.Y.#..#",
      "#....>....#",
      "#..#...#..#",
      "#..a...d..#",
      "#..#...#..#",
      "#....b....#",
      "###########"
    ],
    monsters:{"2,2":4,"8,2":4,"5,8":3,"4,6":4}
  },
  // 第 4 層
  {
    tiles:[
      "###########",
      "#d...<....#",
      "#..#...#..#",
      "#..b......#",
      "#..#.B.#..#",
      "#....>....#",
      "#..#...#..#",
      "#h.......H#",
      "#..#...#..#",
      "#....a....#",
      "###########"
    ],
    monsters:{"2,3":5,"8,3":5,"4,6":4,"6,6":4,"5,8":5}
  },
  // 第 5 層
  {
    tiles:[
      "###########",
      "#....<....#",
      "#..#...#..#",
      "#..y...y..#",
      "#..#.Y.#..#",
      "#....>....#",
      "#..#...#..#",
      "#..a...d..#",
      "#..#...#..#",
      "#....b....#",
      "###########"
    ],
    monsters:{"2,2":5,"8,2":5,"4,6":6,"6,6":6,"5,8":5}
  },
  // 第 6 層
  {
    tiles:[
      "###########",
      "#d...<....#",
      "#..#...#..#",
      "#..b......#",
      "#..#.B.#..#",
      "#....>....#",
      "#..#...#..#",
      "#h.......H#",
      "#..#...#..#",
      "#....a....#",
      "###########"
    ],
    monsters:{"2,3":6,"8,3":6,"4,6":6,"6,6":6,"5,8":6}
  },
  // 第 7 層
  {
    tiles:[
      "###########",
      "#....<....#",
      "#..#...#..#",
      "#..r......#",
      "#..#.R.#..#",
      "#....>....#",
      "#..#...#..#",
      "#..a...d..#",
      "#..#...#..#",
      "#....b....#",
      "###########"
    ],
    monsters:{"2,3":7,"8,3":7,"4,6":7,"6,6":7,"5,8":7}
  },
  // 第 8 層
  {
    tiles:[
      "###########",
      "#d...<....#",
      "#..#...#..#",
      "#..b...b..#",
      "#..#.B.#..#",
      "#....>....#",
      "#..#...#..#",
      "#h.......H#",
      "#..#...#..#",
      "#....a....#",
      "###########"
    ],
    monsters:{"2,3":7,"8,3":7,"4,6":7,"6,6":7,"5,8":7}
  },
  // 第 9 層
  {
    tiles:[
      "###########",
      "#....<....#",
      "#..#...#..#",
      "#..r...r..#",
      "#..#.R.#..#",
      "#....>....#",
      "#..#...#..#",
      "#..a...d..#",
      "#..#...#..#",
      "#....b....#",
      "###########"
    ],
    monsters:{"2,3":7,"8,3":7,"4,6":7,"6,6":7,"5,8":7}
  },
  // 第 10 層
  {
    tiles:[
      "###########",
      "#....<....#",
      "#.........#",
      "#.........#",
      "#.........#",
      "#.........#",
      "#.........#",
      "#.........#",
      "#.........#",
      "#.........#",
      "###########"
    ],
    monsters:{"5,5":8}
  }
];

// ===== 主角 =====
let player, gameOver, victory;

function initGame() {
  player = { hp:1000, atk:10, def:10, keys:0, bkeys:0, rkeys:0, x:5, y:9, floor:0 };
  gameOver = false;
  victory = false;
  // 重置關卡資料（深拷貝）
  LEVELS.forEach((lv, i) => {
    if (i === 0) {
      lv.tiles = [
        "###########","#h........#","#..#...#..#","#...y.....#",
        "#..#...#..#","#....>....#","#..#...#..#","#........a#",
        "#..#...#..#","#....S....#","###########"
      ];
      lv.monsters = {"5,7":1,"4,8":1,"6,8":1,"3,3":2};
    }
  });
  // 完整重置所有樓層（簡化：重新載入頁面最保險，這裡只重置第一層以外的狀態靠重新整理）
  document.getElementById('restart').style.display = 'none';
  updateHUD();
  draw();
  message('使用方向鍵移動，找到上樓梯！');
}

// 為了完全重置，重新整理頁面
document.getElementById('restart').addEventListener('click', () => location.reload());

function message(t) { document.getElementById('msg').textContent = t; }

function updateHUD() {
  document.getElementById('hp').textContent = player.hp;
  document.getElementById('atk').textContent = player.atk;
  document.getElementById('def').textContent = player.def;
  document.getElementById('keys').textContent = player.keys;
  document.getElementById('bkeys').textContent = player.bkeys;
  document.getElementById('rkeys').textContent = player.rkeys;
  document.getElementById('floor').textContent = player.floor + 1;
}

function findTile(floorIdx, ch) {
  const tiles = LEVELS[floorIdx].tiles;
  for (let y = 0; y < ROWS; y++) {
    const x = tiles[y].indexOf(ch);
    if (x !== -1) return { x, y };
  }
  return { x: 5, y: 1 };
}

function setTile(floorIdx, x, y, ch) {
  const lv = LEVELS[floorIdx];
  lv.tiles[y] = lv.tiles[y].substring(0, x) + ch + lv.tiles[y].substring(x + 1);
}

// ===== 戰鬥 =====
function fight(monsterId, mx, my) {
  const m = MONSTERS[monsterId];
  const dmgToMonster = Math.max(1, player.atk - m.def);
  const dmgToPlayer = Math.max(0, m.atk - player.def);
  const turns = Math.ceil(m.hp / dmgToMonster);
  const totalDamage = turns * dmgToPlayer;

  if (totalDamage >= player.hp) {
    player.hp = 0;
    gameOver = true;
    message(`你被${m.name}擊敗了！遊戲結束`);
    document.getElementById('restart').style.display = 'block';
    updateHUD(); draw();
    return;
  }

  player.hp -= totalDamage;
  delete LEVELS[player.floor].monsters[`${mx},${my}`];
  player.x = mx; player.y = my;

  if (monsterId === 8) {
    gameOver = true; victory = true;
    message('🎉 擊敗大魔王！恭喜通關！');
    document.getElementById('restart').style.display = 'block';
  } else {
    message(`擊敗${m.name}，損失 ${totalDamage} HP`);
  }
  updateHUD(); draw();
}

// ===== 移動 =====
function move(dx, dy) {
  if (gameOver) return;
  const nx = player.x + dx, ny = player.y + dy;
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return;

  const lv = LEVELS[player.floor];
  const tile = lv.tiles[ny][nx];
  const mKey = `${nx},${ny}`;
  const monsterId = lv.monsters[mKey];

  if (tile === '#') return;

  // 怪物
  if (monsterId) { fight(monsterId, nx, ny); return; }

  // 門與道具
  if (tile === 'Y') {
    if (player.keys <= 0) { message('需要黃鑰匙'); return; }
    player.keys--; setTile(player.floor, nx, ny, '.');
    message('使用黃鑰匙開門');
  } else if (tile === 'B') {
    if (player.bkeys <= 0) { message('需要藍鑰匙'); return; }
    player.bkeys--; setTile(player.floor, nx, ny, '.');
    message('使用藍鑰匙開門');
  } else if (tile === 'R') {
    if (player.rkeys <= 0) { message('需要紅鑰匙'); return; }
    player.rkeys--; setTile(player.floor, nx, ny, '.');
    message('使用紅鑰匙開門');
  } else if (tile === 'y') {
    player.keys++; setTile(player.floor, nx, ny, '.');
    message('獲得黃鑰匙');
  } else if (tile === 'b') {
    player.bkeys++; setTile(player.floor, nx, ny, '.');
    message('獲得藍鑰匙');
  } else if (tile === 'r') {
    player.rkeys++; setTile(player.floor, nx, ny, '.');
    message('獲得紅鑰匙');
  } else if (tile === 'h') {
    player.hp += 100; setTile(player.floor, nx, ny, '.');
    message('紅血瓶 +100 HP');
  } else if (tile === 'H') {
    player.hp += 300; setTile(player.floor, nx, ny, '.');
    message('藍血瓶 +300 HP');
  } else if (tile === 'a') {
    player.atk += 3; setTile(player.floor, nx, ny, '.');
    message('攻擊寶石 +3 ATK');
  } else if (tile === 'd') {
    player.def += 3; setTile(player.floor, nx, ny, '.');
    message('防禦寶石 +3 DEF');
  } else if (tile === '>') {
    if (player.floor < LEVELS.length - 1) {
      player.floor++;
      const pos = findTile(player.floor, '<');
      player.x = pos.x; player.y = pos.y;
      message(`進入第 ${player.floor + 1} 層`);
    }
    updateHUD(); draw(); return;
  } else if (tile === '<') {
    if (player.floor > 0) {
      player.floor--;
      const pos = findTile(player.floor, '>');
      player.x = pos.x; player.y = pos.y;
      message(`回到第 ${player.floor + 1} 層`);
    }
    updateHUD(); draw(); return;
  }

  player.x = nx; player.y = ny;
  updateHUD(); draw();
}

// ===== 渲染 =====
function draw() {
  const lv = LEVELS[player.floor];

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const tile = lv.tiles[y][x];
      const px = x * TILE, py = y * TILE;
      const cx = px + TILE / 2, cy = py + TILE / 2;

      // 地板 / 牆
      ctx.fillStyle = tile === '#' ? '#3c3c4e' : '#1c1c26';
      ctx.fillRect(px, py, TILE, TILE);
      ctx.strokeStyle = '#26262f';
      ctx.strokeRect(px + 0.5, py + 0.5, TILE - 1, TILE - 1);

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (tile === 'Y') {
        ctx.fillStyle = '#d4a017'; ctx.fillRect(px+9, py+9, TILE-18, TILE-18);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('Y', cx, cy);
      } else if (tile === 'B') {
        ctx.fillStyle = '#3060d0'; ctx.fillRect(px+9, py+9, TILE-18, TILE-18);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('B', cx, cy);
      } else if (tile === 'R') {
        ctx.fillStyle = '#d03030'; ctx.fillRect(px+9, py+9, TILE-18, TILE-18);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.fillText('R', cx, cy);
      } else if (tile === 'y') {
        ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#8a6d00'; ctx.font = 'bold 13px sans-serif'; ctx.fillText('K', cx, cy);
      } else if (tile === 'b') {
        ctx.fillStyle = '#4a90ff'; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.fillText('K', cx, cy);
      } else if (tile === 'r') {
        ctx.fillStyle = '#ff5050'; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.fillText('K', cx, cy);
      } else if (tile === 'h') {
        ctx.fillStyle = '#d04040'; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.fillText('+', cx, cy);
      } else if (tile === 'H') {
        ctx.fillStyle = '#4070d0'; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.fillText('+', cx, cy);
      } else if (tile === 'a') {
        ctx.fillStyle = '#ffb030';
        ctx.beginPath();
        ctx.moveTo(cx, cy-12); ctx.lineTo(cx+12, cy);
        ctx.lineTo(cx, cy+12); ctx.lineTo(cx-12, cy);
        ctx.closePath(); ctx.fill();
      } else if (tile === 'd') {
        ctx.fillStyle = '#30c0b0';
        ctx.beginPath();
        ctx.moveTo(cx, cy-12); ctx.lineTo(cx+12, cy);
        ctx.lineTo(cx, cy+12); ctx.lineTo(cx-12, cy);
        ctx.closePath(); ctx.fill();
      } else if (tile === '>') {
        ctx.fillStyle = '#70d070'; ctx.font = 'bold 28px sans-serif'; ctx.fillText('▲', cx, cy);
      } else if (tile === '<') {
        ctx.fillStyle = '#70d070'; ctx.font = 'bold 28px sans-serif'; ctx.fillText('▼', cx, cy);
      }
    }
  }

  // 怪物
  for (const key in lv.monsters) {
    const [mx, my] = key.split(',').map(Number);
    const m = MONSTERS[lv.monsters[key]];
    const cx = mx * TILE + TILE / 2;
    const cy = my * TILE + TILE / 2;
    ctx.beginPath();
    ctx.arc(cx, cy, TILE * 0.34, 0, Math.PI * 2);
    ctx.fillStyle = m.color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#111';
    ctx.stroke();
    ctx.fillStyle = '#111';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(m.hp, cx, cy + 1);
  }

  // 主角
  if (!gameOver || victory) {
    const cx = player.x * TILE + TILE / 2;
    const cy = player.y * TILE + TILE / 2;
    ctx.beginPath();
    ctx.arc(cx, cy, TILE * 0.34, 0, Math.PI * 2);
    ctx.fillStyle = '#4fd1ff';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#a8ecff';
    ctx.stroke();
  }
}

// ===== 鍵盤 =====
document.addEventListener('keydown', (e) => {
  if (gameOver) return;
  switch (e.key) {
    case 'ArrowUp':    case 'w': case 'W': move(0, -1); break;
    case 'ArrowDown':  case 's': case 'S': move(0,  1); break;
    case 'ArrowLeft':  case 'a': case 'A': move(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': move( 1, 0); break;
    default: return;
  }
  e.preventDefault();
});

// ===== 虛擬按鍵 =====
document.querySelectorAll('#dpad button').forEach(btn => {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (gameOver) return;
    const d = btn.dataset.dir;
    if (d === 'up')         move(0, -1);
    else if (d === 'down')  move(0,  1);
    else if (d === 'left')  move(-1, 0);
    else if (d === 'right') move( 1, 0);
  });
});

// ===== 啟動 =====
initGame();
</script>
</body>
</html>
