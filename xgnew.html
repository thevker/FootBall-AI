<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>xG 賽事分析器 (五維雷達版)</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #121212; color: #e0e0e0; margin: 0; padding: 15px; 
            display: flex; justify-content: center; min-height: 100vh; -webkit-overflow-scrolling: touch;
        }
        .container { 
            background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            width: 100%; max-width: 500px; position: relative; margin-bottom: 30px;
        }
        h2 { text-align: center; color: #ffffff; margin-top: 0; font-size: 22px; }
        p.subtitle { font-size: 13px; color: #aaaaaa; text-align: center; margin-bottom: 20px; }
        
        #errorMessage {
            display: none; background-color: #331a1a; color: #ff4d4d; padding: 12px; 
            border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px;
            border: 1px solid #7a3a3a; animation: shake 0.4s;
        }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

        .input-section { margin-bottom: 20px; }
        .section-header { font-size: 15px; font-weight: bold; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #333; }
        .section-header.home { color: #ff6b6b; }
        .section-header.away { color: #6b9fff; }

        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-box { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #bbbbbb; }
        input[type="text"] { 
            width: 100%; padding: 8px; background-color: #2d2d2d; border: 1px solid #444; 
            color: #ffffff; border-radius: 6px; font-size: 16px; outline: none; transition: border 0.2s; 
        }
        input[type="text"]:focus { border-color: #4da6ff; }

        button { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-calculate { background: #3a7bd5; color: white; }
        .btn-calculate:hover { background: #2a5fa5; }
        .btn-clear { background: #5a2a2a; color: #ff9999; margin-top: 10px; border: 1px solid #7a3a3a; }
        .btn-clear:hover { background: #7a3a3a; color: white; }
        
        #result { margin-top: 25px; display: none; padding-top: 20px; border-top: 1px solid #333; }
        
        /* 雙結果並排 */
        .dual-result-container { display: flex; gap: 10px; margin-bottom: 15px; }
        .result-box { 
            flex: 1; text-align: center; padding: 12px 5px; border-radius: 8px; border: 2px dashed;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .result-title { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #aaa; }
        .result-value { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .result-diff { font-size: 11px; color: #aaa; margin-bottom: 5px; }
        .result-margin { font-size: 12px; font-weight: bold; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
        
        .result-box.full-width { flex: none; width: 100%; padding: 15px; margin-bottom: 20px; }
        .result-box.full-width .result-title { font-size: 14px; }
        .result-box.full-width .result-value { font-size: 28px; }
        .result-box.full-width .result-diff { font-size: 13px; }
        
        .dual-indicator {
            display: flex; justify-content: center; margin-top: 10px; padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; color: #ccc; gap: 20px;
        }
        .dual-item { text-align: center; }
        .dual-val { font-weight: bold; font-size: 14px; color: #fff; margin-top: 2px; }

        .section-box { background: #252525; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .section-title { font-size: 14px; font-weight: bold; margin-bottom: 15px; color: #dddddd; border-left: 4px solid #4da6ff; padding-left: 8px; }

        .radar-container {
            display: flex; justify-content: center; align-items: center; gap: 5px;
            margin-bottom: 20px; padding: 10px 0; background: #1a1a1a; border-radius: 8px; border: 1px solid #333;
        }
        .radar-box { display: flex; flex-direction: column; align-items: center; }
        .radar-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .radar-title.home { color: #ff6b6b; }
        .radar-title.away { color: #6b9fff; }
        svg { width: 150px; height: 150px; }

        .team-rating-block { margin-bottom: 20px; }
        .team-rating-block:last-child { margin-bottom: 0; }
        .team-name { font-size: 15px; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }

        @keyframes glow-green { 0% { box-shadow: 0 0 2px #4ade80; } 50% { box-shadow: 0 0 10px #4ade80; } 100% { box-shadow: 0 0 2px #4ade80; } }
        @keyframes glow-cyan { 0% { box-shadow: 0 0 2px #0adeff; } 50% { box-shadow: 0 0 10px #0adeff; } 100% { box-shadow: 0 0 2px #0adeff; } }
        .status-glow-green { color: #4ade80 !important; background-color: #1c3b24 !important; animation: glow-green 1.5s infinite alternate; }
        .status-glow-cyan { color: #0adeff !important; background-color: #0e2e36 !important; animation: glow-cyan 1.5s infinite alternate; text-shadow: 0 0 5px rgba(10, 222, 255, 0.5); }

        .rating-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 12px; }
        .rating-label { width: 50px; font-weight: bold; color: #aaa; }
        .rating-bar-bg { flex: 1; background: #1a1a1a; height: 16px; border-radius: 8px; overflow: hidden; margin: 0 10px; position: relative; border: 1px solid #333; }
        .rating-bar-fill { height: 100%; border-radius: 8px; transition: width 0.5s ease; }
        
        .bar-attack { background: #ff6b6b; }
        .bar-defense { background: #6b9fff; }
        .bar-status { background: #fbc02d; }
        .bar-rank { background: #9b59b6; }
        .bar-odds { background: #4caf50; }
        
        .rating-display { width: 75px; text-align: right; font-weight: bold; font-size: 13px; display: flex; justify-content: flex-end; align-items: center; }
        .overall-row { display: flex; justify-content: space-between; background: #1e1e1e; padding: 10px; border-radius: 6px; margin-top: 15px; border: 1px solid #444; align-items: center; }
        .overall-label { font-weight: bold; color: #ccc; font-size: 13px; }
        .overall-value { font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 xG 賽事分析器</h2>
    <p class="subtitle">雙結果顯示 | 五維雷達圖</p>
    
    <div id="errorMessage">⚠️ 數據不完整，請填寫所有輸入欄位！</div>

    <div class="input-section">
        <div class="section-header home">🏠 主隊數據</div>
        <div class="input-row">
            <div class="input-box"><label>狀態 (0-3)</label><input type="text" inputmode="decimal" id="homeStatus" placeholder="例：1.50" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            <div class="input-box"></div>
        </div>
        <div class="input-row">
            <div class="input-box"><label>得分</label><input type="text" inputmode="decimal" id="homeGoals" placeholder="例：1.50" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            <div class="input-box"><label>失球</label><input type="text" inputmode="decimal" id="homeConceded" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div>
        </div>
        <div class="input-row">
            <div class="input-box"><label>主隊 xG</label><input type="text" inputmode="decimal" id="homeXg" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            <div class="input-box"><label>主隊 xGA</label><input type="text" inputmode="decimal" id="homeXga" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div>
        </div>
        <div class="input-row">
            <div class="input-box"><label>排名 (1-99)</label><input type="text" inputmode="numeric" id="homeRank" placeholder="例：5" oninput="limitInteger(this)"></div>
            <div class="input-box"><label>賠率</label><input type="text" inputmode="decimal" id="homeOdds" placeholder="例：1.67" oninput="limitInput(this)" onblur="formatInput(this)"></div>
        </div>
    </div>

    <div class="input-section">
        <div class="section-header away">✈️ 客隊數據</div>
        <div class="input-row">
            <div class="input-box"><label>狀態 (0-3)</label><input type="text" inputmode="decimal" id="awayStatus" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            <div class="input-box"></div>
        </div>
        <div class="input-row">
            <div class="input-box"><label>得分</label><input type="text" inputmode="decimal" id="awayGoals" placeholder="例：0.50" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            <div class="input-box"><label>失球</label><input type="text" inputmode="decimal" id="awayConceded" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div>
        </div>
        <div class="input-row">
            <div class="input-box"><label>客隊 xG</label><input type="text" inputmode="decimal" id="awayXg" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            <div class="input-box"><label>客隊 xGA</label><input type="text" inputmode="decimal" id="awayXga" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div>
        </div>
        <div class="input-row">
            <div class="input-box"><label>排名 (1-99)</label><input type="text" inputmode="numeric" id="awayRank" placeholder="例：10" oninput="limitInteger(this)"></div>
            <div class="input-box"><label>賠率</label><input type="text" inputmode="decimal" id="awayOdds" placeholder="例：1.27" oninput="limitInput(this)" onblur="formatInput(this)"></div>
        </div>
    </div>

    <button class="btn-calculate" onclick="calculate()">開始分析</button>
    <button class="btn-clear" onclick="clearData()">清除數據</button>

    <div id="result">
        <div class="dual-result-container">
            <div class="result-box" id="newBox">
                <div class="result-title">新版 (預期對碰)</div>
                <div class="result-value" id="newValue">-</div>
                <div class="result-diff" id="newDiff">差距值：-</div>
                <div class="result-margin" id="newMargin">預計淨勝：-</div>
            </div>
            <div class="result-box" id="oldBox">
                <div class="result-title">舊版 (攻防相減)</div>
                <div class="result-value" id="oldValue">-</div>
                <div class="result-diff" id="oldDiff">差距值：-</div>
                <div class="result-margin" id="oldMargin">預計淨勝：-</div>
            </div>
        </div>

        <div class="result-box full-width" id="goalsResultBox">
            <div class="result-title">預測大小 (2.5球)</div>
            <div class="result-value" id="goalsResultValue">-</div>
            <div class="dual-indicator">
                <div class="dual-item">
                    <div>計算差距值 (最低為0)</div>
                    <div class="dual-val" id="goalsIndicatorValue">-</div>
                </div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">📊 球隊五維實力評級</div>
            <div class="radar-container">
                <div class="radar-box"><div class="radar-title home">主隊</div><svg id="radar-home" viewBox="0 0 200 200"></svg></div>
                <div class="radar-box"><div class="radar-title away">客隊</div><svg id="radar-away" viewBox="0 0 200 200"></svg></div>
            </div>

            <div class="team-rating-block">
                <div class="team-name">
                    <span style="color: #ff6b6b;">🏠 主隊</span>
                    <span class="badge" id="hStyle">-</span>
                    <span class="badge" id="hStatusBadge">-</span>
                </div>
                <div class="rating-row"><div class="rating-label">進攻</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-attack" id="hAttBar"></div></div><div class="rating-display" id="hAttDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">防守</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-defense" id="hDefBar"></div></div><div class="rating-display" id="hDefDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">狀態</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-status" id="hStatBar"></div></div><div class="rating-display" id="hStatDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">排名</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-rank" id="hRankBar"></div></div><div class="rating-display" id="hRankDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">賠率</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-odds" id="hOddsBar"></div></div><div class="rating-display" id="hOddsDisplay">-</div></div>
                <div class="overall-row"><span class="overall-label">綜合總實力 (僅計前三項)</span><span class="overall-value" id="hOverall">E (0.0)</span></div>
            </div>

            <div class="team-rating-block">
                <div class="team-name">
                    <span style="color: #6b9fff;">✈️ 客隊</span>
                    <span class="badge" id="aStyle">-</span>
                    <span class="badge" id="aStatusBadge">-</span>
                </div>
                <div class="rating-row"><div class="rating-label">進攻</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-attack" id="aAttBar"></div></div><div class="rating-display" id="aAttDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">防守</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-defense" id="aDefBar"></div></div><div class="rating-display" id="aDefDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">狀態</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-status" id="aStatBar"></div></div><div class="rating-display" id="aStatDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">排名</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-rank" id="aRankBar"></div></div><div class="rating-display" id="aRankDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">賠率</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-odds" id="aOddsBar"></div></div><div class="rating-display" id="aOddsDisplay">-</div></div>
                <div class="overall-row"><span class="overall-label">綜合總實力 (僅計前三項)</span><span class="overall-value" id="aOverall">E (0.0)</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    function limitInput(input) {
        let val = input.value.replace(/[^0-9.]/g, '');
        let parts = val.split('.');
        if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
        if (val.replace(/\./g, '').length > 4) {
            let newVal = '', count = 0;
            for (let char of val) { if (char !== '.') { if (count >= 4) break; count++; } newVal += char; }
            val = newVal;
        }
        input.value = val;
    }

    function formatInput(input) {
        let val = input.value;
        if (!val || val === '.') { input.value = ''; return; }
        if (!val.includes('.')) {
            if (val.length === 3) val = val.substring(0, 1) + '.' + val.substring(1);
            else if (val.length === 2) {
                let num = parseInt(val);
                val = num > 30 ? '0.' + val : val.substring(0, 1) + '.' + val.substring(1) + '0';
            } else if (val.length === 1) val = val + '.00';
        } else {
            let parts = val.split('.');
            val = (parts[0] || '0') + '.' + (parts[1] || '').padEnd(2, '0').substring(0, 2);
        }
        let num = parseFloat(val);
        input.value = isNaN(num) ? '0.00' : num.toFixed(2);
    }

    function limitInteger(input) {
        let val = input.value.replace(/[^0-9]/g, '');
        if (val.length > 2) val = val.substring(0, 2);
        input.value = val;
    }

    function clearData() {
        const ids = ['homeStatus', 'homeXg', 'homeXga', 'homeGoals', 'homeConceded', 'homeRank', 'homeOdds',
                     'awayStatus', 'awayXg', 'awayXga', 'awayGoals', 'awayConceded', 'awayRank', 'awayOdds'];
        ids.forEach(id => document.getElementById(id).value = '');
        document.getElementById('result').style.display = 'none';
        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('radar-home').innerHTML = '';
        document.getElementById('radar-away').innerHTML = '';
    }

    function getGradeByPercent(pct) {
        if (pct < 20) return { grade: 'E', color: '#c0c0c0' };
        if (pct < 40) return { grade: 'D', color: '#cd7f32' };
        if (pct < 60) return { grade: 'C', color: '#ff4d4d' };
        if (pct < 75) return { grade: 'B', color: '#4ade80' };
        if (pct < 85) return { grade: 'A', color: '#4da6ff' };
        if (pct < 95) return { grade: 'S', color: '#FFD700' };
        return { grade: 'EX', color: '#9b59b6' };
    }

    function drawRadar(svgId, data, color, fillColor) {
        const svg = document.getElementById(svgId);
        svg.innerHTML = ''; 
        const cx = 100, cy = 100, maxR = 65, numAxes = 5;
        const angleStep = (Math.PI * 2) / numAxes;
        const startAngle = -Math.PI / 2; 
        const labels = ['ATK', 'DEF', 'STA', 'RNK', 'ODD'];

        for (let l = 1; l <= 4; l++) {
            const r = (maxR / 4) * l;
            let points = [];
            for (let i = 0; i < numAxes; i++) {
                const angle = startAngle + i * angleStep;
                points.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
            }
            const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            polygon.setAttribute('points', points.join(' '));
            polygon.setAttribute('fill', 'none'); polygon.setAttribute('stroke', '#444'); polygon.setAttribute('stroke-width', '1');
            svg.appendChild(polygon);
        }

        for (let i = 0; i < numAxes; i++) {
            const angle = startAngle + i * angleStep;
            const x = cx + maxR * Math.cos(angle), y = cy + maxR * Math.sin(angle);
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', cx); line.setAttribute('y1', cy); line.setAttribute('x2', x); line.setAttribute('y2', y); line.setAttribute('stroke', '#444'); line.setAttribute('stroke-width', '1');
            svg.appendChild(line);

            const labelR = maxR + 15;
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', cx + labelR * Math.cos(angle));
            text.setAttribute('y', cy + labelR * Math.sin(angle));
            text.setAttribute('fill', '#aaa'); text.setAttribute('font-size', '10'); text.setAttribute('font-weight', 'bold'); text.setAttribute('text-anchor', 'middle'); text.setAttribute('dominant-baseline', 'middle');
            text.textContent = labels[i];
            svg.appendChild(text);
        }

        let dataPoints = [];
        for (let i = 0; i < numAxes; i++) {
            let pct = Math.max(data[i], 5) / 100; 
            const r = maxR * pct, angle = startAngle + i * angleStep;
            dataPoints.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
        }
        const dataPolygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        dataPolygon.setAttribute('points', dataPoints.join(' '));
        dataPolygon.setAttribute('fill', fillColor); dataPolygon.setAttribute('stroke', color); dataPolygon.setAttribute('stroke-width', '2');
        svg.appendChild(dataPolygon);
    }

    function updateTeamUI(prefix, att, def, status, rankPct, oddsPct) {
        let attPct = Math.min(Math.max(((att - 0.5) / 2.0) * 100, 0), 100);
        let defPct = Math.min(Math.max(((def - 0.5) / 2.0) * 100, 0), 100);
        let statPct = Math.min(Math.max((status / 3.0) * 100, 0), 100);

        document.getElementById(prefix + 'AttBar').style.width = Math.max(attPct, 1) + '%';
        document.getElementById(prefix + 'DefBar').style.width = Math.max(defPct, 1) + '%';
        document.getElementById(prefix + 'StatBar').style.width = Math.max(statPct, 1) + '%';
        document.getElementById(prefix + 'RankBar').style.width = Math.max(rankPct, 1) + '%';
        document.getElementById(prefix + 'OddsBar').style.width = Math.max(oddsPct, 1) + '%';

        const attData = getGradeByPercent(attPct), defData = getGradeByPercent(defPct), statData = getGradeByPercent(statPct);
        const rankData = getGradeByPercent(rankPct), oddsData = getGradeByPercent(oddsPct);

        document.getElementById(prefix + 'AttDisplay').innerText = `${attData.grade} (${attPct.toFixed(1)})`;
        document.getElementById(prefix + 'AttDisplay').style.color = attData.color;
        document.getElementById(prefix + 'DefDisplay').innerText = `${defData.grade} (${defPct.toFixed(1)})`;
        document.getElementById(prefix + 'DefDisplay').style.color = defData.color;
        document.getElementById(prefix + 'StatDisplay').innerText = `${statData.grade} (${statPct.toFixed(1)})`;
        document.getElementById(prefix + 'StatDisplay').style.color = statData.color;
        document.getElementById(prefix + 'RankDisplay').innerText = `${rankData.grade} (${rankPct.toFixed(1)})`;
        document.getElementById(prefix + 'RankDisplay').style.color = rankData.color;
        document.getElementById(prefix + 'OddsDisplay').innerText = `${oddsData.grade} (${oddsPct.toFixed(1)})`;
        document.getElementById(prefix + 'OddsDisplay').style.color = oddsData.color;

        // 🔥 綜合總實力只算前三項，不含排名與賠率
        const overallPct = (attPct + defPct + statPct) / 3;
        const overallData = getGradeByPercent(overallPct);
        const overallEl = document.getElementById(prefix + 'Overall');
        overallEl.innerText = `${overallData.grade} (${overallPct.toFixed(1)})`;
        overallEl.style.color = overallData.color;

        drawRadar(prefix === 'h' ? 'radar-home' : 'radar-away', [attPct, defPct, statPct, rankPct, oddsPct], 
            prefix === 'h' ? '#ff6b6b' : '#6b9fff', prefix === 'h' ? 'rgba(255, 107, 107, 0.3)' : 'rgba(107, 159, 255, 0.3)');

        const styleEl = document.getElementById(prefix + 'Style');
        const pctDiff = Math.round((attPct - defPct) * 10) / 10;
        if (pctDiff >= 25.0) { styleEl.innerText = "進攻型"; styleEl.style.color = "#ff8c8c"; styleEl.style.backgroundColor = "#3b1c1c"; }
        else if (pctDiff <= -25.0) { styleEl.innerText = "防守型"; styleEl.style.color = "#8cb8ff"; styleEl.style.backgroundColor = "#1a2633"; }
        else { styleEl.innerText = "平衡型"; styleEl.style.color = "#ccc"; styleEl.style.backgroundColor = "#333"; }

        const statusBadge = document.getElementById(prefix + 'StatusBadge');
        statusBadge.className = 'badge'; statusBadge.style.color = ''; statusBadge.style.backgroundColor = ''; 
        if (status >= 3.0) { statusBadge.innerText = "狀態極佳"; statusBadge.classList.add('status-glow-cyan'); }
        else if (status >= 2.0) { statusBadge.innerText = "狀態良好"; statusBadge.classList.add('status-glow-green'); }
        else if (status >= 1.0) { statusBadge.innerText = "狀態一般"; statusBadge.style.color = "#ffd700"; statusBadge.style.backgroundColor = "#3b331c"; }
        else { statusBadge.innerText = "狀態欠佳"; statusBadge.style.color = "#ff4d4d"; statusBadge.style.backgroundColor = "#3b1c1c"; }

        return overallPct;
    }

    function applyResultUI(prefix, finalResult, diffDisplay, predictedMargin) {
        const box = document.getElementById(prefix + 'Box');
        const valueEl = document.getElementById(prefix + 'Value');
        const diffEl = document.getElementById(prefix + 'Diff');
        const marginEl = document.getElementById(prefix + 'Margin');

        diffEl.innerText = `差距值：${diffDisplay}`;
        
        if (predictedMargin > 0.05) { marginEl.innerText = `預計淨勝：主隊 ${predictedMargin.toFixed(2)} 球`; marginEl.style.color = '#4ade80'; }
        else if (predictedMargin < -0.05) { marginEl.innerText = `預計淨勝：客隊 ${Math.abs(predictedMargin).toFixed(2)} 球`; marginEl.style.color = '#f87171'; }
        else { marginEl.innerText = `預計淨勝：0.00 球 (平手)`; marginEl.style.color = '#aaa'; }

        if (finalResult === "home") { valueEl.innerText = "主勝"; valueEl.style.color = "#4ade80"; box.style.borderColor = "#4ade80"; box.style.backgroundColor = "#1a3324"; }
        else if (finalResult === "away") { valueEl.innerText = "客勝"; valueEl.style.color = "#f87171"; box.style.borderColor = "#f87171"; box.style.backgroundColor = "#331a1a"; }
        else if (finalResult === "draw") { valueEl.innerText = "和局"; valueEl.style.color = "#ffd700"; box.style.borderColor = "#ffd700"; box.style.backgroundColor = "#332d1a"; }
        else { valueEl.innerText = "不建議"; valueEl.style.color = "#aaa"; box.style.borderColor = "#555"; box.style.backgroundColor = "#2a2a2a"; }
    }

    function calculate() {
        const hXgStr = document.getElementById('homeXg').value;
        const hXgaStr = document.getElementById('homeXga').value;
        const hStatusStr = document.getElementById('homeStatus').value;
        const hGoalsStr = document.getElementById('homeGoals').value;
        const hConcededStr = document.getElementById('homeConceded').value;
        const hRankStr = document.getElementById('homeRank').value;
        const hOddsStr = document.getElementById('homeOdds').value;

        const aXgStr = document.getElementById('awayXg').value;
        const aXgaStr = document.getElementById('awayXga').value;
        const aStatusStr = document.getElementById('awayStatus').value;
        const aGoalsStr = document.getElementById('awayGoals').value;
        const aConcededStr = document.getElementById('awayConceded').value;
        const aRankStr = document.getElementById('awayRank').value;
        const aOddsStr = document.getElementById('awayOdds').value;

        if (!hXgStr || !hXgaStr || !hStatusStr || !hGoalsStr || !hConcededStr || !hRankStr || !hOddsStr ||
            !aXgStr || !aXgaStr || !aStatusStr || !aGoalsStr || !aConcededStr || !aRankStr || !aOddsStr) {
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            return;
        }
        document.getElementById('errorMessage').style.display = 'none';

        const hXg = parseFloat(hXgStr) || 0, hXga = parseFloat(hXgaStr) || 0, hStatus = parseFloat(hStatusStr) || 0;
        const aXg = parseFloat(aXgStr) || 0, aXga = parseFloat(aXgaStr) || 0, aStatus = parseFloat(aStatusStr) || 0;
        const hGoals = parseFloat(hGoalsStr) || 0, hConceded = parseFloat(hConcededStr) || 0;
        const aGoals = parseFloat(aGoalsStr) || 0, aConceded = parseFloat(aConcededStr) || 0;
        const hRank = parseInt(hRankStr) || 0, hOdds = parseFloat(hOddsStr) || 0;
        const aRank = parseInt(aRankStr) || 0, aOdds = parseFloat(aOddsStr) || 0;

        // 排名比例 (排名越小越好)
        let totalRank = hRank + aRank;
        let hRankPct = totalRank > 0 ? (aRank / totalRank) * 100 : 50;
        let aRankPct = totalRank > 0 ? (hRank / totalRank) * 100 : 50;

        // 賠率比例
        let totalOdds = hOdds + aOdds;
        let hOddsPct = totalOdds > 0 ? (aOdds / totalOdds) * 100 : 50;
        let aOddsPct = totalOdds > 0 ? (hOdds / totalOdds) * 100 : 50;

        // 得分加權 (影響 xG)
        let totalGoals = hGoals + aGoals;
        let hGoalAdj = 0, aGoalAdj = 0;
        if (totalGoals > 0) {
            hGoalAdj = (hGoals / totalGoals) - 0.5;
            aGoalAdj = (aGoals / totalGoals) - 0.5;
        }

        // 失球加權 (影響 xGA)
        let totalConceded = hConceded + aConceded;
        let hConcAdj = 0, aConcAdj = 0;
        if (totalConceded > 0) {
            hConcAdj = (hConceded / totalConceded) - 0.5;
            aConcAdj = (aConceded / totalConceded) - 0.5;
        }

        // 最終調整值
        const hXgAdjVal = hXg * (1 + hGoalAdj);
        const aXgAdjVal = aXg * (1 + aGoalAdj);
        const hXgaAdjVal = hXga * (1 + hConcAdj);
        const aXgaAdjVal = aXga * (1 + aConcAdj);

        // 用於畫圖與前三項平均的值
        let hAttUI = hXgAdjVal;
        let hDefUI = Math.max(0, 3.0 - hXgaAdjVal);
        let aAttUI = aXgAdjVal;
        let aDefUI = Math.max(0, 3.0 - aXgaAdjVal);

        const hOverallPct = updateTeamUI('h', hAttUI, hDefUI, hStatus, hRankPct, hOddsPct);
        const aOverallPct = updateTeamUI('a', aAttUI, aDefUI, aStatus, aRankPct, aOddsPct);

        const gap = hOverallPct - aOverallPct;

        // 1. 新版：預期進球對碰
        const expHomeGoals = (hXgAdjVal + aXgaAdjVal) / 2;
        const expAwayGoals = (aXgAdjVal + hXgaAdjVal) / 2;
        const marginNew = expHomeGoals - expAwayGoals;
        let finalResultNew = "";
        let diffDisplayNew = (marginNew > 0 ? '+' : '') + marginNew.toFixed(2);

        if (gap >= 30) { finalResultNew = "home"; diffDisplayNew = `+${marginNew.toFixed(2)} (實力碾壓)`; }
        else if (gap <= -30) { finalResultNew = "away"; diffDisplayNew = `${marginNew.toFixed(2)} (實力碾壓)`; }
        else {
            if (marginNew >= 0.3) finalResultNew = "home"; 
            else if (marginNew <= -0.3) finalResultNew = "away"; 
            else { finalResultNew = "draw"; diffDisplayNew = (marginNew > 0 ? '+' : '') + marginNew.toFixed(2) + ` (膠著)`; }

            if (finalResultNew === "home") {
                if (gap < -15) { finalResultNew = "avoid"; diffDisplayNew += ` (實力不符)`; }
                else if (gap <= 15) { finalResultNew = "draw"; diffDisplayNew += ` (差距不足)`; }
            } else if (finalResultNew === "away") {
                if (gap > 15) { finalResultNew = "avoid"; diffDisplayNew += ` (實力不符)`; }
                else if (gap >= -15) { finalResultNew = "draw"; diffDisplayNew += ` (差距不足)`; }
            }
        }
        applyResultUI('new', finalResultNew, diffDisplayNew, marginNew);

        // 2. 舊版：攻防相減
        const hAdvantage = Math.max(0, hAttUI - aDefUI);
        const aAdvantage = Math.max(0, aAttUI - hDefUI);
        const marginOld = hAdvantage - aAdvantage;
        let finalResultOld = "";
        let diffDisplayOld = (marginOld > 0 ? '+' : '') + marginOld.toFixed(2);

        if (marginOld >= 0.3) {
            finalResultOld = "home";
        } else if (marginOld <= -0.3) {
            finalResultOld = "away";
        } else {
            finalResultOld = "draw";
            diffDisplayOld = (marginOld > 0 ? '+' : '') + marginOld.toFixed(2) + ` (膠著)`;
        }
        applyResultUI('old', finalResultOld, diffDisplayOld, marginOld);

        // 3. 大小球公式
        const homeDefense = 3.00 - aXgaAdjVal;
        const awayDefense = 3.00 - hXgaAdjVal;
        
        const hAdv = Math.max(0, hXgAdjVal - homeDefense);
        const aAdv = Math.max(0, aXgAdjVal - awayDefense);
        
        const goalsDiff = hAdv + aAdv;

        const goalsResultBox = document.getElementById('goalsResultBox');
        const goalsResultValue = document.getElementById('goalsResultValue');
        const goalsIndicatorValue = document.getElementById('goalsIndicatorValue');

        goalsIndicatorValue.innerText = goalsDiff.toFixed(2);

        let recommendation = "", boxColor = "", bgColor = "", textColor = "";

        if (goalsDiff <= 0.5) {
            recommendation = "建議 2.5 入球細"; textColor = "#8cb8ff"; boxColor = "#8cb8ff"; bgColor = "#1a2633";
        } else if (goalsDiff >= 1.5) {
            recommendation = "建議 2.5 入球大"; textColor = "#f87171"; boxColor = "#f87171"; bgColor = "#331a1a";
        } else {
            recommendation = "方向模糊 (不建議)"; textColor = "#aaa"; boxColor = "#555"; bgColor = "#2a2a2a";
        }

        goalsResultValue.innerText = recommendation;
        goalsResultValue.style.color = textColor;
        goalsResultBox.style.borderColor = boxColor;
        goalsResultBox.style.backgroundColor = bgColor;

        document.getElementById('result').style.display = 'block';
    }
</script>
