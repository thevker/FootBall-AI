<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>xG 賽事分析器 (四重驗證終極版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #121212; color: #e0e0e0; margin: 0; padding: 10px; 
            display: flex; justify-content: center; min-height: 100vh; -webkit-overflow-scrolling: touch;
        }
        .container { 
            background: #1a1a1a; padding: 15px; border-radius: 12px; 
            width: 100%; max-width: 500px; position: relative; margin-bottom: 20px;
        }
        h2 { text-align: center; color: #ffffff; margin-top: 0; font-size: 20px; margin-bottom: 5px; }
        p.subtitle { font-size: 12px; color: #aaaaaa; text-align: center; margin-bottom: 15px; }
        
        #errorMessage {
            display: none; background-color: #331a1a; color: #ff4d4d; padding: 10px; 
            border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 10px;
            border: 1px solid #7a3a3a; animation: shake 0.4s;
        }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

        #inputSection { transition: opacity 0.3s; }
        .input-section { margin-bottom: 15px; }
        .section-header { font-size: 14px; font-weight: bold; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #333; }
        .section-header.home { color: #ff6b6b; }
        .section-header.away { color: #6b9fff; }

        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-box { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        label { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #bbbbbb; }
        input[type="text"] { 
            width: 100%; padding: 12px 8px; background-color: #2d2d2d; border: 1px solid #444; 
            color: #ffffff; border-radius: 6px; font-size: 16px; outline: none; transition: border 0.2s; 
            text-align: center;
        }
        input[type="text"]:focus { border-color: #4da6ff; }

        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-calculate { background: #3a7bd5; color: white; }
        .btn-calculate:hover { background: #2a5fa5; }
        .btn-clear { background: #5a2a2a; color: #ff9999; margin-top: 8px; border: 1px solid #7a3a3a; }
        .btn-clear:hover { background: #7a3a3a; color: white; }
        
        #result { display: none; }
        
        .result-card {
            background: #222222;
            border: 1px solid #3a3a3a;
            border-radius: 24px;
            padding: 15px 18px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-card {
            padding: 10px;
            margin-bottom: 15px;
            display: flex; gap: 10px;
        }
        .btn-action { 
            flex: 1; color:#fff; padding:10px; font-size:14px; 
            border-radius:14px; border:none; cursor:pointer; font-weight: bold;
        }
        .btn-save { background:#28a745; }
        .btn-save:hover { background:#218838; }
        .btn-return { background:#444; }
        .btn-return:hover { background:#555; }

        /* 四重預測排版 (2x2 網格) */
        .quad-result-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            margin-bottom: 12px; 
        }
        .result-box { 
            text-align: center; padding: 8px 4px; border-radius: 12px; border: 2px dashed;
            display: flex; flex-direction: column; justify-content: center;
        }
        .result-title { 
            font-size: 11px; font-weight: bold; margin-bottom: 2px; color: #aaa; 
            display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .result-title span { font-size: 10px; color: #fff; }
        .result-value { font-size: 16px; font-weight: bold; margin-bottom: 0; }

        /* 終極預測與大小球 */
        .ultimate-box {
            text-align: center; padding: 12px; border-radius: 12px; border: 2px solid #ffd700; 
            background-color: #2a2a1a; margin-bottom: 12px;
        }
        .ultimate-title { font-size: 13px; font-weight: bold; color: #ffd700; margin-bottom: 4px; }
        .ultimate-value { font-size: 24px; font-weight: bold; color: #fff; }

        .goals-box {
            text-align: center; padding: 10px; border-radius: 12px; border: 2px solid #555; 
            background-color: #222; margin-bottom: 12px;
        }
        .goals-title { font-size: 13px; font-weight: bold; color: #aaa; margin-bottom: 6px; }
        .goals-value { font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 6px; }
        .goals-sub { font-size: 12px; color: #ccc; display: flex; justify-content: center; gap: 15px; }

        .bet-box {
            text-align: center; padding: 10px; border-radius: 12px; 
            border: 2px solid #555; background-color: #222;
        }
        .bet-title { font-size: 12px; color: #aaa; font-weight: bold; margin-bottom: 4px; }
        .bet-value { font-size: 20px; font-weight: bold; color: #888; }

        .divider { height: 1px; background: #333; margin: 15px 0; }

        .section-title { font-size: 14px; font-weight: bold; margin-bottom: 15px; color: #dddddd; text-align: center; }

        /* 評級區塊 */
        .radar-container {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; padding: 10px 15px; background: #181818; border-radius: 16px; border: 1px solid #333;
            position: relative;
        }
        
        .vertical-text { 
            width: 30px;
            font-size: 14px; font-weight: bold; text-align: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            line-height: 1.2;
        }
        .vertical-text.home { color: #ff6b6b; }
        .vertical-text.away { color: #6b9fff; }

        .radar-svg-box { flex: 1; display: flex; justify-content: space-around; align-items: center; }
        svg { width: 135px; height: 135px; }

        .team-rating-block { margin-bottom: 15px; position: relative; }
        .team-rating-block:last-child { margin-bottom: 0; }

        .team-header {
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 8px; min-height: 24px; white-space: nowrap;
        }
        .left-area { flex: 1; display: flex; justify-content: flex-start; align-items: center; gap: 6px; }
        .right-area { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }

        .team-title { font-size: 14px; font-weight: bold; }
        .badge { font-size: 10px; padding: 3px 6px; border-radius: 10px; font-weight: bold; white-space: nowrap; }
        
        .overall-badge {
            font-size: 11px; padding: 3px 6px; border-radius: 8px; 
            background-color: #333; border: 1px solid #555; white-space: nowrap;
        }

        @keyframes glow-green { 0% { box-shadow: 0 0 2px #4ade80; } 50% { box-shadow: 0 0 8px #4ade80; } 100% { box-shadow: 0 0 2px #4ade80; } }
        @keyframes glow-cyan { 0% { box-shadow: 0 0 2px #0adeff; } 50% { box-shadow: 0 0 8px #0adeff; } 100% { box-shadow: 0 0 2px #0adeff; } }
        .status-glow-green { color: #4ade80 !important; background-color: #1c3b24 !important; animation: glow-green 1.5s infinite alternate; }
        .status-glow-cyan { color: #0adeff !important; background-color: #0e2e36 !important; animation: glow-cyan 1.5s infinite alternate; text-shadow: 0 0 5px rgba(10, 222, 255, 0.5); }

        @keyframes glow-gold { 0% { box-shadow: 0 0 2px #FFD700; } 50% { box-shadow: 0 0 8px #FFD700; } 100% { box-shadow: 0 0 2px #FFD700; } }
        @keyframes glow-silver { 0% { box-shadow: 0 0 2px #f4f4f4; } 50% { box-shadow: 0 0 8px #f4f4f4; } 100% { box-shadow: 0 0 2px #f4f4f4; } }
        @keyframes glow-bronze { 0% { box-shadow: 0 0 2px #cd7f32; } 50% { box-shadow: 0 0 8px #cd7f32; } 100% { box-shadow: 0 0 2px #cd7f32; } }
        .rank-glow-gold { color: #FFD700 !important; background-color: #3b331c !important; animation: glow-gold 1.5s infinite alternate; }
        .rank-glow-silver { color: #f4f4f4 !important; background-color: #666 !important; animation: glow-silver 1.5s infinite alternate; }
        .rank-glow-bronze { color: #cd7f32 !important; background-color: #3b1c1c !important; animation: glow-bronze 1.5s infinite alternate; }

        .rating-row { display: flex; align-items: center; margin-bottom: 6px; font-size: 11px; }
        .rating-label { width: 55px; font-weight: bold; color: #aaa; text-align: right; padding-right: 6px; } 
        .rating-display { width: 55px; text-align: left; font-weight: bold; font-size: 11px; padding-left: 6px; }
        .rating-bar-bg { flex: 1; background: #181818; height: 18px; border-radius: 6px; overflow: hidden; position: relative; border: 1px solid #333; }
        .rating-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        
        .bar-attack { background: #ff6b6b; }
        .bar-defense { background: #6b9fff; }
        .bar-status { background: #fbc02d; }
        .bar-odds { background: #4caf50; }
        .bar-rank { background: #00e5ff; }

        #imageModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9); z-index: 9999;
            justify-content: center; align-items: center; flex-direction: column; padding: 20px;
        }
        #imageModal img {
            max-width: 100%; max-height: 80vh; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .modal-hint { color: #fff; font-size: 14px; font-weight: bold; margin-top: 15px; text-align: center; }
        .modal-close {
            margin-top: 15px; padding: 10px 20px; background: #3a7bd5; color: white; 
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 xG 賽事分析器</h2>
    <p class="subtitle">四重驗證終極版</p>
    
    <div id="errorMessage">⚠️ 數據不完整，請填寫所有輸入欄位！</div>

    <div id="inputSection">
        <div class="input-section">
            <div class="section-header home">🏠 主隊數據</div>
            <div class="input-row">
                <div class="input-box"><label>狀態 (0-3)</label><input type="text" inputmode="decimal" id="homeStatus" placeholder="例：1.50" oninput="limitInput(this)" onblur="formatInput(this)"></div>
                <div class="input-box"></div>
            </div>
            <div class="input-row">
                <div class="input-box"><label>得分</label><input type="text" inputmode="decimal" id="homeGoals" placeholder="例：1.50" oninput="limitInput(this)" onblur="formatInput(this)"></div>
                <div class="input-box"><label>失球</label><input type="text" inputmode="decimal" id="homeConceded" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            </div>
            <div class="input-row">
                <div class="input-box"><label>主隊 xG</label><input type="text" inputmode="decimal" id="homeXg" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div>
                <div class="input-box"><label>主隊 xGA</label><input type="text" inputmode="decimal" id="homeXga" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            </div>
            <div class="input-row">
                <div class="input-box"><label>排名 (選填)</label><input type="text" inputmode="numeric" id="homeRank" placeholder="例：1" oninput="limitInteger(this)"></div>
                <div class="input-box"><label>賠率</label><input type="text" inputmode="decimal" id="homeOdds" placeholder="例：1.67" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            </div>
        </div>

        <div class="input-section">
            <div class="section-header away">✈️ 客隊數據</div>
            <div class="input-row">
                <div class="input-box"><label>狀態 (0-3)</label><input type="text" inputmode="decimal" id="awayStatus" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div>
                <div class="input-box"></div>
            </div>
            <div class="input-row">
                <div class="input-box"><label>得分</label><input type="text" inputmode="decimal" id="awayGoals" placeholder="例：0.50" oninput="limitInput(this)" onblur="formatInput(this)"></div>
                <div class="input-box"><label>失球</label><input type="text" inputmode="decimal" id="awayConceded" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            </div>
            <div class="input-row">
                <div class="input-box"><label>客隊 xG</label><input type="text" inputmode="decimal" id="awayXg" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div>
                <div class="input-box"><label>客隊 xGA</label><input type="text" inputmode="decimal" id="awayXga" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            </div>
            <div class="input-row">
                <div class="input-box"><label>排名 (選填)</label><input type="text" inputmode="numeric" id="awayRank" placeholder="例：2" oninput="limitInteger(this)"></div>
                <div class="input-box"><label>賠率</label><input type="text" inputmode="decimal" id="awayOdds" placeholder="例：1.27" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            </div>
        </div>

        <button class="btn-calculate" onclick="calculate()">開始分析</button>
        <button class="btn-clear" onclick="clearData()">清除數據</button>
    </div>

    <div id="result">
        <div class="result-card btn-card">
            <button class="btn-action btn-return" onclick="showInput()">⬅️ 重新輸入</button>
            <button class="btn-action btn-save" id="btnSave" onclick="saveAsImage()">📸 保存分析</button>
        </div>

        <div class="result-card" id="resultCard">
            <!-- 四重預測 -->
            <div class="quad-result-container">
                <div class="result-box" id="box_new_no">
                    <div class="result-title">新版 (無賠) <span id="diff_new_no"></span></div>
                    <div class="result-value" id="val_new_no">-</div>
                </div>
                <div class="result-box" id="box_new_with">
                    <div class="result-title">新版 (有賠) <span id="diff_new_with"></span></div>
                    <div class="result-value" id="val_new_with">-</div>
                </div>
                <div class="result-box" id="box_old_no">
                    <div class="result-title">舊版 (無賠) <span id="diff_old_no"></span></div>
                    <div class="result-value" id="val_old_no">-</div>
                </div>
                <div class="result-box" id="box_old_with">
                    <div class="result-title">舊版 (有賠) <span id="diff_old_with"></span></div>
                    <div class="result-value" id="val_old_with">-</div>
                </div>
            </div>

            <!-- 終極賽果預測 -->
            <div class="ultimate-box" id="ultimateMatchBox">
                <div class="ultimate-title">🏆 終極賽果預測</div>
                <div class="ultimate-value" id="ultimateMatchValue">-</div>
            </div>

            <!-- 大小球預測 -->
            <div class="goals-box" id="goalsBox">
                <div class="goals-title">預測大小 (2.5球)</div>
                <div class="goals-value" id="goalsValue">-</div>
                <div class="goals-sub">
                    <span>無賠預期: <b id="expGoals_no">-</b></span>
                    <span>有賠預期: <b id="expGoals_with">-</b></span>
                </div>
            </div>

            <!-- 波膽推薦 -->
            <div class="bet-box" id="betBox">
                <div class="bet-title">🎯 波膽推薦</div>
                <div class="bet-value" id="betValue">-</div>
            </div>

            <div class="divider"></div>

            <!-- 實力評級 (以有賠率加成的數值為主) -->
            <div class="section-title">📊 球隊實力評級</div>
            
            <div class="radar-container">
                <div class="vertical-text home">主<br>隊</div>
                <div class="radar-svg-box">
                    <svg id="radar-home" viewBox="0 0 200 200"></svg>
                    <svg id="radar-away" viewBox="0 0 200 200"></svg>
                </div>
                <div class="vertical-text away">客<br>隊</div>
            </div>

            <div class="team-rating-block">
                <div class="team-header">
                    <div class="left-area">
                        <span class="team-title" style="color: #ff6b6b;">🏠 主隊</span>
                        <span class="overall-badge" id="hOverall">總評分: -</span>
                    </div>
                    <div class="right-area">
                        <span class="badge" id="hStyle">-</span>
                        <span class="badge" id="hStatusBadge">-</span>
                        <span class="badge" id="hOddsBadge" style="display:none;">-</span>
                        <span class="badge" id="hRankBadge" style="display:none;">-</span>
                    </div>
                </div>
                <div class="rating-row"><div class="rating-label">進攻</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-attack" id="hAttBar"></div></div><div class="rating-display" id="hAttDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">防守</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-defense" id="hDefBar"></div></div><div class="rating-display" id="hDefDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">狀態</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-status" id="hStatBar"></div></div><div class="rating-display" id="hStatDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">賠率</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-odds" id="hOddsBar"></div></div><div class="rating-display" id="hOddsDisplay">-</div></div>
                <div class="rating-row" id="hRankRow" style="display:none;"><div class="rating-label">排名</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-rank" id="hRankBar"></div></div><div class="rating-display" id="hRankDisplay">-</div></div>
            </div>

            <div class="team-rating-block">
                <div class="team-header">
                    <div class="left-area">
                        <span class="team-title" style="color: #6b9fff;">✈️ 客隊</span>
                        <span class="overall-badge" id="aOverall">總評分: -</span>
                    </div>
                    <div class="right-area">
                        <span class="badge" id="aStyle">-</span>
                        <span class="badge" id="aStatusBadge">-</span>
                        <span class="badge" id="aOddsBadge" style="display:none;">-</span>
                        <span class="badge" id="aRankBadge" style="display:none;">-</span>
                    </div>
                </div>
                <div class="rating-row"><div class="rating-label">進攻</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-attack" id="aAttBar"></div></div><div class="rating-display" id="aAttDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">防守</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-defense" id="aDefBar"></div></div><div class="rating-display" id="aDefDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">狀態</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-status" id="aStatBar"></div></div><div class="rating-display" id="aStatDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">賠率</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-odds" id="aOddsBar"></div></div><div class="rating-display" id="aOddsDisplay">-</div></div>
                <div class="rating-row" id="aRankRow" style="display:none;"><div class="rating-label">排名</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-rank" id="aRankBar"></div></div><div class="rating-display" id="aRankDisplay">-</div></div>
            </div>
        </div>
    </div>
</div>

<div id="imageModal">
    <img id="previewImg" src="" alt="分析結果">
    <div class="modal-hint">👇 請「長按」上方圖片，選擇「儲存到相片」</div>
    <button class="modal-close" onclick="closeModal()">關閉</button>
</div>

<script>
    function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
    }

    function saveAsImage() {
        const target = document.getElementById('resultCard');
        const btn = document.getElementById('btnSave');
        
        btn.innerHTML = '⏳ 生成中...';
        btn.disabled = true;

        setTimeout(() => {
            html2canvas(target, {
                backgroundColor: '#222222', 
                scale: 2, 
                useCORS: true
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                document.getElementById('previewImg').src = imgData;
                document.getElementById('imageModal').style.display = 'flex';
                
                btn.innerHTML = '📸 保存分析';
                btn.disabled = false;
            }).catch(err => {
                console.error("截圖失敗:", err);
                alert("生成圖片失敗，請重試。");
                btn.innerHTML = '📸 保存分析';
                btn.disabled = false;
            });
        }, 100);
    }

    function showInput() {
        document.getElementById('inputSection').style.display = 'block';
        document.getElementById('result').style.display = 'none';
    }

    function limitInput(input) {
        let val = input.value.replace(/[^0-9.]/g, '');
        let parts = val.split('.');
        if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
        if (val.replace(/\./g, '').length > 4) {
            let newVal = '', count = 0;
            for (let char of val) { if (char !== '.') { if (count >= 4) break; count++; } newVal += char; }
            val = newVal;
        }
        input.value = val;
    }

    function formatInput(input) {
        let val = input.value;
        if (!val || val === '.') { input.value = ''; return; }
        if (!val.includes('.')) {
            if (val.length === 3) val = val.substring(0, 1) + '.' + val.substring(1);
            else if (val.length === 2) {
                let num = parseInt(val);
                val = num > 30 ? '0.' + val : val.substring(0, 1) + '.' + val.substring(1) + '0';
            } else if (val.length === 1) val = val + '.00';
        } else {
            let parts = val.split('.');
            val = (parts[0] || '0') + '.' + (parts[1] || '').padEnd(2, '0').substring(0, 2);
        }
        let num = parseFloat(val);
        input.value = isNaN(num) ? '0.00' : num.toFixed(2);
    }

    function limitInteger(input) {
        let val = input.value.replace(/[^0-9]/g, '');
        if (val.length > 2) val = val.substring(0, 2);
        input.value = val;
    }

    function clearData() {
        const ids = ['homeStatus', 'homeXg', 'homeXga', 'homeGoals', 'homeConceded', 'homeRank', 'homeOdds',
                     'awayStatus', 'awayXg', 'awayXga', 'awayGoals', 'awayConceded', 'awayRank', 'awayOdds'];
        ids.forEach(id => document.getElementById(id).value = '');
        document.getElementById('result').style.display = 'none';
        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('radar-home').innerHTML = '';
        document.getElementById('radar-away').innerHTML = '';
        showInput();
    }

    function getGradeByPercent(pct) {
        if (pct < 20) return { grade: 'E', color: '#c0c0c0' };
        if (pct < 40) return { grade: 'D', color: '#cd7f32' };
        if (pct < 60) return { grade: 'C', color: '#ff4d4d' };
        if (pct < 75) return { grade: 'B', color: '#4ade80' };
        if (pct < 85) return { grade: 'A', color: '#4da6ff' };
        if (pct < 95) return { grade: 'S', color: '#FFD700' };
        return { grade: 'EX', color: '#9b59b6' };
    }

    function drawRadar(svgId, data, labels, color, fillColor) {
        const svg = document.getElementById(svgId);
        svg.innerHTML = ''; 
        const cx = 100, cy = 100, maxR = 65, numAxes = data.length;
        const angleStep = (Math.PI * 2) / numAxes;
        const startAngle = -Math.PI / 2; 

        for (let l = 1; l <= 4; l++) {
            const r = (maxR / 4) * l;
            let points = [];
            for (let i = 0; i < numAxes; i++) {
                const angle = startAngle + i * angleStep;
                points.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
            }
            const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            polygon.setAttribute('points', points.join(' '));
            polygon.setAttribute('fill', 'none'); polygon.setAttribute('stroke', '#444'); polygon.setAttribute('stroke-width', '1');
            svg.appendChild(polygon);
        }

        for (let i = 0; i < numAxes; i++) {
            const angle = startAngle + i * angleStep;
            const x = cx + maxR * Math.cos(angle), y = cy + maxR * Math.sin(angle);
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', cx); line.setAttribute('y1', cy); line.setAttribute('x2', x); line.setAttribute('y2', y); line.setAttribute('stroke', '#444'); line.setAttribute('stroke-width', '1');
            svg.appendChild(line);

            const labelR = maxR + 15;
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', cx + labelR * Math.cos(angle));
            text.setAttribute('y', cy + labelR * Math.sin(angle));
            text.setAttribute('fill', '#aaa'); text.setAttribute('font-size', '10'); text.setAttribute('font-weight', 'bold'); text.setAttribute('text-anchor', 'middle'); text.setAttribute('dominant-baseline', 'middle');
            text.textContent = labels[i];
            svg.appendChild(text);
        }

        let dataPoints = [];
        for (let i = 0; i < numAxes; i++) {
            let pct = Math.max(data[i], 5) / 100; 
            const r = maxR * pct, angle = startAngle + i * angleStep;
            dataPoints.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
        }
        const dataPolygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        dataPolygon.setAttribute('points', dataPoints.join(' '));
        dataPolygon.setAttribute('fill', fillColor); dataPolygon.setAttribute('stroke', color); dataPolygon.setAttribute('stroke-width', '2');
        svg.appendChild(dataPolygon);
    }

    function updateTeamUI(prefix, att, def, status, rankPct, oddsPct, hasRank) {
        let attPct = Math.min(Math.max(((att - 0.5) / 2.0) * 100, 0), 100);
        let defPct = Math.min(Math.max(((def - 0.5) / 2.0) * 100, 0), 100);
        let statPct = Math.min(Math.max((status / 3.0) * 100, 0), 100);

        document.getElementById(prefix + 'AttBar').style.width = Math.max(attPct, 1) + '%';
        document.getElementById(prefix + 'DefBar').style.width = Math.max(defPct, 1) + '%';
        document.getElementById(prefix + 'StatBar').style.width = Math.max(statPct, 1) + '%';
        document.getElementById(prefix + 'OddsBar').style.width = Math.max(oddsPct, 1) + '%';
        
        const attData = getGradeByPercent(attPct), defData = getGradeByPercent(defPct), statData = getGradeByPercent(statPct);
        const oddsData = getGradeByPercent(oddsPct);

        document.getElementById(prefix + 'AttDisplay').innerText = `${attData.grade} (${attPct.toFixed(1)})`;
        document.getElementById(prefix + 'AttDisplay').style.color = attData.color;
        document.getElementById(prefix + 'DefDisplay').innerText = `${defData.grade} (${defPct.toFixed(1)})`;
        document.getElementById(prefix + 'DefDisplay').style.color = defData.color;
        document.getElementById(prefix + 'StatDisplay').innerText = `${statData.grade} (${statPct.toFixed(1)})`;
        document.getElementById(prefix + 'StatDisplay').style.color = statData.color;
        document.getElementById(prefix + 'OddsDisplay').innerText = `${oddsData.grade} (${oddsPct.toFixed(1)})`;
        document.getElementById(prefix + 'OddsDisplay').style.color = oddsData.color;

        let radarData = [];
        let labels = [];
        let overallPct = 0;

        if (hasRank) {
            document.getElementById(prefix + 'RankRow').style.display = 'flex';
            document.getElementById(prefix + 'RankBar').style.width = Math.max(rankPct, 1) + '%';
            const rankData = getGradeByPercent(rankPct);
            document.getElementById(prefix + 'RankDisplay').innerText = `${rankData.grade} (${rankPct.toFixed(1)})`;
            document.getElementById(prefix + 'RankDisplay').style.color = rankData.color;
            
            radarData = [attPct, defPct, statPct, oddsPct, rankPct];
            labels = ['ATK', 'DEF', 'STA', 'ODD', 'RNK'];
            overallPct = (attPct + defPct + statPct + rankPct + oddsPct) / 5;
        } else {
            document.getElementById(prefix + 'RankRow').style.display = 'none';
            radarData = [attPct, defPct, statPct, oddsPct];
            labels = ['ATK', 'DEF', 'STA', 'ODD'];
            overallPct = (attPct + defPct + statPct + oddsPct) / 4;
        }

        const overallData = getGradeByPercent(overallPct);
        const overallEl = document.getElementById(prefix + 'Overall');
        if (overallEl) {
            overallEl.innerText = `總評分: ${overallData.grade} (${overallPct.toFixed(1)})`;
            overallEl.style.color = overallData.color;
            overallEl.style.borderColor = overallData.color;
        }

        drawRadar(prefix === 'h' ? 'radar-home' : 'radar-away', radarData, labels, 
            prefix === 'h' ? '#ff6b6b' : '#6b9fff', prefix === 'h' ? 'rgba(255, 107, 107, 0.3)' : 'rgba(107, 159, 255, 0.3)');

        const styleEl = document.getElementById(prefix + 'Style');
        const pctDiff = Math.round((attPct - defPct) * 10) / 10;
        if (pctDiff >= 25.0) { styleEl.innerText = "進攻型"; styleEl.style.color = "#ff8c8c"; styleEl.style.backgroundColor = "#3b1c1c"; }
        else if (pctDiff <= -25.0) { styleEl.innerText = "防守型"; styleEl.style.color = "#8cb8ff"; styleEl.style.backgroundColor = "#1a2633"; }
        else { styleEl.innerText = "平衡型"; styleEl.style.color = "#ccc"; styleEl.style.backgroundColor = "#333"; }

        const statusBadge = document.getElementById(prefix + 'StatusBadge');
        statusBadge.className = 'badge'; statusBadge.style.color = ''; statusBadge.style.backgroundColor = ''; 
        
        if (status <= 0.5) {
            statusBadge.innerText = "狀態極差"; statusBadge.style.color = "#ff3333"; statusBadge.style.backgroundColor = "#550000";
        } else if (status <= 1.0) {
            statusBadge.innerText = "狀態欠佳"; statusBadge.style.color = "#ff6b6b"; statusBadge.style.backgroundColor = "#3b1c1c";
        } else if (status <= 1.5) {
            statusBadge.innerText = "狀態一般"; statusBadge.style.color = "#ffd700"; statusBadge.style.backgroundColor = "#3b331c";
        } else if (status <= 2.0) {
            statusBadge.innerText = "狀態微優"; statusBadge.style.color = "#a3e635"; statusBadge.style.backgroundColor = "#263b1c";
        } else if (status <= 2.5) {
            statusBadge.innerText = "狀態良好"; statusBadge.classList.add('status-glow-green');
        } else {
            statusBadge.innerText = "狀態極好"; statusBadge.classList.add('status-glow-cyan');
        }

        return overallPct;
    }

    function applyMiniUI(id, finalResult, diffDisplay) {
        const box = document.getElementById('box_' + id);
        const val = document.getElementById('val_' + id);
        const diff = document.getElementById('diff_' + id);

        diff.innerText = `(${diffDisplay})`;
        if (finalResult === "home") { val.innerText = "主勝"; val.style.color = "#4ade80"; box.style.borderColor = "#4ade80"; box.style.backgroundColor = "#1a3324"; diff.style.color = "#4ade80"; }
        else if (finalResult === "away") { val.innerText = "客勝"; val.style.color = "#f87171"; box.style.borderColor = "#f87171"; box.style.backgroundColor = "#331a1a"; diff.style.color = "#f87171"; }
        else if (finalResult === "draw") { val.innerText = "和局"; val.style.color = "#ffd700"; box.style.borderColor = "#ffd700"; box.style.backgroundColor = "#332d1a"; diff.style.color = "#ffd700"; }
        else { val.innerText = "不建議"; val.style.color = "#aaa"; box.style.borderColor = "#555"; box.style.backgroundColor = "#2a2a2a"; diff.style.color = "#aaa"; }
    }

    function getMatchResult(margin, gap) {
        let res = "draw";
        if (margin >= 0.5) res = "home";
        else if (margin <= -0.5) res = "away";

        if (res === "home") {
            if (gap < -15) res = "avoid";
            else if (gap <= 15) res = "draw";
        } else if (res === "away") {
            if (gap > 15) res = "avoid";
            else if (gap >= -15) res = "draw";
        }
        return res;
    }

    function calculate() {
        const hXgStr = document.getElementById('homeXg').value;
        const hXgaStr = document.getElementById('homeXga').value;
        const hStatusStr = document.getElementById('homeStatus').value;
        const hGoalsStr = document.getElementById('homeGoals').value;
        const hConcededStr = document.getElementById('homeConceded').value;
        const hRankStr = document.getElementById('homeRank').value.trim();
        const hOddsStr = document.getElementById('homeOdds').value;

        const aXgStr = document.getElementById('awayXg').value;
        const aXgaStr = document.getElementById('awayXga').value;
        const aStatusStr = document.getElementById('awayStatus').value;
        const aGoalsStr = document.getElementById('awayGoals').value;
        const aConcededStr = document.getElementById('awayConceded').value;
        const aRankStr = document.getElementById('awayRank').value.trim();
        const aOddsStr = document.getElementById('awayOdds').value;

        const hasRank = hRankStr !== "" && aRankStr !== "";

        if (!hXgStr || !hXgaStr || !hStatusStr || !hGoalsStr || !hConcededStr || !hOddsStr ||
            !aXgStr || !aXgaStr || !aStatusStr || !aGoalsStr || !aConcededStr || !aOddsStr) {
            document.getElementById('errorMessage').style.display = 'block';
            return;
        }
        document.getElementById('errorMessage').style.display = 'none';

        const hXg = parseFloat(hXgStr) || 0, hXga = parseFloat(hXgaStr) || 0, hStatus = parseFloat(hStatusStr) || 0;
        const aXg = parseFloat(aXgStr) || 0, aXga = parseFloat(aXgaStr) || 0, aStatus = parseFloat(aStatusStr) || 0;
        const hGoals = parseFloat(hGoalsStr) || 0, hConceded = parseFloat(hConcededStr) || 0;
        const aGoals = parseFloat(aGoalsStr) || 0, aConceded = parseFloat(aConcededStr) || 0;
        const hOdds = parseFloat(hOddsStr) || 0, aOdds = parseFloat(aOddsStr) || 0;
        
        let hRank = hasRank ? parseInt(hRankStr) : 0;
        let aRank = hasRank ? parseInt(aRankStr) : 0;

        let hRankPct = 0, aRankPct = 0;
        if (hasRank) {
            let totalRank = hRank + aRank;
            hRankPct = totalRank > 0 ? (aRank / totalRank) * 100 : 50;
            aRankPct = totalRank > 0 ? (hRank / totalRank) * 100 : 50;
        }

        let totalOdds = hOdds + aOdds;
        let hOddsPct = totalOdds > 0 ? (aOdds / totalOdds) * 100 : 50;
        let aOddsPct = totalOdds > 0 ? (hOdds / totalOdds) * 100 : 50;

        // 更新標籤
        const hOddsBadge = document.getElementById('hOddsBadge');
        const aOddsBadge = document.getElementById('aOddsBadge');
        hOddsBadge.style.display = 'inline-block';
        aOddsBadge.style.display = 'inline-block';
        if (hOdds < aOdds) {
            hOddsBadge.innerText = "上盤"; hOddsBadge.style.color = "#bbf7d0"; hOddsBadge.style.backgroundColor = "#15803d"; 
            aOddsBadge.innerText = "下盤"; aOddsBadge.style.color = "#ccc"; aOddsBadge.style.backgroundColor = "#333";
        } else if (hOdds > aOdds) {
            hOddsBadge.innerText = "下盤"; hOddsBadge.style.color = "#ccc"; hOddsBadge.style.backgroundColor = "#333";
            aOddsBadge.innerText = "上盤"; aOddsBadge.style.color = "#bbf7d0"; aOddsBadge.style.backgroundColor = "#15803d";
        } else {
            hOddsBadge.style.display = 'none';
            aOddsBadge.style.display = 'none';
        }

        const hRankBadge = document.getElementById('hRankBadge');
        const aRankBadge = document.getElementById('aRankBadge');
        if (hasRank) {
            hRankBadge.style.display = 'inline-block';
            hRankBadge.innerText = `第${hRank}名`;
            hRankBadge.className = 'badge';
            if (hRank === 1) hRankBadge.classList.add('rank-glow-gold');
            else if (hRank === 2) hRankBadge.classList.add('rank-glow-silver');
            else if (hRank === 3) hRankBadge.classList.add('rank-glow-bronze');
            else { hRankBadge.style.color = '#ccc'; hRankBadge.style.backgroundColor = '#333'; }

            aRankBadge.style.display = 'inline-block';
            aRankBadge.innerText = `第${aRank}名`;
            aRankBadge.className = 'badge';
            if (aRank === 1) aRankBadge.classList.add('rank-glow-gold');
            else if (aRank === 2) aRankBadge.classList.add('rank-glow-silver');
            else if (aRank === 3) aRankBadge.classList.add('rank-glow-bronze');
            else { aRankBadge.style.color = '#ccc'; aRankBadge.style.backgroundColor = '#333'; }
        } else {
            hRankBadge.style.display = 'none';
            aRankBadge.style.display = 'none';
        }

        // 1. 得分加權
        let totalGoals = hGoals + aGoals;
        let hGoalAdj = 0, aGoalAdj = 0;
        if (totalGoals > 0) {
            hGoalAdj = (hGoals / totalGoals) - 0.5;
            aGoalAdj = (aGoals / totalGoals) - 0.5;
        }

        // 2. 失球加權
        let totalConceded = hConceded + aConceded;
        let hConcAdj = 0, aConcAdj = 0;
        if (totalConceded > 0) {
            hConcAdj = (hConceded / totalConceded) - 0.5;
            aConcAdj = (aConceded / totalConceded) - 0.5;
        }

        // 基礎調整值 (無賠率加成)
        const hXgAdjVal = hXg * (1 + hGoalAdj);
        const aXgAdjVal = aXg * (1 + aGoalAdj);
        const hXgaAdjVal = hXga * (1 + hConcAdj);
        const aXgaAdjVal = aXga * (1 + aConcAdj);

        // 賠率加成的調整值
        let hOddsAdj = (hOddsPct / 100) - 0.5;
        let aOddsAdj = (aOddsPct / 100) - 0.5;
        
        const hXgAdj_with = hXgAdjVal * (1 + hOddsAdj);
        const hXgaAdj_with = hXgaAdjVal * (1 - hOddsAdj);
        const aXgAdj_with = aXgAdjVal * (1 + aOddsAdj);
        const aXgaAdj_with = aXgaAdjVal * (1 - aOddsAdj);

        // UI 繪圖用有賠率的版本
        let hAttUI = hXgAdj_with;
        let hDefUI = Math.max(0, 3.0 - hXgaAdj_with);
        let aAttUI = aXgAdj_with;
        let aDefUI = Math.max(0, 3.0 - aXgaAdj_with);

        const hOverallPct = updateTeamUI('h', hAttUI, hDefUI, hStatus, hRankPct, hOddsPct, hasRank);
        const aOverallPct = updateTeamUI('a', aAttUI, aDefUI, aStatus, aRankPct, aOddsPct, hasRank);

        const gap = hOverallPct - aOverallPct;

        // ===== 計算四種賽果 =====
        // 1. 新版無賠
        const expHome_no = (hXgAdjVal + aXgaAdjVal) / 2;
        const expAway_no = (aXgAdjVal + hXgaAdjVal) / 2;
        const marginNew_no = expHome_no - expAway_no;
        const resNew_no = getMatchResult(marginNew_no, gap);
        applyMiniUI('new_no', resNew_no, marginNew_no.toFixed(2));

        // 2. 新版有賠
        const expHome_with = (hXgAdj_with + aXgaAdj_with) / 2;
        const expAway_with = (aXgAdj_with + hXgaAdj_with) / 2;
        const marginNew_with = expHome_with - expAway_with;
        const resNew_with = getMatchResult(marginNew_with, gap);
        applyMiniUI('new_with', resNew_with, marginNew_with.toFixed(2));

        // 3. 舊版無賠
        const hAdv_no = Math.max(0, hXgAdjVal - (3.0 - aXgaAdjVal));
        const aAdv_no = Math.max(0, aXgAdjVal - (3.0 - hXgaAdjVal));
        const marginOld_no = hAdv_no - aAdv_no;
        let resOld_no = "draw";
        if (marginOld_no >= 0.5) resOld_no = "home";
        else if (marginOld_no <= -0.5) resOld_no = "away";
        applyMiniUI('old_no', resOld_no, marginOld_no.toFixed(2));

        // 4. 舊版有賠
        const hAdv_with = Math.max(0, hXgAdj_with - (3.0 - aXgaAdj_with));
        const aAdv_with = Math.max(0, aXgAdj_with - (3.0 - hXgaAdj_with));
        const marginOld_with = hAdv_with - aAdv_with;
        let resOld_with = "draw";
        if (marginOld_with >= 0.5) resOld_with = "home";
        else if (marginOld_with <= -0.5) resOld_with = "away";
        applyMiniUI('old_with', resOld_with, marginOld_with.toFixed(2));

        // ===== 終極賽果判定 =====
        const ultimateMatchBox = document.getElementById('ultimateMatchBox');
        const ultimateMatchValue = document.getElementById('ultimateMatchValue');
        
        let isMatchConsistent = (resNew_no === resNew_with && resNew_no === resOld_no && resNew_no === resOld_with && resNew_no !== 'avoid');
        
        if (isMatchConsistent) {
            ultimateMatchBox.style.borderColor = '#ffd700';
            ultimateMatchBox.style.backgroundColor = '#2a2a1a';
            ultimateMatchValue.style.color = '#fff';
            if (resNew_no === 'home') { ultimateMatchValue.innerText = '主勝'; ultimateMatchValue.style.color = '#4ade80'; }
            else if (resNew_no === 'away') { ultimateMatchValue.innerText = '客勝'; ultimateMatchValue.style.color = '#f87171'; }
            else if (resNew_no === 'draw') { ultimateMatchValue.innerText = '和局'; ultimateMatchValue.style.color = '#ffd700'; }
        } else {
            ultimateMatchBox.style.borderColor = '#555';
            ultimateMatchBox.style.backgroundColor = '#222';
            ultimateMatchValue.innerText = '不建議出手';
            ultimateMatchValue.style.color = '#aaa';
        }

        // ===== 大小球判定 =====
        const totalExp_no = expHome_no + expAway_no;
        const totalExp_with = expHome_with + expAway_with;
        
        document.getElementById('expGoals_no').innerText = totalExp_no.toFixed(2);
        document.getElementById('expGoals_with').innerText = totalExp_with.toFixed(2);

        let size_no = "模糊";
        if (totalExp_no >= 3.0) size_no = "大";
        else if (totalExp_no <= 2.0) size_no = "小";

        let size_with = "模糊";
        if (totalExp_with >= 3.0) size_with = "大";
        else if (totalExp_with <= 2.0) size_with = "小";

        const goalsBox = document.getElementById('goalsBox');
        const goalsValue = document.getElementById('goalsValue');

        let finalSize = "模糊";
        if (size_no === size_with && size_no !== "模糊") {
            finalSize = size_no;
            goalsBox.style.borderColor = (finalSize === '大') ? '#f87171' : '#8cb8ff';
            goalsBox.style.backgroundColor = (finalSize === '大') ? '#331a1a' : '#1a2633';
            goalsValue.innerText = `建議 2.5 入球${finalSize}`;
            goalsValue.style.color = (finalSize === '大') ? '#f87171' : '#8cb8ff';
        } else {
            goalsBox.style.borderColor = '#555';
            goalsBox.style.backgroundColor = '#222';
            goalsValue.innerText = '方向模糊 (不建議)';
            goalsValue.style.color = '#aaa';
        }

        // ===== 波膽推薦 =====
        const betBox = document.getElementById('betBox');
        const betValue = document.getElementById('betValue');

        if (isMatchConsistent && finalSize !== "模糊") {
            betBox.style.borderColor = '#ffd700';
            betBox.style.backgroundColor = '#2a2a1a';
            betValue.style.color = '#fff';
            
            let scores = [];
            if (resNew_no === 'home') {
                if (finalSize === '小') scores = ['1:0', '2:0'];
                else scores = ['2:1', '3:0'];
            } else if (resNew_no === 'away') {
                if (finalSize === '小') scores = ['0:1', '0:2'];
                else scores = ['1:2', '0:3'];
            } else if (resNew_no === 'draw') {
                if (finalSize === '小') scores = ['0:0', '1:1'];
                else scores = ['2:2', '3:3'];
            }
            betValue.innerText = scores.join(' / ');
        } else {
            betBox.style.borderColor = '#444';
            betBox.style.backgroundColor = '#222';
            betValue.innerText = '方向模糊';
            betValue.style.color = '#888';
        }

        document.getElementById('inputSection').style.display = 'none';
        document.getElementById('result').style.display = 'block';
    }
</script>
