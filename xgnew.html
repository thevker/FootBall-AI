<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>xG 賽事分析器 (絕對精準版 v2)</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #121212; color: #e0e0e0; margin: 0; padding: 15px; 
            display: flex; justify-content: center; min-height: 100vh; -webkit-overflow-scrolling: touch;
        }
        .container { 
            background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            width: 100%; max-width: 500px; position: relative; margin-bottom: 30px;
        }
        h2 { text-align: center; color: #ffffff; margin-top: 0; font-size: 22px; }
        p.subtitle { font-size: 13px; color: #aaaaaa; text-align: center; margin-bottom: 20px; }
        
        #errorMessage {
            display: none; background-color: #331a1a; color: #ff4d4d; padding: 12px; 
            border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px;
            border: 1px solid #7a3a3a; animation: shake 0.4s;
        }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }

        .settings-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .setting-row {
            display: flex; align-items: center; justify-content: space-between; 
            background: #252525; padding: 12px 15px; border-radius: 8px; border: 1px solid #333;
        }
        .setting-label { font-size: 14px; font-weight: bold; color: #ddd; }
        .setting-row select { width: 160px; padding: 8px; font-size: 14px; cursor: pointer; background-color: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 6px; outline: none; }
        .setting-row select:focus { border-color: #4da6ff; }

        .input-section { margin-bottom: 20px; }
        .section-header { font-size: 15px; font-weight: bold; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px solid #333; }
        .section-header.home { color: #ff6b6b; }
        .section-header.away { color: #6b9fff; }

        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-box { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #bbbbbb; }
        input[type="text"] { 
            width: 100%; padding: 8px; background-color: #2d2d2d; border: 1px solid #444; 
            color: #ffffff; border-radius: 6px; font-size: 16px; outline: none; transition: border 0.2s; 
        }
        input[type="text"]:focus { border-color: #4da6ff; }

        button { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-calculate { background: #3a7bd5; color: white; }
        .btn-calculate:hover { background: #2a5fa5; }
        .btn-clear { background: #5a2a2a; color: #ff9999; margin-top: 10px; border: 1px solid #7a3a3a; }
        .btn-clear:hover { background: #7a3a3a; color: white; }
        
        #result { margin-top: 25px; display: none; padding-top: 20px; border-top: 1px solid #333; }
        
        .result-box { text-align: center; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 2px dashed; }
        .result-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #aaa; }
        .result-value { font-size: 28px; font-weight: bold; margin-bottom: 5px; }
        .result-diff { font-size: 13px; color: #aaa; margin-bottom: 5px; }
        .result-margin { font-size: 14px; font-weight: bold; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
        
        .dual-indicator {
            display: flex; justify-content: center; margin-top: 10px; padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; color: #ccc; gap: 20px;
        }
        .dual-item { text-align: center; }
        .dual-val { font-weight: bold; font-size: 14px; color: #fff; margin-top: 2px; }

        .section-box { background: #252525; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .section-title { font-size: 14px; font-weight: bold; margin-bottom: 15px; color: #dddddd; border-left: 4px solid #4da6ff; padding-left: 8px; }

        .radar-container {
            display: flex; justify-content: center; align-items: center; gap: 5px;
            margin-bottom: 20px; padding: 10px 0; background: #1a1a1a; border-radius: 8px; border: 1px solid #333;
        }
        .radar-box { display: flex; flex-direction: column; align-items: center; }
        .radar-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .radar-title.home { color: #ff6b6b; }
        .radar-title.away { color: #6b9fff; }
        svg { width: 160px; height: 160px; }

        .team-rating-block { margin-bottom: 20px; }
        .team-rating-block:last-child { margin-bottom: 0; }
        .team-name { font-size: 15px; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }

        @keyframes glow-green { 0% { box-shadow: 0 0 2px #4ade80; } 50% { box-shadow: 0 0 10px #4ade80; } 100% { box-shadow: 0 0 2px #4ade80; } }
        @keyframes glow-cyan { 0% { box-shadow: 0 0 2px #0adeff; } 50% { box-shadow: 0 0 10px #0adeff; } 100% { box-shadow: 0 0 2px #0adeff; } }
        .status-glow-green { color: #4ade80 !important; background-color: #1c3b24 !important; animation: glow-green 1.5s infinite alternate; }
        .status-glow-cyan { color: #0adeff !important; background-color: #0e2e36 !important; animation: glow-cyan 1.5s infinite alternate; text-shadow: 0 0 5px rgba(10, 222, 255, 0.5); }

        .rating-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 12px; }
        .rating-label { width: 52px; font-weight: bold; color: #aaa; }
        .rating-bar-bg { flex: 1; background: #1a1a1a; height: 16px; border-radius: 8px; overflow: hidden; margin: 0 10px; position: relative; border: 1px solid #333; }
        .rating-bar-fill { height: 100%; border-radius: 8px; transition: width 0.5s ease; }
        
        .bar-attack { background: #ff6b6b; }
        .bar-defense { background: #6b9fff; }
        .bar-status { background: #fbc02d; }
        .bar-odds { background: #4caf50; }
        .bar-att-rate { background: #ff9800; }
        .bar-def-rate { background: #00bcd4; }
        
        .rating-display { width: 75px; text-align: right; font-weight: bold; font-size: 13px; display: flex; justify-content: flex-end; align-items: center; }
        .overall-row { display: flex; justify-content: space-between; background: #1e1e1e; padding: 10px; border-radius: 6px; margin-top: 15px; border: 1px solid #444; align-items: center; }
        .overall-label { font-weight: bold; color: #ccc; font-size: 13px; }
        .overall-value { font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 xG 賽事分析器</h2>
    <p class="subtitle">六維雷達 | 絕對精準版 v2</p>
    
    <div id="errorMessage">⚠️ 數據不完整，請填寫所有輸入欄位！</div>

    <div class="settings-group">
        <div class="setting-row">
            <span class="setting-label">🏟️ 主場優勢 (加成主隊攻防)</span>
            <select id="homeAdvantage">
                <option value="0">0% (預設關閉)</option>
                <option value="0.10">10%</option>
            </select>
        </div>
    </div>

    <div class="input-section">
        <div class="section-header home">🏠 主隊數據</div>
        <div class="input-row">
            <div class="input-box"><label>狀態 (0-3)</label><input type="text" inputmode="decimal" id="homeStatus" placeholder="例：2.0" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            <div class="input-box"><label>賠率 (1-6)</label><input type="text" inputmode="decimal" id="homeOdds" placeholder="例：3.40" oninput="limitInput(this)" onblur="formatInput(this)"></div>
        </div>
        <div class="input-row">
            <div class="input-box"><label>主隊 xG (預期進球)</label><input type="text" inputmode="decimal" id="homeXg" placeholder="例：1.40" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            <div class="input-box"><label>主隊 xGA (預期失球)</label><input type="text" inputmode="decimal" id="homeXga" placeholder="例：1.80" oninput="limitInput(this)" onblur="formatInput(this)"></div>
        </div>
        <div class="input-row">
            <div class="input-box"><label>得分</label><input type="text" inputmode="decimal" id="homeScore" placeholder="例：18" oninput="limitInput(this)" onblur="formatInputPlain(this)"></div>
            <div class="input-box"><label>失球</label><input type="text" inputmode="decimal" id="homeConceded" placeholder="例：12" oninput="limitInput(this)" onblur="formatInputPlain(this)"></div>
        </div>
    </div>

    <div class="input-section">
        <div class="section-header away">✈️ 客隊數據</div>
        <div class="input-row">
            <div class="input-box"><label>狀態 (0-3)</label><input type="text" inputmode="decimal" id="awayStatus" placeholder="例：1.5" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            <div class="input-box"><label>賠率 (1-6)</label><input type="text" inputmode="decimal" id="awayOdds" placeholder="例：1.91" oninput="limitInput(this)" onblur="formatInput(this)"></div>
        </div>
        <div class="input-row">
            <div class="input-box"><label>客隊 xG (預期進球)</label><input type="text" inputmode="decimal" id="awayXg" placeholder="例：1.20" oninput="limitInput(this)" onblur="formatInput(this)"></div>
            <div class="input-box"><label>客隊 xGA (預期失球)</label><input type="text" inputmode="decimal" id="awayXga" placeholder="例：1.70" oninput="limitInput(this)" onblur="formatInput(this)"></div>
        </div>
        <div class="input-row">
            <div class="input-box"><label>得分</label><input type="text" inputmode="decimal" id="awayScore" placeholder="例：15" oninput="limitInput(this)" onblur="formatInputPlain(this)"></div>
            <div class="input-box"><label>失球</label><input type="text" inputmode="decimal" id="awayConceded" placeholder="例：14" oninput="limitInput(this)" onblur="formatInputPlain(this)"></div>
        </div>
    </div>

    <button class="btn-calculate" onclick="calculate()">開始分析</button>
    <button class="btn-clear" onclick="clearData()">清除數據</button>

    <div id="result">
        <div class="result-box" id="matchResultBox">
            <div class="result-title">預測賽果</div>
            <div class="result-value" id="matchResultValue">-</div>
            <div class="result-diff" id="matchResultDiff">差距值：-</div>
            <div class="result-margin" id="matchMarginValue">預計淨勝：-</div>
        </div>

        <div class="result-box" id="goalsResultBox" style="margin-bottom: 20px;">
            <div class="result-title">預測大小 (2.5球)</div>
            <div class="result-value" id="goalsResultValue">-</div>
            <div class="dual-indicator">
                <div class="dual-item">
                    <div>計算差距值 (最低為0)</div>
                    <div class="dual-val" id="goalsIndicatorValue">-</div>
                </div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-title">📊 球隊六維實力評級</div>
            <div class="radar-container">
                <div class="radar-box"><div class="radar-title home">主隊</div><svg id="radar-home" viewBox="0 0 200 200"></svg></div>
                <div class="radar-box"><div class="radar-title away">客隊</div><svg id="radar-away" viewBox="0 0 200 200"></svg></div>
            </div>

            <div class="team-rating-block">
                <div class="team-name">
                    <span style="color: #ff6b6b;">🏠 主隊</span>
                    <span class="badge" id="hStyle">-</span>
                    <span class="badge" id="hStatusBadge">-</span>
                    <span class="badge" id="hOddsBadge" style="display:none;">-</span>
                </div>
                <div class="rating-row"><div class="rating-label">進攻</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-attack" id="hAttBar"></div></div><div class="rating-display" id="hAttDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">防守</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-defense" id="hDefBar"></div></div><div class="rating-display" id="hDefDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">狀態</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-status" id="hStatBar"></div></div><div class="rating-display" id="hStatDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">賠率</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-odds" id="hOddsBar"></div></div><div class="rating-display" id="hOddsDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">進攻率</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-att-rate" id="hAttRateBar"></div></div><div class="rating-display" id="hAttRateDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">防守率</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-def-rate" id="hDefRateBar"></div></div><div class="rating-display" id="hDefRateDisplay">-</div></div>
                <div class="overall-row"><span class="overall-label">綜合總實力</span><span class="overall-value" id="hOverall">E (0.0)</span></div>
            </div>

            <div class="team-rating-block">
                <div class="team-name">
                    <span style="color: #6b9fff;">✈️ 客隊</span>
                    <span class="badge" id="aStyle">-</span>
                    <span class="badge" id="aStatusBadge">-</span>
                    <span class="badge" id="aOddsBadge" style="display:none;">-</span>
                </div>
                <div class="rating-row"><div class="rating-label">進攻</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-attack" id="aAttBar"></div></div><div class="rating-display" id="aAttDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">防守</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-defense" id="aDefBar"></div></div><div class="rating-display" id="aDefDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">狀態</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-status" id="aStatBar"></div></div><div class="rating-display" id="aStatDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">賠率</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-odds" id="aOddsBar"></div></div><div class="rating-display" id="aOddsDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">進攻率</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-att-rate" id="aAttRateBar"></div></div><div class="rating-display" id="aAttRateDisplay">-</div></div>
                <div class="rating-row"><div class="rating-label">防守率</div><div class="rating-bar-bg"><div class="rating-bar-fill bar-def-rate" id="aDefRateBar"></div></div><div class="rating-display" id="aDefRateDisplay">-</div></div>
                <div class="overall-row"><span class="overall-label">綜合總實力</span><span class="overall-value" id="aOverall">E (0.0)</span></div>
            </div>
        </div>
    </div>
</div>

<script>
    function limitInput(input) {
        let val = input.value.replace(/[^0-9.]/g, '');
        let parts = val.split('.');
        if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
        if (val.replace(/\./g, '').length > 4) {
            let newVal = '', count = 0;
            for (let char of val) { if (char !== '.') { if (count >= 4) break; count++; } newVal += char; }
            val = newVal;
        }
        input.value = val;
    }

    function formatInput(input) {
        let val = input.value;
        if (!val || val === '.') { input.value = ''; return; }
        if (!val.includes('.')) {
            if (val.length === 3) val = val.substring(0, 1) + '.' + val.substring(1);
            else if (val.length === 2) {
                let num = parseInt(val);
                val = num > 30 ? '0.' + val : val.substring(0, 1) + '.' + val.substring(1) + '0';
            } else if (val.length === 1) val = val + '.00';
        } else {
            let parts = val.split('.');
            val = (parts[0] || '0') + '.' + (parts[1] || '').padEnd(2, '0').substring(0, 2);
        }
        let num = parseFloat(val);
        input.value = isNaN(num) ? '0.00' : num.toFixed(2);
    }

    function formatInputPlain(input) {
        let val = input.value;
        if (!val || val === '.') { input.value = ''; return; }
        let num = parseFloat(val);
        input.value = isNaN(num) ? '' : num.toFixed(2);
    }

    function clearData() {
        const ids = ['homeStatus', 'homeOdds', 'homeXg', 'homeXga', 'homeScore', 'homeConceded',
                     'awayStatus', 'awayOdds', 'awayXg', 'awayXga', 'awayScore', 'awayConceded'];
        ids.forEach(id => document.getElementById(id).value = '');
        document.getElementById('result').style.display = 'none';
        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('radar-home').innerHTML = '';
        document.getElementById('radar-away').innerHTML = '';
    }

    function getGradeByPercent(pct) {
        if (pct < 20) return { grade: 'E', color: '#c0c0c0' };
        if (pct < 40) return { grade: 'D', color: '#cd7f32' };
        if (pct < 60) return { grade: 'C', color: '#ff4d4d' };
        if (pct < 75) return { grade: 'B', color: '#4ade80' };
        if (pct < 85) return { grade: 'A', color: '#4da6ff' };
        if (pct < 95) return { grade: 'S', color: '#FFD700' };
        return { grade: 'EX', color: '#9b59b6' };
    }

    function drawRadar(svgId, data, color, fillColor) {
        const svg = document.getElementById(svgId);
        svg.innerHTML = '';
        const cx = 100, cy = 100, maxR = 58, numAxes = 6;
        const angleStep = (Math.PI * 2) / numAxes;
        const startAngle = -Math.PI / 2;
        const labels = ['xG', 'xGA', '狀態', '賠率', '得%', '失%'];

        for (let l = 1; l <= 4; l++) {
            const r = (maxR / 4) * l;
            let points = [];
            for (let i = 0; i < numAxes; i++) {
                const angle = startAngle + i * angleStep;
                points.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
            }
            const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            polygon.setAttribute('points', points.join(' '));
            polygon.setAttribute('fill', 'none');
            polygon.setAttribute('stroke', '#444');
            polygon.setAttribute('stroke-width', '1');
            svg.appendChild(polygon);
        }

        for (let i = 0; i < numAxes; i++) {
            const angle = startAngle + i * angleStep;
            const x = cx + maxR * Math.cos(angle), y = cy + maxR * Math.sin(angle);
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', cx); line.setAttribute('y1', cy);
            line.setAttribute('x2', x); line.setAttribute('y2', y);
            line.setAttribute('stroke', '#444');
            line.setAttribute('stroke-width', '1');
            svg.appendChild(line);

            const labelR = maxR + 18;
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', cx + labelR * Math.cos(angle));
            text.setAttribute('y', cy + labelR * Math.sin(angle));
            text.setAttribute('fill', '#aaa');
            text.setAttribute('font-size', '9');
            text.setAttribute('font-weight', 'bold');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('dominant-baseline', 'middle');
            text.textContent = labels[i];
            svg.appendChild(text);
        }

        let dataPoints = [];
        for (let i = 0; i < numAxes; i++) {
            const pct = Math.max(data[i], 5) / 100;
            const r = maxR * pct;
            const angle = startAngle + i * angleStep;
            dataPoints.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
        }
        const dataPolygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        dataPolygon.setAttribute('points', dataPoints.join(' '));
        dataPolygon.setAttribute('fill', fillColor);
        dataPolygon.setAttribute('stroke', color);
        dataPolygon.setAttribute('stroke-width', '2');
        svg.appendChild(dataPolygon);
    }

    function updateTeamUI(prefix, attPct, defPct, statPct, oddPct, attRatePct, defRatePct, rawStatus) {
        const setBar = (key, pct) => {
            document.getElementById(prefix + key + 'Bar').style.width = Math.max(pct, 1) + '%';
            const g = getGradeByPercent(pct);
            const el = document.getElementById(prefix + key + 'Display');
            el.innerText = `${g.grade} (${pct.toFixed(1)})`;
            el.style.color = g.color;
        };
        setBar('Att', attPct);
        setBar('Def', defPct);
        setBar('Stat', statPct);
        setBar('Odds', oddPct);
        setBar('AttRate', attRatePct);
        setBar('DefRate', defRatePct);

        const overallPct = (attPct + defPct + statPct + oddPct + attRatePct + defRatePct) / 6;
        const overallData = getGradeByPercent(overallPct);
        const overallEl = document.getElementById(prefix + 'Overall');
        overallEl.innerText = `${overallData.grade} (${overallPct.toFixed(1)})`;
        overallEl.style.color = overallData.color;

        drawRadar(prefix === 'h' ? 'radar-home' : 'radar-away',
            [attPct, defPct, statPct, oddPct, attRatePct, defRatePct],
            prefix === 'h' ? '#ff6b6b' : '#6b9fff',
            prefix === 'h' ? 'rgba(255, 107, 107, 0.3)' : 'rgba(107, 159, 255, 0.3)');

        // 風格判定 (進攻 vs 防守 佔比差距)
        const styleEl = document.getElementById(prefix + 'Style');
        const pctDiff = attPct - defPct;
        if (pctDiff >= 15) {
            styleEl.innerText = "進攻型"; styleEl.style.color = "#ff8c8c"; styleEl.style.backgroundColor = "#3b1c1c";
        } else if (pctDiff <= -15) {
            styleEl.innerText = "防守型"; styleEl.style.color = "#8cb8ff"; styleEl.style.backgroundColor = "#1a2633";
        } else {
            styleEl.innerText = "平衡型"; styleEl.style.color = "#ccc"; styleEl.style.backgroundColor = "#333";
        }

        // 狀態徽章 (使用原始輸入值)
        const statusBadge = document.getElementById(prefix + 'StatusBadge');
        statusBadge.className = 'badge'; statusBadge.style.color = ''; statusBadge.style.backgroundColor = '';
        if (rawStatus >= 3.0) { statusBadge.innerText = "狀態極佳"; statusBadge.classList.add('status-glow-cyan'); }
        else if (rawStatus >= 2.0) { statusBadge.innerText = "狀態良好"; statusBadge.classList.add('status-glow-green'); }
        else if (rawStatus >= 1.0) { statusBadge.innerText = "狀態一般"; statusBadge.style.color = "#ffd700"; statusBadge.style.backgroundColor = "#3b331c"; }
        else { statusBadge.innerText = "狀態欠佳"; statusBadge.style.color = "#ff4d4d"; statusBadge.style.backgroundColor = "#3b1c1c"; }

        // 賠率徽章
        const oddsBadge = document.getElementById(prefix + 'OddsBadge');
        if (oddPct > 50) { oddsBadge.style.display = "inline-block"; oddsBadge.innerText = "上盤"; oddsBadge.style.color = "#f39c12"; oddsBadge.style.backgroundColor = "#3b2b1c"; }
        else if (oddPct < 50) { oddsBadge.style.display = "inline-block"; oddsBadge.innerText = "下盤"; oddsBadge.style.color = "#cd7f32"; oddsBadge.style.backgroundColor = "#2b1d15"; }
        else { oddsBadge.style.display = "none"; }

        return overallPct;
    }

    function calculate() {
        const getV = id => document.getElementById(id).value;
        const requiredIds = ['homeXg','homeXga','homeStatus','homeOdds','homeScore','homeConceded',
                             'awayXg','awayXga','awayStatus','awayOdds','awayScore','awayConceded'];
        for (const id of requiredIds) {
            if (!getV(id)) {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('result').style.display = 'none';
                return;
            }
        }
        document.getElementById('errorMessage').style.display = 'none';

        const hXg = parseFloat(getV('homeXg')) || 0;
        const hXga = parseFloat(getV('homeXga')) || 0;
        const hStatus = parseFloat(getV('homeStatus')) || 0;
        const hOdds = parseFloat(getV('homeOdds')) || 0;
        const hScore = parseFloat(getV('homeScore')) || 0;
        const hConc = parseFloat(getV('homeConceded')) || 0;

        const aXg = parseFloat(getV('awayXg')) || 0;
        const aXga = parseFloat(getV('awayXga')) || 0;
        const aStatus = parseFloat(getV('awayStatus')) || 0;
        const aOdds = parseFloat(getV('awayOdds')) || 0;
        const aScore = parseFloat(getV('awayScore')) || 0;
        const aConc = parseFloat(getV('awayConceded')) || 0;

        const homeAdv = parseFloat(document.getElementById('homeAdvantage').value) || 0;
        const homeMult = 1 + homeAdv;

        // ── 六維佔比計算（兩隊總和為 100%）──

        // 1. 進攻 (xG)：越高越強
        const hAtt = hXg * homeMult, aAtt = aXg;
        const totAtt = hAtt + aAtt;
        const hAttPct = totAtt > 0 ? (hAtt / totAtt) * 100 : 50;
        const aAttPct = 100 - hAttPct;

        // 2. 防守 (xGA)：越低越強 → 反向
        const totDef = hXga + aXga;
        const hDefPct = totDef > 0 ? (aXga / totDef) * 100 : 50;
        const aDefPct = 100 - hDefPct;

        // 3. 狀態：越高越強
        const totStat = hStatus + aStatus;
        const hStatPct = totStat > 0 ? (hStatus / totStat) * 100 : 50;
        const aStatPct = 100 - hStatPct;

        // 4. 賠率：越低越強 → 反向
        const totOdds = hOdds + aOdds;
        const hOddPct = totOdds > 0 ? (aOdds / totOdds) * 100 : 50;
        const aOddPct = 100 - hOddPct;

        // 5. 進攻率 (得分)：越高越強
        const totScore = hScore + aScore;
        const hScorePct = totScore > 0 ? (hScore / totScore) * 100 : 50;
        const aScorePct = 100 - hScorePct;

        // 6. 防守率 (失球)：越低越強 → 反向
        const totConc = hConc + aConc;
        const hConcPct = totConc > 0 ? (aConc / totConc) * 100 : 50;
        const aConcPct = 100 - hConcPct;

        // 更新 UI
        const hOverall = updateTeamUI('h', hAttPct, hDefPct, hStatPct, hOddPct, hScorePct, hConcPct, hStatus);
        const aOverall = updateTeamUI('a', aAttPct, aDefPct, aStatPct, aOddPct, aScorePct, aConcPct, aStatus);

        // ── 預期進球 / 賽果預測 ──
        const expHomeGoals = (hAtt + aXga) / 2;
        const expAwayGoals = (aAtt + hXga / homeMult) / 2;
        const predictedMargin = expHomeGoals - expAwayGoals;
        const diff = predictedMargin;

        const resultBox = document.getElementById('matchResultBox');
        const resultValue = document.getElementById('matchResultValue');
        const resultDiff = document.getElementById('matchResultDiff');

        let finalResult = "";
        let diffDisplay = (diff > 0 ? '+' : '') + diff.toFixed(2);
        const gap = hOverall - aOverall;

        if (gap >= 30) { finalResult = "home"; diffDisplay = `+${diff.toFixed(2)} (實力碾壓)`; }
        else if (gap <= -30) { finalResult = "away"; diffDisplay = `${diff.toFixed(2)} (實力碾壓)`; }
        else {
            if (diff >= 0.15) finalResult = "home";
            else if (diff <= -0.15) finalResult = "away";
            else { finalResult = "draw"; diffDisplay = (diff > 0 ? '+' : '') + diff.toFixed(2) + ` (膠著)`; }

            if (finalResult === "home") {
                if (gap < -15) { finalResult = "avoid"; diffDisplay += ` (實力不符)`; }
                else if (gap <= 15) { finalResult = "draw"; diffDisplay += ` (差距不足)`; }
            } else if (finalResult === "away") {
                if (gap > 15) { finalResult = "avoid"; diffDisplay += ` (實力不符)`; }
                else if (gap >= -15) { finalResult = "draw"; diffDisplay += ` (差距不足)`; }
            }
        }

        resultDiff.innerText = `差距值：${diffDisplay}`;

        const marginEl = document.getElementById('matchMarginValue');
        if (predictedMargin > 0.05) { marginEl.innerText = `預計淨勝：主隊 ${predictedMargin.toFixed(2)} 球`; marginEl.style.color = '#4ade80'; }
        else if (predictedMargin < -0.05) { marginEl.innerText = `預計淨勝：客隊 ${Math.abs(predictedMargin).toFixed(2)} 球`; marginEl.style.color = '#f87171'; }
        else { marginEl.innerText = `預計淨勝：0.00 球 (平手)`; marginEl.style.color = '#aaa'; }

        // ── 大小球 ──
        const homeDefense = 2.50 - aXga;
        const awayDefense = 2.50 - hXga;
        const hAdv = Math.max(0, hXg - homeDefense);
        const aAdv = Math.max(0, aXg - awayDefense);
        const goalsDiff = hAdv + aAdv;

        const goalsResultBox = document.getElementById('goalsResultBox');
        const goalsResultValue = document.getElementById('goalsResultValue');
        const goalsIndicatorValue = document.getElementById('goalsIndicatorValue');

        goalsIndicatorValue.innerText = goalsDiff.toFixed(2);

        let recommendation = "", boxColor = "", bgColor = "", textColor = "";
        if (goalsDiff <= 0.5) {
            recommendation = "建議 2.5 入球細"; textColor = "#8cb8ff"; boxColor = "#8cb8ff"; bgColor = "#1a2633";
        } else if (goalsDiff >= 1.5) {
            recommendation = "建議 2.5 入球大"; textColor = "#f87171"; boxColor = "#f87171"; bgColor = "#331a1a";
        } else {
            recommendation = "方向模糊 (不建議)"; textColor = "#aaa"; boxColor = "#555"; bgColor = "#2a2a2a";
        }

        goalsResultValue.innerText = recommendation;
        goalsResultValue.style.color = textColor;
        goalsResultBox.style.borderColor = boxColor;
        goalsResultBox.style.backgroundColor = bgColor;

        if (finalResult === "home") { resultValue.innerText = "主勝"; resultValue.style.color = "#4ade80"; resultBox.style.borderColor = "#4ade80"; resultBox.style.backgroundColor = "#1a3324"; }
        else if (finalResult === "away") { resultValue.innerText = "客勝"; resultValue.style.color = "#f87171"; resultBox.style.borderColor = "#f87171"; resultBox.style.backgroundColor = "#331a1a"; }
        else if (finalResult === "draw") { resultValue.innerText = "和局"; resultValue.style.color = "#ffd700"; resultBox.style.borderColor = "#ffd700"; resultBox.style.backgroundColor = "#332d1a"; }
        else { resultValue.innerText = "不建議出手"; resultValue.style.color = "#aaa"; resultBox.style.borderColor = "#555"; resultBox.style.backgroundColor = "#2a2a2a"; }

        document.getElementById('result').style.display = 'block';
    }
</script>
