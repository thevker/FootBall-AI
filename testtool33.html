<script>
'use strict';

var FEATURES = [
  'A','B','C','D','E','F',
  '|A-B|','|A-C|','|A-D|','|A-E|','|A-F|',
  '|B-C|','|B-D|','|B-E|','|B-F|',
  '|C-D|','|C-E|','|C-F|',
  '|D-E|','|D-F|','|E-F|',
  'A-B','A-C','B-C','D-F','E-D',
  'A+B','B+C','D+E','E+F','D+F','A+C',
  'A+B+C','D+E+F','A+D',
  'A/C','D/F','D/(D+F)',
  'MAX(A,B,C)','MIN(A,B,C)','MAX(D,E,F)','MIN(D,E,F)'
];
var FCOUNT = FEATURES.length;
var OPS = ['>', '>=', '<', '<='];
var RESULTS = ['H', 'D', 'A'];
var RESULT_CODES = { H: 0, D: 1, A: 2 };

var trainFeat = null, trainCodes = null, trainPayouts = null, trainN = 0;
var valFeat = null, valCodes = null, valPayouts = null, valN = 0;
var running = false;
var startTime = 0;
var lastYield = 0;
var condCache = { train: new Map(), val: new Map() };
var featureCandidates = {};

/* ========== 位圖 ========== */
function bsNew(N){ return new Uint32Array((N+31)>>5); }
function bsNewFull(N){
  var bs = new Uint32Array((N+31)>>5);
  bs.fill(0xFFFFFFFF);
  var rem = N & 31;
  if(rem) bs[bs.length-1] = (1 << rem) - 1;
  return bs;
}
function bsAnd(a,b){
  var r = new Uint32Array(a.length);
  for(var i=0;i<a.length;i++) r[i] = a[i] & b[i];
  return r;
}
function bsAndNot(a,b){
  var r = new Uint32Array(a.length);
  for(var i=0;i<a.length;i++) r[i] = a[i] & ~b[i];
  return r;
}
function bsOrInPlace(a,b){ for(var i=0;i<a.length;i++) a[i] |= b[i]; }
function bsCount(bs){
  var c = 0;
  for(var i=0;i<bs.length;i++){
    var x = bs[i];
    x = x - ((x>>1) & 0x55555555);
    x = (x & 0x33333333) + ((x>>2) & 0x33333333);
    x = (x + (x>>4)) & 0x0F0F0F0F;
    c += (x * 0x01010101) >>> 24;
  }
  return c;
}
function evalCond(x, opIdx, v){
  switch(opIdx){
    case 0: return x > v;
    case 1: return x >= v;
    case 2: return x < v;
    case 3: return x <= v;
  }
  return false;
}

/* ========== 條件位圖快取 ========== */
function getCondBS(side, fi, opIdx, v){
  var key = fi + '_' + opIdx + '_' + v;
  var cache = condCache[side];
  if(cache.has(key)) return cache.get(key);
  var featMat = side === 'train' ? trainFeat : valFeat;
  var N = side === 'train' ? trainN : valN;
  if(!featMat) return null;
  var bs = bsNew(N);
  for(var i=0;i<N;i++){
    if(evalCond(featMat[i][fi], opIdx, v)) bs[i>>5] |= 1 << (i & 31);
  }
  cache.set(key, bs);
  return bs;
}

/* ========== 利潤 ========== */
function profitForBS(bs, codes, payouts, N, TC){
  var p = 0;
  for(var w=0;w<bs.length;w++){
    var x = bs[w];
    while(x){
      var low = x & -x;
      var idx = (w << 5) + (31 - Math.clz32(low));
      if(idx < N){
        p += (codes[idx] === TC) ? (payouts[idx*3+TC] - 100) : -100;
      }
      x ^= low;
    }
  }
  return p;
}

/* ========== 規則評估（雙邊）========== */
function evalRuleDual(conds, TC){
  var trainBS;
  if(conds.length === 0){
    trainBS = bsNewFull(trainN);
  } else {
    trainBS = getCondBS('train', conds[0][0], conds[0][1], conds[0][2]);
    for(var c=1;c<conds.length;c++){
      trainBS = bsAnd(trainBS, getCondBS('train', conds[c][0], conds[c][1], conds[c][2]));
    }
  }
  var trainP = profitForBS(trainBS, trainCodes, trainPayouts, trainN, TC);
  var valP = 0;
  var valBS = null;
  if(valN > 0){
    if(conds.length === 0){
      valBS = bsNewFull(valN);
    } else {
      valBS = getCondBS('val', conds[0][0], conds[0][1], conds[0][2]);
      for(var c2=1;c2<conds.length;c2++){
        valBS = bsAnd(valBS, getCondBS('val', conds[c2][0], conds[c2][1], conds[c2][2]));
      }
    }
    valP = profitForBS(valBS, valCodes, valPayouts, valN, TC);
  }
  return { trainBS: trainBS, valBS: valBS, trainP: trainP, valP: valP };
}

/* ========== 特徵候選 ========== */
function getCandidates(fi){
  if(featureCandidates[fi]) return featureCandidates[fi];
  var vals = [];
  for(var i=0;i<trainN;i++) vals.push(trainFeat[i][fi]);
  vals.sort(function(a,b){ return a-b; });
  var qs = [];
  var nq = Math.min(15, vals.length);
  for(var k=1;k<=nq;k++){
    var q = vals[Math.floor(k * trainN / (nq + 1))];
    if(qs.indexOf(q) === -1) qs.push(q);
  }
  featureCandidates[fi] = qs;
  return qs;
}

/* ========== 種子（訓練+驗證都正）========== */
function generateSeeds(strict){
  var seeds = [];
  var minCnt = 10;  /* 最少覆蓋 10 場 */
  for(var fi=0;fi<FCOUNT;fi++){
    var qs = getCandidates(fi);
    for(var opIdx=0;opIdx<4;opIdx++){
      for(var qi=0;qi<qs.length;qi++){
        var v = qs[qi];
        var trainBS = getCondBS('train', fi, opIdx, v);
        var cnt = bsCount(trainBS);
        if(cnt < minCnt) continue;
        for(var TC=0;TC<3;TC++){
          var trainP = profitForBS(trainBS, trainCodes, trainPayouts, trainN, TC);
          if(trainP <= 0) continue;

          var valP = 0;
          var valBS = null;
          if(valN > 0){
            valBS = getCondBS('val', fi, opIdx, v);
            valP = profitForBS(valBS, valCodes, valPayouts, valN, TC);
            /* 嚴格模式：驗證必須也正 */
            if(strict && valP <= 0) continue;
          }
          seeds.push({
            fi:fi, opIdx:opIdx, v:v, TC:TC,
            trainBS:trainBS, valBS:valBS,
            trainP:trainP, valP:valP, cnt:cnt
          });
        }
      }
    }
  }
  return seeds;
}

/* ========== 貪心擴展（雙邊評分）========== */
function expandSeed(seed, allSeeds, maxSteps, strict){
  var conds = [[seed.fi, seed.opIdx, seed.v]];
  var trainBS = seed.trainBS;
  var valBS = seed.valBS;
  var trainP = seed.trainP;
  var valP = seed.valP;
  var cnt = seed.cnt;
  
  /* 評分：加權 ROI（驗證權重更高，避免過擬合）*/
  var density = valN > 0 
    ? (trainP/trainN*0.3 + valP/valN*0.7)
    : (trainP/trainN);

  for(var step=0;step<maxSteps;step++){
    var best = null;
    for(var i=0;i<allSeeds.length;i++){
      var c = allSeeds[i];
      if(c.TC !== seed.TC) continue;
      if(c.trainBS === trainBS) continue;
      var dup = false;
      for(var d=0;d<conds.length;d++){
        if(conds[d][0] === c.fi && conds[d][1] === c.opIdx){ dup = true; break; }
      }
      if(dup) continue;
      
      var newTrainBS = bsAnd(trainBS, c.trainBS);
      var newCnt = bsCount(newTrainBS);
      if(newCnt < 10) continue;
      var newTrainP = profitForBS(newTrainBS, trainCodes, trainPayouts, trainN, seed.TC);
      if(newTrainP <= 0) continue;

      var newValP = 0;
      var newValBS = null;
      if(valN > 0 && valBS){
        newValBS = bsAnd(valBS, c.valBS);
        newValP = profitForBS(newValBS, valCodes, valPayouts, valN, seed.TC);
        if(strict && newValP <= 0) continue;
      }

      var newDensity = valN > 0
        ? (newTrainP/trainN*0.3 + newValP/valN*0.7)
        : (newTrainP/trainN);

      if(newDensity > density * 1.02){
        if(!best || newDensity > best.density){
          best = {
            fi:c.fi, opIdx:c.opIdx, v:c.v,
            trainBS:newTrainBS, valBS:newValBS,
            trainP:newTrainP, valP:newValP,
            cnt:newCnt, density:newDensity
          };
        }
      }
    }
    if(!best) break;
    conds.push([best.fi, best.opIdx, best.v]);
    trainBS = best.trainBS;
    valBS = best.valBS;
    trainP = best.trainP;
    valP = best.valP;
    cnt = best.cnt;
    density = best.density;
  }
  return { TC: seed.TC, conds: conds, trainBS: trainBS, valBS: valBS, trainP: trainP, valP: valP, cnt: cnt };
}

/* ========== 順序選擇（雙邊邊際）========== */
function sequentialSelect(candidates, N){
  var covered = bsNew(N);
  var valCovered = valN > 0 ? bsNew(valN) : null;
  var chosen = [];
  
  for(var iter=0;iter<100;iter++){
    if(!running) break;
    var best = null;
    var bestScore = 0;
    for(var i=0;i<candidates.length;i++){
      var r = candidates[i];
      var only = bsAndNot(r.trainBS, covered);
      var trainMargin = profitForBS(only, trainCodes, trainPayouts, trainN, r.TC);
      if(trainMargin <= 0) continue;

      var valMargin = 0;
      if(valN > 0 && valCovered && r.valBS){
        var valOnly = bsAndNot(r.valBS, valCovered);
        valMargin = profitForBS(valOnly, valCodes, valPayouts, valN, r.TC);
      }

      /* 加權邊際分數（驗證 0.7）*/
      var score = valN > 0
        ? (trainMargin/trainN*0.3 + valMargin/valN*0.7)
        : (trainMargin/trainN);

      if(score > bestScore){
        bestScore = score;
        best = { rule: r, trainMargin: trainMargin, valMargin: valMargin };
      }
    }
    if(!best) break;
    chosen.push({
      TC: best.rule.TC,
      conds: best.rule.conds,
      trainMargin: best.trainMargin,
      valMargin: best.valMargin
    });
    bsOrInPlace(covered, best.rule.trainBS);
    if(valN > 0 && valCovered && best.rule.valBS){
      bsOrInPlace(valCovered, best.rule.valBS);
    }
  }
  return { chosen: chosen, covered: covered };
}

/* ========== 剪枝：砍驗證虧損規則 ========== */
function pruneRules(rules){
  if(valN === 0) return { rules: rules, pruned: 0 };
  var kept = [];
  var pruned = 0;
  var covered = bsNew(trainN);
  for(var i=0;i<rules.length;i++){
    var r = rules[i];
    var d = evalRuleDual(r.conds, r.TC);
    var only = bsAndNot(d.trainBS, covered);
    var margin = profitForBS(only, trainCodes, trainPayouts, trainN, r.TC);
    bsOrInPlace(covered, d.trainBS);
    
    if(margin > 0 && d.valP >= 0){
      kept.push(r);
    } else if(margin > 0 && d.valP < 0){
      /* 訓練正但驗證負 → 砍 */
      pruned++;
      log('  ✂️ 剪掉驗證虧損規則（訓練邊際 ' + margin + ', 驗證 ' + d.valP + '）', 'prune');
    }
  }
  return { rules: kept, pruned: pruned };
}

/* ========== 兜底 ========== */
function computeFallback(covered, valCovered, N){
  var uncovered = bsAndNot(bsNewFull(N), covered);
  var cnt = bsCount(uncovered);
  if(cnt === 0) return null;
  
  /* 只在不導致驗證更差時才選 */
  var bestTC = 0, bestProfit = -Infinity;
  for(var TC=0;TC<3;TC++){
    var p = profitForBS(uncovered, trainCodes, trainPayouts, trainN, TC);
    if(p > bestProfit){ bestProfit = p; bestTC = TC; }
  }
  
  var valP = 0;
  var valCnt = 0;
  if(valN > 0 && valCovered){
    var valUncov = bsAndNot(bsNewFull(valN), valCovered);
    valCnt = bsCount(valUncov);
    valP = profitForBS(valUncov, valCodes, valPayouts, valN, bestTC);
  }
  
  return { TC: bestTC, conds: [], trainCnt: cnt, trainProfit: bestProfit, valCnt: valCnt, valProfit: valP };
}

/* ========== 公式生成 ========== */
function featToSheet(feat){
  var M = {
    'A':'A2:A','B':'B2:B','C':'C2:C','D':'D2:D','E':'E2:E','F':'F2:F',
    '|A-B|':'ABS(A2:A-B2:B)','|A-C|':'ABS(A2:A-C2:C)','|A-D|':'ABS(A2:A-D2:D)',
    '|A-E|':'ABS(A2:A-E2:E)','|A-F|':'ABS(A2:A-F2:F)',
    '|B-C|':'ABS(B2:B-C2:C)','|B-D|':'ABS(B2:B-D2:D)','|B-E|':'ABS(B2:B-E2:E)',
    '|B-F|':'ABS(B2:B-F2:F)','|C-D|':'ABS(C2:C-D2:D)','|C-E|':'ABS(C2:C-E2:E)',
    '|C-F|':'ABS(C2:C-F2:F)','|D-E|':'ABS(D2:D-E2:E)','|D-F|':'ABS(D2:D-F2:F)',
    '|E-F|':'ABS(E2:E-F2:F)',
    'A-B':'(A2:A-B2:B)','A-C':'(A2:A-C2:C)','B-C':'(B2:B-C2:C)',
    'D-F':'(D2:D-F2:F)','E-D':'(E2:E-D2:D)',
    'A+B':'(A2:A+B2:B)','B+C':'(B2:B+C2:C)','D+E':'(D2:D+E2:E)',
    'E+F':'(E2:E+F2:F)','D+F':'(D2:D+F2:F)','A+C':'(A2:A+C2:C)',
    'A+B+C':'(A2:A+B2:B+C2:C)','D+E+F':'(D2:D+E2:E+F2:F)','A+D':'(A2:A+D2:D)',
    'A/C':'IF(C2:C=0,0,A2:A/C2:C)',
    'D/F':'IF(F2:F=0,0,D2:D/F2:F)',
    'D/(D+F)':'IF(D2:D+F2:F=0,0,D2:D/(D2:D+F2:F))',
    'MAX(A,B,C)':'MAX(A2:A,B2:B,C2:C)','MIN(A,B,C)':'MIN(A2:A,B2:B,C2:C)',
    'MAX(D,E,F)':'MAX(D2:D,E2:E,F2:F)','MIN(D,E,F)':'MIN(D2:D,E2:E,F2:F)'
  };
  return M[feat] || '0';
}
function condToSheet(cond){
  var op = OPS[cond[1]];
  var v = Math.round(cond[2] * 100) / 100;
  return '(' + featToSheet(FEATURES[cond[0]]) + op + v + ')';
}
function ruleToSheet(rule){
  if(rule.conds.length === 0) return 'TRUE';
  var parts = [];
  for(var i=0;i<rule.conds.length;i++) parts.push(condToSheet(rule.conds[i]));
  return parts.join('*');
}
function genFormula(rules, fallbackTC){
  var inner = '"' + RESULTS[fallbackTC] + '"';
  for(var i=rules.length-1;i>=0;i--){
    var r = rules[i];
    inner = 'IF(' + ruleToSheet(r) + ',"' + RESULTS[r.TC] + '",' + inner + ')';
  }
  return '=ARRAYFORMULA(IF((A2:A="")*(B2:B="")*(C2:C="")*(D2:D="")*(E2:E="")*(F2:F=""),"",' + inner + '))';
}

/* ========== 資料解析 ========== */
function parseData(text){
  var rows = [];
  var seen = new Set();
  var dups = 0, total = 0;
  var lines = text.split('\n');
  for(var i=0;i<lines.length;i++){
    var p = lines[i].trim().split(/\s+/);
    if(p.length < 8) continue;
    var v = p.slice(0,6).map(Number);
    var r = p[7];
    if(v.some(isNaN)) continue;
    if(r !== 'H' && r !== 'D' && r !== 'A') continue;
    total++;
    var sig = v.join('|') + '|' + p[6] + '|' + r;
    if(seen.has(sig)){ dups++; continue; }
    seen.add(sig);
    rows.push({ A:v[0], B:v[1], C:v[2], D:v[3], E:v[4], F:v[5], result:r });
  }
  return { rows:rows, total:total, dups:dups };
}
function extractFeatures(rows){
  var N = rows.length;
  var mat = new Array(N);
  for(var i=0;i<N;i++){
    var r = rows[i];
    var A=r.A, B=r.B, C=r.C, D=r.D, E=r.E, F=r.F;
    var f = new Float64Array(FCOUNT);
    f[0]=A; f[1]=B; f[2]=C; f[3]=D; f[4]=E; f[5]=F;
    f[6]=Math.abs(A-B); f[7]=Math.abs(A-C); f[8]=Math.abs(A-D); f[9]=Math.abs(A-E); f[10]=Math.abs(A-F);
    f[11]=Math.abs(B-C); f[12]=Math.abs(B-D); f[13]=Math.abs(B-E); f[14]=Math.abs(B-F);
    f[15]=Math.abs(C-D); f[16]=Math.abs(C-E); f[17]=Math.abs(C-F);
    f[18]=Math.abs(D-E); f[19]=Math.abs(D-F); f[20]=Math.abs(E-F);
    f[21]=A-B; f[22]=A-C; f[23]=B-C; f[24]=D-F; f[25]=E-D;
    f[26]=A+B; f[27]=B+C; f[28]=D+E; f[29]=E+F; f[30]=D+F; f[31]=A+C;
    f[32]=A+B+C; f[33]=D+E+F; f[34]=A+D;
    f[35] = C === 0 ? 0 : A/C;
    f[36] = F === 0 ? 0 : D/F;
    f[37] = (D+F) === 0 ? 0 : D/(D+F);
    f[38]=Math.max(A,B,C); f[39]=Math.min(A,B,C);
    f[40]=Math.max(D,E,F); f[41]=Math.min(D,E,F);
    mat[i] = f;
  }
  return mat;
}
function extractMeta(rows){
  var N = rows.length;
  var codes = new Int8Array(N);
  var payouts = new Float64Array(N * 3);
  for(var i=0;i<N;i++){
    codes[i] = RESULT_CODES[rows[i].result];
    payouts[i*3] = rows[i].D;
    payouts[i*3+1] = rows[i].E;
    payouts[i*3+2] = rows[i].F;
  }
  return { codes: codes, payouts: payouts };
}

/* ========== 日誌 ========== */
var logBuffer = [];
var logTimer = null;
function nowTime(){
  if(!startTime) return '[00:00]';
  var ms = Date.now() - startTime;
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  return '[' + String(m).padStart(2,'0') + ':' + String(s%60).padStart(2,'0') + ']';
}
function log(text, cls){
  logBuffer.push({ t: text, c: cls || '' });
  if(!logTimer) logTimer = setTimeout(flushLog, 80);
}
function flushLog(){
  logTimer = null;
  if(logBuffer.length === 0) return;
  var logEl = document.getElementById('log');
  if(!logEl.dataset.started){ logEl.textContent = ''; logEl.dataset.started = '1'; }
  var frag = document.createDocumentFragment();
  for(var i=0;i<logBuffer.length;i++){
    var e = logBuffer[i];
    var div = document.createElement('div');
    if(e.c) div.className = 'l-' + e.c;
    div.textContent = e.t;
    frag.appendChild(div);
  }
  logBuffer = [];
  logEl.appendChild(frag);
  logEl.scrollTop = logEl.scrollHeight;
}
function flushNow(){ if(logTimer){ clearTimeout(logTimer); logTimer = null; } flushLog(); }

function setProgress(pct, text){
  document.getElementById('progbar').style.width = pct + '%';
  document.getElementById('progText').textContent = text || (pct.toFixed(1) + '%');
}
async function yieldUI(){
  flushNow();
  var now = Date.now();
  if(now - lastYield < 50) return;
  lastYield = now;
  return new Promise(function(r){ setTimeout(r, 0); });
}

/* ========== 主流程 ========== */
async function start(){
  condCache.train.clear();
  condCache.val.clear();
  featureCandidates = {};
  running = true;
  startTime = Date.now();
  lastYield = 0;

  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('best').style.display = 'none';
  document.getElementById('warnBox').style.display = 'none';
  document.getElementById('log').textContent = '';
  document.getElementById('log').dataset.started = '1';
  logBuffer = [];

  var parsed = parseData(document.getElementById('input').value);
  if(parsed.rows.length === 0){ alert('沒有有效數據'); running = false; return; }

  var strength = parseInt(document.getElementById('strength').value);
  var useVal = document.getElementById('useVal').checked;
  var doPrune = document.getElementById('optPrune').checked;
  var strict = document.getElementById('optStrict').checked;

  log('═══════════════════════════════════════════', 'head');
  log('🚀 v37.1 — ROI 最大化（反過擬合）', 'head');
  log('═══════════════════════════════════════════', 'head');
  log(nowTime() + ' 有效行數：' + parsed.total);
  log(nowTime() + ' 重複忽略：' + parsed.dups, 'warn');
  log(nowTime() + ' 去重後：' + parsed.rows.length, 'ok');
  log(nowTime() + ' 嚴格模式：' + (strict ? '✅ 驗證必須正' : '❌ 關'), 'info');
  log(nowTime() + ' 剪枝：' + (doPrune ? '✅ 開' : '❌ 關'));
  await yieldUI();

  var rows = parsed.rows.slice();
  for(var i=rows.length-1;i>0;i--){
    var j = Math.floor(Math.random() * (i+1));
    var t = rows[i]; rows[i] = rows[j]; rows[j] = t;
  }

  var trainRows, valRows;
  if(useVal && rows.length >= 50){
    var split = Math.floor(rows.length * 0.8);
    trainRows = rows.slice(0, split);
    valRows = rows.slice(split);
  } else {
    trainRows = rows;
    valRows = [];
  }

  trainN = trainRows.length;
  valN = valRows.length;
  trainFeat = extractFeatures(trainRows);
  var tm = extractMeta(trainRows);
  trainCodes = tm.codes;
  trainPayouts = tm.payouts;

  if(valN > 0){
    valFeat = extractFeatures(valRows);
    var vm = extractMeta(valRows);
    valCodes = vm.codes;
    valPayouts = vm.payouts;
  } else {
    valFeat = null; valCodes = null; valPayouts = null;
  }

  log(nowTime() + ' 訓練：' + trainN + '　驗證：' + valN, 'info');
  if(valN > 0 && valN < 100){
    log('⚠️ 驗證集只有 ' + valN + ' 場，泛化評估可能不準', 'warn');
  }
  await yieldUI();

  /* 基準 */
  var baseProfits = [0, 0, 0];
  var fullBS = bsNewFull(trainN);
  for(var TC=0;TC<3;TC++) baseProfits[TC] = profitForBS(fullBS, trainCodes, trainPayouts, trainN, TC);
  var baseROIs = [baseProfits[0]/trainN, baseProfits[1]/trainN, baseProfits[2]/trainN];
  var bestBase = Math.max(baseROIs[0], baseROIs[1], baseROIs[2]);

  log('');
  log('📊 基準（全押同結果）：', 'base');
  log('   全 H：' + baseROIs[0].toFixed(2) + '%');
  log('   全 D：' + baseROIs[1].toFixed(2) + '%');
  log('   全 A：' + baseROIs[2].toFixed(2) + '%');
  log('   👉 基準最好：' + bestBase.toFixed(2) + '%', 'info');
  await yieldUI();

  /* 種子 */
  setProgress(10, '生成種子...');
  log('');
  log('🌱 生成種子（' + (strict ? '訓練+驗證都正' : '訓練正') + '）...', 'info');
  var t0 = Date.now();
  var seeds = generateSeeds(strict);
  log('   ' + seeds.length + ' 個種子（' + (Date.now() - t0) + 'ms）', 'ok');
  await yieldUI();

  if(seeds.length === 0){
    log('⚠️ 無合格種子，只輸出兜底規則', 'warn');
    log('💡 建議：關閉嚴格模式、或收集更多資料', 'warn');
  }

  /* 排序 */
  seeds.sort(function(a,b){
    var ra = valN > 0 ? (a.trainP/trainN*0.3 + a.valP/valN*0.7) : (a.trainP/trainN);
    var rb = valN > 0 ? (b.trainP/trainN*0.3 + b.valP/valN*0.7) : (b.trainP/trainN);
    return rb - ra;
  });

  var topN, compareN, maxSteps;
  if(strength === 0){ topN = 30; compareN = 100; maxSteps = 2; }
  else if(strength === 1){ topN = 80; compareN = 200; maxSteps = 3; }
  else if(strength === 2){ topN = 150; compareN = 400; maxSteps = 3; }
  else { topN = 300; compareN = 800; maxSteps = 3; }
  
  var topSeeds = seeds.slice(0, topN);
  var compareSeeds = seeds.slice(0, compareN);
  log('   保留 ' + topSeeds.length + ' 種子（最多 '+maxSteps+' 條件）', 'info');
  await yieldUI();

  /* 擴展 */
  setProgress(25, '貪心擴展...');
  log('');
  log('🔧 貪心擴展（雙邊評分）...', 'info');
  var t1 = Date.now();
  var expanded = [];
  for(var si=0;si<topSeeds.length;si++){
    if(!running) break;
    expanded.push(expandSeed(topSeeds[si], compareSeeds, maxSteps, strict));
    if(si % 20 === 0) await yieldUI();
  }
  log('   擴展出 ' + expanded.length + ' 條（' + (Date.now() - t1) + 'ms）', 'ok');
  await yieldUI();

  /* 剪枝 */
  var prunedCount = 0;
  if(doPrune){
    setProgress(45, '剪枝...');
    log('');
    log('✂️ 剪掉訓練正但驗證虧的規則...', 'info');
    var pr = pruneRules(expanded);
    expanded = pr.rules;
    prunedCount = pr.pruned;
    log('   砍掉 ' + prunedCount + ' 條，剩 ' + expanded.length + ' 條', 'prune');
    await yieldUI();
  }

  /* 順序選擇 */
  setProgress(70, '順序選擇...');
  log('');
  log('📋 順序選擇（雙邊邊際）...', 'info');
  var t2 = Date.now();
  var selResult = sequentialSelect(expanded, trainN);
  log('   選出 ' + selResult.chosen.length + ' 條（' + (Date.now() - t2) + 'ms）', 'ok');
  await yieldUI();

  /* 兜底 */
  var valCovered = null;
  if(valN > 0){
    valCovered = bsNew(valN);
    for(var ri=0;ri<selResult.chosen.length;ri++){
      var r = selResult.chosen[ri];
      var d = evalRuleDual(r.conds, r.TC);
      bsOrInPlace(valCovered, d.valBS);
    }
  }
  var fb = computeFallback(selResult.covered, valCovered, trainN);
  if(fb){
    log('🛡️ 兜底：訓練剩 ' + fb.trainCnt + ' 場 → ' + RESULTS[fb.TC] + 
        (valN > 0 ? '（驗證剩 ' + fb.valCnt + ' 場，利潤 ' + fb.valProfit + '）' : ''), 'fallback');
  } else {
    log('🛡️ 無需兜底（100% 已覆蓋）', 'fallback');
  }

  var finalRules = selResult.chosen.slice();
  if(fb) finalRules.push(fb);

  /* 最終評估 */
  setProgress(90, '最終評估...');
  
  /* 訓練 */
  var trainCover = bsNew(trainN);
  var trainTotal = 0;
  for(var ri=0;ri<finalRules.length;ri++){
    var r = finalRules[ri];
    var rbs;
    if(r.conds.length === 0) rbs = bsNewFull(trainN);
    else {
      rbs = getCondBS('train', r.conds[0][0], r.conds[0][1], r.conds[0][2]);
      for(var c=1;c<r.conds.length;c++){
        var cd = r.conds[c];
        rbs = bsAnd(rbs, getCondBS('train', cd[0], cd[1], cd[2]));
      }
    }
    var only = bsAndNot(rbs, trainCover);
    trainTotal += profitForBS(only, trainCodes, trainPayouts, trainN, r.TC);
    bsOrInPlace(trainCover, rbs);
  }
  var trainROI = trainTotal / trainN;
  var coverCount = bsCount(trainCover);
  var coverPct = coverCount / trainN * 100;

  /* 驗證 */
  var valTotal = 0, valROI = 0;
  if(valN > 0){
    var valCover = bsNew(valN);
    for(var ri2=0;ri2<finalRules.length;ri2++){
      var r2 = finalRules[ri2];
      var rbs2;
      if(r2.conds.length === 0) rbs2 = bsNewFull(valN);
      else {
        rbs2 = getCondBS('val', r2.conds[0][0], r2.conds[0][1], r2.conds[0][2]);
        for(var c2=1;c2<r2.conds.length;c2++){
          var cd2 = r2.conds[c2];
          rbs2 = bsAnd(rbs2, getCondBS('val', cd2[0], cd2[1], cd2[2]));
        }
      }
      var only2 = bsAndNot(rbs2, valCover);
      valTotal += profitForBS(only2, valCodes, valPayouts, valN, r2.TC);
      bsOrInPlace(valCover, rbs2);
    }
    valROI = valTotal / valN;
  }

  var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

  /* 結果 */
  log('');
  log('═══════════════════════════════════════════', 'head');
  log('🏆 完成！', 'best');
  log('═══════════════════════════════════════════', 'head');
  log('   規則數：' + finalRules.length, 'info');
  log('   📈 訓練 ROI：' + trainROI.toFixed(2) + '%（' + trainTotal + '）', 'roi');
  if(valN > 0){
    log('   📈 驗證 ROI：' + valROI.toFixed(2) + '%（' + valTotal + '）', 
        valROI > 0 ? 'roi' : 'danger');
  }
  log('   🛡️ 覆蓋率：' + coverCount + '/' + trainN + ' = ' + coverPct.toFixed(2) + '%', 'success');
  log('   ⏱️ 耗時：' + elapsed + ' 秒', 'speed');
  log('═══════════════════════════════════════════', 'head');
  flushNow();

  /* 公式 */
  var fallbackTC = fb ? fb.TC : 1;
  var formula = genFormula(finalRules, fallbackTC);

  /* 顯示 */
  setProgress(100, '完成');
  document.getElementById('best').style.display = 'block';
  document.getElementById('roiBig').textContent = trainROI.toFixed(2) + '%';
  
  var detail = '訓練 ROI：<b>' + trainROI.toFixed(2) + '%</b>（' + trainTotal + ' / ' + trainN + ' 場）';
  if(valN > 0){
    detail += '<br>驗證 ROI：<b style="color:' + (valROI > 0 ? '#0a7a0a' : '#c00') + '">' + valROI.toFixed(2) + '%</b>（' + valTotal + ' / ' + valN + ' 場）';
  }
  detail += '<br>覆蓋率：<b>' + coverPct.toFixed(2) + '%</b>　基準：' + bestBase.toFixed(2) + '%';
  document.getElementById('roiDetail').innerHTML = detail;

  /* 警告 */
  var warnBox = document.getElementById('warnBox');
  if(valN > 0 && valROI < 0){
    warnBox.style.display = 'block';
    warnBox.innerHTML = '<b>⚠️ 警告：驗證 ROI 是負的（' + valROI.toFixed(2) + '%）</b><br>' +
      '此公式在未見資料上會虧錢，<b>不建議上線</b>。<br>' +
      '建議：① 收集更多資料 ② 降低挖掘強度 ③ 保持嚴格模式開啟';
  } else if(valN > 0 && trainROI > 0 && valROI / trainROI < 0.3){
    warnBox.style.display = 'block';
    warnBox.innerHTML = '<b>⚠️ 警告：驗證 ROI 只有訓練的 ' + (valROI/trainROI*100).toFixed(0) + '%</b><br>' +
      '可能過擬合，建議降低挖掘強度或收集更多資料';
  } else if(valN > 0 && valROI > 0 && valROI / trainROI >= 0.6){
    warnBox.style.display = 'block';
    warnBox.style.background = '#dcfce7';
    warnBox.style.borderColor = '#22c55e';
    warnBox.style.color = '#14532d';
    warnBox.innerHTML = '✅ 泛化良好！驗證 ROI 達訓練的 ' + (valROI/trainROI*100).toFixed(0) + '%<br>' +
      '可以放心使用此公式';
  }

  document.getElementById('txtOut').value = formula;
  document.getElementById('charInfo').innerHTML = '字符數：<b>' + formula.length + '</b>';

  renderRuleTable(finalRules);
  running = false;
  document.getElementById('btnRun').disabled = false;
  document.getElementById('btnStop').disabled = true;
  flushNow();
}

function stop(){
  running = false;
  document.getElementById('btnStop').disabled = true;
  log('⏹ 手動停止', 'warn');
  flushNow();
}

/* ========== 規則表 ========== */
function renderRuleTable(rules){
  var N = trainN;
  var covered = bsNew(N);
  var html = '<table><thead><tr>' +
    '<th>#</th><th>類型</th><th>結果</th><th>條件</th>' +
    '<th>訓練命中</th><th>訓練利潤</th><th>驗證利潤</th>' +
    '</tr></thead><tbody>';

  for(var ri=0;ri<rules.length;ri++){
    var rule = rules[ri];
    var rbs;
    if(rule.conds.length === 0) rbs = bsNewFull(N);
    else {
      rbs = getCondBS('train', rule.conds[0][0], rule.conds[0][1], rule.conds[0][2]);
      for(var c=1;c<rule.conds.length;c++){
        var cd = rule.conds[c];
        rbs = bsAnd(rbs, getCondBS('train', cd[0], cd[1], cd[2]));
      }
    }
    var only = bsAndNot(rbs, covered);
    var cnt = 0, profit = 0;
    for(var w=0;w<only.length;w++){
      var x = only[w];
      while(x){
        var low = x & -x;
        var idx = (w << 5) + (31 - Math.clz32(low));
        if(idx < N){
          cnt++;
          profit += (trainCodes[idx] === rule.TC) ? (trainPayouts[idx*3+rule.TC] - 100) : -100;
        }
        x ^= low;
      }
    }
    bsOrInPlace(covered, rbs);

    var valProfit = 0;
    if(valN > 0){
      var d = evalRuleDual(rule.conds, rule.TC);
      valProfit = d.valP;
    }

    var typeTag = rule.conds.length === 0 ? '<span class="tag-fb">🛡️兜底</span>' : '<span class="tag-auto">🧠</span>';
    var tcClass = rule.TC === 0 ? 'tag-h' : (rule.TC === 1 ? 'tag-d' : 'tag-a');
    var tcTag = '<span class="' + tcClass + '">' + RESULTS[rule.TC] + '</span>';
    var condStr = rule.conds.length === 0 ? '(全部剩餘)' :
      rule.conds.map(function(cc){
        return FEATURES[cc[0]] + OPS[cc[1]] + (Math.round(cc[2]*100)/100);
      }).join(' & ');
    var tp = profit > 0 ? 'pos' : (profit < 0 ? 'neg' : '');
    var vp = valProfit > 0 ? 'pos' : (valProfit < 0 ? 'neg' : '');

    html += '<tr><td>R' + (ri+1) + '</td><td>' + typeTag + '</td><td>' + tcTag + '</td>' +
      '<td style="font-size:10px">' + condStr + '</td>' +
      '<td>' + cnt + '</td><td class="' + tp + '">' + profit + '</td>' +
      '<td class="' + vp + '">' + (valN > 0 ? valProfit : '-') + '</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('ruleTable').innerHTML = html;
}

function copyFormula(){
  var el = document.getElementById('txtOut');
  var txt = el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      showMsg('✅ 已複製 ' + txt.length + ' 字元', true);
    }).catch(function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg('✅ 已複製 ' + text.length + ' 字元', true);
  else showMsg('❌ 複製失敗', false);
}
function showMsg(text, ok){
  var m = document.getElementById('msg');
  m.textContent = text; m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  setTimeout(function(){ m.style.display = 'none'; }, 3000);
}
