<script>
'use strict';

var FEATURES = [
  'A','B','C','D','E','F',
  '|A-B|','|A-C|','|A-D|','|A-E|','|A-F|',
  '|B-C|','|B-D|','|B-E|','|B-F|',
  '|C-D|','|C-E|','|C-F|',
  '|D-E|','|D-F|','|E-F|',
  'A-B','A-C','B-C','D-F','E-D',
  'A+B','B+C','D+E','E+F','D+F','A+C',
  'A+B+C','D+E+F','A+D',
  'A/C','D/F','D/(D+F)',
  'MAX(A,B,C)','MIN(A,B,C)','MAX(D,E,F)','MIN(D,E,F)'
];
var FCOUNT = FEATURES.length;
var OPS = ['>', '>=', '<', '<='];
var RESULTS = ['H', 'D', 'A'];
var RESULT_CODES = { H: 0, D: 1, A: 2 };

var trainFeat = null, trainCodes = null, trainPayouts = null, trainN = 0;
var valFeat = null, valCodes = null, valPayouts = null, valN = 0;
var running = false;
var startTime = 0;
var lastYield = 0;
var condCache = { train: new Map(), val: new Map() };
var featureCandidates = {};

function bsNew(N){ return new Uint32Array((N+31)>>5); }
function bsNewFull(N){
  var bs = new Uint32Array((N+31)>>5);
  bs.fill(0xFFFFFFFF);
  var rem = N & 31;
  if(rem) bs[bs.length-1] = (1 << rem) - 1;
  return bs;
}
function bsAnd(a,b){
  var r = new Uint32Array(a.length);
  for(var i=0;i<a.length;i++) r[i] = a[i] & b[i];
  return r;
}
function bsAndNot(a,b){
  var r = new Uint32Array(a.length);
  for(var i=0;i<a.length;i++) r[i] = a[i] & ~b[i];
  return r;
}
function bsOrInPlace(a,b){ for(var i=0;i<a.length;i++) a[i] |= b[i]; }
function bsCount(bs){
  var c = 0;
  for(var i=0;i<bs.length;i++){
    var x = bs[i];
    x = x - ((x>>1) & 0x55555555);
    x = (x & 0x33333333) + ((x>>2) & 0x33333333);
    x = (x + (x>>4)) & 0x0F0F0F0F;
    c += (x * 0x01010101) >>> 24;
  }
  return c;
}
function evalCond(x, opIdx, v){
  switch(opIdx){
    case 0: return x > v;
    case 1: return x >= v;
    case 2: return x < v;
    case 3: return x <= v;
  }
  return false;
}
function getCondBS(side, fi, opIdx, v){
  var key = fi + '_' + opIdx + '_' + v;
  var cache = condCache[side];
  if(cache.has(key)) return cache.get(key);
  var featMat = side === 'train' ? trainFeat : valFeat;
  var N = side === 'train' ? trainN : valN;
  if(!featMat) return null;
  var bs = bsNew(N);
  for(var i=0;i<N;i++){
    if(evalCond(featMat[i][fi], opIdx, v)) bs[i>>5] |= 1 << (i & 31);
  }
  cache.set(key, bs);
  return bs;
}
function profitForBS(bs, codes, payouts, N, TC){
  var p = 0;
  for(var w=0;w<bs.length;w++){
    var x = bs[w];
    while(x){
      var low = x & -x;
      var idx = (w << 5) + (31 - Math.clz32(low));
      if(idx < N){
        p += (codes[idx] === TC) ? (payouts[idx*3+TC] - 100) : -100;
      }
      x ^= low;
    }
  }
  return p;
}
function getCandidates(fi){
  if(featureCandidates[fi]) return featureCandidates[fi];
  var vals = [];
  for(var i=0;i<trainN;i++) vals.push(trainFeat[i][fi]);
  vals.sort(function(a,b){ return a-b; });
  var qs = [];
  var nq = Math.min(15, vals.length);
  for(var k=1;k<=nq;k++){
    var q = vals[Math.floor(k * trainN / (nq + 1))];
    if(qs.indexOf(q) === -1) qs.push(q);
  }
  featureCandidates[fi] = qs;
  return qs;
}

function generateSeeds(){
  var seeds = [];
  var minCnt = Math.max(5, Math.floor(trainN * 0.02));
  for(var fi=0;fi<FCOUNT;fi++){
    var qs = getCandidates(fi);
    for(var opIdx=0;opIdx<4;opIdx++){
      for(var qi=0;qi<qs.length;qi++){
        var v = qs[qi];
        var trainBS = getCondBS('train', fi, opIdx, v);
        var cnt = bsCount(trainBS);
        if(cnt < minCnt) continue;
        for(var TC=0;TC<3;TC++){
          var trainP = profitForBS(trainBS, trainCodes, trainPayouts, trainN, TC);
          if(trainP <= 0) continue;
          seeds.push({ fi:fi, opIdx:opIdx, v:v, TC:TC, trainBS:trainBS, trainP:trainP, cnt:cnt });
        }
      }
    }
  }
  return seeds;
}

function expandSeed(seed, allSeeds, maxSteps){
  var conds = [[seed.fi, seed.opIdx, seed.v]];
  var trainBS = seed.trainBS;
  var trainP = seed.trainP;
  var density = trainP / trainN;

  for(var step=0;step<maxSteps;step++){
    var best = null;
    for(var i=0;i<allSeeds.length;i++){
      var c = allSeeds[i];
      if(c.TC !== seed.TC) continue;
      if(c.trainBS === trainBS) continue;
      var dup = false;
      for(var d=0;d<conds.length;d++){
        if(conds[d][0] === c.fi && conds[d][1] === c.opIdx){ dup = true; break; }
      }
      if(dup) continue;
      var newTrainBS = bsAnd(trainBS, c.trainBS);
      var newCnt = bsCount(newTrainBS);
      if(newCnt < Math.max(5, Math.floor(trainN * 0.02))) continue;
      var newTrainP = profitForBS(newTrainBS, trainCodes, trainPayouts, trainN, seed.TC);
      if(newTrainP <= 0) continue;
      var newDensity = newTrainP / trainN;
      if(newDensity > density * 1.02){
        if(!best || newDensity > best.density){
          best = { fi:c.fi, opIdx:c.opIdx, v:c.v, trainBS:newTrainBS, trainP:newTrainP, density:newDensity };
        }
      }
    }
    if(!best) break;
    conds.push([best.fi, best.opIdx, best.v]);
    trainBS = best.trainBS;
    trainP = best.trainP;
    density = best.density;
  }
  return { TC: seed.TC, conds: conds, trainBS: trainBS, trainP: trainP };
}

function sequentialSelect(candidates, N){
  var covered = bsNew(N);
  var chosen = [];
  for(var iter=0;iter<100;iter++){
    if(!running) break;
    var best = null, bestMargin = 0;
    for(var i=0;i<candidates.length;i++){
      var r = candidates[i];
      var only = bsAndNot(r.trainBS, covered);
      var margin = profitForBS(only, trainCodes, trainPayouts, trainN, r.TC);
      if(margin > bestMargin){ bestMargin = margin; best = { rule: r, margin: margin }; }
    }
    if(!best) break;
    chosen.push({ TC: best.rule.TC, conds: best.rule.conds, margin: best.margin });
    bsOrInPlace(covered, best.rule.trainBS);
  }
  return { chosen: chosen, covered: covered };
}

function computeFallback(covered, N){
  var uncovered = bsAndNot(bsNewFull(N), covered);
  var cnt = bsCount(uncovered);
  if(cnt === 0) return null;
  var bestTC = 0, bestProfit = -Infinity;
  for(var TC=0;TC<3;TC++){
    var p = profitForBS(uncovered, trainCodes, trainPayouts, trainN, TC);
    if(p > bestProfit){ bestProfit = p; bestTC = TC; }
  }
  /* ✅ 修復：加入 margin 欄位 */
  return { TC: bestTC, conds: [], margin: bestProfit, trainCnt: cnt, trainProfit: bestProfit };
}

function evaluateRules(rules, side){
  var N = side === 'train' ? trainN : valN;
  var codes = side === 'train' ? trainCodes : valCodes;
  var payouts = side === 'train' ? trainPayouts : valPayouts;
  var covered = bsNew(N);
  var total = 0;
  for(var i=0;i<rules.length;i++){
    var r = rules[i];
    var rbs;
    if(r.conds.length === 0) rbs = bsNewFull(N);
    else {
      rbs = getCondBS(side, r.conds[0][0], r.conds[0][1], r.conds[0][2]);
      for(var c=1;c<r.conds.length;c++){
        rbs = bsAnd(rbs, getCondBS(side, r.conds[c][0], r.conds[c][1], r.conds[c][2]));
      }
    }
    var only = bsAndNot(rbs, covered);
    total += profitForBS(only, codes, payouts, N, r.TC);
    bsOrInPlace(covered, rbs);
  }
  return { total: total, covered: covered };
}

function featToSheet(feat){
  var M = {
    'A':'A2:A','B':'B2:B','C':'C2:C','D':'D2:D','E':'E2:E','F':'F2:F',
    '|A-B|':'ABS(A2:A-B2:B)','|A-C|':'ABS(A2:A-C2:C)','|A-D|':'ABS(A2:A-D2:D)',
    '|A-E|':'ABS(A2:A-E2:E)','|A-F|':'ABS(A2:A-F2:F)',
    '|B-C|':'ABS(B2:B-C2:C)','|B-D|':'ABS(B2:B-D2:D)','|B-E|':'ABS(B2:B-E2:E)',
    '|B-F|':'ABS(B2:B-F2:F)','|C-D|':'ABS(C2:C-D2:D)','|C-E|':'ABS(C2:C-E2:E)',
    '|C-F|':'ABS(C2:C-F2:F)','|D-E|':'ABS(D2:D-E2:E)','|D-F|':'ABS(D2:D-F2:F)',
    '|E-F|':'ABS(E2:E-F2:F)',
    'A-B':'(A2:A-B2:B)','A-C':'(A2:A-C2:C)','B-C':'(B2:B-C2:C)',
    'D-F':'(D2:D-F2:F)','E-D':'(E2:E-D2:D)',
    'A+B':'(A2:A+B2:B)','B+C':'(B2:B+C2:C)','D+E':'(D2:D+E2:E)',
    'E+F':'(E2:E+F2:F)','D+F':'(D2:D+F2:F)','A+C':'(A2:A+C2:C)',
    'A+B+C':'(A2:A+B2:B+C2:C)','D+E+F':'(D2:D+E2:E+F2:F)','A+D':'(A2:A+D2:D)',
    'A/C':'IF(C2:C=0,0,A2:A/C2:C)',
    'D/F':'IF(F2:F=0,0,D2:D/F2:F)',
    'D/(D+F)':'IF(D2:D+F2:F=0,0,D2:D/(D2:D+F2:F))',
    'MAX(A,B,C)':'MAX(A2:A,B2:B,C2:C)','MIN(A,B,C)':'MIN(A2:A,B2:B,C2:C)',
    'MAX(D,E,F)':'MAX(D2:D,E2:E,F2:F)','MIN(D,E,F)':'MIN(D2:D,E2:E,F2:F)'
  };
  return M[feat] || '0';
}
function condToSheet(cond){
  var op = OPS[cond[1]];
  var v = Math.round(cond[2] * 100) / 100;
  return '(' + featToSheet(FEATURES[cond[0]]) + op + v + ')';
}
function ruleToSheet(rule){
  if(rule.conds.length === 0) return 'TRUE';
  var parts = [];
  for(var i=0;i<rule.conds.length;i++) parts.push(condToSheet(rule.conds[i]));
  return parts.join('*');
}
function genFormula(rules, fallbackTC){
  var inner = '"' + RESULTS[fallbackTC] + '"';
  for(var i=rules.length-1;i>=0;i--){
    var r = rules[i];
    inner = 'IF(' + ruleToSheet(r) + ',"' + RESULTS[r.TC] + '",' + inner + ')';
  }
  return '=ARRAYFORMULA(IF((A2:A="")*(B2:B="")*(C2:C="")*(D2:D="")*(E2:E="")*(F2:F=""),"",' + inner + '))';
}

function parseData(text){
  var rows = [], seen = new Set();
  var dups = 0, total = 0;
  var lines = text.split('\n');
  for(var i=0;i<lines.length;i++){
    var p = lines[i].trim().split(/\s+/);
    if(p.length < 8) continue;
    var v = p.slice(0,6).map(Number);
    var r = p[7];
    if(v.some(isNaN)) continue;
    if(r !== 'H' && r !== 'D' && r !== 'A') continue;
    total++;
    var sig = v.join('|') + '|' + p[6] + '|' + r;
    if(seen.has(sig)){ dups++; continue; }
    seen.add(sig);
    rows.push({ A:v[0], B:v[1], C:v[2], D:v[3], E:v[4], F:v[5], result:r });
  }
  return { rows:rows, total:total, dups:dups };
}
function extractFeatures(rows){
  var N = rows.length;
  var mat = new Array(N);
  for(var i=0;i<N;i++){
    var r = rows[i];
    var A=r.A, B=r.B, C=r.C, D=r.D, E=r.E, F=r.F;
    var f = new Float64Array(FCOUNT);
    f[0]=A; f[1]=B; f[2]=C; f[3]=D; f[4]=E; f[5]=F;
    f[6]=Math.abs(A-B); f[7]=Math.abs(A-C); f[8]=Math.abs(A-D); f[9]=Math.abs(A-E); f[10]=Math.abs(A-F);
    f[11]=Math.abs(B-C); f[12]=Math.abs(B-D); f[13]=Math.abs(B-E); f[14]=Math.abs(B-F);
    f[15]=Math.abs(C-D); f[16]=Math.abs(C-E); f[17]=Math.abs(C-F);
    f[18]=Math.abs(D-E); f[19]=Math.abs(D-F); f[20]=Math.abs(E-F);
    f[21]=A-B; f[22]=A-C; f[23]=B-C; f[24]=D-F; f[25]=E-D;
    f[26]=A+B; f[27]=B+C; f[28]=D+E; f[29]=E+F; f[30]=D+F; f[31]=A+C;
    f[32]=A+B+C; f[33]=D+E+F; f[34]=A+D;
    f[35] = C === 0 ? 0 : A/C;
    f[36] = F === 0 ? 0 : D/F;
    f[37] = (D+F) === 0 ? 0 : D/(D+F);
    f[38]=Math.max(A,B,C); f[39]=Math.min(A,B,C);
    f[40]=Math.max(D,E,F); f[41]=Math.min(D,E,F);
    mat[i] = f;
  }
  return mat;
}
function extractMeta(rows){
  var N = rows.length;
  var codes = new Int8Array(N);
  var payouts = new Float64Array(N * 3);
  for(var i=0;i<N;i++){
    codes[i] = RESULT_CODES[rows[i].result];
    payouts[i*3] = rows[i].D;
    payouts[i*3+1] = rows[i].E;
    payouts[i*3+2] = rows[i].F;
  }
  return { codes: codes, payouts: payouts };
}

var logBuffer = [], logTimer = null;
function nowTime(){
  if(!startTime) return '[00:00]';
  var ms = Date.now() - startTime;
  var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  return '[' + String(m).padStart(2,'0') + ':' + String(s%60).padStart(2,'0') + ']';
}
function log(text, cls){
  logBuffer.push({ t: text, c: cls || '' });
  if(!logTimer) logTimer = setTimeout(flushLog, 80);
}
function flushLog(){
  logTimer = null;
  if(logBuffer.length === 0) return;
  var logEl = document.getElementById('log');
  if(!logEl.dataset.started){ logEl.textContent = ''; logEl.dataset.started = '1'; }
  var frag = document.createDocumentFragment();
  for(var i=0;i<logBuffer.length;i++){
    var e = logBuffer[i];
    var div = document.createElement('div');
    if(e.c) div.className = 'l-' + e.c;
    div.textContent = e.t;
    frag.appendChild(div);
  }
  logBuffer = [];
  logEl.appendChild(frag);
  logEl.scrollTop = logEl.scrollHeight;
}
function flushNow(){ if(logTimer){ clearTimeout(logTimer); logTimer = null; } flushLog(); }
function setProgress(pct, text){
  document.getElementById('progbar').style.width = pct + '%';
  document.getElementById('progText').textContent = text || (pct.toFixed(1) + '%');
}
async function yieldUI(){
  flushNow();
  var now = Date.now();
  if(now - lastYield < 50) return;
  lastYield = now;
  return new Promise(function(r){ setTimeout(r, 0); });
}

async function runOneMining(parsed, useVal, strength){
  condCache.train.clear();
  condCache.val.clear();
  featureCandidates = {};

  var rows = parsed.rows.slice();
  for(var i=rows.length-1;i>0;i--){
    var j = Math.floor(Math.random() * (i+1));
    var t = rows[i]; rows[i] = rows[j]; rows[j] = t;
  }

  var trainRows, valRows;
  if(useVal && rows.length >= 50){
    var split = Math.floor(rows.length * 0.8);
    trainRows = rows.slice(0, split);
    valRows = rows.slice(split);
  } else {
    trainRows = rows; valRows = [];
  }

  trainN = trainRows.length;
  valN = valRows.length;
  trainFeat = extractFeatures(trainRows);
  var tm = extractMeta(trainRows);
  trainCodes = tm.codes; trainPayouts = tm.payouts;

  if(valN > 0){
    valFeat = extractFeatures(valRows);
    var vm = extractMeta(valRows);
    valCodes = vm.codes; valPayouts = vm.payouts;
  } else {
    valFeat = null; valCodes = null; valPayouts = null;
  }

  var fullBS = bsNewFull(trainN);
  var baseProfits = [0,0,0];
  for(var TC=0;TC<3;TC++) baseProfits[TC] = profitForBS(fullBS, trainCodes, trainPayouts, trainN, TC);
  var baseROIs = [baseProfits[0]/(trainN*100), baseProfits[1]/(trainN*100), baseProfits[2]/(trainN*100)];
  var bestBase = Math.max(baseROIs[0], baseROIs[1], baseROIs[2]);

  log(nowTime() + ' 訓練 ' + trainN + ' 驗證 ' + valN + '，基準 ' + (bestBase*100).toFixed(2) + '%');

  var seeds = generateSeeds();
  log(nowTime() + ' 種子：' + seeds.length + ' 個');
  await yieldUI();

  if(seeds.length === 0){
    return { trainROI: 0, valROI: 0, formula: '', rules: [], trainTotal: 0, valTotal: 0, trainN: trainN, valN: valN, bestBase: bestBase, hasData: false };
  }

  seeds.sort(function(a,b){ return (b.trainP/trainN) - (a.trainP/trainN); });

  var topN, compareN, maxSteps;
  if(strength === 0){ topN = 30; compareN = 100; maxSteps = 2; }
  else if(strength === 1){ topN = 80; compareN = 200; maxSteps = 3; }
  else { topN = 150; compareN = 400; maxSteps = 3; }

  var topSeeds = seeds.slice(0, topN);
  var compareSeeds = seeds.slice(0, compareN);

  var expanded = [];
  for(var si=0;si<topSeeds.length;si++){
    if(!running) break;
    expanded.push(expandSeed(topSeeds[si], compareSeeds, maxSteps));
    if(si % 20 === 0) await yieldUI();
  }
  log(nowTime() + ' 擴展：' + expanded.length + ' 條');

  var selResult = sequentialSelect(expanded, trainN);
  log(nowTime() + ' 選出：' + selResult.chosen.length + ' 條');

  var fb = computeFallback(selResult.covered, trainN);
  var finalRules = selResult.chosen.slice();
  if(fb) finalRules.push(fb);

  var trainEval = evaluateRules(finalRules, 'train');
  var trainROI = trainEval.total / (trainN * 100);
  var valTotal = 0, valROI = 0;
  if(valN > 0){
    var valEval = evaluateRules(finalRules, 'val');
    valTotal = valEval.total;
    valROI = valTotal / (valN * 100);
  }

  var fallbackTC = fb ? fb.TC : 1;
  var formula = genFormula(finalRules, fallbackTC);

  log(nowTime() + ' ✓ 訓練 ' + (trainROI*100).toFixed(2) + '% 驗證 ' + (valROI*100).toFixed(2) + '%',
      valROI > 0 ? 'success' : 'danger');

  return {
    trainROI: trainROI, valROI: valROI,
    trainTotal: trainEval.total, valTotal: valTotal,
    trainN: trainN, valN: valN,
    bestBase: bestBase,
    formula: formula, rules: finalRules,
    fallbackTC: fallbackTC,
    hasData: true
  };
}

async function start(){
  running = true;
  startTime = Date.now();
  lastYield = 0;

  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('best').style.display = 'none';
  document.getElementById('log').textContent = '';
  document.getElementById('log').dataset.started = '1';
  logBuffer = [];

  var parsed = parseData(document.getElementById('input').value);
  if(parsed.rows.length === 0){ alert('沒有有效數據'); running = false; document.getElementById('btnRun').disabled = false; return; }

  var strength = parseInt(document.getElementById('strength').value);
  var numRuns = parseInt(document.getElementById('numRuns').value);
  var useVal = document.getElementById('useVal').checked;

  if(numRuns > 1 && !useVal){
    useVal = true;
    document.getElementById('useVal').checked = true;
    log('⚠️ 多次運行已自動啟用驗證分割', 'warn');
  }

  log('═══════════════════════════════════════════', 'head');
  log('🚀 v37.4 — Bug 修復版', 'head');
  log('═══════════════════════════════════════════', 'head');
  log(nowTime() + ' 去重後：' + parsed.rows.length + ' 筆');
  log(nowTime() + ' 運行次數：' + numRuns);
  await yieldUI();

  var allResults = [];
  for(var runIdx = 0; runIdx < numRuns; runIdx++){
    if(!running) break;
    log('');
    log('═══════════════════════════════════════════', 'head');
    log('🔄 運行 ' + (runIdx + 1) + ' / ' + numRuns, 'head');
    log('═══════════════════════════════════════════', 'head');
    setProgress((runIdx / numRuns) * 100, '運行 ' + (runIdx+1) + '/' + numRuns);
    await yieldUI();
    var result = await runOneMining(parsed, useVal, strength);
    allResults.push(result);
    log(nowTime() + ' 完成運行 ' + (runIdx+1), 'run');
  }

  if(!running || allResults.length === 0){ running = false; document.getElementById('btnRun').disabled = false; document.getElementById('btnStop').disabled = true; return; }

  setProgress(100, '完成');
  displayResults(allResults, numRuns);
  running = false;
  document.getElementById('btnRun').disabled = false;
  document.getElementById('btnStop').disabled = true;
  flushNow();
}

function displayResults(results, numRuns){
  var valid = results.filter(function(r){ return r.hasData; });
  if(valid.length === 0){
    alert('所有運行都無合格規則，建議收集更多資料');
    return;
  }

  var hasVal = valid[0].valN > 0;

  var avgVal = 0, avgTrain = 0, avgGenRate = 0, valPosCount = 0;
  var valROIs = [];
  var genRates = [];
  for(var i=0;i<valid.length;i++){
    var r = valid[i];
    avgTrain += r.trainROI;
    if(hasVal){
      avgVal += r.valROI;
      valROIs.push(r.valROI);
      if(r.valROI > 0) valPosCount++;
      /* ✅ 修復：只在 trainROI > 0 且 valROI 也 > 0 時計入泛化率，否則記為 null */
      var gr = (r.trainROI > 0 && r.valROI > 0) ? (r.valROI / r.trainROI) : null;
      genRates.push(gr);
      if(gr !== null) avgGenRate += gr;
    }
  }
  avgTrain /= valid.length;
  var winRate = hasVal ? (valPosCount / valid.length) : 0;
  
  var genRateValid = genRates.filter(function(g){ return g !== null; });
  if(hasVal){
    avgVal /= valid.length;
    avgGenRate = genRateValid.length > 0 ? (avgGenRate / genRateValid.length) : null;
  }

  var valStd = 0;
  if(hasVal && valROIs.length > 1){
    var mean = avgVal, sq = 0;
    for(var i=0;i<valROIs.length;i++) sq += Math.pow(valROIs[i] - mean, 2);
    valStd = Math.sqrt(sq / valROIs.length);
  }

  /* ✅ 修復：選中位偏上（50% 分位） */
  var sorted = valid.slice().sort(function(a,b){ return (a.valROI || 0) - (b.valROI || 0); });
  var bestRun = valid[0];
  if(sorted.length >= 3 && hasVal){
    var hiIdx = Math.max(0, Math.floor(sorted.length * 0.5));
    bestRun = sorted[hiIdx];
  } else if(hasVal){
    bestRun = sorted[Math.floor(sorted.length / 2)];
  }
  var topRun = hasVal ? sorted[sorted.length - 1] : valid[0];

  /* ✅ 修復：5 星門檻合理化 */
  var stars = 1, label = '', reason = '', cls = 'v1';

  if(!hasVal){
    if(avgTrain > 0.05){ stars = 2; label = '無法評估（缺驗證）'; cls = 'v2'; reason = '請啟用驗證分割'; }
    else { stars = 1; label = '無法評估'; cls = 'v1'; reason = '請啟用驗證分割'; }
  } else {
    var grForRating = avgGenRate === null ? 0 : avgGenRate;
    if(avgVal >= 0.03 && winRate >= 0.7 && grForRating >= 0.6){
      stars = 5; label = '強烈推薦'; cls = 'v5'; reason = '多次穩定為正，泛化良好';
    } else if(avgVal >= 0.01 && winRate >= 0.6 && grForRating >= 0.4){
      stars = 4; label = '推薦'; cls = 'v4'; reason = '多數正報酬，泛化尚可';
    } else if(avgVal > 0 && winRate >= 0.5){
      stars = 3; label = '謹慎使用'; cls = 'v3'; reason = '驗證為正但不夠穩定';
    } else if(avgVal > -0.01 && winRate >= 0.3){
      stars = 2; label = '不推薦'; cls = 'v2'; reason = '驗證不穩定，可能虧錢';
    } else {
      stars = 1; label = '強烈不推薦'; cls = 'v1'; reason = '驗證 ROI 為負，會虧錢';
    }
  }

  var starsStr = '★'.repeat(stars) + '☆'.repeat(5 - stars);
  document.getElementById('stars').textContent = starsStr;
  document.getElementById('verdictLabel').textContent = label;
  document.getElementById('verdict').className = 'verdict ' + cls;
  
  var detailLines = [reason];
  /* ✅ 修復：用成功次數而非設定次數 */
  detailLines.push('成功 ' + valid.length + '/' + numRuns + ' 次');
  if(hasVal) detailLines.push('驗證為正：' + valPosCount + '/' + valid.length);
  document.getElementById('verdictDetail').textContent = detailLines.join('｜');

  if(hasVal){
    document.getElementById('roiBig').textContent = (bestRun.valROI * 100).toFixed(2) + '%';
    document.getElementById('roiDetail').innerHTML =
      '（建議公式的<b>驗證 ROI</b>，訓練 ROI ' + (bestRun.trainROI*100).toFixed(2) + '%）<br>' +
      '🏆 最高單次驗證：<b>' + (topRun.valROI*100).toFixed(2) + '%</b>　' +
      '📊 平均驗證：<b>' + (avgVal*100).toFixed(2) + '%</b>';
  } else {
    document.getElementById('roiBig').textContent = (bestRun.trainROI * 100).toFixed(2) + '%';
    document.getElementById('roiDetail').innerHTML = '（僅訓練 ROI，未啟用驗證）';
  }

  /* ✅ 修復：NA 顯示 */
  document.getElementById('sAvgVal').textContent = hasVal ? (avgVal*100).toFixed(2) + '%' : 'N/A';
  document.getElementById('sAvgTrain').textContent = (avgTrain*100).toFixed(2) + '%';
  document.getElementById('sGenRate').textContent = avgGenRate !== null ? (avgGenRate*100).toFixed(1) + '%' : 'N/A';
  document.getElementById('sWinRate').textContent = hasVal ? (valPosCount + '/' + valid.length) : 'N/A';

  /* 標記 NA 樣式 */
  ['cellAvgVal','cellAvgTrain','cellGenRate','cellWinRate'].forEach(function(id){
    document.getElementById(id).classList.remove('warn','na');
  });
  if(!hasVal) document.getElementById('cellAvgVal').classList.add('na');
  if(avgGenRate === null && hasVal) document.getElementById('cellGenRate').classList.add('na');
  if(hasVal && avgVal < 0) document.getElementById('cellAvgVal').classList.add('warn');

  var html = '<table class="runs-table"><thead><tr>' +
    '<th>#</th><th>訓練 ROI</th><th>驗證 ROI</th><th>泛化率</th><th>驗證利潤</th><th>狀態</th>' +
    '</tr></thead><tbody>';
  
  for(var i=0;i<valid.length;i++){
    var r = valid[i];
    var gr = (r.trainROI > 0 && r.valROI > 0) ? (r.valROI / r.trainROI) : null;
    var isBest = (r === bestRun);
    var isTop = (r === topRun);
    var status, statusCls;
    if(r.valROI > 0 && gr !== null && gr >= 0.6){ status = '✅ 良好'; statusCls = 'pos'; }
    else if(r.valROI > 0){ status = '🟡 邊緣'; statusCls = ''; }
    else { status = '❌ 虧損'; statusCls = 'neg'; }
    
    var rowCls = isBest ? 'best-row' : '';
    var marker = '';
    if(isBest && isTop) marker = ' ⭐🏆';
    else if(isBest) marker = ' ⭐';
    else if(isTop) marker = ' 🏆';

    html += '<tr class="' + rowCls + '"><td>#' + (i+1) + marker + '</td>' +
      '<td>' + (r.trainROI*100).toFixed(2) + '%</td>' +
      '<td class="' + (r.valROI > 0 ? 'pos' : 'neg') + '">' + (r.valROI*100).toFixed(2) + '%</td>' +
      '<td class="' + (gr === null ? 'na' : '') + '">' + (gr !== null ? (gr*100).toFixed(1) + '%' : 'N/A') + '</td>' +
      '<td class="' + (r.valTotal > 0 ? 'pos' : 'neg') + '">' + r.valTotal + '</td>' +
      '<td class="' + statusCls + '">' + status + '</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('runsTable').innerHTML = html;

  document.getElementById('txtOut').value = bestRun.formula;
  document.getElementById('charInfo').innerHTML = 
    '字符數：<b>' + bestRun.formula.length + '</b>　' +
    '規則數：<b>' + bestRun.rules.length + '</b>　' +
    '訓練 ' + bestRun.trainN + ' 場 / 驗證 ' + bestRun.valN + ' 場';

  renderRuleTableForRun(bestRun);

  document.getElementById('best').style.display = 'block';
  log('');
  log('═══════════════════════════════════════════', 'head');
  log('🏆 評級：' + starsStr + ' ' + label, stars >= 3 ? 'success' : 'danger');
  log('   成功次數：' + valid.length + '/' + numRuns);
  log('   平均驗證 ROI：' + (hasVal ? (avgVal*100).toFixed(2) + '%' : 'N/A'), avgVal > 0 ? 'roi' : 'danger');
  log('   平均訓練 ROI：' + (avgTrain*100).toFixed(2) + '%');
  log('   平均泛化率：' + (avgGenRate !== null ? (avgGenRate*100).toFixed(1) + '%' : 'N/A'));
  log('   正報酬勝率：' + valPosCount + '/' + valid.length);
  log('═══════════════════════════════════════════', 'head');
  flushNow();
}

function renderRuleTableForRun(run){
  var html = '<table class="rules"><thead><tr>' +
    '<th>#</th><th>類型</th><th>結果</th><th>條件</th><th>訓練邊際</th>' +
    '</tr></thead><tbody>';

  for(var ri=0;ri<run.rules.length;ri++){
    var rule = run.rules[ri];
    var typeTag = rule.conds.length === 0 ? '<span class="tag-fb">🛡️兜底</span>' : '<span class="tag-auto">🧠</span>';
    var tcClass = rule.TC === 0 ? 'tag-h' : (rule.TC === 1 ? 'tag-d' : 'tag-a');
    var tcTag = '<span class="' + tcClass + '">' + RESULTS[rule.TC] + '</span>';
    var condStr = rule.conds.length === 0 ? '(全部剩餘)' :
      rule.conds.map(function(cc){
        return FEATURES[cc[0]] + OPS[cc[1]] + (Math.round(cc[2]*100)/100);
      }).join(' & ');
    var margin = rule.margin || 0;
    var mp = margin > 0 ? 'pos' : (margin < 0 ? 'neg' : '');

    html += '<tr><td>R' + (ri+1) + '</td><td>' + typeTag + '</td><td>' + tcTag + '</td>' +
      '<td style="font-size:10px">' + condStr + '</td>' +
      '<td class="' + mp + '">' + margin + '</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('ruleTable').innerHTML = html;
}

function stop(){
  running = false;
  document.getElementById('btnStop').disabled = true;
  log('⏹ 手動停止', 'warn');
  flushNow();
}

function copyFormula(){
  var el = document.getElementById('txtOut');
  var txt = el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      showMsg('✅ 已複製 ' + txt.length + ' 字元', true);
    }).catch(function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg('✅ 已複製 ' + text.length + ' 字元', true);
  else showMsg('❌ 複製失敗', false);
}
function showMsg(text, ok){
  var m = document.getElementById('msg');
  m.textContent = text; m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  setTimeout(function(){ m.style.display = 'none'; }, 3000);
}
