<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>標準 vs Dixon-Coles 預測器</title>
<style>
  :root{
    --bg:#0b1220; --card:#141d2f; --card2:#1b2740; --line:#2a3a55;
    --txt:#e8eefc; --muted:#8fa3c4;
    --c-poi:#4da3ff; --c-dc:#3ddc97;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,#1a2c4d 0%,transparent 60%),var(--bg);
    color:var(--txt);padding:24px 16px 60px;display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:960px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px;line-height:1.6}
  
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:620px){.grid{grid-template-columns:1fr}}
  .team{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:16px}
  .team h2{font-size:15px;margin:0 0 10px;color:var(--c-poi);display:flex;align-items:center;gap:8px}
  .team.away h2{color:#ffb347}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
  .num-input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0e1626;color:var(--txt);font-size:16px;font-variant-numeric:tabular-nums;outline:none;transition:.2s}
  .num-input:focus{border-color:var(--c-poi);box-shadow:0 0 0 3px rgba(77,163,255,.15)}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  
  .actions{display:flex;gap:12px;margin-top:20px}
  button{padding:14px;border:0;border-radius:14px;cursor:pointer;font-size:16px;font-weight:800;color:#06231a;background:linear-gradient(135deg,#3ddc97,#4da3ff);transition:.15s;flex:1}
  button:hover{filter:brightness(1.08)}
  button:active{transform:translateY(1px)}
  button.ghost{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600;padding:14px 20px}
  button.ghost:hover{color:var(--txt);border-color:var(--c-poi);background:rgba(77,163,255,.08);filter:none}
  
  #result{display:none;margin-top:26px}
  #result.show{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  
  .models-grid {display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:768px){.models-grid{grid-template-columns:1fr}}
  
  .model-card {
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;
    position:relative;overflow:hidden;
  }
  .model-card::before {content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:var(--accent);}
  .mc-poi::before{--accent:var(--c-poi)} .mc-poi{border-color:rgba(77,163,255,.3)}
  .mc-dc::before{--accent:var(--c-dc)} .mc-dc{border-color:rgba(61,220,151,.3)}

  .mc-title {font-size:15px;font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
  .mc-desc {font-size:11px;color:var(--muted);margin-bottom:14px;height:32px;}
  
  .score-row {display:flex;justify-content:space-between;align-items:center;padding:10px;background:#0e1626;border-radius:10px;margin-bottom:8px;}
  .sr-rank {font-size:11px;color:var(--muted);width:30px;}
  .sr-score {font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;}
  .sr-prob {font-size:14px;color:var(--txt);font-weight:600;}
  
  .mc-lams {display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);}
  
  .panel{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .panel h3{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:1px}
  table{width:100%;border-collapse:collapse;font-size:13px;text-align:center;}
  th,td{padding:10px 6px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:500;font-size:12px;}
  tr:last-child td{border-bottom:0}
  .highlight-dc {color:var(--c-dc);font-weight:bold;}
  .note{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <h1>標準 vs Dixon-Coles 預測器</h1>
  <p class="sub">輸入兩隊的場均 xG 與 xGA，系統將同時展示兩種模型的預測結果。<br>
  小提示：輸入 <code>093</code> 會自動變成 <code>0.93</code>；輸入 <code>190</code> 會變成 <code>1.90</code>。</p>

  <div class="grid">
    <div class="team">
      <h2>🏠 主隊</h2>
      <div class="row">
        <div><label>場均 xG（攻）</label><input class="num-input" id="hXG" type="text" inputmode="decimal" autocomplete="off" placeholder="1.60" value="1.60"></div>
        <div><label>場均 xGA（守）</label><input class="num-input" id="hXGA" type="text" inputmode="decimal" autocomplete="off" placeholder="1.10" value="1.10"></div>
      </div>
    </div>
    <div class="team away">
      <h2>✈️ 客隊</h2>
      <div class="row">
        <div><label>場均 xG（攻）</label><input class="num-input" id="aXG" type="text" inputmode="decimal" autocomplete="off" placeholder="1.20" value="1.20"></div>
        <div><label>場均 xGA（守）</label><input class="num-input" id="aXGA" type="text" inputmode="decimal" autocomplete="off" placeholder="1.35" value="1.35"></div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="go">預測比分</button>
    <button id="clear" class="ghost">清除數據</button>
  </div>

  <div id="result">
    <div class="models-grid" id="modelsGrid"></div>
    
    <div class="panel">
      <h3>賽果機率對比</h3>
      <table>
        <thead>
          <tr><th>模型</th><th>主勝</th><th>和局</th><th>客勝</th><th>大 2.5</th><th>BTTS</th></tr>
        </thead>
        <tbody id="compareBody"></tbody>
      </table>
    </div>
    
    <div class="note">
      ※ 計算方式：主隊期望入球 λH = ½(主隊 xG + 客隊 xGA)；客隊期望入球 λA = ½(客隊 xG + 主隊 xGA)。無主場優勢加成。<br>
      ※ <b>Dixon-Coles</b> 模型引入了 \(\rho = -0.1\)，專門修正 0-0、1-1 等低比分和局被低估的問題，你可以觀察它與標準模型的機率差異。
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const MAXG = 10;
const RHO = -0.1; // Dixon-Coles 參數

// 基本數學
const fact = n => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
const poisson = (k, l) => Math.exp(-l) * Math.pow(l, k) / fact(k);
const pct = p => (p * 100).toFixed(1) + '%';

/* ---------- 輸入格式化：093 → 0.93，190 → 1.90 ---------- */
function normalizeInput(el){
  let v = el.value.trim().replace(',', '.');
  if (v === '') return;

  // 處理前導零如 "093" -> "0.93"
  if (/^0\d+$/.test(v)) {
    el.value = (parseInt(v, 10) / 100).toFixed(2);
    return;
  }

  // 處理純整數且 >= 100 如 "190" -> "1.90"
  if (/^\d+$/.test(v)){
    const n = parseInt(v, 10);
    if (n >= 100) el.value = (n / 100).toFixed(2);
    return;
  }

  // 處理含小數點的輸入，統一補到兩位
  if (/^\d*\.\d+$/.test(v) || /^\d+\.$/.test(v)){
    const n = parseFloat(v);
    if (isFinite(n)) el.value = n.toFixed(2);
  }
}

document.querySelectorAll('.num-input').forEach(el => {
  el.addEventListener('blur', () => normalizeInput(el));
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') { normalizeInput(el); predict(); }
  });
});

/* ---------- 清除數據 ---------- */
$('clear').addEventListener('click', () => {
  document.querySelectorAll('.num-input').forEach(el => el.value = '');
  $('result').classList.remove('show');
});

/* ---------- 預測 ---------- */
$('go').addEventListener('click', predict);

function predict(){
  document.querySelectorAll('.num-input').forEach(normalizeInput);

  const hXG = parseFloat($('hXG').value), hXGA = parseFloat($('hXGA').value);
  const aXG = parseFloat($('aXG').value), aXGA = parseFloat($('aXGA').value);

  if ([hXG, hXGA, aXG, aXGA].some(v => !isFinite(v) || v < 0)) {
    alert('請輸入有效的非負數字（xG / xGA）。');
    return;
  }

  // 基礎期望入球（無主場優勢）
  let lH = Math.min(Math.max((hXG + aXGA) / 2, 0.05), 6);
  let lA = Math.min(Math.max((aXG + hXGA) / 2, 0.05), 6);

  // --- 模型 1: 標準 Poisson ---
  let mPoi = [], tPoi = 0;
  for(let i=0; i<=MAXG; i++){ 
    mPoi[i]=[]; 
    for(let j=0; j<=MAXG; j++){
      let p = poisson(i, lH) * poisson(j, lA); 
      mPoi[i][j]=p; tPoi+=p;
    }
  }
  const resPoi = processMatrix(mPoi, tPoi);

  // --- 模型 2: Dixon-Coles ---
  let mDC = [], tDC = 0;
  for(let i=0; i<=MAXG; i++){ 
    mDC[i]=[]; 
    for(let j=0; j<=MAXG; j++){
      let p = poisson(i, lH) * poisson(j, lA);
      let tau = 1;
      if(i===0 && j===0) tau = 1 - lH*lA*RHO;
      else if(i===0 && j===1) tau = 1 + lH*RHO;
      else if(i===1 && j===0) tau = 1 + lA*RHO;
      else if(i===1 && j===1) tau = 1 - RHO;
      
      p = Math.max(0, tau * p);
      mDC[i][j]=p; tDC+=p;
    }
  }
  const resDC = processMatrix(mDC, tDC);

  // 渲染 UI
  renderModelCards([
    {name: '標準 Poisson', cls: 'mc-poi', desc: '傳統獨立泊松模型，作為基準線。', res: resPoi},
    {name: 'Dixon-Coles', cls: 'mc-dc', desc: '修正低比分和局機率，對 0-0, 1-1 更敏感。', res: resDC}
  ]);
  renderCompareTable([resPoi, resDC]);
  $('lam').innerHTML = `<div>期望入球：主隊 <b>${lH.toFixed(2)}</b> ｜ 客隊 <b>${lA.toFixed(2)}</b></div>`;

  const box = $('result');
  box.classList.remove('show'); void box.offsetWidth; box.classList.add('show');
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
}

// 處理矩陣並提取資訊
function processMatrix(m, total){
  let list = [], homeWin=0, draw=0, awayWin=0, over25=0, btts=0;
  for(let i=0; i<=MAXG; i++){ 
    for(let j=0; j<=MAXG; j++){
      let p = m[i][j] / total;
      if(i>j) homeWin+=p; else if(i===j) draw+=p; else awayWin+=p;
      if(i+j > 2.5) over25+=p;
      if(i>0 && j>0) btts+=p;
      list.push({h:i, a:j, p});
    }
  }
  list.sort((x,y) => y.p - x.p);
  return { top2: list.slice(0,2), homeWin, draw, awayWin, over25, btts };
}

// 渲染兩個卡片
function renderModelCards(models){
  $('modelsGrid').innerHTML = models.map(m => `
    <div class="model-card ${m.cls}">
      <div class="mc-title">${m.name}</div>
      <div class="mc-desc">${m.desc}</div>
      ${m.res.top2.map((s, idx) => `
        <div class="score-row">
          <div class="sr-rank">${idx === 0 ? '首選' : '次選'}</div>
          <div class="sr-score">${s.h} - ${s.a}</div>
          <div class="sr-prob">${pct(s.p)}</div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

// 渲染對比表格
function renderCompareTable(results){
  const names = ['標準 Poisson', 'Dixon-Coles'];
  const colors = ['var(--c-poi)', 'var(--c-dc)'];
  $('compareBody').innerHTML = results.map((r, i) => `
    <tr>
      <td style="font-weight:bold;color:${colors[i]}">${names[i]}</td>
      <td>${pct(r.homeWin)}</td>
      <td class="${i===1 ? 'highlight-dc' : ''}">${pct(r.draw)}</td>
      <td>${pct(r.awayWin)}</td>
      <td>${pct(r.over25)}</td>
      <td>${pct(r.btts)}</td>
    </tr>
  `).join('');
}
</script>
</body>
</html>
