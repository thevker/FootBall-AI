<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>數據、狀態、賠率 綜合預測器</title>
<style>
  :root{
    --bg:#0b1220; --card:#141d2f; --card2:#1b2740; --line:#2a3a55;
    --txt:#e8eefc; --muted:#8fa3c4;
    --accent:#3ddc97; --accent2:#4da3ff; --warn:#ffb347; --danger:#ff5e5e;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,#1a2c4d 0%,transparent 60%),var(--bg);
    color:var(--txt);padding:24px 16px 60px;display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:880px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px;line-height:1.6}
  
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:620px){.grid{grid-template-columns:1fr}}
  .team{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:16px}
  .team h2{font-size:15px;margin:0 0 10px;color:var(--accent2);display:flex;align-items:center;gap:8px}
  .team.away h2{color:var(--warn)}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
  .num-input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0e1626;color:var(--txt);font-size:16px;font-variant-numeric:tabular-nums;outline:none;transition:.2s}
  .num-input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(77,163,255,.15)}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  
  /* 近5場戰績輸入 */
  .form-row { display: flex; gap: 6px; align-items: center; }
  .form-row input { width: 100%; padding: 8px 4px; text-align: center; font-size: 14px; border-radius: 8px; border: 1px solid var(--line); background: #0e1626; color: var(--txt); outline: none; }
  .form-row input:focus { border-color: var(--accent2); }
  .form-row span { color: var(--muted); font-size: 12px; }

  .hint-box {
    margin-top: 14px; padding: 12px 16px; background: rgba(77,163,255,.08); 
    border-left: 3px solid var(--accent2); border-radius: 4px 8px 8px 4px;
    font-size: 12px; color: var(--muted); line-height: 1.6;
  }
  .hint-box b { color: var(--txt); }

  /* 賠率輸入區 */
  .odds-panel { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .odds-title { font-size: 14px; color: var(--accent); margin-bottom: 12px; font-weight: 700; display: flex; justify-content: space-between; }
  .odds-title span { font-size: 11px; color: var(--muted); font-weight: normal; }
  .odds-inputs { display: flex; gap: 8px; }
  .odds-inputs input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: #0e1626; color: var(--txt); text-align: center; font-size: 14px; outline: none; }
  .odds-inputs input:focus { border-color: var(--accent); }

  .actions{display:flex;gap:12px;margin-top:20px}
  button{padding:14px;border:0;border-radius:14px;cursor:pointer;font-size:16px;font-weight:800;color:#06231a;background:linear-gradient(135deg,#3ddc97,#4da3ff);transition:.15s;flex:1}
  button:hover{filter:brightness(1.08)}
  button:active{transform:translateY(1px)}
  button.ghost{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600;padding:14px 20px}
  button.ghost:hover{color:var(--txt);border-color:var(--accent2);background:rgba(77,163,255,.08);filter:none}
  
  #result{display:none;margin-top:26px}
  #result.show{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  
  .scores{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:620px){.scores{grid-template-columns:1fr}}
  .score{background:linear-gradient(160deg,#173049,#101b2c);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
  .score.one{border-color:rgba(61,220,151,.55);box-shadow:0 0 0 1px rgba(61,220,151,.15) inset,0 12px 30px -18px #3ddc97}
  .tag{font-size:11px;letter-spacing:2px;color:var(--muted)}
  .big{font-size:44px;font-weight:800;margin:8px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:2px}
  .one .big{color:var(--accent)}
  .pct{font-size:14px;color:var(--muted)}
  .pct b{color:var(--txt)}
  
  .extra-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  @media(max-width:620px){.extra-sections{grid-template-columns:1fr}}
  
  .extra-box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .extra-title { font-size: 13px; color: var(--muted); margin-bottom: 10px; text-align: center; letter-spacing: 1px; }
  
  .tg-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tg-card { background: #0e1626; border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; }
  .tg-card.one { border-color: rgba(77,163,255,.55); background: #15233a; }
  .tg-card .tag { font-size: 10px; color: var(--muted); }
  .tg-card .val { font-size: 20px; font-weight: 800; color: var(--accent2); margin: 4px 0; }
  .tg-card.one .val { color: var(--accent); }
  .tg-card .pct { font-size: 11px; }

  .lam{display:flex;justify-content:center;gap:22px;font-size:12px;color:var(--muted);margin-top:14px}
  .lam b{color:var(--txt)}
  
  .panel{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .panel h3{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:1px}
  
  /* 綜合對比條 */
  .compare-row { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-size: 13px; }
  .compare-row .nm { width: 50px; color: var(--muted); flex: none; }
  .compare-row .tr { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .compare-bar-group { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #0e1626; position: relative; }
  .compare-bar-group .model { background: var(--accent2); height: 100%; z-index: 3; }
  .compare-bar-group .form { background: var(--accent); height: 100%; position: absolute; top: 0; left: 0; z-index: 2; opacity: 0.8; }
  .compare-bar-group .market { background: var(--warn); height: 100%; position: absolute; top: 0; left: 0; z-index: 1; opacity: 0.6; }
  
  .compare-row .vl { width: 120px; text-align: right; font-variant-numeric: tabular-nums; font-size: 11px; line-height: 1.4; }
  .vl .v-model { color: var(--accent2); font-weight: bold; }
  .vl .v-form { color: var(--accent); }
  .vl .v-market { color: var(--warn); }

  .advice-box { margin-top: 16px; padding: 12px; border-radius: 10px; background: rgba(255, 179, 71, 0.1); border: 1px solid rgba(255, 179, 71, 0.3); font-size: 13px; line-height: 1.6; }
  .advice-box.good { background: rgba(61, 220, 151, 0.1); border-color: rgba(61, 220, 151, 0.3); }
  
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:12px}
  th:last-child,td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  .note{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <h1>數據、狀態、賠率 綜合預測器</h1>
  <p class="sub">結合「基礎得失球」、「近5場狀態」與「市場 1X2 賠率」，全方位預測比分。</p>

  <div class="grid">
    <div class="team">
      <h2>🏠 主隊 (填寫主場數據)</h2>
      <div class="row">
        <div><label>主場場均得分</label><input class="num-input" id="hGF" type="text" inputmode="decimal" autocomplete="off" placeholder="例如 1.80"></div>
        <div><label>主場場均失球</label><input class="num-input" id="hGA" type="text" inputmode="decimal" autocomplete="off" placeholder="例如 0.90"></div>
      </div>
      <label>近5場戰績 (勝 - 和 - 負)</label>
      <div class="form-row">
        <input type="number" id="hW" min="0" max="5" placeholder="勝">
        <span>-</span>
        <input type="number" id="hD" min="0" max="5" placeholder="和">
        <span>-</span>
        <input type="number" id="hL" min="0" max="5" placeholder="負">
      </div>
    </div>
    <div class="team away">
      <h2>✈️ 客隊 (填寫客場數據)</h2>
      <div class="row">
        <div><label>客場場均得分</label><input class="num-input" id="aGF" type="text" inputmode="decimal" autocomplete="off" placeholder="例如 1.10"></div>
        <div><label>客場場均失球</label><input class="num-input" id="aGA" type="text" inputmode="decimal" autocomplete="off" placeholder="例如 1.50"></div>
      </div>
      <label>近5場戰績 (勝 - 和 - 負)</label>
      <div class="form-row">
        <input type="number" id="aW" min="0" max="5" placeholder="勝">
        <span>-</span>
        <input type="number" id="aD" min="0" max="5" placeholder="和">
        <span>-</span>
        <input type="number" id="aL" min="0" max="5" placeholder="負">
      </div>
    </div>
  </div>

  <!-- 賠率輸入 (僅保留 1X2) -->
  <div class="odds-panel">
    <div class="odds-title">市場 1X2 賠率 <span>選填，留空則不進行對比</span></div>
    <div class="odds-inputs">
      <input type="number" id="oddH" step="0.01" placeholder="主勝賠率">
      <input type="number" id="oddD" step="0.01" placeholder="和局賠率">
      <input type="number" id="oddA" step="0.01" placeholder="客勝賠率">
    </div>
  </div>

  <div class="actions">
    <button id="go">開始綜合預測</button>
    <button id="clear" class="ghost">清除</button>
  </div>

  <div id="result">
    <div class="scores" id="scores"></div>
    
    <div class="extra-sections">
      <div class="extra-box">
        <div class="extra-title">雙選總入球數</div>
        <div class="tg-cards" id="totalGoals"></div>
      </div>
      <div class="extra-box">
        <div class="extra-title">雙選球隊入球數</div>
        <div class="tg-cards" id="teamGoals" style="grid-template-columns: 1fr 1fr 1fr 1fr;"></div>
      </div>
    </div>
    
    <div class="lam" id="lam"></div>

    <!-- 三維對比區 -->
    <div class="panel">
      <h3>模型、狀態與市場 三維對比</h3>
      <div id="compareBars" style="margin-bottom: 10px;"></div>
      <div id="advice" class="advice-box"></div>
    </div>
    
    <div class="panel"><h3>最可能比分 Top 6</h3><div id="topList"></div></div>
    
    <div class="note">
      ※ 狀態修正：根據近5場勝率差異，微調雙方進球期望值（最多 ±15%）。<br>
      ※ 市場隱含機率：將賠率轉為機率並去除抽水。<br>
      ※ 分析提示：當「模型」與「狀態」同時高於「市場」時，通常是最佳機會。
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const MAXG = 10;

// 基本數學
const fact = n => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
const poisson = (k, l) => Math.exp(-l) * Math.pow(l, k) / fact(k);
const pct = p => (p * 100).toFixed(1) + '%';

/* ---------- 輸入格式化 ---------- */
function normalizeInput(el){
  let v = el.value.trim().replace(',', '.');
  if (v === '') return;
  if (/^0\d+$/.test(v)) { el.value = (parseInt(v, 10) / 100).toFixed(2); return; }
  if (/^\d+$/.test(v)){ const n = parseInt(v, 10); if (n >= 100) el.value = (n / 100).toFixed(2); return; }
  if (/^\d*\.\d+$/.test(v) || /^\d+\.$/.test(v)){ const n = parseFloat(v); if (isFinite(n)) el.value = n.toFixed(2); }
}
document.querySelectorAll('.num-input').forEach(el => {
  el.addEventListener('blur', () => normalizeInput(el));
});

/* ---------- 清除 ---------- */
$('clear').addEventListener('click', () => {
  document.querySelectorAll('input').forEach(el => el.value = '');
  $('result').classList.remove('show');
});

/* ---------- 預測 ---------- */
$('go').addEventListener('click', predict);

function predict(){
  document.querySelectorAll('.num-input').forEach(normalizeInput);

  const hGF = parseFloat($('hGF').value), hGA = parseFloat($('hGA').value);
  const aGF = parseFloat($('aGF').value), aGA = parseFloat($('aGA').value);

  if ([hGF, hGA, aGF, aGA].some(v => !isFinite(v) || v < 0)) {
    alert('請輸入完整的場均得分與失球。');
    return;
  }

  // 1. 基礎期望入球
  let lH = Math.min(Math.max((hGF + aGA) / 2, 0.05), 6);
  let lA = Math.min(Math.max((aGF + hGA) / 2, 0.05), 6);

  // 2. 狀態修正 (基於近5場勝率)
  const hW = parseInt($('hW').value) || 0, hD = parseInt($('hD').value) || 0;
  const aW = parseInt($('aW').value) || 0, aD = parseInt($('aD').value) || 0;
  
  // 狀態分 (勝3, 和1, 負0) / 15
  const hFormScore = (hW * 3 + hD * 1) / 15;
  const aFormScore = (aW * 3 + aD * 1) / 15;
  
  // 狀態差 (-1 到 1)
  const formDiff = hFormScore - aFormScore;
  
  // 調整 λ (最多影響 ±15%)
  const lH_adj = lH * (1 + formDiff * 0.15);
  const lA_adj = lA * (1 - formDiff * 0.15);

  // 構建比分矩陣 (使用調整後的 λ)
  const m = [];
  let total = 0;
  for (let i = 0; i <= MAXG; i++){
    m[i] = [];
    for (let j = 0; j <= MAXG; j++){
      let p = poisson(i, lH_adj) * poisson(j, lA_adj);
      m[i][j] = p;
      total += p;
    }
  }

  // 統計數據
  let homeWin = 0, draw = 0, awayWin = 0;
  const list = [];
  const goalProbs = Array(2 * MAXG + 1).fill(0);
  const hGoalProbs = Array(MAXG + 1).fill(0);
  const aGoalProbs = Array(MAXG + 1).fill(0);

  for (let i = 0; i <= MAXG; i++){
    for (let j = 0; j <= MAXG; j++){
      const p = m[i][j] / total;
      if (i > j) homeWin += p;
      else if (i === j) draw += p;
      else awayWin += p;
      
      goalProbs[i + j] += p;
      hGoalProbs[i] += p;
      aGoalProbs[j] += p;
      
      list.push({ h: i, a: j, p });
    }
  }
  list.sort((x, y) => y.p - x.p);

  // 提取 Top 2
  const top2Scores = list.slice(0, 2);
  const getTop2 = arr => arr.map((p, val) => ({ val, p })).sort((a, b) => b.p - a.p).slice(0, 2);
  const top2Total = getTop2(goalProbs);
  const top2H = getTop2(hGoalProbs);
  const top2A = getTop2(aGoalProbs);

  // 渲染區塊
  $('scores').innerHTML = top2Scores.map((s, idx) => `
    <div class="score ${idx === 0 ? 'one' : ''}">
      <div class="tag">${idx === 0 ? '首選比分' : '次選比分'}</div>
      <div class="big">${s.h} - ${s.a}</div>
      <div class="pct">機率 <b>${pct(s.p)}</b></div>
    </div>
  `).join('');

  $('totalGoals').innerHTML = top2Total.map((g, idx) => `
    <div class="tg-card ${idx === 0 ? 'one' : ''}">
      <div class="tag">${idx === 0 ? '首選' : '次選'}</div>
      <div class="val">${g.val} 球</div>
      <div class="pct">${pct(g.p)}</div>
    </div>
  `).join('');

  $('teamGoals').innerHTML = `
    <div class="tg-card ${top2H[0].val >= top2H[1].val ? 'one' : ''}">
      <div class="tag">主首選</div><div class="val">${top2H[0].val}</div><div class="pct">${pct(top2H[0].p)}</div>
    </div>
    <div class="tg-card">
      <div class="tag">主次選</div><div class="val">${top2H[1].val}</div><div class="pct">${pct(top2H[1].p)}</div>
    </div>
    <div class="tg-card ${top2A[0].val >= top2A[1].val ? 'one' : ''}">
      <div class="tag">客首選</div><div class="val">${top2A[0].val}</div><div class="pct">${pct(top2A[0].p)}</div>
    </div>
    <div class="tg-card">
      <div class="tag">客次選</div><div class="val">${top2A[1].val}</div><div class="pct">${pct(top2A[1].p)}</div>
    </div>
  `;

  $('lam').innerHTML = `
    <div>調整後主期望入球 <b>${lH_adj.toFixed(2)}</b></div>
    <div>調整後客期望入球 <b>${lA_adj.toFixed(2)}</b></div>
  `;

  // ================= 三維對比與分析 =================
  const oddH = parseFloat($('oddH').value);
  const oddD = parseFloat($('oddD').value);
  const oddA = parseFloat($('oddA').value);
  const hasOdds = [oddH, oddD, oddA].every(v => isFinite(v) && v > 1);
  
  let mkH = null, mkD = null, mkA = null;
  if (hasOdds) {
    const sum = (1/oddH) + (1/oddD) + (1/oddA);
    mkH = (1/oddH) / sum;
    mkD = (1/oddD) / sum;
    mkA = (1/oddA) / sum;
  }

  // 計算純狀態隱含機率 (簡易勝率轉化，僅供參考)
  const formTotal = hFormScore + aFormScore;
  const fH = formTotal === 0 ? 0.33 : (hFormScore / formTotal) * 0.8 + 0.1;
  const fA = formTotal === 0 ? 0.33 : (aFormScore / formTotal) * 0.8 + 0.1;
  const fD = 1 - fH - fA;

  let compareHTML = '';
  compareHTML += renderCompareBar('主勝', homeWin, fH, mkH);
  compareHTML += renderCompareBar('和局', draw, fD, mkD);
  compareHTML += renderCompareBar('客勝', awayWin, fA, mkA);
  $('compareBars').innerHTML = compareHTML;

  // 生成建議
  let adviceText = '';
  let isGood = false;
  
  if (hasOdds) {
    if (homeWin > mkH + 0.04 && hFormScore > aFormScore) {
      adviceText += `🔥 <b>主勝強烈推薦：</b>模型看好（${pct(homeWin)}）、狀態佔優、且高於市場（${pct(mkH)}）。<br>`;
      isGood = true;
    } else if (awayWin > mkA + 0.04 && aFormScore > hFormScore) {
      adviceText += `🔥 <b>客勝強烈推薦：</b>模型看好（${pct(awayWin)}）、狀態佔優、且高於市場（${pct(mkA)}）。<br>`;
      isGood = true;
    } else if (homeWin > mkH + 0.06) {
      adviceText += `📈 <b>主勝有價值：</b>模型認為主勝機率（${pct(homeWin)}）明顯高於市場（${pct(mkH)}）。<br>`;
      isGood = true;
    } else if (awayWin > mkA + 0.06) {
      adviceText += `📈 <b>客勝有價值：</b>模型認為客勝機率（${pct(awayWin)}）明顯高於市場（${pct(mkA)}）。<br>`;
      isGood = true;
    } else if (homeWin < mkH - 0.06 && hFormScore < aFormScore) {
      adviceText += `⚠️ <b>主勝陷阱：</b>市場防範主勝，但模型與狀態均不支持，慎防主隊不勝。<br>`;
    } else if (awayWin < mkA - 0.06 && aFormScore < hFormScore) {
      adviceText += `⚠️ <b>客勝陷阱：</b>市場防範客勝，但模型與狀態均不支持，慎防客隊不勝。<br>`;
    } else {
      adviceText += `🤝 <b>無明顯傾向：</b>模型、狀態與市場預期基本一致，建議觀望。<br>`;
    }
  } else {
    adviceText += `*(提示：輸入市場賠率可獲得精確的價值分析。)*<br>`;
    if (formDiff > 0.2) adviceText += `📈 主隊近期狀態明顯優於客隊。<br>`;
    else if (formDiff < -0.2) adviceText += `📈 客隊近期狀態明顯優於主隊。<br>`;
  }
  
  const advEl = $('advice');
  advEl.className = isGood ? 'advice-box good' : 'advice-box';
  advEl.innerHTML = `<b>綜合分析提示：</b><br>${adviceText}`;

  // 渲染 Top 6
  $('topList').innerHTML = `
    <table>
      <thead><tr><th>#</th><th>比分（主 - 客）</th><th>機率</th></tr></thead>
      <tbody>
        ${list.slice(0, 6).map((s, i) => `<tr><td>${i + 1}</td><td>${s.h} - ${s.a}</td><td>${pct(s.p)}</td></tr>`).join('')}
      </tbody>
    </table>
  `;

  // 顯示結果
  const box = $('result');
  box.classList.remove('show');
  void box.offsetWidth;
  box.classList.add('show');
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// 渲染三維對比條
function renderCompareBar(name, modelP, formP, marketP) {
  const maxVal = Math.max(modelP, formP, marketP || 0, 0.6);
  const mw = (modelP / maxVal) * 100;
  const fw = (formP / maxVal) * 100;
  const mkw = marketP ? (marketP / maxVal) * 100 : 0;
  
  return `
    <div class="compare-row">
      <div class="nm">${name}</div>
      <div class="tr">
        <div class="compare-bar-group">
          ${marketP ? `<div class="market" style="width: ${mkw}%"></div>` : ''}
          <div class="form" style="width: ${fw}%"></div>
          <div class="model" style="width: ${mw}%"></div>
        </div>
      </div>
      <div class="vl">
        <span class="v-model">模 ${pct(modelP)}</span> | 
        <span class="v-form">態 ${pct(formP)}</span> 
        ${marketP ? `<br><span class="v-market">市 ${pct(marketP)}</span>` : ''}
      </div>
    </div>
  `;
}
</script>
</body>
