<body>

<div class="top">
  <h2>🧬 智慧規則優化器 v20 — 效能強化</h2>
  <div>
    <button class="lang-btn active" id="btn-zh" onclick="setLang('zh')">繁中</button>

</div>

<p>A/B/C = 勝率(%)　D/E/F = 賠率(×100)。目標：找出最高盈利且泛化良好的規則。</p>

<textarea id="input" placeholder="每行：A B C D E F 分數 結果
23 27 49 355 385 169 0:3 A
62 27 9 158 395 405 3:0 H"></textarea>

<div class="mode-bar">
  <button class="mode-btn active" id="modeAuto" onclick="setMode('auto')">🤖 自動模式</button>
  <button class="mode-btn" id="modeManual" onclick="setMode('manual')">🎛️ 手動模式</button>

</div>

<div class="row">
  <label id="lbl-strength">搜尋強度：</label>
  <select id="strength">
    <option value="3">快速（3 起點）</option>

  </label>

    <select id="cvFolds">
      <option value="3">3</option>

  <b>欄位：</b> <code>A</code>主勝率 <code>B</code>和率 <code>C</code>客勝率　<code>D</code>主賠 <code>E</code>和賠 <code>F</code>客賠
  ｜ <b>衍生：</b> <code>|A-C|</code> <code>|D-F|</code> <code>impA</code> <code>valA</code> <code>ratioA</code>
  ｜ <b>指向：</b> H(主) D(和) A(客) skip
</div>

<div class="stats" id="liveStats" style="display:none">
  <div class="stat" id="stat-gen">起點: 0</div>

  <div class="stat" id="stat-time">時間: 0s</div>
  <div class="stat" id="stat-speed">評估/秒: 0</div>
  <div class="stat" id="stat-evals">總掃描: 0</div>
</div>

<div class="best" id="best">
  <div id="summary"></div>
  <div class="param" id="params"></div>
  <div class="box">
    <div class="label">🟢 公式（新）</div>
    <button class="txt" onclick="copyIt('txtOut')">📋 複製公式</button>
    <textarea id="txtOut" class="out" readonly wrap="off"></textarea>
  </div>
  <div id="msg"></div>
</div>

<div id="cvResult" style="display:none"></div>

<div id="diag" style="display:none">
  <div class="section">
    <h3>📋 演化後規則表（最終規則在全部資料上表現）</h3>
    <div class="diag" id="ruleTable"></div>

</div>

<script>
'use strict';

/* ==================== 全域 ==================== */
var CFG = {minBets:0, splitRatio:1.0, useCV:false, cvFolds:5, penaltyUnit:10000, timeLimit:120};
var MODE = 'auto';

/* ==================== 初始化 ==================== */
var INIT_RULES = [
  {on:1, then:'D', cond:[['B','>=',32],['|A-C|','<=',6]]},
  {on:1, then:'H', cond:[['A','>=',60],['C','<=',11],['D','>=',140],['D','<=',190],['F','>=',400],['F','<=',480]]},
  {on:1, then:'D', cond:[['|A-C|','<=',3],['E','<',380],['|D-F|','<',40]]},
  {on:1, then:'D', cond:[['A','>=',45],['C','<=',20],['|D-F|','<',70],['D','<',400]]},
  {on:1, then:'D', cond:[['|D-F|','<',18]]},
  {on:1, then:'D', cond:[['A','>=',42],['D','>=',155],['D','<',205],['D-F','!=',0],['F-D','>',0],['|A-C|','>=',50]]},
  {on:1, then:'H', cond:[['A','>=',42],['D','>=',155],['D','<',205],['D-F','!=',0]]},
  {on:1, then:'D', cond:[['A','>=',34],['D','>',205],['D','<=',235],['D-F','!=',0]]},
  {on:1, then:'D', cond:[['D','>=',400],['A','>=',42]]},
  {on:1, then:'D', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0],['F','<',200],['|A-C|','<=',5]]},
  {on:1, then:'A', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0],['F','<',200]]},
  {on:1, then:'D', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0]]},
  {on:1, then:'D', cond:[['E','<=',315],['B','>=',27],['|A-C|','<=',25],['D','>=',250],['D','<=',350],['E-D','>',0]]},
  {on:1, then:'D', cond:[['C-A','>',0],['F','>=',490],['F','<=',560],['D','<',200]]},
  {on:1, then:'H', cond:[['C-A','>',0],['F-D','>',0],['F','<',550],['E','>',320]]},
  {on:1, then:'A', cond:[['C-A','>',0],['F','>=',184],['F','<=',216],['C','>=',40]]},
  {on:1, then:'D', cond:[['C-A','>',0],['F-D','>',0],['F','<',300],['C','<',45],['D','<',250]]},
  {on:1, then:'A', cond:[['D-F','>',0],['F','<=',150],['C','>=',65]]},
  {on:1, then:'A', cond:[['D-F','>',0],['D','>',1500],['C','>=',50]]},
  {on:1, then:'D', cond:[['D-F','>',0],['D','>',1500],['A-C','>',0]]},
  {on:1, then:'skip', cond:[['D-F','>',0],['D','>',1500]]},
  {on:1, then:'D', cond:[['D-F','>',0],['A','>=',33],['D','>=',350]]},
  {on:1, then:'H', cond:[['D-F','>',0]]},
  {on:1, then:'H', cond:[['F-D','>',0],['A','>=',50],['F-D','>=',400]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['A','>=',80]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['C-A','>',0]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['A','<',45]]},
  {on:1, then:'skip', cond:[['F-D','>',0],['F','>=',700]]},
  {on:1, then:'D', cond:[['F-D','>',0],['E','>=',470],['F','>=',500]]},
  {on:1, then:'H', cond:[['F-D','>',0],['A','>=',47],['D','<=',140]]},
  {on:1, then:'A', cond:[['F-D','>',0]]},
  {on:1, then:'H', cond:[['A-C','>',0]]},
  {on:1, then:'A', cond:[['C-A','>',0]]},
  {on:1, then:'skip', cond:[]}
];

var RESULTS = ['H','D','A','skip'];
var COLS = ['A','B','C','D','E','F','|A-C|','|D-F|','D-F','F-D','A-C','C-A','E-D','E-F','D-E','impA','impB','impC','valA','valB','valC','ratioA','ratioB','ratioC','A+B','B+C','A+C','A+B+C'];
var OPS = ['>','>=','<','<=','==','!='];
var COL_IDX = {};
for(var _ci=0;_ci<COLS.length;_ci++) COL_IDX[COLS[_ci]] = _ci;

var data=[];
var running=false;
var startTime=0;
var evalCount=0;
var logBuffer=[];
var logTimer=null;
var LOG_MAX=3000;
var lastYield=0;
var YIELD_MS = 30;  /* ⭐ 每 30ms 讓出 UI */

/* ==================== ⭐ 高效 yield ==================== */
async function maybeYield(force){
  var now = Date.now();
  if(force || now - lastYield >= YIELD_MS){
    lastYield = now;
    await new Promise(function(r){ setTimeout(r, 0); });
  }
}

function tick(){ return new Promise(function(r){ setTimeout(r, 0); }); }
function ri(min,max){ return min+Math.floor(Math.random()*(max-min+1)); }

/* ==================== 日誌 ==================== */
function nowTime(){
  if(!startTime) return '[00:00.000]';
  var ms=Date.now()-startTime;
  var s=Math.floor(ms/1000), m=Math.floor(s/60), sec=s%60, frac=ms%1000;
  return '['+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')+'.'+String(frac).padStart(3,'0')+']';
}
function pushLog(text, cls){
  logBuffer.push({text:text, cls:cls||''});
  if(!logTimer) logTimer=setTimeout(flushLog, 80);
}
function flushLog(){
  logTimer=null;
  if(logBuffer.length===0) return;
  var logEl=document.getElementById('log');
  if(!logEl.dataset.started){ logEl.innerHTML=''; logEl.dataset.started='1'; }
  var frag=document.createDocumentFragment();
  for(var i=0;i<logBuffer.length;i++){
    var e=logBuffer[i];
    var div=document.createElement('div');
    if(e.cls) div.className='l-'+e.cls;
    div.textContent=e.text;
    frag.appendChild(div);
  }
  logBuffer=[];
  logEl.appendChild(frag);
  while(logEl.children.length>LOG_MAX) logEl.removeChild(logEl.firstChild);
  if(document.getElementById('autoScroll').checked) logEl.scrollTop=logEl.scrollHeight;
}
function clearLog(){
  var logEl=document.getElementById('log');
  logEl.innerHTML=''; logEl.dataset.started='1';
  logBuffer=[];
}
function isVerbose(){ return CFG.useCV ? false : document.getElementById('verbose').checked; }
function isShowBad(){ return CFG.useCV ? false : document.getElementById('showBad').checked; }

/* ==================== 解析 ==================== */
function parseData(text){
  var rows=[], seen={}, dups=0, totalValid=0;
  var lines=text.split('\n');
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line) continue;
    var p=line.split(/\s+/);
    if(p.length<8) continue;
    var v=p.slice(0,6).map(Number);
    var score=p[6], r=p[7].toUpperCase();
    if(v.some(isNaN)) continue;
    if(['H','D','A'].indexOf(r)===-1) continue;
    totalValid++;
    var sig=v[0]+'|'+v[1]+'|'+v[2]+'|'+v[3]+'|'+v[4]+'|'+v[5]+'|'+score+'|'+r;
    if(seen[sig]){ dups++; continue; }
    seen[sig]=1;
    rows.push({A:v[0],B:v[1],C:v[2],D:v[3],E:v[4],F:v[5],score:score,result:r,sig:sig});
  }
  return {rows:rows,total:totalValid,dups:dups};
}

function precacheRows(rows){
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    var impA=r.D>0?10000/r.D:0;
    var impB=r.E>0?10000/r.E:0;
    var impC=r.F>0?10000/r.F:0;
    r._c = [
      r.A,r.B,r.C,r.D,r.E,r.F,
      Math.abs(r.A-r.C),Math.abs(r.D-r.F),
      r.D-r.F,r.F-r.D,r.A-r.C,r.C-r.A,
      r.E-r.D,r.E-r.F,r.D-r.E,
      Math.round(impA),Math.round(impB),Math.round(impC),
      r.A-impA,r.B-impB,r.C-impC,
      r.A*r.D/100,r.B*r.E/100,r.C*r.F/100,
      r.A+r.B,r.B+r.C,r.A+r.C,r.A+r.B+r.C
    ];
  }
}

/* ==================== 分割 ==================== */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function shuffle(arr,rng){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(rng()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function splitData(rows,ratio,seed){
  var rng=mulberry32(seed||12345);
  var sh=shuffle(rows,rng);
  var nTrain=Math.floor(rows.length*ratio);
  return {train:sh.slice(0,nTrain), test:sh.slice(nTrain)};
}
function getFold(rows,fold,folds,seed){
  var rng=mulberry32(seed||12345);
  var sh=shuffle(rows,rng);
  var n=rows.length;
  var foldSize=Math.floor(n/folds);
  var start=fold*foldSize;
  var end=(fold===folds-1)?n:start+foldSize;
  var test=sh.slice(start,end);
  var train=sh.slice(0,start).concat(sh.slice(end));
  return {train:train,test:test};
}

/* ==================== 評估 ==================== */
function evalRules(rows,rules){
  evalCount++;
  var profit=0, hits=0, correct=0;
  var nRules=rules.length;
  for(var i=0;i<rows.length;i++){
    var row=rows[i], cols=row._c, pred='skip';
    for(var r=0;r<nRules;r++){
      var rule=rules[r];
      if(!rule.on) continue;
      var conds=rule.cond, match=true;
      for(var k=0;k<conds.length;k++){
        var c=conds[k];
        var v=cols[COL_IDX[c[0]]], tv=c[2], op=c[1], ok;
        if(op==='>') ok=v>tv;
        else if(op==='>=') ok=v>=tv;
        else if(op==='<') ok=v<tv;
        else if(op==='<=') ok=v<=tv;
        else if(op==='==') ok=Math.abs(v-tv)<1e-9;
        else ok=Math.abs(v-tv)>=1e-9;
        if(!ok){ match=false; break; }
      }
      if(match){ pred=rule.then; break; }
    }
    if(pred==='skip') continue;
    hits++;
    if(pred===row.result){
      correct++;
      if(pred==='H') profit+=row.D-100;
      else if(pred==='D') profit+=row.E-100;
      else profit+=row.F-100;
    } else profit-=100;
  }
  return {profit:profit, hits:hits, correct:correct, wrong:hits-correct};
}

function calcProfit(rows,rules){
  var r=evalRules(rows,rules);
  if(CFG.minBets>0 && r.hits<CFG.minBets){
    return r.profit - (CFG.minBets-r.hits)*CFG.penaltyUnit;
  }
  return r.profit;
}

/* ==================== 複製 ==================== */
function cloneRules(rules){
  var out=[];
  for(var i=0;i<rules.length;i++){
    var r=rules[i], c=[];
    for(var j=0;j<r.cond.length;j++) c.push([r.cond[j][0],r.cond[j][1],r.cond[j][2]]);
    out.push({on:r.on, then:r.then, cond:c});
  }
  return out;
}
function cloneConds(cond){
  var out=[];
  for(var i=0;i<cond.length;i++) out.push([cond[i][0],cond[i][1],cond[i][2]]);
  return out;
}

function fmtCond(c){ return c[0]+c[1]+c[2]; }

/* ==================== 變體 ==================== */
function randValFor(col){
  if(col==='A'||col==='B'||col==='C') return ri(15,80);
  if(col==='D'||col==='E'||col==='F') return ri(100,800);
  if(col==='|A-C|'||col==='A+C'||col==='A+B'||col==='B+C') return ri(2,80);
  if(col==='|D-F|') return ri(10,300);
  if(col==='impA'||col==='impB'||col==='impC') return ri(10,70);
  if(col==='valA'||col==='valB'||col==='valC') return ri(-30,30);
  if(col==='ratioA'||col==='ratioB'||col==='ratioC') return ri(50,180);
  return ri(-100,100);
}
function addRandomCondition(rule){
  var nr={on:rule.on, then:rule.then, cond:cloneConds(rule.cond)};
  nr.cond.push([COLS[ri(0,COLS.length-1)], OPS[ri(0,OPS.length-1)], randValFor(COLS[ri(0,COLS.length-1)])]);
  /* 修正：欄位和值要一致 */
  var col = nr.cond[nr.cond.length-1][0];
  nr.cond[nr.cond.length-1][2] = randValFor(col);
  return nr;
}
function removeRandomCondition(rule){
  if(rule.cond.length<=1) return null;
  var nr={on:rule.on, then:rule.then, cond:cloneConds(rule.cond)};
  nr.cond.splice(ri(0,nr.cond.length-1),1);
  return nr;
}

function getScanParams(curVal){
  var av=Math.abs(curVal);
  if(av<20)  return {window:10, step:1};
  if(av<50)  return {window:15, step:1};
  if(av<100) return {window:20, step:2};
  if(av<300) return {window:30, step:5};
  if(av<700) return {window:50, step:10};
  return {window:80, step:20};
}

/* ==================== ⭐ 座標下降（熱迴圈處處 yield） ==================== */
async function optimizeOneRule(rows, rules, ruleIdx, curProfit){
  var verbose=isVerbose();
  var showBad=isShowBad();
  var rule=rules[ruleIdx];
  var bestProfit=curProfit;
  var changed=false;
  var prefix='  '+nowTime()+' [R'+(ruleIdx+1)+'] ';

  /* 1. 試所有 then */
  var savedThen=rule.then;
  for(var ti=0;ti<RESULTS.length;ti++){
    var altThen=RESULTS[ti];
    if(altThen===savedThen) continue;
    rule.then=altThen;
    var p=calcProfit(rows,rules);
    if(p>bestProfit){
      if(verbose) pushLog(prefix+'then '+savedThen+'→'+altThen+' 盈利 '+bestProfit+'→'+p+' ✓','ok');
      bestProfit=p; savedThen=altThen; changed=true;
    } else if(showBad){
      pushLog(prefix+'then '+savedThen+'→'+altThen+' ✗ '+p,'bad');
    }
  }
  rule.then=savedThen;

  /* 2. on/off */
  var savedOn=rule.on;
  rule.on=savedOn?0:1;
  var p2=calcProfit(rows,rules);
  if(p2>bestProfit){
    if(verbose) pushLog(prefix+'toggle 盈利 '+bestProfit+'→'+p2+' ✓','ok');
    bestProfit=p2; savedOn=rule.on; changed=true;
  }
  rule.on=savedOn;

  /* 3. 刪條件 */
  if(rule.cond.length>1){
    for(var rci=0;rci<rule.cond.length;rci++){
      var removed=rule.cond[rci];
      rule.cond.splice(rci,1);
      var p4=calcProfit(rows,rules);
      if(p4>bestProfit){
        if(verbose) pushLog(prefix+'remove '+fmtCond(removed)+' 盈利 '+bestProfit+'→'+p4+' ✓','ok');
        bestProfit=p4; changed=true; break;
      } else {
        rule.cond.splice(rci,0,removed);
      }
    }
  }

  /* 4. 掃描閾值 + 運算子 */
  for(var ci=0;ci<rule.cond.length;ci++){
    var c=rule.cond[ci];
    var curVal=c[2];
    var params=getScanParams(curVal);
    var window=params.window, step=params.step;

    if(verbose) pushLog(prefix+'scan '+c[0]+c[1]+' ±'+window,'scan');

    var bestV=curVal;
    for(var v=curVal-window; v<=curVal+window; v+=step){
      if(v<0 && curVal>=0) continue;
      c[2]=v;
      var p3=calcProfit(rows,rules);
      if(p3>bestProfit){ bestV=v; bestProfit=p3; }
      /* ⭐ 每 3 次掃描就檢查 yield */
      await maybeYield();
      if(!running) { c[2]=curVal; return {profit:bestProfit, changed:changed}; }
    }
    if(bestV!==curVal){
      if(verbose) pushLog(prefix+'  ↳ '+c[0]+c[1]+' '+curVal+'→'+bestV+' ✓','ok');
      c[2]=bestV; changed=true;
    } else {
      c[2]=curVal;
      if(verbose) pushLog(prefix+'  ↳ 無改進','dim');
    }

    /* 運算子 */
    var origOp=c[1], bestOp=origOp;
    for(var oi=0;oi<OPS.length;oi++){
      var altOp=OPS[oi];
      if(altOp===origOp) continue;
      c[1]=altOp;
      var p5=calcProfit(rows,rules);
      if(p5>bestProfit){ bestOp=altOp; bestProfit=p5; }
      await maybeYield();
    }
    c[1]=bestOp;
    if(bestOp!==origOp){
      if(verbose) pushLog(prefix+'  ↳ op '+origOp+'→'+bestOp+' ✓','ok');
      changed=true;
    }
  }

  return {profit:bestProfit, changed:changed};
}

async function coordinateDescent(rows, startRules, label){
  var cur=cloneRules(startRules);
  var curProfit=calcProfit(rows,cur);
  var improved=true;
  var totalIter=0, pass=0;
  pushLog('  '+nowTime()+' '+label+' 起始盈利: '+curProfit,'gen');

  while(improved && running){
    pass++;
    improved=false;
    pushLog('  '+nowTime()+' ── '+label+' 第 '+pass+' 輪 ──','dim');

    for(var i=0;i<cur.length;i++){
      if(!running) return {rules:cur, profit:curProfit, iter:totalIter};
      if(Date.now()-startTime > CFG.timeLimit*1000){
        pushLog('  '+nowTime()+' ⏰ 時間到','warn');
        return {rules:cur, profit:curProfit, iter:totalIter, timedOut:true};
      }
      var res=await optimizeOneRule(rows,cur,i,curProfit);
      totalIter++;
      if(res.profit>curProfit){ curProfit=res.profit; improved=true; }
      await maybeYield();
    }
    pushLog('  '+nowTime()+' 第 '+pass+' 輪完成，盈利: '+curProfit, improved?'ok':'dim');
  }
  pushLog('  '+nowTime()+' ✓ '+label+' 收斂於 '+curProfit+'（'+totalIter+' 掃描）','success');
  return {rules:cur, profit:curProfit, iter:totalIter};
}

/* ==================== 結構搜尋 ==================== */
async function structureSearch(rows, startRules, maxAttempts){
  pushLog('  '+nowTime()+' ━━━ 結構搜尋（最多 '+maxAttempts+' 次）━━━','struct');
  var cur=cloneRules(startRules);
  var curProfit=calcProfit(rows,cur);
  var bestProfit=curProfit, bestRules=cloneRules(cur);
  var attempts=0, successes=0, lastReport=0;

  while(running && attempts<maxAttempts){
    attempts++;
    if(Date.now()-startTime > CFG.timeLimit*1000){ pushLog('  ⏰ 時間到','warn'); break; }
    var test=cloneRules(cur);
    var p=Math.random();
    var action='', detail='';

    if(p<0.22){
      var idx=ri(0,test.length-1);
      test[idx]=addRandomCondition(test[idx]);
      action='ADD_COND'; detail='R'+(idx+1);
    } else if(p<0.40){
      var idx2=ri(0,test.length-1);
      var newR=removeRandomCondition(test[idx2]);
      if(newR){ test[idx2]=newR; action='DEL_COND'; detail='R'+(idx2+1); }
      else continue;
    } else if(p<0.55){
      if(test.length>5){
        var minIdx=Math.min(3,test.length-1);
        var delIdx=ri(minIdx,test.length-1);
        test.splice(delIdx,1);
        action='DEL_RULE'; detail='R'+(delIdx+1);
      } else continue;
    } else if(p<0.72){
      var srcIdx=ri(0,test.length-1);
      var copy={on:test[srcIdx].on, then:test[srcIdx].then, cond:cloneConds(test[srcIdx].cond)};
      copy=addRandomCondition(copy);
      test.splice(srcIdx+1,0,copy);
      action='SPLIT'; detail='R'+(srcIdx+1);
      if(test.length>80) continue;
    } else if(p<0.85){
      if(test.length>=2){
        var i2=ri(0,test.length-2);
        var tmp=test[i2]; test[i2]=test[i2+1]; test[i2+1]=tmp;
        action='SWAP'; detail='R'+(i2+1)+'↔R'+(i2+2);
      } else continue;
    } else {
      var idx3=ri(0,test.length-1);
      var oldThen=test[idx3].then;
      var opts=RESULTS.filter(function(x){return x!==oldThen;});
      var newThen=opts[ri(0,opts.length-1)];
      test[idx3].then=newThen;
      action='CHANGE_THEN'; detail='R'+(idx3+1)+' '+oldThen+'→'+newThen;
    }

    var newProfit=calcProfit(rows,test);
    var delta=newProfit-curProfit;

    if(newProfit>curProfit){
      cur=test; curProfit=newProfit; successes++;
      pushLog('  '+nowTime()+' ['+attempts+'] '+action+' '+detail+' → '+newProfit+' ✓','ok');
      if(newProfit>bestProfit){
        bestProfit=newProfit;
        bestRules=cloneRules(test);
        pushLog('  '+nowTime()+' ★★★ 結構新最優：'+bestProfit,'best');
      }
    } else if(isShowBad()){
      pushLog('  '+nowTime()+' ['+attempts+'] '+action+' '+detail+' ✗','bad');
    }

    if(attempts-lastReport>=20){
      lastReport=attempts;
      pushLog('  '+nowTime()+' 進度 '+attempts+'/'+maxAttempts+'，成功 '+successes,'info');
    }
    await maybeYield();
  }
  pushLog('  '+nowTime()+' 結構結束：'+attempts+' 次，'+successes+' 改進','struct');
  return {rules:bestRules, profit:bestProfit, attempts:attempts, successes:successes};
}

/* ==================== 隨機重啟 ==================== */
function randomRestart(nMut){
  var r=cloneRules(INIT_RULES);
  for(var k=0;k<nMut;k++){
    var p=Math.random();
    if(p<0.35){
      var idx=ri(0,r.length-1);
      if(r[idx].cond.length===0) continue;
      var ci=ri(0,r[idx].cond.length-1);
      var v=r[idx].cond[ci][2];
      var step=1;
      if(Math.abs(v)>=50) step=2;
      if(Math.abs(v)>=100) step=5;
      if(Math.abs(v)>=300) step=10;
      if(Math.abs(v)>=700) step=20;
      r[idx].cond[ci][2]=v+ri(-10,10)*step;
      var col=r[idx].cond[ci][0];
      if(col==='A'||col==='B'||col==='C') r[idx].cond[ci][2]=Math.max(0,Math.min(100,r[idx].cond[ci][2]));
    } else if(p<0.50){
      var idx2=ri(0,r.length-1);
      var opts=RESULTS.filter(function(x){return x!==r[idx2].then;});
      r[idx2].then=opts[ri(0,opts.length-1)];
    } else if(p<0.62){
      var idx3=ri(0,r.length-1);
      r[idx3].on=r[idx3].on?0:1;
    } else if(p<0.72){
      var i2=ri(0,r.length-2);
      var tmp=r[i2]; r[i2]=r[i2+1]; r[i2+1]=tmp;
    } else if(p<0.80){
      if(r.length>5){
        var minIdx=Math.min(3,r.length-1);
        r.splice(ri(minIdx,r.length-1),1);
      }
    } else if(p<0.90){
      var idx4=ri(0,r.length-1);
      r[idx4]=addRandomCondition(r[idx4]);
    } else {
      var srcIdx=ri(0,r.length-1);
      var copy={on:r[srcIdx].on, then:r[srcIdx].then, cond:cloneConds(r[srcIdx].cond)};
      copy=addRandomCondition(copy);
      r.splice(srcIdx+1,0,copy);
    }
  }
  return r;
}

/* ==================== 診斷 ==================== */
function diagnose(rows,rules){
  var stats=[];
  for(var i=0;i<rules.length;i++) stats.push({idx:i, rule:rules[i], hit:0, correct:0, wrong:0, profit:0});
  for(var i=0;i<rows.length;i++){
    var row=rows[i], cols=row._c, pred='skip', hitRule=-1;
    for(var j=0;j<rules.length;j++){
      if(!rules[j].on) continue;
      var conds=rules[j].cond, match=true;
      for(var k=0;k<conds.length;k++){
        var c=conds[k];
        var v=cols[COL_IDX[c[0]]], tv=c[2], op=c[1], ok;
        if(op==='>') ok=v>tv;
        else if(op==='>=') ok=v>=tv;
        else if(op==='<') ok=v<tv;
        else if(op==='<=') ok=v<=tv;
        else if(op==='==') ok=Math.abs(v-tv)<1e-9;
        else ok=Math.abs(v-tv)>=1e-9;
        if(!ok){ match=false; break; }
      }
      if(match){ pred=rules[j].then; hitRule=j; break; }
    }
    if(pred==='skip'||hitRule===-1) continue;
    var s=stats[hitRule]; s.hit++;
    var gp;
    if(pred===row.result){
      s.correct++;
      if(pred==='H') gp=row.D-100;
      else if(pred==='D') gp=row.E-100;
      else gp=row.F-100;
    } else { s.wrong++; gp=-100; }
    s.profit+=gp;
  }
  return stats;
}

function renderRuleTable(stats){
  var html='<table><thead><tr><th>規則</th><th>啟用</th><th>條件</th><th>指向</th><th>命中</th><th>對</th><th>錯</th><th>盈利</th></tr></thead><tbody>';
  for(var i=0;i<stats.length;i++){
    var s=stats[i], r=s.rule;
    var condStr=r.cond.map(function(c){return c[0]+c[1]+c[2];}).join(' & ');
    if(!condStr) condStr='—';
    if(condStr.length>90) condStr=condStr.slice(0,87)+'...';
    var pcls=s.profit>0?'profit-pos':(s.profit<0?'profit-neg':'');
    var onTag=r.on?'<span class="tag-ok">ON</span>':'<span class="tag-off">OFF</span>';
    var thenTag='<span class="tag-pred">'+r.then+'</span>';
    html+='<tr><td>R'+(i+1)+'</td><td>'+onTag+'</td><td style="font-size:10px">'+condStr+'</td><td>'+thenTag+'</td>'+
      '<td>'+s.hit+'</td><td>'+s.correct+'</td><td>'+s.wrong+'</td><td class="'+pcls+'">'+s.profit+'</td></tr>';
  }
  html+='</tbody></table>';
  document.getElementById('ruleTable').innerHTML=html;
}

/* ==================== Google Sheets 公式 ==================== */
function sheetOp(op){ if(op==='!=') return '<>'; if(op==='==') return '='; return op; }
function buildCond(c){
  var col=c[0], op=c[1], val=c[2], sop=sheetOp(op);
  switch(col){
    case 'A': return '(A2:A'+sop+val+')';
    case 'B': return '(B2:B'+sop+val+')';
    case 'C': return '(C2:C'+sop+val+')';
    case 'D': return '(D2:D'+sop+val+')';
    case 'E': return '(E2:E'+sop+val+')';
    case 'F': return '(F2:F'+sop+val+')';
    case '|A-C|': return '(ABS(A2:A-C2:C)'+sop+val+')';
    case '|D-F|': return '(ABS(D2:D-F2:F)'+sop+val+')';
    case 'D-F': return '((D2:D-F2:F)'+sop+val+')';
    case 'F-D': return '((F2:F-D2:D)'+sop+val+')';
    case 'A-C': return '((A2:A-C2:C)'+sop+val+')';
    case 'C-A': return '((C2:C-A2:A)'+sop+val+')';
    case 'E-D': return '((E2:E-D2:D)'+sop+val+')';
    case 'E-F': return '((E2:E-F2:F)'+sop+val+')';
    case 'D-E': return '((D2:D-E2:E)'+sop+val+')';
    case 'impA': return '(ROUND(10000/D2:D,0)'+sop+val+')';
    case 'impB': return '(ROUND(10000/E2:E,0)'+sop+val+')';
    case 'impC': return '(ROUND(10000/F2:F,0)'+sop+val+')';
    case 'valA': return '((A2:A-10000/D2:D)'+sop+val+')';
    case 'valB': return '((B2:B-10000/E2:E)'+sop+val+')';
    case 'valC': return '((C2:C-10000/F2:F)'+sop+val+')';
    case 'ratioA': return '((A2:A*D2:D/100)'+sop+val+')';
    case 'ratioB': return '((B2:B*E2:E/100)'+sop+val+')';
    case 'ratioC': return '((C2:C*F2:F/100)'+sop+val+')';
    case 'A+B': return '((A2:A+B2:B)'+sop+val+')';
    case 'B+C': return '((B2:B+C2:C)'+sop+val+')';
    case 'A+C': return '((A2:A+C2:C)'+sop+val+')';
    case 'A+B+C': return '((A2:A+B2:B+C2:C)'+sop+val+')';
    default: return 'FALSE';
  }
}
function buildCondExpr(rule){
  if(rule.cond.length===0) return 'TRUE';
  var parts=[];
  for(var i=0;i<rule.cond.length;i++) parts.push(buildCond(rule.cond[i]));
  return parts.join('*');
}
function genFormula(rules){
  var active=[];
  for(var i=0;i<rules.length;i++) if(rules[i].on) active.push(rules[i]);
  if(active.length===0) return '=ARRAYFORMULA(IF(A2:A="","","skip"))';
  var body='';
  for(var i=0;i<active.length;i++) body+='IF('+buildCondExpr(active[i])+',"'+active[i].then+'",';
  body+='"skip"';
  for(var j=0;j<active.length;j++) body+=')';
  return '=ARRAYFORMULA(IF((A2:A="")+(B2:B="")+(C2:C="")+(D2:D="")+(E2:E="")+(F2:F=""),"",'+body+'))';
}

/* ==================== 自動參數 ==================== */
function autoConfig(n){
  var cfg={};
  if(n<100){
    cfg.splitRatio=1; cfg.useCV=false; cfg.cvFolds=5; cfg.minBets=0;
    cfg.timeLimit=60; cfg.strength=3;
  } else if(n<300){
    cfg.splitRatio=0.8; cfg.useCV=false; cfg.cvFolds=5;
    cfg.minBets=Math.max(10,Math.round(n*0.8*0.15/10)*10);
    cfg.timeLimit=90; cfg.strength=8;
  } else if(n<800){
    cfg.splitRatio=0.8; cfg.useCV=true; cfg.cvFolds=5;
    cfg.minBets=Math.max(20,Math.round(n*0.64*0.15/10)*10);
    cfg.timeLimit=180; cfg.strength=5;
  } else if(n<2000){
    cfg.splitRatio=0.8; cfg.useCV=true; cfg.cvFolds=5;
    cfg.minBets=Math.max(50,Math.round(n*0.64*0.15/10)*10);
    cfg.timeLimit=300; cfg.strength=10;
  } else {
    cfg.splitRatio=0.7; cfg.useCV=true; cfg.cvFolds=10;
    cfg.minBets=Math.max(100,Math.round(n*0.9*0.15/10)*10);
    cfg.timeLimit=600; cfg.strength=20;
  }
  return cfg;
}

function applyAutoConfig(){
  var parsed=parseData(document.getElementById('input').value);
  var n=parsed.rows.length;
  if(n===0) return null;
  var cfg=autoConfig(n);
  document.getElementById('splitRatio').value=String(cfg.splitRatio);
  document.getElementById('useCV').checked=cfg.useCV;
  document.getElementById('cvFolds').value=String(cfg.cvFolds);
  document.getElementById('minBets').value=cfg.minBets;
  document.getElementById('timeLimit').value=cfg.timeLimit;
  document.getElementById('strength').value=String(cfg.strength);
  return {cfg:cfg,n:n};
}

function previewAuto(){
  if(MODE!=='auto') return;
  var res=applyAutoConfig();
  var descEl=document.getElementById('modeDesc');
  if(!res){
    descEl.textContent='⚠ 請先貼上資料';
    return;
  }
  var c=res.cfg;
  var desc='🤖 自動（'+res.n+' 筆）：';
  desc+='分割 '+(c.splitRatio===1?'不分':Math.round(c.splitRatio*100)+'/'+Math.round((1-c.splitRatio)*100));
  desc+='｜'+(c.useCV?'K='+c.cvFolds:'無CV');
  desc+='｜最少命中 '+c.minBets;
  desc+='｜'+c.timeLimit+'s';
  desc+='｜強度 '+c.strength;
  descEl.textContent=desc;
}

function setMode(m){
  MODE=m;
  document.getElementById('modeAuto').className='mode-btn'+(m==='auto'?' active':'');
  document.getElementById('modeManual').className='mode-btn'+(m==='manual'?' active':'');
  var descEl=document.getElementById('modeDesc');
  if(m==='auto'){
    descEl.textContent='根據資料量自動選擇最佳參數';
    document.getElementById('configBox').classList.add('disabled');
    var ids=['strength','splitRatio','minBets','useCV','cvFolds','timeLimit'];
    for(var i=0;i<ids.length;i++) document.getElementById(ids[i]).disabled=true;
    previewAuto();
  } else {
    descEl.textContent='🎛️ 手動調整所有參數';
    document.getElementById('configBox').classList.remove('disabled');
    var ids2=['strength','splitRatio','minBets','useCV','cvFolds','timeLimit'];
    for(var j=0;j<ids2.length;j++) document.getElementById(ids2[j]).disabled=false;
  }
}

/* ==================== 單次優化 ==================== */
async function optimizeOnce(trainRows, N, label){
  var globalBest=null, globalProfit=-Infinity;

  pushLog('');
  pushLog('═══════════════════════════════════════════════════════════','head');
  pushLog(nowTime()+' '+label+' ▶ 階段 1：初始規則座標下降','fold');
  pushLog('═══════════════════════════════════════════════════════════','head');

  /* 立即讓出讓 UI 顯示啟動日誌 */
  await tick();

  var baseP=calcProfit(trainRows, INIT_RULES);
  pushLog(nowTime()+' 初始盈利：'+baseP,'info');
  await tick();

  var r0=await coordinateDescent(trainRows, INIT_RULES, label+' 初始');
  globalBest=r0.rules;
  globalProfit=r0.profit;
  pushLog('');
  pushLog(nowTime()+' ✓ 階段 1 完成：'+baseP+' → '+r0.profit,'success');
  updateStats(0, globalProfit);
  document.getElementById('progbar').style.width=(1/(N+1)*100).toFixed(1)+'%';
  await maybeYield(true);

  for(var k=1;k<=N;k++){
    if(!running) return {rules:globalBest, profit:globalProfit};
    if(Date.now()-startTime > CFG.timeLimit*1000){
      pushLog(nowTime()+' ⏰ 時間預算到，結束','warn');
      break;
    }

    if(k%10===0){
      pushLog('');
      pushLog(nowTime()+' '+label+' ▶ 結構搜尋','fold');
      var beforeProfit=globalProfit;
      var sres=await structureSearch(trainRows, globalBest, 100);
      if(sres.profit>globalProfit){
        globalProfit=sres.profit;
        globalBest=sres.rules;
        pushLog('  ✓ 結構成功：'+beforeProfit+' → '+globalProfit,'success');
      } else {
        pushLog('  ✗ 結構無改進','warn');
      }
    }

    var nMut=3+ri(0,15);
    pushLog('');
    pushLog(nowTime()+' '+label+' ▶ 起點 #'+k+'/'+N+'：'+nMut+' 次變異','fold');
    var startRules=randomRestart(nMut);
    var r=await coordinateDescent(trainRows, startRules, label+' #'+k);

    if(r.profit>globalProfit){
      globalProfit=r.profit;
      globalBest=r.rules;
      pushLog('  ★★★ 新全局最優：'+globalProfit,'best');
    } else {
      pushLog('  ✗ 收斂於 '+r.profit,'dim');
    }

    updateStats(k, globalProfit);
    document.getElementById('progbar').style.width=((k+1)/(N+1)*100).toFixed(1)+'%';
    await maybeYield(true);
  }

  return {rules:globalBest, profit:globalProfit};
}

/* ==================== 主流程 ==================== */
async function start(){
  /* 立即顯示啟動訊息 */
  clearLog();
  pushLog('🚀 啟動中...','head');
  document.getElementById('log').dataset.started='1';
  await tick();

  if(MODE==='auto'){
    var applied=applyAutoConfig();
    if(!applied){ alert('沒有有效資料'); return; }
  }

  var parsed=parseData(document.getElementById('input').value);
  data=parsed.rows;
  if(data.length===0){ alert('沒有有效數據'); return; }

  CFG.minBets=parseInt(document.getElementById('minBets').value)||0;
  CFG.splitRatio=parseFloat(document.getElementById('splitRatio').value);
  CFG.useCV=document.getElementById('useCV').checked;
  CFG.cvFolds=parseInt(document.getElementById('cvFolds').value);
  CFG.timeLimit=parseInt(document.getElementById('timeLimit').value)||120;

  running=true;
  startTime=Date.now();
  evalCount=0;
  lastYield=0;
  document.getElementById('btnRun').disabled=true;
  document.getElementById('btnStop').disabled=false;
  document.getElementById('diag').style.display='none';
  document.getElementById('best').style.display='none';
  document.getElementById('cvResult').style.display='none';
  document.getElementById('liveStats').style.display='flex';
  document.getElementById('status').style.display='block';
  document.getElementById('status').textContent='⏳ 執行中…';
  document.getElementById('progbar').style.width='0%';

  clearLog();
  precacheRows(data);

  var N=parseInt(document.getElementById('strength').value);

  pushLog('═══════════════════════════════════════════════════════════','head');
  pushLog('🧬 智慧規則優化器 v20 啟動','head');
  pushLog('═══════════════════════════════════════════════════════════','head');
  pushLog(nowTime()+' 模式：'+(MODE==='auto'?'🤖 自動':'🎛️ 手動'),'auto');
  pushLog(nowTime()+' 資料：'+parsed.total+' 原始，'+parsed.dups+' 重複，'+data.length+' 有效','info');
  pushLog(nowTime()+' 快取完成（'+COLS.length+' 欄）','success');
  pushLog(nowTime()+' 起點：'+(N+1)+'，時間預算：'+CFG.timeLimit+'s，最少命中：'+CFG.minBets,'info');
  pushLog('');
  await tick();

  var folds=CFG.useCV?CFG.cvFolds:1;
  var foldResults=[];

  for(var f=0;f<folds;f++){
    if(!running) break;
    if(Date.now()-startTime > CFG.timeLimit*1000){
      pushLog(nowTime()+' ⏰ 時間到，中止','warn');
      break;
    }

    var fold, label;
    if(CFG.useCV){
      label='[Fold '+(f+1)+'/'+folds+']';
      fold=getFold(data, f, folds, 12345);
    } else if(CFG.splitRatio<1){
      label='[Split]';
      fold=splitData(data, CFG.splitRatio, 12345);
    } else {
      label='[Full]';
      fold={train:data, test:data};
    }

    pushLog('📂 '+label+'  Train: '+fold.train.length+' / Test: '+fold.test.length,'fold');
    await tick();

    var result=await optimizeOnce(fold.train, N, label);
    if(!running) break;

    var trainEval=evalRules(fold.train, result.rules);
    var testEval=evalRules(fold.test, result.rules);

    pushLog('📊 '+label+' Train '+trainEval.profit+' | Test '+testEval.profit,'fold');
    foldResults.push({
      label:label, rules:result.rules,
      trainEval:trainEval, testEval:testEval,
      trainProfit:result.profit
    });
    await tick();
  }

  if(foldResults.length===0){
    running=false;
    document.getElementById('btnRun').disabled=false;
    document.getElementById('btnStop').disabled=true;
    document.getElementById('status').style.display='none';
    return;
  }

  finish(parsed, foldResults, N);
}

/* ==================== 完成 ==================== */
function finish(parsed, foldResults, N){
  var elapsed=((Date.now()-startTime)/1000).toFixed(1);
  var best=foldResults[0];
  for(var i=1;i<foldResults.length;i++){
    if(foldResults[i].trainProfit>best.trainProfit) best=foldResults[i];
  }
  var finalRules=best.rules;

  pushLog('');
  pushLog('🏆 完成！耗時 '+elapsed+'s，總掃描 '+evalCount+' 次','head');
  pushLog('');

  if(CFG.useCV && foldResults.length>1){
    var avgTrain=0, avgTest=0, avgHits=0;
    for(var i=0;i<foldResults.length;i++){
      avgTrain+=foldResults[i].trainEval.profit;
      avgTest+=foldResults[i].testEval.profit;
      avgHits+=foldResults[i].testEval.hits;
    }
    avgTrain/=foldResults.length;
    avgTest/=foldResults.length;
    avgHits/=foldResults.length;
    var sd=0;
    for(var i=0;i<foldResults.length;i++) sd+=Math.pow(foldResults[i].testEval.profit-avgTest,2);
    sd=Math.sqrt(sd/foldResults.length);

    pushLog('📈 K-Fold 匯總（K='+CFG.cvFolds+'）','fold');
    pushLog('   平均 Train：'+avgTrain.toFixed(0),'info');
    pushLog('   平均 Test ：'+avgTest.toFixed(0)+' ± '+sd.toFixed(0),'success');
    pushLog('   平均命中  ：'+avgHits.toFixed(1),'info');
    if(avgTest<0) pushLog('   ⚠ 平均 Test 為負','err');
    else if(sd>Math.abs(avgTest)) pushLog('   ⚠ Test 波動大','warn');
    else pushLog('   ✓ Test 穩定，泛化良好','ok');

    var cvHtml='<div class="cv-result"><b style="color:#007bff">📈 K-Fold 結果</b>';
    for(var i=0;i<foldResults.length;i++){
      var fr=foldResults[i];
      cvHtml+='<div class="cv-row"><span>'+fr.label+'</span><span>Train '+fr.trainEval.profit+' | Test <b style="color:'+(fr.testEval.profit>0?'#0a7a0a':'#c00')+'">'+fr.testEval.profit+'</b></span></div>';
    }
    cvHtml+='<div class="cv-row"><span>平均 Test</span><span>'+avgTest.toFixed(0)+' ± '+sd.toFixed(0)+'</span></div></div>';
    document.getElementById('cvResult').innerHTML=cvHtml;
    document.getElementById('cvResult').style.display='block';
  } else if(CFG.splitRatio<1){
    var fr=foldResults[0];
    var gap=fr.trainEval.profit-fr.testEval.profit;
    var gapPct=fr.trainEval.profit!==0?(gap/Math.abs(fr.trainEval.profit)*100).toFixed(0):'—';
    var cvHtml='<div class="cv-result"><b style="color:#007bff">📊 Train/Test 分割</b>';
    cvHtml+='<div class="cv-row"><span>Train（'+fr.trainEval.hits+' 命中）</span><span><b>'+fr.trainEval.profit+'</b></span></div>';
    cvHtml+='<div class="cv-row"><span>Test（'+fr.testEval.hits+' 命中）</span><span><b style="color:'+(fr.testEval.profit>0?'#0a7a0a':'#c00')+'">'+fr.testEval.profit+'</b></span></div>';
    cvHtml+='<div class="cv-row"><span>衰減</span><span>'+(gap>=0?'-':'+')+Math.abs(gap)+'（'+gapPct+'%）</span></div></div>';
    document.getElementById('cvResult').innerHTML=cvHtml;
    document.getElementById('cvResult').style.display='block';
  }

  var fullEval=evalRules(data, finalRules);
  var formula=genFormula(finalRules);
  document.getElementById('best').style.display='block';

  var summaryHtml='🏆 最終規則（全部資料）：<b>盈利 '+fullEval.profit+'</b>（命中 '+fullEval.hits+'，對 '+fullEval.correct+'，錯 '+fullEval.wrong+'）';
  if(CFG.minBets>0 && fullEval.hits<CFG.minBets){
    summaryHtml+='　<span style="color:#c00">⚠ 未達最少命中 '+CFG.minBets+'</span>';
  }
  document.getElementById('summary').innerHTML=summaryHtml;
  document.getElementById('params').textContent=JSON.stringify(finalRules);
  document.getElementById('txtOut').value=formula;

  var stats=diagnose(data, finalRules);
  renderRuleTable(stats);
  document.getElementById('diag').style.display='block';

  running=false;
  document.getElementById('btnRun').disabled=false;
  document.getElementById('btnStop').disabled=true;
  document.getElementById('status').style.display='none';
  document.getElementById('progbar').style.width='100%';
  updateStats(N, fullEval.profit);
}

function stop(){
  running=false;
  document.getElementById('btnStop').disabled=true;
  pushLog('⏹ 手動停止','warn');
}

/* ==================== 複製 ==================== */
function copyIt(id){
  var el=document.getElementById(id);
  if(!el) return;
  var txt=el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      showMsg('✅ 已複製 '+txt.length+' 字元', true);
    }).catch(function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  var ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg('✅ 已複製 '+text.length+' 字元', true);
  else showMsg('❌ 複製失敗', false);
}
function showMsg(text, ok){
  var m=document.getElementById('msg');
  m.textContent=text; m.className=ok?'ok':'err'; m.style.display='block';
  setTimeout(function(){ m.style.display='none'; }, 3000);
}
