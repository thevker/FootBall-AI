<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莊家思路 - 賠率預測工具</title>
    <style>
        :root {
            --bg-color: #0f0f1a;
            --card-bg: #1a1a2e;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent-blue: #4a90e2;
            --accent-green: #2ecc71; /* 升水 */
            --accent-red: #e74c3c;   /* 跌水 */
            --accent-gold: #f1c40f;
            --accent-purple: #9b59b6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; color: #fff; font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }

        /* 輸入表單 */
        .input-section { display: flex; gap: 15px; margin-bottom: 20px; }
        .input-card {
            flex: 1; background: #252540; padding: 15px; border-radius: 8px;
            border: 1px solid #333;
        }
        .input-card h3 { margin: 0 0 10px 0; font-size: 14px; color: #fff; text-align: center; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 12px; color: var(--text-muted); }
        .input-group input {
            padding: 8px; background: #1a1a2e; color: #fff; border: 1px solid #444;
            border-radius: 4px; font-size: 14px; text-align: center; outline: none;
        }
        .input-group input:focus { border-color: var(--accent-blue); }

        .btn-analyze {
            width: 100%; padding: 15px; background: var(--accent-blue); color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: 0.3s; margin-bottom: 20px;
        }
        .btn-analyze:hover { background: #357abd; }

        /* 結果區域 */
        .result-area { display: none; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .result-header { font-size: 18px; font-weight: bold; color: var(--accent-gold); border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        
        .info-box {
            background: #252540; border-left: 4px solid var(--accent-blue);
            padding: 15px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; line-height: 1.6;
        }
        .info-box strong { color: #fff; }
        .highlight-box {
            background: rgba(241, 196, 15, 0.1); border-left: 4px solid var(--accent-gold);
            padding: 15px; border-radius: 4px; margin-bottom: 20px;
        }
        .highlight-box span { color: var(--accent-gold); font-weight: bold; font-size: 22px; display: block; margin-top: 5px; }

        /* 表格樣式 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 12px 8px; text-align: center; border-bottom: 1px solid #333; }
        th { color: var(--text-muted); font-weight: normal; text-transform: uppercase; font-size: 12px; }
        .star-rating { color: var(--accent-gold); letter-spacing: 2px; font-size: 16px; }
        .star-empty { color: #444; }
        .highlight { color: var(--accent-green); font-weight: bold; background: rgba(46, 204, 113, 0.1); }
        .trend-up { color: var(--accent-green); }
        .trend-down { color: var(--accent-red); }
        .trend-flat { color: var(--text-muted); }

        .log-box { background: #111; padding: 12px; border-radius: 4px; font-family: monospace; font-size: 12px; color: #888; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>莊家思路 賠率預測工具</h1>
    <div class="subtitle">輸入初盤與尾盤數值，自動生成分析與投注建議</div>

    <div class="input-section">
        <div class="input-card">
            <h3>初盤 (開盤)</h3>
            <div class="input-group">
                <label>主隊勝</label>
                <input type="number" id="h_open" step="0.01" placeholder="例：1.85">
                <label>和局</label>
                <input type="number" id="d_open" step="0.01" placeholder="例：3.45">
                <label>客隊勝</label>
                <input type="number" id="a_open" step="0.01" placeholder="例：3.45">
            </div>
        </div>
        <div class="input-card">
            <h3>尾盤 (臨場)</h3>
            <div class="input-group">
                <label>主隊勝</label>
                <input type="number" id="h_close" step="0.01" placeholder="例：1.65">
                <label>和局</label>
                <input type="number" id="d_close" step="0.01" placeholder="例：3.90">
                <label>客隊勝</label>
                <input type="number" id="a_close" step="0.01" placeholder="例：4.40">
            </div>
        </div>
    </div>

    <button class="btn-analyze" onclick="analyze()">開始分析</button>

    <div class="result-area" id="resultArea">
        <div class="result-header">📊 分析結果</div>
        
        <div class="info-box" id="trendInfo">
            <!-- 趨勢分析 -->
        </div>

        <div class="highlight-box">
            最終建議：<span id="finalAdvice"></span>
        </div>

        <table>
            <thead>
                <tr>
                    <th>建議選項</th>
                    <th>星級評分</th>
                    <th>分析備註</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 動態生成 -->
            </tbody>
        </table>

        <div class="log-box" id="logBox"></div>
    </div>
</div>

<script>
    function analyze() {
        // 1. 獲取輸入值
        const h_open = parseFloat(document.getElementById('h_open').value);
        const d_open = parseFloat(document.getElementById('d_open').value);
        const a_open = parseFloat(document.getElementById('a_open').value);
        const h_close = parseFloat(document.getElementById('h_close').value);
        const d_close = parseFloat(document.getElementById('d_close').value);
        const a_close = parseFloat(document.getElementById('a_close').value);

        if (isNaN(h_open) || isNaN(d_open) || isNaN(a_open) || isNaN(h_close) || isNaN(d_close) || isNaN(a_close)) {
            alert("請完整填寫所有 6 個數值！");
            return;
        }

        // 2. 判斷誰是初盤上盤 (賠率較低者)
        let upper_open, lower_open, upper_close, lower_close;
        let isHomeUpper = h_open < a_open;
        
        if (isHomeUpper) {
            upper_open = h_open; lower_open = a_open;
            upper_close = h_close; lower_close = a_close;
        } else {
            upper_open = a_open; lower_open = h_open;
            upper_close = a_close; lower_close = h_close;
        }

        // 3. 計算升跌水狀態 (紅跌綠升)
        const upper_change = upper_close - upper_open; // 負數為跌水
        const lower_change = lower_close - lower_open; // 正數為升水
        const draw_change = d_close - d_open;

        let upper_trend = upper_change > 0.05 ? 'up' : (upper_change < -0.05 ? 'down' : 'flat');
        let lower_trend = lower_change > 0.05 ? 'up' : (lower_change < -0.05 ? 'down' : 'flat');
        let draw_trend = draw_change > 0.05 ? 'up' : (draw_change < -0.05 ? 'down' : 'flat');

        // 4. 根據規律進行分析
        let result = {
            trendText: "",
            finalAdvice: "",
            stars: { homeWin: 0, draw: 0, awayWin: 0, homeHandicap: 0, awayHandicap: 0, skip: 0 },
            notes: { homeWin: "", draw: "", awayWin: "", homeHandicap: "", awayHandicap: "", skip: "" },
            log: ""
        };

        const upperName = isHomeUpper ? "主隊" : "客隊";
        const lowerName = isHomeUpper ? "客隊" : "主隊";
        
        // 輔助函數：格式化趨勢文字
        function formatTrend(val, type) {
            let cls = val > 0 ? 'trend-up' : (val < 0 ? 'trend-down' : 'trend-flat');
            let icon = val > 0 ? '📈' : (val < 0 ? '📉' : '➖');
            return `<span class="${cls}">${type} ${icon}</span>`;
        }

        result.trendText = `初盤定位：<strong>${upperName}為上盤 (${upper_open.toFixed(2)})</strong><br>` +
                           `尾盤變化：上盤(${upperName}) ${formatTrend(upper_change, upper_close.toFixed(2))} | ` +
                           `和局 ${formatTrend(draw_change, d_close.toFixed(2))} | ` +
                           `下盤(${lowerName}) ${formatTrend(lower_change, lower_close.toFixed(2))}`;

        // 核心邏輯樹
        if (upper_open <= 1.50) {
            // ================= 毒藥深盤 =================
            result.log = "識別為：毒藥深盤 (初盤 ≤ 1.50)";
            
            if (upper_close < 1.50 && lower_close > 6.0) {
                result.finalAdvice = "跳過放棄（真實碾碎）";
                result.notes = {
                    homeWin: isHomeUpper ? "主隊大勝在望，但賠率過低，利潤微薄。" : "客隊大勝在望，但賠率過低。",
                    draw: "和局被徹底放棄，爆冷概率極低。",
                    awayWin: isHomeUpper ? "客隊被徹底放棄，不建議搏冷。" : "主隊被徹底放棄，不建議搏冷。",
                    homeHandicap: "讓球盤太深（如讓兩球半），極易贏球輸盤。",
                    awayHandicap: "受讓盤性價比極差。",
                    skip: "★★★★★ 最佳策略。讓球盤太深，獨贏利潤太低，放棄是保護本金的最佳選擇。"
                };
                result.stars = { homeWin: 3, draw: 1, awayWin: 1, homeHandicap: 1, awayHandicap: 1, skip: 5 };
            } else {
                result.finalAdvice = "跳過放棄（毒藥陷阱）";
                result.notes = {
                    homeWin: isHomeUpper ? "主隊極低賠率，極易爆冷平局或輸球。" : "客隊極低賠率，極易爆冷。",
                    draw: "和局是莊家的防守底線，若看好可小注搏冷。",
                    awayWin: "下盤被放棄，但爆冷概率存在。",
                    homeHandicap: "讓球盤風險極大，贏球輸盤概率高。",
                    awayHandicap: "受讓盤有一定避險價值，但非最佳。",
                    skip: "★★★★★ 絕對禁區。無論升跌水，堅決不碰，避開陷阱。"
                };
                result.stars = { homeWin: 1, draw: 3, awayWin: 1, homeHandicap: 1, awayHandicap: 2, skip: 5 };
            }
        } else if (upper_open >= 1.70 && upper_open <= 2.20) {
            // ================= 合理阻力區 =================
            result.log = "識別為：合理阻力區 (初盤 1.70 - 2.20)";
            
            // 阻上誘下：上盤升水，下盤跌水，和局跌水
            if (upper_trend === 'up' && lower_trend === 'down' && draw_trend === 'down') {
                result.finalAdvice = "上盤勝（獨贏）";
                result.notes = {
                    homeWin: isHomeUpper ? "上盤升水阻盤，下盤跌水誘盤，主隊穩勝。" : "上盤升水阻盤，下盤跌水誘盤，客隊穩勝。",
                    draw: "和局跌水是掩護，大概率分勝負。",
                    awayWin: "下盤跌水是誘餌，不建議搏冷。",
                    homeHandicap: "讓球盤可博主勝，但獨贏更穩。",
                    awayHandicap: "受讓盤風險大。",
                    skip: "信號清晰，不建議放棄。"
                };
                result.stars = { homeWin: 5, draw: 2, awayWin: 1, homeHandicap: 4, awayHandicap: 1, skip: 1 };
            }
            // 真實防範：上盤跌水，下盤大幅升水，和局微跌/升
            else if (upper_trend === 'down' && lower_trend === 'up' && (draw_trend === 'flat' || draw_trend === 'down' || draw_trend === 'up')) {
                result.finalAdvice = "上盤勝（獨贏）";
                result.notes = {
                    homeWin: isHomeUpper ? "上盤跌水真實防範，主隊贏球概率大。" : "上盤跌水真實防範，客隊贏球概率大。",
                    draw: "和局變動不大，大概率分勝負。",
                    awayWin: "下盤大幅升水被放棄，不建議搏冷。",
                    homeHandicap: "讓球盤可博主勝，注意讓球數深淺。",
                    awayHandicap: "受讓盤性價比低。",
                    skip: "信號清晰，不建議放棄。"
                };
                result.stars = { homeWin: 5, draw: 2, awayWin: 1, homeHandicap: 4, awayHandicap: 1, skip: 1 };
            }
            // 其他混亂信號
            else {
                result.finalAdvice = "跳過放棄";
                result.notes = {
                    homeWin: "信號不明確。",
                    draw: "和局變動混亂。",
                    awayWin: "下盤變動混亂。",
                    homeHandicap: "讓球風險大。",
                    awayHandicap: "受讓風險大。",
                    skip: "★★★★ 信號矛盾，保護本金為上。"
                };
                result.stars = { homeWin: 2, draw: 2, awayWin: 2, homeHandicap: 2, awayHandicap: 2, skip: 4 };
            }
        } else {
            // ================= 淺盤 / 平手盤 =================
            result.log = "識別為：淺盤 / 平手盤 (初盤 > 2.20)";
            result.finalAdvice = "跳過放棄";
            result.notes = {
                homeWin: "淺盤變數極大，任何一方贏球都不算爆冷。",
                draw: "若和局跌水，可小注搏和局。",
                awayWin: "下盤若暴跌，是誘盤陷阱。",
                homeHandicap: "讓球盤風險極高。",
                awayHandicap: "受讓盤是相對安全的選擇。",
                skip: "★★★★★ 淺盤是莊家的屠宰場，跳過放棄是最高勝率策略。"
            };
            result.stars = { homeWin: 2, draw: 3, awayWin: 2, homeHandicap: 1, awayHandicap: 3, skip: 5 };
        }

        // 5. 渲染結果
        document.getElementById('trendInfo').innerHTML = result.trendText;
        document.getElementById('finalAdvice').innerText = result.finalAdvice;
        document.getElementById('logBox').innerText = `> 分析時間: ${new Date().toLocaleString()}\n> 規則匹配: ${result.log}`;

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        const items = [
            { key: 'homeWin', label: isHomeUpper ? '上盤勝 (主勝)' : '下盤勝 (主勝)' },
            { key: 'draw', label: '和局' },
            { key: 'awayWin', label: isHomeUpper ? '下盤勝 (客勝)' : '上盤勝 (客勝)' },
            { key: 'homeHandicap', label: isHomeUpper ? '上盤讓半球 (主讓)' : '下盤讓半球 (客讓)' },
            { key: 'awayHandicap', label: isHomeUpper ? '下盤受讓半球 (客受)' : '上盤受讓半球 (主受)' },
            { key: 'skip', label: '跳過放棄' }
        ];

        function renderStars(count) {
            let stars = '';
            for(let i=1; i<=5; i++) {
                stars += i <= count ? '★' : '<span class="star-empty">★</span>';
            }
            return stars;
        }

        items.forEach(item => {
            const tr = document.createElement('tr');
            const isFinal = result.finalAdvice.includes(item.label.split(' ')[0]) || 
                            (item.key === 'skip' && result.finalAdvice.includes('放棄'));
            
            // 處理高亮，若是最終建議則高亮
            let finalMatch = false;
            if (item.key === 'homeWin' && result.finalAdvice.includes('上盤勝')) finalMatch = true;
            if (item.key === 'awayWin' && result.finalAdvice.includes('下盤勝')) finalMatch = true;
            if (item.key === 'skip' && result.finalAdvice.includes('放棄')) finalMatch = true;
            if (item.key === 'draw' && result.finalAdvice.includes('和局')) finalMatch = true;

            tr.innerHTML = `
                <td class="${finalMatch ? 'highlight' : ''}">${item.label}</td>
                <td class="star-rating">${renderStars(result.stars[item.key])}</td>
                <td>${result.notes[item.key]}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('resultArea').style.display = 'block';
    }
</script>
</body>
</html>
