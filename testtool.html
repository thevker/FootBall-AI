<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>公式盈利優化器</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;padding:16px;max-width:1400px;margin:auto;background:#f0f2f5}
h2{margin:0 0 8px 0}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.lang-btn{padding:6px 14px;font-size:13px;border:1px solid #ccc;background:#fff;color:#333;border-radius:4px;cursor:pointer;margin-left:4px}

#input{height:120px}
button{padding:10px 22px;font-size:15px;margin:6px 4px 6px 0;cursor:pointer;background:#007bff;color:#fff;border:none;border-radius:5px;font-weight:bold}
button:hover{background:#0056b3}
button:disabled{background:#999;cursor:not-allowed}
button.stop{background:#dc3545}
button.hex{background:#6f42c1}
button.txt{background:#28a745}
#log{background:#1e1e1e;color:#d4d4d4;border-radius:5px;padding:12px;margin-top:12px;height:120px;overflow-y:auto;font-family:monospace;font-size:12px;white-space:pre-wrap;line-height:1.5}
.best{background:#d4edda;padding:14px;border-radius:6px;margin-top:12px;border:1px solid #c3e6cb;display:none}
.best b{color:#155724}
.box{background:#fff;padding:10px;border-radius:4px;margin-top:10px;border:1px solid #ddd}
.label{font-weight:bold;font-size:13px;margin-bottom:6px;color:#333}
.out{width:100%;height:110px;font-family:monospace;font-size:11px;padding:8px;border:1px solid #ddd;border-radius:4px;background:#f8f9fa;white-space:pre;overflow:auto;resize:vertical}
.param{font-family:monospace;font-size:12px;word-break:break-all;color:#555;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
select{padding:6px;border-radius:4px;border:1px solid #ccc;font-size:14px}
#msg{margin-top:8px;font-weight:bold;font-size:13px;display:none;padding:8px;border-radius:4px}
.ok{background:#d4edda;color:#155724}
.err{background:#f8d7da;color:#721c24}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px;background:#fff}
th,td{border:1px solid #ccc;padding:6px 8px;text-align:right}
th{background:#e9ecef;text-align:center;position:sticky;top:0;z-index:2}
td:first-child,td:nth-child(2),td:nth-child(3){text-align:left}
.diag{max-height:500px;overflow:auto;border:1px solid #ccc;border-radius:4px;margin-top:10px}
.profit-pos{color:#0a7a0a;font-weight:bold}
.profit-neg{color:#c00;font-weight:bold}
.tag-del{background:#dc3545;color:#fff;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:bold}
.tag-ok{background:#28a745;color:#fff;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:bold}
.tag-low{background:#ffc107;color:#333;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:bold}
h3{margin-top:20px;margin-bottom:6px;font-size:15px;color:#333}
.section{background:#fff;padding:12px;border-radius:6px;border:1px solid #ddd;margin-top:12px}
.check-ok{color:#0a7a0a;font-weight:bold;padding:8px;background:#d4edda;border-radius:4px;margin-top:8px}
.check-err{color:#721c24;font-weight:bold;padding:8px;background:#f8d7da;border-radius:4px;margin-top:8px}

<div class="top">

<p id="desc">貼數據（每行：A B C D E F 比分 結果）。搜尋最優門檻並自動診斷規則。</p>

62	27	9	158	395	405	3:0	H"></textarea>

function hexToStr(h){
  var s = h.replace(/\s+/g, '');
  var r = '';
  for(var i = 0; i < s.length; i += 2){
    r += String.fromCharCode(parseInt(s.substr(i, 2), 16));
  }
  return r;
}
function strToHex(t){
  var arr = [];
  for(var i = 0; i < t.length; i++){
    arr.push(t.charCodeAt(i).toString(16).toUpperCase().padStart(2, '0'));
  }
  return arr.join(' ');
}

  ac6: {d:50, min:40, max:65, s:1},
  a8:  {d:34, min:30, max:42, s:1},
  d8b: {d:235,min:220,max:250,s:2},
  a92: {d:38, min:34, max:44, s:1},
  f92: {d:250,min:220,max:290,s:5},
  e10: {d:315,min:280,max:360,s:5},
  b10: {d:27, min:22, max:34, s:1},
  f11a:{d:490,min:450,max:530,s:5},
  f11b:{d:560,min:520,max:620,s:5},
  f13a:{d:184,min:170,max:200,s:2},
  f13b:{d:216,min:200,max:240,s:2},
  gap: {d:400,min:250,max:600,s:10},
  f700:{d:700,min:600,max:850,s:10},
  e470:{d:470,min:400,max:550,s:10},
  a47: {d:47, min:40, max:60, s:1}
};
var KEYS = Object.keys(P_DEF);
function defaultP(){ var P = {}; for(var k in P_DEF) P[k] = P_DEF[k].d; return P; }

var data = [];
var running = false;
var lastDiag = null;

function parseData(text){
  var rows = [];
  var lines = text.split('\n');
  for(var li = 0; li < lines.length; li++){
    var p = lines[li].trim().split(/\s+/);
    if(p.length < 8) continue;
    var v = p.slice(0,6).map(Number);
    var result = p[7];
    if(v.some(isNaN)) continue;
    if(['H','D','A'].indexOf(result) === -1) continue;
    rows.push({A:v[0],B:v[1],C:v[2],D:v[3],E:v[4],F:v[5],result:result});
  }
  return rows;
}

function predictWithRule(r, P){
  var A=r.A,B=r.B,C=r.C,D=r.D,E=r.E,F=r.F;
  if(B >= P.b1 && Math.abs(A-C) <= P.ac1) return {result:'D', rule:'R1'};
  if(A >= P.a2 && C <= 11 && D >= 140 && D <= 190 && F >= P.f2a && F <= P.f2b) return {result:'H', rule:'R2'};
  if(Math.abs(A-C) <= P.ac3 && E < P.e3 && Math.abs(D-F) < P.df3) return {result:'D', rule:'R3'};
  if(A >= P.a4 && C <= 20 && Math.abs(D-F) < P.df4 && D < 400) return {result:'D', rule:'R4'};
  if(Math.abs(D-F) < P.df5) return {result:'D', rule:'R5'};
  if(A >= 42 && D >= 155 && D < 205 && D !== F && F > D && Math.abs(A-C) >= P.ac6) return {result:'D', rule:'R6'};
  if(A >= 42 && D >= 155 && D < 205 && D !== F) return {result:'H', rule:'R7'};
  if(A >= P.a8 && D > 205 && D <= P.d8b && D !== F) return {result:'D', rule:'R8'};
  if(D >= 400 && A >= 42) return {result:'D', rule:'R9'};
  if(D >= 340 && A >= P.a92 && F < P.f92 && D > F){
    if(F < 200) return Math.abs(A-C) <= 5 ? {result:'D', rule:'R10'} : {result:'A', rule:'R10'};
    return {result:'D', rule:'R10'};
  }
  if(E <= P.e10 && B >= P.b10 && Math.abs(A-C) <= 25 && D >= 250 && D <= 350 && D < E) return {result:'D', rule:'R11'};
  if(C > A && F >= P.f11a && F <= P.f11b && D < 200) return {result:'D', rule:'R12'};
  if(C > A && F > D && F < 550 && E > 320) return {result:'H', rule:'R13'};
  if(C > A && F >= P.f13a && F <= P.f13b && C >= 40) return {result:'A', rule:'R14'};
  if(C > A && F > D && F < 300 && C < 45 && D < 250) return {result:'D', rule:'R15'};
  if(D > F){
    if(F <= 150 && C >= 65) return {result:'A', rule:'R16a'};
    if(D > 1500){
      if(C >= 50) return {result:'A', rule:'R16b'};
      if(A > C) return {result:'D', rule:'R16b'};
      return {result:'skip', rule:'R16b'};
    }
    if(A >= 33 && D >= 350) return {result:'D', rule:'R16c'};
    return {result:'H', rule:'R16d'};
  }
  if(F > D){
    if(A >= 50 && (F-D) >= P.gap) return {result:'H', rule:'R17a'};
    if(F >= P.f700){
      if(A >= 80) return {result:'D', rule:'R17b'};
      if(C > A) return {result:'D', rule:'R17b'};
      if(A < 45) return {result:'D', rule:'R17b'};
      return {result:'skip', rule:'R17b'};
    }
    if(E >= P.e470 && F >= 500) return {result:'D', rule:'R17c'};
    if(A >= P.a47 && D <= 140) return {result:'H', rule:'R17d'};
    return {result:'A', rule:'R17e'};
  }
  if(A > C) return {result:'H', rule:'R18'};
  if(C > A) return {result:'A', rule:'R19'};
  return {result:'skip', rule:'R20'};
}

function predict(r, P){ return predictWithRule(r, P).result; }

function profit(rows, P){
  var total = 0;
  for(var i = 0; i < rows.length; i++){
    var r = rows[i];
    var p = predict(r, P);
    if(p === 'skip') continue;
    if(p === r.result){
      if(p === 'H') total += r.D - 100;
      else if(p === 'D') total += r.E - 100;
      else if(p === 'A') total += r.F - 100;
    } else total -= 100;
  }
  return total;
}

function descend(rows, P0){
  var P = {};
  for(var kk in P0) P[kk] = P0[kk];
  var best = profit(rows, P);
  var improved = true;
  while(improved && running){
    improved = false;
    for(var ki = 0; ki < KEYS.length; ki++){
      if(!running) return {P:P, profit:best};
      var k = KEYS[ki];
      var def = P_DEF[k];
      var orig = P[k];
      var bestVal = orig, bestScore = best;
      for(var v = def.min; v <= def.max; v += def.s){
        if(v === orig) continue;
        P[k] = v;
        var s = profit(rows, P);
        if(s > bestScore){ bestScore = s; bestVal = v; }
      }
      if(def.s > 1){
        var lo = Math.max(def.min, bestVal - def.s + 1);
        var hi = Math.min(def.max, bestVal + def.s - 1);
        for(var v2 = lo; v2 <= hi; v2++){
          if(v2 === orig || v2 === bestVal) continue;
          P[k] = v2;
          var s2 = profit(rows, P);
          if(s2 > bestScore){ bestScore = s2; bestVal = v2; }
        }
      }
      P[k] = bestVal;
      if(bestScore > best){ best = bestScore; improved = true; }
    }
  }
  return {P:P, profit:best};
}

function randomStart(n){
  var P = defaultP();
  var sh = KEYS.slice().sort(function(){ return Math.random() - 0.5; });
  for(var i = 0; i < n && i < sh.length; i++){
    var k = sh[i], def = P_DEF[k];
    var steps = Math.round((def.max - def.min) / def.s);
    P[k] = def.min + Math.floor(Math.random() * (steps + 1)) * def.s;
  }
  return P;
}

function genText(P){
  return TEMPLATE.replace(/\{(\w+)\}/g, function(m, k){
    return P[k] !== undefined ? P[k] : m;
  });
}
function genHex(P){ return strToHex(genText(P)); }

function checkFormula(formula){
  var errors = [];
  if(!formula || !formula.trim()){
    return {ok:false, errors:[t('checkEmpty')]};
  }
  var re = /([A-F])2:([A-F])/g;
  var m;
  var count = 0;
  while((m = re.exec(formula)) !== null){
    count++;
    if(m[1] !== m[2]){
      errors.push(tf('checkRange', {
        n: count,
        bad: m[1] + '2:' + m[2],
        good: m[1] + '2:' + m[1]
      }));
    }
  }
  return {ok: errors.length === 0, errors: errors};
}

function renderCheck(formula){
  var r = checkFormula(formula);
  var el = document.getElementById('checkResult');
  if(r.ok){
    el.innerHTML = '<div class="check-ok">' + t('checkOk') + '</div>';
  } else {
    var html = '<div class="check-err">' + t('checkErr') + '<ul>';
    for(var i = 0; i < r.errors.length; i++) html += '<li>' + r.errors[i] + '</li>';
    html += '</ul></div>';
    el.innerHTML = html;
  }
  return r.ok;
}

function diagnose(rows, P){
  var stats = {};
  var skips = {H:0, D:0, A:0, total:0};
  var worst = [];

  for(var i = 0; i < rows.length; i++){
    var r = rows[i];
    var res = predictWithRule(r, P);
    var rule = res.rule;
    var p = res.result;

    if(p === 'skip'){
      skips[r.result] = (skips[r.result] || 0) + 1;
      skips.total++;
      continue;
    }

    if(!stats[rule]){
      stats[rule] = {rule:rule, hit:0, correct:0, wrong:0, profit:0};
    }
    stats[rule].hit++;

    var gameProfit = 0;
    if(p === r.result){
      stats[rule].correct++;
      if(p === 'H') gameProfit = r.D - 100;
      else if(p === 'D') gameProfit = r.E - 100;
      else if(p === 'A') gameProfit = r.F - 100;
    } else {
      stats[rule].wrong++;
      gameProfit = -100;
      worst.push({
        idx: i, rule: rule, pred: p, actual: r.result,
        A: r.A, B: r.B, C: r.C, D: r.D, E: r.E, F: r.F,
        profit: gameProfit
      });
    }
    stats[rule].profit += gameProfit;
  }

  return {stats: stats, skips: skips, worst: worst};
}

function renderDiag(diagResult){
  lastDiag = diagResult;

  var rules = [];
  for(var k in diagResult.stats) rules.push(diagResult.stats[k]);
  rules.sort(function(a,b){ return a.profit - b.profit; });

  var html = '<table><thead><tr>' +
    '<th>' + t('thRule') + '</th>' +
    '<th>' + t('thHit') + '</th>' +
    '<th>' + t('thCorrect') + '</th>' +
    '<th>' + t('thWrong') + '</th>' +
    '<th>' + t('thRate') + '</th>' +
    '<th>' + t('thProfit') + '</th>' +
    '<th>' + t('thVerdict') + '</th>' +
    '</tr></thead><tbody>';

  for(var i = 0; i < rules.length; i++){
    var r = rules[i];
    var rate = r.hit > 0 ? (r.correct / r.hit * 100).toFixed(1) + '%' : '-';
    var pcls = r.profit > 0 ? 'profit-pos' : (r.profit < 0 ? 'profit-neg' : '');
    var tag = '';
    if(r.profit < -500 && r.hit >= 5) tag = '<span class="tag-del">' + t('tagDel') + '</span>';
    else if(r.profit < 0) tag = '<span class="tag-low">' + t('tagLow') + '</span>';
    else if(r.profit > 0 && r.hit >= 5) tag = '<span class="tag-ok">' + t('tagOk') + '</span>';

    html += '<tr>' +
      '<td><b>' + r.rule + '</b></td>' +
      '<td>' + r.hit + '</td>' +
      '<td>' + r.correct + '</td>' +
      '<td>' + r.wrong + '</td>' +
      '<td>' + rate + '</td>' +
      '<td class="' + pcls + '">' + r.profit + '</td>' +
      '<td>' + tag + '</td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('ruleTable').innerHTML = html;

  var sk = diagResult.skips;
  var total = sk.total || 1;
  var skHtml = '<table><thead><tr>' +
    '<th>' + t('thResult') + '</th>' +
    '<th>' + t('thCount') + '</th>' +
    '<th>' + t('thPct') + '</th>' +
    '</tr></thead><tbody>';
  skHtml += '<tr><td>' + t('rH') + '</td><td>' + (sk.H||0) + '</td><td>' + ((sk.H||0)/total*100).toFixed(1) + '%</td></tr>';
  skHtml += '<tr><td>' + t('rD') + '</td><td>' + (sk.D||0) + '</td><td>' + ((sk.D||0)/total*100).toFixed(1) + '%</td></tr>';
  skHtml += '<tr><td>' + t('rA') + '</td><td>' + (sk.A||0) + '</td><td>' + ((sk.A||0)/total*100).toFixed(1) + '%</td></tr>';
  skHtml += '<tr><td><b>' + t('rTotal') + '</b></td><td><b>' + sk.total + '</b></td><td>-</td></tr>';
  skHtml += '</tbody></table>';
  document.getElementById('skipStats').innerHTML = skHtml;

  diagResult.worst.sort(function(a,b){ return a.profit - b.profit; });
  var top20 = diagResult.worst.slice(0, 20);
  var wHtml = '<table><thead><tr>' +
    '<th>' + t('thIdx') + '</th>' +
    '<th>' + t('thRule') + '</th>' +
    '<th>' + t('thPred') + '</th>' +
    '<th>' + t('thActual') + '</th>' +
    '<th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th>' +
    '<th>' + t('thLoss') + '</th>' +
    '</tr></thead><tbody>';
  for(var wi = 0; wi < top20.length; wi++){
    var w = top20[wi];
    wHtml += '<tr>' +
      '<td>' + (w.idx+1) + '</td>' +
      '<td>' + w.rule + '</td>' +
      '<td>' + w.pred + '</td>' +
      '<td>' + w.actual + '</td>' +
      '<td>' + w.A + '</td>' +
      '<td>' + w.B + '</td>' +
      '<td>' + w.C + '</td>' +
      '<td>' + w.D + '</td>' +
      '<td>' + w.E + '</td>' +
      '<td>' + w.F + '</td>' +
      '<td class="profit-neg">' + w.profit + '</td>' +
      '</tr>';
  }
  wHtml += '</tbody></table>';
  document.getElementById('worstTable').innerHTML = wHtml;

  var sug = [];
  var badRules = rules.filter(function(r){ return r.profit < 0 && r.hit >= 3; });
  if(badRules.length){
    sug.push('<b>' + t('sugDel') + '</b>');
    for(var bi = 0; bi < badRules.length; bi++){
      var br = badRules[bi];
      sug.push(tf('sugHitNeg', {r: br.rule, n: br.hit, p: br.profit}));
    }
  }
  if(sk.total > 0){
    var maxResult = ['H','D','A'].reduce(function(a,b){ return (sk[a]||0) > (sk[b]||0) ? a : b; });
    var rKey = (maxResult === 'H') ? 'rH' : (maxResult === 'D' ? 'rD' : 'rA');
    sug.push(tf('sugSkip', {r: t(rKey), n: (sk[maxResult]||0)}));
  }
  var highProfit = rules.filter(function(r){ return r.profit > 0; })
    .sort(function(a,b){ return b.profit - a.profit; }).slice(0, 3);
  if(highProfit.length){
    sug.push('<b>' + t('sugTop') + '</b>');
    for(var hi = 0; hi < highProfit.length; hi++){
      var hr = highProfit[hi];
      sug.push(tf('sugHit', {r: hr.rule, n: hr.hit, p: hr.profit}));
    }
  }
  document.getElementById('suggestions').innerHTML = sug.join('<br>');
}

function start(){
  data = parseData(document.getElementById('input').value);
  if(data.length === 0){ alert(t('noData')); return; }

  running = true;
  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnStop').disabled = false;
  var log = document.getElementById('log');
  var bestEl = document.getElementById('best');
  document.getElementById('diag').style.display = 'none';
  document.getElementById('checkResult').innerHTML = '';
  log.dataset.hasContent = '1';

  log.textContent = tf('logLoaded', {n: data.length}) + '\n';

  var best = defaultP();
  var bestProfit = profit(data, best);
  log.textContent += tf('logBaseline', {v: bestProfit}) + '\n';

  var r = descend(data, best);
  if(r.profit > bestProfit){ bestProfit = r.profit; best = r.P; }
  log.textContent += tf('logStage1', {v: bestProfit}) + '\n';

  var N = parseInt(document.getElementById('strength').value);
  var i = 0;

  function step(){
    if(!running || i >= N){
      finish();
      return;
    }
    var chunk = Math.min(5, N - i);
    for(var c = 0; c < chunk; c++){
      r = descend(data, randomStart(4 + Math.floor(Math.random() * 6)));
      if(r.profit > bestProfit){
        bestProfit = r.profit;
        best = r.P;
        log.textContent += tf('logRestart', {i: (i+1), v: bestProfit}) + '\n';
        log.scrollTop = log.scrollHeight;
      }
      i++;
    }
    setTimeout(step, 0);
  }

  function finish(){
    if(running){
      for(var k = 0; k < 5 && running; k++){
        r = descend(data, best);
        if(r.profit <= bestProfit) break;
        bestProfit = r.profit;
        best = r.P;
        log.textContent += tf('logPolish', {k: (k+1), v: bestProfit}) + '\n';
      }
    }

    log.textContent += '\n' + tf('logDone', {v: bestProfit}) + '\n';

    var newText = genText(best);
    var newHex = genHex(best);

    bestEl.style.display = 'block';
    document.getElementById('summary').innerHTML =
      tf('summary', {v: '<b>' + bestProfit + '</b>', n: data.length});
    document.getElementById('params').textContent = t('paramsLabel') + JSON.stringify(best);
    document.getElementById('txtOut').value = newText;
    document.getElementById('hexOut').value = newHex;

    renderCheck(newText);

    var diag = diagnose(data, best);
    renderDiag(diag);
    document.getElementById('diag').style.display = 'block';

    running = false;
    document.getElementById('btnRun').disabled = false;
    document.getElementById('btnStop').disabled = true;
  }

  step();
}

function stop(){
  running = false;
  document.getElementById('btnStop').disabled = true;
}

function showMsg(text, ok){
  var m = document.getElementById('msg');
  m.textContent = text;
  m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  setTimeout(function(){ m.style.display = 'none'; }, 3000);
}

function copyIt(id, label){
  var el = document.getElementById(id);
  if(!el) return;
  var txt = el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      showMsg(tf('copied', {label: label, n: txt.length}), true);
    }).catch(function(){ fallbackCopy(txt, label); });
  } else {
    fallbackCopy(txt, label);
  }
}

function fallbackCopy(text, label){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg(tf('copied', {label: label, n: text.length}), true);
  else showMsg(t('copyFail'), false);
}

   初始化：不用 DOMContentLoaded，直接執行
   ========================================================== */
(function init(){
  var logEl = document.getElementById('log');
  if(logEl) logEl.textContent = '等待開始...';
})();
