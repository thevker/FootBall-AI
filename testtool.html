<script>

var LANG = 'zh';

  if(logEl && !logEl.dataset.hasContent) logEl.textContent = t('waiting');
}

/* ========== 初始規則 ========== */
var INIT_RULES = [
  {on:1, then:'D', cond:[['B','>=',32],['|A-C|','<=',6]]},
  {on:1, then:'H', cond:[['A','>=',60],['C','<=',11],['D','>=',140],['D','<=',190],['F','>=',400],['F','<=',480]]},
  {on:1, then:'D', cond:[['|A-C|','<=',3],['E','<',380],['|D-F|','<',40]]},
  {on:1, then:'D', cond:[['A','>=',45],['C','<=',20],['|D-F|','<',70],['D','<',400]]},
  {on:1, then:'D', cond:[['|D-F|','<',18]]},
  {on:1, then:'D', cond:[['A','>=',42],['D','>=',155],['D','<',205],['D-F','!=',0],['F-D','>',0],['|A-C|','>=',50]]},
  {on:1, then:'H', cond:[['A','>=',42],['D','>=',155],['D','<',205],['D-F','!=',0]]},
  {on:1, then:'D', cond:[['A','>=',34],['D','>',205],['D','<=',235],['D-F','!=',0]]},
  {on:1, then:'D', cond:[['D','>=',400],['A','>=',42]]},
  {on:1, then:'D', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0],['F','<',200],['|A-C|','<=',5]]},
  {on:1, then:'A', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0],['F','<',200]]},
  {on:1, then:'D', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0]]},
  {on:1, then:'D', cond:[['E','<=',315],['B','>=',27],['|A-C|','<=',25],['D','>=',250],['D','<=',350],['E-D','>',0]]},
  {on:1, then:'D', cond:[['C-A','>',0],['F','>=',490],['F','<=',560],['D','<',200]]},
  {on:1, then:'H', cond:[['C-A','>',0],['F-D','>',0],['F','<',550],['E','>',320]]},
  {on:1, then:'A', cond:[['C-A','>',0],['F','>=',184],['F','<=',216],['C','>=',40]]},
  {on:1, then:'D', cond:[['C-A','>',0],['F-D','>',0],['F','<',300],['C','<',45],['D','<',250]]},
  {on:1, then:'A', cond:[['D-F','>',0],['F','<=',150],['C','>=',65]]},
  {on:1, then:'A', cond:[['D-F','>',0],['D','>',1500],['C','>=',50]]},
  {on:1, then:'D', cond:[['D-F','>',0],['D','>',1500],['A-C','>',0]]},
  {on:1, then:'skip', cond:[['D-F','>',0],['D','>',1500]]},
  {on:1, then:'D', cond:[['D-F','>',0],['A','>=',33],['D','>=',350]]},
  {on:1, then:'H', cond:[['D-F','>',0]]},
  {on:1, then:'H', cond:[['F-D','>',0],['A','>=',50],['F-D','>=',400]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['A','>=',80]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['C-A','>',0]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['A','<',45]]},
  {on:1, then:'skip', cond:[['F-D','>',0],['F','>=',700]]},
  {on:1, then:'D', cond:[['F-D','>',0],['E','>=',470],['F','>=',500]]},
  {on:1, then:'H', cond:[['F-D','>',0],['A','>=',47],['D','<=',140]]},
  {on:1, then:'A', cond:[['F-D','>',0]]},
  {on:1, then:'H', cond:[['A-C','>',0]]},
  {on:1, then:'A', cond:[['C-A','>',0]]},
  {on:1, then:'skip', cond:[]}
];

var RESULTS = ['H','D','A','skip'];
var COLS = ['A','B','C','D','E','F','|A-C|','|D-F|','D-F','F-D','A-C','C-A','E-D'];
var OPS = ['>','>=','<','<='];

var data = [];
var running = false;
var startTime = 0;

/* ========== 解析 ========== */
function parseData(text){
  var rows = [];
  var lines = text.split('\n');
  for(var i = 0; i < lines.length; i++){
    var p = lines[i].trim().split(/\s+/);
    if(p.length < 8) continue;
    var v = p.slice(0,6).map(Number);
    var r = p[7];
    if(v.some(isNaN)) continue;
    if(['H','D','A'].indexOf(r) === -1) continue;
    rows.push({A:v[0],B:v[1],C:v[2],D:v[3],E:v[4],F:v[5],result:r});
  }
  return rows;
}

function getVal(row, col){
  switch(col){
    case 'A': return row.A; case 'B': return row.B; case 'C': return row.C;
    case 'D': return row.D; case 'E': return row.E; case 'F': return row.F;
    case '|A-C|': return Math.abs(row.A - row.C);
    case '|D-F|': return Math.abs(row.D - row.F);
    case 'D-F': return row.D - row.F;
    case 'F-D': return row.F - row.D;
    case 'A-C': return row.A - row.C;
    case 'C-A': return row.C - row.A;
    case 'E-D': return row.E - row.D;
  }
  return 0;
}

function cmp(a, op, b){
  if(op === '>') return a > b;
  if(op === '>=') return a >= b;
  if(op === '<') return a < b;
  if(op === '<=') return a <= b;
  if(op === '==') return a === b;
  if(op === '!=') return a !== b;
  return false;
}

function matchRule(row, rule){
  for(var i = 0; i < rule.cond.length; i++){
    var c = rule.cond[i];
    if(!cmp(getVal(row, c[0]), c[1], c[2])) return false;
  }
  return true;
}

function predict(row, rules){
  for(var i = 0; i < rules.length; i++){
    var r = rules[i];
    if(!r.on) continue;
    if(matchRule(row, r)) return r.then;
  }
  return 'skip';
}

function calcProfit(rows, rules){
  var total = 0;
  for(var i = 0; i < rows.length; i++){
    var r = rows[i];
    var p = predict(r, rules);
    if(p === 'skip') continue;
    if(p === r.result){
      if(p === 'H') total += r.D - 100;
      else if(p === 'D') total += r.E - 100;
      else if(p === 'A') total += r.F - 100;
    } else total -= 100;
  }
  return total;
}

function cloneRules(rules){
  var out = [];
  for(var i = 0; i < rules.length; i++){
    var r = rules[i];
    var c = [];
    for(var j = 0; j < r.cond.length; j++){
      c.push([r.cond[j][0], r.cond[j][1], r.cond[j][2]]);
    }
    out.push({on: r.on, then: r.then, cond: c});
  }
  return out;
}

function ri(min, max){ return min + Math.floor(Math.random() * (max - min + 1)); }

/* ========== Log 函式 ========== */
function logLine(text, cls){
  var logEl = document.getElementById('log');
  logEl.dataset.hasContent = '1';
  if(cls){
    var span = document.createElement('div');
    span.className = 'log-' + cls;
    span.textContent = text;
    logEl.appendChild(span);
  } else {
    var div = document.createElement('div');
    div.textContent = text;
    logEl.appendChild(div);
  }
  logEl.scrollTop = logEl.scrollHeight;
}
function logClear(){
  var logEl = document.getElementById('log');
  logEl.innerHTML = '';
  logEl.dataset.hasContent = '1';
}

function updateStats(gen, best, total){
  document.getElementById('stat-gen').innerHTML = '起點: <b>' + gen + '</b>';
  document.getElementById('stat-best').innerHTML = '最佳: <b>' + best + '</b>';
  var el = ((Date.now() - startTime) / 1000).toFixed(0);
  document.getElementById('stat-time').innerHTML = '時間: <b>' + el + 's</b>';
  var speed = el > 0 ? (total / el).toFixed(0) : '0';
  document.getElementById('stat-speed').innerHTML = '評估/秒: <b>' + speed + '</b>';
}

/* ========== 規則變體生成（用於搜尋） ========== */

/* 1. 給規則隨機加一個條件 */
function addRandomCondition(rule){
  var newRule = {on: rule.on, then: rule.then, cond: cloneConds(rule.cond)};
  var col = COLS[ri(0, COLS.length - 1)];
  var op = OPS[ri(0, OPS.length - 1)];
  // 隨機數值：根據欄位合理範圍
  var val = 0;
  if(col === 'A' || col === 'B' || col === 'C') val = ri(20, 80);
  else if(col === 'D' || col === 'E' || col === 'F') val = ri(100, 800);
  else if(col === '|A-C|') val = ri(2, 50);
  else if(col === '|D-F|') val = ri(10, 200);
  else val = ri(-100, 100);
  newRule.cond.push([col, op, val]);
  return newRule;
}

/* 2. 從規則移除一個條件 */
function removeRandomCondition(rule){
  if(rule.cond.length <= 1) return null;
  var newRule = {on: rule.on, then: rule.then, cond: cloneConds(rule.cond)};
  var idx = ri(0, newRule.cond.length - 1);
  newRule.cond.splice(idx, 1);
  return newRule;
}

function cloneConds(cond){
  var out = [];
  for(var i = 0; i < cond.length; i++){
    out.push([cond[i][0], cond[i][1], cond[i][2]]);
  }
  return out;
}

/* ========== 座標下降：對單條規則做系統化掃描 ========== */
function optimizeOneRule(rows, rules, ruleIdx){
  var base = cloneRules(rules);
  var baseProfit = calcProfit(rows, base);
  var best = base;
  var bestProfit = baseProfit;
  var improvements = [];

  // 1. 嘗試所有 then
  for(var ti = 0; ti < RESULTS.length; ti++){
    var then = RESULTS[ti];
    if(base[ruleIdx].then === then) continue;
    var test = cloneRules(base);
    test[ruleIdx].then = then;
    var p = calcProfit(rows, test);
    if(p > bestProfit){
      improvements.push('  → R' + (ruleIdx+1) + ' 結果 ' + best[ruleIdx].then + '→' + then + ' 盈利 ' + p);
      best = test; bestProfit = p;
    }
  }

  // 2. 嘗試 on/off
  {
    var test2 = cloneRules(best);
    test2[ruleIdx].on = best[ruleIdx].on ? 0 : 1;
    var p2 = calcProfit(rows, test2);
    if(p2 > bestProfit){
      improvements.push('  → R' + (ruleIdx+1) + ' 切換 ' + (best[ruleIdx].on ? 'ON→OFF' : 'OFF→ON') + ' 盈利 ' + p2);
      best = test2; bestProfit = p2;
    }
  }

  // 3. 嘗試移除某條件
  if(best[ruleIdx].cond.length > 1){
    for(var rci = 0; rci < best[ruleIdx].cond.length; rci++){
      var test4 = cloneRules(best);
      test4[ruleIdx].cond.splice(rci, 1);
      var p4 = calcProfit(rows, test4);
      if(p4 > bestProfit){
        improvements.push('  → R' + (ruleIdx+1) + ' 移除條件 ' + best[ruleIdx].cond[rci].join('') + ' 盈利 ' + p4);
        best = test4; bestProfit = p4;
        break;
      }
    }
  }

  // 4. 掃描每個條件的閾值
  var condCount = best[ruleIdx].cond.length;
  for(var ci = 0; ci < condCount; ci++){
    var c = best[ruleIdx].cond[ci];
    var curVal = c[2];
    var step = 1, window = 20;
    if(Math.abs(curVal) >= 50){ step = 1; window = 30; }
    if(Math.abs(curVal) >= 100){ step = 2; window = 50; }
    if(Math.abs(curVal) >= 300){ step = 5; window = 100; }
    if(Math.abs(curVal) >= 700){ step = 10; window = 150; }

    var bestV = curVal;
    var bestVP = bestProfit;
    for(var v = curVal - window; v <= curVal + window; v += step){
      if(v < 0 && curVal >= 0) continue;
      var test3 = cloneRules(best);
      test3[ruleIdx].cond[ci][2] = v;
      var p3 = calcProfit(rows, test3);
      if(p3 > bestVP){ bestV = v; bestVP = p3; }
    }
    if(bestV !== curVal){
      improvements.push('  → R' + (ruleIdx+1) + ' 閾值 ' + c[0] + c[1] + ' ' + curVal + '→' + bestV + ' 盈利 ' + bestVP);
      best[ruleIdx].cond[ci][2] = bestV;
      bestProfit = bestVP;
    }
  }

  return {rules: best, profit: bestProfit, improvements: improvements};
}

function coordinateDescent(rows, startRules, logDetail){
  var cur = cloneRules(startRules);
  var curProfit = calcProfit(rows, cur);
  var improved = true;
  var totalIter = 0;
  var totalImprovements = 0;

  while(improved && running){
    improved = false;
    for(var i = 0; i < cur.length; i++){
      if(!running) return {rules: cur, profit: curProfit, iter: totalIter};
      var res = optimizeOneRule(rows, cur, i);
      totalIter++;
      if(res.profit > curProfit){
        if(logDetail && res.improvements.length > 0){
          for(var k = 0; k < res.improvements.length; k++){
            logLine(res.improvements[k], 'dim');
            totalImprovements++;
          }
        }
        cur = res.rules;
        curProfit = res.profit;
        improved = true;
      }
    }
  }
  return {rules: cur, profit: curProfit, iter: totalIter, improvements: totalImprovements};
}

/* ========== 進階結構搜尋 ========== */
function structureSearch(rows, startRules){
  var cur = cloneRules(startRules);
  var curProfit = calcProfit(rows, cur);
  var bestProfit = curProfit;
  var bestRules = cloneRules(cur);
  var attempts = 0;
  var successes = 0;

  // 嘗試 100 次結構變異（加條件、刪條件、增規則、刪規則）
  while(running && attempts < 200){
    attempts++;
    var test = cloneRules(cur);
    var p = Math.random();

    if(p < 0.30){
      // 加條件
      var idx = ri(0, test.length - 1);
      test[idx] = addRandomCondition(test[idx]);
    } else if(p < 0.50){
      // 移除條件
      var idx2 = ri(0, test.length - 1);
      var newR = removeRandomCondition(test[idx2]);
      if(newR) test[idx2] = newR;
      else continue;
    } else if(p < 0.65){
      // 刪除規則
      if(test.length > 5){
        var minIdx = Math.min(3, test.length - 1);
        test.splice(ri(minIdx, test.length - 1), 1);
      } else continue;
    } else if(p < 0.80){
      // 複製規則（分裂）
      var srcIdx = ri(0, test.length - 1);
      var copy = {on: test[srcIdx].on, then: test[srcIdx].then, cond: cloneConds(test[srcIdx].cond)};
      // 加一個隨機條件到複製
      copy = addRandomCondition(copy);
      // 插到原規則後面
      test.splice(srcIdx + 1, 0, copy);
      if(test.length > 80) continue; // 防止爆掉
    } else if(p < 0.92){
      // 交換順序
      if(test.length >= 2){
        var i2 = ri(0, test.length - 2);
        var tmp = test[i2]; test[i2] = test[i2+1]; test[i2+1] = tmp;
      }
    } else {
      // 改隨機規則的結果
      var idx3 = ri(0, test.length - 1);
      var opts = RESULTS.filter(function(x){ return x !== test[idx3].then; });
      test[idx3].then = opts[ri(0, opts.length - 1)];
    }

    var newProfit = calcProfit(rows, test);
    if(newProfit > curProfit){
      cur = test;
      curProfit = newProfit;
      successes++;
      if(newProfit > bestProfit){
        bestProfit = newProfit;
        bestRules = cloneRules(test);
        logLine('  ★ 結構改進（第 ' + attempts + ' 次嘗試）：盈利 ' + bestProfit + '  規則數 ' + test.length, 'success');
      }
    }
  }

  return {rules: bestRules, profit: bestProfit, attempts: attempts, successes: successes};
}

/* ========== 隨機起點 ========== */
function randomRestart(nMut){
  var r = cloneRules(INIT_RULES);
  for(var k = 0; k < nMut; k++){
    var p = Math.random();
    if(p < 0.4){
      var idx = ri(0, r.length - 1);
      if(r[idx].cond.length === 0) continue;
      var ci = ri(0, r[idx].cond.length - 1);
      var v = r[idx].cond[ci][2];
      var step = 1;
      if(Math.abs(v) >= 50) step = 2;
      if(Math.abs(v) >= 100) step = 5;
      if(Math.abs(v) >= 300) step = 10;
      if(Math.abs(v) >= 700) step = 20;
      var delta = ri(-10, 10) * step;
      r[idx].cond[ci][2] = Math.max(0, v + delta);
    } else if(p < 0.55){
      var idx2 = ri(0, r.length - 1);
      var opts = RESULTS.filter(function(x){ return x !== r[idx2].then; });
      r[idx2].then = opts[ri(0, opts.length - 1)];
    } else if(p < 0.70){
      var idx3 = ri(0, r.length - 1);
      r[idx3].on = r[idx3].on ? 0 : 1;
    } else if(p < 0.80){
      var i2 = ri(0, r.length - 2);
      var tmp = r[i2]; r[i2] = r[i2+1]; r[i2+1] = tmp;
    } else if(p < 0.88){
      if(r.length > 5){
        var minIdx = Math.min(3, r.length - 1);
        r.splice(ri(minIdx, r.length - 1), 1);
      }
    } else if(p < 0.94){
      // 加條件
      var idx4 = ri(0, r.length - 1);
      r[idx4] = addRandomCondition(r[idx4]);
    } else {
      // 分裂規則
      var srcIdx = ri(0, r.length - 1);
      var copy = {on: r[srcIdx].on, then: r[srcIdx].then, cond: cloneConds(r[srcIdx].cond)};
      copy = addRandomCondition(copy);
      r.splice(srcIdx + 1, 0, copy);
    }
  }
  return r;
}

/* ========== 診斷 ========== */
function diagnose(rows, rules){
  var stats = [];
  for(var i = 0; i < rules.length; i++){
    stats.push({idx: i, rule: rules[i], hit: 0, correct: 0, wrong: 0, profit: 0});
  }
  for(var i = 0; i < rows.length; i++){
    var row = rows[i];
    var p = 'skip';
    var hitRule = -1;
    for(var j = 0; j < rules.length; j++){
      if(!rules[j].on) continue;
      if(matchRule(row, rules[j])){ p = rules[j].then; hitRule = j; break; }
    }
    if(p === 'skip' || hitRule === -1) continue;
    var s = stats[hitRule];
    s.hit++;
    var gp;
    if(p === row.result){
      s.correct++;
      if(p === 'H') gp = row.D - 100;
      else if(p === 'D') gp = row.E - 100;
      else gp = row.F - 100;
    } else {
      s.wrong++;
      gp = -100;
    }
    s.profit += gp;
  }
  return stats;
}

function renderRuleTable(stats){
  var html = '<table><thead><tr>' +
    '<th>' + t('thRule') + '</th>' +
    '<th>' + t('thOn') + '</th>' +
    '<th>' + t('thCond') + '</th>' +
    '<th>' + t('thThen') + '</th>' +
    '<th>' + t('thHit') + '</th>' +
    '<th>' + t('thCorrect') + '</th>' +
    '<th>' + t('thWrong') + '</th>' +
    '<th>' + t('thProfit') + '</th>' +
    '</tr></thead><tbody>';

  for(var i = 0; i < stats.length; i++){
    var s = stats[i];
    var r = s.rule;
    var condStr = r.cond.map(function(c){ return c[0] + c[1] + c[2]; }).join(' & ');
    if(!condStr) condStr = '—';
    if(condStr.length > 80) condStr = condStr.slice(0, 77) + '...';
    var pcls = s.profit > 0 ? 'profit-pos' : (s.profit < 0 ? 'profit-neg' : '');
    var onTag = r.on ? '<span class="tag-ok">ON</span>' : '<span class="tag-off">OFF</span>';
    var thenTag = '<span class="tag-pred">' + r.then + '</span>';

    html += '<tr>' +
      '<td>R' + (i+1) + '</td>' +
      '<td>' + onTag + '</td>' +
      '<td style="text-align:left;font-size:10px">' + condStr + '</td>' +
      '<td>' + thenTag + '</td>' +
      '<td>' + s.hit + '</td>' +
      '<td>' + s.correct + '</td>' +
      '<td>' + s.wrong + '</td>' +
      '<td class="' + pcls + '">' + s.profit + '</td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('ruleTable').innerHTML = html;
}

/* ========== 生成公式 ========== */
function sheetOp(op){
  if(op === '!=') return '<>';
  if(op === '==') return '=';
  return op;
}

function buildCond(c){
  var col = c[0], op = c[1], val = c[2];
  var sop = sheetOp(op);
  switch(col){
    case 'A': return '(A2:A' + sop + val + ')';
    case 'B': return '(B2:B' + sop + val + ')';
    case 'C': return '(C2:C' + sop + val + ')';
    case 'D': return '(D2:D' + sop + val + ')';
    case 'E': return '(E2:E' + sop + val + ')';
    case 'F': return '(F2:F' + sop + val + ')';
    case '|A-C|': return '(ABS(A2:A-C2:C)' + sop + val + ')';
    case '|D-F|': return '(ABS(D2:D-F2:F)' + sop + val + ')';
    case 'D-F': return '((D2:D-F2:F)' + sop + val + ')';
    case 'F-D': return '((F2:F-D2:D)' + sop + val + ')';
    case 'A-C': return '((A2:A-C2:C)' + sop + val + ')';
    case 'C-A': return '((C2:C-A2:A)' + sop + val + ')';
    case 'E-D': return '((E2:E-D2:D)' + sop + val + ')';
    default: return 'FALSE';
  }
}

function buildCondExpr(rule){
  if(rule.cond.length === 0) return 'TRUE';
  var parts = [];
  for(var i = 0; i < rule.cond.length; i++){
    parts.push(buildCond(rule.cond[i]));
  }
  return parts.join('*');
}

function genFormula(rules){
  var active = [];
  for(var i = 0; i < rules.length; i++){
    if(rules[i].on) active.push(rules[i]);
  }
  if(active.length === 0){
    return '=ARRAYFORMULA(IF(A2:A="","","skip"))';
  }
  var body = '';
  for(var i = 0; i < active.length; i++){
    body += 'IF(' + buildCondExpr(active[i]) + ',"' + active[i].then + '",';
  }
  body += '"skip"';
  for(var j = 0; j < active.length; j++) body += ')';
  return '=ARRAYFORMULA(IF((A2:A="")+(B2:B="")+(C2:C="")+(D2:D="")+(E2:E="")+(F2:F=""),"",' + body + '))';
}

/* ========== 主流程 ========== */
function start(){
  data = parseData(document.getElementById('input').value);
  if(data.length === 0){ alert(t('noData')); return; }

  running = true;
  startTime = Date.now();
  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('diag').style.display = 'none';
  document.getElementById('best').style.display = 'none';
  document.getElementById('liveStats').style.display = 'flex';
  document.getElementById('progbar').style.width = '0%';

  logClear();
  logLine('═══════════════════════════════════', 'head');
  logLine('🧬 智慧規則優化器 v13 啟動', 'head');
  logLine('═══════════════════════════════════', 'head');

  var N = parseInt(document.getElementById('strength').value);
  var globalBest = null;
  var globalProfit = -Infinity;
  var totalEvals = 0;

  logLine('資料筆數：' + data.length);
  logLine('搜尋起點數：' + (N + 1));
  logLine('初始規則數：' + INIT_RULES.length);
  logLine('');

  var phase = 0;

  function nextPhase(){
    if(!running){ finish(); return; }

    if(phase === 0){
      logLine('── 階段 1：初始規則座標下降 ──', 'info');
      var baseP = calcProfit(data, INIT_RULES);
      logLine('  初始盈利：' + baseP, 'dim');
      var r0 = coordinateDescent(data, INIT_RULES, true);
      globalBest = r0.rules;
      globalProfit = r0.profit;
      logLine('  ✓ 收斂：' + r0.iter + ' 次掃描，' + r0.improvements + ' 次改進', 'success');
      logLine('  盈利：' + baseP + ' → ' + r0.profit, 'success');
      logLine('');
      updateStats(0, globalProfit, totalEvals);
      phase = 1;
      document.getElementById('progbar').style.width = (1 / (N + 1) * 100).toFixed(1) + '%';
      setTimeout(nextPhase, 0);
      return;
    }

    var k = phase;
    if(k > N){ finish(); return; }

    // 每 10 個起點做一次結構搜尋
    if(k % 10 === 0 && k > 0){
      logLine('── 階段 ' + (phase + 1) + '：結構搜尋（加/刪條件、加/刪規則） ──', 'info');
      var sres = structureSearch(data, globalBest);
      if(sres.profit > globalProfit){
        globalProfit = sres.profit;
        globalBest = sres.rules;
        logLine('  ✓ 結構搜尋成功：' + sres.attempts + ' 次嘗試，' + sres.successes + ' 次改進', 'success');
        logLine('  新盈利：' + globalProfit, 'success');
        updateStats(phase - 1, globalProfit, totalEvals);
      } else {
        logLine('  ✗ 結構搜尋無改進（嘗試 ' + sres.attempts + ' 次）', 'warn');
      }
      logLine('');
    }

    var nMut = 3 + ri(0, 15);
    var startRules = randomRestart(nMut);
    logLine('▶ 起點 #' + k + '：變異 ' + nMut + ' 次後開始座標下降...', 'info');

    var r = coordinateDescent(data, startRules, false);
    totalEvals += r.iter;

    if(r.profit > globalProfit){
      var diff = r.profit - globalProfit;
      globalProfit = r.profit;
      globalBest = r.rules;
      logLine('  ★★ 新全局最優：' + globalProfit + ' (Δ+' + diff + ')', 'success');
      logLine('  規則數：' + r.rules.length + '，掃描：' + r.iter + ' 次', 'dim');
    } else {
      logLine('  ✗ 收斂於 ' + r.profit + '（低於最優 ' + globalProfit + '）', 'dim');
    }

    updateStats(k, globalProfit, totalEvals);
    document.getElementById('progbar').style.width = ((k + 1) / (N + 1) * 100).toFixed(1) + '%';

    phase++;
    setTimeout(nextPhase, 0);
  }

  function finish(){
    var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    logLine('');
    logLine('═══════════════════════════════════', 'head');
    logLine('🏆 完成！最高盈利：' + globalProfit, 'success');
    logLine('   總耗時：' + elapsed + ' 秒');
    logLine('   總掃描：' + totalEvals + ' 次');
    logLine('   最終規則數：' + globalBest.length);
    logLine('═══════════════════════════════════', 'head');

    var formula = genFormula(globalBest);

    document.getElementById('best').style.display = 'block';
    document.getElementById('summary').innerHTML = '🏆 最高盈利: <b>' + globalProfit + '</b>　(' + data.length + ' 場)';
    document.getElementById('params').textContent = JSON.stringify(globalBest);
    document.getElementById('txtOut').value = formula;

    var stats = diagnose(data, globalBest);
    renderRuleTable(stats);
    document.getElementById('diag').style.display = 'block';

    running = false;
    document.getElementById('btnRun').disabled = false;
    document.getElementById('btnStop').disabled = true;
    document.getElementById('progbar').style.width = '100%';
    updateStats(phase - 1, globalProfit, totalEvals);
  }

  nextPhase();
}

function stop(){
  running = false;
  document.getElementById('btnStop').disabled = true;
  logLine('⏹ 使用者手動停止', 'warn');
}

function copyIt(id){
  var el = document.getElementById(id);
  if(!el) return;
  var txt = el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      showMsg('✅ 已複製 ' + txt.length + ' 字元', true);
    }).catch(function(){ fallbackCopy(txt); });
  } else {
    fallbackCopy(txt);
  }
}

function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg('✅ 已複製 ' + text.length + ' 字元', true);
  else showMsg('❌ 複製失敗，請手動選取', false);
}

function showMsg(text, ok){
  var m = document.getElementById('msg');
  m.textContent = text;
  m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  setTimeout(function(){ m.style.display = 'none'; }, 3000);
}

(function(){
  document.getElementById('log').textContent = '等待開始...';
})();
</script>
