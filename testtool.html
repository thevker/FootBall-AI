  }
};
var LANG = 'zh';
function t(k){ return (TXT[LANG] && TXT[LANG][k]) || k; }
function tf(k, vars){
  var s = t(k);
  if(vars) for(var kk in vars) s = s.split('{'+kk+'}').join(vars[kk]);
  return s;
}
function setLang(lang){

  document.getElementById('btn-en').className = 'lang-btn' + (lang==='en'?' active':'');

/* ========== 初始規則（從你公式結構化） ========== */
// 每條規則: {on, then, cond: [[col, op, val], ...]}
// col: A B C D E F |A-C| |D-F| D-F F-D A-C C-A
// op: > >= < <= == !=
var INIT_RULES = [
  {on:1, then:'D', cond:[['B','>=',32],['|A-C|','<=',6]]},
  {on:1, then:'H', cond:[['A','>=',60],['C','<=',11],['D','>=',140],['D','<=',190],['F','>=',400],['F','<=',480]]},
  {on:1, then:'D', cond:[['|A-C|','<=',3],['E','<',380],['|D-F|','<',40]]},
  {on:1, then:'D', cond:[['A','>=',45],['C','<=',20],['|D-F|','<',70],['D','<',400]]},
  {on:1, then:'D', cond:[['|D-F|','<',18]]},
  {on:1, then:'D', cond:[['A','>=',42],['D','>=',155],['D','<',205],['D-F','!=',0],['F-D','>',0],['|A-C|','>=',50]]},
  {on:1, then:'H', cond:[['A','>=',42],['D','>=',155],['D','<',205],['D-F','!=',0]]},
  {on:1, then:'D', cond:[['A','>=',34],['D','>',205],['D','<=',235],['D-F','!=',0]]},
  {on:1, then:'D', cond:[['D','>=',400],['A','>=',42]]},
  {on:1, then:'D', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0],['F','<',200],['|A-C|','<=',5]]},
  {on:1, then:'A', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0],['F','<',200]]},
  {on:1, then:'D', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0]]},
  {on:1, then:'D', cond:[['E','<=',315],['B','>=',27],['|A-C|','<=',25],['D','>=',250],['D','<=',350],['E-D','>',0]]},
  {on:1, then:'D', cond:[['C-A','>',0],['F','>=',490],['F','<=',560],['D','<',200]]},
  {on:1, then:'H', cond:[['C-A','>',0],['F-D','>',0],['F','<',550],['E','>',320]]},
  {on:1, then:'A', cond:[['C-A','>',0],['F','>=',184],['F','<=',216],['C','>=',40]]},
  {on:1, then:'D', cond:[['C-A','>',0],['F-D','>',0],['F','<',300],['C','<',45],['D','<',250]]},
  {on:1, then:'A', cond:[['D-F','>',0],['F','<=',150],['C','>=',65]]},
  {on:1, then:'A', cond:[['D-F','>',0],['D','>',1500],['C','>=',50]]},
  {on:1, then:'D', cond:[['D-F','>',0],['D','>',1500],['A-C','>',0]]},
  {on:1, then:'skip', cond:[['D-F','>',0],['D','>',1500]]},
  {on:1, then:'D', cond:[['D-F','>',0],['A','>=',33],['D','>=',350]]},
  {on:1, then:'H', cond:[['D-F','>',0]]},
  {on:1, then:'H', cond:[['F-D','>',0],['A','>=',50],['F-D','>=',400]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['A','>=',80]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['C-A','>',0]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['A','<',45]]},
  {on:1, then:'skip', cond:[['F-D','>',0],['F','>=',700]]},
  {on:1, then:'D', cond:[['F-D','>',0],['E','>=',470],['F','>=',500]]},
  {on:1, then:'H', cond:[['F-D','>',0],['A','>=',47],['D','<=',140]]},
  {on:1, then:'A', cond:[['F-D','>',0]]},
  {on:1, then:'H', cond:[['A-C','>',0]]},
  {on:1, then:'A', cond:[['C-A','>',0]]},
  {on:1, then:'skip', cond:[]}
];

var RESULTS = ['H','D','A','skip'];

/* ========== 全域 ========== */
var data = [];
var running = false;
var lastRules = null;
var lastStats = null;

/* ========== 解析 ========== */
function parseData(text){
  var rows = [];
  var lines = text.split('\n');
  for(var i = 0; i < lines.length; i++){
    var p = lines[i].trim().split(/\s+/);
    if(p.length < 8) continue;
    var v = p.slice(0,6).map(Number);
    var r = p[7];
    if(v.some(isNaN)) continue;
    if(['H','D','A'].indexOf(r) === -1) continue;
    rows.push({A:v[0],B:v[1],C:v[2],D:v[3],E:v[4],F:v[5],result:r});
  }
  return rows;
}

/* ========== 取得欄位值 ========== */
function getVal(row, col){
  switch(col){
    case 'A': return row.A;
    case 'B': return row.B;
    case 'C': return row.C;
    case 'D': return row.D;
    case 'E': return row.E;
    case 'F': return row.F;
    case '|A-C|': return Math.abs(row.A - row.C);
    case '|D-F|': return Math.abs(row.D - row.F);
    case 'D-F': return row.D - row.F;
    case 'F-D': return row.F - row.D;
    case 'A-C': return row.A - row.C;
    case 'C-A': return row.C - row.A;
    case 'E-D': return row.E - row.D;
    case 'D-E': return row.D - row.E;
  }
  return 0;
}

function cmp(a, op, b){
  switch(op){
    case '>': return a > b;
    case '>=': return a >= b;
    case '<': return a < b;
    case '<=': return a <= b;
    case '==': return a === b;
    case '!=': return a !== b;
  }
  return false;
}

/* ========== 評估單條規則 ========== */
function matchRule(row, rule){
  for(var i = 0; i < rule.cond.length; i++){
    var c = rule.cond[i];
    if(!cmp(getVal(row, c[0]), c[1], c[2])) return false;
  }
  return true;
}

/* ========== 預測 ========== */
function predict(row, rules){
  for(var i = 0; i < rules.length; i++){
    var r = rules[i];
    if(!r.on) continue;
    if(matchRule(row, r)) return r.then;
  }
  return 'skip';
}

/* ========== 盈利 ========== */
function calcProfit(rows, rules){
  var total = 0;
  for(var i = 0; i < rows.length; i++){
    var r = rows[i];
    var p = predict(r, rules);
    if(p === 'skip') continue;
    if(p === r.result){
      if(p === 'H') total += r.D - 100;
      else if(p === 'D') total += r.E - 100;
      else if(p === 'A') total += r.F - 100;
    } else total -= 100;
  }
  return total;
}

/* ========== 複製 ========== */
function cloneRules(rules){
  return rules.map(function(r){
    return {
      on: r.on,
      then: r.then,
      cond: r.cond.map(function(c){ return [c[0], c[1], c[2]]; })
    };
  });
}

/* ========== 隨機整數 ========== */
function ri(min, max){ return min + Math.floor(Math.random() * (max - min + 1)); }

/* ========== 變異：調整門檻 ========== */
function mutateNumeric(rules, intensity){
  var r = cloneRules(rules);
  var nMut = ri(1, 3);
  for(var k = 0; k < nMut; k++){
    var idx = ri(0, r.length - 1);
    var rule = r[idx];
    if(rule.cond.length === 0) continue;
    var ci = ri(0, rule.cond.length - 1);
    var c = rule.cond[ci];
    var v = c[2];
    // 步長取決於絕對值大小
    var step = 1;
    if(Math.abs(v) >= 100) step = 5;
    if(Math.abs(v) >= 300) step = 10;
    if(Math.abs(v) >= 700) step = 20;
    step = step * intensity;
    var delta = ri(-step, step);
    c[2] = v + delta;
    // 不允許負值（除了 0 附近的比較）
    if(c[2] < 0 && v >= 0) c[2] = 0;
  }
  return {rules: r, structural: 0};
}

/* ========== 變異：切換結果標籤 ========== */
function mutateResult(rules){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules: r, structural: 1};
  var idx = ri(0, r.length - 1);
  var old = r[idx].then;
  var options = RESULTS.filter(function(x){ return x !== old; });
  r[idx].then = options[ri(0, options.length - 1)];
  return {rules: r, structural: 1};
}

/* ========== 變異：切換啟用 ========== */
function mutateOn(rules){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules: r, structural: 1};
  var idx = ri(0, r.length - 1);
  r[idx].on = r[idx].on ? 0 : 1;
  return {rules: r, structural: 1};
}

/* ========== 變異：刪除規則 ========== */
function mutateDelete(rules){
  var r = cloneRules(rules);
  if(r.length <= 5) return {rules: r, structural: 1};
  // 刪除靠後的規則（避免刪掉核心規則）
  var minIdx = Math.min(3, r.length - 1);
  var idx = ri(minIdx, r.length - 1);
  r.splice(idx, 1);
  return {rules: r, structural: 1};
}

/* ========== 變異：交換規則順序 ========== */
function mutateSwap(rules){
  var r = cloneRules(rules);
  if(r.length < 2) return {rules: r, structural: 1};
  var i = ri(0, r.length - 2);
  var tmp = r[i]; r[i] = r[i+1]; r[i+1] = tmp;
  return {rules: r, structural: 1};
}

/* ========== 隨機變異 ========== */
function mutate(rules, intensity){
  var p = Math.random();
  if(p < 0.60){
    // 調整門檻（最常用）
    return mutateNumeric(rules, intensity);
  } else if(p < 0.72){
    return mutateResult(rules);
  } else if(p < 0.82){
    return mutateOn(rules);
  } else if(p < 0.90){
    return mutateSwap(rules);
  } else if(p < 0.96){
    return mutateDelete(rules);
  } else {
    // 一次做多種變異
    var step1 = mutateNumeric(rules, intensity);
    var step2 = mutateResult(step1.rules);
    return {rules: step2.rules, structural: 1};
  }
}

/* ========== 爬山（調門檻 + 結構） ========== */
function hillClimb(rows, startRules, maxIter){
  var cur = cloneRules(startRules);
  var curProfit = calcProfit(rows, cur);
  var best = cloneRules(cur);
  var bestProfit = curProfit;
  var structuralCount = 0;
  var iter = 0;
  var noImprove = 0;

  while(running && iter < maxIter){
    iter++;
    var inten = 1;
    if(noImprove > 200) inten = 2;
    if(noImprove > 500) inten = 3;

    var m = mutate(cur, inten);
    var cand = m.rules;
    var candProfit = calcProfit(rows, cand);

    if(candProfit >= curProfit){
      cur = cand;
      curProfit = candProfit;
      noImprove = 0;
      if(m.structural) structuralCount++;
      if(candProfit > bestProfit){
        best = cloneRules(cand);
        bestProfit = candProfit;
      }
    } else {
      noImprove++;
      // 退火：小機率接受較差解
      var T = 50 / (1 + iter / 200);
      if(Math.random() < Math.exp((candProfit - curProfit) / T)){
        cur = cand;
        curProfit = candProfit;
      }
    }

    // 每 5000 次回一次起點，避免卡死
    if(iter % 5000 === 0 && noImprove > 1000){
      cur = cloneRules(best);
      curProfit = bestProfit;
      noImprove = 0;
    }
  }

  return {rules: best, profit: bestProfit, structural: structuralCount, iter: iter};
}

/* ========== 診斷統計 ========== */
function diagnose(rows, rules){
  var stats = [];
  for(var i = 0; i < rules.length; i++){
    stats.push({idx: i, rule: rules[i], hit: 0, correct: 0, wrong: 0, profit: 0});
  }
  for(var i = 0; i < rows.length; i++){
    var row = rows[i];
    var p = 'skip';
    var hitRule = -1;
    for(var j = 0; j < rules.length; j++){
      if(!rules[j].on) continue;
      if(matchRule(row, rules[j])){ p = rules[j].then; hitRule = j; break; }
    }
    if(p === 'skip' || hitRule === -1) continue;
    var s = stats[hitRule];
    s.hit++;
    var gp;
    if(p === row.result){
      s.correct++;
      if(p === 'H') gp = row.D - 100;
      else if(p === 'D') gp = row.E - 100;
      else gp = row.F - 100;
    } else {
      s.wrong++;
      gp = -100;
    }
    s.profit += gp;
  }
  return stats;
}

/* ========== 渲染規則表 ========== */
function renderRuleTable(stats){
  var html = '<table><thead><tr>' +
    '<th>' + t('thRule') + '</th>' +
    '<th>' + t('thOn') + '</th>' +
    '<th>' + t('thCond') + '</th>' +
    '<th>' + t('thThen') + '</th>' +
    '<th>' + t('thHit') + '</th>' +
    '<th>' + t('thCorrect') + '</th>' +
    '<th>' + t('thWrong') + '</th>' +
    '<th>' + t('thProfit') + '</th>' +
    '</tr></thead><tbody>';

  for(var i = 0; i < stats.length; i++){
    var s = stats[i];
    var r = s.rule;
    var condStr = r.cond.map(function(c){ return c[0] + c[1] + c[2]; }).join(' & ');
    if(!condStr) condStr = '—';
    var pcls = s.profit > 0 ? 'profit-pos' : (s.profit < 0 ? 'profit-neg' : '');
    var onTag = r.on ? '<span class="tag-ok">ON</span>' : '<span class="tag-off">OFF</span>';
    var thenTag = '<span class="tag-pred">' + r.then + '</span>';

    html += '<tr>' +
      '<td>R' + (i+1) + '</td>' +
      '<td>' + onTag + '</td>' +
      '<td style="text-align:left;font-size:11px">' + condStr + '</td>' +
      '<td>' + thenTag + '</td>' +
      '<td>' + s.hit + '</td>' +
      '<td>' + s.correct + '</td>' +
      '<td>' + s.wrong + '</td>' +
      '<td class="' + pcls + '">' + s.profit + '</td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('ruleTable').innerHTML = html;
}

/* ========== 生成公式 ========== */
function genFormula(rules){
  var active = rules.filter(function(r){ return r.on; });
  if(active.length === 0){
    return '=ARRAYFORMULA(IF(A2:A="","","skip"))';
  }

  function condExpr(r){
    if(r.cond.length === 0) return 'TRUE';
    var parts = [];
    for(var i = 0; i < r.cond.length; i++){
      var c = r.cond[i];
      var col = c[0], op = c[1], val = c[2];
      var arrCol;
      switch(col){
        case 'A': arrCol = 'A2:A'; break;
        case 'B': arrCol = 'B2:B'; break;
        case 'C': arrCol = 'C2:C'; break;
        case 'D': arrCol = 'D2:D'; break;
        case 'E': arrCol = 'E2:E'; break;
        case 'F': arrCol = 'F2:F'; break;
        case '|A-C|': parts.push('(ABS(A2:A-C2:C)' + op + val + ')'); continue;
        case '|D-F|': parts.push('(ABS(D2:D-F2:F)' + op + val + ')'); continue;
        case 'D-F': parts.push('(D2:D-F2:F' + op + val + ')'); continue;
        case 'F-D': parts.push('(F2:F-D2:D' + op + val + ')'); continue;
        case 'A-C': parts.push('(A2:A-C2:C' + op + val + ')'); continue;
        case 'C-A': parts.push('(C2:C-A2:A' + op + val + ')'); continue;
        case 'E-D': parts.push('(E2:E-D2:D' + op + val + ')'); continue;
        case 'D-E': parts.push('(D2:D-E2:E' + op + val + ')'); continue;
        default: parts.push('FALSE'); continue;
      }
      if(op === '==' || op === '!='){
        parts.push('(' + arrCol + (op === '==' ? '=' : '<>') + val + ')');
      } else {
        parts.push('(' + arrCol + op + val + ')');
      }
    }
    return parts.join('*');
  }

  var body = '';
  for(var i = 0; i < active.length; i++){
    body += 'IF(' + condExpr(active[i]) + ',"' + active[i].then + '",';
  }
  body += '"skip"';
  // 補齊 IF 的 )
  for(var j = 0; j < active.length; j++) body += ')';

  return '=ARRAYFORMULA(IF((A2:A="")+(B2:B="")+(C2:C="")+(D2:D="")+(E2:E="")+(F2:F=""),"",' + body + '))';
}

/* ========== 主流程 ========== */
function start(){
  data = parseData(document.getElementById('input').value);
  if(data.length === 0){ alert(t('noData')); return; }

  running = true;
  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnStop').disabled = false;
  var log = document.getElementById('log');
  log.dataset.hasContent = '1';
  document.getElementById('diag').style.display = 'none';

  log.textContent = tf('loaded', {n: data.length}) + '\n';

  var N = parseInt(document.getElementById('strength').value);
  var globalBest = cloneRules(INIT_RULES);
  var globalProfit = calcProfit(data, globalBest);
  var totalStructural = 0;
  log.textContent += tf('baseline', {v: globalProfit}) + '\n';

  var gen = 0;
  var t0 = Date.now();

  function nextGen(){
    if(!running){ finish(); return; }
    gen++;
    if(gen > N){ finish(); return; }

    // 每代：從目前最佳出發，做較短爬山
    var r = hillClimb(data, globalBest, 2000);
    totalStructural += r.structural;

    if(r.profit > globalProfit){
      globalProfit = r.profit;
      globalBest = r.rules;
      log.textContent += tf('gen', {g: gen, v: globalProfit, m: totalStructural}) + '\n';
      log.scrollTop = log.scrollHeight;
    } else {
      // 沒進步 → 從初始規則隨機變異重新開始
      var restart = cloneRules(INIT_RULES);
      for(var k = 0; k < 5; k++){
        var m = mutate(restart, 1);
        restart = m.rules;
      }
      var rr = hillClimb(data, restart, 2000);
      if(rr.profit > globalProfit){
        globalProfit = rr.profit;
        globalBest = rr.rules;
        log.textContent += tf('gen', {g: gen, v: globalProfit, m: totalStructural}) + '\n';
      }
    }

    var el = ((Date.now() - t0) / 1000).toFixed(0);
    document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
    setTimeout(nextGen, 0);
  }

  function finish(){
    log.textContent += '\n' + tf('done', {v: globalProfit}) + '\n';

    var formula = genFormula(globalBest);

    document.getElementById('best').style.display = 'block';
    document.getElementById('summary').innerHTML = tf('summary', {v: '<b>' + globalProfit + '</b>', n: data.length});
    document.getElementById('params').textContent = JSON.stringify(globalBest);
    document.getElementById('txtOut').value = formula;

    var stats = diagnose(data, globalBest);
    lastRules = globalBest;
    lastStats = stats;
    renderRuleTable(stats);
    document.getElementById('diag').style.display = 'block';

    running = false;
    document.getElementById('btnRun').disabled = false;
    document.getElementById('btnStop').disabled = true;
  }

  nextGen();
}

function stop(){
  running = false;
  document.getElementById('btnStop').disabled = true;
}

function copyIt(id, label){
  var el = document.getElementById(id);
  if(!el) return;
  var txt = el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      showMsg('✅ Copied ' + txt.length + ' chars', true);
    }).catch(function(){ fallbackCopy(txt); });
  } else {
    fallbackCopy(txt);
  }
}

function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg('✅ Copied ' + text.length + ' chars', true);
  else showMsg('❌ Copy failed, select manually', false);
}

function showMsg(text, ok){
  var m = document.getElementById('msg');
  m.textContent = text;
  m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  setTimeout(function(){ m.style.display = 'none'; }, 3000);
}

/* 初始化 */
(function(){
  document.getElementById('log').textContent = '等待開始...';
})();
