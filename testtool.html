function T(key){
  return (I18N[LANG] && I18N[LANG][key]) || key;
}

function TF(key, vars){
  let s = T(key);
  if(vars){
    for(const k in vars){

    }
  }
  return s;
}

function hexToStr(h){
  const s = h.replace(/\s+/g, '');
  let r = '';
  for(let i = 0; i < s.length; i += 2){
    r += String.fromCharCode(parseInt(s.substr(i, 2), 16));
  }
  return r;
}
function strToHex(t){
  const arr = [];
  for(let i = 0; i < t.length; i++){
    arr.push(t.charCodeAt(i).toString(16).toUpperCase().padStart(2, '0'));
  }
  return arr.join(' ');
}

  df3: {d:40, min:30, max:60, s:2},
  a4:  {d:45, min:40, max:52, s:1},
  df4: {d:70, min:50, max:90, s:2},
  df5: {d:18, min:12, max:25, s:1},
  ac6: {d:50, min:40, max:65, s:1},
  a8:  {d:34, min:30, max:42, s:1},
  d8b: {d:235,min:220,max:250,s:2},
  a92: {d:38, min:34, max:44, s:1},
  f92: {d:250,min:220,max:290,s:5},
  e10: {d:315,min:280,max:360,s:5},
  b10: {d:27, min:22, max:34, s:1},
  f11a:{d:490,min:450,max:530,s:5},
  f11b:{d:560,min:520,max:620,s:5},
  f13a:{d:184,min:170,max:200,s:2},
  f13b:{d:216,min:200,max:240,s:2},
  gap: {d:400,min:250,max:600,s:10},
  f700:{d:700,min:600,max:850,s:10},
  e470:{d:470,min:400,max:550,s:10},
  a47: {d:47, min:40, max:60, s:1}
};
const KEYS = Object.keys(P_DEF);
function defaultP(){ const P={}; for(const k in P_DEF) P[k]=P_DEF[k].d; return P; }

let data = [];
let running = false;
let lastDiag = null;

function parseData(text){
  const rows = [];
  for(const line of text.split('\n')){
    const p = line.trim().split(/\s+/);
    if(p.length < 8) continue;
    const v = p.slice(0,6).map(Number);
    const result = p[7];
    if(v.some(isNaN)) continue;
    if(!['H','D','A'].includes(result)) continue;
    rows.push({A:v[0],B:v[1],C:v[2],D:v[3],E:v[4],F:v[5],result});
  }
  return rows;
}

function predictWithRule(r, P){
  const {A,B,C,D,E,F} = r;
  if(B >= P.b1 && Math.abs(A-C) <= P.ac1) return {result:'D', rule:'R1'};
  if(A >= P.a2 && C <= 11 && D >= 140 && D <= 190 && F >= P.f2a && F <= P.f2b) return {result:'H', rule:'R2'};
  if(Math.abs(A-C) <= P.ac3 && E < P.e3 && Math.abs(D-F) < P.df3) return {result:'D', rule:'R3'};
  if(A >= P.a4 && C <= 20 && Math.abs(D-F) < P.df4 && D < 400) return {result:'D', rule:'R4'};
  if(Math.abs(D-F) < P.df5) return {result:'D', rule:'R5'};
  if(A >= 42 && D >= 155 && D < 205 && D !== F && F > D && Math.abs(A-C) >= P.ac6) return {result:'D', rule:'R6'};
  if(A >= 42 && D >= 155 && D < 205 && D !== F) return {result:'H', rule:'R7'};
  if(A >= P.a8 && D > 205 && D <= P.d8b && D !== F) return {result:'D', rule:'R8'};
  if(D >= 400 && A >= 42) return {result:'D', rule:'R9'};
  if(D >= 340 && A >= P.a92 && F < P.f92 && D > F){
    if(F < 200) return Math.abs(A-C) <= 5 ? {result:'D', rule:'R10'} : {result:'A', rule:'R10'};
    return {result:'D', rule:'R10'};
  }
  if(E <= P.e10 && B >= P.b10 && Math.abs(A-C) <= 25 && D >= 250 && D <= 350 && D < E) return {result:'D', rule:'R11'};
  if(C > A && F >= P.f11a && F <= P.f11b && D < 200) return {result:'D', rule:'R12'};
  if(C > A && F > D && F < 550 && E > 320) return {result:'H', rule:'R13'};
  if(C > A && F >= P.f13a && F <= P.f13b && C >= 40) return {result:'A', rule:'R14'};
  if(C > A && F > D && F < 300 && C < 45 && D < 250) return {result:'D', rule:'R15'};
  if(D > F){
    if(F <= 150 && C >= 65) return {result:'A', rule:'R16a'};
    if(D > 1500){
      if(C >= 50) return {result:'A', rule:'R16b'};
      if(A > C) return {result:'D', rule:'R16b'};
      return {result:'skip', rule:'R16b'};
    }
    if(A >= 33 && D >= 350) return {result:'D', rule:'R16c'};
    return {result:'H', rule:'R16d'};
  }
  if(F > D){
    if(A >= 50 && (F-D) >= P.gap) return {result:'H', rule:'R17a'};
    if(F >= P.f700){
      if(A >= 80) return {result:'D', rule:'R17b'};
      if(C > A) return {result:'D', rule:'R17b'};
      if(A < 45) return {result:'D', rule:'R17b'};
      return {result:'skip', rule:'R17b'};
    }
    if(E >= P.e470 && F >= 500) return {result:'D', rule:'R17c'};
    if(A >= P.a47 && D <= 140) return {result:'H', rule:'R17d'};
    return {result:'A', rule:'R17e'};
  }
  if(A > C) return {result:'H', rule:'R18'};
  if(C > A) return {result:'A', rule:'R19'};
  return {result:'skip', rule:'R20'};
}

function predict(r, P){
  return predictWithRule(r, P).result;
}

function profit(rows, P){
  let total = 0;
  for(let i = 0; i < rows.length; i++){
    const r = rows[i];
    const p = predict(r, P);
    if(p === 'skip') continue;
    if(p === r.result){
      if(p === 'H') total += r.D - 100;
      else if(p === 'D') total += r.E - 100;
      else if(p === 'A') total += r.F - 100;
    } else total -= 100;
  }
  return total;
}

function descend(rows, P0){
  const P = {...P0};
  let best = profit(rows, P);
  let improved = true;
  while(improved && running){
    improved = false;
    for(const k of KEYS){
      if(!running) return {P, profit: best};
      const def = P_DEF[k];
      const orig = P[k];
      let bestVal = orig, bestScore = best;
      for(let v = def.min; v <= def.max; v += def.s){
        if(v === orig) continue;
        P[k] = v;
        const s = profit(rows, P);
        if(s > bestScore){ bestScore = s; bestVal = v; }
      }
      if(def.s > 1){
        const lo = Math.max(def.min, bestVal - def.s + 1);
        const hi = Math.min(def.max, bestVal + def.s - 1);
        for(let v = lo; v <= hi; v++){
          if(v === orig || v === bestVal) continue;
          P[k] = v;
          const s = profit(rows, P);
          if(s > bestScore){ bestScore = s; bestVal = v; }
        }
      }
      P[k] = bestVal;
      if(bestScore > best){ best = bestScore; improved = true; }
    }
  }
  return {P, profit: best};
}

function randomStart(n){
  const P = defaultP();
  const sh = [...KEYS].sort(() => Math.random() - 0.5);
  for(let i = 0; i < n && i < sh.length; i++){
    const k = sh[i], def = P_DEF[k];
    const steps = Math.round((def.max - def.min) / def.s);
    P[k] = def.min + Math.floor(Math.random() * (steps + 1)) * def.s;
  }
  return P;
}

function genText(P){
  return TEMPLATE.replace(/\{(\w+)\}/g, (m, k) => P[k] !== undefined ? P[k] : m);
}
function genHex(P){
  return strToHex(genText(P));
}

/* ==========================================================
   ⭐ 公式檢查：A2:A 對，A2:D 錯
   ========================================================== */
function checkFormula(formula){
  const errors = [];
  if(!formula || !formula.trim()){
    return {ok:false, errors:[T('check-empty')]};
  }
  // 找所有 X2:Y 型引用
  const re = /([A-F])2:([A-F])/g;
  let m;
  let count = 0;
  while((m = re.exec(formula)) !== null){
    count++;
    if(m[1] !== m[2]){
      errors.push(TF('check-range', {
        n: count,
        bad: m[1] + '2:' + m[2],
        good: m[1] + '2:' + m[1]
      }));
    }
  }
  return {ok: errors.length === 0, errors};
}

function renderCheck(formula){
  const r = checkFormula(formula);
  const el = document.getElementById('checkResult');
  if(r.ok){
    el.innerHTML = '<div class="check-ok">' + T('check-ok') + '</div>';
  } else {
    let html = '<div class="check-err">' + T('check-err') + '<ul>';
    for(const e of r.errors) html += '<li>' + e + '</li>';
    html += '</ul></div>';
    el.innerHTML = html;
  }
  return r.ok;
}

/* ==========================================================
   診斷
   ========================================================== */
function diagnose(rows, P){
  const stats = {};
  const skips = {H:0, D:0, A:0, total:0};
  const worst = [];

  for(let i = 0; i < rows.length; i++){
    const r = rows[i];
    const res = predictWithRule(r, P);
    const rule = res.rule;
    const p = res.result;

    if(p === 'skip'){
      skips[r.result] = (skips[r.result] || 0) + 1;
      skips.total++;
      continue;
    }

    if(!stats[rule]){
      stats[rule] = {rule, hit:0, correct:0, wrong:0, profit:0};
    }
    stats[rule].hit++;

    let gameProfit = 0;
    if(p === r.result){
      stats[rule].correct++;
      if(p === 'H') gameProfit = r.D - 100;
      else if(p === 'D') gameProfit = r.E - 100;
      else if(p === 'A') gameProfit = r.F - 100;
    } else {
      stats[rule].wrong++;
      gameProfit = -100;
      worst.push({
        idx: i, rule, pred: p, actual: r.result,
        A: r.A, B: r.B, C: r.C, D: r.D, E: r.E, F: r.F,
        profit: gameProfit
      });
    }
    stats[rule].profit += gameProfit;
  }

  return {stats, skips, worst};
}

function renderDiag(diagResult){
  lastDiag = diagResult;

  // ===== 規則表 =====
  const rules = Object.values(diagResult.stats).sort((a,b) => a.profit - b.profit);

  let html = '<table><thead><tr>' +
    '<th>' + T('th-rule') + '</th>' +
    '<th>' + T('th-hit') + '</th>' +
    '<th>' + T('th-correct') + '</th>' +
    '<th>' + T('th-wrong') + '</th>' +
    '<th>' + T('th-rate') + '</th>' +
    '<th>' + T('th-profit') + '</th>' +
    '<th>' + T('th-verdict') + '</th>' +
    '</tr></thead><tbody>';

  for(const r of rules){
    const rate = r.hit > 0 ? (r.correct / r.hit * 100).toFixed(1) + '%' : '-';
    const pcls = r.profit > 0 ? 'profit-pos' : (r.profit < 0 ? 'profit-neg' : 'profit-zero');
    let tag = '';
    if(r.profit < -500 && r.hit >= 5) tag = '<span class="tag-del">' + T('tag-del') + '</span>';
    else if(r.profit < 0) tag = '<span class="tag-low">' + T('tag-low') + '</span>';
    else if(r.profit > 0 && r.hit >= 5) tag = '<span class="tag-ok">' + T('tag-ok') + '</span>';

    html += '<tr>' +
      '<td><b>' + r.rule + '</b></td>' +
      '<td>' + r.hit + '</td>' +
      '<td>' + r.correct + '</td>' +
      '<td>' + r.wrong + '</td>' +
      '<td>' + rate + '</td>' +
      '<td class="' + pcls + '">' + r.profit + '</td>' +
      '<td>' + tag + '</td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('ruleTable').innerHTML = html;

  // ===== Skip =====
  const sk = diagResult.skips;
  const total = sk.total || 1;
  let skHtml = '<table><thead><tr>' +
    '<th>' + T('th-result') + '</th>' +
    '<th>' + T('th-count') + '</th>' +
    '<th>' + T('th-pct') + '</th>' +
    '</tr></thead><tbody>';
  skHtml += '<tr><td>' + T('r-H') + '</td><td>' + (sk.H||0) + '</td><td>' + ((sk.H||0)/total*100).toFixed(1) + '%</td></tr>';
  skHtml += '<tr><td>' + T('r-D') + '</td><td>' + (sk.D||0) + '</td><td>' + ((sk.D||0)/total*100).toFixed(1) + '%</td></tr>';
  skHtml += '<tr><td>' + T('r-A') + '</td><td>' + (sk.A||0) + '</td><td>' + ((sk.A||0)/total*100).toFixed(1) + '%</td></tr>';
  skHtml += '<tr><td><b>' + T('r-total') + '</b></td><td><b>' + sk.total + '</b></td><td>-</td></tr>';
  skHtml += '</tbody></table>';
  document.getElementById('skipStats').innerHTML = skHtml;

  // ===== 最亏 top 20 =====
  diagResult.worst.sort((a,b) => a.profit - b.profit);
  const top20 = diagResult.worst.slice(0, 20);
  let wHtml = '<table><thead><tr>' +
    '<th>' + T('th-idx') + '</th>' +
    '<th>' + T('th-rule') + '</th>' +
    '<th>' + T('th-pred') + '</th>' +
    '<th>' + T('th-actual') + '</th>' +
    '<th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th>' +
    '<th>' + T('th-loss') + '</th>' +
    '</tr></thead><tbody>';
  for(const w of top20){
    wHtml += '<tr>' +
      '<td>' + (w.idx+1) + '</td>' +
      '<td>' + w.rule + '</td>' +
      '<td>' + w.pred + '</td>' +
      '<td>' + w.actual + '</td>' +
      '<td>' + w.A + '</td>' +
      '<td>' + w.B + '</td>' +
      '<td>' + w.C + '</td>' +
      '<td>' + w.D + '</td>' +
      '<td>' + w.E + '</td>' +
      '<td>' + w.F + '</td>' +
      '<td class="profit-neg">' + w.profit + '</td>' +
      '</tr>';
  }
  wHtml += '</tbody></table>';
  document.getElementById('worstTable').innerHTML = wHtml;

  // ===== 建议 =====
  const sug = [];
  const badRules = rules.filter(r => r.profit < 0 && r.hit >= 3);
  if(badRules.length){
    sug.push('<b>' + T('sug-del') + '</b>');
    for(const r of badRules){
      sug.push(TF('sug-hit-neg', {r: r.rule, n: r.hit, p: r.profit}));
    }
  }
  if(sk.total > 0){
    const maxResult = ['H','D','A'].reduce((a,b) => (sk[a]||0) > (sk[b]||0) ? a : b);
    sug.push(TF('sug-skip', {r: T('r-'+maxResult), n: (sk[maxResult]||0)}));
  }
  const highProfit = rules.filter(r => r.profit > 0).sort((a,b) => b.profit - a.profit).slice(0, 3);
  if(highProfit.length){
    sug.push('<b>' + T('sug-top') + '</b>');
    for(const r of highProfit){
      sug.push(TF('sug-hit', {r: r.rule, n: r.hit, p: r.profit}));
    }
  }
  document.getElementById('suggestions').innerHTML = sug.join('<br>');
}

/* ==========================================================
   主流程
   ========================================================== */
async function start(){
  data = parseData(document.getElementById('input').value);
  if(data.length === 0){ alert(T('no-data')); return; }

  running = true;
  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnStop').disabled = false;
  const log = document.getElementById('log');
  const bestEl = document.getElementById('best');
  document.getElementById('diag').style.display = 'none';
  document.getElementById('checkResult').innerHTML = '';

  log.textContent = TF('log-loaded', {n: data.length}) + '\n';

  let best = defaultP();
  let bestProfit = profit(data, best);
  log.textContent += TF('log-baseline', {v: bestProfit}) + '\n';

  let r = descend(data, best);
  if(r.profit > bestProfit){ bestProfit = r.profit; best = r.P; }
  log.textContent += TF('log-stage1', {v: bestProfit}) + '\n';

  const N = parseInt(document.getElementById('strength').value);
  for(let i = 0; i < N && running; i++){
    r = descend(data, randomStart(4 + Math.floor(Math.random() * 6)));
    if(r.profit > bestProfit){
      bestProfit = r.profit;
      best = r.P;
      log.textContent += TF('log-restart', {i: (i+1), v: bestProfit}) + '\n';
      log.scrollTop = log.scrollHeight;
    }
    if(i % 5 === 0) await new Promise(x => setTimeout(x, 0));
  }

  if(running){
    for(let k = 0; k < 5 && running; k++){
      r = descend(data, best);
      if(r.profit <= bestProfit) break;
      bestProfit = r.profit;
      best = r.P;
      log.textContent += TF('log-polish', {k: (k+1), v: bestProfit}) + '\n';
    }
  }

  log.textContent += '\n' + TF('log-done', {v: bestProfit}) + '\n';

  const newText = genText(best);
  const newHex = genHex(best);

  bestEl.style.display = 'block';
  document.getElementById('summary').innerHTML =
    TF('summary', {v: '<b>' + bestProfit + '</b>', n: data.length});
  document.getElementById('params').textContent = T('params') + JSON.stringify(best);
  document.getElementById('txtOut').value = newText;
  document.getElementById('hexOut').value = newHex;

  // ⭐ 公式檢查
  renderCheck(newText);

  const diag = diagnose(data, best);
  renderDiag(diag);
  document.getElementById('diag').style.display = 'block';

  running = false;
  document.getElementById('btnRun').disabled = false;
  document.getElementById('btnStop').disabled = true;
}

function stop(){
  running = false;
  document.getElementById('btnStop').disabled = true;
}

function showMsg(text, ok){
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  setTimeout(() => { m.style.display = 'none'; }, 3000);
}

function copyIt(id, label){
  const el = document.getElementById(id);
  if(!el) return;
  const txt = el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(() => {
      showMsg(TF('copied', {label, n: txt.length}), true);
    }).catch(() => fallbackCopy(txt, label));
  } else {
    fallbackCopy(txt, label);
  }
}

function fallbackCopy(text, label){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg(TF('copied', {label, n: text.length}), true);
  else showMsg(T('copy-fail'), false);
}
