<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>公式优化器</title>
<style>
body{font-family:sans-serif;padding:20px;max-width:1100px;margin:auto;background:#f5f5f5}
textarea{width:100%;height:180px;font-family:monospace;font-size:12px;padding:8px;box-sizing:border-box}
button{padding:10px 20px;font-size:15px;margin:8px 4px;cursor:pointer;background:#007bff;color:#fff;border:none;border-radius:5px}
button:hover{background:#0056b3}
button.stop{background:#dc3545}
#log{background:#fff;border:1px solid #ccc;padding:12px;margin-top:12px;height:320px;overflow-y:auto;font-family:monospace;font-size:13px;white-space:pre-wrap}
.best{background:#d4edda;padding:12px;border-radius:5px;margin-top:12px;font-size:14px}
table{border-collapse:collapse;margin-top:10px;font-size:13px}
td,th{border:1px solid #ccc;padding:6px 10px;text-align:left}
th{background:#eee}
</style>
</head>
<body>

<h2>📊 公式盈利优化器</h2>
<p>粘贴数据（每行：A B C D E F 比分 实际结果），点击开始搜索。</p>

<textarea id="input" placeholder="32	30	37	237	365	229	1:2	A
45	32	23	147	430	455	2:3	A
..."></textarea>

<div>
  <button id="btnRun" onclick="start()">🚀 开始搜索</button>
  <button id="btnStop" class="stop" onclick="stop()" disabled>⏹ 停止</button>
</div>

<div id="log"></div>
<div class="best" id="best" style="display:none"></div>

<script>
let data = [];
let running = false;

// ========== 解析数据 ==========
function parseData(text) {
  const rows = [];
  for (const line of text.split('\n')) {
    const p = line.trim().split(/\s+/);
    if (p.length < 8) continue;
    const [A,B,C,D,E,F] = p.slice(0,6).map(Number);
    const result = p[7];
    if ([A,B,C,D,E,F].some(isNaN)) continue;
    if (!['H','D','A'].includes(result)) continue;
    rows.push({A,B,C,D,E,F,result});
  }
  return rows;
}

// ========== 核心预测函数（参数化） ==========
// P = 参数对象
function predict(r, P) {
  const {A,B,C,D,E,F} = r;

  // L1: B>=p.b1 且 |A-C|<=p.ac1 -> D
  if (B >= P.b1 && Math.abs(A-C) <= P.ac1) return 'D';

  // L2: A>=60, C<=11, D 140-190, F 400-p.f2 -> H
  if (A >= 60 && C <= 11 && D >= 140 && D <= 190 && F >= 400 && F <= P.f2) return 'H';

  // L3: |A-C|<=3, E<380, |D-F|<40 -> D
  if (Math.abs(A-C) <= 3 && E < 380 && Math.abs(D-F) < 40) return 'D';

  // L4: A>=45, C<=20, |D-F|<70, D<400 -> D
  if (A >= 45 && C <= 20 && Math.abs(D-F) < 70 && D < 400) return 'D';

  // L5: |D-F|<18 -> D
  if (Math.abs(D-F) < 18) return 'D';

  // L6: A>=42, D 155-205, D!=F, F>D, |A-C|>=50 -> D
  if (A >= 42 && D >= 155 && D < 205 && D !== F && F > D && Math.abs(A-C) >= 50) return 'D';

  // L7: A>=42, D 155-205, D!=F -> H
  if (A >= 42 && D >= 155 && D < 205 && D !== F) return 'H';

  // L8: A>=34, D 205-235, D!=F -> D
  if (A >= 34 && D > 205 && D <= 235 && D !== F) return 'D';

  // L9-1: D>=400 且 A>=42 -> D
  if (D >= 400 && A >= 42) return 'D';

  // L9-2: D>=340, A>=38, F<250, D>F -> (F<200, |A-C|<=5 -> D) else A / 其他 D
  if (D >= 340 && A >= 38 && F < 250 && D > F) {
    if (F < 200) return Math.abs(A-C) <= 5 ? 'D' : 'A';
    return 'D';
  }

  // L10: E<=315, B>=27, |A-C|<=25, D 250-350, D<E -> D
  if (E <= 315 && B >= 27 && Math.abs(A-C) <= 25 && D >= 250 && D <= 350 && D < E) return 'D';

  // L11: C>A, F 490-560, D<200 -> D
  if (C > A && F >= 490 && F <= 560 && D < 200) return 'D';

  // L12: C>A, F>D, F<550, E>320 -> H
  if (C > A && F > D && F < 550 && E > 320) return 'H';

  // L13: C>A, F 184-216, C>=40 -> A
  if (C > A && F >= 184 && F <= 216 && C >= 40) return 'A';

  // L14: C>A, F>D, F<300, C<45, D<250 -> D
  if (C > A && F > D && F < 300 && C < 45 && D < 250) return 'D';

  // 兜底层
  if (D > F) {
    if (F <= 150 && C >= 65) return 'A';
    if (D > 1500) {
      if (C >= 50) return 'A';
      if (A > C) return 'D';
      return 'skip';
    }
    if (A >= 33 && D >= 350) return 'D';
    return 'H';
  }
  if (F > D) {
    if (A >= 50 && (F - D) >= P.gap) return 'H';
    if (F >= 700) {
      if (A >= 80) return 'D';
      if (C > A) return 'D';
      if (A < 45) return 'D';
      return 'skip';
    }
    if ((E >= 470) && (F >= 500)) return 'D';
    if (A >= 47 && D <= 140) return 'H';
    return 'A';
  }
  if (A > C) return 'H';
  if (C > A) return 'A';
  return 'skip';
}

// ========== 盈利计算 ==========
function profit(rows, P) {
  let total = 0;
  for (const r of rows) {
    const p = predict(r, P);
    if (p === 'skip') continue;
    const {D,E,F,result} = r;
    if (p === result) {
      if (p === 'H') total += D - 100;
      else if (p === 'D') total += E - 100;
      else if (p === 'A') total += F - 100;
    } else {
      total -= 100;
    }
  }
  return total;
}

// ========== 参数搜索 ==========
function randomP(base) {
  // 在base附近随机扰动
  const P = {...base};
  const keys = Object.keys(P);
  for (const k of keys) {
    const delta = Math.round((Math.random()-0.5) * 4); // -2 ~ +2
    let v = P[k] + delta;
    // 范围约束
    if (k === 'b1') v = Math.max(28, Math.min(36, v));
    if (k === 'ac1') v = Math.max(3, Math.min(9, v));
    if (k === 'f2') v = Math.max(440, Math.min(520, v));
    if (k === 'gap') v = Math.max(200, Math.min(600, v));
    P[k] = v;
  }
  return P;
}

async function start() {
  const text = document.getElementById('input').value;
  data = parseData(text);
  if (data.length === 0) { alert('没有有效数据'); return; }

  running = true;
  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnStop').disabled = false;
  const log = document.getElementById('log');
  log.textContent = `已载入 ${data.length} 条数据\n开始搜索...\n\n`;

  // 初始参数（当前最优）
  let best = {b1:32, ac1:6, f2:480, gap:400};
  let bestProfit = profit(data, best);

  log.textContent += `初始参数: ${JSON.stringify(best)}\n初始盈利: ${bestProfit}\n\n`;

  const iterations = 3000;
  let noImprove = 0;

  for (let i = 0; i < iterations && running; i++) {
    const candidate = randomP(best);
    const p = profit(data, candidate);
    if (p > bestProfit) {
      bestProfit = p;
      best = candidate;
      noImprove = 0;
      log.textContent += `#${i} 新最优 ${p}  ${JSON.stringify(best)}\n`;
      log.scrollTop = log.scrollHeight;
    } else {
      noImprove++;
    }

    // 每100次让出UI
    if (i % 100 === 0) {
      await new Promise(r => setTimeout(r, 0));
      log.textContent += `...进度 ${i}/${iterations}，当前最优 ${bestProfit}\n`;
      log.scrollTop = log.scrollHeight;
    }
  }

  // 输出最终结果
  const el = document.getElementById('best');
  el.style.display = 'block';
  el.innerHTML = `<b>🏆 搜索完成</b><br>
    最优参数: <code>${JSON.stringify(best)}</code><br>
    最高盈利: <b>${bestProfit}</b><br>
    数据场数: ${data.length}`;

  // 打印最优公式
  const formula = buildFormula(best);
  log.textContent += `\n\n===== 最优公式 =====\n${formula}\n`;

  running = false;
  document.getElementById('btnRun').disabled = false;
  document.getElementById('btnStop').disabled = true;
}

function stop() {
  running = false;
  document.getElementById('btnStop').disabled = true;
}

// 生成公式字符串
function buildFormula(P) {
  return `=ARRAYFORMULA(IF((A2:A="")+(B2:B="")+(C2:C="")+(D2:D="")+(E2:E="")+(F2:F=""),"",IF((B2:B>=${P.b1})*(ABS(A2:A-C2:C)<=${P.ac1}),"D",IF((A2:A>=60)*(C2:C<=11)*(D2:D>=140)*(D2:D<=190)*(F2:F>=400)*(F2:F<=${P.f2}),"H",IF((ABS(A2:A-C2:C)<=3)*(E2:E<380)*(ABS(D2:D-F2:F)<40),"D",IF((A2:A>=45)*(C2:C<=20)*(ABS(D2:D-F2:F)<70)*(D2:D<400),"D",IF(ABS(D2:D-F2:F)<18,"D",IF((A2:A>=42)*(D2:D>=155)*(D2:D<205)*(D2:D<>F2:F)*(F2:F>D2:D)*(ABS(A2:A-C2:C)>=50),"D",IF((A2:A>=42)*(D2:D>=155)*(D2:D<205)*(D2:D<>F2:F),"H",IF((A2:A>=34)*(D2:D>205)*(D2:D<=235)*(D2:D<>F2:F),"D",IF((D2:D>=400)*(A2:A>=42),"D",IF((D2:D>=340)*(A2:A>=38)*(F2:F<250)*(D2:D>F2:D),IF(F2:F<200,IF(ABS(A2:A-C2:C)<=5,"D","A"),"D"),IF((E2:E<=315)*(B2:B>=27)*(ABS(A2:A-C2:C)<=25)*(D2:D>=250)*(D2:D<=350)*(D2:D<E2:E),"D",IF((C2:C>A2:A)*(F2:F>=490)*(F2:F<=560)*(D2:D<200),"D",IF((C2:C>A2:A)*(F2:F>D2:D)*(F2:F<550)*(E2:E>320),"H",IF((C2:C>A2:A)*(F2:F>=184)*(F2:F<=216)*(C2:C>=40),"A",IF((C2:C>A2:A)*(F2:F>D2:D)*(F2:F<300)*(C2:C<45)*(D2:D<250),"D",IF(D2:D>F2:F,IF((F2:F<=150)*(C2:C>=65),"A",IF(D2:D>1500,IF(C2:C>=50,"A",IF(A2:A>C2:A,"D","skip")),IF((A2:A>=33)*(D2:D>=350),"D","H"))),IF(F2:F>D2:D,IF((A2:A>=50)*(F2:F-D2:F>=${P.gap}),"H",IF(F2:F>=700,IF(A2:A>=80,"D",IF(C2:C>A2:A,"D",IF(A2:A<45,"D","skip"))),IF((E2:E>=470)*(F2:F>=500),"D",IF((A2:A>=47)*(D2:D<=140),"H","A")))),IF(A2:A>C2:C,"H",IF(C2:C>A2:A,"A","skip"))))))))))))))))))))`;
}
</script>
</body>
</html>
