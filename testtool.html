<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>公式盈利优化器 v5 — HEX版</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;padding:16px;max-width:1200px;margin:auto;background:#f0f2f5}
h2{margin-top:0}
textarea{width:100%;font-family:monospace;font-size:12px;padding:8px;border:1px solid #ccc;border-radius:4px}
#input{height:120px}
button{padding:10px 22px;font-size:15px;margin:6px 4px 6px 0;cursor:pointer;background:#007bff;color:#fff;border:none;border-radius:5px;font-weight:bold}
button:hover{background:#0056b3}
button:disabled{background:#999;cursor:not-allowed}
button.stop{background:#dc3545}
button.hex{background:#6f42c1}
button.hex:hover{background:#5a32a3}
button.txt{background:#28a745}
button.txt:hover{background:#1e7e34}
#log{background:#1e1e1e;color:#d4d4d4;border-radius:5px;padding:12px;margin-top:12px;height:140px;overflow-y:auto;font-family:monospace;font-size:12px;white-space:pre-wrap;line-height:1.5}
.best{background:#d4edda;padding:14px;border-radius:6px;margin-top:12px;border:1px solid #c3e6cb;display:none}
.best b{color:#155724}
.box{background:#fff;padding:10px;border-radius:4px;margin-top:10px;border:1px solid #ddd}
.label{font-weight:bold;font-size:13px;margin-bottom:6px;color:#333}
.out{width:100%;height:140px;font-family:monospace;font-size:11px;padding:8px;border:1px solid #ddd;border-radius:4px;background:#f8f9fa;white-space:pre;overflow:auto;resize:vertical}
.param{font-family:monospace;font-size:12px;word-break:break-all;color:#555;margin-top:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
select{padding:6px;border-radius:4px;border:1px solid #ccc;font-size:14px}
#msg{margin-top:8px;font-weight:bold;font-size:13px;display:none;padding:8px;border-radius:4px}
.ok{background:#d4edda;color:#155724}
.err{background:#f8d7da;color:#721c24}
</style>
</head>
<body>

<h2>⚡ 公式盈利优化器 v5 — HEX版</h2>
<p>贴数据（每行：A B C D E F 比分 结果）。搜索最优门槛，输出新 HEX 和新公式。</p>

<textarea id="input" placeholder="23	27	49	355	385	169	0:3	A
62	27	9	158	395	405	3:0	H"></textarea>

<div class="row">
  <label>强度：
    <select id="strength">
      <option value="10">快速</option>
      <option value="50" selected>标准</option>
      <option value="200">深度</option>
      <option value="1000">疯狂</option>
    </select>
  </label>
  <button id="btnRun" onclick="start()">🚀 开始搜索</button>
  <button id="btnStop" class="stop" onclick="stop()" disabled>⏹ 停止</button>
</div>

<div id="log">等待开始...</div>

<div class="best" id="best">
  <div id="summary"></div>
  <div class="param" id="params"></div>

  <div class="box">
    <div class="label">🟣 HEX（新）</div>
    <button class="hex" onclick="copyIt('hexOut','HEX')">📋 複製 HEX</button>
    <textarea id="hexOut" class="out" readonly wrap="off"></textarea>
  </div>

  <div class="box">
    <div class="label">🟢 公式（新）</div>
    <button class="txt" onclick="copyIt('txtOut','公式')">📋 複製公式</button>
    <textarea id="txtOut" class="out" readonly wrap="off"></textarea>
  </div>

  <div id="msg"></div>
</div>

<script>
'use strict';

/* ==========================================================
   原始公式 HEX（你提供的正確版本）
   ========================================================== */
const HEX_SRC = '3D 41 52 52 41 59 46 4F 52 4D 55 4C 41 28 49 46 28 28 41 32 3A 41 3D 22 22 29 2B 28 42 32 3A 42 3D 22 22 29 2B 28 43 32 3A 43 3D 22 22 29 2B 28 44 32 3A 44 3D 22 22 29 2B 28 45 32 3A 45 3D 22 22 29 2B 28 46 32 3A 46 3D 22 22 29 2C 22 22 2C 49 46 28 28 42 32 3A 42 3E 3D 33 32 29 2A 28 41 42 53 28 41 32 3A 41 2D 43 32 3A 43 29 3C 3D 36 29 2C 22 44 22 2C 49 46 28 28 41 32 3A 41 3E 3D 36 30 29 2A 28 43 32 3A 43 3C 3D 31 31 29 2A 28 44 32 3A 44 3E 3D 31 34 30 29 2A 28 44 32 3A 44 3C 3D 31 39 30 29 2A 28 46 32 3A 46 3E 3D 34 30 30 29 2A 28 46 32 3A 46 3C 3D 34 38 30 29 2C 22 48 22 2C 49 46 28 28 41 42 53 28 41 32 3A 41 2D 43 32 3A 43 29 3C 3D 33 29 2A 28 45 32 3A 45 3C 33 38 30 29 2A 28 41 42 53 28 44 32 3A 44 2D 46 32 3A 46 29 3C 34 30 29 2C 22 44 22 2C 49 46 28 28 41 32 3A 41 3E 3D 34 35 29 2A 28 43 32 3A 43 3C 3D 32 30 29 2A 28 41 42 53 28 44 32 3A 44 2D 46 32 3A 46 29 3C 37 30 29 2A 28 44 32 3A 44 3C 34 30 30 29 2C 22 44 22 2C 49 46 28 41 42 53 28 44 32 3A 44 2D 46 32 3A 46 29 3C 31 38 2C 22 44 22 2C 49 46 28 28 41 32 3A 41 3E 3D 34 32 29 2A 28 44 32 3A 44 3E 3D 31 35 35 29 2A 28 44 32 3A 44 3C 32 30 35 29 2A 28 44 32 3A 44 3C 3E 46 32 3A 46 29 2A 28 46 32 3A 46 3E 44 32 3A 44 29 2A 28 41 42 53 28 41 32 3A 41 2D 43 32 3A 43 29 3E 3D 35 30 29 2C 22 44 22 2C 49 46 28 28 41 32 3A 41 3E 3D 34 32 29 2A 28 44 32 3A 44 3E 3D 31 35 35 29 2A 28 44 32 3A 44 3C 32 30 35 29 2A 28 44 32 3A 44 3C 3E 46 32 3A 46 29 2C 22 48 22 2C 49 46 28 28 41 32 3A 41 3E 3D 33 34 29 2A 28 44 32 3A 44 3E 32 30 35 29 2A 28 44 32 3A 44 3C 3D 32 33 35 29 2A 28 44 32 3A 44 3C 3E 46 32 3A 46 29 2C 22 44 22 2C 49 46 28 28 44 32 3A 44 3E 3D 34 30 30 29 2A 28 41 32 3A 41 3E 3D 34 32 29 2C 22 44 22 2C 49 46 28 28 44 32 3A 44 3E 3D 33 34 30 29 2A 28 41 32 3A 41 3E 3D 33 38 29 2A 28 46 32 3A 46 3C 32 35 30 29 2A 28 44 32 3A 44 3E 46 32 3A 46 29 2C 49 46 28 46 32 3A 46 3C 32 30 30 2C 49 46 28 41 42 53 28 41 32 3A 41 2D 43 32 3A 43 29 3C 3D 35 2C 22 44 22 2C 22 41 22 29 2C 22 44 22 29 2C 49 46 28 28 45 32 3A 45 3C 3D 33 31 35 29 2A 28 42 32 3A 42 3E 3D 32 37 29 2A 28 41 42 53 28 41 32 3A 41 2D 43 32 3A 43 29 3C 3D 32 35 29 2A 28 44 32 3A 44 3E 3D 32 35 30 29 2A 28 44 32 3A 44 3C 3D 33 35 30 29 2A 28 44 32 3A 44 3C 45 32 3A 45 29 2C 22 44 22 2C 49 46 28 28 43 32 3A 43 3E 41 32 3A 41 29 2A 28 46 32 3A 46 3E 3D 34 39 30 29 2A 28 46 32 3A 46 3C 3D 35 36 30 29 2A 28 44 32 3A 44 3C 32 30 30 29 2C 22 44 22 2C 49 46 28 28 43 32 3A 43 3E 41 32 3A 41 29 2A 28 46 32 3A 46 3E 44 32 3A 44 29 2A 28 46 32 3A 46 3C 35 35 30 29 2A 28 45 32 3A 45 3E 33 32 30 29 2C 22 48 22 2C 49 46 28 28 43 32 3A 43 3E 41 32 3A 41 29 2A 28 46 32 3A 46 3E 3D 31 38 34 29 2A 28 46 32 3A 46 3C 3D 32 31 36 29 2A 28 43 32 3A 43 3E 3D 34 30 29 2C 22 41 22 2C 49 46 28 28 43 32 3A 43 3E 41 32 3A 41 29 2A 28 46 32 3A 46 3E 44 32 3A 44 29 2A 28 46 32 3A 46 3C 33 30 30 29 2A 28 43 32 3A 43 3C 34 35 29 2A 28 44 32 3A 44 3C 32 35 30 29 2C 22 44 22 2C 49 46 28 44 32 3A 44 3E 46 32 3A 46 2C 49 46 28 28 46 32 3A 46 3C 3D 31 35 30 29 2A 28 43 32 3A 43 3E 3D 36 35 29 2C 22 41 22 2C 49 46 28 44 32 3A 44 3E 31 35 30 30 2C 49 46 28 43 32 3A 43 3E 3D 35 30 2C 22 41 22 2C 49 46 28 41 32 3A 41 3E 43 32 3A 43 2C 22 44 22 2C 22 73 6B 69 70 22 29 29 2C 49 46 28 28 41 32 3A 41 3E 3D 33 33 29 2A 28 44 32 3A 44 3E 3D 33 35 30 29 2C 22 44 22 2C 22 48 22 29 29 29 2C 49 46 28 46 32 3A 46 3E 44 32 3A 44 2C 49 46 28 28 41 32 3A 41 3E 3D 35 30 29 2A 28 46 32 3A 46 2D 44 32 3A 44 3E 3D 34 30 30 29 2C 22 48 22 2C 49 46 28 46 32 3A 46 3E 3D 37 30 30 2C 49 46 28 41 32 3A 41 3E 3D 38 30 2C 22 44 22 2C 49 46 28 43 32 3A 43 3E 41 32 3A 41 2C 22 44 22 2C 49 46 28 41 32 3A 41 3C 34 35 2C 22 44 22 2C 22 73 6B 69 70 22 29 29 29 2C 49 46 28 28 45 32 3A 45 3E 3D 34 37 30 29 2A 28 46 32 3A 46 3E 3D 35 30 30 29 2C 22 44 22 2C 49 46 28 28 41 32 3A 41 3E 3D 34 37 29 2A 28 44 32 3A 44 3C 3D 31 34 30 29 2C 22 48 22 2C 22 41 22 29 29 29 29 2C 49 46 28 41 32 3A 41 3E 43 32 3A 43 2C 22 48 22 2C 49 46 28 43 32 3A 43 3E 41 32 3A 41 2C 22 41 22 2C 22 73 6B 69 70 22 29 29 29 29 29 29 29 29 29 29 29 29 29 29 29 29 29 29 29 29 29';

/* ==========================================================
   HEX <-> STRING
   ========================================================== */
function hexToStr(h){
  const s = h.replace(/\s+/g, '');
  let r = '';
  for(let i = 0; i < s.length; i += 2){
    r += String.fromCharCode(parseInt(s.substr(i, 2), 16));
  }
  return r;
}
function strToHex(t){
  const arr = [];
  for(let i = 0; i < t.length; i++){
    arr.push(t.charCodeAt(i).toString(16).toUpperCase().padStart(2, '0'));
  }
  return arr.join(' ');
}

const RAW = hexToStr(HEX_SRC);

/* ==========================================================
   门槛替换表（长 → 占位符）
   ========================================================== */
const SUBST = [
  ['B2:B>=32',          'B2:B>={b1}'],
  ['ABS(A2:A-C2:C)<=6', 'ABS(A2:A-C2:C)<={ac1}'],
  ['A2:A>=60',          'A2:A>={a2}'],
  ['F2:F>=400',         'F2:F>={f2a}'],
  ['F2:F<=480',         'F2:F<={f2b}'],
  ['ABS(A2:A-C2:C)<=3', 'ABS(A2:A-C2:C)<={ac3}'],
  ['E2:E<380',          'E2:E<{e3}'],
  ['ABS(D2:D-F2:F)<40', 'ABS(D2:D-F2:F)<{df3}'],
  ['A2:A>=45',          'A2:A>={a4}'],
  ['ABS(D2:D-F2:F)<70', 'ABS(D2:D-F2:F)<{df4}'],
  ['ABS(D2:D-F2:F)<18', 'ABS(D2:D-F2:F)<{df5}'],
  ['ABS(A2:A-C2:C)>=50','ABS(A2:A-C2:C)>={ac6}'],
  ['A2:A>=34',          'A2:A>={a8}'],
  ['D2:D<=235',         'D2:D<={d8b}'],
  ['A2:A>=38',          'A2:A>={a92}'],
  ['F2:F<250',          'F2:F<{f92}'],
  ['E2:E<=315',         'E2:E<={e10}'],
  ['B2:B>=27',          'B2:B>={b10}'],
  ['F2:F>=490',         'F2:F>={f11a}'],
  ['F2:F<=560',         'F2:F<={f11b}'],
  ['F2:F>=184',         'F2:F>={f13a}'],
  ['F2:F<=216',         'F2:F<={f13b}'],
  ['F2:F-D2:D>=400',    'F2:F-D2:D>={gap}'],
  ['F2:F>=700',         'F2:F>={f700}'],
  ['E2:E>=470',         'E2:E>={e470}'],
  ['A2:A>=47',          'A2:A>={a47}']
];

let TEMPLATE = RAW;
for(let i = 0; i < SUBST.length; i++){
  TEMPLATE = TEMPLATE.split(SUBST[i][0]).join(SUBST[i][1]);
}

/* ==========================================================
   参数定义
   ========================================================== */
const P_DEF = {
  b1:  {d:32, min:28, max:36, s:1},
  ac1: {d:6,  min:3,  max:10, s:1},
  a2:  {d:60, min:55, max:68, s:1},
  f2a: {d:400,min:380,max:430,s:5},
  f2b: {d:480,min:440,max:520,s:5},
  ac3: {d:3,  min:2,  max:6,  s:1},
  e3:  {d:380,min:340,max:420,s:5},
  df3: {d:40, min:30, max:60, s:2},
  a4:  {d:45, min:40, max:52, s:1},
  df4: {d:70, min:50, max:90, s:2},
  df5: {d:18, min:12, max:25, s:1},
  ac6: {d:50, min:40, max:65, s:1},
  a8:  {d:34, min:30, max:42, s:1},
  d8b: {d:235,min:220,max:250,s:2},
  a92: {d:38, min:34, max:44, s:1},
  f92: {d:250,min:220,max:290,s:5},
  e10: {d:315,min:280,max:360,s:5},
  b10: {d:27, min:22, max:34, s:1},
  f11a:{d:490,min:450,max:530,s:5},
  f11b:{d:560,min:520,max:620,s:5},
  f13a:{d:184,min:170,max:200,s:2},
  f13b:{d:216,min:200,max:240,s:2},
  gap: {d:400,min:250,max:600,s:10},
  f700:{d:700,min:600,max:850,s:10},
  e470:{d:470,min:400,max:550,s:10},
  a47: {d:47, min:40, max:60, s:1}
};
const KEYS = Object.keys(P_DEF);
function defaultP(){ const P={}; for(const k in P_DEF) P[k]=P_DEF[k].d; return P; }

let data = [];
let running = false;

/* ==========================================================
   数据解析
   ========================================================== */
function parseData(text){
  const rows = [];
  for(const line of text.split('\n')){
    const p = line.trim().split(/\s+/);
    if(p.length < 8) continue;
    const v = p.slice(0,6).map(Number);
    const result = p[7];
    if(v.some(isNaN)) continue;
    if(!['H','D','A'].includes(result)) continue;
    rows.push({A:v[0],B:v[1],C:v[2],D:v[3],E:v[4],F:v[5],result});
  }
  return rows;
}

/* ==========================================================
   预测函数
   ========================================================== */
function predict(r, P){
  const {A,B,C,D,E,F} = r;
  if(B >= P.b1 && Math.abs(A-C) <= P.ac1) return 'D';
  if(A >= P.a2 && C <= 11 && D >= 140 && D <= 190 && F >= P.f2a && F <= P.f2b) return 'H';
  if(Math.abs(A-C) <= P.ac3 && E < P.e3 && Math.abs(D-F) < P.df3) return 'D';
  if(A >= P.a4 && C <= 20 && Math.abs(D-F) < P.df4 && D < 400) return 'D';
  if(Math.abs(D-F) < P.df5) return 'D';
  if(A >= 42 && D >= 155 && D < 205 && D !== F && F > D && Math.abs(A-C) >= P.ac6) return 'D';
  if(A >= 42 && D >= 155 && D < 205 && D !== F) return 'H';
  if(A >= P.a8 && D > 205 && D <= P.d8b && D !== F) return 'D';
  if(D >= 400 && A >= 42) return 'D';
  if(D >= 340 && A >= P.a92 && F < P.f92 && D > F){
    if(F < 200) return Math.abs(A-C) <= 5 ? 'D' : 'A';
    return 'D';
  }
  if(E <= P.e10 && B >= P.b10 && Math.abs(A-C) <= 25 && D >= 250 && D <= 350 && D < E) return 'D';
  if(C > A && F >= P.f11a && F <= P.f11b && D < 200) return 'D';
  if(C > A && F > D && F < 550 && E > 320) return 'H';
  if(C > A && F >= P.f13a && F <= P.f13b && C >= 40) return 'A';
  if(C > A && F > D && F < 300 && C < 45 && D < 250) return 'D';
  if(D > F){
    if(F <= 150 && C >= 65) return 'A';
    if(D > 1500){
      if(C >= 50) return 'A';
      if(A > C) return 'D';
      return 'skip';
    }
    if(A >= 33 && D >= 350) return 'D';
    return 'H';
  }
  if(F > D){
    if(A >= 50 && (F-D) >= P.gap) return 'H';
    if(F >= P.f700){
      if(A >= 80) return 'D';
      if(C > A) return 'D';
      if(A < 45) return 'D';
      return 'skip';
    }
    if(E >= P.e470 && F >= 500) return 'D';
    if(A >= P.a47 && D <= 140) return 'H';
    return 'A';
  }
  if(A > C) return 'H';
  if(C > A) return 'A';
  return 'skip';
}

/* ==========================================================
   盈利
   ========================================================== */
function profit(rows, P){
  let total = 0;
  for(let i = 0; i < rows.length; i++){
    const r = rows[i];
    const p = predict(r, P);
    if(p === 'skip') continue;
    if(p === r.result){
      if(p === 'H') total += r.D - 100;
      else if(p === 'D') total += r.E - 100;
      else if(p === 'A') total += r.F - 100;
    } else total -= 100;
  }
  return total;
}

/* ==========================================================
   坐标下降
   ========================================================== */
function descend(rows, P0){
  const P = {...P0};
  let best = profit(rows, P);
  let improved = true;
  while(improved && running){
    improved = false;
    for(const k of KEYS){
      if(!running) return {P, profit: best};
      const def = P_DEF[k];
      const orig = P[k];
      let bestVal = orig, bestScore = best;
      for(let v = def.min; v <= def.max; v += def.s){
        if(v === orig) continue;
        P[k] = v;
        const s = profit(rows, P);
        if(s > bestScore){ bestScore = s; bestVal = v; }
      }
      if(def.s > 1){
        const lo = Math.max(def.min, bestVal - def.s + 1);
        const hi = Math.min(def.max, bestVal + def.s - 1);
        for(let v = lo; v <= hi; v++){
          if(v === orig || v === bestVal) continue;
          P[k] = v;
          const s = profit(rows, P);
          if(s > bestScore){ bestScore = s; bestVal = v; }
        }
      }
      P[k] = bestVal;
      if(bestScore > best){ best = bestScore; improved = true; }
    }
  }
  return {P, profit: best};
}

function randomStart(n){
  const P = defaultP();
  const sh = [...KEYS].sort(() => Math.random() - 0.5);
  for(let i = 0; i < n && i < sh.length; i++){
    const k = sh[i], def = P_DEF[k];
    const steps = Math.round((def.max - def.min) / def.s);
    P[k] = def.min + Math.floor(Math.random() * (steps + 1)) * def.s;
  }
  return P;
}

/* ==========================================================
   生成新公式 和 新 HEX
   ========================================================== */
function genText(P){
  return TEMPLATE.replace(/\{(\w+)\}/g, (m, k) => P[k] !== undefined ? P[k] : m);
}
function genHex(P){
  return strToHex(genText(P));
}

/* ==========================================================
   主流程
   ========================================================== */
async function start(){
  data = parseData(document.getElementById('input').value);
  if(data.length === 0){ alert('没有有效数据'); return; }

  running = true;
  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnStop').disabled = false;
  const log = document.getElementById('log');
  const bestEl = document.getElementById('best');

  log.textContent = '载入 ' + data.length + ' 条数据\n';

  let best = defaultP();
  let bestProfit = profit(data, best);
  log.textContent += '基准盈利: ' + bestProfit + '\n';

  let r = descend(data, best);
  if(r.profit > bestProfit){ bestProfit = r.profit; best = r.P; }
  log.textContent += '阶段1: ' + bestProfit + '\n';

  const N = parseInt(document.getElementById('strength').value);
  for(let i = 0; i < N && running; i++){
    r = descend(data, randomStart(4 + Math.floor(Math.random() * 6)));
    if(r.profit > bestProfit){
      bestProfit = r.profit;
      best = r.P;
      log.textContent += '★ 重启#' + (i+1) + ' 新最优: ' + bestProfit + '\n';
      log.scrollTop = log.scrollHeight;
    }
    if(i % 5 === 0) await new Promise(x => setTimeout(x, 0));
  }

  if(running){
    for(let k = 0; k < 5 && running; k++){
      r = descend(data, best);
      if(r.profit <= bestProfit) break;
      bestProfit = r.profit;
      best = r.P;
      log.textContent += '打磨第' + (k+1) + '轮: ' + bestProfit + '\n';
    }
  }

  log.textContent += '\n完成！最高盈利: ' + bestProfit + '\n';

  const newText = genText(best);
  const newHex = genHex(best);

  bestEl.style.display = 'block';
  document.getElementById('summary').innerHTML =
    '<b>🏆 最高盈利：' + bestProfit + '</b>（' + data.length + ' 场）';
  document.getElementById('params').textContent = '参数：' + JSON.stringify(best);
  document.getElementById('txtOut').value = newText;
  document.getElementById('hexOut').value = newHex;

  running = false;
  document.getElementById('btnRun').disabled = false;
  document.getElementById('btnStop').disabled = true;
}

function stop(){
  running = false;
  document.getElementById('btnStop').disabled = true;
}

/* ==========================================================
   复制
   ========================================================== */
function showMsg(text, ok){
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  setTimeout(() => { m.style.display = 'none'; }, 3000);
}

function copyIt(id, label){
  const el = document.getElementById(id);
  if(!el) return;
  const txt = el.value;

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(() => {
      showMsg('✅ 已複製 ' + label + '（' + txt.length + ' 字元）', true);
    }).catch(() => fallbackCopy(txt, label));
  } else {
    fallbackCopy(txt, label);
  }
}

function fallbackCopy(text, label){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg('✅ 已複製 ' + label + '（' + text.length + ' 字元）', true);
  else showMsg('❌ 自動複製失敗，請手動選取 → Ctrl+C', false);
}
</script>
