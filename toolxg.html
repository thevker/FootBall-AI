<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xG 全方位預測分析器 (Dark Mode)</title>
    <style>
        /* 全局深色模式設定 */
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }
        .container { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 600px; 
        }
        h2 { text-align: center; color: #ffffff; margin-top: 0; font-size: 22px; }
        p.subtitle { font-size: 13px; color: #aaaaaa; text-align: center; margin-bottom: 20px; }
        
        /* 輸入區 */
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-box { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #bbbbbb; }
        input { 
            width: 100%;
            padding: 10px; 
            background-color: #2d2d2d; 
            border: 1px solid #444; 
            color: #ffffff; 
            border-radius: 6px; 
            font-size: 16px; 
            outline: none; 
            transition: border 0.2s; 
        }
        input:focus { border-color: #4da6ff; }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #3a7bd5; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: background 0.2s; 
        }
        button:hover { background: #2a5fa5; }
        
        /* 結果區 */
        #result { margin-top: 25px; display: none; padding-top: 20px; border-top: 1px solid #333; }
        
        /* 公式展示區 (修復出界問題) */
        .formula-box { 
            background: #332d1a; 
            border: 1px solid #665c33; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            font-size: 13px; 
            color: #e5c07b; 
            line-height: 1.8; 
            word-wrap: break-word; 
            overflow-wrap: break-word;
        }
        .formula-title { font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #ffd700; }

        /* 預測淨勝球區塊 */
        .margin-box { 
            background: #2a2a2a; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            text-align: center; 
            border-left: 5px solid #6c757d; 
        }
        .margin-title { font-size: 14px; font-weight: bold; color: #aaaaaa; }
        .margin-value { font-size: 28px; font-weight: bold; margin: 5px 0; }
        .margin-desc { font-size: 13px; color: #888; }

        /* 勝平負機率 */
        .probs { display: flex; justify-content: space-between; text-align: center; margin-bottom: 20px; gap: 8px; }
        .prob-box { flex: 1; padding: 12px 5px; border-radius: 8px; color: white; }
        .home { background: #218838; }
        .draw { background: #d39e00; color: #222; }
        .away { background: #c82333; }
        .prob-title { font-size: 13px; font-weight: bold; }
        .prob-value { font-size: 22px; font-weight: bold; margin-top: 5px; }

        /* 共用區塊樣式 */
        .section-box { background: #252525; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .section-title { font-size: 14px; font-weight: bold; margin-bottom: 12px; color: #dddddd; border-left: 4px solid #4da6ff; padding-left: 8px; }
        
        /* 數據對比網格 */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
        .stat-item { background: #1e1e1e; padding: 10px; border-radius: 6px; border: 1px solid #333; text-align: center; }
        .stat-label { font-weight: bold; color: #999; margin-bottom: 5px; font-size: 12px; }
        .stat-val { font-size: 18px; font-weight: bold; }
        .stat-sub { font-size: 12px; color: #777; margin-top: 5px; }

        /* 波膽表格 */
        .score-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .score-table th, .score-table td { padding: 8px; text-align: center; border-bottom: 1px solid #333; }
        .score-table th { background: #1e1e1e; color: #999; font-weight: bold; }
        .score-table tr:last-child td { border-bottom: none; }
        .score-val { font-weight: bold; font-size: 16px; color: #fff; }
        .score-pct { color: #ff6b6b; font-weight: bold; }
        
        /* 入球數進度條 */
        .goals-row { display: flex; align-items: center; margin-bottom: 10px; font-size: 13px; }
        .goals-label { width: 70px; font-weight: bold; color: #aaa; }
        .goals-bar-bg { flex: 1; background: #333; height: 14px; border-radius: 7px; overflow: hidden; margin: 0 10px; }
        .goals-bar-fill { height: 100%; background: #17a2b8; border-radius: 7px; transition: width 0.5s ease; }
        .goals-value { width: 50px; text-align: right; font-weight: bold; color: #17a2b8; }

        .conclusion { font-size: 16px; font-weight: bold; text-align: center; color: #4da6ff; padding: 15px; background: #1a2633; border-radius: 8px; margin-top: 15px; border: 1px dashed #4da6ff; word-wrap: break-word; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 xG 全方位預測分析器</h2>
    <p class="subtitle">深色模式 | 自動推算淨勝球、波膽及入球數概率</p>
    
    <div class="input-group">
        <div class="input-box">
            <label>主隊 xG (預期進球)</label>
            <input type="number" id="homeXg" step="0.01" placeholder="例：1.41">
        </div>
        <div class="input-box">
            <label>主隊 xGA (預期失球)</label>
            <input type="number" id="homeXga" step="0.01" placeholder="例：1.29">
        </div>
    </div>

    <div class="input-group">
        <div class="input-box">
            <label>客隊 xG (預期進球)</label>
            <input type="number" id="awayXg" step="0.01" placeholder="例：1.26">
        </div>
        <div class="input-box">
            <label>客隊 xGA (預期失球)</label>
            <input type="number" id="awayXga" step="0.01" placeholder="例：1.67">
        </div>
    </div>

    <button onclick="calculate()">開始分析</button>

    <div id="result">
        
        <!-- 公式展示區 -->
        <div class="formula-box">
            <div class="formula-title">💡 計算公式揭秘：</div>
            主預期進球 = (主 xG + 客 xGA) ÷ 2 = <span id="fHome"></span><br>
            客預期進球 = (客 xG + 主 xGA) ÷ 2 = <span id="fAway"></span><br>
            <strong>預測淨勝球 = 主預期進球 - 客預期進球 = <span id="fMargin" style="color:#ff6b6b;"></span></strong>
        </div>

        <!-- 預測淨勝球 -->
        <div class="margin-box">
            <div class="margin-title">⚔️ 預測全場淨勝球</div>
            <div class="margin-value" id="marginValue">+0.00</div>
            <div class="margin-desc" id="marginDesc">主隊淨勝 / 客隊淨勝</div>
        </div>

        <!-- 勝平負機率 -->
        <div class="probs">
            <div class="prob-box home">
                <div class="prob-title">主勝</div>
                <div class="prob-value" id="homeProb">0%</div>
            </div>
            <div class="prob-box draw">
                <div class="prob-title">和局</div>
                <div class="prob-value" id="drawProb">0%</div>
            </div>
            <div class="prob-box away">
                <div class="prob-title">客勝</div>
                <div class="prob-value" id="awayProb">0%</div>
            </div>
        </div>

        <!-- 球隊風格與 xGD 對比 -->
        <div class="section-box">
            <div class="section-title">🛡️ 球隊風格與整體實力 (基於自身 xG-xGA)</div>
            <div class="stat-grid">
                <div class="stat-item">
                    <div class="stat-label">主隊自身 xGD</div>
                    <div class="stat-val" id="homeXgdVal">0.00</div>
                    <div class="stat-sub" id="homeStyle">加載中...</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">客隊自身 xGD</div>
                    <div class="stat-val" id="awayXgdVal">0.00</div>
                    <div class="stat-sub" id="awayStyle">加載中...</div>
                </div>
            </div>
        </div>

        <!-- 波膽預測 -->
        <div class="section-box">
            <div class="section-title">📋 最有可能波膽 (Top 5)</div>
            <table class="score-table" id="scoreTable">
                <thead>
                    <tr><th>排名</th><th>比分 (主-客)</th><th>出現概率</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- 總入球數預測 -->
        <div class="section-box">
            <div class="section-title">⚽ 全場總入球數概率</div>
            <div id="goalsContainer"></div>
        </div>

        <div class="conclusion" id="conclusion"></div>
    </div>
</div>

<script>
    // 階乘計算
    function factorial(n) {
        if (n === 0 || n === 1) return 1;
        let res = 1;
        for (let i = 2; i <= n; i++) res *= i;
        return res;
    }

    // 泊松分佈機率
    function poisson(k, lambda) {
        return (Math.pow(Math.E, -lambda) * Math.pow(lambda, k)) / factorial(k);
    }

    // 判斷球隊風格
    function getStyleText(xg, xga) {
        const xgd = xg - xga;
        if (xg > 1.6 && xga < 1.0) return "頂級強隊 (攻守兼備)";
        if (xg > 1.6 && xga >= 1.0) return "進攻強勢，防守有隱患";
        if (xg <= 1.6 && xga < 1.0) return "防守穩健，偏向保守";
        if (xgd > 0.3) return "實力佔優，攻守平衡";
        if (xgd < -0.3) return "實力偏弱，防守吃力";
        return "中規中矩，勝負難料";
    }

    function calculate() {
        const hXg = parseFloat(document.getElementById('homeXg').value) || 0;
        const hXga = parseFloat(document.getElementById('homeXga').value) || 0;
        const aXg = parseFloat(document.getElementById('awayXg').value) || 0;
        const aXga = parseFloat(document.getElementById('awayXga').value) || 0;

        // 1. 計算交叉預期進球
        const expHome = (hXg + aXga) / 2;
        const expAway = (aXg + hXga) / 2;
        const predMargin = expHome - expAway;

        // 更新公式顯示區
        document.getElementById('fHome').innerText = `(${hXg} + ${aXga}) ÷ 2 = ${expHome.toFixed(2)}`;
        document.getElementById('fAway').innerText = `(${aXg} + ${hXga}) ÷ 2 = ${expAway.toFixed(2)}`;
        document.getElementById('fMargin').innerText = `${expHome.toFixed(2)} - ${expAway.toFixed(2)} = ${predMargin > 0 ? '+' : ''}${predMargin.toFixed(2)}`;

        // 更新淨勝球區塊
        const marginEl = document.getElementById('marginValue');
        const marginDescEl = document.getElementById('marginDesc');
        if (predMargin > 0) {
            marginEl.innerText = `+${predMargin.toFixed(2)}`;
            marginEl.style.color = "#4ade80"; // 亮綠色
            marginDescEl.innerText = `預計主隊淨勝 ${predMargin.toFixed(2)} 球`;
        } else if (predMargin < 0) {
            marginEl.innerText = `${predMargin.toFixed(2)}`;
            marginEl.style.color = "#f87171"; // 亮紅色
            marginDescEl.innerText = `預計客隊淨勝 ${Math.abs(predMargin).toFixed(2)} 球`;
        } else {
            marginEl.innerText = `0.00`;
            marginEl.style.color = "#aaaaaa";
            marginDescEl.innerText = `預計雙方平手`;
        }

        // 2. 更新自身 xGD 與風格
        const hXgd = hXg - hXga;
        const aXgd = aXg - aXga;
        document.getElementById('homeXgdVal').innerText = (hXgd > 0 ? '+' : '') + hXgd.toFixed(2);
        document.getElementById('homeXgdVal').style.color = hXgd >= 0 ? '#4ade80' : '#f87171';
        document.getElementById('homeStyle').innerText = getStyleText(hXg, hXga);

        document.getElementById('awayXgdVal').innerText = (aXgd > 0 ? '+' : '') + aXgd.toFixed(2);
        document.getElementById('awayXgdVal').style.color = aXgd >= 0 ? '#4ade80' : '#f87171';
        document.getElementById('awayStyle').innerText = getStyleText(aXg, aXga);

        // 3. 泊松分佈計算比分
        let homeWin = 0, draw = 0, awayWin = 0;
        let scores = [];
        let totalGoalsProbs = { '0-1': 0, '2-3': 0, '4+': 0 };
        const maxGoals = 6;

        for (let i = 0; i <= maxGoals; i++) {
            for (let j = 0; j <= maxGoals; j++) {
                const pHome = poisson(i, expHome);
                const pAway = poisson(j, expAway);
                const prob = pHome * pAway; 

                if (i > j) homeWin += prob;
                else if (i === j) draw += prob;
                else awayWin += prob;

                const totalG = i + j;
                if (totalG <= 1) totalGoalsProbs['0-1'] += prob;
                else if (totalG <= 3) totalGoalsProbs['2-3'] += prob;
                else totalGoalsProbs['4+'] += prob;

                scores.push({ score: `${i}-${j}`, prob: prob });
            }
        }

        // 更新勝平負
        document.getElementById('homeProb').innerText = (homeWin * 100).toFixed(1) + '%';
        document.getElementById('drawProb').innerText = (draw * 100).toFixed(1) + '%';
        document.getElementById('awayProb').innerText = (awayWin * 100).toFixed(1) + '%';

        // 波膽 Top 5
        scores.sort((a, b) => b.prob - a.prob);
        const scoreTbody = document.querySelector('#scoreTable tbody');
        scoreTbody.innerHTML = '';
        scores.slice(0, 5).forEach((item, index) => {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td>${index + 1}</td><td class="score-val">${item.score}</td><td class="score-pct">${(item.prob * 100).toFixed(1)}%</td>`;
            scoreTbody.appendChild(tr);
        });

        // 入球數進度條
        const goalsContainer = document.getElementById('goalsContainer');
        goalsContainer.innerHTML = '';
        const goalsLabels = { '0-1': '0 - 1 球', '2-3': '2 - 3 球', '4+': '4 球以上' };
        for (let key in totalGoalsProbs) {
            const probPct = totalGoalsProbs[key] * 100;
            const row = document.createElement('div');
            row.className = 'goals-row';
            row.innerHTML = `
                <div class="goals-label">${goalsLabels[key]}</div>
                <div class="goals-bar-bg"><div class="goals-bar-fill" style="width: ${probPct}%;"></div></div>
                <div class="goals-value">${probPct.toFixed(1)}%</div>
            `;
            goalsContainer.appendChild(row);
        }

        // 結論文字
        let conclusionText = "";
        if (predMargin > 0.8) conclusionText = "🔥 主隊優勢明顯，預計能淨勝一球以上。";
        else if (predMargin > 0.2) conclusionText = "⚖️ 主隊稍佔上風，小勝或和局機會較大。";
        else if (predMargin < -0.8) conclusionText = "🔥 客隊優勢明顯，預計能淨勝一球以上。";
        else if (predMargin < -0.2) conclusionText = "⚖️ 客隊稍佔上風，小勝或和局機會較大。";
        else conclusionText = "🤝 雙方勢均力敵，和局概率極高。";

        document.getElementById('conclusion').innerText = conclusionText;
        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
