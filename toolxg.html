<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xG 賽事分析器 (四維實力判定版)</title>
    <style>
        /* 全局深色模式設定 */
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }
        .container { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 600px; 
        }
        h2 { text-align: center; color: #ffffff; margin-top: 0; font-size: 22px; }
        p.subtitle { font-size: 13px; color: #aaaaaa; text-align: center; margin-bottom: 20px; }
        
        /* 輸入區 */
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-box { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #bbbbbb; }
        input[type="text"] { 
            width: 100%; padding: 10px; background-color: #2d2d2d; border: 1px solid #444; color: #ffffff; border-radius: 6px; font-size: 16px; outline: none; transition: border 0.2s; 
        }
        input[type="text"]:focus { border-color: #4da6ff; }

        /* 按鈕區 */
        button { 
            width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; 
        }
        .btn-calculate { background: #3a7bd5; color: white; margin-top: 5px; }
        .btn-calculate:hover { background: #2a5fa5; }
        .btn-clear { background: #5a2a2a; color: #ff9999; margin-top: 10px; border: 1px solid #7a3a3a; }
        .btn-clear:hover { background: #7a3a3a; color: white; }
        
        /* 結果區 */
        #result { margin-top: 25px; display: none; padding-top: 20px; border-top: 1px solid #333; }
        
        /* 全新判定結果區 */
        .result-box {
            text-align: center; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 2px dashed;
        }
        .result-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .result-value { font-size: 32px; font-weight: bold; }

        /* 球隊評級區塊 */
        .section-box { background: #252525; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .section-title { font-size: 14px; font-weight: bold; margin-bottom: 15px; color: #dddddd; border-left: 4px solid #4da6ff; padding-left: 8px; }
        
        .team-rating-block { margin-bottom: 20px; }
        .team-rating-block:last-child { margin-bottom: 0; }
        
        /* 球隊名稱與風格標籤 */
        .team-name { 
            font-size: 15px; font-weight: bold; color: #4da6ff; margin-bottom: 10px; text-align: center; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .team-style { 
            font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: bold; 
        }
        
        .rating-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 12px; }
        .rating-label { width: 50px; font-weight: bold; color: #aaa; }
        
        /* 橫條背景 */
        .rating-bar-bg { flex: 1; background: #1a1a1a; height: 16px; border-radius: 8px; overflow: hidden; margin: 0 10px; position: relative; border: 1px solid #333; }
        .rating-bar-fill { height: 100%; border-radius: 8px; transition: width 0.5s ease; }
        
        /* 橫條顏色定義 */
        .bar-attack { background: linear-gradient(90deg, #ff8c8c 0%, #ff6b6b 100%); } /* 進攻紅 */
        .bar-defense { background: linear-gradient(90deg, #8cb8ff 0%, #6b9fff 100%); } /* 防守藍 */
        .bar-status { background: linear-gradient(90deg, #ffeb3b 0%, #fbc02d 100%); }  /* 狀態黃 */
        .bar-odds { background: linear-gradient(90deg, #ce93d8 0%, #9c27b0 100%); }    /* 賠率紫 */
        
        /* 評級顯示 */
        .rating-display { width: 70px; text-align: right; font-weight: bold; font-size: 13px; display: flex; justify-content: flex-end; gap: 4px; align-items: center; }
        .rating-grade { font-size: 15px; font-weight: 900; }
        .rating-val { color: #ccc; font-size: 12px; font-weight: normal; }
        
        .overall-row { display: flex; justify-content: space-between; background: #1e1e1e; padding: 10px; border-radius: 6px; margin-top: 15px; border: 1px solid #444; }
        .overall-label { font-weight: bold; color: #ccc; font-size: 13px; }
        .overall-value { font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 xG 賽事分析器</h2>
    <p class="subtitle">深色模式 | 四維實力判定</p>
    
    <!-- 主隊數據 -->
    <div class="input-group">
        <div class="input-box">
            <label>主隊 xG (預期進球)</label>
            <input type="text" id="homeXg" placeholder="例：1.41" oninput="limitInput(this)" onblur="formatInput(this)">
        </div>
        <div class="input-box">
            <label>主隊 xGA (預期失球)</label>
            <input type="text" id="homeXga" placeholder="例：1.29" oninput="limitInput(this)" onblur="formatInput(this)">
        </div>
    </div>
    <div class="input-group">
        <div class="input-box">
            <label>主隊狀態 (0-3)</label>
            <input type="text" id="homeStatus" placeholder="例：2.0" oninput="limitInput(this)" onblur="formatInput(this)">
        </div>
        <div class="input-box">
            <label>主隊賠率 (1-6)</label>
            <input type="text" id="homeOdds" placeholder="例：1.80" oninput="limitInput(this)" onblur="formatInput(this)">
        </div>
    </div>

    <!-- 客隊數據 -->
    <div class="input-group" style="margin-top: 25px;">
        <div class="input-box">
            <label>客隊 xG (預期進球)</label>
            <input type="text" id="awayXg" placeholder="例：1.26" oninput="limitInput(this)" onblur="formatInput(this)">
        </div>
        <div class="input-box">
            <label>客隊 xGA (預期失球)</label>
            <input type="text" id="awayXga" placeholder="例：1.67" oninput="limitInput(this)" onblur="formatInput(this)">
        </div>
    </div>
    <div class="input-group">
        <div class="input-box">
            <label>客隊狀態 (0-3)</label>
            <input type="text" id="awayStatus" placeholder="例：1.5" oninput="limitInput(this)" onblur="formatInput(this)">
        </div>
        <div class="input-box">
            <label>客隊賠率 (1-6)</label>
            <input type="text" id="awayOdds" placeholder="例：3.50" oninput="limitInput(this)" onblur="formatInput(this)">
        </div>
    </div>

    <button class="btn-calculate" onclick="calculate()">開始分析</button>
    <button class="btn-clear" onclick="clearData()">清除數據</button>

    <div id="result">
        
        <!-- 判定結果區 -->
        <div class="result-box" id="matchResultBox">
            <div class="result-title">預測賽果</div>
            <div class="result-value" id="matchResultValue">-</div>
        </div>

        <!-- 球隊四維評級 -->
        <div class="section-box">
            <div class="section-title">📊 球隊四維實力評級</div>
            
            <!-- 主隊 -->
            <div class="team-rating-block">
                <div class="team-name">
                    <span>🏠 主隊</span>
                    <span class="team-style" id="hStyle">-</span>
                </div>
                <div class="rating-row">
                    <div class="rating-label">進攻</div>
                    <div class="rating-bar-bg"><div class="rating-bar-fill bar-attack" id="hAttBar"></div></div>
                    <div class="rating-display"><span class="rating-grade" id="hAttGrade">-</span><span class="rating-val" id="hAttVal">0.00</span></div>
                </div>
                <div class="rating-row">
                    <div class="rating-label">防守</div>
                    <div class="rating-bar-bg"><div class="rating-bar-fill bar-defense" id="hDefBar"></div></div>
                    <div class="rating-display"><span class="rating-grade" id="hDefGrade">-</span><span class="rating-val" id="hDefVal">0.00</span></div>
                </div>
                <div class="rating-row">
                    <div class="rating-label">狀態</div>
                    <div class="rating-bar-bg"><div class="rating-bar-fill bar-status" id="hStatBar"></div></div>
                    <div class="rating-display"><span class="rating-grade" id="hStatGrade">-</span><span class="rating-val" id="hStatVal">0.00</span></div>
                </div>
                <div class="rating-row">
                    <div class="rating-label">賠率</div>
                    <div class="rating-bar-bg"><div class="rating-bar-fill bar-odds" id="hOddsBar"></div></div>
                    <div class="rating-display"><span class="rating-grade" id="hOddsGrade">-</span><span class="rating-val" id="hOddsVal">0.00</span></div>
                </div>
                <div class="overall-row">
                    <span class="overall-label">綜合總實力 (四項平均)</span>
                    <span class="overall-value" id="hOverall">0.00</span>
                </div>
            </div>

            <!-- 客隊 -->
            <div class="team-rating-block">
                <div class="team-name">
                    <span>✈️ 客隊</span>
                    <span class="team-style" id="aStyle">-</span>
                </div>
                <div class="rating-row">
                    <div class="rating-label">進攻</div>
                    <div class="rating-bar-bg"><div class="rating-bar-fill bar-attack" id="aAttBar"></div></div>
                    <div class="rating-display"><span class="rating-grade" id="aAttGrade">-</span><span class="rating-val" id="aAttVal">0.00</span></div>
                </div>
                <div class="rating-row">
                    <div class="rating-label">防守</div>
                    <div class="rating-bar-bg"><div class="rating-bar-fill bar-defense" id="aDefBar"></div></div>
                    <div class="rating-display"><span class="rating-grade" id="aDefGrade">-</span><span class="rating-val" id="aDefVal">0.00</span></div>
                </div>
                <div class="rating-row">
                    <div class="rating-label">狀態</div>
                    <div class="rating-bar-bg"><div class="rating-bar-fill bar-status" id="aStatBar"></div></div>
                    <div class="rating-display"><span class="rating-grade" id="aStatGrade">-</span><span class="rating-val" id="aStatVal">0.00</span></div>
                </div>
                <div class="rating-row">
                    <div class="rating-label">賠率</div>
                    <div class="rating-bar-bg"><div class="rating-bar-fill bar-odds" id="aOddsBar"></div></div>
                    <div class="rating-display"><span class="rating-grade" id="aOddsGrade">-</span><span class="rating-val" id="aOddsVal">0.00</span></div>
                </div>
                <div class="overall-row">
                    <span class="overall-label">綜合總實力 (四項平均)</span>
                    <span class="overall-value" id="aOverall">0.00</span>
                </div>
            </div>

            <div style="font-size: 11px; color: #777; margin-top: 15px; text-align: right;">
                *防守力得分 = 3.0 - xGA<br>
                *狀態橫條：0.0 - 3.0<br>
                *賠率橫條：1.0 (最右) - 6.0 (最左)，數值越低越強
            </div>
        </div>

    </div>
</div>

<script>
    // 輸入限制與格式化
    function limitInput(input) {
        let val = input.value;
        val = val.replace(/[^0-9.]/g, '');
        let parts = val.split('.');
        if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
        let digitCount = val.replace(/\./g, '').length;
        if (digitCount > 3) {
            let newVal = ''; let count = 0;
            for (let char of val) {
                if (char !== '.') { if (count >= 3) break; count++; }
                newVal += char;
            }
            val = newVal;
        }
        input.value = val;
    }

    function formatInput(input) {
        let val = input.value;
        if (!val || val === '.') { input.value = ''; return; }
        if (!val.includes('.')) {
            if (val.length === 3) val = val.substring(0, 1) + '.' + val.substring(1);
            else if (val.length === 2) {
                let num = parseInt(val);
                if (num > 30) val = '0.' + val;
                else val = val.substring(0, 1) + '.' + val.substring(1) + '0';
            } else if (val.length === 1) val = val + '.00';
        } else {
            let parts = val.split('.');
            let integerPart = parts[0] || '0';
            let decimalPart = parts[1] || '';
            decimalPart = decimalPart.padEnd(2, '0').substring(0, 2);
            val = integerPart + '.' + decimalPart;
        }
        let num = parseFloat(val);
        if (isNaN(num)) num = 0;
        input.value = num.toFixed(2);
    }

    function clearData() {
        const ids = ['homeXg', 'homeXga', 'homeStatus', 'homeOdds', 'awayXg', 'awayXga', 'awayStatus', 'awayOdds'];
        ids.forEach(id => document.getElementById(id).value = '');
        document.getElementById('result').style.display = 'none';
    }

    // 取得評級與顏色 (通用)
    function getRatingData(value) {
        let grade = ''; let color = '';
        if (value < 1.0) { grade = 'E'; color = '#c0c0c0'; }
        else if (value < 1.2) { grade = 'D'; color = '#cd7f32'; }
        else if (value < 1.4) { grade = 'C'; color = '#ff4d4d'; }
        else if (value < 1.6) { grade = 'B'; color = '#4ade80'; }
        else if (value < 1.8) { grade = 'A'; color = '#4da6ff'; }
        else if (value < 2.0) { grade = 'S'; color = '#FFD700'; }
        else { grade = 'EX'; color = '#9b59b6'; }
        return { grade, color, value: value.toFixed(2) };
    }

    function getTeamStyle(attValue, defValue) {
        const diff = attValue - defValue;
        if (diff >= 0.5) return "進攻型";
        if (diff <= -0.5) return "防守型";
        return "平衡型";
    }

    // 更新單一球隊的 UI
    function updateTeamUI(prefix, att, def, status, oddsInput, overall) {
        // 1. 進攻
        const attData = getRatingData(att);
        let attPct = ((att - 1.0) / 1.0) * 100;
        attPct = Math.min(Math.max(attPct, 5), 100);
        document.getElementById(prefix + 'AttBar').style.width = attPct + '%';
        document.getElementById(prefix + 'AttGrade').innerText = attData.grade;
        document.getElementById(prefix + 'AttGrade').style.color = attData.color;
        document.getElementById(prefix + 'AttVal').innerText = attData.value;

        // 2. 防守
        const defData = getRatingData(def);
        let defPct = ((def - 1.0) / 1.0) * 100;
        defPct = Math.min(Math.max(defPct, 5), 100);
        document.getElementById(prefix + 'DefBar').style.width = defPct + '%';
        document.getElementById(prefix + 'DefGrade').innerText = defData.grade;
        document.getElementById(prefix + 'DefGrade').style.color = defData.color;
        document.getElementById(prefix + 'DefVal').innerText = defData.value;

        // 3. 狀態 (0-3)
        const statData = getRatingData(status);
        let statPct = (status / 3.0) * 100;
        statPct = Math.min(Math.max(statPct, 5), 100);
        document.getElementById(prefix + 'StatBar').style.width = statPct + '%';
        document.getElementById(prefix + 'StatGrade').innerText = statData.grade;
        document.getElementById(prefix + 'StatGrade').style.color = statData.color;
        document.getElementById(prefix + 'StatVal').innerText = statData.value;

        // 4. 賠率 (1-6)，反向映射：1最強(100%)，6最弱(0%)
        // 為了畫面和諧，把賠率轉換為等效分數 (7 - odds)，這樣 1.0 變 6.0 (EX)，6.0 變 1.0 (E)
        const oddsScore = Math.max(1.0, 7.0 - oddsInput);
        const oddsData = getRatingData(oddsScore);
        let oddsPct = ((oddsInput - 1.0) / 5.0) * 100; // 1是0%, 6是100%
        oddsPct = 100 - oddsPct; // 反轉：1變成100%, 6變成0%
        oddsPct = Math.min(Math.max(oddsPct, 5), 100);
        document.getElementById(prefix + 'OddsBar').style.width = oddsPct + '%';
        document.getElementById(prefix + 'OddsGrade').innerText = oddsData.grade;
        document.getElementById(prefix + 'OddsGrade').style.color = oddsData.color;
        document.getElementById(prefix + 'OddsVal').innerText = oddsInput.toFixed(2);

        // 5. 綜合總實力 (四項平均)
        const overallData = getRatingData(overall);
        const overallEl = document.getElementById(prefix + 'Overall');
        overallEl.innerText = `${overallData.grade} (${overallData.value})`;
        overallEl.style.color = overallData.color;

        // 6. 風格
        const styleEl = document.getElementById(prefix + 'Style');
        const styleText = getTeamStyle(att, def);
        styleEl.innerText = styleText;
        
        if (styleText === "進攻型") {
            styleEl.style.color = "#ff8c8c";      
            styleEl.style.backgroundColor = "#3b1c1c"; 
        } else if (styleText === "防守型") {
            styleEl.style.color = "#8cb8ff";      
            styleEl.style.backgroundColor = "#1a2633"; 
        } else {
            styleEl.style.color = "#ccc";
            styleEl.style.backgroundColor = "#333";
        }
    }

    function calculate() {
        // 獲取輸入值
        const hXg = parseFloat(document.getElementById('homeXg').value) || 0;
        const hXga = parseFloat(document.getElementById('homeXga').value) || 0;
        const hStatus = parseFloat(document.getElementById('homeStatus').value) || 0;
        const hOdds = parseFloat(document.getElementById('homeOdds').value) || 0;

        const aXg = parseFloat(document.getElementById('awayXg').value) || 0;
        const aXga = parseFloat(document.getElementById('awayXga').value) || 0;
        const aStatus = parseFloat(document.getElementById('awayStatus').value) || 0;
        const aOdds = parseFloat(document.getElementById('awayOdds').value) || 0;

        // 1. 計算攻防基礎分
        const hDef = Math.max(0, 3.0 - hXga);
        const aDef = Math.max(0, 3.0 - aXga);

        // 2. 綜合總實力 = (攻 + 防 + 狀態 + 賠率轉化) / 4
        // 賠率轉化：1.0 算 6 分，6.0 算 1 分
        const hOddsScore = Math.max(1.0, Math.min(6.0, 7.0 - hOdds || 1.0)); 
        const aOddsScore = Math.max(1.0, Math.min(6.0, 7.0 - aOdds || 1.0));
        
        const hOverall = (hXg + hDef + hStatus + hOddsScore) / 4;
        const aOverall = (aXg + aDef + aStatus + aOddsScore) / 4;

        // 更新 UI
        updateTeamUI('h', hXg, hDef, hStatus, hOdds, hOverall);
        updateTeamUI('a', aXg, aDef, aStatus, aOdds, aOverall);

        // 3. 全新勝負判定邏輯
        // 主優勢 = max(0, 主攻 - 客防)
        const hAdvantage = Math.max(0, hXg - aDef);
        // 客優勢 = max(0, 客攻 - 主防)
        const aAdvantage = Math.max(0, aXg - hDef);

        // 🔥 修正：為了讓客隊能贏，必須相減，不能相加
        const diff = hAdvantage - aAdvantage;

        const resultBox = document.getElementById('matchResultBox');
        const resultValue = document.getElementById('matchResultValue');

        if (diff >= 0.1) {
            resultValue.innerText = "主勝";
            resultValue.style.color = "#4ade80"; // 綠色
            resultBox.style.borderColor = "#4ade80";
            resultBox.style.backgroundColor = "#1a3324";
        } else if (diff <= -0.1) {
            resultValue.innerText = "客勝";
            resultValue.style.color = "#f87171"; // 紅色
            resultBox.style.borderColor = "#f87171";
            resultBox.style.backgroundColor = "#331a1a";
        } else {
            resultValue.innerText = "和局";
            resultValue.style.color = "#ffd700"; // 黃色
            resultBox.style.borderColor = "#ffd700";
            resultBox.style.backgroundColor = "#332d1a";
        }

        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
