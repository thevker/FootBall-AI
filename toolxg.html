<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xG 全方位預測分析器 (深色評級版)</title>
    <style>
        /* 全局深色模式設定 */
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }
        .container { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 600px; 
        }
        h2 { text-align: center; color: #ffffff; margin-top: 0; font-size: 22px; }
        p.subtitle { font-size: 13px; color: #aaaaaa; text-align: center; margin-bottom: 20px; }
        
        /* 輸入區 */
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-box { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #bbbbbb; }
        input { 
            width: 100%; padding: 10px; background-color: #2d2d2d; border: 1px solid #444; color: #ffffff; border-radius: 6px; font-size: 16px; outline: none; transition: border 0.2s; 
        }
        input:focus { border-color: #4da6ff; }
        button { 
            width: 100%; padding: 12px; background: #3a7bd5; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; 
        }
        button:hover { background: #2a5fa5; }
        
        /* 結果區 */
        #result { margin-top: 25px; display: none; padding-top: 20px; border-top: 1px solid #333; }
        
        /* 公式展示區 */
        .formula-box { 
            background: #332d1a; border: 1px solid #665c33; padding: 15px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; color: #e5c07b; line-height: 1.8; word-wrap: break-word; overflow-wrap: break-word;
        }
        .formula-title { font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #ffd700; }

        /* 預測淨勝球區塊 */
        .margin-box { 
            background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; border-left: 5px solid #6c757d; 
        }
        .margin-title { font-size: 14px; font-weight: bold; color: #aaaaaa; }
        .margin-value { font-size: 28px; font-weight: bold; margin: 5px 0; }
        .margin-desc { font-size: 13px; color: #888; }

        /* 勝平負機率 */
        .probs { display: flex; justify-content: space-between; text-align: center; margin-bottom: 20px; gap: 8px; }
        .prob-box { flex: 1; padding: 12px 5px; border-radius: 8px; color: white; }
        .home { background: #218838; }
        .draw { background: #d39e00; color: #222; }
        .away { background: #c82333; }
        .prob-title { font-size: 13px; font-weight: bold; }
        .prob-value { font-size: 22px; font-weight: bold; margin-top: 5px; }

        /* 球隊評級區塊 */
        .section-box { background: #252525; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .section-title { font-size: 14px; font-weight: bold; margin-bottom: 15px; color: #dddddd; border-left: 4px solid #4da6ff; padding-left: 8px; }
        
        .team-rating-block { margin-bottom: 20px; }
        .team-rating-block:last-child { margin-bottom: 0; }
        .team-name { font-size: 15px; font-weight: bold; color: #4da6ff; margin-bottom: 10px; text-align: center; }
        
        .rating-row { display: flex; align-items: center; margin-bottom: 8px; font-size: 12px; }
        .rating-label { width: 50px; font-weight: bold; color: #aaa; }
        .rating-bar-bg { flex: 1; background: #333; height: 16px; border-radius: 8px; overflow: hidden; margin: 0 10px; position: relative; }
        .rating-bar-fill { height: 100%; border-radius: 8px; transition: width 0.5s ease; }
        .bar-attack { background: linear-gradient(90deg, #ff4d4d, #cc0000); } /* 紅色漸變 */
        .bar-defense { background: linear-gradient(90deg, #4da6ff, #0056b3); } /* 藍色漸變 */
        
        .rating-grade { width: 35px; text-align: center; font-weight: bold; font-size: 14px; }
        .grade-attack { color: #ff6b6b; }
        .grade-defense { color: #4da6ff; }
        
        .overall-row { display: flex; justify-content: space-between; background: #1e1e1e; padding: 8px 10px; border-radius: 6px; margin-top: 12px; border: 1px solid #444; }
        .overall-label { font-weight: bold; color: #ccc; }
        .overall-value { font-weight: bold; color: #ffd700; font-size: 16px; }

        .conclusion { font-size: 16px; font-weight: bold; text-align: center; color: #4da6ff; padding: 15px; background: #1a2633; border-radius: 8px; margin-top: 15px; border: 1px dashed #4da6ff; word-wrap: break-word; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 xG 賽事分析器</h2>
    <p class="subtitle">深色模式 | 快速計算淨勝球、勝平負與球隊評級</p>
    
    <div class="input-group">
        <div class="input-box">
            <label>主隊 xG (預期進球)</label>
            <input type="number" id="homeXg" step="0.01" placeholder="例：1.41">
        </div>
        <div class="input-box">
            <label>主隊 xGA (預期失球)</label>
            <input type="number" id="homeXga" step="0.01" placeholder="例：1.29">
        </div>
    </div>

    <div class="input-group">
        <div class="input-box">
            <label>客隊 xG (預期進球)</label>
            <input type="number" id="awayXg" step="0.01" placeholder="例：1.26">
        </div>
        <div class="input-box">
            <label>客隊 xGA (預期失球)</label>
            <input type="number" id="awayXga" step="0.01" placeholder="例：1.67">
        </div>
    </div>

    <button onclick="calculate()">開始分析</button>

    <div id="result">
        
        <!-- 公式展示區 -->
        <div class="formula-box">
            <div class="formula-title">💡 預測公式：</div>
            主預期進球 = (主 xG + 客 xGA) ÷ 2 = <span id="fHome"></span><br>
            客預期進球 = (客 xG + 主 xGA) ÷ 2 = <span id="fAway"></span><br>
            <strong>預測淨勝球 = <span id="fMargin" style="color:#ff6b6b;"></span></strong>
        </div>

        <!-- 預測淨勝球 -->
        <div class="margin-box">
            <div class="margin-title">⚔️ 預測全場淨勝球</div>
            <div class="margin-value" id="marginValue">+0.00</div>
            <div class="margin-desc" id="marginDesc">主隊淨勝 / 客隊淨勝</div>
        </div>

        <!-- 勝平負機率 -->
        <div class="probs">
            <div class="prob-box home">
                <div class="prob-title">主勝</div>
                <div class="prob-value" id="homeProb">0%</div>
            </div>
            <div class="prob-box draw">
                <div class="prob-title">和局</div>
                <div class="prob-value" id="drawProb">0%</div>
            </div>
            <div class="prob-box away">
                <div class="prob-title">客勝</div>
                <div class="prob-value" id="awayProb">0%</div>
            </div>
        </div>

        <!-- 球隊攻守評級與總實力 -->
        <div class="section-box">
            <div class="section-title">📊 球隊實力評級 (基於自身數據)</div>
            
            <!-- 主隊評級 -->
            <div class="team-rating-block">
                <div class="team-name">🏠 主隊</div>
                <div class="rating-row">
                    <div class="rating-label">進攻</div>
                    <div class="rating-bar-bg"><div class="rating-bar-fill bar-attack" id="hAttBar"></div></div>
                    <div class="rating-grade grade-attack" id="hAttGrade">-</div>
                </div>
                <div class="rating-row">
                    <div class="rating-label">防守</div>
                    <div class="rating-bar-bg"><div class="rating-bar-fill bar-defense" id="hDefBar"></div></div>
                    <div class="rating-grade grade-defense" id="hDefGrade">-</div>
                </div>
                <div class="overall-row">
                    <span class="overall-label">綜合總實力 (進攻+防守)/2</span>
                    <span class="overall-value" id="hOverall">0.00</span>
                </div>
            </div>

            <!-- 客隊評級 -->
            <div class="team-rating-block">
                <div class="team-name">✈️ 客隊</div>
                <div class="rating-row">
                    <div class="rating-label">進攻</div>
                    <div class="rating-bar-bg"><div class="rating-bar-fill bar-attack" id="aAttBar"></div></div>
                    <div class="rating-grade grade-attack" id="aAttGrade">-</div>
                </div>
                <div class="rating-row">
                    <div class="rating-label">防守</div>
                    <div class="rating-bar-bg"><div class="rating-bar-fill bar-defense" id="aDefBar"></div></div>
                    <div class="rating-grade grade-defense" id="aDefGrade">-</div>
                </div>
                <div class="overall-row">
                    <span class="overall-label">綜合總實力 (進攻+防守)/2</span>
                    <span class="overall-value" id="aOverall">0.00</span>
                </div>
            </div>

            <div style="font-size: 11px; color: #777; margin-top: 15px; text-align: right;">
                *防守力得分 = 3.0 - xGA (數值越高防守越好)
            </div>
        </div>

        <div class="conclusion" id="conclusion"></div>
    </div>
</div>

<script>
    // 階乘
    function factorial(n) {
        if (n === 0 || n === 1) return 1;
        let res = 1;
        for (let i = 2; i <= n; i++) res *= i;
        return res;
    }

    // 泊松分佈機率
    function poisson(k, lambda) {
        return (Math.pow(Math.E, -lambda) * Math.pow(lambda, k)) / factorial(k);
    }

    // 取得評級字母 (E ~ EX)
    function getGrade(value) {
        if (value < 1.0) return 'E';
        if (value < 1.2) return 'D';
        if (value < 1.4) return 'C';
        if (value < 1.6) return 'B';
        if (value < 1.8) return 'A';
        if (value < 2.0) return 'S';
        return 'EX';
    }

    // 更新橫條 UI 的函數
    function updateRatingBars(prefix, attValue, defValue) {
        // 條的長度映射：最低 0.5 到最高 2.5 (對應 0% - 100%)
        // 為了讓視覺更明顯，最低設 0.5 為 10%，最高設 2.5 為 100%
        let attPct = Math.min(Math.max((attValue - 0.5) / 2.0 * 100, 10), 100);
        let defPct = Math.min(Math.max((defValue - 0.5) / 2.0 * 100, 10), 100);

        document.getElementById(prefix + 'AttBar').style.width = attPct + '%';
        document.getElementById(prefix + 'DefBar').style.width = defPct + '%';
        
        document.getElementById(prefix + 'AttGrade').innerText = getGrade(attValue);
        document.getElementById(prefix + 'DefGrade').innerText = getGrade(defValue);
        
        // 計算總實力
        const overall = (attValue + defValue) / 2;
        document.getElementById(prefix + 'Overall').innerText = getGrade(overall) + ' (' + overall.toFixed(2) + ')';
    }

    function calculate() {
        const hXg = parseFloat(document.getElementById('homeXg').value) || 0;
        const hXga = parseFloat(document.getElementById('homeXga').value) || 0;
        const aXg = parseFloat(document.getElementById('awayXg').value) || 0;
        const aXga = parseFloat(document.getElementById('awayXga').value) || 0;

        // 1. 計算交叉預期進球與淨勝球
        const expHome = (hXg + aXga) / 2;
        const expAway = (aXg + hXga) / 2;
        const predMargin = expHome - expAway;

        document.getElementById('fHome').innerText = `(${hXg} + ${aXga}) ÷ 2 = ${expHome.toFixed(2)}`;
        document.getElementById('fAway').innerText = `(${aXg} + ${hXga}) ÷ 2 = ${expAway.toFixed(2)}`;
        document.getElementById('fMargin').innerText = `${expHome.toFixed(2)} - ${expAway.toFixed(2)} = ${predMargin > 0 ? '+' : ''}${predMargin.toFixed(2)}`;

        // 更新淨勝球區塊
        const marginEl = document.getElementById('marginValue');
        const marginDescEl = document.getElementById('marginDesc');
        if (predMargin > 0) {
            marginEl.innerText = `+${predMargin.toFixed(2)}`;
            marginEl.style.color = "#4ade80";
            marginDescEl.innerText = `預計主隊淨勝 ${predMargin.toFixed(2)} 球`;
        } else if (predMargin < 0) {
            marginEl.innerText = `${predMargin.toFixed(2)}`;
            marginEl.style.color = "#f87171";
            marginDescEl.innerText = `預計客隊淨勝 ${Math.abs(predMargin).toFixed(2)} 球`;
        } else {
            marginEl.innerText = `0.00`;
            marginEl.style.color = "#aaaaaa";
            marginDescEl.innerText = `預計雙方平手`;
        }

        // 2. 更新球隊評級 (進攻 = xG, 防守 = 3.0 - xGA)
        const hAttack = hXg;
        const hDefense = Math.max(0, 3.0 - hXga); 
        const aAttack = aXg;
        const aDefense = Math.max(0, 3.0 - aXga);
        
        updateRatingBars('h', hAttack, hDefense);
        updateRatingBars('a', aAttack, aDefense);

        // 3. 泊松分佈計算勝平負概率
        let homeWin = 0, draw = 0, awayWin = 0;
        const maxGoals = 6;

        for (let i = 0; i <= maxGoals; i++) {
            for (let j = 0; j <= maxGoals; j++) {
                const pHome = poisson(i, expHome);
                const pAway = poisson(j, expAway);
                const prob = pHome * pAway; 

                if (i > j) homeWin += prob;
                else if (i === j) draw += prob;
                else awayWin += prob;
            }
        }

        document.getElementById('homeProb').innerText = (homeWin * 100).toFixed(1) + '%';
        document.getElementById('drawProb').innerText = (draw * 100).toFixed(1) + '%';
        document.getElementById('awayProb').innerText = (awayWin * 100).toFixed(1) + '%';

        // 結論文字
        let conclusionText = "";
        if (predMargin > 0.8) conclusionText = "🔥 主隊優勢明顯，預計能淨勝一球以上。";
        else if (predMargin > 0.2) conclusionText = "⚖️ 主隊稍佔上風，小勝或和局機會較大。";
        else if (predMargin < -0.8) conclusionText = "🔥 客隊優勢明顯，預計能淨勝一球以上。";
        else if (predMargin < -0.2) conclusionText = "⚖️ 客隊稍佔上風，小勝或和局機會較大。";
        else conclusionText = "🤝 雙方勢均力敵，和局概率極高。";

        document.getElementById('conclusion').innerText = conclusionText;
        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
