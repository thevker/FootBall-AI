<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>賠率升跌計算</title>
<style>
    body { font-family: sans-serif; background: #1a1b26; color: #fff; display: flex; justify-content: center; padding: 20px; margin: 0; }
    .box { background: #24283b; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { padding: 8px 4px; text-align: center; border-bottom: 1px solid #3b4261; }
    th { color: #7aa2f7; font-size: 14px; font-weight: normal; }
    input { width: 80%; padding: 8px; background: #1a1b26; border: 1px solid #3b4261; border-radius: 4px; color: #fff; text-align: center; font-size: 16px; outline: none; box-sizing: border-box; }
    input:focus { border-color: #7aa2f7; }
    .btns { display: flex; gap: 10px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-analyze { background: #7aa2f7; color: #1a1b26; }
    .btn-analyze:active { background: #5c85d6; }
    .btn-clear { background: #f44336; color: #fff; }
    .btn-clear:active { background: #d32f2f; }
    .green { color: #4caf50; font-weight: bold; }
    .red { color: #f44336; font-weight: bold; }
    .gray { color: #9e9e9e; font-weight: bold; }
</style>
</head>
<body>

<div class="box">
    <table>
        <tr>
            <th>選項</th>
            <th>初盤</th>
            <th>尾盤</th>
            <th>升跌</th>
        </tr>
        <tr>
            <td>主勝</td>
            <td><input type="text" inputmode="decimal" id="h_s" placeholder="如 1.80" oninput="formatInput(this)"></td>
            <td><input type="text" inputmode="decimal" id="h_e" placeholder="如 1.35" oninput="formatInput(this)"></td>
            <td id="h_r">-</td>
        </tr>
        <tr>
            <td>和局</td>
            <td><input type="text" inputmode="decimal" id="d_s" placeholder="如 3.50" oninput="formatInput(this)"></td>
            <td><input type="text" inputmode="decimal" id="d_e" placeholder="如 3.20" oninput="formatInput(this)"></td>
            <td id="d_r">-</td>
        </tr>
        <tr>
            <td>客勝</td>
            <td><input type="text" inputmode="decimal" id="a_s" placeholder="如 4.50" oninput="formatInput(this)"></td>
            <td><input type="text" inputmode="decimal" id="a_e" placeholder="如 5.00" oninput="formatInput(this)"></td>
            <td id="a_r">-</td>
        </tr>
    </table>

    <div class="btns">
        <button class="btn-analyze" onclick="analyze()">開始分析</button>
        <button class="btn-clear" onclick="clearData()">刪除數據</button>
    </div>
</div>

<script>
    // 格式化輸入：限制只能輸入數字和小數點，且輸入3位整數時自動補點
    function formatInput(el) {
        let val = el.value.replace(/[^0-9.]/g, '');
        if (val.indexOf('.') === -1 && val.length >= 3) {
            val = val.substring(0, val.length - 2) + '.' + val.substring(val.length - 2);
        }
        el.value = val;
    }

    // 點擊分析按鈕才執行計算
    function analyze() {
        calculate('h');
        calculate('d');
        calculate('a');
    }

    function calculate(type) {
        const startVal = parseFloat(document.getElementById(type + '_s').value);
        const endVal = parseFloat(document.getElementById(type + '_e').value);
        const resEl = document.getElementById(type + '_r');

        // 檢查是否有輸入
        if (isNaN(startVal) || isNaN(endVal) || startVal <= 0 || endVal <= 0) {
            resEl.textContent = '-';
            resEl.className = 'gray';
            return;
        }

        const change = ((endVal - startVal) / startVal) * 100;
        
        // 顯示百分比 (保留兩位小數，正數加+號)
        const formatted = (change > 0 ? '+' : '') + change.toFixed(2) + '%';
        resEl.textContent = formatted;

        // 顏色判斷
        if (change > 0.01) {
            resEl.className = 'green'; // 升：綠色
        } else if (change < -0.01) {
            resEl.className = 'red'; // 跌：紅色
        } else {
            resEl.className = 'gray'; // 平：灰色
        }
    }

    // 清空所有數據
    function clearData() {
        const ids = ['h_s', 'h_e', 'd_s', 'd_e', 'a_s', 'a_e'];
        ids.forEach(id => document.getElementById(id).value = '');
        
        const resIds = ['h_r', 'd_r', 'a_r'];
        resIds.forEach(id => {
            const el = document.getElementById(id);
            el.textContent = '-';
            el.className = 'gray';
        });
    }
</script>

</body>
</html>
