<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>足球賠率升跌計算器</title>
    <style>
        :root {
            --bg-color: #1a1b26;
            --card-bg: #24283b;
            --text-color: #c0caf5;
            --input-bg: #1f2335;
            --border-color: #3b4261;
            --green: #4caf50;
            --red: #f44336;
            --gray: #9e9e9e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
            color: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .column {
            background-color: var(--input-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .column h2 {
            text-align: center;
            margin-top: 0;
            font-size: 18px;
            color: #7aa2f7;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #a9b1d6;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #7aa2f7;
        }

        .result-box {
            margin-top: 15px;
            padding: 12px;
            text-align: center;
            background-color: var(--bg-color);
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            border: 1px solid var(--border-color);
        }

        .green { color: var(--green); }
        .red { color: var(--red); }
        .gray { color: var(--gray); }

        .info {
            margin-top: 25px;
            font-size: 13px;
            color: #565f89;
            text-align: center;
            line-height: 1.5;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>賠率升跌計算器</h1>
    
    <div class="grid">
        <!-- 主勝 -->
        <div class="column">
            <h2>主勝</h2>
            <div class="input-group">
                <label>初盤</label>
                <input type="text" inputmode="decimal" id="home_start" placeholder="例如: 1.80" oninput="formatInput(this)">
            </div>
            <div class="input-group">
                <label>尾盤</label>
                <input type="text" inputmode="decimal" id="home_end" placeholder="例如: 1.35" oninput="formatInput(this)">
            </div>
            <div class="result-box gray" id="home_result">-</div>
        </div>

        <!-- 和局 -->
        <div class="column">
            <h2>和局</h2>
            <div class="input-group">
                <label>初盤</label>
                <input type="text" inputmode="decimal" id="draw_start" placeholder="例如: 3.60" oninput="formatInput(this)">
            </div>
            <div class="input-group">
                <label>尾盤</label>
                <input type="text" inputmode="decimal" id="draw_end" placeholder="例如: 3.40" oninput="formatInput(this)">
            </div>
            <div class="result-box gray" id="draw_result">-</div>
        </div>

        <!-- 客勝 -->
        <div class="column">
            <h2>客勝</h2>
            <div class="input-group">
                <label>初盤</label>
                <input type="text" inputmode="decimal" id="away_start" placeholder="例如: 4.50" oninput="formatInput(this)">
            </div>
            <div class="input-group">
                <label>尾盤</label>
                <input type="text" inputmode="decimal" id="away_end" placeholder="例如: 5.00" oninput="formatInput(this)">
            </div>
            <div class="result-box gray" id="away_result">-</div>
        </div>
    </div>

    <div class="info">
        計算公式：(尾盤 - 初盤) / 初盤 × 100%<br>
        例如：1.80 跌至 1.35，計算為 (1.35 - 1.80) / 1.80 = -25% (紅色顯示)
    </div>
</div>

<script>
    // 自動格式化輸入：只允許數字和點，且輸入 3 位整數時自動加點 (例如 180 -> 1.80)
    function formatInput(input) {
        // 替換所有非數字和小數點的字符
        let val = input.value.replace(/[^0-9.]/g, '');
        
        // 如果沒有小數點，且長度大於等於3
        if (val.indexOf('.') === -1 && val.length >= 3) {
            // 在最後兩個數字前插入小數點
            val = val.substring(0, val.length - 2) + '.' + val.substring(val.length - 2);
        }
        
        input.value = val;
        calculate();
    }

    // 計算並更新結果
    function calculate() {
        updateResult('home_start', 'home_end', 'home_result');
        updateResult('draw_start', 'draw_end', 'draw_result');
        updateResult('away_start', 'away_end', 'away_result');
    }

    function updateResult(startId, endId, resultId) {
        const startVal = parseFloat(document.getElementById(startId).value);
        const endVal = parseFloat(document.getElementById(endId).value);
        const resultEl = document.getElementById(resultId);

        // 如果輸入無效或為 0，則清空結果
        if (isNaN(startVal) || isNaN(endVal) || startVal <= 0 || endVal <= 0) {
            resultEl.textContent = '-';
            resultEl.className = 'result-box gray';
            return;
        }

        // 計算百分比：(尾盤 - 初盤) / 初盤 * 100
        const change = ((endVal - startVal) / startVal) * 100;

        // 顯示格式：保留兩位小數，前面加上 + 號（如果是正數）
        const formattedChange = (change > 0 ? '+' : '') + change.toFixed(2) + '%';
        resultEl.textContent = formattedChange;

        // 顏色判斷 (誤差範圍 0.01 避免浮點數問題)
        if (change > 0.01) {
            resultEl.className = 'result-box green'; // 升：綠色
        } else if (change < -0.01) {
            resultEl.className = 'result-box red';   // 跌：紅色
        } else {
            resultEl.className = 'result-box gray';  // 沒變化：灰色
        }
    }
</script>

</body>
</html>
