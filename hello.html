<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波膽預測計算機 (賠率+機率混合)</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #f8f9fa;
            color: #555;
            font-weight: bold;
        }
        .market-name {
            text-align: left;
            font-weight: 500;
        }
        input[type="number"] {
            width: 80px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            font-size: 15px;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #3498db;
        }
        .btn-calc {
            width: 100%;
            padding: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }
        .btn-calc:hover {
            background-color: #2980b9;
        }
        .result-section {
            margin-top: 30px;
            display: none;
            background: #fdfdfd;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eaeaea;
        }
        .result-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #ccc;
        }
        .result-header h3 {
            margin: 0 0 10px 0;
            color: #2c3e50;
        }
        .xg-info {
            font-size: 16px;
            color: #e74c3c;
            font-weight: bold;
        }
        .score-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .score-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 15px;
            background-color: #fff;
            border: 1px solid #eee;
            border-radius: 6px;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .score-item:nth-child(1) {
            background-color: #fff9e6;
            border-color: #f1c40f;
            font-weight: bold;
            grid-column: span 2;
            font-size: 18px;
        }
        .score-prob {
            color: #27ae60;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            color: #888;
            display: none;
            font-size: 16px;
            margin: 20px 0;
        }
        .note-box {
            background-color: #e8f4f8;
            border-left: 4px solid #3498db;
            padding: 10px 15px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #444;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>波膽預測計算機</h2>
    <div class="subtitle">
        同時採用「賠率隱含機率」與「統計機率」進行綜合運算。
    </div>
    
    <div class="note-box">
        💡 <b>計算邏輯：</b>若同時填寫賠率與機率，系統會將兩者轉換為小數後取<b>平均值</b>，作為最終的目標機率，再進行波膽擬合。若只填寫其中一項，則單獨使用該項數據。
    </div>

    <table>
        <thead>
            <tr>
                <th>市場</th>
                <th>賠率 (Odds)</th>
                <th>機率 (%)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="market-name">主隊贏 (Home Win)</td>
                <td><input type="number" id="oddsHome" step="0.01" placeholder="2.10"></td>
                <td><input type="number" id="probHome" step="1" placeholder="50"></td>
            </tr>
            <tr>
                <td class="market-name">平局 (Draw)</td>
                <td><input type="number" id="oddsDraw" step="0.01" placeholder="3.40"></td>
                <td><input type="number" id="probDraw" step="1" placeholder="0"></td>
            </tr>
            <tr>
                <td class="market-name">客隊贏 (Away Win)</td>
                <td><input type="number" id="oddsAway" step="0.01" placeholder="2.87"></td>
                <td><input type="number" id="probAway" step="1" placeholder="0"></td>
            </tr>
            <tr>
                <td class="market-name">大於 1.5 球</td>
                <td><input type="number" id="oddsOver15" step="0.01" placeholder="1.09"></td>
                <td><input type="number" id="probOver15" step="1" placeholder="79"></td>
            </tr>
            <tr>
                <td class="market-name">大於 2.5 球</td>
                <td><input type="number" id="oddsOver25" step="0.01" placeholder="1.43"></td>
                <td><input type="number" id="probOver25" step="1" placeholder="79"></td>
            </tr>
            <tr>
                <td class="market-name">大於 3.5 球</td>
                <td><input type="number" id="oddsOver35" step="0.01" placeholder="2.35"></td>
                <td><input type="number" id="probOver35" step="1" placeholder="42"></td>
            </tr>
            <tr>
                <td class="market-name">大於 4.5 球</td>
                <td><input type="number" id="oddsOver45" step="0.01" placeholder="3.58"></td>
                <td><input type="number" id="probOver45" step="1" placeholder="21"></td>
            </tr>
            <tr>
                <td class="market-name">兩隊都得分 (BTTS)</td>
                <td><input type="number" id="oddsBTTS" step="0.01" placeholder="1.40"></td>
                <td><input type="number" id="probBTTS" step="1" placeholder="38"></td>
            </tr>
        </tbody>
    </table>

    <button class="btn-calc" onclick="calculateScores()">開始綜合計算波膽</button>
    <div class="loading" id="loading">正在混合數據並利用泊松分佈擬合...</div>

    <div class="result-section" id="resultSection">
        <div class="result-header">
            <h3>模型預測結果</h3>
            <p>預估主隊進球期望值: <span class="xg-info" id="xgHome">0.00</span> | 
               預估客隊進球期望值: <span class="xg-info" id="xgAway">0.00</span></p>
        </div>
        <ul class="score-list" id="scoreList"></ul>
    </div>
</div>

<script>
    // 階乘計算
    function factorial(n) {
        if (n === 0 || n === 1) return 1;
        let result = 1;
        for (let i = 2; i <= n; i++) result *= i;
        return result;
    }

    // 泊松分佈公式
    function poisson(k, lambda) {
        return (Math.exp(-lambda) * Math.pow(lambda, k)) / factorial(k);
    }

    // 核心計算邏輯：獲取賠率與機率，並取平均
    function getMixedProbability(oddsId, probId) {
        const oddsVal = parseFloat(document.getElementById(oddsId).value);
        const probVal = parseFloat(document.getElementById(probId).value);
        
        let hasOdds = !isNaN(oddsVal) && oddsVal > 1;
        let hasProb = !isNaN(probVal) && probVal >= 0;

        let impliedProb = hasOdds ? (1 / oddsVal) : null;
        let statProb = hasProb ? (probVal / 100) : null;

        // 如果兩者都有，取平均
        if (impliedProb !== null && statProb !== null) {
            return (impliedProb + statProb) / 2;
        } 
        // 如果只有其中一個
        else if (impliedProb !== null) {
            return impliedProb;
        } 
        else if (statProb !== null) {
            return statProb;
        }
        return null;
    }

    function calculateScores() {
        // 1. 獲取綜合目標機率
        let pHome = getMixedProbability('oddsHome', 'probHome');
        let pDraw = getMixedProbability('oddsDraw', 'probDraw');
        let pAway = getMixedProbability('oddsAway', 'probAway');
        let pOver15 = getMixedProbability('oddsOver15', 'probOver15');
        let pOver25 = getMixedProbability('oddsOver25', 'probOver25');
        let pOver35 = getMixedProbability('oddsOver35', 'probOver35');
        let pOver45 = getMixedProbability('oddsOver45', 'probOver45');
        let pBTTS = getMixedProbability('oddsBTTS', 'probBTTS');

        // 檢查核心數據
        if (pHome === null || pDraw === null || pAway === null || pOver25 === null || pBTTS === null) {
            alert("請至少輸入 主勝、平局、客勝、大於2.5球、兩隊都得分 的數據！(賠率或機率擇一填寫即可，若皆填寫則取平均)");
            return;
        }

        // 歸一化勝平負 (確保模型輸入的勝平負總和為 100%)
        let sum1x2 = pHome + pDraw + pAway;
        pHome /= sum1x2;
        pDraw /= sum1x2;
        pAway /= sum1x2;

        document.getElementById('loading').style.display = 'block';
        document.getElementById('resultSection').style.display = 'none';

        let bestLambdaH = 0;
        let bestLambdaA = 0;
        let minError = Infinity;

        // 2. 網格搜索尋找最佳預期進球數 (xG)
        for (let lh = 0.1; lh <= 4.5; lh += 0.02) {
            for (let la = 0.1; la <= 4.5; la += 0.02) {
                
                let calcPHome = 0, calcPDraw = 0, calcPAway = 0;
                let calcPOver15 = 0, calcPOver25 = 0, calcPOver35 = 0, calcPOver45 = 0;
                let calcPBTTS = 0;

                for (let i = 0; i <= 7; i++) {
                    for (let j = 0; j <= 7; j++) {
                        let prob = poisson(i, lh) * poisson(j, la);
                        
                        if (i > j) calcPHome += prob;
                        else if (i === j) calcPDraw += prob;
                        else calcPAway += prob;

                        let totalGoals = i + j;
                        if (totalGoals > 1.5) calcPOver15 += prob;
                        if (totalGoals > 2.5) calcPOver25 += prob;
                        if (totalGoals > 3.5) calcPOver35 += prob;
                        if (totalGoals > 4.5) calcPOver45 += prob;

                        if (i > 0 && j > 0) calcPBTTS += prob;
                    }
                }

                // 3. 計算誤差
                let error = Math.pow(calcPHome - pHome, 2) +
                            Math.pow(calcPDraw - pDraw, 2) +
                            Math.pow(calcPAway - pAway, 2);

                // 大小球與 BTTS 權重設為 1.5
                if (pOver25 !== null) error += Math.pow(calcPOver25 - pOver25, 2) * 1.5;
                if (pBTTS !== null) error += Math.pow(calcPBTTS - pBTTS, 2) * 1.5;
                if (pOver15 !== null) error += Math.pow(calcPOver15 - pOver15, 2) * 1.0;
                if (pOver35 !== null) error += Math.pow(calcPOver35 - pOver35, 2) * 1.0;
                if (pOver45 !== null) error += Math.pow(calcPOver45 - pOver45, 2) * 1.0;

                if (error < minError) {
                    minError = error;
                    bestLambdaH = lh;
                    bestLambdaA = la;
                }
            }
        }

        // 4. 用找到的最佳 xG 計算最終波膽
        let finalScores = [];
        for (let i = 0; i <= 5; i++) {
            for (let j = 0; j <= 5; j++) {
                let prob = poisson(i, bestLambdaH) * poisson(j, bestLambdaA);
                if (prob > 0.005) { 
                    finalScores.push({ score: `${i} - ${j}`, prob: prob });
                }
            }
        }

        finalScores.sort((a, b) => b.prob - a.prob);
        const topScores = finalScores.slice(0, 6);

        // 5. 顯示結果
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            
            document.getElementById('xgHome').innerText = bestLambdaH.toFixed(2);
            document.getElementById('xgAway').innerText = bestLambdaA.toFixed(2);

            const scoreList = document.getElementById('scoreList');
            scoreList.innerHTML = '';

            topScores.forEach((item, index) => {
                let li = document.createElement('li');
                li.className = 'score-item';
                let medal = index === 0 ? '🥇 ' : index === 1 ? '🥈 ' : index === 2 ? '🥉 ' : '';
                li.innerHTML = `
                    <span>${medal}${item.score}</span>
                    <span class="score-prob">${(item.prob * 100).toFixed(1)}%</span>
                `;
                scoreList.appendChild(li);
            });
        }, 200);
    }
</script>

</body>
</html>
