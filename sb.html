<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>基本面比例碰撞分析器</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #121212; color: #e0e0e0; margin: 0; padding: 10px; 
            display: flex; justify-content: center; min-height: 100vh; -webkit-overflow-scrolling: touch;
        }
        .container { 
            background: #1a1a1a; padding: 15px; border-radius: 12px; 
            width: 100%; max-width: 500px; position: relative; margin-bottom: 20px;
        }
        h2 { text-align: center; color: #ffffff; margin-top: 0; font-size: 20px; margin-bottom: 5px; }
        p.subtitle { font-size: 12px; color: #aaaaaa; text-align: center; margin-bottom: 15px; }

        .input-section { margin-bottom: 15px; }
        .section-header { font-size: 14px; font-weight: bold; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #333; }
        .section-header.home { color: #ff6b6b; }
        .section-header.away { color: #6b9fff; }

        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-box { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        label { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #bbbbbb; }
        input[type="text"] { 
            width: 100%; padding: 12px 8px; background-color: #2d2d2d; border: 1px solid #444; 
            color: #ffffff; border-radius: 6px; font-size: 16px; outline: none; transition: border 0.2s; 
            text-align: center;
        }
        input[type="text"]:focus { border-color: #4da6ff; }

        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-calculate { background: #3a7bd5; color: white; margin-bottom: 8px; }
        .btn-calculate:hover { background: #2a5fa5; }
        .btn-clear { background: #5a2a2a; color: #ff9999; border: 1px solid #7a3a3a; }
        .btn-clear:hover { background: #7a3a3a; color: white; }

        #result { display: none; margin-top: 20px; }
        
        .result-card {
            background: #222222;
            border: 1px solid #3a3a3a;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .card-title { font-size: 13px; font-weight: bold; color: #aaa; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 6px; text-align: center;}

        /* 終極哲學判定框 */
        .philosophy-box {
            text-align: center; padding: 15px; border-radius: 12px; margin-bottom: 12px;
            border: 2px solid #555; background-color: #1a1a1a;
        }
        .phil-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; }
        .phil-desc { font-size: 12px; color: #ccc; line-height: 1.4; }
        .phil-action { font-size: 16px; font-weight: bold; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #444; }

        /* 賽果與入球網格 */
        .match-result { font-size: 26px; font-weight: bold; text-align: center; margin: 10px 0; }
        .match-details { text-align: center; font-size: 12px; color: #ccc; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .goals-box {
            text-align: center; padding: 10px; border-radius: 8px; 
            border: 1px solid #444; background: #181818;
        }
        .goals-title { font-size: 11px; color: #aaa; margin-bottom: 4px; }
        .goals-val { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
        .ratio-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #333; display: inline-block; }

        .over { color: #f87171; }
        .under { color: #8cb8ff; }
        .avoid { color: #ffa500; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚽ 基本面比例碰撞</h2>
    <p class="subtitle">看透數據的「穿透倍數」與矛盾哲學</p>

    <div class="input-section">
        <div class="section-header home">🏠 主隊數據</div>
        <div class="input-row">
            <div class="input-box">
                <label>場均得分 (進攻)</label>
                <input type="text" inputmode="decimal" id="h_goals" placeholder="例：2.00" oninput="limitInput(this)" onblur="formatInput(this)">
            </div>
            <div class="input-box">
                <label>場均失球 (防守)</label>
                <input type="text" inputmode="decimal" id="h_conceded" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)">
            </div>
        </div>
    </div>

    <div class="input-section">
        <div class="section-header away">✈️ 客隊數據</div>
        <div class="input-row">
            <div class="input-box">
                <label>場均得分 (進攻)</label>
                <input type="text" inputmode="decimal" id="a_goals" placeholder="例：1.00" oninput="limitInput(this)" onblur="formatInput(this)">
            </div>
            <div class="input-box">
                <label>場均失球 (防守)</label>
                <input type="text" inputmode="decimal" id="a_conceded" placeholder="例：2.00" oninput="limitInput(this)" onblur="formatInput(this)">
            </div>
        </div>
    </div>

    <button class="btn-calculate" onclick="calculate()">開始分析</button>
    <button class="btn-clear" onclick="clearData()">清除數據</button>

    <div id="result">
        
        <!-- 終極矛盾判定 -->
        <div class="philosophy-box" id="philBox">
            <div class="phil-title" id="philTitle">-</div>
            <div class="phil-desc" id="philDesc">-</div>
            <div class="phil-action" id="philAction">-</div>
        </div>

        <!-- 勝平負 -->
        <div class="result-card">
            <div class="card-title">🏆 純數據預測賽果</div>
            <div class="match-result" id="matchResult">-</div>
            <div class="match-details" id="matchDetails">-</div>
        </div>

        <!-- 各隊進球期望與倍數 -->
        <div class="result-card">
            <div class="card-title">🎯 攻防穿透力比例</div>
            <div class="grid-2">
                <div class="goals-box">
                    <div class="goals-title">主隊預期進球</div>
                    <div class="goals-val" id="expH">-</div>
                    <div class="ratio-badge" id="ratioH">-</div>
                </div>
                <div class="goals-box">
                    <div class="goals-title">客隊預期進球</div>
                    <div class="goals-val" id="expA">-</div>
                    <div class="ratio-badge" id="ratioA">-</div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    function limitInput(input) {
        let val = input.value.replace(/[^0-9.]/g, '');
        let parts = val.split('.');
        if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
        if (val.replace(/\./g, '').length > 3) {
            let newVal = '', count = 0;
            for (let char of val) { if (char !== '.') { if (count >= 3) break; count++; } newVal += char; }
            val = newVal;
        }
        input.value = val;
    }

    function formatInput(input) {
        let val = input.value;
        if (!val || val === '.') { input.value = ''; return; }
        if (!val.includes('.')) {
            if (val.length === 2) {
                let num = parseInt(val);
                val = num > 30 ? '0.' + val : val.substring(0, 1) + '.' + val.substring(1) + '0';
            } else if (val.length === 1) val = val + '.00';
        } else {
            let parts = val.split('.');
            val = (parts[0] || '0') + '.' + (parts[1] || '').padEnd(2, '0').substring(0, 2);
        }
        let num = parseFloat(val);
        input.value = isNaN(num) ? '0.00' : num.toFixed(2);
    }

    function clearData() {
        document.getElementById('h_goals').value = '';
        document.getElementById('h_conceded').value = '';
        document.getElementById('a_goals').value = '';
        document.getElementById('a_conceded').value = '';
        document.getElementById('result').style.display = 'none';
    }

    function calculate() {
        const h_goals = parseFloat(document.getElementById('h_goals').value);
        const h_conceded = parseFloat(document.getElementById('h_conceded').value);
        const a_goals = parseFloat(document.getElementById('a_goals').value);
        const a_conceded = parseFloat(document.getElementById('a_conceded').value);

        if (isNaN(h_goals) || isNaN(h_conceded) || isNaN(a_goals) || isNaN(a_conceded)) {
            alert("請完整填寫所有數據！");
            return;
        }

        // 避免除以零
        const safe_a_conceded = Math.max(a_conceded, 0.01);
        const safe_h_conceded = Math.max(h_conceded, 0.01);

        // 1. 核心比例計算 (我的進攻 / 對方的失球)
        const ratioH = h_goals / safe_a_conceded; // 主隊穿透倍數
        const ratioA = a_goals / safe_h_conceded; // 客隊穿透倍數

        // 2. 預期進球 (直接比例交叉平均)
        const expH = (h_goals + a_conceded) / 2;
        const expA = (a_goals + h_conceded) / 2;
        const totalExp = expH + expA;

        // 3. 判定四大哲學 (基於倍數)
        const philBox = document.getElementById('philBox');
        const philTitle = document.getElementById('philTitle');
        const philDesc = document.getElementById('philDesc');
        const philAction = document.getElementById('philAction');

        // 判定門檻：倍數大於 1.3 算「打穿」，小於 0.7 算「被鎖死」
        const highThreshold = 1.3;
        const lowThreshold = 0.7;

        if (ratioH >= highThreshold && ratioA >= highThreshold) {
            // 雙方進攻都能打穿對面防守
            philBox.style.borderColor = '#f87171';
            philTitle.innerText = "🔥 大球提款局 (互相打穿)";
            philTitle.style.color = '#f87171';
            philDesc.innerText = `主隊穿透力 ${ratioH.toFixed(2)} 倍，客隊 ${ratioA.toFixed(2)} 倍。雙方進攻皆能輕易撕裂對方防線，且防守都形同虛設。`;
            philAction.innerText = "👉 強烈建議：入球大";
        } 
        else if (ratioH <= lowThreshold && ratioA <= lowThreshold) {
            // 雙方進攻都被對面鎖死
            philBox.style.borderColor = '#8cb8ff';
            philTitle.innerText = "🛡️ 便秘局 (互相鎖死)";
            philTitle.style.color = '#8cb8ff';
            philDesc.innerText = `主隊穿透力僅 ${ratioH.toFixed(2)} 倍，客隊 ${ratioA.toFixed(2)} 倍。雙方進攻皆遠弱於對方防守，大概率是一場泥潭戰。`;
            philAction.innerText = "👉 強烈建議：入球細";
        }
        else if (ratioH > highThreshold && ratioA <= lowThreshold) {
            // 主隊能打穿，客隊被鎖死
            philBox.style.borderColor = '#4ade80';
            philTitle.innerText = "⚔️ 單邊壓制局 (主隊佔優)";
            philTitle.style.color = '#4ade80';
            philDesc.innerText = `主隊穿透力高達 ${ratioH.toFixed(2)} 倍，而客隊僅 ${ratioA.toFixed(2)} 倍。主隊攻防兩端皆壓制客隊。`;
            philAction.innerText = "👉 建議：主勝 / 入球大";
        }
        else if (ratioH <= lowThreshold && ratioA > highThreshold) {
            // 客隊能打穿，主隊被鎖死
            philBox.style.borderColor = '#f87171';
            philTitle.innerText = "⚔️ 單邊壓制局 (客隊佔優)";
            philTitle.style.color = '#f87171';
            philDesc.innerText = `客隊穿透力高達 ${ratioA.toFixed(2)} 倍，而主隊僅 ${ratioH.toFixed(2)} 倍。客隊具備明顯的攻防優勢。`;
            philAction.innerText = "👉 建議：客勝 / 入球大";
        }
        else if ((ratioH >= 1.0 && ratioA <= 0.7) || (ratioH <= 0.7 && ratioA >= 1.0) || (ratioH < 1.0 && ratioA < 1.0)) {
            // 混沌局 (例如弱攻打弱防，倍數都在 0.8 左右，或者極端錯位)
            philBox.style.borderColor = '#ffa500';
            philTitle.innerText = "⚠️ 混沌不明局";
            philTitle.style.color = '#ffa500';
            philDesc.innerText = `穿透倍數（主 ${ratioH.toFixed(2)} / 客 ${ratioA.toFixed(2)}）呈現膠著。可能是無效控球，也可能是互相送禮。`;
            philAction.innerText = "👉 強烈建議：避開此場";
        }
        else {
            // 普通碰撞
            philBox.style.borderColor = '#aaa';
            philTitle.innerText = "⚖️ 常規數據對碰";
            philTitle.style.color = '#ccc';
            philDesc.innerText = `主隊穿透 ${ratioH.toFixed(2)} 倍，客隊穿透 ${ratioA.toFixed(2)} 倍。數據呈現正常的矛與盾對決。`;
            philAction.innerText = `👉 預期總進球：${totalExp.toFixed(2)}`;
        }

        // 4. 勝平負
        const matchResultEl = document.getElementById('matchResult');
        const matchDetailsEl = document.getElementById('matchDetails');
        
        matchDetailsEl.innerText = `預期比分：主 ${expH.toFixed(2)} - 客 ${expA.toFixed(2)}`;
        
        if (expH - expA > 0.2) {
            matchResultEl.innerText = "主勝";
            matchResultEl.style.color = "#4ade80";
        } else if (expH - expA < -0.2) {
            matchResultEl.innerText = "客勝";
            matchResultEl.style.color = "#f87171";
        } else {
            matchResultEl.innerText = "和局";
            matchResultEl.style.color = "#ffd700";
        }

        // 5. 顯示 UI
        document.getElementById('expH').innerText = expH.toFixed(2);
        document.getElementById('expA').innerText = expA.toFixed(2);
        
        const ratioHEl = document.getElementById('ratioH');
        const ratioAEl = document.getElementById('ratioA');
        
        ratioHEl.innerText = `穿透力: ${ratioH.toFixed(2)} 倍`;
        ratioAEl.innerText = `穿透力: ${ratioA.toFixed(2)} 倍`;

        // 為穿透倍數上色
        ratioHEl.style.color = ratioH >= 1.3 ? '#f87171' : (ratioH <= 0.7 ? '#8cb8ff' : '#fff');
        ratioAEl.style.color = ratioA >= 1.3 ? '#f87171' : (ratioA <= 0.7 ? '#8cb8ff' : '#fff');

        document.getElementById('result').style.display = 'block';
    }
</script>
</body>
</html>
