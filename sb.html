<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>基本面直觀預測器</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #121212; color: #e0e0e0; margin: 0; padding: 10px; 
            display: flex; justify-content: center; min-height: 100vh; -webkit-overflow-scrolling: touch;
        }
        .container { 
            background: #1a1a1a; padding: 15px; border-radius: 12px; 
            width: 100%; max-width: 500px; position: relative; margin-bottom: 20px;
        }
        h2 { text-align: center; color: #ffffff; margin-top: 0; font-size: 20px; margin-bottom: 5px; }
        p.subtitle { font-size: 12px; color: #aaaaaa; text-align: center; margin-bottom: 15px; }

        .input-section { margin-bottom: 15px; }
        .section-header { font-size: 14px; font-weight: bold; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #333; }
        .section-header.home { color: #ff6b6b; }
        .section-header.away { color: #6b9fff; }

        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-box { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        label { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #bbbbbb; }
        input[type="text"] { 
            width: 100%; padding: 12px 8px; background-color: #2d2d2d; border: 1px solid #444; 
            color: #ffffff; border-radius: 6px; font-size: 16px; outline: none; transition: border 0.2s; 
            text-align: center;
        }
        input[type="text"]:focus { border-color: #4da6ff; }

        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-calculate { background: #3a7bd5; color: white; margin-bottom: 8px; }
        .btn-calculate:hover { background: #2a5fa5; }
        .btn-clear { background: #5a2a2a; color: #ff9999; border: 1px solid #7a3a3a; }
        .btn-clear:hover { background: #7a3a3a; color: white; }

        #result { display: none; margin-top: 20px; }
        
        .result-card {
            background: #222222;
            border: 1px solid #3a3a3a;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .card-title { font-size: 13px; font-weight: bold; color: #aaa; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 6px; text-align: center;}

        /* 哲學判定框 */
        .philosophy-box {
            text-align: center; padding: 15px; border-radius: 12px; margin-bottom: 12px;
            border: 2px solid #555; background-color: #1a1a1a;
        }
        .phil-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; }
        .phil-desc { font-size: 12px; color: #ccc; line-height: 1.5; }
        .phil-action { font-size: 16px; font-weight: bold; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #444; }

        /* 各隊預期進球網格 */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .goals-box {
            text-align: center; padding: 12px 5px; border-radius: 8px; 
            border: 1px solid #444; background: #181818;
        }
        .goals-title { font-size: 12px; color: #aaa; margin-bottom: 6px; }
        .goals-val { font-size: 24px; font-weight: bold; margin-bottom: 4px; }
        .goals-desc { font-size: 11px; color: #888; }

        .over { color: #f87171; }
        .under { color: #8cb8ff; }
        .avoid { color: #ffa500; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚽ 基本面直觀預測</h2>
    <p class="subtitle">看透進失球交叉碰撞的真實結果</p>

    <div class="input-section">
        <div class="section-header home">🏠 主隊數據</div>
        <div class="input-row">
            <div class="input-box">
                <label>場均得分 (進攻)</label>
                <input type="text" inputmode="decimal" id="h_goals" placeholder="例：0.80" oninput="limitInput(this)" onblur="formatInput(this)">
            </div>
            <div class="input-box">
                <label>場均失球 (防守)</label>
                <input type="text" inputmode="decimal" id="h_conceded" placeholder="例：1.80" oninput="limitInput(this)" onblur="formatInput(this)">
            </div>
        </div>
    </div>

    <div class="input-section">
        <div class="section-header away">✈️ 客隊數據</div>
        <div class="input-row">
            <div class="input-box">
                <label>場均得分 (進攻)</label>
                <input type="text" inputmode="decimal" id="a_goals" placeholder="例：1.80" oninput="limitInput(this)" onblur="formatInput(this)">
            </div>
            <div class="input-box">
                <label>場均失球 (防守)</label>
                <input type="text" inputmode="decimal" id="a_conceded" placeholder="例：0.80" oninput="limitInput(this)" onblur="formatInput(this)">
            </div>
        </div>
    </div>

    <button class="btn-calculate" onclick="calculate()">開始分析</button>
    <button class="btn-clear" onclick="clearData()">清除數據</button>

    <div id="result">
        
        <!-- 哲學判定 -->
        <div class="philosophy-box" id="philBox">
            <div class="phil-title" id="philTitle">-</div>
            <div class="phil-desc" id="philDesc">-</div>
            <div class="phil-action" id="philAction">-</div>
        </div>

        <!-- 各隊預期進球 -->
        <div class="result-card">
            <div class="card-title">🎯 雙方預期進球數</div>
            <div class="grid-2">
                <div class="goals-box">
                    <div class="goals-title">主隊預期進球</div>
                    <div class="goals-val" id="expH">-</div>
                    <div class="goals-desc" id="descH">-</div>
                </div>
                <div class="goals-box">
                    <div class="goals-title">客隊預期進球</div>
                    <div class="goals-val" id="expA">-</div>
                    <div class="goals-desc" id="descA">-</div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    function limitInput(input) {
        let val = input.value.replace(/[^0-9.]/g, '');
        let parts = val.split('.');
        if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
        if (val.replace(/\./g, '').length > 3) {
            let newVal = '', count = 0;
            for (let char of val) { if (char !== '.') { if (count >= 3) break; count++; } newVal += char; }
            val = newVal;
        }
        input.value = val;
    }

    function formatInput(input) {
        let val = input.value;
        if (!val || val === '.') { input.value = ''; return; }
        if (!val.includes('.')) {
            if (val.length === 2) {
                let num = parseInt(val);
                val = num > 30 ? '0.' + val : val.substring(0, 1) + '.' + val.substring(1) + '0';
            } else if (val.length === 1) val = val + '.00';
        } else {
            let parts = val.split('.');
            val = (parts[0] || '0') + '.' + (parts[1] || '').padEnd(2, '0').substring(0, 2);
        }
        let num = parseFloat(val);
        input.value = isNaN(num) ? '0.00' : num.toFixed(2);
    }

    function clearData() {
        document.getElementById('h_goals').value = '';
        document.getElementById('h_conceded').value = '';
        document.getElementById('a_goals').value = '';
        document.getElementById('a_conceded').value = '';
        document.getElementById('result').style.display = 'none';
    }

    function calculate() {
        const h_goals = parseFloat(document.getElementById('h_goals').value);
        const h_conceded = parseFloat(document.getElementById('h_conceded').value);
        const a_goals = parseFloat(document.getElementById('a_goals').value);
        const a_conceded = parseFloat(document.getElementById('a_conceded').value);

        if (isNaN(h_goals) || isNaN(h_conceded) || isNaN(a_goals) || isNaN(a_conceded)) {
            alert("請完整填寫所有數據！");
            return;
        }

        // 1. 核心公式：預期進球 = (自己進攻 + 對手防守) / 2
        const expH = (h_goals + a_conceded) / 2;
        const expA = (a_goals + h_conceded) / 2;
        const totalExp = expH + expA;

        // 2. 判定四大哲學 (基於預期進球數)
        const philBox = document.getElementById('philBox');
        const philTitle = document.getElementById('philTitle');
        const philDesc = document.getElementById('philDesc');
        const philAction = document.getElementById('philAction');

        // 設定門檻：小於 1.0 算「不進球或進一球」，大於 1.5 算「強大火力」
        const isH_Weak = expH < 1.0;
        const isA_Weak = expA < 1.0;
        const isH_Strong = expH >= 1.5;
        const isA_Strong = expA >= 1.5;

        if (isH_Strong && isA_Strong) {
            // 雙方預期都能進 1.5 球以上
            philBox.style.borderColor = '#f87171';
            philTitle.innerText = "🔥 大球提款局 (互相打穿)";
            philTitle.style.color = '#f87171';
            philDesc.innerText = `雙方預期進球皆高（主 ${expH.toFixed(2)} / 客 ${expA.toFixed(2)}）。雙方的矛都能刺穿對方的盾，入球大信號強烈。`;
            philAction.innerText = "👉 強烈建議：入球大";
        } 
        else if (isH_Weak && isA_Weak) {
            // 雙方預期都不到 1.0 球
            philBox.style.borderColor = '#8cb8ff';
            philTitle.innerText = "🛡️ 便秘局 (互相鎖死)";
            philTitle.style.color = '#8cb8ff';
            philDesc.innerText = `雙方預期進球皆低（主 ${expH.toFixed(2)} / 客 ${expA.toFixed(2)}）。大概率互交白卷或 1:0 收場，入球細信號強烈。`;
            philAction.innerText = "👉 強烈建議：入球細";
        }
        else if (isH_Strong && isA_Weak) {
            // 主隊能進，客隊不能進
            philBox.style.borderColor = '#4ade80';
            philTitle.innerText = "⚔️ 單邊壓制局 (主隊佔優)";
            philTitle.style.color = '#4ade80';
            philDesc.innerText = `主隊預期能進 ${expH.toFixed(2)} 球，而客隊僅有 ${expA.toFixed(2)} 球。客隊極大概率被主隊防線鎖死。`;
            philAction.innerText = "👉 建議：主勝 / 入球大 (視乎總數)";
        }
        else if (isH_Weak && isA_Strong) {
            // 客隊能進，主隊不能進
            philBox.style.borderColor = '#f87171';
            philTitle.innerText = "⚔️ 單邊壓制局 (客隊佔優)";
            philTitle.style.color = '#f87171';
            philDesc.innerText = `客隊預期能進 ${expA.toFixed(2)} 球，而主隊僅有 ${expH.toFixed(2)} 球。主隊極大概率無法攻破客隊防線。`;
            philAction.innerText = "👉 建議：客勝 / 入球大 (視乎總數)";
        }
        else {
            // 混沌局 (一隊在 1.0-1.5 之間，或者雙方都在 1.0-1.5 之間)
            philBox.style.borderColor = '#ffa500';
            philTitle.innerText = "⚠️ 混沌不明局";
            philTitle.style.color = '#ffa500';
            philDesc.innerText = `主隊預期 ${expH.toFixed(2)}，客隊預期 ${expA.toFixed(2)}。數據不上不下，可能有意外進球或烏龍球。`;
            philAction.innerText = "👉 強烈建議：避開此場";
        }

        // 3. 顯示各隊詳細數據
        document.getElementById('expH').innerText = expH.toFixed(2);
        document.getElementById('expA').innerText = expA.toFixed(2);

        const descHEl = document.getElementById('descH');
        if (expH < 0.8) descHEl.innerText = "極大概率不進球";
        else if (expH < 1.2) descHEl.innerText = "大約進 0 或 1 球";
        else descHEl.innerText = "具備進球能力";

        const descAEl = document.getElementById('descA');
        if (expA < 0.8) descAEl.innerText = "極大概率不進球";
        else if (expA < 1.2) descAEl.innerText = "大約進 0 或 1 球";
        else descAEl.innerText = "具備進球能力";

        // 上色
        document.getElementById('expH').style.color = expH >= 1.5 ? "#f87171" : (expH < 1.0 ? "#8cb8ff" : "#fff");
        document.getElementById('expA').style.color = expA >= 1.5 ? "#f87171" : (expA < 1.0 ? "#8cb8ff" : "#fff");
        
        document.getElementById('result').style.display = 'block';
    }
</script>
</body>
</html>
