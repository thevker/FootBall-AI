<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>專屬預測器 (全場/半場)</title>
<style>
  :root{
    --bg:#0b1220; --card:#141d2f; --card2:#1b2740; --line:#2a3a55;
    --txt:#e8eefc; --muted:#8fa3c4;
    --accent:#3ddc97; --accent2:#4da3ff; --warn:#ffb347;
  }
  *{box-sizing:border-box}
  html { -webkit-text-size-adjust: 100%; overflow-anchor: none; }
  body{
    margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;
    background:radial-gradient(1200px 600px at 20% -10%,#1a2c4d 0%,transparent 60%),var(--bg);
    color:var(--txt);padding:24px 16px 60px;display:flex;justify-content:center;
    -webkit-overflow-scrolling: touch;
  }
  .wrap{width:100%;max-width:880px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px;line-height:1.6}
  
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:620px){.grid{grid-template-columns:1fr}}
  .team{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:16px}
  .team h2{font-size:15px;margin:0 0 10px;color:var(--accent2);display:flex;align-items:center;gap:8px}
  .team.away h2{color:var(--warn)}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
  
  input { font-size: 16px !important; outline: none; transition: border-color 0.15s; -webkit-appearance: none; }
  
  .num-input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0e1626;color:var(--txt);font-variant-numeric:tabular-nums}
  .num-input:focus{border-color:var(--accent2)}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  
  .odds-panel { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .panel-title { font-size: 14px; color: var(--accent); margin-bottom: 12px; font-weight: 700; display: flex; justify-content: space-between; }
  .panel-title span { font-size: 11px; color: var(--muted); font-weight: normal; }

  .mode-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .mode-row label { margin:0; font-size:12px; color:var(--muted); }
  .mode-row select {
    font-size:16px; padding:8px 10px; border-radius:8px;
    border:1px solid var(--line); background:#0e1626; color:var(--txt);
    -webkit-appearance:none; appearance:none; outline:none; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
    background-size:5px 5px,5px 5px; background-repeat:no-repeat;
    padding-right:30px;
  }
  .mode-row select:focus { border-color:var(--accent2); }

  .odds-inputs { display: flex; gap: 8px; }
  .odds-inputs input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: #0e1626; color: var(--txt); text-align: center; }
  .odds-inputs input:focus { border-color: var(--accent); }

  .actions{display:flex;gap:12px;margin-top:20px}
  button{padding:14px;border:0;border-radius:14px;cursor:pointer;font-size:16px;font-weight:800;color:#06231a;background:linear-gradient(135deg,#3ddc97,#4da3ff);flex:1; -webkit-tap-highlight-color: transparent;}
  button:active{transform:translateY(1px)}
  button.ghost{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600;padding:14px 20px}
  button.ghost:active{color:var(--txt);border-color:var(--accent2);background:rgba(77,163,255,.08)}
  
  #result{display:none;margin-top:26px}
  #result.show{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* 深度走勢評語卡片 */
  .commentary-box {
    background: linear-gradient(135deg, rgba(61,220,151,0.1), rgba(77,163,255,0.05));
    border: 1px solid var(--accent);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
    line-height: 1.7;
    font-size: 14px;
    box-shadow: 0 8px 32px -12px rgba(61,220,151,0.2);
  }
  .commentary-box h3 {
    margin: 0 0 12px;
    font-size: 16px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .commentary-box p { margin: 0 0 12px; }
  .commentary-box p:last-child { margin-bottom: 0; }
  .commentary-box b { color: var(--txt); }
  .tag-phase {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 800;
    margin-right: 6px;
  }
  .phase-early { background: rgba(77,163,255,.2); color: #7fc1ff; }
  .phase-mid { background: rgba(255,179,71,.2); color: #ffcd80; }
  .phase-late { background: rgba(61,220,151,.2); color: #77eeb1; }

  /* 頁籤切換器 */
  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    padding: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, rgba(61,220,151,0.15), rgba(77,163,255,0.15));
    border-color: var(--accent);
    color: var(--accent);
  }
  .tab-btn.ht.active {
    background: linear-gradient(135deg, rgba(77,163,255,0.15), rgba(255,179,71,0.15));
    border-color: var(--accent2);
    color: var(--accent2);
  }

  /* 支援多卡片動態佈局 */
  .scores{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:14px;margin-bottom: 16px;}
  @media(max-width:620px){.scores{grid-template-columns:1fr 1fr}}
  
  .score{position:relative;background:linear-gradient(160deg,#173049,#101b2c);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center}
  .score.one{border-color:rgba(61,220,151,.55);box-shadow:0 0 0 1px rgba(61,220,151,.15) inset,0 12px 30px -18px #3ddc97}
  .tag{font-size:11px;letter-spacing:1px;color:var(--muted); margin-bottom: 6px;}
  .big{font-size:36px;font-weight:800;margin:4px 0;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .one .big{color:var(--accent)}
  .pct{font-size:13px;color:var(--muted)}
  .pct b{color:var(--txt)}

  /* 星號標記（卡片用） */
  .star{position:absolute;top:8px;right:10px;font-size:16px;line-height:1;}
  .star.silver{color:#c9d4e6;text-shadow:0 0 6px rgba(200,210,230,.65);}
  .star.gold{color:#ffd700;text-shadow:0 0 8px rgba(255,215,0,.75);}

  /* 星號標記（表格用） */
  .t-star{font-size:14px;margin-left:6px;line-height:1;}
  .t-star.silver{color:#c9d4e6;text-shadow:0 0 6px rgba(200,210,230,.65);}
  .t-star.gold{color:#ffd700;text-shadow:0 0 8px rgba(255,215,0,.75);}
  
  .extra-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media(max-width:620px){.extra-sections{grid-template-columns:1fr}}
  
  .extra-box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .extra-title { font-size: 13px; color: var(--muted); margin-bottom: 10px; text-align: center; letter-spacing: 1px; }
  
  .tg-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tg-card { background: #0e1626; border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; }
  .tg-card.one { border-color: rgba(77,163,255,.55); background: #15233a; }
  .tg-card .tag { font-size: 10px; color: var(--muted); }
  .tg-card .val { font-size: 20px; font-weight: 800; color: var(--accent2); margin: 4px 0; }
  .tg-card.one .val { color: var(--accent); }
  .tg-card .pct { font-size: 11px; }

  .lam{display:flex;justify-content:center;gap:22px;font-size:12px;color:var(--muted);margin-top:14px}
  .lam b{color:var(--txt)}
  
  .panel{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .panel h3{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:1px}
  
  .bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
  .bar .nm{width:96px;flex:none;color:var(--muted)}
  .bar .tr{flex:1;height:8px;background:#0e1626;border-radius:99px;overflow:hidden}
  .bar .fl{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#3ddc97,#4da3ff);transition:width .5s ease}
  .bar .vl{width:56px;text-align:right;font-variant-numeric:tabular-nums}
  
  .table-container { max-height: 400px; overflow-y: auto; border-radius: 8px; border: 1px solid var(--line); }
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:12px;background:var(--card);position:sticky;top:0;z-index:1;box-shadow:0 1px 0 var(--line)}
  th:last-child,td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  tr:hover td { background: rgba(255,255,255,0.02); }
</style>
</head>
<body>
<div class="wrap">
  <h1>專屬預測器 (全場/半場)</h1>
  <p class="sub">全場採大/細 2.5；半場固定採大/細 1.5。請至少完整填寫全場或半場其中一組數據。固定顯示前四比分；任一市場 ≥ 60% 時標示星號。</p>

  <div class="grid">
    <div class="team">
      <h2>🏠 主隊數據</h2>
      <div class="row">
        <div><label>全場場均得分 (選填)</label><input type="text" inputmode="decimal" class="num-input" id="hGF" placeholder="例如 2.22"></div>
        <div><label>全場場均失球 (選填)</label><input type="text" inputmode="decimal" class="num-input" id="hGA" placeholder="例如 0.89"></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <div><label>半場場均得分 (選填)</label><input type="text" inputmode="decimal" class="num-input" id="hGF_ht" placeholder="例如 1.05"></div>
        <div><label>半場場均失球 (選填)</label><input type="text" inputmode="decimal" class="num-input" id="hGA_ht" placeholder="例如 0.45"></div>
      </div>
    </div>
    <div class="team away">
      <h2>✈️ 客隊數據</h2>
      <div class="row">
        <div><label>全場場均得分 (選填)</label><input type="text" inputmode="decimal" class="num-input" id="aGF" placeholder="例如 0.50"></div>
        <div><label>全場場均失球 (選填)</label><input type="text" inputmode="decimal" class="num-input" id="aGA" placeholder="例如 1.63"></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <div><label>半場場均得分 (選填)</label><input type="text" inputmode="decimal" class="num-input" id="aGF_ht" placeholder="例如 0.25"></div>
        <div><label>半場場均失球 (選填)</label><input type="text" inputmode="decimal" class="num-input" id="aGA_ht" placeholder="例如 0.80"></div>
      </div>
    </div>
  </div>

  <div class="odds-panel">
    <div class="panel-title">市場 1X2 賠率 <span>主 - 和 - 客，留空則純看數據</span></div>
    <div class="mode-row">
      <label for="mode">計算模式</label>
      <select id="mode">
        <option value="mode1">模式 1（舊模式 2.5 / 3.5）</option>
        <option value="mode2" selected>模式 2（賠率放大 λ）</option>
      </select>
    </div>
    <div class="odds-inputs">
      <input type="text" inputmode="decimal" class="num-input" id="oddH" placeholder="主勝賠率">
      <input type="text" inputmode="decimal" class="num-input" id="oddD" placeholder="和局賠率">
      <input type="text" inputmode="decimal" class="num-input" id="oddA" placeholder="客勝賠率">
    </div>
  </div>

  <div class="actions">
    <button id="go">開始預測</button>
    <button id="clear" class="ghost">清除</button>
  </div>

  <div id="result">
    <div id="commentary-container"></div>

    <div class="tabs" id="tabs">
      <button id="tab-full" class="tab-btn" onclick="switchTab('full')">全場預測 (2.5球)</button>
      <button id="tab-ht" class="tab-btn ht" onclick="switchTab('ht')">半場預測 (1.5球)</button>
    </div>
    <div id="result-content"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const MAXG = 10;

let fullHtml = '';
let htHtml = '';
let commentaryHtml = '';
let isFullValid = false;
let isHtValid = false;

const fact = n => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
const poisson = (k, l) => Math.exp(-l) * Math.pow(l, k) / fact(k);
const pct = p => (p * 100).toFixed(1) + '%';

function normalizeTo100(a, b, c){
  const r = x => Math.round(x * 1000) / 10;
  let x = r(a), y = r(b), z = r(c);
  let diff = Math.round((100 - (x + y + z)) * 10) / 10;
  if (diff !== 0) {
    if (x >= y && x >= z) x += diff;
    else if (y >= z) y += diff;
    else z += diff;
  }
  return [x.toFixed(1), y.toFixed(1), z.toFixed(1)];
}

function restrictInput(el) {
  const originalValue = el.value;
  const start = el.selectionStart;
  let val = originalValue.replace(/[^0-9.]/g, '');
  const parts = val.split('.');
  if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
  if (val.startsWith('.')) val = '0' + val;

  if (val !== originalValue) {
    el.value = val;
    let newPos = originalValue.slice(0, start).replace(/[^0-9.]/g, '').length;
    if (originalValue.startsWith('.') && val.startsWith('0.')) newPos++;
    if (newPos > val.length) newPos = val.length;
    el.setSelectionRange(newPos, newPos);
  }
}

function normalizeInput(el){
  let v = el.value.trim();
  if (v === '') return;
  let originalValue = v;
  if (/^0\d+$/.test(v)) { v = (parseInt(v, 10) / 100).toFixed(2); } 
  else if (/^\d+$/.test(v)){ const n = parseInt(v, 10); if (n >= 100) v = (n / 100).toFixed(2); } 
  else if (/^\d*\.\d+$/.test(v) || /^\d+\.$/.test(v)){ const n = parseFloat(v); if (isFinite(n)) v = n.toFixed(2); }
  if (v !== originalValue) el.value = v;
}

document.querySelectorAll('input').forEach(el => {
  el.addEventListener('input', () => restrictInput(el));
  el.addEventListener('keydown', (e) => { 
    if (e.key === 'Enter') { normalizeInput(el); predict(); }
  });
  if (el.classList.contains('num-input')) el.addEventListener('blur', () => normalizeInput(el));
});

$('clear').addEventListener('click', () => {
  document.querySelectorAll('input[type=text]').forEach(el => el.value = '');
  $('result').classList.remove('show');
  fullHtml = ''; htHtml = ''; commentaryHtml = '';
  isFullValid = false; isHtValid = false;
  $('result-content').innerHTML = '';
  $('commentary-container').innerHTML = '';
});

$('go').addEventListener('click', predict);

function switchTab(tab) {
  if (tab === 'full') {
    if (!isFullValid) { alert('全場數據不完整'); return; }
    $('tab-full').classList.add('active');
    $('tab-ht').classList.remove('active');
    $('result-content').innerHTML = fullHtml;
  } else {
    if (!isHtValid) { alert('半場數據不完整'); return; }
    $('tab-ht').classList.add('active');
    $('tab-full').classList.remove('active');
    $('result-content').innerHTML = htHtml;
  }
}

// 生成豐富的深度評語 (已修復大比分矛盾問題)
function generateCommentary(fullStats, htStats) {
  const f = fullStats;
  const h = htStats;
  const expTotal = f.final_lH + f.final_lA; // 全場總進球期望值
  
  let text = `<div class="commentary-box"><h3>🔮 賽事深度走勢分析</h3>`;

  // 1. 整體格局
  let matchType = "";
  if (f.homeWin > 0.65) matchType = `<b>主隊具備壓倒性優勢</b>，客隊防線恐將面臨災難級考驗。`;
  else if (f.awayWin > 0.65) matchType = `<b>客隊展現出極強的碾壓實力</b>，主隊主場恐難招架。`;
  else if (Math.abs(f.homeWin - f.awayWin) < 0.10) matchType = "雙方實力非常接近，這是一場<b>勢均力敵的拉鋸戰</b>。";
  else matchType = "一方略佔上風，但比賽依然保有懸念。";
  text += `<p>📊 <b>整體格局：</b>${matchType}</p>`;

  // 2. 進球期望與基調
  let goalTone = "";
  if (expTotal >= 3.8) goalTone = `本場比賽預期總進球高達 <b>${expTotal.toFixed(1)}</b> 球，這預示著一場<b>進球大戰或單方面屠殺</b>即將上演。`;
  else if (expTotal >= 2.7) goalTone = `預期總進球約 <b>${expTotal.toFixed(1)}</b> 球，比賽場面預計相對開放，進球數不會少。`;
  else if (expTotal <= 1.8) goalTone = `預期總進球僅 <b>${expTotal.toFixed(1)}</b> 球，這大概率是一場戰術嚴密、節奏沉悶的防守大戰。`;
  else goalTone = `預期總進球約 <b>${expTotal.toFixed(1)}</b> 球，進球數屬於正常聯賽水平。`;
  text += `<p>⚽ <b>進球基調：</b>${goalTone}</p>`;

  // 3. 前期（上半場）
  let earlyText = "";
  const hOver = h.over; 
  if (hOver > 0.60) earlyText += "預計開局階段節奏極快，雙方防線早早將面臨考驗，極有可能在前45分鐘內就出現2個或以上的進球。";
  else if (hOver < 0.35) earlyText += "開局階段雙方大概率會以試探為主，中場的絞殺會非常激烈，上半場極有可能是一球定音，甚至半場互交白卷。";
  else earlyText += "上半場的節奏相對適中，雙方會在試探中尋找機會，半場結束前可能會有進球產生。";

  if (h.homeWin > h.awayWin + 0.20) earlyText += " 主隊一開場就會借助主場之利大舉壓上，試圖搶佔先機。";
  else if (h.awayWin > h.homeWin + 0.20) earlyText += " 客隊反客為主，上半場就會展現出強烈的進攻慾望。";
  else earlyText += " 雙方在上半場的控球率預計會非常接近，場面陷入膠著。";
  text += `<p><span class="tag-phase phase-early">前期 (0-45')</span>${earlyText}</p>`;

  // 4. 中期（下半場前中段 45'-75'）
  let midText = "";
  const secondHalfLH = f.final_lH - h.final_lH;
  const secondHalfLA = f.final_lA - h.final_lA;
  
  if (secondHalfLH + secondHalfLA > h.final_lH + h.final_lA) {
    midText += "易邊再戰後，比賽的畫風將發生劇變！雙方教練大概率會進行戰術調整，<b>下半場的進球效率將大幅提升</b>，這是一場「下半場惹不起」的比賽。";
  } else if (expTotal > 3.0 && hOver < 0.4) {
    midText += "中場休息的調整將成為比賽轉折點。上半場的沉悶將被打破，<b>下半場極可能演變為單方面的攻防演練或對攻大戰</b>，進球將集中在下半場爆發。";
  } else {
    midText += "下半場中段將進入白熱化的拉鋸戰，中場的控制權爭奪將決定比賽的走向，雙方都會在攻防轉換中尋找致命一擊。";
  }
  
  if (f.btts > 0.60) {
    midText += " 由於雙方防線都存在漏洞，這段時間大概率會演變成「互捅局」，雙方都有進球入帳。";
  } else if (1 - f.btts > 0.60) {
    midText += " 弱勢一方的進攻可能會徹底啞火，只能被迫退守半場承受巨大壓力。";
  }
  text += `<p><span class="tag-phase phase-mid">中期 (45-75')</span>${midText}</p>`;

  // 5. 後期（75'-90'+）
  let lateText = "";
  if (expTotal > 3.0) {
    lateText += "比賽進入最後20分鐘，隨著體能的下降，防守端的漏洞會被進一步放大，這不僅是一場技戰術的比拼，<b>更可能上演大比分的屠殺或絕殺劇本</b>。";
  } else if (expTotal <= 1.8) {
    lateText += "比賽進入尾聲，領先的一方大概率會通過控球和戰術犯規來消耗時間，比賽節奏會明顯放緩，變成半場攻防演練，很難再有比分的改變。";
  } else {
    lateText += "尾段雙方可能會因為急於求成而暴露出空檔，比賽的勝負很可能在最後時刻才見分曉。";
  }
  
  if (f.draw > 0.30) {
    lateText += " 且由於和局機率極高，若此時比分膠著，雙方可能會默契地接受各取一分的結果，保守收場。";
  }
  text += `<p><span class="tag-phase phase-late">後期 (75-90')</span>${lateText}</p>`;

  // 6. 總結劇本 (依賴總進球期望與 BTTS)
  text += `<p style="margin-top:16px; padding-top:12px; border-top:1px dashed rgba(255,255,255,0.1); color:var(--muted); font-size:13px;">💡 <b>劇本預測：</b>`;
  
  if (expTotal >= 4.0) {
    text += "這將是一場極度暴力的比賽，強隊將徹底撕裂對手防線，極大概率打出大比分賽果。";
  } else if (expTotal >= 3.0) {
    text += "進球大戰一觸即發，雙方都不會保守，這是一場精彩紛呈的對攻好戲。";
  } else if (expTotal <= 1.5) {
    text += "極度沉悶的防守大戰，誰先犯錯誰就輸，0-0 或 1-0 是最大概率的走向。";
  } else {
    if (f.btts > 0.60) {
      text += "強烈看好雙方都能破門，這是一場防守無法主導的比賽。";
    } else if (1 - f.btts > 0.60) {
      text += "大概率有一方會被零封，防守更穩固的一方將憑藉微弱優勢笑到最後。";
    } else {
      text += "勝負難料，進球數可能會控制在常規範圍內，勝負就在一線之間。";
    }
  }
  text += `</p></div>`;
  
  return text;
}

function renderBlock(stats, isHalf) {
  const { homeWin, draw, awayWin, over, btts, final_lH, final_lA, list, goalProbs, hGoalProbs, aGoalProbs, ouLine, isHomeFav } = stats;
  
  const sorted = [...list].sort((x, y) => {
    if (Math.abs(x.p - y.p) > 1e-6) return y.p - x.p;
    if (isHomeFav) {
      if (x.h > x.a && y.h <= y.a) return -1;
      if (y.h > y.a && x.h <= x.a) return 1;
    } else {
      if (x.a > x.h && y.a <= y.h) return -1;
      if (y.a > y.h && x.a <= x.h) return 1;
    }
    return 0;
  });
  
  const topScores = sorted.slice(0, 4);

  const big = over >= 0.60;
  const small = (1 - over) >= 0.60;
  const bttsHot = btts >= 0.60;
  
  function getStar(s) {
    const meetsSize = (big && (s.h + s.a) > ouLine) || (small && (s.h + s.a) < ouLine);
    const meetsBTTS = bttsHot && s.h > 0 && s.a > 0;
    if (!meetsSize && !meetsBTTS) return null;
    return (meetsSize && meetsBTTS) ? 'gold' : 'silver';
  }

  const getTop2 = arr => arr.map((p, val) => ({ val, p })).sort((a, b) => b.p - a.p).slice(0, 2);
  const top2Total = getTop2(goalProbs);
  const top2H = getTop2(hGoalProbs);
  const top2A = getTop2(aGoalProbs);

  const [hStr, dStr, aStr] = normalizeTo100(homeWin, draw, awayWin);
  const bars = [
    ['主勝', homeWin, hStr + '%'],
    ['和局', draw, dStr + '%'],
    ['客勝', awayWin, aStr + '%'],
    ['大 ' + ouLine + ' 球', over, pct(over)],
    ['細 ' + ouLine + ' 球', 1 - over, pct(1 - over)],
    ['兩隊入球', btts, pct(btts)]
  ];

  const labels = ['首選比分','次選比分','三選比分','四選比分'];
  const filteredList = sorted.filter(s => s.p >= 0.01);

  return `
    <div class="scores">
      ${topScores.map((s, idx) => {
        const st = getStar(s);
        return `
          <div class="score ${idx === 0 ? 'one' : ''}">
            ${st ? `<div class="star ${st}">★</div>` : ''}
            <div class="tag">${labels[idx]}</div>
            <div class="big">${s.h} - ${s.a}</div>
            <div class="pct">機率 <b>${pct(s.p)}</b></div>
          </div>`;
      }).join('')}
    </div>

    <div class="extra-sections">
      <div class="extra-box">
        <div class="extra-title">雙選總入球數</div>
        <div class="tg-cards">
          ${top2Total.map((g, idx) => `
            <div class="tg-card ${idx === 0 ? 'one' : ''}">
              <div class="tag">${idx === 0 ? '首選' : '次選'}</div>
              <div class="val">${g.val} 球</div>
              <div class="pct">${pct(g.p)}</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="extra-box">
        <div class="extra-title">雙選球隊入球數</div>
        <div class="tg-cards" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
          <div class="tg-card ${top2H[0].val >= top2H[1].val ? 'one' : ''}">
            <div class="tag">主首選</div><div class="val">${top2H[0].val}</div><div class="pct">${pct(top2H[0].p)}</div>
          </div>
          <div class="tg-card">
            <div class="tag">主次選</div><div class="val">${top2H[1].val}</div><div class="pct">${pct(top2H[1].p)}</div>
          </div>
          <div class="tg-card ${top2A[0].val >= top2A[1].val ? 'one' : ''}">
            <div class="tag">客首選</div><div class="val">${top2A[0].val}</div><div class="pct">${pct(top2A[0].p)}</div>
          </div>
          <div class="tg-card">
            <div class="tag">客次選</div><div class="val">${top2A[1].val}</div><div class="pct">${pct(top2A[1].p)}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="lam">
      <div>期望入球 <b>${final_lH.toFixed(2)}</b></div>
      <div>期望入球 <b>${final_lA.toFixed(2)}</b></div>
    </div>

    <div class="panel">
      <h3>最終賽果機率</h3>
      <div>
        ${bars.map(([nm, v, str]) => `
          <div class="bar">
            <div class="nm">${nm}</div>
            <div class="tr"><div class="fl" style="width: ${(v * 100).toFixed(1)}%;"></div></div>
            <div class="vl">${str}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="panel">
      <h3>完整比分機率分佈 (大於 1%)</h3>
      <div class="table-container">
        <table>
          <thead><tr><th>#</th><th>比分（主 - 客）</th><th>機率</th></tr></thead>
          <tbody>
            ${filteredList.map((s, i) => {
              const st = getStar(s);
              const starHtml = st ? `<span class="t-star ${st}">★</span>` : '';
              return `<tr><td>${i + 1}</td><td>${s.h} - ${s.a}${starHtml}</td><td>${pct(s.p)}</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function analyzeData(lH, lA, ratioH, ratioA, ratioD, ouLine, isHomeFav) {
  const m = [];
  let finalTotal = 0;
  for (let i = 0; i <= MAXG; i++){
    m[i] = [];
    for (let j = 0; j <= MAXG; j++){
      let p = poisson(i, lH) * poisson(j, lA);
      if (ratioH !== undefined) {
        if (i > j) p *= ratioH;
        else if (i === j) p *= ratioD;
        else p *= ratioA;
      }
      m[i][j] = p;
      finalTotal += p;
    }
  }

  let homeWin = 0, draw = 0, awayWin = 0, over = 0, btts = 0;
  let final_lH = 0, final_lA = 0;
  const list = [];
  const goalProbs = Array(2 * MAXG + 1).fill(0);
  const hGoalProbs = Array(MAXG + 1).fill(0);
  const aGoalProbs = Array(MAXG + 1).fill(0);

  for (let i = 0; i <= MAXG; i++){
    for (let j = 0; j <= MAXG; j++){
      const p = m[i][j] / finalTotal;
      if (i > j) homeWin += p;
      else if (i === j) draw += p;
      else awayWin += p;
      
      if (i + j > ouLine) over += p;
      if (i > 0 && j > 0) btts += p;
      
      final_lH += i * p;
      final_lA += j * p;
      goalProbs[i + j] += p;
      hGoalProbs[i] += p;
      aGoalProbs[j] += p;
      
      list.push({ h: i, a: j, p });
    }
  }

  return { homeWin, draw, awayWin, over, btts, final_lH, final_lA, list, goalProbs, hGoalProbs, aGoalProbs, ouLine, isHomeFav };
}

function predict(){
  document.querySelectorAll('.num-input').forEach(normalizeInput);

  const hGF = parseFloat($('hGF').value), hGA = parseFloat($('hGA').value);
  const aGF = parseFloat($('aGF').value), aGA = parseFloat($('aGA').value);

  const hGF_ht = parseFloat($('hGF_ht').value), hGA_ht = parseFloat($('hGA_ht').value);
  const aGF_ht = parseFloat($('aGF_ht').value), aGA_ht = parseFloat($('aGA_ht').value);

  isFullValid = [hGF, hGA, aGF, aGA].every(v => isFinite(v) && v >= 0);
  isHtValid = [hGF_ht, hGA_ht, aGF_ht, aGA_ht].every(v => isFinite(v) && v >= 0);

  if (!isFullValid && !isHtValid) {
    alert('請至少完整填寫一組全場或半場數據。');
    return;
  }

  const mode = $('mode').value;
  const oddH = parseFloat($('oddH').value);
  const oddD = parseFloat($('oddD').value);
  const oddA = parseFloat($('oddA').value);
  const hasOdds = [oddH, oddD, oddA].every(v => isFinite(v) && v > 1);

  if (mode === 'mode2' && !hasOdds) {
    alert('模式 2 需要完整的 1X2 賠率（主／和／客）。');
    return;
  }

  let ratioH, ratioA, ratioD;
  let rH, rA;
  if (hasOdds) {
    if (mode === 'mode2') {
      rH = Math.sqrt(oddD / oddH);
      rA = Math.sqrt(oddD / oddA);
    } else {
      ratioH = 2.5 / oddH;
      ratioA = 2.5 / oddA;
      ratioD = 3.5 / oddD;
    }
  }

  fullHtml = '';
  htHtml = '';
  commentaryHtml = '';

  let fullStats = null;
  let htStats = null;

  // 1. 計算全場
  if (isFullValid) {
    let lH = Math.min(Math.max((hGF + aGA) / 2, 0.05), 6);
    let lA = Math.min(Math.max((aGF + hGA) / 2, 0.05), 6);
    if (hasOdds && mode === 'mode2') {
      lH = Math.min(Math.max(lH * rH, 0.05), 6);
      lA = Math.min(Math.max(lA * rA, 0.05), 6);
    }
    const fav = hasOdds ? (oddH < oddA) : (lH > lA);
    fullStats = analyzeData(lH, lA, ratioH, ratioA, ratioD, 2.5, fav);
    fullHtml = renderBlock(fullStats, false);
  }

  // 2. 計算半場 (固定 1.5 盤口)
  if (isHtValid) {
    let lH = Math.min(Math.max((hGF_ht + aGA_ht) / 2, 0.05), 6);
    let lA = Math.min(Math.max((aGF_ht + hGA_ht) / 2, 0.05), 6);
    if (hasOdds && mode === 'mode2') {
      lH = Math.min(Math.max(lH * rH, 0.05), 6);
      lA = Math.min(Math.max(lA * rA, 0.05), 6);
    }
    const fav = hasOdds ? (oddH < oddA) : (lH > lA);
    htStats = analyzeData(lH, lA, ratioH, ratioA, ratioD, 1.5, fav);
    htHtml = renderBlock(htStats, true);
  }

  // 3. 只有當全場與半場都完整時，才生成深度評語
  if (isFullValid && isHtValid) {
    commentaryHtml = generateCommentary(fullStats, htStats);
  }

  $('commentary-container').innerHTML = commentaryHtml;
  $('result').classList.add('show');
  
  if (isFullValid) {
    switchTab('full');
  } else {
    switchTab('ht');
  }
}
</script>
