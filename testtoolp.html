<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>🛡️ 極保守 ROI 挖掘器</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;padding:16px;max-width:1200px;margin:auto;background:#f0f2f5}
textarea{width:100%;font-family:monospace;font-size:12px;padding:8px;border:1px solid #ccc;border-radius:4px}
#input{height:80px}
button{padding:10px 22px;font-size:15px;margin:6px 4px 6px 0;cursor:pointer;background:#007bff;color:#fff;border:none;border-radius:5px;font-weight:bold}
button:hover{background:#0056b3}
button:disabled{background:#999}
button.txt{background:#28a745}
#log{background:#0c0c0c;color:#d4d4d4;border-radius:6px;padding:14px;margin-top:12px;height:350px;overflow-y:auto;font-family:Consolas,monospace;font-size:12px;white-space:pre;line-height:1.5;border:1px solid #222}
.l-head{color:#fff;font-weight:bold}
.l-ok{color:#4ade80;font-weight:bold}.l-warn{color:#ffc107}.l-err{color:#f87171}
.l-info{color:#4ea3ff}.l-best{color:#facc15;font-weight:bold;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
select{padding:6px;border-radius:4px;border:1px solid #ccc;font-size:14px}
.chk{padding:4px 10px;font-size:12px;background:#fff;border:1px solid #ccc;border-radius:4px;cursor:pointer}
.best{background:#d4edda;padding:16px;border-radius:6px;margin-top:12px;border:1px solid #c3e6cb;display:none}
.big{font-size:36px;font-weight:bold;text-align:center;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-top:12px}
.cell{background:#fff;padding:10px;border-radius:6px;text-align:center;border:1px solid #ddd}
.cell .n{font-size:20px;font-weight:bold;color:#0a7a0a}
.cell .l{font-size:11px;color:#666;margin-top:2px}
.cell.warn .n{color:#c00}
.box{background:#fff;padding:10px;border-radius:4px;margin-top:10px;border:1px solid #ddd}
.out{width:100%;height:180px;font-family:monospace;font-size:11px;padding:8px;border:1px solid #ddd;border-radius:4px;background:#f8f9fa;white-space:pre;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px;background:#fff}
th,td{border:1px solid #ccc;padding:5px;text-align:center}
th{background:#e9ecef}
.pos{color:#0a7a0a;font-weight:bold}.neg{color:#c00;font-weight:bold}
.verdict{padding:16px;border-radius:8px;text-align:center;margin:10px 0;font-size:18px;font-weight:bold}
</style>
</head>
<body>

<h2>🛡️ 極保守 ROI 挖掘器</h2>
<div style="font-size:13px;color:#555;margin-bottom:8px">
只用 <b>最強 1-3 條規則</b>｜每條最多 <b>2 個條件</b>｜要求覆蓋 ≥ 10%｜5-fold 交叉驗證
</div>

<textarea id="input" placeholder=""></textarea>

<div class="row">
  <label>保留規則數：</label>
  <select id="maxRules">
    <option value="1">1 條</option>
    <option value="2" selected>2 條</option>
    <option value="3">3 條</option>
  </select>
  <label>最少覆蓋：</label>
  <select id="minCover">
    <option value="0.05">5%</option>
    <option value="0.10" selected>10%</option>
    <option value="0.15">15%</option>
    <option value="0.20">20%</option>
  </select>
  <button id="btnRun" onclick="start()">🚀 開始</button>
</div>

<div id="log">等待開始...</div>

<div class="best" id="best">
  <div class="verdict" id="verdict">-</div>
  <div class="big" id="big">-</div>
  <div style="text-align:center;font-size:13px;color:#666" id="detail"></div>

  <div class="grid">
    <div class="cell" id="c1"><div class="n" id="n1">-</div><div class="l">5-fold 平均 ROI</div></div>
    <div class="cell" id="c2"><div class="n" id="n2">-</div><div class="l">5-fold 標準差</div></div>
    <div class="cell" id="c3"><div class="n" id="n3">-</div><div class="l">正報酬 fold 數</div></div>
    <div class="cell" id="c4"><div class="n" id="n4">-</div><div class="l">全資料 ROI</div></div>
  </div>

  <div class="box">
    <div class="label" style="font-weight:bold;font-size:13px;margin-bottom:6px">🟢 公式</div>
    <button class="txt" onclick="copyIt()">📋 複製</button>
    <textarea id="out" class="out" readonly></textarea>
  </div>

  <div style="margin-top:12px">
    <h3 style="font-size:14px">📋 規則詳情</h3>
    <div id="rules"></div>
  </div>
</div>

<script>
'use strict';

var FEATURES = [
  'A','B','C','D','E','F',
  '|A-B|','|A-C|','|A-D|','|A-E|','|A-F|',
  '|B-C|','|B-D|','|B-E|','|B-F|',
  '|C-D|','|C-E|','|C-F|',
  '|D-E|','|D-F|','|E-F|',
  'A-B','A-C','B-C','D-F','E-D',
  'A+B','B+C','D+E','E+F','D+F','A+C',
  'A+B+C','D+E+F','A+D',
  'A/C','D/F','D/(D+F)',
  'MAX(A,B,C)','MIN(A,B,C)','MAX(D,E,F)','MIN(D,E,F)'
];
var FCOUNT = FEATURES.length;
var OPS = ['>', '>=', '<', '<='];
var RESULTS = ['H', 'D', 'A'];

var running = false;

function log(text, cls){
  var el = document.getElementById('log');
  if(el.dataset.started !== '1'){ el.textContent = ''; el.dataset.started = '1'; }
  var div = document.createElement('div');
  if(cls) div.className = 'l-' + cls;
  div.textContent = text;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

/* 資料解析 */
function parseData(text){
  var rows = [], seen = new Set();
  var lines = text.split('\n');
  for(var i=0;i<lines.length;i++){
    var p = lines[i].trim().split(/\s+/);
    if(p.length < 8) continue;
    var v = p.slice(0,6).map(Number);
    var r = p[7];
    if(v.some(isNaN)) continue;
    if(r !== 'H' && r !== 'D' && r !== 'A') continue;
    var sig = v.join('|') + '|' + p[6] + '|' + r;
    if(seen.has(sig)) continue;
    seen.add(sig);
    rows.push({ A:v[0], B:v[1], C:v[2], D:v[3], E:v[4], F:v[5], result:r });
  }
  return rows;
}

function extractFeatures(rows){
  var N = rows.length;
  var mat = new Array(N);
  for(var i=0;i<N;i++){
    var r = rows[i];
    var A=r.A, B=r.B, C=r.C, D=r.D, E=r.E, F=r.F;
    var f = new Float64Array(FCOUNT);
    f[0]=A; f[1]=B; f[2]=C; f[3]=D; f[4]=E; f[5]=F;
    f[6]=Math.abs(A-B); f[7]=Math.abs(A-C); f[8]=Math.abs(A-D); f[9]=Math.abs(A-E); f[10]=Math.abs(A-F);
    f[11]=Math.abs(B-C); f[12]=Math.abs(B-D); f[13]=Math.abs(B-E); f[14]=Math.abs(B-F);
    f[15]=Math.abs(C-D); f[16]=Math.abs(C-E); f[17]=Math.abs(C-F);
    f[18]=Math.abs(D-E); f[19]=Math.abs(D-F); f[20]=Math.abs(E-F);
    f[21]=A-B; f[22]=A-C; f[23]=B-C; f[24]=D-F; f[25]=E-D;
    f[26]=A+B; f[27]=B+C; f[28]=D+E; f[29]=E+F; f[30]=D+F; f[31]=A+C;
    f[32]=A+B+C; f[33]=D+E+F; f[34]=A+D;
    f[35] = C === 0 ? 0 : A/C;
    f[36] = F === 0 ? 0 : D/F;
    f[37] = (D+F) === 0 ? 0 : D/(D+F);
    f[38]=Math.max(A,B,C); f[39]=Math.min(A,B,C);
    f[40]=Math.max(D,E,F); f[41]=Math.min(D,E,F);
    mat[i] = f;
  }
  return mat;
}

function profitOf(rows, feats, conds, TC){
  var p = 0, hits = 0;
  var code = TC === 0 ? 'H' : (TC === 1 ? 'D' : 'A');
  for(var i=0;i<rows.length;i++){
    var f = feats[i];
    var ok = true;
    for(var c=0;c<conds.length;c++){
      var cd = conds[c];
      var x = f[cd[0]];
      var v = cd[2];
      var pass = false;
      switch(cd[1]){
        case 0: pass = x > v; break;
        case 1: pass = x >= v; break;
        case 2: pass = x < v; break;
        case 3: pass = x <= v; break;
      }
      if(!pass){ ok = false; break; }
    }
    if(!ok) continue;
    hits++;
    if(rows[i].result === code) p += (cd_payout(rows[i], TC) - 100);
    else p -= 100;
  }
  return { profit: p, hits: hits };
}

function cd_payout(row, TC){
  if(TC === 0) return row.D;
  if(TC === 1) return row.E;
  return row.F;
}

function matchCond(f, cd){
  var x = f[cd[0]];
  switch(cd[1]){
    case 0: return x > cd[2];
    case 1: return x >= cd[2];
    case 2: return x < cd[2];
    case 3: return x <= cd[2];
  }
  return false;
}

function matchAll(f, conds){
  for(var i=0;i<conds.length;i++) if(!matchCond(f, conds[i])) return false;
  return true;
}

/* 生成簡單規則（1-2 條件）*/
function findSimpleRules(rows, feats, minCover){
  var N = rows.length;
  var minCnt = Math.max(3, Math.floor(N * minCover));
  var candidates = [];

  /* 1 條件規則 */
  for(var fi=0;fi<FCOUNT;fi++){
    var vals = [];
    for(var i=0;i<N;i++) vals.push(feats[i][fi]);
    vals.sort(function(a,b){ return a-b; });
    var qs = [];
    var nq = Math.min(10, vals.length);
    for(var k=1;k<=nq;k++){
      var q = vals[Math.floor(k * N / (nq + 1))];
      if(qs.indexOf(q) === -1) qs.push(q);
    }
    for(var opIdx=0;opIdx<4;opIdx++){
      for(var qi=0;qi<qs.length;qi++){
        var v = qs[qi];
        var conds = [[fi, opIdx, v]];
        for(var TC=0;TC<3;TC++){
          var res = profitOf(rows, feats, conds, TC);
          if(res.hits < minCnt) continue;
          if(res.profit <= 0) continue;
          var roi = res.profit / (res.hits * 100);
          candidates.push({ conds: conds, TC: TC, roi: roi, hits: res.hits, profit: res.profit });
        }
      }
    }
  }

  /* 2 條件規則：在 1 條最強上加第二條 */
  candidates.sort(function(a,b){ return b.roi - a.roi; });
  var top1 = candidates.slice(0, 30);
  var twoConds = [];
  for(var t=0;t<top1.length;t++){
    var base = top1[t];
    for(var fi2=0;fi2<FCOUNT;fi2++){
      if(fi2 === base.conds[0][0]) continue;
      var vals2 = [];
      for(var i2=0;i2<N;i2++) vals2.push(feats[i2][fi2]);
      vals2.sort(function(a,b){ return a-b; });
      var qs2 = [];
      var nq2 = Math.min(10, vals2.length);
      for(var k2=1;k2<=nq2;k2++){
        var q2 = vals2[Math.floor(k2 * N / (nq2 + 1))];
        if(qs2.indexOf(q2) === -1) qs2.push(q2);
      }
      for(var op2=0;op2<4;op2++){
        for(var qi2=0;qi2<qs2.length;qi2++){
          var conds2 = base.conds.concat([[fi2, op2, qs2[qi2]]]);
          var res2 = profitOf(rows, feats, conds2, base.TC);
          if(res2.hits < minCnt) continue;
          if(res2.profit <= 0) continue;
          var roi2 = res2.profit / (res2.hits * 100);
          if(roi2 > base.roi * 1.1){
            twoConds.push({ conds: conds2, TC: base.TC, roi: roi2, hits: res2.hits, profit: res2.profit });
          }
        }
      }
    }
  }
  twoConds.sort(function(a,b){ return b.roi - a.roi; });

  /* 合併 + 去重 */
  var all = candidates.concat(twoConds);
  all.sort(function(a,b){ return b.roi - a.roi; });
  return all;
}

/* 5-fold 交叉驗證：選最佳規則 */
function crossValidate(rows, maxRules, minCover){
  var N = rows.length;
  var foldSize = Math.floor(N / 5);
  var folds = [];
  var shuffled = rows.slice();
  for(var i=shuffled.length-1;i>0;i--){
    var j = Math.floor(Math.random() * (i+1));
    var t = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = t;
  }
  for(var f=0;f<5;f++){
    folds.push(shuffled.slice(f*foldSize, (f+1)*foldSize));
  }

  var foldROIs = [];
  var selectedRulesGlobal = null;

  for(var foldIdx=0;foldIdx<5;foldIdx++){
    var trainRows = [], testRows = folds[foldIdx];
    for(var fi=0;fi<5;fi++){
      if(fi !== foldIdx) trainRows = trainRows.concat(folds[fi]);
    }
    var trainFeat = extractFeatures(trainRows);
    var testFeat = extractFeatures(testRows);

    /* 在訓練 fold 上找規則 */
    var cands = findSimpleRules(trainRows, trainFeat, minCover);
    var picked = [];
    var used = [];
    for(var ci=0;ci<cands.length && picked.length<maxRules;ci++){
      var r = cands[ci];
      /* 不重複相似規則 */
      var dup = false;
      for(var ui=0;ui<used.length;ui++){
        var u = used[ui];
        if(u.TC === r.TC && u.conds[0][0] === r.conds[0][0] && Math.abs(u.conds[0][2] - r.conds[0][2]) < 1){
          dup = true; break;
        }
      }
      if(dup) continue;
      picked.push(r);
      used.push(r);
    }
    if(foldIdx === 0) selectedRulesGlobal = picked;

    /* 在測試 fold 上算 ROI */
    var tp = 0, cnt = 0;
    for(var i2=0;i2<testRows.length;i2++){
      var f2 = testFeat[i2];
      var pred = -1;
      for(var pi=0;pi<picked.length;pi++){
        if(matchAll(f2, picked[pi].conds)){ pred = picked[pi].TC; break; }
      }
      if(pred === -1) continue;  /* 不預測就跳過 */
      cnt++;
      var row = testRows[i2];
      if((pred === 0 && row.result === 'H') ||
         (pred === 1 && row.result === 'D') ||
         (pred === 2 && row.result === 'A')){
        tp += cd_payout(row, pred) - 100;
      } else {
        tp -= 100;
      }
    }
    var foldROI = cnt > 0 ? tp / (cnt * 100) : 0;
    foldROIs.push(foldROI);
    log('  Fold ' + (foldIdx+1) + '：測試 ' + cnt + ' 場，ROI ' + (foldROI*100).toFixed(2) + '%', foldROI > 0 ? 'ok' : 'err');
  }

  var avgROI = foldROIs.reduce(function(a,b){ return a+b; }, 0) / 5;
  var variance = foldROIs.reduce(function(a,b){ return a + Math.pow(b - avgROI, 2); }, 0) / 5;
  var std = Math.sqrt(variance);
  var posCount = foldROIs.filter(function(x){ return x > 0; }).length;

  return {
    avgROI: avgROI,
    std: std,
    posCount: posCount,
    foldROIs: foldROIs,
    rules: selectedRulesGlobal
  };
}

function featToSheet(feat){
  var M = {
    'A':'A2:A','B':'B2:B','C':'C2:C','D':'D2:D','E':'E2:E','F':'F2:F',
    '|A-B|':'ABS(A2:A-B2:B)','|A-C|':'ABS(A2:A-C2:C)','|A-D|':'ABS(A2:A-D2:D)',
    '|A-E|':'ABS(A2:A-E2:E)','|A-F|':'ABS(A2:A-F2:F)',
    '|B-C|':'ABS(B2:B-C2:C)','|B-D|':'ABS(B2:B-D2:D)','|B-E|':'ABS(B2:B-E2:E)',
    '|B-F|':'ABS(B2:B-F2:F)','|C-D|':'ABS(C2:C-D2:D)','|C-E|':'ABS(C2:C-E2:E)',
    '|C-F|':'ABS(C2:C-F2:F)','|D-E|':'ABS(D2:D-E2:E)','|D-F|':'ABS(D2:D-F2:F)',
    '|E-F|':'ABS(E2:E-F2:F)',
    'A-B':'(A2:A-B2:B)','A-C':'(A2:A-C2:C)','B-C':'(B2:B-C2:C)',
    'D-F':'(D2:D-F2:F)','E-D':'(E2:E-D2:D)',
    'A+B':'(A2:A+B2:B)','B+C':'(B2:B+C2:C)','D+E':'(D2:D+E2:E)',
    'E+F':'(E2:E+F2:F)','D+F':'(D2:D+F2:F)','A+C':'(A2:A+C2:C)',
    'A+B+C':'(A2:A+B2:B+C2:C)','D+E+F':'(D2:D+E2:E+F2:F)','A+D':'(A2:A+D2:D)',
    'A/C':'IF(C2:C=0,0,A2:A/C2:C)','D/F':'IF(F2:F=0,0,D2:D/F2:F)',
    'D/(D+F)':'IF(D2:D+F2:F=0,0,D2:D/(D2:D+F2:F))',
    'MAX(A,B,C)':'MAX(A2:A,B2:B,C2:C)','MIN(A,B,C)':'MIN(A2:A,B2:B,C2:C)',
    'MAX(D,E,F)':'MAX(D2:D,E2:E,F2:F)','MIN(D,E,F)':'MIN(D2:D,E2:E,F2:F)'
  };
  return M[feat] || '0';
}
function genFormula(rules){
  var inner = '"skip"';
  for(var i=rules.length-1;i>=0;i--){
    var r = rules[i];
    var parts = [];
    for(var c=0;c<r.conds.length;c++){
      var cd = r.conds[c];
      parts.push('(' + featToSheet(FEATURES[cd[0]]) + OPS[cd[1]] + (Math.round(cd[2]*100)/100) + ')');
    }
    inner = 'IF(' + parts.join('*') + ',"' + RESULTS[r.TC] + '",' + inner + ')';
  }
  return '=ARRAYFORMULA(IF((A2:A="")*(B2:B="")*(C2:C="")*(D2:D="")*(E2:E="")*(F2:F=""),"",' + inner + '))';
}

async function start(){
  running = true;
  document.getElementById('log').textContent = '';
  document.getElementById('log').dataset.started = '1';
  document.getElementById('best').style.display = 'none';

  var rows = parseData(document.getElementById('input').value);
  if(rows.length < 100){
    alert('資料太少（' + rows.length + ' 筆），至少需要 100 筆');
    return;
  }
  var maxRules = parseInt(document.getElementById('maxRules').value);
  var minCover = parseFloat(document.getElementById('minCover').value);

  log('═══════════════════════════════', 'head');
  log('🛡️ 極保守 ROI 挖掘器', 'head');
  log('═══════════════════════════════', 'head');
  log('資料：' + rows.length + ' 筆，每條規則最多 2 條件', 'info');
  log('最多 ' + maxRules + ' 條規則，最少覆蓋 ' + (minCover*100) + '%', 'info');
  log('', '');

  /* 基準 */
  var allFeat = extractFeatures(rows);
  var baseProfits = [0, 0, 0];
  for(var TC=0;TC<3;TC++){
    var p = profitOf(rows, allFeat, [], TC);
    baseProfits[TC] = p.profit;
  }
  var bestBase = Math.max(baseProfits[0], baseProfits[1], baseProfits[2]) / (rows.length * 100);
  log('全押基準：' + (bestBase*100).toFixed(2) + '%', 'warn');
  log('', '');

  log('📊 5-fold 交叉驗證...', 'head');
  var result = crossValidate(rows, maxRules, minCover);
  var avgROI = result.avgROI;
  var std = result.std;
  var posCount = result.posCount;

  log('', '');
  log('平均 ROI：' + (avgROI*100).toFixed(2) + '%', avgROI > 0 ? 'ok' : 'err');
  log('標準差：' + (std*100).toFixed(2) + '%', 'info');
  log('正 fold 數：' + posCount + '/5', posCount >= 4 ? 'ok' : (posCount >= 3 ? 'warn' : 'err'));

  /* 全資料 ROI */
  var fullROI = 0, fullCnt = 0;
  if(result.rules){
    for(var i=0;i<rows.length;i++){
      var pred = -1;
      for(var pi=0;pi<result.rules.length;pi++){
        if(matchAll(allFeat[i], result.rules[pi].conds)){ pred = result.rules[pi].TC; break; }
      }
      if(pred === -1) continue;
      fullCnt++;
      if((pred === 0 && rows[i].result === 'H') ||
         (pred === 1 && rows[i].result === 'D') ||
         (pred === 2 && rows[i].result === 'A')){
        fullROI += cd_payout(rows[i], pred) - 100;
      } else fullROI -= 100;
    }
    fullROI = fullCnt > 0 ? fullROI / (fullCnt * 100) : 0;
  }

  /* 評級 */
  var verdict, cls;
  if(posCount === 5 && avgROI > 0.03 && std < 0.05){
    verdict = '✅ 穩健！可以考慮使用'; cls = 'ok';
  } else if(posCount >= 4 && avgROI > 0.02){
    verdict = '🟢 尚可，謹慎使用'; cls = 'info';
  } else if(posCount >= 3 && avgROI > 0){
    verdict = '🟡 邊緣，不建議使用'; cls = 'warn';
  } else {
    verdict = '❌ 無效，不要使用'; cls = 'err';
  }

  /* 顯示 */
  document.getElementById('best').style.display = 'block';
  var v = document.getElementById('verdict');
  v.textContent = verdict;
  v.style.background = cls === 'ok' ? '#dcfce7' : cls === 'info' ? '#dbeafe' : cls === 'warn' ? '#fef3c7' : '#fecaca';
  v.style.color = cls === 'ok' ? '#14532d' : cls === 'info' ? '#1e3a8a' : cls === 'warn' ? '#78350f' : '#7f1d1d';

  document.getElementById('big').textContent = (avgROI*100).toFixed(2) + '%';
  document.getElementById('detail').textContent = 
    '5-fold 平均｜' + result.rules.length + ' 條規則｜全資料 ' + fullCnt + ' 場命中';

  document.getElementById('n1').textContent = (avgROI*100).toFixed(2) + '%';
  document.getElementById('n2').textContent = (std*100).toFixed(2) + '%';
  document.getElementById('n3').textContent = posCount + '/5';
  document.getElementById('n4').textContent = (fullROI*100).toFixed(2) + '%';

  document.getElementById('c1').className = 'cell' + (avgROI < 0 ? ' warn' : '');
  document.getElementById('c2').className = 'cell' + (std > 0.08 ? ' warn' : '');
  document.getElementById('c3').className = 'cell' + (posCount < 3 ? ' warn' : '');
  document.getElementById('c4').className = 'cell' + (fullROI < 0 ? ' warn' : '');

  var formula = genFormula(result.rules);
  document.getElementById('out').value = formula;

  /* 規則表 */
  var html = '<table><thead><tr><th>#</th><th>結果</th><th>條件</th><th>訓練覆蓋</th><th>訓練 ROI</th></tr></thead><tbody>';
  for(var ri=0;ri<result.rules.length;ri++){
    var r = result.rules[ri];
    var condStr = r.conds.map(function(cd){
      return FEATURES[cd[0]] + OPS[cd[1]] + (Math.round(cd[2]*100)/100);
    }).join(' & ');
    html += '<tr><td>R'+(ri+1)+'</td><td>' + RESULTS[r.TC] + '</td><td style="text-align:left;font-size:11px">' + condStr + '</td>' +
      '<td>' + r.hits + '</td><td class="' + (r.roi > 0 ? 'pos' : 'neg') + '">' + (r.roi*100).toFixed(2) + '%</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('rules').innerHTML = html;

  log('', '');
  log('═══════════════════════════════', 'head');
  log(verdict, cls);
  log('═══════════════════════════════', 'head');
  running = false;
}

function copyIt(){
  var txt = document.getElementById('out').value;
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(function(){ alert('已複製'); });
  }
}

</script>
</body>
</html>
