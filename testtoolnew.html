<body>

<script>
'use strict';

var TXT = {
  zh: {
    title: '🚀 終極強化版 v19 — 流暢不卡',
    strength: '搜尋強度：',
    run: '🚀 開始搜尋', stop: '⏹ 停止',
    hRule: '📋 演化後規則表',
    thRule: '規則', thOn: '啟用', thCond: '條件', thThen: '指向',
    thHit: '命中', thCorrect: '對', thWrong: '錯', thProfit: '盈利',
    noData: '沒有有效數據'
  },
  en: {
    title: '🚀 Ultimate v19 — Smooth Run',
    strength: 'Strength: ',
    run: '🚀 Search', stop: '⏹ Stop',
    hRule: '📋 Evolved Rules',
    thRule: 'Rule', thOn: 'On', thCond: 'Conds', thThen: 'Then',
    thHit: 'Hit', thCorrect: 'OK', thWrong: 'Err', thProfit: 'Profit',
    noData: 'No valid data'
  }
};
var LANG = 'zh';
function t(k){ return (TXT[LANG] && TXT[LANG][k]) || k; }
function setLang(lang){
  LANG = lang;
  document.getElementById('btn-zh').className = 'lang-btn' + (lang==='zh'?' active':'');
  document.getElementById('btn-en').className = 'lang-btn' + (lang==='en'?' active':'');
  document.getElementById('title').textContent = t('title');
  document.getElementById('lbl-strength').textContent = t('strength');
  document.getElementById('btnRun').textContent = t('run');
  document.getElementById('btnStop').textContent = t('stop');
  document.getElementById('h-rule').textContent = t('hRule');
}

var FEATURES = [
  'A','B','C','D','E','F',
  '|A-B|','|A-C|','|A-D|','|A-E|','|A-F|',
  '|B-C|','|B-D|','|B-E|','|B-F|',
  '|C-D|','|C-E|','|C-F|',
  '|D-E|','|D-F|','|E-F|',
  'A-B','A-C','B-C','D-F','E-D',
  'A+B','B+C','D+E','E+F','D+F','A+C',
  'A+B+C','D+E+F','A+D',
  'A/C','D/F','D/(D+F)',
  'MAX(A,B,C)','MIN(A,B,C)','MAX(D,E,F)','MIN(D,E,F)'
];
var FCOUNT = FEATURES.length;

var data = [];
var featMat = null;
var resultCodes = null;
var payouts = null;
var running = false;
var startTime = 0;
var evalCount = 0;
var currentRuleCount = 0;
var logBuffer = [];
var logTimer = null;
var LOG_MAX = 5000;

var RESULTS = ['H','D','A','skip'];
var RESULT_CODES = {H:0, D:1, A:2, skip:-1};
var OPS = ['>','>=','<','<=','==','!='];

var MAX_RULES = 120;
var MAX_GROUPS = 4;
var MAX_CONDS = 5;

/* ========== 日誌 ========== */
function nowTime(){
  if(!startTime) return '[00:00.000]';
  var ms = Date.now() - startTime;
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  return '[' + String(m).padStart(2,'0') + ':' + String(s%60).padStart(2,'0') + '.' + String(ms%1000).padStart(3,'0') + ']';
}
function pushLog(text, cls){
  logBuffer.push({ text: text, cls: cls || '' });
  if(!logTimer) logTimer = setTimeout(flushLog, 60);
}
function flushLog(){
  logTimer = null;
  if(logBuffer.length === 0) return;
  var logEl = document.getElementById('log');
  logEl.dataset.hasContent = '1';
  if(!logEl.dataset.started){
    logEl.innerHTML = '';
    logEl.dataset.started = '1';
  }
  var frag = document.createDocumentFragment();
  for(var i = 0; i < logBuffer.length; i++){
    var e = logBuffer[i];
    var div = document.createElement('div');
    if(e.cls) div.className = 'l-' + e.cls;
    div.textContent = e.text;
    frag.appendChild(div);
  }
  logBuffer = [];
  logEl.appendChild(frag);
  while(logEl.children.length > LOG_MAX) logEl.removeChild(logEl.firstChild);
  if(document.getElementById('autoScroll').checked) logEl.scrollTop = logEl.scrollHeight;
}
function flushNow(){
  if(logTimer){ clearTimeout(logTimer); logTimer = null; }
  flushLog();
}
function clearLog(){
  var logEl = document.getElementById('log');
  logEl.innerHTML = '';
  logEl.dataset.hasContent = '1';
  logEl.dataset.started = '1';
  logBuffer = [];
}

/* ⭐ 非同步 yield — 讓 UI 有機會刷新 */
function yieldUI(){
  flushNow();
  return new Promise(function(resolve){ setTimeout(resolve, 0); });
}

/* ========== 解析 ========== */
function parseData(text){
  var rows = [], seen = {}, dups = 0, total = 0;
  var lines = text.split('\n');
  for(var i = 0; i < lines.length; i++){
    var p = lines[i].trim().split(/\s+/);
    if(p.length < 8) continue;
    var v = p.slice(0,6).map(Number);
    var r = p[7];
    if(v.some(isNaN) || ['H','D','A'].indexOf(r) === -1) continue;
    total++;
    var sig = v.join('|') + '|' + p[6] + '|' + r;
    if(seen[sig]){ dups++; continue; }
    seen[sig] = 1;
    rows.push({A:v[0],B:v[1],C:v[2],D:v[3],E:v[4],F:v[5],result:r});
  }
  return {rows:rows, total:total, dups:dups};
}

/* ========== 特徵提取 ========== */
function extractFeatures(rows){
  var N = rows.length;
  var mat = new Array(N);
  for(var i = 0; i < N; i++){
    var r = rows[i];
    var A=r.A,B=r.B,C=r.C,D=r.D,E=r.E,F=r.F;
    var f = new Float64Array(FCOUNT);
    f[0]=A;f[1]=B;f[2]=C;f[3]=D;f[4]=E;f[5]=F;
    f[6]=Math.abs(A-B);f[7]=Math.abs(A-C);f[8]=Math.abs(A-D);f[9]=Math.abs(A-E);f[10]=Math.abs(A-F);
    f[11]=Math.abs(B-C);f[12]=Math.abs(B-D);f[13]=Math.abs(B-E);f[14]=Math.abs(B-F);
    f[15]=Math.abs(C-D);f[16]=Math.abs(C-E);f[17]=Math.abs(C-F);
    f[18]=Math.abs(D-E);f[19]=Math.abs(D-F);f[20]=Math.abs(E-F);
    f[21]=A-B;f[22]=A-C;f[23]=B-C;f[24]=D-F;f[25]=E-D;
    f[26]=A+B;f[27]=B+C;f[28]=D+E;f[29]=E+F;f[30]=D+F;f[31]=A+C;
    f[32]=A+B+C;f[33]=D+E+F;f[34]=A+D;
    f[35]=C===0?0:A/C;f[36]=F===0?0:D/F;f[37]=(D+F)===0?0:D/(D+F);
    f[38]=Math.max(A,B,C);f[39]=Math.min(A,B,C);
    f[40]=Math.max(D,E,F);f[41]=Math.min(D,E,F);
    mat[i] = f;
  }
  return mat;
}
function extractMeta(rows){
  var N = rows.length;
  var codes = new Int8Array(N);
  var po = new Float64Array(N * 3);
  for(var i = 0; i < N; i++){
    codes[i] = RESULT_CODES[rows[i].result];
    po[i*3]=rows[i].D; po[i*3+1]=rows[i].E; po[i*3+2]=rows[i].F;
  }
  return {codes:codes, payouts:po};
}

/* ========== 評估 ========== */
function evalCond(f, ci, opCode, val){
  var x = f[ci];
  switch(opCode){
    case 0: return x > val;
    case 1: return x >= val;
    case 2: return x < val;
    case 3: return x <= val;
    case 4: return x === val;
    case 5: return x !== val;
  }
  return false;
}
function matchRule(f, rule){
  for(var g = 0; g < rule.groups.length; g++){
    var group = rule.groups[g];
    var ok = true;
    for(var c = 0; c < group.length; c++){
      if(!evalCond(f, group[c][0], group[c][1], group[c][2])){ ok = false; break; }
    }
    if(ok) return true;
  }
  return false;
}

var ruleProfit = null;
function calcProfitWith(rules, track){
  evalCount++;
  var total = 0;
  var N = featMat.length;
  var tr = track && ruleProfit !== null;
  if(tr) for(var r = 0; r < rules.length; r++) ruleProfit[r] = 0;

  for(var i = 0; i < N; i++){
    var f = featMat[i];
    var pred = -1, hr = -1;
    for(var r = 0; r < rules.length; r++){
      var rule = rules[r];
      if(!rule.on) continue;
      if(matchRule(f, rule)){ pred = rule.thenCode; hr = r; break; }
    }
    if(pred < 0) continue;
    var gp;
    if(pred === resultCodes[i]){
      gp = payouts[i*3 + pred] - 100;
    } else {
      gp = -100;
    }
    total += gp;
    if(tr && hr >= 0) ruleProfit[hr] += gp;
  }
  return total;
}

/* ========== 規則結構 ========== */
function cloneRule(r){
  var groups = [];
  for(var g = 0; g < r.groups.length; g++){
    var gs = [];
    for(var c = 0; c < r.groups[g].length; c++){
      var cond = r.groups[g][c];
      gs.push([cond[0], cond[1], cond[2]]);
    }
    groups.push(gs);
  }
  return {on:r.on, then:r.then, thenCode:r.thenCode, groups:groups};
}
function cloneRules(rules){
  var out = new Array(rules.length);
  for(var i = 0; i < rules.length; i++) out[i] = cloneRule(rules[i]);
  return out;
}

/* ⭐ 熱啟動（async，每特徵 yield） */
async function hotStart(){
  pushLog(nowTime() + ' 🔥 熱啟動：掃描 ' + FCOUNT + ' 特徵找最佳單條件規則...', 'hot');
  var best = [];
  var N = featMat.length;
  var t0 = Date.now();

  for(var fi = 0; fi < FCOUNT; fi++){
    if(!running) break;
    var vals = [];
    for(var i = 0; i < N; i++) vals.push(featMat[i][fi]);
    vals.sort(function(a,b){ return a - b; });
    var candidates = [];
    var nC = Math.min(30, vals.length);
    for(var k = 0; k < nC; k++){
      candidates.push(vals[Math.floor(k * vals.length / nC)]);
    }

    for(var op = 0; op < 4; op++){
      for(var ci = 0; ci < candidates.length; ci++){
        var val = candidates[ci];
        for(var tc = 0; tc < 3; tc++){
          var profit = 0;
          for(var i = 0; i < N; i++){
            var f = featMat[i];
            if(!evalCond(f, fi, op, val)) continue;
            if(tc === resultCodes[i]){
              profit += payouts[i*3 + tc] - 100;
            } else {
              profit -= 100;
            }
          }
          if(profit > 200){
            best.push({fi:fi, op:op, val:val, thenCode:tc, profit:profit});
          }
        }
      }
    }

    // ⭐ 每 5 個特徵 yield 一次
    if(fi % 5 === 4){
      pushLog(nowTime() + '   掃描進度：' + (fi+1) + '/' + FCOUNT + ' 特徵，候選 ' + best.length + ' 個', 'dim');
      await yieldUI();
    }
  }

  best.sort(function(a,b){ return b.profit - a.profit; });
  var topN = Math.min(20, best.length);
  var result = [];
  for(var i = 0; i < topN; i++){
    var b = best[i];
    result.push({
      on:1, then: RESULTS[b.thenCode], thenCode: b.thenCode,
      groups: [[[b.fi, b.op, b.val]]]
    });
  }
  pushLog(nowTime() + ' ✓ 熱啟動完成：' + best.length + ' 個候選，取前 ' + topN + ' 個（耗時 ' + (Date.now()-t0) + ' ms）', 'success');
  if(topN > 0){
    pushLog(nowTime() + '   最佳單條件：' + FEATURES[best[0].fi] + OPS[best[0].op] + Math.round(best[0].val) + ' → ' + RESULTS[best[0].thenCode] + '（盈利 ' + best[0].profit + '）', 'hot');
  }
  await yieldUI();
  return result;
}

/* ========== 生成 ========== */
function sampleFeatureValue(fi){
  if(featMat.length === 0) return Math.random() * 300;
  var n = Math.min(50, featMat.length);
  var vals = [];
  for(var i = 0; i < n; i++) vals.push(featMat[Math.floor(Math.random() * featMat.length)][fi]);
  var base = vals[Math.floor(Math.random() * vals.length)];
  var spread = Math.max(1, Math.abs(base) * 0.25);
  var v = base + (Math.random() * 2 - 1) * spread;
  if(base > 5 && Math.abs(base - Math.round(base)) < 0.01) v = Math.round(v);
  return Math.max(0, v);
}
function genCond(){
  return [Math.floor(Math.random() * FCOUNT), Math.floor(Math.random() * OPS.length), sampleFeatureValue(0)];
}
function genGroup(){
  var n = 1 + Math.floor(Math.random() * 3);
  var group = [];
  var used = {};
  for(var i = 0; i < n; i++){
    var c = genCond();
    var key = c[0] + '_' + c[1];
    if(used[key] && Math.random() < 0.7) continue;
    used[key] = 1;
    group.push(c);
  }
  if(group.length === 0) group.push(genCond());
  return group;
}
function genRule(){
  var tIdx = Math.floor(Math.random() * 4);
  var numGroups = 1;
  if(document.getElementById('useOr').checked){
    numGroups = Math.random() < 0.7 ? 1 : (1 + Math.floor(Math.random() * 2));
    if(numGroups > MAX_GROUPS) numGroups = MAX_GROUPS;
  }
  var groups = [];
  for(var g = 0; g < numGroups; g++) groups.push(genGroup());
  return {on:1, then: RESULTS[tIdx], thenCode: tIdx, groups: groups};
}

/* ========== 剪枝 ========== */
function pruneRules(rules){
  if(!document.getElementById('usePrune').checked) return rules;
  calcProfitWith(rules, true);
  var kept = [], removed = 0;
  for(var i = 0; i < rules.length; i++){
    if(ruleProfit[i] < -100){ removed++; continue; }
    kept.push(rules[i]);
  }
  if(removed > 0 && kept.length > 0){
    pushLog(nowTime() + ' ✂️ 剪枝：移除 ' + removed + ' 條虧損規則（' + rules.length + '→' + kept.length + '）', 'prune');
  }
  return kept;
}

/* ========== 變異 ========== */
function pickRuleIdx(rules){
  var total = 0;
  var weights = new Array(rules.length);
  for(var i = 0; i < rules.length; i++){
    var p = ruleProfit ? ruleProfit[i] : 0;
    var w = 1 + Math.max(0, p / 500);
    weights[i] = w;
    total += w;
  }
  if(total <= 0) return Math.floor(Math.random() * rules.length);
  var r = Math.random() * total, cum = 0;
  for(var i = 0; i < rules.length; i++){
    cum += weights[i];
    if(cum >= r) return i;
  }
  return rules.length - 1;
}
function mutateGen(rules){
  if(rules.length >= MAX_RULES) return null;
  var nr = cloneRules(rules);
  var rule = genRule();
  var pos = Math.random() < 0.7 ? nr.length : Math.floor(Math.random() * (nr.length + 1));
  nr.splice(pos, 0, rule);
  return {rules:nr, generated:true, genRule:rule};
}
function mutateNumeric(rules, intensity){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules:r};
  var nMut = 1 + Math.floor(Math.random() * 3);
  for(var k = 0; k < nMut; k++){
    var idx = pickRuleIdx(r);
    var rule = r[idx];
    if(!rule.groups.length) continue;
    var gi = Math.floor(Math.random() * rule.groups.length);
    if(!rule.groups[gi].length) continue;
    var ci = Math.floor(Math.random() * rule.groups[gi].length);
    var cond = rule.groups[gi][ci];
    var v = cond[2], av = Math.abs(v);
    var step = 1;
    if(av >= 30) step = 2;
    if(av >= 100) step = 5;
    if(av >= 300) step = 10;
    if(av >= 700) step = 20;
    step *= (intensity || 1);
    cond[2] = Math.max(0, v + (Math.floor(Math.random() * 11) - 5) * step);
  }
  return {rules:r};
}
function mutateThen(rules){
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = pickRuleIdx(r);
  var nc = Math.floor(Math.random() * 4);
  r[idx].thenCode = nc; r[idx].then = RESULTS[nc];
  return {rules:r};
}
function mutateOp(rules){
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = pickRuleIdx(r);
  if(!r[idx].groups.length) return {rules:r};
  var gi = Math.floor(Math.random() * r[idx].groups.length);
  if(!r[idx].groups[gi].length) return {rules:r};
  var ci = Math.floor(Math.random() * r[idx].groups[gi].length);
  var old = r[idx].groups[gi][ci][1], nw;
  do { nw = Math.floor(Math.random() * 6); } while(nw === old);
  r[idx].groups[gi][ci][1] = nw;
  return {rules:r};
}
function mutateOn(rules){
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = pickRuleIdx(r);
  r[idx].on = r[idx].on ? 0 : 1;
  return {rules:r};
}
function mutateDelete(rules){
  var r = cloneRules(rules);
  if(r.length <= 1) return {rules:r};
  r.splice(Math.floor(Math.random() * r.length), 1);
  return {rules:r};
}
function mutateSwap(rules){
  var r = cloneRules(rules);
  if(r.length < 2) return {rules:r};
  var i = Math.floor(Math.random() * (r.length - 1));
  var t = r[i]; r[i] = r[i+1]; r[i+1] = t;
  return {rules:r};
}
function mutateAddCond(rules){
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = pickRuleIdx(r);
  var gi = Math.floor(Math.random() * r[idx].groups.length);
  if(r[idx].groups[gi].length >= MAX_CONDS) return {rules:r};
  r[idx].groups[gi].push(genCond());
  return {rules:r};
}
function mutateDelCond(rules){
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = pickRuleIdx(r);
  var gi = Math.floor(Math.random() * r[idx].groups.length);
  if(r[idx].groups[gi].length <= 1) return {rules:r};
  r[idx].groups[gi].splice(Math.floor(Math.random() * r[idx].groups[gi].length), 1);
  return {rules:r};
}
function mutateAddGroup(rules){
  if(!document.getElementById('useOr').checked) return {rules:rules};
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = pickRuleIdx(r);
  if(r[idx].groups.length >= MAX_GROUPS) return {rules:r};
  r[idx].groups.push(genGroup());
  return {rules:r};
}
function mutateDelGroup(rules){
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = pickRuleIdx(r);
  if(r[idx].groups.length <= 1) return {rules:r};
  r[idx].groups.splice(Math.floor(Math.random() * r[idx].groups.length), 1);
  return {rules:r};
}
function mutateNewFeat(rules){
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = pickRuleIdx(r);
  if(!r[idx].groups.length) return {rules:r};
  var gi = Math.floor(Math.random() * r[idx].groups.length);
  if(!r[idx].groups[gi].length) return {rules:r};
  var ci = Math.floor(Math.random() * r[idx].groups[gi].length);
  var nf = Math.floor(Math.random() * FCOUNT);
  r[idx].groups[gi][ci][0] = nf;
  r[idx].groups[gi][ci][2] = sampleFeatureValue(nf);
  return {rules:r};
}
function mutateSplit(rules){
  if(rules.length >= MAX_RULES) return {rules:rules};
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = Math.floor(Math.random() * r.length);
  var copy = cloneRule(r[idx]);
  copy.groups.push(genGroup());
  r.splice(idx + 1, 0, copy);
  return {rules:r};
}
function mutate(rules, intensity){
  var cnt = rules.length;
  var gc;
  if(cnt === 0) gc = 1.0;
  else if(cnt < 3) gc = 0.5;
  else if(cnt < 8) gc = 0.28;
  else if(cnt < 20) gc = 0.18;
  else if(cnt < 50) gc = 0.10;
  else gc = 0.05;
  if(Math.random() < gc){
    var g = mutateGen(rules);
    if(g) return g;
  }
  var p = Math.random();
  if(p < 0.30) return mutateNumeric(rules, intensity);
  if(p < 0.42) return mutateThen(rules);
  if(p < 0.50) return mutateOn(rules);
  if(p < 0.56) return mutateSwap(rules);
  if(p < 0.64) return mutateDelete(rules);
  if(p < 0.72) return mutateAddCond(rules);
  if(p < 0.78) return mutateDelCond(rules);
  if(p < 0.84) return mutateAddGroup(rules);
  if(p < 0.88) return mutateDelGroup(rules);
  if(p < 0.94) return mutateOp(rules);
  if(p < 0.98) return mutateNewFeat(rules);
  return mutateSplit(rules);
}

/* ⭐ 優化迴圈（async） */
async function optimizeRules(startRules, label, maxPasses, quiet){
  var cur = cloneRules(startRules);
  var curProfit = calcProfitWith(cur, false);
  var best = cloneRules(cur);
  var bestProfit = curProfit;
  var verbose = document.getElementById('verbose').checked;
  var showBad = document.getElementById('showBad').checked;
  var pass = 0;
  var sinceImprove = 0;

  if(!quiet){
    pushLog(nowTime() + ' ▶ ' + label + ' 起始盈利: ' + curProfit + '（規則 ' + cur.length + '）', 'gen');
    await yieldUI();
  }

  while(running && pass < maxPasses){
    pass++;
    if(!quiet && pass % 3 === 1){
      pushLog(nowTime() + ' ── ' + label + ' 第 ' + pass + ' 輪（盈利 ' + curProfit + '，規則 ' + cur.length + '）──', 'dim');
    }

    var improvedThisPass = false;
    var iterPerPass = 500;
    var iterChunk = 50;

    for(var base = 0; base < iterPerPass && running; base += iterChunk){
      // 執行一小塊
      for(var j = 0; j < iterChunk; j++){
        if(!running) break;
        var i = base + j;
        var m = mutate(cur, 1 + Math.floor(pass / 3));
        var cand = m.rules;
        var candProfit = calcProfitWith(cand, false);
        var delta = candProfit - curProfit;

        if(candProfit >= curProfit){
          cur = cand; curProfit = candProfit;
          improvedThisPass = true; sinceImprove = 0;
          if(m.generated && verbose){
            pushLog(nowTime() + '   [新增 #' + cur.length + '] ' + fmtRule(m.genRule) + '  盈利 ' + candProfit, 'newrule');
          }
          if(candProfit > bestProfit){
            bestProfit = candProfit;
            best = cloneRules(cand);
            pushLog(nowTime() + ' ★★★ 新最優：' + bestProfit + '（Δ+' + delta + '，規則 ' + cur.length + '）', 'best');
          }
        } else {
          sinceImprove++;
          if(showBad && verbose && i % 50 === 0){
            pushLog(nowTime() + '   ✗ 失敗（Δ' + delta + '）', 'bad');
          }
          var T = 100 / (1 + i / 100);
          if(Math.random() < Math.exp(delta / T)){
            cur = cand; curProfit = candProfit;
          }
        }
      }
      // ⭐ 每塊 yield 一次
      currentRuleCount = cur.length;
      updateStatsUI();
      await yieldUI();
      if(!running) break;
    }

    // 剪枝
    if(document.getElementById('usePrune').checked && cur.length > 5){
      var pruned = pruneRules(cur);
      if(pruned.length < cur.length){
        var pProfit = calcProfitWith(pruned, false);
        if(pProfit >= curProfit - 50){
          cur = pruned;
          curProfit = pProfit;
          if(curProfit > bestProfit){
            bestProfit = curProfit;
            best = cloneRules(cur);
          }
        }
      }
    }

    if(!quiet && pass % 3 === 0){
      pushLog(nowTime() + ' 第 ' + pass + ' 輪完成（盈利 ' + curProfit + '）', improvedThisPass ? 'ok' : 'dim');
    }
    if(!improvedThisPass && sinceImprove > 2500) break;

    await yieldUI();
  }

  if(!quiet){
    pushLog(nowTime() + ' ✓ ' + label + ' 收斂於 ' + bestProfit + '（' + pass + ' 輪）', 'success');
    await yieldUI();
  }
  return {rules:best, profit:bestProfit, passes:pass};
}

/* ⭐ 徹底掃描（async） */
async function thoroughScan(rules, label){
  pushLog(nowTime() + ' 🔍 ' + label + '：對每條規則每個條件做完整掃描...', 'scan');
  await yieldUI();
  var cur = cloneRules(rules);
  var curProfit = calcProfitWith(cur, false);
  var improved = true;
  var round = 0;

  while(improved && running && round < 3){
    round++;
    improved = false;
    for(var ri = 0; ri < cur.length && running; ri++){
      var rule = cur[ri];
      for(var gi = 0; gi < rule.groups.length; gi++){
        for(var ci = 0; ci < rule.groups[gi].length; ci++){
          var cond = rule.groups[gi][ci];
          var fi = cond[0];
          var vals = [];
          for(var i = 0; i < featMat.length; i++) vals.push(featMat[i][fi]);
          vals.sort(function(a,b){ return a - b; });
          var step = Math.max(1, Math.floor(vals.length / 25));
          var bv = cond[2], bp = curProfit;
          for(var k = 0; k < vals.length; k += step){
            var test = cloneRules(cur);
            test[ri].groups[gi][ci][2] = vals[k];
            var p = calcProfitWith(test, false);
            if(p > bp){ bv = vals[k]; bp = p; }
          }
          if(bv !== cond[2]){
            cond[2] = bv;
            curProfit = bp;
            improved = true;
          }
        }
      }
      if(ri % 5 === 4) await yieldUI();
    }
    pushLog(nowTime() + '   第 ' + round + ' 輪掃描完成，盈利 ' + curProfit, improved ? 'ok' : 'dim');
    await yieldUI();
  }
  pushLog(nowTime() + ' ✓ 徹底掃描完成：' + curProfit, 'success');
  await yieldUI();
  return {rules:cur, profit:curProfit};
}

/* ========== 格式化 ========== */
function fmtCond(c){ return FEATURES[c[0]] + OPS[c[1]] + Math.round(c[2] * 100) / 100; }
function fmtRule(r){
  if(!r.groups || r.groups.length === 0) return '(空)→' + r.then;
  var parts = [];
  for(var g = 0; g < r.groups.length; g++){
    parts.push('(' + r.groups[g].map(fmtCond).join('&') + ')');
  }
  return parts.join('|') + '→' + r.then;
}

/* ========== 診斷 ========== */
function diagnose(rules){
  var stats = [];
  for(var i = 0; i < rules.length; i++) stats.push({rule:rules[i], hit:0, correct:0, wrong:0, profit:0});
  for(var i = 0; i < featMat.length; i++){
    var f = featMat[i];
    var pred = -1, hr = -1;
    for(var j = 0; j < rules.length; j++){
      if(!rules[j].on) continue;
      if(matchRule(f, rules[j])){ pred = rules[j].thenCode; hr = j; break; }
    }
    if(pred < 0 || hr === -1) continue;
    stats[hr].hit++;
    if(pred === resultCodes[i]){
      stats[hr].correct++;
      stats[hr].profit += payouts[i*3 + pred] - 100;
    } else {
      stats[hr].wrong++;
      stats[hr].profit -= 100;
    }
  }
  return stats;
}
function renderRuleTable(stats){
  var html = '<table><thead><tr>' +
    '<th>#</th><th>' + t('thOn') + '</th><th>' + t('thCond') + '</th><th>' + t('thThen') + '</th>' +
    '<th>' + t('thHit') + '</th><th>' + t('thCorrect') + '</th><th>' + t('thWrong') + '</th><th>' + t('thProfit') + '</th>' +
    '</tr></thead><tbody>';
  for(var i = 0; i < stats.length; i++){
    var s = stats[i];
    var r = s.rule;
    var ss = fmtRule(r);
    if(ss.length > 100) ss = ss.slice(0, 97) + '...';
    var pcls = s.profit > 0 ? 'profit-pos' : (s.profit < 0 ? 'profit-neg' : '');
    var onTag = r.on ? '<span class="tag-ok">ON</span>' : '<span class="tag-off">OFF</span>';
    var thenTag = '<span class="tag-pred">' + r.then + '</span>';
    var orTag = r.groups.length > 1 ? ' <span class="tag-or">OR×' + r.groups.length + '</span>' : '';
    html += '<tr><td>R' + (i+1) + orTag + '</td><td>' + onTag + '</td>' +
      '<td style="text-align:left;font-size:10px">' + ss + '</td><td>' + thenTag + '</td>' +
      '<td>' + s.hit + '</td><td>' + s.correct + '</td><td>' + s.wrong + '</td>' +
      '<td class="' + pcls + '">' + s.profit + '</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('ruleTable').innerHTML = html;
}

/* ========== 公式生成 ========== */
function sheetOp(opIdx){
  var op = OPS[opIdx];
  if(op === '!=') return '<>';
  if(op === '==') return '=';
  return op;
}
function buildCondSheet(cond){
  var fi = cond[0], opIdx = cond[1], val = cond[2];
  var feat = FEATURES[fi];
  var op = sheetOp(opIdx);
  var v = Math.round(val * 100) / 100;
  var expr;
  switch(feat){
    case 'A': case 'B': case 'C': case 'D': case 'E': case 'F':
      expr = feat + '2:' + feat; break;
    case '|A-B|': expr = 'ABS(A2:A-B2:B)'; break;
    case '|A-C|': expr = 'ABS(A2:A-C2:C)'; break;
    case '|A-D|': expr = 'ABS(A2:A-D2:D)'; break;
    case '|A-E|': expr = 'ABS(A2:A-E2:E)'; break;
    case '|A-F|': expr = 'ABS(A2:A-F2:F)'; break;
    case '|B-C|': expr = 'ABS(B2:B-C2:C)'; break;
    case '|B-D|': expr = 'ABS(B2:B-D2:D)'; break;
    case '|B-E|': expr = 'ABS(B2:B-E2:E)'; break;
    case '|B-F|': expr = 'ABS(B2:B-F2:F)'; break;
    case '|C-D|': expr = 'ABS(C2:C-D2:D)'; break;
    case '|C-E|': expr = 'ABS(C2:C-E2:E)'; break;
    case '|C-F|': expr = 'ABS(C2:C-F2:F)'; break;
    case '|D-E|': expr = 'ABS(D2:D-E2:E)'; break;
    case '|D-F|': expr = 'ABS(D2:D-F2:F)'; break;
    case '|E-F|': expr = 'ABS(E2:E-F2:F)'; break;
    case 'A-B': expr = '(A2:A-B2:B)'; break;
    case 'A-C': expr = '(A2:A-C2:C)'; break;
    case 'B-C': expr = '(B2:B-C2:C)'; break;
    case 'D-F': expr = '(D2:D-F2:F)'; break;
    case 'E-D': expr = '(E2:E-D2:D)'; break;
    case 'A+B': expr = '(A2:A+B2:B)'; break;
    case 'B+C': expr = '(B2:B+C2:C)'; break;
    case 'D+E': expr = '(D2:D+E2:E)'; break;
    case 'E+F': expr = '(E2:E+F2:F)'; break;
    case 'D+F': expr = '(D2:D+F2:F)'; break;
    case 'A+C': expr = '(A2:A+C2:C)'; break;
    case 'A+B+C': expr = '(A2:A+B2:B+C2:C)'; break;
    case 'D+E+F': expr = '(D2:D+E2:E+F2:F)'; break;
    case 'A+D': expr = '(A2:A+D2:D)'; break;
    case 'A/C': expr = 'IF(C2:C=0,0,A2:A/C2:C)'; break;
    case 'D/F': expr = 'IF(F2:F=0,0,D2:D/F2:F)'; break;
    case 'D/(D+F)': expr = 'IF(D2:D+F2:F=0,0,D2:D/(D2:D+F2:F))'; break;
    case 'MAX(A,B,C)': expr = 'MAX(A2:A,B2:B,C2:C)'; break;
    case 'MIN(A,B,C)': expr = 'MIN(A2:A,B2:B,C2:C)'; break;
    case 'MAX(D,E,F)': expr = 'MAX(D2:D,E2:E,F2:F)'; break;
    case 'MIN(D,E,F)': expr = 'MIN(D2:D,E2:E,F2:F)'; break;
    default: expr = '0';
  }
  return '(' + expr + op + v + ')';
}
function buildGroupSheet(g){
  if(!g.length) return 'TRUE';
  return g.map(buildCondSheet).join('*');
}
function buildRuleSheet(r){
  if(!r.groups.length) return 'FALSE';
  if(r.groups.length === 1) return buildGroupSheet(r.groups[0]);
  return '(' + r.groups.map(function(g){ return '(' + buildGroupSheet(g) + ')'; }).join('+') + ')';
}
function genFormula(rules){
  var active = [];
  for(var i = 0; i < rules.length; i++) if(rules[i].on) active.push(rules[i]);
  if(!active.length) return '=ARRAYFORMULA(IF(A2:A="","","skip"))';
  var body = '';
  for(var i = 0; i < active.length; i++){
    var expr = buildRuleSheet(active[i]);
    if(active[i].groups.length > 1){
      body += 'IF((' + expr + ')>0,"' + active[i].then + '",';
    } else {
      body += 'IF(' + expr + ',"' + active[i].then + '",';
    }
  }
  body += '"skip"';
  for(var j = 0; j < active.length; j++) body += ')';
  return '=ARRAYFORMULA(IF((A2:A="")+(B2:B="")+(C2:C="")+(D2:D="")+(E2:E="")+(F2:F=""),"",' + body + '))';
}

  var r0 = await optimizeRules(seeds, '引導', 10, false);
  if(!running){ finish(); return; }
  globalBest = r0.rules;
  globalProfit = r0.profit;
  currentRuleCount = globalBest.length;

  pushLog('');
  pushLog(nowTime() + ' ✓ 階段 1 完成：' + globalProfit + '（' + globalBest.length + ' 條規則）', 'success');
  pushLog('');
  updateStatsUI(0, globalProfit);
  document.getElementById('progbar').style.width = (1 / (N + 1) * 100).toFixed(1) + '%';
  await yieldUI();

  // 階段 2：多起點
  for(var k = 1; k <= N && running; k++){
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog(nowTime() + ' 起點 #' + k + ' / ' + N, 'head');
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    await yieldUI();

    var seedRules = cloneRules(globalBest);
    var nSeedMuts = 5 + Math.floor(Math.random() * 10);
    for(var i = 0; i < nSeedMuts; i++){
      var m = mutate(seedRules, 1);
      seedRules = m.rules;
    }
    pushLog(nowTime() + ' 從當前最佳變異 ' + nSeedMuts + ' 次作為起點', 'info');

    var r = await optimizeRules(seedRules, '#' + k, 12, false);
    if(!running) break;
    currentRuleCount = r.rules.length;

    if(r.profit > globalProfit){
      var diff = r.profit - globalProfit;
      globalProfit = r.profit;
      globalBest = r.rules;
      pushLog('');
      pushLog('  ★★★ 新全局最優：' + globalProfit + ' (Δ+' + diff + '，規則 ' + r.rules.length + ')', 'best');
    } else {
      pushLog('  ✗ 收斂於 ' + r.profit + '（低於最優 ' + globalProfit + '）', 'dim');
    }
    pushLog('');

    updateStatsUI(k, globalProfit);
    document.getElementById('progbar').style.width = ((k + 1) / (N + 1) * 100).toFixed(1) + '%';
    await yieldUI();
  }

  // 最終階段
  if(running){
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog(nowTime() + ' 最終階段：徹底掃描所有閾值', 'head');
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    var rf = await thoroughScan(globalBest, '最終掃描');
    if(rf.profit > globalProfit){
      globalProfit = rf.profit;
      globalBest = rf.rules;
      pushLog(nowTime() + ' ✓ 徹底掃描提升至：' + globalProfit, 'best');
    }
    currentRuleCount = globalBest.length;

    if(document.getElementById('usePrune').checked){
      pushLog(nowTime() + ' ✂️ 最終剪枝...', 'prune');
      await yieldUI();
      var pruned = pruneRules(globalBest);
      if(pruned.length < globalBest.length){
        var pp = calcProfitWith(pruned, false);
        if(pp >= globalProfit){
          globalBest = pruned;
          globalProfit = pp;
          pushLog(nowTime() + ' ✓ 剪枝後：' + globalProfit + '（' + globalBest.length + ' 條）', 'success');
        }
      }
    }
  }

  finish();

  function finish(){
    var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog('🏆 完成！最高盈利：' + globalProfit, 'best');
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog('   去重前：' + parsed.total + ' 筆', 'info');
    pushLog('   實際使用：' + data.length + ' 筆', 'info');
    pushLog('   總耗時：' + elapsed + ' 秒', 'info');
    pushLog('   總掃描：' + evalCount + ' 次', 'info');
    pushLog('   最終規則數：' + globalBest.length, 'info');
    var orCount = 0;
    for(var i = 0; i < globalBest.length; i++) if(globalBest[i].groups.length > 1) orCount++;
    pushLog('   使用 OR 的規則：' + orCount + ' 條', 'info');
    pushLog('═══════════════════════════════════════════════════════════', 'head');

    var formula = genFormula(globalBest);

    document.getElementById('best').style.display = 'block';
    document.getElementById('summary').innerHTML = '🏆 最高盈利: <b>' + globalProfit + '</b>　(' + data.length + ' 場，' + globalBest.length + ' 條規則)';
    document.getElementById('params').textContent = JSON.stringify(globalBest);
    document.getElementById('txtOut').value = formula;

    var stats = diagnose(globalBest);
    renderRuleTable(stats);
    document.getElementById('diag').style.display = 'block';

    running = false;
    document.getElementById('btnRun').disabled = false;
    document.getElementById('btnStop').disabled = true;
    document.getElementById('progbar').style.width = '100%';
    updateStatsUI(undefined, globalProfit);
    flushNow();
  }
}

function stop(){
  running = false;
  document.getElementById('btnStop').disabled = true;
  pushLog('⏹ 使用者手動停止', 'warn');
  flushNow();
}
function copyIt(id){
  var el = document.getElementById(id);
  if(!el) return;
  var txt = el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      showMsg('✅ 已複製 ' + txt.length + ' 字元', true);
    }).catch(function(){ fallbackCopy(txt); });
  } else { fallbackCopy(txt); }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg('✅ 已複製 ' + text.length + ' 字元', true);
  else showMsg('❌ 複製失敗', false);
}
function showMsg(text, ok){
  var m = document.getElementById('msg');
  m.textContent = text; m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  setTimeout(function(){ m.style.display = 'none'; }, 3000);
}

(function(){
  document.getElementById('log').textContent = '等待開始...';
})();
</script>
