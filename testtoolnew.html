<style>

<body>

<div class="top">

  <div>

</div>

<div class="warn-banner">

  🔄 <b>10 折 × 3 次重複</b> = 30 個獨立結果<br>
  🧬 <b>每折最多 100 輪演化</b>（每輪 500 迭代）<br>
  📊 <b>t 檢定判定</b>：t > 2.0 才算顯著<br>

<script>
'use strict';

var TXT = {
  zh: { title: '🚀 v39 — 10 折 × 3 次重複 + t 檢定', hRule: '📋 最後一折規則表', noData: '沒有有效數據' },
  en: { title: '🚀 v39 — 10-fold × 3-repeat + t-test', hRule: '📋 Last Fold Rules', noData: 'No valid data' }
};
var LANG = 'zh';
function t(k){ return (TXT[LANG] && TXT[LANG][k]) || k; }
function setLang(lang){
  LANG = lang;
  document.getElementById('btn-zh').className = 'lang-btn' + (lang==='zh'?' active':'');
  document.getElementById('btn-en').className = 'lang-btn' + (lang==='en'?' active':'');
  document.getElementById('title').textContent = t('title');
  document.getElementById('h-rule').textContent = t('hRule');
}

var FEATURES = [
  'A','B','C','D','E','F',
  '|A-B|','|A-C|','|A-D|','|A-E|','|A-F|',
  '|B-C|','|B-D|','|B-E|','|B-F|',
  '|C-D|','|C-E|','|C-F|',
  '|D-E|','|D-F|','|E-F|',
  'A-B','A-C','B-C','D-F','E-D',
  'A+B','B+C','D+E','E+F','D+F','A+C',
  'A+B+C','D+E+F','A+D',
  'A/C','D/F','D/(D+F)',
  'MAX(A,B,C)','MIN(A,B,C)','MAX(D,E,F)','MIN(D,E,F)'
];
var FCOUNT = FEATURES.length;

var trainFeat = null, testFeat = null;
var trainCodes = null, trainPayouts = null;
var testCodes = null, testPayouts = null;
var trainN = 0, testN = 0;

var running = false;
var startTime = 0;
var evalCount = 0;
var logBuffer = [];
var logTimer = null;
var LOG_MAX = 20000;
var lastSpeedUpdate = 0;

var currentRep = 0;
var totalReps = 0;
var currentFold = 0;
var totalFolds = 0;
var foldResults = [];
var lastEvolvedRules = null;
var currentRuleCount = 0;
var currentRound = 0;
var maxRounds = 0;

var RESULTS = ['H','D','A','skip'];
var RESULT_CODES = {H:0, D:1, A:2, skip:-1};
var OPS = ['>','>=','<','<=','==','!='];

var MAX_RULES = 80;
var EVO_MIN_IMPROVE = 0.2;
var ITER_PER_ROUND = 500;
var ROUNDS_NO_IMPROVE_LIMIT = 5;
var AUDIT_INTERVAL = 10;

/* ========== 日誌 ========== */
function nowTime(){
  if(!startTime) return '[00:00.000]';
  var ms = Date.now() - startTime;
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  return '[' + String(m).padStart(2,'0') + ':' + String(s%60).padStart(2,'0') + '.' + String(ms%1000).padStart(3,'0') + ']';
}
function pushLog(text, cls){
  logBuffer.push({ text: text, cls: cls || '' });
  if(!logTimer) logTimer = setTimeout(flushLog, 80);
}
function flushLog(){
  logTimer = null;
  if(logBuffer.length === 0) return;
  var logEl = document.getElementById('log');
  logEl.dataset.hasContent = '1';
  if(!logEl.dataset.started){
    logEl.innerHTML = '';
    logEl.dataset.started = '1';
  }
  var frag = document.createDocumentFragment();
  for(var i = 0; i < logBuffer.length; i++){
    var e = logBuffer[i];
    var div = document.createElement('div');
    if(e.cls) div.className = 'l-' + e.cls;
    div.textContent = e.text;
    frag.appendChild(div);
  }
  logBuffer = [];
  logEl.appendChild(frag);
  while(logEl.children.length > LOG_MAX) logEl.removeChild(logEl.firstChild);
  if(document.getElementById('autoScroll').checked) logEl.scrollTop = logEl.scrollHeight;
}
function flushNow(){
  if(logTimer){ clearTimeout(logTimer); logTimer = null; }
  flushLog();
}
function clearLog(){
  var logEl = document.getElementById('log');
  logEl.innerHTML = '';
  logEl.dataset.hasContent = '1';
  logEl.dataset.started = '1';
  logBuffer = [];
}

function updateProgress(){
  var pct = 0;
  var totalJobs = totalReps * totalFolds;
  if(totalJobs > 0 && maxRounds > 0){
    var done = (currentRep - 1) * totalFolds + (currentFold - 1);
    var foldPct = Math.min(0.95, currentRound / maxRounds);
    pct = ((done + foldPct) / totalJobs) * 100;
    if(pct > 99.5 && running) pct = 99.5;
  }
  if(!running && startTime > 0 && document.getElementById('best').style.display === 'block') pct = 100;
  var bar = document.getElementById('progbar');
  var txt = document.getElementById('progText');
  var phaseEl = document.getElementById('progPhase');
  if(bar) bar.style.width = pct.toFixed(1) + '%';
  if(txt) txt.textContent = pct.toFixed(1) + '%';
  if(phaseEl) phaseEl.textContent = currentRep > 0 ? '重複 ' + currentRep + '/' + totalReps + '，折 ' + currentFold + '/' + totalFolds + '，輪 ' + currentRound + '/' + maxRounds : '準備中';
  var statProg = document.getElementById('stat-prog');
  if(statProg) statProg.innerHTML = '進度: <b>' + pct.toFixed(1) + '%</b>';
  var statRep = document.getElementById('stat-rep');
  if(statRep) statRep.innerHTML = '🔁 重複: <b>' + currentRep + '/' + totalReps + '</b>';
  var statFold = document.getElementById('stat-fold');
  if(statFold) statFold.innerHTML = '🔄 折: <b>' + currentFold + '/' + totalFolds + '</b>';
  var statRound = document.getElementById('stat-round');
  if(statRound) statRound.innerHTML = '⏱ 輪: <b>' + currentRound + '/' + maxRounds + '</b>';
  var statRules = document.getElementById('stat-rules');
  if(statRules) statRules.innerHTML = '📋 規則: <b>' + currentRuleCount + '</b>';
}

function updateTestAvg(){
  var stat = document.getElementById('stat-test');
  if(!stat) return;
  if(foldResults.length === 0){ stat.innerHTML = '🩷 測試平均: <b>-</b>'; return; }
  var sum = 0;
  for(var i = 0; i < foldResults.length; i++) sum += foldResults[i].testPer;
  stat.innerHTML = '🩷 測試平均: <b>' + (sum / foldResults.length).toFixed(2) + '</b>（' + foldResults.length + ' 筆）';
}

function updateSpeedUI(){
  var now = Date.now();
  if(now - lastSpeedUpdate < 500) return;
  var el = ((now - startTime) / 1000).toFixed(0);
  var speed = el > 0 ? (evalCount / el).toFixed(0) : '0';
  var statSpeed = document.getElementById('stat-speed');
  if(statSpeed) statSpeed.innerHTML = '⚡ 評估/秒: <b>' + speed + '</b>';
  var statTime = document.getElementById('stat-time');
  if(statTime) statTime.innerHTML = '時間: <b>' + el + 's</b>';
  lastSpeedUpdate = now;
}

var yieldResolvers = [];
var yieldChannel = new MessageChannel();
yieldChannel.port1.onmessage = function(){
  var r = yieldResolvers.shift();
  if(r) r();
};
function yieldUI(){
  flushNow();
  updateProgress();
  updateTestAvg();
  updateSpeedUI();
  return new Promise(function(resolve){
    yieldResolvers.push(resolve);
    yieldChannel.port2.postMessage(0);
  });
}

/* ========== 解析 ========== */
function parseData(text){
  var rows = [], seen = {}, dups = 0, total = 0;
  var lines = text.split('\n');
  for(var i = 0; i < lines.length; i++){
    var p = lines[i].trim().split(/\s+/);
    if(p.length < 8) continue;
    var v = p.slice(0,6).map(Number);
    var r = p[7];
    if(v.some(isNaN) || ['H','D','A'].indexOf(r) === -1) continue;
    total++;
    var sig = v.join('|') + '|' + p[6] + '|' + r;
    if(seen[sig]){ dups++; continue; }
    seen[sig] = 1;
    rows.push({A:v[0],B:v[1],C:v[2],D:v[3],E:v[4],F:v[5],result:r});
  }
  return {rows:rows, total:total, dups:dups};
}

/* ========== 特徵提取 ========== */
function extractFeatures(rows){
  var N = rows.length;
  var mat = new Array(N);
  for(var i = 0; i < N; i++){
    var r = rows[i];
    var A=r.A,B=r.B,C=r.C,D=r.D,E=r.E,F=r.F;
    var f = new Float64Array(FCOUNT);
    f[0]=A;f[1]=B;f[2]=C;f[3]=D;f[4]=E;f[5]=F;
    f[6]=Math.abs(A-B);f[7]=Math.abs(A-C);f[8]=Math.abs(A-D);f[9]=Math.abs(A-E);f[10]=Math.abs(A-F);
    f[11]=Math.abs(B-C);f[12]=Math.abs(B-D);f[13]=Math.abs(B-E);f[14]=Math.abs(B-F);
    f[15]=Math.abs(C-D);f[16]=Math.abs(C-E);f[17]=Math.abs(C-F);
    f[18]=Math.abs(D-E);f[19]=Math.abs(D-F);f[20]=Math.abs(E-F);
    f[21]=A-B;f[22]=A-C;f[23]=B-C;f[24]=D-F;f[25]=E-D;
    f[26]=A+B;f[27]=B+C;f[28]=D+E;f[29]=E+F;f[30]=D+F;f[31]=A+C;
    f[32]=A+B+C;f[33]=D+E+F;f[34]=A+D;
    f[35]=C===0?0:A/C;f[36]=F===0?0:D/F;f[37]=(D+F)===0?0:D/(D+F);
    f[38]=Math.max(A,B,C);f[39]=Math.min(A,B,C);
    f[40]=Math.max(D,E,F);f[41]=Math.min(D,E,F);
    mat[i] = f;
  }
  return mat;
}
function extractMeta(rows){
  var N = rows.length;
  var codes = new Int8Array(N);
  var po = new Float64Array(N * 3);
  for(var i = 0; i < N; i++){
    codes[i] = RESULT_CODES[rows[i].result];
    po[i*3]=rows[i].D; po[i*3+1]=rows[i].E; po[i*3+2]=rows[i].F;
  }
  return {codes:codes, payouts:po};
}

/* ========== 評估 ========== */
function evalCond(f, ci, opCode, val){
  var x = f[ci];
  switch(opCode){
    case 0: return x > val;
    case 1: return x >= val;
    case 2: return x < val;
    case 3: return x <= val;
    case 4: return x === val;
    case 5: return x !== val;
  }
  return false;
}
function matchRule(f, rule){
  for(var g = 0; g < rule.groups.length; g++){
    var group = rule.groups[g];
    var ok = true;
    for(var c = 0; c < group.length; c++){
      if(!evalCond(f, group[c][0], group[c][1], group[c][2])){ ok = false; break; }
    }
    if(ok) return true;
  }
  return false;
}

function calcProfitOn(featMat, codes, payoutsArr, N, rules){
  var total = 0;
  for(var i = 0; i < N; i++){
    var f = featMat[i];
    var pred = -1;
    for(var r = 0; r < rules.length; r++){
      var rule = rules[r];
      if(!rule.on) continue;
      if(matchRule(f, rule)){ pred = rule.thenCode; break; }
    }
    if(pred < 0) continue;
    var gp;
    if(pred === codes[i]) gp = payoutsArr[i*3 + pred] - 100;
    else gp = -100;
    total += gp;
  }
  return total;
}

function calcProfitWithRuleStats(featMat, codes, payoutsArr, N, rules){
  var stats = [];
  for(var i = 0; i < rules.length; i++) stats.push({hit:0, profit:0});
  var total = 0;
  for(var i = 0; i < N; i++){
    var f = featMat[i];
    var pred = -1, hr = -1;
    for(var r = 0; r < rules.length; r++){
      var rule = rules[r];
      if(!rule.on) continue;
      if(matchRule(f, rule)){ pred = rule.thenCode; hr = r; break; }
    }
    if(pred < 0) continue;
    var gp;
    if(pred === codes[i]) gp = payoutsArr[i*3 + pred] - 100;
    else gp = -100;
    total += gp;
    if(hr >= 0){
      stats[hr].hit++;
      stats[hr].profit += gp;
    }
  }
  return {total: total, stats: stats};
}

/* ========== 規則結構 ========== */
function cloneRule(r){
  var groups = [];
  for(var g = 0; g < r.groups.length; g++){
    var gs = [];
    for(var c = 0; c < r.groups[g].length; c++){
      var cond = r.groups[g][c];
      gs.push([cond[0], cond[1], cond[2]]);
    }
    groups.push(gs);
  }
  return {on:r.on, then:r.then, thenCode:r.thenCode, groups:groups};
}
function cloneRules(rules){
  var out = new Array(rules.length);
  for(var i = 0; i < rules.length; i++) out[i] = cloneRule(rules[i]);
  return out;
}

/* ========== 生成機制 ========== */
function sampleFeatureValue(fi, featMat, N){
  if(N === 0) return Math.random() * 300;
  var n = Math.min(50, N);
  var vals = [];
  for(var i = 0; i < n; i++) vals.push(featMat[Math.floor(Math.random() * N)][fi]);
  var base = vals[Math.floor(Math.random() * vals.length)];
  var spread = Math.max(1, Math.abs(base) * 0.25);
  var v = base + (Math.random() * 2 - 1) * spread;
  if(base > 5 && Math.abs(base - Math.round(base)) < 0.01) v = Math.round(v);
  return Math.max(0, v);
}

function genRandomRule(featMat, N){
  var tIdx = Math.floor(Math.random() * 4);
  var numConds = 1 + Math.floor(Math.random() * 2);
  var group = [];
  var used = {};
  for(var i = 0; i < numConds; i++){
    var fi = Math.floor(Math.random() * FCOUNT);
    if(used[fi]) continue;
    used[fi] = 1;
    var op = Math.floor(Math.random() * 4);
    var val = sampleFeatureValue(fi, featMat, N);
    group.push([fi, op, val]);
  }
  if(group.length === 0){
    group.push([Math.floor(Math.random() * FCOUNT), 1, sampleFeatureValue(0, featMat, N)]);
  }
  return {on:1, then: RESULTS[tIdx], thenCode: tIdx, groups: [group]};
}

function getStep(val){
  var abs = Math.abs(val);
  if(abs < 20) return 1;
  if(abs < 50) return 2;
  if(abs < 200) return 5;
  if(abs < 500) return 10;
  return 20;
}

function mutateRule(rule, featMat, N){
  var newRule = cloneRule(rule);
  if(newRule.groups.length === 0) return newRule;
  var gi = Math.floor(Math.random() * newRule.groups.length);
  if(newRule.groups[gi].length === 0) return newRule;
  var ci = Math.floor(Math.random() * newRule.groups[gi].length);
  var p = Math.random();

  if(p < 0.5){
    var cond = newRule.groups[gi][ci];
    var step = getStep(cond[2]);
    var delta = (Math.floor(Math.random() * 11) - 5) * step;
    cond[2] = Math.max(0, cond[2] + delta);
  } else if(p < 0.7){
    var cond2 = newRule.groups[gi][ci];
    var oldOp = cond2[1];
    var newOp;
    do { newOp = Math.floor(Math.random() * 4); } while(newOp === oldOp);
    cond2[1] = newOp;
  } else if(p < 0.85){
    var nc = Math.floor(Math.random() * 4);
    newRule.thenCode = nc;
    newRule.then = RESULTS[nc];
  } else {
    var nf = Math.floor(Math.random() * FCOUNT);
    newRule.groups[gi][ci][0] = nf;
    newRule.groups[gi][ci][2] = sampleFeatureValue(nf, featMat, N);
  }
  return newRule;
}

function pruneRules(rules, featMat, codes, payoutsArr, N){
  if(rules.length <= 5) return rules;
  var res = calcProfitWithRuleStats(featMat, codes, payoutsArr, N, rules);
  var stats = res.stats;
  var kept = [];
  for(var i = 0; i < rules.length; i++){
    var s = stats[i];
    if(s.hit < 3 || s.profit <= 0) continue;
    kept.push(rules[i]);
  }
  if(kept.length === 0) return rules;
  return kept;
}

function auditRules(rules, featMat, codes, payoutsArr, N){
  if(rules.length <= 3) return {rules: rules, disabled: 0};
  var cur = cloneRules(rules);
  var baseRes = calcProfitWithRuleStats(featMat, codes, payoutsArr, N, cur);
  var baseProfit = baseRes.total;
  var baseStats = baseRes.stats;

  var toDisable = [];
  for(var i = 0; i < cur.length; i++){
    if(baseStats[i].profit >= 0) continue;
    var savedOn = cur[i].on;
    cur[i].on = 0;
    var testProfit = calcProfitOn(featMat, codes, payoutsArr, N, cur);
    cur[i].on = savedOn;
    if(testProfit > baseProfit){
      toDisable.push({idx: i, delta: testProfit - baseProfit});
    }
  }
  toDisable.sort(function(a,b){ return b.delta - a.delta; });
  var disabled = 0;
  for(var k = 0; k < Math.min(toDisable.length, 5); k++){
    cur[toDisable[k].idx].on = 0;
    disabled++;
  }
  return {rules: cur, disabled: disabled};
}

/* ⭐⭐⭐ 空起始 + 多輪演化 ⭐⭐⭐ */
async function evolveFromEmpty(featMat, codes, payoutsArr, N, maxRounds, label){
  var cur = [];
  var curProfit = 0;
  var curPerGame = 0;
  var accepted = 0;
  var evals = 0;
  var roundsNoImprove = 0;
  var best = null;
  var bestProfit = -Infinity;

  pushLog(nowTime() + '   [' + label + '] 🅾️ 從 0 條規則開始，最多 ' + maxRounds + ' 輪', 'evo');

  for(var round = 1; round <= maxRounds; round++){
    if(!running) break;
    currentRound = round;
    updateProgress();

    var roundStartProfit = curProfit;
    var roundAccepted = 0;

    for(var iter = 0; iter < ITER_PER_ROUND; iter++){
      if(!running) break;

      var p = Math.random();
      var candRules = cloneRules(cur);
      var action = '';

      if(p < 0.55){
        if(candRules.length >= MAX_RULES) continue;
        var newRule = genRandomRule(featMat, N);
        var pos = Math.random() < 0.7 ? candRules.length : Math.floor(Math.random() * (candRules.length + 1));
        candRules.splice(pos, 0, newRule);
        action = 'add';
      } else if(p < 0.90){
        if(candRules.length === 0) continue;
        var ri = Math.floor(Math.random() * candRules.length);
        candRules[ri] = mutateRule(candRules[ri], featMat, N);
        action = 'mutate';
      } else {
        if(candRules.length <= 3) continue;
        var ri2 = Math.floor(Math.random() * candRules.length);
        candRules.splice(ri2, 1);
        action = 'del';
      }

      var candProfit = calcProfitOn(featMat, codes, payoutsArr, N, candRules);
      evals++;
      var improvement = candProfit - curProfit;

      if(improvement > EVO_MIN_IMPROVE * N){
        cur = candRules;
        curProfit = candProfit;
        curPerGame = N > 0 ? curProfit / N : 0;
        accepted++;
        roundAccepted++;

        if(curProfit > bestProfit){
          bestProfit = curProfit;
          best = cloneRules(cur);
        }
      }
    }

    var roundImproved = curProfit > roundStartProfit;
    if(roundImproved) roundsNoImprove = 0;
    else roundsNoImprove++;

    pushLog(nowTime() + '   [' + label + '] 第 ' + round + '/' + maxRounds + ' 輪：' + curPerGame.toFixed(2) + '/場，規則 ' + cur.length + '，接受 ' + roundAccepted + '，評估 ' + evals + (roundImproved ? ' ✓' : ''), roundImproved ? 'ok' : 'dim');

    if(round % AUDIT_INTERVAL === 0 && cur.length > 5){
      var auditRes = auditRules(cur, featMat, codes, payoutsArr, N);
      cur = auditRes.rules;
      curProfit = calcProfitOn(featMat, codes, payoutsArr, N, cur);
      curPerGame = N > 0 ? curProfit / N : 0;
      if(auditRes.disabled > 0){
        pushLog(nowTime() + '   [' + label + '] 🧹 審計：禁用 ' + auditRes.disabled + ' 條毒藥', 'audit');
      }
    }

    if(round % 5 === 0 && cur.length > 5){
      var pruned = pruneRules(cur, featMat, codes, payoutsArr, N);
      if(pruned.length < cur.length){
        cur = pruned;
        curProfit = calcProfitOn(featMat, codes, payoutsArr, N, cur);
        curPerGame = N > 0 ? curProfit / N : 0;
        pushLog(nowTime() + '   [' + label + '] ✂️ 剪枝：' + cur.length + ' 條', 'prune');
      }
    }

    if(roundsNoImprove >= ROUNDS_NO_IMPROVE_LIMIT){
      pushLog(nowTime() + '   [' + label + '] ⏹ 連續 ' + ROUNDS_NO_IMPROVE_LIMIT + ' 輪無進步，停止', 'warn');
      break;
    }

    currentRuleCount = cur.length;
    await yieldUI();
  }

  if(best === null) best = cloneRules(cur);
  var finalProfit = calcProfitOn(featMat, codes, payoutsArr, N, best);
  var finalPerGame = N > 0 ? finalProfit / N : 0;

  pushLog(nowTime() + '   [' + label + '] ✓ 完成：' + finalPerGame.toFixed(2) + '/場，規則 ' + best.length + '，評估 ' + evals, 'evo');

  return {rules: best, profit: finalProfit, perGame: finalPerGame, accepted: accepted, evals: evals};
}

/* ========== 格式化 ========== */
function fmtCond(c){ return FEATURES[c[0]] + OPS[c[1]] + Math.round(c[2] * 100) / 100; }
function fmtRule(r){
  if(!r.groups || r.groups.length === 0) return '(空)→' + r.then;
  var parts = [];
  for(var g = 0; g < r.groups.length; g++){
    parts.push('(' + r.groups[g].map(fmtCond).join('&') + ')');
  }
  return parts.join('|') + '→' + r.then;
}

function diagnose(rules, featMat, codes, payoutsArr, N){
  var stats = [];
  for(var i = 0; i < rules.length; i++) stats.push({rule:rules[i], hit:0, correct:0, wrong:0, profit:0});
  for(var i = 0; i < N; i++){
    var f = featMat[i];
    var pred = -1, hr = -1;
    for(var j = 0; j < rules.length; j++){
      if(!rules[j].on) continue;
      if(matchRule(f, rules[j])){ pred = rules[j].thenCode; hr = j; break; }
    }
    if(pred < 0 || hr === -1) continue;
    stats[hr].hit++;
    if(pred === codes[i]){ stats[hr].correct++; stats[hr].profit += payoutsArr[i*3 + pred] - 100; }
    else { stats[hr].wrong++; stats[hr].profit -= 100; }
  }
  return stats;
}

function renderRuleTable(stats){
  var html = '<table><thead><tr>' +
    '<th>#</th><th>ON</th><th>條件</th><th>指向</th>' +
    '<th>命中</th><th>對</th><th>錯</th><th>盈利</th>' +
    '</tr></thead><tbody>';
  for(var i = 0; i < stats.length; i++){
    var s = stats[i];
    var r = s.rule;
    var ss = fmtRule(r);
    if(ss.length > 90) ss = ss.slice(0, 87) + '...';
    var pcls = s.profit > 0 ? 'profit-pos' : (s.profit < 0 ? 'profit-neg' : '');
    var onTag = r.on ? '<span class="tag-ok">ON</span>' : '<span class="tag-off">OFF</span>';
    var thenTag = '<span class="tag-pred">' + r.then + '</span>';
    html += '<tr><td>R' + (i+1) + '</td><td>' + onTag + '</td>' +
      '<td style="text-align:left;font-size:10px">' + ss + '</td><td>' + thenTag + '</td>' +
      '<td>' + s.hit + '</td><td>' + s.correct + '</td><td>' + s.wrong + '</td>' +
      '<td class="' + pcls + '">' + s.profit + '</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('ruleTable').innerHTML = html;
}

/* ========== 公式生成 ========== */
function sheetOp(opIdx){
  var op = OPS[opIdx];
  if(op === '!=') return '<>';
  if(op === '==') return '=';
  return op;
}
function featToExpr(feat){
  switch(feat){
    case 'A': case 'B': case 'C': case 'D': case 'E': case 'F': return feat + '2:' + feat;
    case '|A-B|': return 'ABS(A2:A-B2:B)';
    case '|A-C|': return 'ABS(A2:A-C2:C)';
    case '|A-D|': return 'ABS(A2:A-D2:D)';
    case '|A-E|': return 'ABS(A2:A-E2:E)';
    case '|A-F|': return 'ABS(A2:A-F2:F)';
    case '|B-C|': return 'ABS(B2:B-C2:C)';
    case '|B-D|': return 'ABS(B2:B-D2:D)';
    case '|B-E|': return 'ABS(B2:B-E2:E)';
    case '|B-F|': return 'ABS(B2:B-F2:F)';
    case '|C-D|': return 'ABS(C2:C-D2:D)';
    case '|C-E|': return 'ABS(C2:C-E2:E)';
    case '|C-F|': return 'ABS(C2:C-F2:F)';
    case '|D-E|': return 'ABS(D2:D-E2:E)';
    case '|D-F|': return 'ABS(D2:D-F2:F)';
    case '|E-F|': return 'ABS(E2:E-F2:F)';
    case 'A-B': return '(A2:A-B2:B)';
    case 'A-C': return '(A2:A-C2:C)';
    case 'B-C': return '(B2:B-C2:C)';
    case 'D-F': return '(D2:D-F2:F)';
    case 'E-D': return '(E2:E-D2:D)';
    case 'A+B': return '(A2:A+B2:B)';
    case 'B+C': return '(B2:B+C2:C)';
    case 'D+E': return '(D2:D+E2:E)';
    case 'E+F': return '(E2:E+F2:F)';
    case 'D+F': return '(D2:D+F2:F)';
    case 'A+C': return '(A2:A+C2:C)';
    case 'A+B+C': return '(A2:A+B2:B+C2:C)';
    case 'D+E+F': return '(D2:D+E2:E+F2:F)';
    case 'A+D': return '(A2:A+D2:D)';
    case 'A/C': return 'IF(C2:C=0,0,A2:A/C2:C)';
    case 'D/F': return 'IF(F2:F=0,0,D2:D/F2:F)';
    case 'D/(D+F)': return 'IF(D2:D+F2:F=0,0,D2:D/(D2:D+F2:F))';
    case 'MAX(A,B,C)': return 'MAX(A2:A,B2:B,C2:C)';
    case 'MIN(A,B,C)': return 'MIN(A2:A,B2:B,C2:C)';
    case 'MAX(D,E,F)': return 'MAX(D2:D,E2:E,F2:F)';
    case 'MIN(D,E,F)': return 'MIN(D2:D,E2:E,F2:F)';
    default: return '0';
  }
}
function buildCondSheet(cond){
  var op = sheetOp(cond[1]);
  var v = Math.round(cond[2] * 100) / 100;
  return '(' + featToExpr(FEATURES[cond[0]]) + op + v + ')';
}
function buildGroupSheet(g){
  if(!g.length) return 'TRUE';
  return g.map(buildCondSheet).join('*');
}
function buildRuleSheet(r){
  if(!r.groups.length) return 'FALSE';
  if(r.groups.length === 1) return buildGroupSheet(r.groups[0]);
  return '(' + r.groups.map(function(g){ return '(' + buildGroupSheet(g) + ')'; }).join('+') + ')';
}
function genSingleFormula(rules){
  var active = [];
  for(var i = 0; i < rules.length; i++) if(rules[i].on) active.push(rules[i]);
  if(!active.length) return '=ARRAYFORMULA(IF(A2:A="","","skip"))';
  var body = '';
  for(var i = 0; i < active.length; i++){
    var expr = buildRuleSheet(active[i]);
    if(active[i].groups.length > 1){
      body += 'IF((' + expr + ')>0,"' + active[i].then + '",';
    } else {
      body += 'IF(' + expr + ',"' + active[i].then + '",';
    }
  }
  body += '"skip"';
  for(var j = 0; j < active.length; j++) body += ')';
  return '=ARRAYFORMULA(IF((A2:A="")+(B2:B="")+(C2:C="")+(D2:D="")+(E2:E="")+(F2:F=""),"",' + body + '))';
}

/* ========== 統計：平均 + 標準差 + t 檢定 ========== */
function calcStats(values){
  var n = values.length;
  if(n === 0) return {mean: 0, std: 0, n: 0, t: 0, min: 0, max: 0, se: 0};
  var sum = 0;
  for(var i = 0; i < n; i++) sum += values[i];
  var mean = sum / n;
  var sumSq = 0;
  for(var i = 0; i < n; i++) sumSq += (values[i] - mean) * (values[i] - mean);
  var variance = n > 1 ? sumSq / (n - 1) : 0;
  var std = Math.sqrt(variance);
  var se = n > 0 ? std / Math.sqrt(n) : 0;  // 標準誤
  var t = se > 0 ? mean / se : 0;
  var minVal = Math.min.apply(null, values);
  var maxVal = Math.max.apply(null, values);
  return {mean: mean, std: std, n: n, t: t, min: minVal, max: maxVal, se: se};
}

/* ========== 主流程 ========== */
async function start(){

  currentFold = 0;
  currentRound = 0;

  var N_FOLDS = parseInt(document.getElementById('folds').value);

  maxRounds = parseInt(document.getElementById('maxRounds').value);
  totalFolds = N_FOLDS;
  totalReps = REPEATS;

  var totalJobs = N_FOLDS * REPEATS;

  pushLog('═══════════════════════════════════════════════════════════', 'head');
  pushLog('🚀 v39 — ' + N_FOLDS + ' 折 × ' + REPEATS + ' 次重複（共 ' + totalJobs + ' 個結果）', 'head');
  pushLog('═══════════════════════════════════════════════════════════', 'head');
  pushLog(nowTime() + ' 原始有效行數：' + parsed.total, 'info');
  pushLog(nowTime() + ' 重複：' + parsed.dups + '（已忽略）', 'warn');
  pushLog(nowTime() + ' 去重後：' + parsed.rows.length + ' 筆', 'success');
  pushLog(nowTime() + ' 🅾️ 起點：空（0 條規則）', 'gen');
  pushLog(nowTime() + ' 🔄 ' + N_FOLDS + ' 折 × ' + REPEATS + ' 次重複 = ' + totalJobs + ' 個獨立結果', 'rep');
  pushLog(nowTime() + ' 🧬 每折最多 ' + maxRounds + ' 輪 × ' + ITER_PER_ROUND + ' 迭代', 'round');
  pushLog(nowTime() + ' 📊 統計方法：t 檢定（t > 2.0 才顯著）', 'stats');
  pushLog('');

  var allRowsBase = parsed.rows.slice();

  for(var rep = 1; rep <= REPEATS; rep++){
    if(!running) break;
    currentRep = rep;

    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog(nowTime() + ' 🔁 重複 ' + rep + '/' + REPEATS + '（重新打亂）', 'rep');
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    await yieldUI();

    // 每次重複重新打亂
    var allRows = allRowsBase.slice();
    for(var i = allRows.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = allRows[i]; allRows[i] = allRows[j]; allRows[j] = tmp;
    }

    var n = allRows.length;
    var foldSize = Math.floor(n / N_FOLDS);

    for(var fold = 1; fold <= N_FOLDS; fold++){
      if(!running) break;
      currentFold = fold;
      currentRound = 0;
      currentRuleCount = 0;
      updateProgress();

      var repFoldLabel = '重' + rep + '-折' + fold;
      pushLog(nowTime() + ' 🔄 [' + repFoldLabel + '] 開始', 'fold');
      await yieldUI();

      var testStart = (fold - 1) * foldSize;
      var testEnd = (fold === N_FOLDS) ? n : fold * foldSize;
      var trainRows = [], testRows = [];
      for(var i = 0; i < n; i++){
        if(i >= testStart && i < testEnd) testRows.push(allRows[i]);
        else trainRows.push(allRows[i]);
      }

      trainN = trainRows.length;
      testN = testRows.length;

      pushLog(nowTime() + '   [' + repFoldLabel + '] 訓練 ' + trainN + ' / 測試 ' + testN, 'dim');

      trainFeat = extractFeatures(trainRows);
      var trm = extractMeta(trainRows);
      trainCodes = trm.codes; trainPayouts = trm.payouts;

      testFeat = extractFeatures(testRows);
      var tem = extractMeta(testRows);
      testCodes = tem.codes; testPayouts = tem.payouts;

      var evoRes = await evolveFromEmpty(trainFeat, trainCodes, trainPayouts, trainN, maxRounds, repFoldLabel);
      if(!running) break;

      evalCount += evoRes.evals;

      var evoTestP = calcProfitOn(testFeat, testCodes, testPayouts, testN, evoRes.rules);
      var evoTestPer = testN > 0 ? evoTestP / testN : 0;

      pushLog(nowTime() + '   [' + repFoldLabel + '] 🩷 測試集：' + evoTestPer.toFixed(2) + '/場', 'test');

      foldResults.push({
        rep: rep,
        fold: fold,
        trainN: trainN,
        testN: testN,
        trainPer: evoRes.perGame,
        testPer: evoTestPer,
        accepted: evoRes.accepted,
        evals: evoRes.evals,
        rulesCount: evoRes.rules.length
      });

      lastEvolvedRules = evoRes.rules;
      currentRuleCount = evoRes.rules.length;

      updateTestAvg();
      await yieldUI();
    }
  }

  finish();

  function finish(){
    var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

    var testVals = [];
    var trainVals = [];
    for(var i = 0; i < foldResults.length; i++){
      testVals.push(foldResults[i].testPer);
      trainVals.push(foldResults[i].trainPer);
    }

    var sTest = calcStats(testVals);
    var sTrain = calcStats(trainVals);

    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog('🏆 v39 完成', 'stats');
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog('   🩷 測試每場統計（' + sTest.n + ' 個結果）：', 'test');
    pushLog('      平均：' + sTest.mean.toFixed(3), 'test');
    pushLog('      標準差：' + sTest.std.toFixed(3), 'stats');
    pushLog('      標準誤：' + sTest.se.toFixed(3), 'stats');
    pushLog('      t 值：' + sTest.t.toFixed(3), sTest.t > 2 ? 'success' : 'dim');
    pushLog('      範圍：' + sTest.min.toFixed(3) + ' ~ ' + sTest.max.toFixed(3), 'dim');
    pushLog('      訓練每場（平均）：' + sTrain.mean.toFixed(3), 'dim');
    pushLog('');
    pushLog('   統計判定：', 'stats');
    if(sTest.t > 2 && sTest.mean > 0){
      pushLog('      ✅ 顯著正信號（t = ' + sTest.t.toFixed(2) + ' > 2.0）', 'success');
    } else if(sTest.t < -2){
      pushLog('      ❌ 顯著負信號（t = ' + sTest.t.toFixed(2) + ' < -2.0）', 'err');
    } else {
      pushLog('      ⚠️ 無顯著信號（|t| = ' + Math.abs(sTest.t).toFixed(2) + ' < 2.0）', 'warn');
    }
    pushLog('');
    pushLog('   總評估：' + evalCount + ' 次', 'speed');
    pushLog('   總耗時：' + elapsed + ' 秒', 'speed');
    pushLog('═══════════════════════════════════════════════════════════', 'head');

    document.getElementById('best').style.display = 'block';
    document.getElementById('summary').innerHTML = '🏆 ' + totalFolds + ' 折 × ' + totalReps + ' 次 = ' + sTest.n + ' 結果　🩷 平均 <b>' + sTest.mean.toFixed(2) + '</b>　t = <b>' + sTest.t.toFixed(2) + '</b>';

    var verdictHTML = '';
    if(foldResults.length === 0){
      verdictHTML = '<div class="big-num verdict-neutral">無資料</div>';
    } else {
      var color = sTest.mean > 0 ? 'verdict-pos' : 'verdict-neg';
      verdictHTML = '<div class="big-num ' + color + '">' + sTest.mean.toFixed(2) + '</div>' +
        '<div style="font-size:13px;color:#666;margin-top:4px">測試每場平均（' + sTest.n + ' 個結果）</div>' +
        '<div style="font-size:14px;margin-top:8px">標準差 ±' + sTest.std.toFixed(2) + '，標準誤 ±' + sTest.se.toFixed(2) + '</div>' +
        '<div style="font-size:14px">範圍：' + sTest.min.toFixed(2) + ' ~ ' + sTest.max.toFixed(2) + '</div>';

      var verdictLine = '';
      if(sTest.t > 2 && sTest.mean > 0){
        verdictLine = '<div style="font-size:16px;font-weight:bold;color:#0a7a0a;margin-top:10px">✅ 顯著正信號（t = ' + sTest.t.toFixed(2) + ' > 2.0）</div>';
        verdictLine += '<div style="font-size:12px;color:#0a7a0a;margin-top:4px">統計上可確認：真的有賺錢能力</div>';
      } else if(sTest.t < -2){
        verdictLine = '<div style="font-size:16px;font-weight:bold;color:#c00;margin-top:10px">❌ 顯著負信號（t = ' + sTest.t.toFixed(2) + ' < -2.0）</div>';
        verdictLine += '<div style="font-size:12px;color:#c00;margin-top:4px">統計上可確認：平均虧損</div>';
      } else if(sTest.mean > 0){
        verdictLine = '<div style="font-size:16px;font-weight:bold;color:#e67e22;margin-top:10px">🟡 微弱正信號（t = ' + sTest.t.toFixed(2) + '）</div>';
        verdictLine += '<div style="font-size:12px;color:#e67e22;margin-top:4px">統計上不顯著，建議加資料</div>';
      } else {
        verdictLine = '<div style="font-size:16px;font-weight:bold;color:#666;margin-top:10px">⚠️ 無顯著信號（t = ' + sTest.t.toFixed(2) + '）</div>';
        verdictLine += '<div style="font-size:12px;color:#666;margin-top:4px">與「隨機」無法區分</div>';
      }

      verdictHTML += verdictLine;
    }
    document.getElementById('verdictBox').innerHTML = verdictHTML;

    // 分佈表
    var sorted = testVals.slice().sort(function(a,b){ return a - b; });
    var bins = [-100, -50, -30, -20, -10, 0, 10, 20, 30, 50, 100];
    var distHtml = '<table class="dist-table"><thead><tr>' +
      '<th>區間</th><th>數量</th><th>比例</th>' +
      '</tr></thead><tbody>';
    for(var b = 0; b < bins.length - 1; b++){
      var lo = bins[b], hi = bins[b+1];
      var cnt = 0;
      for(var k = 0; k < sorted.length; k++){
        if(sorted[k] >= lo && sorted[k] < hi) cnt++;
      }
      if(cnt > 0 || (lo <= 0 && hi > 0)){
        var pct = (cnt / sorted.length * 100).toFixed(1);
        distHtml += '<tr><td>' + lo + ' ~ ' + hi + '</td><td>' + cnt + '</td><td>' + pct + '%</td></tr>';
      }
    }
    distHtml += '</tbody></table>';
    document.getElementById('distTable').innerHTML = distHtml;

    // 明細表
    var fHtml = '<table><thead><tr>' +
      '<th>重複</th><th>折</th><th>訓練</th><th>測試</th>' +
      '<th>訓練每場</th><th>測試每場</th>' +
      '<th>規則數</th><th>接受</th><th>評估</th>' +
      '</tr></thead><tbody>';
    for(var i = 0; i < foldResults.length; i++){
      var r = foldResults[i];
      fHtml += '<tr>' +
        '<td>' + r.rep + '</td>' +
        '<td>#' + r.fold + '</td>' +
        '<td>' + r.trainN + '</td>' +
        '<td>' + r.testN + '</td>' +
        '<td>' + r.trainPer.toFixed(2) + '</td>' +
        '<td><b>' + r.testPer.toFixed(2) + '</b></td>' +
        '<td>' + r.rulesCount + '</td>' +
        '<td>' + r.accepted + '</td>' +
        '<td>' + r.evals + '</td>' +
        '</tr>';
    }
    fHtml += '</tbody></table>';
    document.getElementById('foldTable').innerHTML = fHtml;

    if(lastEvolvedRules){
      var formula = genSingleFormula(lastEvolvedRules);
      document.getElementById('charInfo').innerHTML = '字符數：<b>' + formula.length + '</b>';
      document.getElementById('txtOut').value = formula;
      var stats = diagnose(lastEvolvedRules, trainFeat, trainCodes, trainPayouts, trainN);
      renderRuleTable(stats);
      document.getElementById('diag').style.display = 'block';
    }

    running = false;
    document.getElementById('btnRun').disabled = false;
    document.getElementById('btnStop').disabled = true;
    updateProgress();
    updateTestAvg();
    updateSpeedUI();
    flushNow();
  }
}

function stop(){
  running = false;
  document.getElementById('btnStop').disabled = true;
  pushLog('⏹ 使用者手動停止', 'warn');
  updateProgress();
  flushNow();
}
function copyIt(id){
  var el = document.getElementById(id);
  if(!el) return;
  var txt = el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      showMsg('✅ 已複製 ' + txt.length + ' 字元', true);
    }).catch(function(){ fallbackCopy(txt); });
  } else { fallbackCopy(txt); }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg('✅ 已複製 ' + text.length + ' 字元', true);
  else showMsg('❌ 複製失敗', false);
}
function showMsg(text, ok){
  var m = document.getElementById('msg');
  m.textContent = text; m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  setTimeout(function(){ m.style.display = 'none'; }, 3000);
}

(function(){
  document.getElementById('log').textContent = '等待開始...';
})();
</script>
