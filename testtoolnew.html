</style>

<script>
'use strict';

/* ==========================================================
   翻譯
   ========================================================== */
var TXT = {
  zh: {
    title: '🧬 智慧規則優化器 v17 — 空起始自動生成',
    desc: '空起始 → 自動生成規則 → 座標下降 + 結構搜尋 → 演化最優解。',
    strength: '搜尋強度：',
    run: '🚀 開始搜尋',
    stop: '⏹ 停止',
    hRule: '📋 自動生成的規則表',
    waiting: '等待開始...',
    thRule: '規則', thOn: '啟用', thCond: '條件', thThen: '指向',
    thHit: '命中', thCorrect: '對', thWrong: '錯', thProfit: '盈利',
    noData: '沒有有效數據'
  },
  en: {
    title: '🧬 Smart Rule Optimizer v17 — Auto-Generate from Empty',
    desc: 'Empty start → auto-generate rules → coordinate descent + structure search → evolve best.',
    strength: 'Strength: ',
    run: '🚀 Search',
    stop: '⏹ Stop',
    hRule: '📋 Auto-Generated Rules',
    waiting: 'Waiting...',
    thRule: 'Rule', thOn: 'On', thCond: 'Conds', thThen: 'Then',
    thHit: 'Hit', thCorrect: 'OK', thWrong: 'Err', thProfit: 'Profit',
    noData: 'No valid data'
  }
};
var LANG = 'zh';
function t(k){ return (TXT[LANG] && TXT[LANG][k]) || k; }
function setLang(lang){
  LANG = lang;
  document.getElementById('btn-zh').className = 'lang-btn' + (lang==='zh'?' active':'');
  document.getElementById('btn-en').className = 'lang-btn' + (lang==='en'?' active':'');
  document.getElementById('title').textContent = t('title');
  document.getElementById('desc').textContent = t('desc');
  document.getElementById('lbl-strength').textContent = t('strength');
  document.getElementById('btnRun').textContent = t('run');
  document.getElementById('btnStop').textContent = t('stop');
  document.getElementById('h-rule').textContent = t('hRule');
  var logEl = document.getElementById('log');
  if(logEl && !logEl.dataset.hasContent) logEl.textContent = t('waiting');
}

/* ==========================================================
   全域
   ========================================================== */
var data = [];
var running = false;
var startTime = 0;
var evalCount = 0;
var currentRuleCount = 0;
var logBuffer = [];
var logTimer = null;
var LOG_MAX = 5000;

/* ==========================================================
   日誌
   ========================================================== */
function nowTime(){
  if(!startTime) return '[00:00.000]';
  var ms = Date.now() - startTime;
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return '[' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0') + '.' + String(ms%1000).padStart(3,'0') + ']';
}
function pushLog(text, cls){
  logBuffer.push({ text: text, cls: cls || '' });
  if(!logTimer) logTimer = setTimeout(flushLog, 60);
}
function flushLog(){
  logTimer = null;
  if(logBuffer.length === 0) return;
  var logEl = document.getElementById('log');
  logEl.dataset.hasContent = '1';
  if(!logEl.dataset.started){
    logEl.innerHTML = '';
    logEl.dataset.started = '1';
  }
  var frag = document.createDocumentFragment();
  for(var i = 0; i < logBuffer.length; i++){
    var e = logBuffer[i];
    var div = document.createElement('div');
    if(e.cls) div.className = 'l-' + e.cls;
    div.textContent = e.text;
    frag.appendChild(div);
  }
  logBuffer = [];
  logEl.appendChild(frag);
  while(logEl.children.length > LOG_MAX) logEl.removeChild(logEl.firstChild);
  if(document.getElementById('autoScroll').checked) logEl.scrollTop = logEl.scrollHeight;
}
function clearLog(){
  var logEl = document.getElementById('log');
  logEl.innerHTML = '';
  logEl.dataset.hasContent = '1';
  logEl.dataset.started = '1';
  logBuffer = [];
}

/* ==========================================================
   解析 + 去重
   ========================================================== */
function parseData(text){
  var rows = [];
  var seen = {};
  var dups = 0;
  var totalValid = 0;
  var lines = text.split('\n');
  for(var i = 0; i < lines.length; i++){
    var line = lines[i].trim();
    if(!line) continue;
    var p = line.split(/\s+/);
    if(p.length < 8) continue;
    var v = p.slice(0,6).map(Number);
    var score = p[6];
    var r = p[7];
    if(v.some(isNaN)) continue;
    if(['H','D','A'].indexOf(r) === -1) continue;
    totalValid++;
    var sig = v[0]+'|'+v[1]+'|'+v[2]+'|'+v[3]+'|'+v[4]+'|'+v[5]+'|'+score+'|'+r;
    if(seen[sig]){ dups++; continue; }
    seen[sig] = 1;
    rows.push({A:v[0],B:v[1],C:v[2],D:v[3],E:v[4],F:v[5],score:score,result:r,sig:sig});
  }
  return {rows:rows, total:totalValid, dups:dups};
}

/* ==========================================================
   取值
   ========================================================== */
function getVal(row, col){
  switch(col){
    case 'A': return row.A;
    case 'B': return row.B;
    case 'C': return row.C;
    case 'D': return row.D;
    case 'E': return row.E;
    case 'F': return row.F;
    case '|A-C|': return Math.abs(row.A-row.C);
    case '|D-F|': return Math.abs(row.D-row.F);
    case 'D-F': return row.D-row.F;
    case 'F-D': return row.F-row.D;
    case 'A-C': return row.A-row.C;
    case 'C-A': return row.C-row.A;
    case 'E-D': return row.E-row.D;
  }
  return 0;
}
function cmp(a, op, b){
  if(op==='>') return a>b;
  if(op==='>=') return a>=b;
  if(op==='<') return a<b;
  if(op==='<=') return a<=b;
  if(op==='==') return a===b;
  if(op==='!=') return a!==b;
  return false;
}
function matchRule(row, rule){
  for(var i=0;i<rule.cond.length;i++){
    var c = rule.cond[i];
    if(!cmp(getVal(row,c[0]), c[1], c[2])) return false;
  }
  return true;
}
function predict(row, rules){
  for(var i=0;i<rules.length;i++){
    var r = rules[i];
    if(!r.on) continue;
    if(matchRule(row,r)) return r.then;
  }
  return 'skip';
}
function calcProfit(rows, rules){
  evalCount++;
  var total = 0;
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    var p = predict(r, rules);
    if(p==='skip') continue;
    if(p===r.result){
      if(p==='H') total += r.D-100;
      else if(p==='D') total += r.E-100;
      else if(p==='A') total += r.F-100;
    } else total -= 100;
  }
  return total;
}
function cloneRules(rules){
  var out = [];
  for(var i=0;i<rules.length;i++){
    var r = rules[i];
    var c = [];
    for(var j=0;j<r.cond.length;j++) c.push([r.cond[j][0],r.cond[j][1],r.cond[j][2]]);
    out.push({on:r.on, then:r.then, cond:c});
  }
  return out;
}
function cloneConds(cond){
  var out = [];
  for(var i=0;i<cond.length;i++) out.push([cond[i][0],cond[i][1],cond[i][2]]);
  return out;
}
function ri(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }

var RESULTS = ['H','D','A','skip'];
var COLS = ['A','B','C','D','E','F','|A-C|','|D-F|','D-F','F-D','A-C','C-A','E-D'];
var OPS = ['>','>=','<','<='];
var MAX_RULES = 120;

function fmtCond(c){ return c[0]+c[1]+c[2]; }
function fmtRule(r){
  if(r.cond.length === 0) return '(無條件) → ' + r.then;
  return r.cond.map(fmtCond).join(' & ') + ' → ' + r.then;
}

/* ==========================================================
   ⭐ 規則生成
   ========================================================== */
function sampleColumnValue(col){
  if(data.length === 0) return ri(0, 500);
  // 從資料抽樣 (最多 40 個)
  var samples = [];
  var n = Math.min(40, data.length);
  for(var i = 0; i < n; i++){
    var idx = Math.floor(Math.random() * data.length);
    samples.push(getVal(data[idx], col));
  }
  // 取樣本之一作為基準
  var base = samples[ri(0, samples.length - 1)];
  // 加噪聲 ±20%
  var range = Math.max(5, Math.abs(base) * 0.2);
  var noise = (Math.random() * 2 - 1) * range;
  var val = Math.round(base + noise);
  return Math.max(0, val);
}

function generateRandomCondition(){
  var col = COLS[ri(0, COLS.length - 1)];
  var op = OPS[ri(0, OPS.length - 1)];
  var val = sampleColumnValue(col);
  return [col, op, val];
}

function generateRandomRule(){
  var numConds = 1 + ri(0, 2);  // 1-3 條件
  var conds = [];
  var usedCols = {};
  for(var i = 0; i < numConds; i++){
    var tries = 0;
    var c;
    do {
      c = generateRandomCondition();
      tries++;
    } while(usedCols[c[0]] && tries < 5);
    usedCols[c[0]] = 1;
    conds.push(c);
  }
  return {
    on: 1,
    then: RESULTS[ri(0, 3)],
    cond: conds
  };
}

function mutateGenRule(rules){
  if(rules.length >= MAX_RULES) return {rules: rules, structural: 0, generated: false};
  var newRules = cloneRules(rules);
  var rule = generateRandomRule();
  // 插入位置：通常是末尾，但有時插中間（測試不同優先級）
  var pos;
  if(Math.random() < 0.7){
    pos = newRules.length;  // 末尾
  } else {
    pos = Math.floor(Math.random() * (newRules.length + 1));
  }
  newRules.splice(pos, 0, rule);
  return {rules: newRules, structural: 1, generated: true, genRule: rule, genPos: pos};
}

/* ==========================================================
   其他變異
   ========================================================== */
function mutateNumeric(rules, intensity){
  var r = cloneRules(rules);
  var nMut = ri(1, 3);
  for(var k = 0; k < nMut; k++){
    var idx = ri(0, r.length - 1);
    if(r[idx].cond.length === 0) continue;
    var ci = ri(0, r[idx].cond.length - 1);
    var v = r[idx].cond[ci][2];
    var step = 1;
    if(Math.abs(v) >= 50) step = 2;
    if(Math.abs(v) >= 100) step = 5;
    if(Math.abs(v) >= 300) step = 10;
    if(Math.abs(v) >= 700) step = 20;
    step = step * (intensity || 1);
    var delta = ri(-5, 5) * step;
    r[idx].cond[ci][2] = Math.max(0, v + delta);
  }
  return {rules:r, structural:0};
}
function mutateResult(rules){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules:r, structural:1};
  var idx = ri(0, r.length - 1);
  var old = r[idx].then;
  var opts = RESULTS.filter(function(x){ return x !== old; });
  r[idx].then = opts[ri(0, opts.length - 1)];
  return {rules:r, structural:1};
}
function mutateOn(rules){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules:r, structural:1};
  var idx = ri(0, r.length - 1);
  r[idx].on = r[idx].on ? 0 : 1;
  return {rules:r, structural:1};
}
function mutateDelete(rules){
  var r = cloneRules(rules);
  if(r.length <= 1) return {rules:r, structural:1};
  r.splice(ri(0, r.length - 1), 1);
  return {rules:r, structural:1};
}
function mutateSwap(rules){
  var r = cloneRules(rules);
  if(r.length < 2) return {rules:r, structural:1};
  var i = ri(0, r.length - 2);
  var tmp = r[i]; r[i] = r[i+1]; r[i+1] = tmp;
  return {rules:r, structural:1};
}
function mutateAddCond(rules){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules:r, structural:1};
  var idx = ri(0, r.length - 1);
  r[idx].cond.push(generateRandomCondition());
  return {rules:r, structural:1};
}
function mutateDelCond(rules){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules:r, structural:1};
  var idx = ri(0, r.length - 1);
  if(r[idx].cond.length <= 1) return {rules:r, structural:1};
  r[idx].cond.splice(ri(0, r[idx].cond.length - 1), 1);
  return {rules:r, structural:1};
}
function mutateSplit(rules){
  var r = cloneRules(rules);
  if(r.length === 0 || r.length >= MAX_RULES) return {rules:r, structural:1};
  var srcIdx = ri(0, r.length - 1);
  var copy = {on: r[srcIdx].on, then: r[srcIdx].then, cond: cloneConds(r[srcIdx].cond)};
  copy.cond.push(generateRandomCondition());
  r.splice(srcIdx + 1, 0, copy);
  return {rules:r, structural:1};
}

/* ==========================================================
   統一變異分派
   ========================================================== */
function mutate(rules, intensity){
  var cnt = rules.length;
  var genChance;
  if(cnt === 0) genChance = 1.0;
  else if(cnt < 3) genChance = 0.55;
  else if(cnt < 8) genChance = 0.30;
  else if(cnt < 20) genChance = 0.18;
  else if(cnt < 50) genChance = 0.10;
  else genChance = 0.05;

  var p = Math.random();
  if(p < genChance) return mutateGenRule(rules);

  var p2 = Math.random();
  if(p2 < 0.35) return mutateNumeric(rules, intensity);
  if(p2 < 0.55) return mutateResult(rules);
  if(p2 < 0.67) return mutateOn(rules);
  if(p2 < 0.76) return mutateSwap(rules);
  if(p2 < 0.84) return mutateDelete(rules);
  if(p2 < 0.92) return mutateAddCond(rules);
  if(p2 < 0.97) return mutateDelCond(rules);
  return mutateSplit(rules);
}

/* ==========================================================
   ⭐ 座標下降（含生成）
   ========================================================== */
function optimizeRules(rows, startRules, label, maxPasses, quiet){
  var cur = cloneRules(startRules);
  var curProfit = calcProfit(rows, cur);
  var best = cloneRules(cur);
  var bestProfit = curProfit;
  var verbose = document.getElementById('verbose').checked;
  var showBad = document.getElementById('showBad').checked;
  var pass = 0;
  var sinceImprove = 0;

  if(!quiet){
    pushLog(nowTime() + ' ▶ ' + label + ' 起始盈利: ' + curProfit + '（規則數 ' + cur.length + '）', 'gen');
  }

  while(running && pass < maxPasses){
    pass++;
    if(!quiet){
      pushLog(nowTime() + ' ── ' + label + ' 第 ' + pass + ' 輪（盈利 ' + curProfit + '，規則 ' + cur.length + '）──', 'dim');
    }

    var improvedThisPass = false;
    var iterPerPass = 500;

    for(var i = 0; i < iterPerPass && running; i++){
      var m = mutate(cur, 1 + Math.floor(pass / 3));
      var cand = m.rules;
      var candProfit = calcProfit(rows, cand);
      var delta = candProfit - curProfit;

      if(candProfit >= curProfit){
        cur = cand;
        curProfit = candProfit;
        improvedThisPass = true;
        sinceImprove = 0;

        if(m.generated && verbose){
          pushLog(nowTime() + '   [新增規則 #' + cur.length + '] ' + fmtRule(m.genRule) + '  盈利 ' + candProfit, 'newrule');
        }

        if(candProfit > bestProfit){
          bestProfit = candProfit;
          best = cloneRules(cand);
          pushLog(nowTime() + ' ★★★ 新最優：' + bestProfit + '（Δ+' + delta + '，規則數 ' + cur.length + '）', 'best');
        }
      } else {
        sinceImprove++;
        if(showBad && verbose && i % 20 === 0){
          pushLog(nowTime() + '   ✗ 嘗試失敗（Δ' + delta + '）', 'bad');
        }
        // 退火：小機率接受較差解
        var T = 100 / (1 + i / 100);
        if(Math.random() < Math.exp(delta / T)){
          cur = cand;
          curProfit = candProfit;
        }
      }

      if(i % 100 === 0){
        updateStatsUI();
      }
    }

    if(!quiet){
      pushLog(nowTime() + ' ── 第 ' + pass + ' 輪結束（盈利 ' + curProfit + '）──', improvedThisPass ? 'ok' : 'dim');
    }

    if(!improvedThisPass && sinceImprove > 1500) break;
  }

  if(!quiet){
    pushLog(nowTime() + ' ✓ ' + label + ' 收斂於 ' + bestProfit + '（' + pass + ' 輪）', 'success');
  }
  return {rules: best, profit: bestProfit, passes: pass};
}

/* ==========================================================
   隨機起點：從空開始，先放幾個隨機規則
   ========================================================== */
function randomStartRules(seedRules){
  var r = [];
  var n = ri(3, 12);
  for(var i = 0; i < n; i++){
    r.push(generateRandomRule());
  }
  return r;
}

/* ==========================================================
   診斷
   ========================================================== */
function diagnose(rows, rules){
  var stats = [];
  for(var i=0;i<rules.length;i++){
    stats.push({idx:i, rule:rules[i], hit:0, correct:0, wrong:0, profit:0});
  }
  for(var i=0;i<rows.length;i++){
    var row = rows[i];
    var p = 'skip';
    var hitRule = -1;
    for(var j=0;j<rules.length;j++){
      if(!rules[j].on) continue;
      if(matchRule(row, rules[j])){ p = rules[j].then; hitRule = j; break; }
    }
    if(p === 'skip' || hitRule === -1) continue;
    var s = stats[hitRule];
    s.hit++;
    var gp;
    if(p === row.result){
      s.correct++;
      if(p === 'H') gp = row.D - 100;
      else if(p === 'D') gp = row.E - 100;
      else gp = row.F - 100;
    } else {
      s.wrong++;
      gp = -100;
    }
    s.profit += gp;
  }
  return stats;
}

function renderRuleTable(stats){
  var html = '<table><thead><tr>' +
    '<th>' + t('thRule') + '</th>' +
    '<th>' + t('thOn') + '</th>' +
    '<th>' + t('thCond') + '</th>' +
    '<th>' + t('thThen') + '</th>' +
    '<th>' + t('thHit') + '</th>' +
    '<th>' + t('thCorrect') + '</th>' +
    '<th>' + t('thWrong') + '</th>' +
    '<th>' + t('thProfit') + '</th>' +
    '</tr></thead><tbody>';

  for(var i=0;i<stats.length;i++){
    var s = stats[i];
    var r = s.rule;
    var condStr = r.cond.map(function(c){ return c[0]+c[1]+c[2]; }).join(' & ');
    if(!condStr) condStr = '—';
    if(condStr.length > 80) condStr = condStr.slice(0, 77) + '...';
    var pcls = s.profit > 0 ? 'profit-pos' : (s.profit < 0 ? 'profit-neg' : '');
    var onTag = r.on ? '<span class="tag-ok">ON</span>' : '<span class="tag-off">OFF</span>';
    var thenTag = '<span class="tag-pred">' + r.then + '</span>';

    html += '<tr>' +
      '<td>R' + (i+1) + '</td>' +
      '<td>' + onTag + '</td>' +
      '<td style="text-align:left;font-size:10px">' + condStr + '</td>' +
      '<td>' + thenTag + '</td>' +
      '<td>' + s.hit + '</td>' +
      '<td>' + s.correct + '</td>' +
      '<td>' + s.wrong + '</td>' +
      '<td class="' + pcls + '">' + s.profit + '</td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('ruleTable').innerHTML = html;
}

/* ==========================================================
   生成公式
   ========================================================== */
function sheetOp(op){
  if(op==='!=') return '<>';
  if(op==='==') return '=';
  return op;
}
function buildCond(c){
  var col=c[0], op=c[1], val=c[2];
  var sop = sheetOp(op);
  switch(col){
    case 'A': return '(A2:A' + sop + val + ')';
    case 'B': return '(B2:B' + sop + val + ')';
    case 'C': return '(C2:C' + sop + val + ')';
    case 'D': return '(D2:D' + sop + val + ')';
    case 'E': return '(E2:E' + sop + val + ')';
    case 'F': return '(F2:F' + sop + val + ')';
    case '|A-C|': return '(ABS(A2:A-C2:C)' + sop + val + ')';
    case '|D-F|': return '(ABS(D2:D-F2:F)' + sop + val + ')';
    case 'D-F': return '((D2:D-F2:F)' + sop + val + ')';
    case 'F-D': return '((F2:F-D2:D)' + sop + val + ')';
    case 'A-C': return '((A2:A-C2:C)' + sop + val + ')';
    case 'C-A': return '((C2:C-A2:A)' + sop + val + ')';
    case 'E-D': return '((E2:E-D2:D)' + sop + val + ')';
    default: return 'FALSE';
  }
}
function buildCondExpr(rule){
  if(rule.cond.length === 0) return 'TRUE';
  var parts = [];
  for(var i=0;i<rule.cond.length;i++) parts.push(buildCond(rule.cond[i]));
  return parts.join('*');
}
function genFormula(rules){
  var active = [];
  for(var i=0;i<rules.length;i++) if(rules[i].on) active.push(rules[i]);
  if(active.length === 0) return '=ARRAYFORMULA(IF(A2:A="","","skip"))';
  var body = '';
  for(var i=0;i<active.length;i++){
    body += 'IF(' + buildCondExpr(active[i]) + ',"' + active[i].then + '",';
  }
  body += '"skip"';
  for(var j=0;j<active.length;j++) body += ')';
  return '=ARRAYFORMULA(IF((A2:A="")+(B2:B="")+(C2:C="")+(D2:D="")+(E2:E="")+(F2:F=""),"",' + body + '))';
}

/* ==========================================================
   統計
   ========================================================== */
function updateStatsUI(gen, best){
  if(gen !== undefined) document.getElementById('stat-gen').innerHTML = '起點: <b>' + gen + '</b>';
  if(best !== undefined) document.getElementById('stat-best').innerHTML = '最佳: <b>' + best + '</b>';
  var el = ((Date.now() - startTime) / 1000).toFixed(0);
  document.getElementById('stat-time').innerHTML = '時間: <b>' + el + 's</b>';
  var speed = el > 0 ? (evalCount / el).toFixed(0) : '0';
  document.getElementById('stat-speed').innerHTML = '評估/秒: <b>' + speed + '</b>';
  document.getElementById('stat-evals').innerHTML = '總掃描: <b>' + evalCount + '</b>';
  document.getElementById('stat-rules').innerHTML = '規則數: <b>' + currentRuleCount + '</b>';
}

/* ==========================================================
   主流程
   ========================================================== */
function start(){
  var parsed = parseData(document.getElementById('input').value);
  data = parsed.rows;
  if(data.length === 0){ alert(t('noData')); return; }

  running = true;
  startTime = Date.now();
  evalCount = 0;
  currentRuleCount = 0;
  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('diag').style.display = 'none';
  document.getElementById('best').style.display = 'none';
  document.getElementById('liveStats').style.display = 'flex';
  document.getElementById('progbar').style.width = '0%';

  clearLog();

  var N = parseInt(document.getElementById('strength').value);
  var globalBest = [];
  var globalProfit = 0;

  pushLog('═══════════════════════════════════════════════════════════', 'head');
  pushLog('🧬 智慧規則優化器 v17 — 空起始自動生成', 'head');
  pushLog('═══════════════════════════════════════════════════════════', 'head');
  pushLog(nowTime() + ' 解析輸入資料...', 'info');
  pushLog(nowTime() + ' ├─ 原始有效行數：' + parsed.total, 'info');
  pushLog(nowTime() + ' ├─ 重複行數：' + parsed.dups + '（A~H 完全相同，已忽略）', 'warn');
  pushLog(nowTime() + ' └─ 去重後使用：' + data.length + ' 筆', 'success');
  pushLog(nowTime() + ' 搜尋起點數：' + (N + 1), 'info');
  pushLog(nowTime() + ' 初始規則：0 條（空起始）', 'warn');
  pushLog(nowTime() + ' 系統將自動生成所有規則', 'newrule');
  pushLog('');

  var phase = 0;

  function nextPhase(){
    if(!running){ finish(); return; }

    if(phase === 0){
      pushLog('═══════════════════════════════════════════════════════════', 'head');
      pushLog(nowTime() + ' 階段 1：引導生成（從 0 條規則開始）', 'head');
      pushLog('═══════════════════════════════════════════════════════════', 'head');

      // 從空規則開始，直接做一輪優化
      var r0 = optimizeRules(data, [], '引導', 8, false);
      globalBest = r0.rules;
      globalProfit = r0.profit;
      currentRuleCount = globalBest.length;

      pushLog('');
      pushLog(nowTime() + ' ✓ 階段 1 完成：0 → ' + globalProfit + '（生成了 ' + globalBest.length + ' 條規則）', 'success');
      pushLog('');

      updateStatsUI(0, globalProfit);
      phase = 1;
      document.getElementById('progbar').style.width = (1 / (N + 1) * 100).toFixed(1) + '%';
      setTimeout(nextPhase, 0);
      return;
    }

    var k = phase;
    if(k > N){ finish(); return; }

    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog(nowTime() + ' 起點 #' + k + ' / ' + N, 'head');
    pushLog('═══════════════════════════════════════════════════════════', 'head');

    // 從隨機生成的規則集開始
    var seedRules = randomStartRules();
    pushLog(nowTime() + ' 生成 ' + seedRules.length + ' 條隨機規則作為起點', 'newrule');

    var r = optimizeRules(data, seedRules, '#' + k, 10, false);
    currentRuleCount = r.rules.length;

    if(r.profit > globalProfit){
      var diff = r.profit - globalProfit;
      globalProfit = r.profit;
      globalBest = r.rules;
      pushLog('');
      pushLog('  ★★★ 新全局最優：' + globalProfit + ' (Δ+' + diff + '，規則數 ' + r.rules.length + ')', 'best');
    } else {
      pushLog('  ✗ 收斂於 ' + r.profit + '（低於最優 ' + globalProfit + '）', 'dim');
    }
    pushLog('');

    updateStatsUI(k, globalProfit);
    document.getElementById('progbar').style.width = ((k + 1) / (N + 1) * 100).toFixed(1) + '%';

    phase++;
    setTimeout(nextPhase, 0);
  }

  function finish(){
    var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

    // 最後再打磨一次
    if(running){
      pushLog('═══════════════════════════════════════════════════════════', 'head');
      pushLog(nowTime() + ' 最終打磨', 'head');
      pushLog('═══════════════════════════════════════════════════════════', 'head');
      var rf = optimizeRules(data, globalBest, '最終', 15, false);
      if(rf.profit > globalProfit){
        globalProfit = rf.profit;
        globalBest = rf.rules;
        pushLog(nowTime() + ' ✓ 最終打磨：' + globalProfit, 'best');
      }
      currentRuleCount = globalBest.length;
    }

    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog('🏆 完成！最高盈利：' + globalProfit, 'best');
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog('   去重前：' + parsed.total + ' 筆', 'info');
    pushLog('   重複：' + parsed.dups + ' 筆（已忽略）', 'info');
    pushLog('   實際分析：' + data.length + ' 筆', 'info');
    pushLog('   總耗時：' + elapsed + ' 秒', 'info');
    pushLog('   總掃描：' + evalCount + ' 次', 'info');
    pushLog('   自動生成規則數：' + globalBest.length, 'info');
    pushLog('═══════════════════════════════════════════════════════════', 'head');

    var formula = genFormula(globalBest);

    document.getElementById('best').style.display = 'block';
    document.getElementById('summary').innerHTML = '🏆 最高盈利: <b>' + globalProfit + '</b>　(' + data.length + ' 場，自動生成 ' + globalBest.length + ' 條規則)';
    document.getElementById('params').textContent = JSON.stringify(globalBest);
    document.getElementById('txtOut').value = formula;

    var stats = diagnose(data, globalBest);
    renderRuleTable(stats);
    document.getElementById('diag').style.display = 'block';

    running = false;
    document.getElementById('btnRun').disabled = false;
    document.getElementById('btnStop').disabled = true;
    document.getElementById('progbar').style.width = '100%';
    updateStatsUI(phase - 1, globalProfit);
  }

  nextPhase();
}

function stop(){
  running = false;
  document.getElementById('btnStop').disabled = true;
  pushLog('⏹ 使用者手動停止', 'warn');
}

function copyIt(id){
  var el = document.getElementById(id);
  if(!el) return;
  var txt = el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      showMsg('✅ 已複製 ' + txt.length + ' 字元', true);
    }).catch(function(){ fallbackCopy(txt); });
  } else {
    fallbackCopy(txt);
  }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg('✅ 已複製 ' + text.length + ' 字元', true);
  else showMsg('❌ 複製失敗', false);
}
function showMsg(text, ok){
  var m = document.getElementById('msg');
  m.textContent = text;
  m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  setTimeout(function(){ m.style.display = 'none'; }, 3000);
}

(function(){
  document.getElementById('log').textContent = '等待開始...';
})();
</script>
