<style>

<script>
'use strict';

/* ==========================================================
   翻譯
   ========================================================== */
var TXT = {
  zh: {
    title: '🧬 終極版 — 42 特徵 + OR 邏輯',
    desc: '空起始 → 自動生成規則（支援 OR）→ 座標下降 + 結構搜尋。',
    strength: '搜尋強度：',
    run: '🚀 開始搜尋', stop: '⏹ 停止',
    hRule: '📋 演化後規則表',
    waiting: '等待開始...',
    thRule: '規則', thOn: '啟用', thCond: '條件', thThen: '指向',
    thHit: '命中', thCorrect: '對', thWrong: '錯', thProfit: '盈利',
    noData: '沒有有效數據'
  },
  en: {
    title: '🧬 Ultimate — 42 Features + OR Logic',
    desc: 'Empty start → auto-gen rules (OR support) → coordinate descent + structure search.',
    strength: 'Strength: ',
    run: '🚀 Search', stop: '⏹ Stop',
    hRule: '📋 Evolved Rules',
    waiting: 'Waiting...',
    thRule: 'Rule', thOn: 'On', thCond: 'Conds', thThen: 'Then',
    thHit: 'Hit', thCorrect: 'OK', thWrong: 'Err', thProfit: 'Profit',
    noData: 'No valid data'
  }
};
var LANG = 'zh';
function t(k){ return (TXT[LANG] && TXT[LANG][k]) || k; }
function setLang(lang){
  LANG = lang;
  document.getElementById('btn-zh').className = 'lang-btn' + (lang==='zh'?' active':'');
  document.getElementById('btn-en').className = 'lang-btn' + (lang==='en'?' active':'');
  document.getElementById('title').textContent = t('title');
  document.getElementById('desc').textContent = t('desc');
  document.getElementById('lbl-strength').textContent = t('strength');
  document.getElementById('btnRun').textContent = t('run');
  document.getElementById('btnStop').textContent = t('stop');
  document.getElementById('h-rule').textContent = t('hRule');
  var logEl = document.getElementById('log');
  if(logEl && !logEl.dataset.hasContent) logEl.textContent = t('waiting');
}

/* ==========================================================
   ⭐ 42 個特徵定義
   ========================================================== */
var FEATURES = [
  'A', 'B', 'C', 'D', 'E', 'F',
  '|A-B|', '|A-C|', '|A-D|', '|A-E|', '|A-F|',
  '|B-C|', '|B-D|', '|B-E|', '|B-F|',
  '|C-D|', '|C-E|', '|C-F|',
  '|D-E|', '|D-F|', '|E-F|',
  'A-B', 'A-C', 'B-C', 'D-F', 'E-D',
  'A+B', 'B+C', 'D+E', 'E+F', 'D+F', 'A+C',
  'A+B+C', 'D+E+F', 'A+D',
  'A/C', 'D/F', 'D/(D+F)',
  'MAX(A,B,C)', 'MIN(A,B,C)', 'MAX(D,E,F)', 'MIN(D,E,F)'
];
var FCOUNT = FEATURES.length;

/* 特徵索引（方便查找） */
var FIDX = {};
for(var _fi = 0; _fi < FCOUNT; _fi++) FIDX[FEATURES[_fi]] = _fi;

/* ==========================================================
   全域
   ========================================================== */
var data = [];
var featMat = null;   // 預計算的特徵矩陣：[[Float64Array], ...]
var resultCodes = null; // 數字編碼：H=0、D=1、A=2（skip=-1）
var payouts = null;   // 每行的賠付 [D, E, F]（用於計算盈利）

var running = false;
var startTime = 0;
var evalCount = 0;
var currentRuleCount = 0;
var logBuffer = [];
var logTimer = null;
var LOG_MAX = 5000;

var RESULTS = ['H','D','A','skip'];
var RESULT_CODES = {H:0, D:1, A:2, skip:-1};
var OPS = ['>','>=','<','<=','==','!='];
var OPS_MAP = {'>':0, '>=':1, '<':2, '<=':3, '==':4, '!=':5};

var MAX_RULES = 150;
var MAX_GROUPS_PER_RULE = 4;
var MAX_CONDS_PER_GROUP = 5;

/* ==========================================================
   日誌
   ========================================================== */
function nowTime(){
  if(!startTime) return '[00:00.000]';
  var ms = Date.now() - startTime;
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  return '[' + String(m).padStart(2,'0') + ':' + String(s%60).padStart(2,'0') + '.' + String(ms%1000).padStart(3,'0') + ']';
}
function pushLog(text, cls){
  logBuffer.push({ text: text, cls: cls || '' });
  if(!logTimer) logTimer = setTimeout(flushLog, 60);
}
function flushLog(){
  logTimer = null;
  if(logBuffer.length === 0) return;
  var logEl = document.getElementById('log');
  logEl.dataset.hasContent = '1';
  if(!logEl.dataset.started){
    logEl.innerHTML = '';
    logEl.dataset.started = '1';
  }
  var frag = document.createDocumentFragment();
  for(var i = 0; i < logBuffer.length; i++){
    var e = logBuffer[i];
    var div = document.createElement('div');
    if(e.cls) div.className = 'l-' + e.cls;
    div.textContent = e.text;
    frag.appendChild(div);
  }
  logBuffer = [];
  logEl.appendChild(frag);
  while(logEl.children.length > LOG_MAX) logEl.removeChild(logEl.firstChild);
  if(document.getElementById('autoScroll').checked) logEl.scrollTop = logEl.scrollHeight;
}
function clearLog(){
  var logEl = document.getElementById('log');
  logEl.innerHTML = '';
  logEl.dataset.hasContent = '1';
  logEl.dataset.started = '1';
  logBuffer = [];
}

/* ==========================================================
   解析 + 去重
   ========================================================== */
function parseData(text){
  var rows = [];
  var seen = {};
  var dups = 0;
  var totalValid = 0;
  var lines = text.split('\n');
  for(var i = 0; i < lines.length; i++){
    var line = lines[i].trim();
    if(!line) continue;
    var p = line.split(/\s+/);
    if(p.length < 8) continue;
    var v = p.slice(0,6).map(Number);
    var score = p[6];
    var r = p[7];
    if(v.some(isNaN)) continue;
    if(['H','D','A'].indexOf(r) === -1) continue;
    totalValid++;
    var sig = v.join('|') + '|' + score + '|' + r;
    if(seen[sig]){ dups++; continue; }
    seen[sig] = 1;
    rows.push({A:v[0],B:v[1],C:v[2],D:v[3],E:v[4],F:v[5],score:score,result:r});
  }
  return {rows:rows, total:totalValid, dups:dups};
}

/* ==========================================================
   ⭐ 特徵提取（預計算）
   ========================================================== */
function extractFeatures(rows){
  var N = rows.length;
  var mat = new Array(N);
  for(var i = 0; i < N; i++){
    var r = rows[i];
    var A = r.A, B = r.B, C = r.C, D = r.D, E = r.E, F = r.F;
    var f = new Float64Array(FCOUNT);
    f[0]=A; f[1]=B; f[2]=C; f[3]=D; f[4]=E; f[5]=F;
    // 絕對差
    f[6]=Math.abs(A-B); f[7]=Math.abs(A-C); f[8]=Math.abs(A-D); f[9]=Math.abs(A-E); f[10]=Math.abs(A-F);
    f[11]=Math.abs(B-C); f[12]=Math.abs(B-D); f[13]=Math.abs(B-E); f[14]=Math.abs(B-F);
    f[15]=Math.abs(C-D); f[16]=Math.abs(C-E); f[17]=Math.abs(C-F);
    f[18]=Math.abs(D-E); f[19]=Math.abs(D-F); f[20]=Math.abs(E-F);
    // 有號差
    f[21]=A-B; f[22]=A-C; f[23]=B-C; f[24]=D-F; f[25]=E-D;
    // 加總
    f[26]=A+B; f[27]=B+C; f[28]=D+E; f[29]=E+F; f[30]=D+F; f[31]=A+C;
    f[32]=A+B+C; f[33]=D+E+F; f[34]=A+D;
    // 比值（防除零）
    f[35] = C === 0 ? 0 : A/C;
    f[36] = F === 0 ? 0 : D/F;
    f[37] = (D+F) === 0 ? 0 : D/(D+F);
    // 最大最小
    f[38]=Math.max(A,B,C); f[39]=Math.min(A,B,C);
    f[40]=Math.max(D,E,F); f[41]=Math.min(D,E,F);
    mat[i] = f;
  }
  return mat;
}

function extractResults(rows){
  var N = rows.length;
  var codes = new Int8Array(N);
  var po = new Float64Array(N * 3);
  for(var i = 0; i < N; i++){
    var r = rows[i];
    codes[i] = RESULT_CODES[r.result];
    po[i*3] = r.D; po[i*3+1] = r.E; po[i*3+2] = r.F;
  }
  return {codes: codes, payouts: po};
}

/* ==========================================================
   ⭐ 高效評估（核心優化）
   ========================================================== */
function evalCond(f, ci, opCode, val){
  var x = f[ci];
  switch(opCode){
    case 0: return x > val;
    case 1: return x >= val;
    case 2: return x < val;
    case 3: return x <= val;
    case 4: return x === val;
    case 5: return x !== val;
  }
  return false;
}

function matchRule(f, rule){
  // OR over groups
  for(var g = 0; g < rule.groups.length; g++){
    var group = rule.groups[g];
    var allMatch = true;
    for(var c = 0; c < group.length; c++){
      var cond = group[c];
      if(!evalCond(f, cond[0], cond[1], cond[2])){
        allMatch = false;
        break;
      }
    }
    if(allMatch) return true;
  }
  return false;
}

function calcProfit(){
  evalCount++;
  var total = 0;
  var N = featMat.length;
  for(var i = 0; i < N; i++){
    var f = featMat[i];
    var pred = -1;
    for(var r = 0; r < currentRules.length; r++){
      var rule = currentRules[r];
      if(!rule.on) continue;
      if(matchRule(f, rule)){ pred = rule.thenCode; break; }
    }
    if(pred < 0) continue;
    var actual = resultCodes[i];
    if(pred === actual){
      total += payouts[i*3 + pred] - 100;
    } else {
      total -= 100;
    }
  }
  return total;
}

var currentRules = [];  // 當前評估用的規則（全域，避免傳參）

function calcProfitWith(rules){
  var saved = currentRules;
  currentRules = rules;
  var r = calcProfit();
  currentRules = saved;
  return r;
}

/* ==========================================================
   規則結構
   規則 = {
     on: 1,
     then: 'D',       // 顯示用
     thenCode: 1,     // 內部數字
     groups: [        // OR 群組
       [[ci, op, val], [ci, op, val]],  // 群組 1 (AND)
       [[ci, op, val]]                   // 群組 2 (單條件)
     ]
   }
   ========================================================== */
function cloneRule(r){
  var groups = [];
  for(var g = 0; g < r.groups.length; g++){
    var gs = [];
    for(var c = 0; c < r.groups[g].length; c++){
      var cond = r.groups[g][c];
      gs.push([cond[0], cond[1], cond[2]]);
    }
    groups.push(gs);
  }
  return {on: r.on, then: r.then, thenCode: r.thenCode, groups: groups};
}

function cloneRules(rules){
  var out = new Array(rules.length);
  for(var i = 0; i < rules.length; i++) out[i] = cloneRule(rules[i]);
  return out;
}

/* ==========================================================
   條件 / 規則 生成
   ========================================================== */
function sampleFeatureValue(fi){
  if(featMat.length === 0) return Math.random() * 300;
  var n = Math.min(50, featMat.length);
  var vals = [];
  for(var i = 0; i < n; i++){
    var idx = Math.floor(Math.random() * featMat.length);
    vals.push(featMat[idx][fi]);
  }
  var base = vals[Math.floor(Math.random() * vals.length)];
  var spread = Math.max(1, Math.abs(base) * 0.25);
  var v = base + (Math.random() * 2 - 1) * spread;
  // 若 base 是正整數型特徵，保持整數
  if(base > 5 && Math.abs(base - Math.round(base)) < 0.01) v = Math.round(v);
  return Math.max(0, v);
}

function generateCond(){
  var fi = Math.floor(Math.random() * FCOUNT);
  var opIdx = Math.floor(Math.random() * OPS.length);
  var val = sampleFeatureValue(fi);
  return [fi, opIdx, val];
}

function generateGroup(){
  var numConds = 1 + Math.floor(Math.random() * 3);  // 1-3 條件
  var group = [];
  var used = {};
  for(var i = 0; i < numConds; i++){
    var cond = generateCond();
    var key = cond[0] + '_' + cond[1];
    if(used[key] && Math.random() < 0.7) continue;
    used[key] = 1;
    group.push(cond);
  }
  if(group.length === 0) group.push(generateCond());
  return group;
}

function generateRule(){
  var thenIdx = Math.floor(Math.random() * 4);
  var then = RESULTS[thenIdx];
  var thenCode = RESULT_CODES[then];
  var numGroups = 1;
  if(document.getElementById('useOr').checked){
    numGroups = Math.random() < 0.7 ? 1 : (1 + Math.floor(Math.random() * 2));
    if(numGroups > MAX_GROUPS_PER_RULE) numGroups = MAX_GROUPS_PER_RULE;
  }
  var groups = [];
  for(var g = 0; g < numGroups; g++){
    groups.push(generateGroup());
  }
  return {on: 1, then: then, thenCode: thenCode, groups: groups};
}

/* ==========================================================
   變異
   ========================================================== */
function mutateGenRule(rules){
  if(rules.length >= MAX_RULES) return null;
  var newRules = cloneRules(rules);
  var rule = generateRule();
  var pos = Math.random() < 0.7 ? newRules.length : Math.floor(Math.random() * (newRules.length + 1));
  newRules.splice(pos, 0, rule);
  return {rules: newRules, generated: true, genRule: rule, genPos: pos};
}

function mutateNumeric(rules, intensity){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules: r};
  var nMut = 1 + Math.floor(Math.random() * 3);
  for(var k = 0; k < nMut; k++){
    var ri = Math.floor(Math.random() * r.length);
    var rule = r[ri];
    if(rule.groups.length === 0) continue;
    var gi = Math.floor(Math.random() * rule.groups.length);
    if(rule.groups[gi].length === 0) continue;
    var ci = Math.floor(Math.random() * rule.groups[gi].length);
    var cond = rule.groups[gi][ci];
    var v = cond[2];
    var step = 1;
    var av = Math.abs(v);
    if(av >= 30) step = 2;
    if(av >= 100) step = 5;
    if(av >= 300) step = 10;
    if(av >= 700) step = 20;
    step *= intensity || 1;
    var delta = (Math.floor(Math.random() * 11) - 5) * step;
    cond[2] = Math.max(0, v + delta);
  }
  return {rules: r};
}

function mutateThen(rules){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules: r};
  var idx = Math.floor(Math.random() * r.length);
  var old = r[idx].thenCode;
  var options = [0,1,2,3];
  var newCode = options[Math.floor(Math.random() * options.length)];
  r[idx].thenCode = newCode;
  r[idx].then = RESULTS[newCode];
  return {rules: r};
}

function mutateOp(rules){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules: r};
  var idx = Math.floor(Math.random() * r.length);
  if(r[idx].groups.length === 0) return {rules: r};
  var gi = Math.floor(Math.random() * r[idx].groups.length);
  if(r[idx].groups[gi].length === 0) return {rules: r};
  var ci = Math.floor(Math.random() * r[idx].groups[gi].length);
  var oldOp = r[idx].groups[gi][ci][1];
  var newOp;
  do {
    newOp = Math.floor(Math.random() * OPS.length);
  } while(newOp === oldOp);
  r[idx].groups[gi][ci][1] = newOp;
  return {rules: r};
}

function mutateOn(rules){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules: r};
  var idx = Math.floor(Math.random() * r.length);
  r[idx].on = r[idx].on ? 0 : 1;
  return {rules: r};
}

function mutateDelete(rules){
  var r = cloneRules(rules);
  if(r.length <= 1) return {rules: r};
  r.splice(Math.floor(Math.random() * r.length), 1);
  return {rules: r};
}

function mutateSwap(rules){
  var r = cloneRules(rules);
  if(r.length < 2) return {rules: r};
  var i = Math.floor(Math.random() * (r.length - 1));
  var tmp = r[i]; r[i] = r[i+1]; r[i+1] = tmp;
  return {rules: r};
}

function mutateAddCond(rules){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules: r};
  var idx = Math.floor(Math.random() * r.length);
  var gi = Math.floor(Math.random() * r[idx].groups.length);
  if(r[idx].groups[gi].length >= MAX_CONDS_PER_GROUP) return {rules: r};
  r[idx].groups[gi].push(generateCond());
  return {rules: r};
}

function mutateDelCond(rules){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules: r};
  var idx = Math.floor(Math.random() * r.length);
  var gi = Math.floor(Math.random() * r[idx].groups.length);
  if(r[idx].groups[gi].length <= 1) return {rules: r};
  r[idx].groups[gi].splice(Math.floor(Math.random() * r[idx].groups[gi].length), 1);
  return {rules: r};
}

function mutateAddGroup(rules){
  var r = cloneRules(rules);
  if(!document.getElementById('useOr').checked) return {rules: r};
  if(r.length === 0) return {rules: r};
  var idx = Math.floor(Math.random() * r.length);
  if(r[idx].groups.length >= MAX_GROUPS_PER_RULE) return {rules: r};
  r[idx].groups.push(generateGroup());
  return {rules: r};
}

function mutateDelGroup(rules){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules: r};
  var idx = Math.floor(Math.random() * r.length);
  if(r[idx].groups.length <= 1) return {rules: r};
  r[idx].groups.splice(Math.floor(Math.random() * r[idx].groups.length), 1);
  return {rules: r};
}

function mutateSplit(rules){
  if(rules.length >= MAX_RULES) return {rules: rules};
  var r = cloneRules(rules);
  if(r.length === 0) return {rules: r};
  var idx = Math.floor(Math.random() * r.length);
  var copy = cloneRule(r[idx]);
  copy.groups.push(generateGroup());
  r.splice(idx + 1, 0, copy);
  return {rules: r};
}

function mutateNewFeature(rules){
  // 改變某條件使用的特徵（探索新特徵空間）
  var r = cloneRules(rules);
  if(r.length === 0) return {rules: r};
  var idx = Math.floor(Math.random() * r.length);
  if(r[idx].groups.length === 0) return {rules: r};
  var gi = Math.floor(Math.random() * r[idx].groups.length);
  if(r[idx].groups[gi].length === 0) return {rules: r};
  var ci = Math.floor(Math.random() * r[idx].groups[gi].length);
  var newFi = Math.floor(Math.random() * FCOUNT);
  r[idx].groups[gi][ci][0] = newFi;
  // 順便重採樣閾值
  r[idx].groups[gi][ci][2] = sampleFeatureValue(newFi);
  return {rules: r};
}

/* ==========================================================
   統一變異分派
   ========================================================== */
function mutate(rules, intensity){
  var cnt = rules.length;
  var genChance;
  if(cnt === 0) genChance = 1.0;
  else if(cnt < 3) genChance = 0.55;
  else if(cnt < 8) genChance = 0.30;
  else if(cnt < 20) genChance = 0.20;
  else if(cnt < 50) genChance = 0.10;
  else genChance = 0.05;

  if(Math.random() < genChance){
    var g = mutateGenRule(rules);
    if(g) return g;
    // fallback
  }

  var p = Math.random();
  if(p < 0.30) return mutateNumeric(rules, intensity);
  if(p < 0 });
.42) return mutate Then(rules);
  if(p < 0.50) return return mutateOn(rules);
  if '('(p < 0.56) return mutateSwap(rules +);
  parts if(p < .join0.64) return mutateDelete(rules);
  if(p < 0.72) return mutateAddCond(rules);
  if(p < 0.78) return mutateDelCond(rules);
  if(p < 0.84) return mutateAddGroup(rules);
  if(p < 0.88) return mutateDelGroup(rules);
  if(p < 0.94) return mutateOp(rules);
  if(p < 0.98) return mutateNewFeature(rules);
  return mutateSplit(rules);
}

/* ==========================================================
   優化迴圈（座標下降 + 退火）
   ========================================================== */
function optimizeRules(startRules, label, maxPasses, quiet){
  var cur = cloneRules(startRules);
  var curProfit = calcProfitWith(cur);
  var best = cloneRules(cur);
  var bestProfit = curProfit;
  var verbose = document.getElementById('verbose').checked;
  var showBad = document.getElementById('showBad').checked;
  var pass = 0;
  var sinceImprove = 0;

  if(!quiet){
    pushLog(nowTime() + ' ▶ ' + label + ' 起始盈利: ' + curProfit + '（規則數 ' + cur.length + '）', 'gen');
  }

  while(running && pass < maxPasses){
    pass++;
    if(!quiet && pass % 2 === 1){
      pushLog(nowTime() + ' ── ' + label + ' 第 ' + pass + ' 輪（盈利 ' + curProfit + '，規則 ' + cur.length + '）──', 'dim');
    }

    var improvedThisPass = false;
    var iterPerPass = 500;

    for(var i = 0; i < iterPerPass && running; i++){
      var m = mutate(cur, 1 + Math.floor(pass / 3));
      var cand = m.rules;
      var candProfit = calcProfitWith(cand);
      var delta = candProfit - curProfit;

      if(candProfit >= curProfit){
        cur = cand;
        curProfit = candProfit;
        improvedThisPass = true;
        sinceImprove = 0;

        if(m.generated && verbose){
          pushLog(nowTime() + '   [新增規則 #' + cur.length + '] ' + fmtRule(m.genRule) + '  盈利 ' + candProfit, 'newrule');
        }

        if(candProfit > bestProfit){
          bestProfit = candProfit;
          best = cloneRules(cand);
          pushLog(nowTime() + ' ★★★ 新最優：' + bestProfit + '（Δ+' + delta + '，規則數 ' + cur.length + '）', 'best');
        }
      } else {
        sinceImprove++;
        if(showBad && verbose && i % 30 === 0){
          pushLog(nowTime() + '   ✗ 嘗試失敗（Δ' + delta + '）', 'bad');
        }
        var T = 100 / (1 + i / 100);
        if(Math.random() < Math.exp(delta / T)){
          cur = cand;
          curProfit = candProfit;
        }
      }

      if(i % 100 === 0){
        currentRuleCount = cur.length;
        updateStatsUI();
        if(i % 100 === 0) yieldToUI();
      }
    }

    if(!quiet && pass % 2 === 0){
      pushLog(nowTime() + ' 第 ' + pass + ' 輪完成（盈利 ' + curProfit + '）', improvedThisPass ? 'ok' : 'dim');
    }

    if(!improvedThisPass && sinceImprove > 2000) break;
  }

  if(!quiet){
    pushLog(nowTime() + ' ✓ ' + label + ' 收斂於 ' + bestProfit + '（' + pass + ' 輪）', 'success');
  }
  return {rules: best, profit: bestProfit, passes: pass};
}

/* ==========================================================
   格式化
   ========================================================== */
function fmtCond(cond){
  return FEATURES[cond[0]] + OPS[cond[1]] + Math.round(cond[2] * 100) / 100;
}
function fmtRule(r){
  if(!r.groups || r.groups.length === 0) return '(空) → ' + r.then;
  var groupStrs = [];
  for(var g = 0; g < r.groups.length; g++){
    var conds = r.groups[g].map(fmtCond).join(' & ');
    groupStrs.push('(' + conds + ')');
  }
  return groupStrs.join(' OR ') + ' → ' + r.then;
}
function fmtShortRule(r){
  var s = fmtRule(r);
  if(s.length > 100) s = s.slice(0, 97) + '...';
  return s;
}

/* ==========================================================
   診斷
   ========================================================== */
function diagnose(rows, rules){
  var stats = [];
  for(var i = 0; i < rules.length; i++){
    stats.push({idx: i, rule: rules[i], hit: 0, correct: 0, wrong: 0, profit: 0});
  }
  for(var i = 0; i < rows.length; i++){
    var f = featMat[i];
    var pred = -1, hitRule = -1;
    for(var j = 0; j < rules.length; j++){
      if(!rules[j].on) continue;
      if(matchRule(f, rules[j])){ pred = rules[j].thenCode; hitRule = j; break; }
    }
    if(pred < 0 || hitRule === -1) continue;
    var s = stats[hitRule];
    s.hit++;
    var gp;
    if(pred === resultCodes[i]){
      s.correct++;
      gp = payouts[i*3 + pred] - 100;
    } else {
      s.wrong++;
      gp = -100;
    }
    s.profit += gp;
  }
  return stats;
}

/* ==========================================================
   生成公式
   ========================================================== */
function sheetOp(opIdx){
  var op = OPS[opIdx];
  if(op === '!=') return '<>';
  if(op === '==') return '=';
  return op;
}

function buildCondSheet(cond){
  var fi = cond[0], opIdx = cond[1], val = cond[2];
  var feat = FEATURES[fi];
  var op = sheetOp(opIdx);
  var v = Math.round(val * 100) / 100;

  // 特徵名稱轉 Sheet 表達式（A2:A 形式）
  var expr;
  switch(feat){
    case 'A': case 'B': case 'C': case 'D': case 'E': case 'F':
      expr = feat + '2:' + feat; break;
    case '|A-B|': expr = 'ABS(A2:A-B2:B)'; break;
    case '|A-C|': expr = 'ABS(A2:A-C2:C)'; break;
    case '|A-D|': expr = 'ABS(A2:A-D2:D)'; break;
    case '|A-E|': expr = 'ABS(A2:A-E2:E)'; break;
    case '|A-F|': expr = 'ABS(A2:A-F2:F)'; break;
    case '|B-C|': expr = 'ABS(B2:B-C2:C)'; break;
    case '|B-D|': expr = 'ABS(B2:B-D2:D)'; break;
    case '|B-E|': expr = 'ABS(B2:B-E2:E)'; break;
    case '|B-F|': expr = 'ABS(B2:B-F2:F)'; break;
    case '|C-D|': expr = 'ABS(C2:C-D2:D)'; break;
    case '|C-E|': expr = 'ABS(C2:C-E2:E)'; break;
    case '|C-F|': expr = 'ABS(C2:C-F2:F)'; break;
    case '|D-E|': expr = 'ABS(D2:D-E2:E)'; break;
    case '|D-F|': expr = 'ABS(D2:D-F2:F)'; break;
    case '|E-F|': expr = 'ABS(E2:E-F2:F)'; break;
    case 'A-B': expr = '(A2:A-B2:B)'; break;
    case 'A-C': expr = '(A2:A-C2:C)'; break;
    case 'B-C': expr = '(B2:B-C2:C)'; break;
    case 'D-F': expr = '(D2:D-F2:F)'; break;
    case 'E-D': expr = '(E2:E-D2:D)'; break;
    case 'A+B': expr = '(A2:A+B2:B)'; break;
    case 'B+C': expr = '(B2:B+C2:C)'; break;
    case 'D+E': expr = '(D2:D+E2:E)'; break;
    case 'E+F': expr = '(E2:E+F2:F)'; break;
    case 'D+F': expr = '(D2:D+F2:F)'; break;
    case 'A+C': expr = '(A2:A+C2:C)'; break;
    case 'A+B+C': expr = '(A2:A+B2:B+C2:C)'; break;
    case 'D+E+F': expr = '(D2:D+E2:E+F2:F)'; break;
    case 'A+D': expr = '(A2:A+D2:D)'; break;
    case 'A/C': expr = 'IF(C2:C=0,0,A2:A/C2:C)'; break;
    case 'D/F': expr = 'IF(F2:F=0,0,D2:D/F2:F)'; break;
    case 'D/(D+F)': expr = 'IF(D2:D+F2:F=0,0,D2:D/(D2:D+F2:F))'; break;
    case 'MAX(A,B,C)': expr = 'MAX(A2:A,B2:B,C2:C)'; break;
    case 'MIN(A,B,C)': expr = 'MIN(A2:A,B2:B,C2:C)'; break;
    case 'MAX(D,E,F)': expr = 'MAX(D2:D,E2:E,F2:F)'; break;
    case 'MIN(D,E,F)': expr = 'MIN(D2:D,E2:E,F2:F)'; break;
    default: expr = '0';
  }
  return '(' + expr + op + v + ')';
}

function buildGroupSheet(group){
  if(group.length === 0) return 'TRUE';
  return group.map(buildCondSheet).join('*');
}

function buildRuleSheet(rule){
  if(rule.groups.length === 0) return 'FALSE';
  if(rule.groups.length === 1) return buildGroupSheet(rule.groups[0]);
  // OR：用 + 連接，每個 group 用 () 包
  var parts = rule.groups.map(function(g){ return '(' + buildGroupSheet(g) + ')';('+') + ')';
}

function genFormula(rules){
  var active = [];
  for(var i = 0; i < rules.length; i++){
    if(rules[i].on) active.push(rules[i]);
  }
  if(active.length === 0) return '=ARRAYFORMULA(IF(A2:A="","","skip"))';
  var body = '';
  for(var i = 0; i < active.length; i++){
    var expr = buildRuleSheet(active[i]);
    // Google Sheets 中，作為 IF 條件需 > 0（因為 OR 用 + 連接會產生數字）
    if(active[i].groups.length > 1){
      body += 'IF((' + expr + ')>0,"' + active[i].then + '",';
    } else {
      body += 'IF(' + expr + ',"' + active[i].then + '",';
    }
  }
  body += '"skip"';
  for(var j = 0; j < active.length; j++) body += ')';
  return '=ARRAYFORMULA(IF((A2:A="")+(B2:B="")+(C2:C="")+(D2:D="")+(E2:E="")+(F2:F=""),"",' + body + '))';
}

      globalBest = r.rules;
      pushLog('');
      pushLog('  ★★★ 新全局最優：' + globalProfit + ' (Δ+' + diff + '，規則數 ' + r.rules.length + ')', 'best');
    } else {
      pushLog('  ✗ 收斂於 ' + r.profit + '（低於最優 ' + globalProfit + '）', 'dim');
    }
    pushLog('');

    updateStatsUI(k, globalProfit);
    document.getElementById('progbar').style.width = ((k + 1) / (N + 1) * 100).toFixed(1) + '%';

    phase++;
    setTimeout(nextPhase, 0);
  }

  function finish(){
    var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

    if(running){
      pushLog('═══════════════════════════════════════════════════════════', 'head');
      pushLog(nowTime() + ' 最終打磨', 'head');
      pushLog('═══════════════════════════════════════════════════════════', 'head');
      var rf = optimizeRules(globalBest, '最終', 15, false);
      if(rf.profit > globalProfit){
        globalProfit = rf.profit;
        globalBest = rf.rules;
        pushLog(nowTime() + ' ✓ 最終打磨：' + globalProfit, 'best');
      }
      currentRuleCount = globalBest.length;
    }

    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog('🏆 完成！最高盈利：' + globalProfit, 'best');
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog('   去重前：' + parsed.total + ' 筆', 'info');
    pushLog('   重複：' + parsed.dups + ' 筆（已忽略）', 'info');
    pushLog('   實際分析：' + data.length + ' 筆', 'info');
    pushLog('   總耗時：' + elapsed + ' 秒', 'info');
    pushLog('   總掃描：' + evalCount + ' 次', 'info');
    pushLog('   自動生成規則數：' + globalBest.length, 'info');

    // 統計 OR 使用
    var orCount = 0;
    for(var i = 0; i < globalBest.length; i++){
      if(globalBest[i].groups.length > 1) orCount++;
    }
    pushLog('   使用 OR 的規則：' + orCount + ' 條', 'info');
    pushLog('═══════════════════════════════════════════════════════════', 'head');

    var formula = genFormula(globalBest);

    document.getElementById('best').style.display = 'block';
    document.getElementById('summary').innerHTML = '🏆 最高盈利: <b>' + globalProfit + '</b>　(' + data.length + ' 場，自動生成 ' + globalBest.length + ' 條規則)';
    document.getElementById('params').textContent = JSON.stringify(globalBest);
    document.getElementById('txtOut').value = formula;

    var stats = diagnose(data, globalBest);
    renderRuleTable(stats);
    document.getElementById('diag').style.display = 'block';

    running = false;
    document.getElementById('btnRun').disabled = false;
    document.getElementById('btnStop').disabled = true;
    document.getElementById('progbar').style.width = '100%';
    updateStatsUI(phase - 1, globalProfit);
  }

  nextPhase();
}

function stop(){
  running = false;
  document.getElementById('btnStop').disabled = true;
  pushLog('⏹ 使用者手動停止', 'warn');
}

function copyIt(id){
  var el = document.getElementById(id);
  if(!el) return;
  var txt = el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      showMsg('✅ 已複製 ' + txt.length + ' 字元', true);
    }).catch(function(){ fallbackCopy(txt); });
  } else {
    fallbackCopy(txt);
  }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg('✅ 已複製 ' + text.length + ' 字元', true);
  else showMsg('❌ 複製失敗', false);
}
function showMsg(text, ok){
  var m = document.getElementById('msg');
  m.textContent = text;
  m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  setTimeout(function(){ m.style.display = 'none'; }, 3000);
}

(function(){
  document.getElementById('log').textContent = '等待開始...';
})();
</script>
