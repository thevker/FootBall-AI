<script>
'use strict';

var TXT = {
  zh: {
    title: '🚀 v21 — 防過擬合 + 公式精簡',
    strength: '搜尋強度：',
    run: '🚀 開始搜尋', stop: '⏹ 停止',
    hRule: '📋 演化後規則表',
    thRule: '規則', thOn: '啟用', thCond: '條件', thThen: '指向',
    thHit: '命中', thCorrect: '對', thWrong: '錯', thProfit: '盈利',
    noData: '沒有有效數據'
  },
  en: {
    title: '🚀 v21 — Anti-Overfit + Compact Formula',
    strength: 'Strength: ',
    run: '🚀 Search', stop: '⏹ Stop',
    hRule: '📋 Evolved Rules',
    thRule: 'Rule', thOn: 'On', thCond: 'Conds', thThen: 'Then',
    thHit: 'Hit', thCorrect: 'OK', thWrong: 'Err', thProfit: 'Profit',
    noData: 'No valid data'
  }
};
var LANG = 'zh';
function t(k){ return (TXT[LANG] && TXT[LANG][k]) || k; }
function setLang(lang){
  LANG = lang;
  document.getElementById('btn-zh').className = 'lang-btn' + (lang==='zh'?' active':'');
  document.getElementById('btn-en').className = 'lang-btn' + (lang==='en'?' active':'');
  document.getElementById('title').textContent = t('title');
  document.getElementById('lbl-strength').textContent = t('strength');
  document.getElementById('btnRun').textContent = t('run');
  document.getElementById('btnStop').textContent = t('stop');
  document.getElementById('h-rule').textContent = t('hRule');
}

var FEATURES = [
  'A','B','C','D','E','F',
  '|A-B|','|A-C|','|A-D|','|A-E|','|A-F|',
  '|B-C|','|B-D|','|B-E|','|B-F|',
  '|C-D|','|C-E|','|C-F|',
  '|D-E|','|D-F|','|E-F|',
  'A-B','A-C','B-C','D-F','E-D',
  'A+B','B+C','D+E','E+F','D+F','A+C',
  'A+B+C','D+E+F','A+D',
  'A/C','D/F','D/(D+F)',
  'MAX(A,B,C)','MIN(A,B,C)','MAX(D,E,F)','MIN(D,E,F)'
];
var FCOUNT = FEATURES.length;

/* 訓練集和驗證集的資料 */
var trainFeat = null, valFeat = null;
var trainCodes = null, trainPayouts = null;
var valCodes = null, valPayouts = null;
var trainN = 0, valN = 0;

/* 當前評估目標：'train' | 'val' | 'both' */
var evalTarget = 'both';

var running = false;
var startTime = 0;
var evalCount = 0;
var currentRuleCount = 0;
var logBuffer = [];
var logTimer = null;
var LOG_MAX = 3000;
var lastNewRuleLogTime = 0;

var RESULTS = ['H','D','A','skip'];
var RESULT_CODES = {H:0, D:1, A:2, skip:-1};
var OPS = ['>','>=','<','<=','==','!='];

/* ⭐ 硬上限降到 20 */
var MAX_RULES = 12;
var HARD_RULE_CAP = 20;
var MAX_GROUPS = 3;
var MAX_CONDS = 4;

var CHUNK_MS = 40;

/* ⭐ 複雜度懲罰係數 */
var PENALTY_PER_RULE = 15;
var PENALTY_PER_COND = 3;

/* ⭐ 最小命中數 */
var MIN_HITS = 5;

/* ========== 日誌 ========== */
function nowTime(){
  if(!startTime) return '[00:00.000]';
  var ms = Date.now() - startTime;
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  return '[' + String(m).padStart(2,'0') + ':' + String(s%60).padStart(2,'0') + '.' + String(ms%1000).padStart(3,'0') + ']';
}
function pushLog(text, cls){
  logBuffer.push({ text: text, cls: cls || '' });
  if(!logTimer) logTimer = setTimeout(flushLog, 100);
}
function flushLog(){
  logTimer = null;
  if(logBuffer.length === 0) return;
  var logEl = document.getElementById('log');
  logEl.dataset.hasContent = '1';
  if(!logEl.dataset.started){
    logEl.innerHTML = '';
    logEl.dataset.started = '1';
  }
  var frag = document.createDocumentFragment();
  for(var i = 0; i < logBuffer.length; i++){
    var e = logBuffer[i];
    var div = document.createElement('div');
    if(e.cls) div.className = 'l-' + e.cls;
    div.textContent = e.text;
    frag.appendChild(div);
  }
  logBuffer = [];
  logEl.appendChild(frag);
  while(logEl.children.length > LOG_MAX) logEl.removeChild(logEl.firstChild);
  if(document.getElementById('autoScroll').checked) logEl.scrollTop = logEl.scrollHeight;
}
function flushNow(){
  if(logTimer){ clearTimeout(logTimer); logTimer = null; }
  flushLog();
}
function clearLog(){
  var logEl = document.getElementById('log');
  logEl.innerHTML = '';
  logEl.dataset.hasContent = '1';
  logEl.dataset.started = '1';
  logBuffer = [];
}

var yieldResolvers = [];
var yieldChannel = new MessageChannel();
yieldChannel.port1.onmessage = function(){
  var r = yieldResolvers.shift();
  if(r) r();
};
function yieldUI(){
  flushNow();
  return new Promise(function(resolve){
    yieldResolvers.push(resolve);
    yieldChannel.port2.postMessage(0);
  });
}

/* ========== 解析 ========== */
function parseData(text){
  var rows = [], seen = {}, dups = 0, total = 0;
  var lines = text.split('\n');
  for(var i = 0; i < lines.length; i++){
    var p = lines[i].trim().split(/\s+/);
    if(p.length < 8) continue;
    var v = p.slice(0,6).map(Number);
    var r = p[7];
    if(v.some(isNaN) || ['H','D','A'].indexOf(r) === -1) continue;
    total++;
    var sig = v.join('|') + '|' + p[6] + '|' + r;
    if(seen[sig]){ dups++; continue; }
    seen[sig] = 1;
    rows.push({A:v[0],B:v[1],C:v[2],D:v[3],E:v[4],F:v[5],result:r});
  }
  return {rows:rows, total:total, dups:dups};
}

/* ========== 特徵提取 ========== */
function extractFeatures(rows){
  var N = rows.length;
  var mat = new Array(N);
  for(var i = 0; i < N; i++){
    var r = rows[i];
    var A=r.A,B=r.B,C=r.C,D=r.D,E=r.E,F=r.F;
    var f = new Float64Array(FCOUNT);
    f[0]=A;f[1]=B;f[2]=C;f[3]=D;f[4]=E;f[5]=F;
    f[6]=Math.abs(A-B);f[7]=Math.abs(A-C);f[8]=Math.abs(A-D);f[9]=Math.abs(A-E);f[10]=Math.abs(A-F);
    f[11]=Math.abs(B-C);f[12]=Math.abs(B-D);f[13]=Math.abs(B-E);f[14]=Math.abs(B-F);
    f[15]=Math.abs(C-D);f[16]=Math.abs(C-E);f[17]=Math.abs(C-F);
    f[18]=Math.abs(D-E);f[19]=Math.abs(D-F);f[20]=Math.abs(E-F);
    f[21]=A-B;f[22]=A-C;f[23]=B-C;f[24]=D-F;f[25]=E-D;
    f[26]=A+B;f[27]=B+C;f[28]=D+E;f[29]=E+F;f[30]=D+F;f[31]=A+C;
    f[32]=A+B+C;f[33]=D+E+F;f[34]=A+D;
    f[35]=C===0?0:A/C;f[36]=F===0?0:D/F;f[37]=(D+F)===0?0:D/(D+F);
    f[38]=Math.max(A,B,C);f[39]=Math.min(A,B,C);
    f[40]=Math.max(D,E,F);f[41]=Math.min(D,E,F);
    mat[i] = f;
  }
  return mat;
}
function extractMeta(rows){
  var N = rows.length;
  var codes = new Int8Array(N);
  var po = new Float64Array(N * 3);
  for(var i = 0; i < N; i++){
    codes[i] = RESULT_CODES[rows[i].result];
    po[i*3]=rows[i].D; po[i*3+1]=rows[i].E; po[i*3+2]=rows[i].F;
  }
  return {codes:codes, payouts:po};
}

/* ========== 評估 ========== */
function evalCond(f, ci, opCode, val){
  var x = f[ci];
  switch(opCode){
    case 0: return x > val;
    case 1: return x >= val;
    case 2: return x < val;
    case 3: return x <= val;
    case 4: return x === val;
    case 5: return x !== val;
  }
  return false;
}
function matchRule(f, rule){
  for(var g = 0; g < rule.groups.length; g++){
    var group = rule.groups[g];
    var ok = true;
    for(var c = 0; c < group.length; c++){
      if(!evalCond(f, group[c][0], group[c][1], group[c][2])){ ok = false; break; }
    }
    if(ok) return true;
  }
  return false;
}

/* ⭐ 在指定資料集上評估 */
function calcProfitOn(featMat, codes, payoutsArr, N, rules, track){
  var total = 0;
  var tr = track && ruleProfit !== null;
  if(tr) for(var r = 0; r < rules.length; r++) ruleProfit[r] = 0;

  for(var i = 0; i < N; i++){
    var f = featMat[i];
    var pred = -1, hr = -1;
    for(var r = 0; r < rules.length; r++){
      var rule = rules[r];
      if(!rule.on) continue;
      if(matchRule(f, rule)){ pred = rule.thenCode; hr = r; break; }
    }
    if(pred < 0) continue;
    var gp;
    if(pred === codes[i]){
      gp = payoutsArr[i*3 + pred] - 100;
    } else {
      gp = -100;
    }
    total += gp;
    if(tr && hr >= 0) ruleProfit[hr] += gp;
  }
  return total;
}

var ruleProfit = null;

/* ⭐ 綜合分數（含複雜度懲罰） */
function fitness(rules){
  evalCount++;
  var trainP, valP;
  if(trainN > 0) trainP = calcProfitOn(trainFeat, trainCodes, trainPayouts, trainN, rules, false);
  else trainP = 0;
  if(valN > 0) valP = calcProfitOn(valFeat, valCodes, valPayouts, valN, rules, false);
  else valP = 0;

  // 混合分數：偏向驗證集（60%），避免過擬合
  var mix = (trainN > 0 && valN > 0) ? (trainP * 0.35 + valP * 0.65) : trainP;

  // 複雜度懲罰
  var condCount = 0;
  for(var i = 0; i < rules.length; i++){
    for(var g = 0; g < rules[i].groups.length; g++){
      condCount += rules[i].groups[g].length;
    }
  }
  var penalty = rules.length * PENALTY_PER_RULE + Math.max(0, condCount - rules.length) * PENALTY_PER_COND;

  return mix - penalty;
}

/* 用於顯示的原始盈利 */
function rawProfits(rules){
  var trainP = trainN > 0 ? calcProfitOn(trainFeat, trainCodes, trainPayouts, trainN, rules, false) : 0;
  var valP = valN > 0 ? calcProfitOn(valFeat, valCodes, valPayouts, valN, rules, false) : 0;
  return {train: trainP, val: valP};
}

/* ========== 規則結構 ========== */
function cloneRule(r){
  var groups = [];
  for(var g = 0; g < r.groups.length; g++){
    var gs = [];
    for(var c = 0; c < r.groups[g].length; c++){
      var cond = r.groups[g][c];
      gs.push([cond[0], cond[1], cond[2]]);
    }
    groups.push(gs);
  }
  return {on:r.on, then:r.then, thenCode:r.thenCode, groups:groups};
}
function cloneRules(rules){
  var out = new Array(rules.length);
  for(var i = 0; i < rules.length; i++) out[i] = cloneRule(rules[i]);
  return out;
}

/* ========== 熱啟動 ========== */
async function hotStart(){
  pushLog(nowTime() + ' 🔥 熱啟動...', 'hot');
  await yieldUI();
  var best = [];
  var t0 = Date.now();
  var lastYield = Date.now();

  // 用訓練集找最佳單條件
  var N = trainN;
  for(var fi = 0; fi < FCOUNT; fi++){
    if(!running) break;
    var vals = [];
    for(var i = 0; i < N; i++) vals.push(trainFeat[i][fi]);
    vals.sort(function(a,b){ return a - b; });
    var candidates = [];
    var nC = Math.min(20, vals.length);
    for(var k = 0; k < nC; k++) candidates.push(vals[Math.floor(k * vals.length / nC)]);

    for(var op = 0; op < 4; op++){
      for(var ci = 0; ci < candidates.length; ci++){
        var val = candidates[ci];
        for(var tc = 0; tc < 3; tc++){
          var profit = 0, hits = 0;
          for(var i = 0; i < N; i++){
            var f = trainFeat[i];
            if(!evalCond(f, fi, op, val)) continue;
            hits++;
            if(tc === trainCodes[i]) profit += trainPayouts[i*3 + tc] - 100;
            else profit -= 100;
          }
          // ⭐ 最小命中數
          if(profit > 200 && hits >= MIN_HITS){
            // ⭐ 驗證集檢查
            var vp = 0, vh = 0;
            for(var i = 0; i < valN; i++){
              var f2 = valFeat[i];
              if(!evalCond(f2, fi, op, val)) continue;
              vh++;
              if(tc === valCodes[i]) vp += valPayouts[i*3 + tc] - 100;
              else vp -= 100;
            }
            // 兩邊都要正
            if(vp > 0 || valN === 0){
              best.push({fi:fi, op:op, val:val, thenCode:tc, profit:profit, vp:vp, hits:hits});
            }
          }
        }
      }
    }

    if(Date.now() - lastYield > 30){
      pushLog(nowTime() + '   ' + (fi+1) + '/' + FCOUNT + '，候選 ' + best.length, 'dim');
      await yieldUI();
      lastYield = Date.now();
    }
  }

  // ⭐ 按驗證集盈利排序
  best.sort(function(a,b){ return (b.profit + b.vp) - (a.profit + a.vp); });
  var topN = Math.min(10, best.length);
  var result = [];
  for(var i = 0; i < topN; i++){
    var b = best[i];
    result.push({
      on:1, then: RESULTS[b.thenCode], thenCode: b.thenCode,
      groups: [[[b.fi, b.op, b.val]]]
    });
  }
  pushLog(nowTime() + ' ✓ 熱啟動完成：' + best.length + ' 候選（已過濾小樣本），取前 ' + topN + '（' + (Date.now()-t0) + ' ms）', 'success');
  if(topN > 0){
    pushLog(nowTime() + '   最佳：' + FEATURES[best[0].fi] + OPS[best[0].op] + Math.round(best[0].val) + '→' + RESULTS[best[0].thenCode] + '（訓 ' + best[0].profit + ' 驗 ' + best[0].vp + ' 命中 ' + best[0].hits + '）', 'hot');
  }
  await yieldUI();
  return result;
}

/* ========== 生成 ========== */
function sampleFeatureValue(fi){
  if(trainN === 0) return Math.random() * 300;
  var n = Math.min(50, trainN);
  var vals = [];
  for(var i = 0; i < n; i++) vals.push(trainFeat[Math.floor(Math.random() * trainN)][fi]);
  var base = vals[Math.floor(Math.random() * vals.length)];
  var spread = Math.max(1, Math.abs(base) * 0.25);
  var v = base + (Math.random() * 2 - 1) * spread;
  if(base > 5 && Math.abs(base - Math.round(base)) < 0.01) v = Math.round(v);
  return Math.max(0, v);
}
function genCond(){
  return [Math.floor(Math.random() * FCOUNT), Math.floor(Math.random() * OPS.length), sampleFeatureValue(0)];
}
function genGroup(){
  var n = 1 + Math.floor(Math.random() * 2);
  var group = [];
  var used = {};
  for(var i = 0; i < n; i++){
    var c = genCond();
    var key = c[0] + '_' + c[1];
    if(used[key] && Math.random() < 0.7) continue;
    used[key] = 1;
    group.push(c);
  }
  if(group.length === 0) group.push(genCond());
  return group;
}
function genRule(){
  var tIdx = Math.floor(Math.random() * 4);
  var numGroups = 1;
  if(document.getElementById('useOr').checked){
    numGroups = Math.random() < 0.8 ? 1 : 2;
  }
  var groups = [];
  for(var g = 0; g < numGroups; g++) groups.push(genGroup());
  return {on:1, then: RESULTS[tIdx], thenCode: tIdx, groups: groups};
}

/* ========== 剪枝（含最小命中） ========== */
function pruneRules(rules){
  if(!document.getElementById('useMinHit').checked) return rules;
  // 統計每條規則在訓練集上的命中與盈利
  var hits = new Array(rules.length);
  var profits = new Array(rules.length);
  for(var i = 0; i < rules.length; i++){ hits[i] = 0; profits[i] = 0; }

  for(var i = 0; i < trainN; i++){
    var f = trainFeat[i];
    var pred = -1, hr = -1;
    for(var j = 0; j < rules.length; j++){
      if(!rules[j].on) continue;
      if(matchRule(f, rules[j])){ pred = rules[j].thenCode; hr = j; break; }
    }
    if(pred < 0 || hr < 0) continue;
    hits[hr]++;
    if(pred === trainCodes[i]) profits[hr] += trainPayouts[i*3 + pred] - 100;
    else profits[hr] -= 100;
  }

  var kept = [], removed = 0;
  for(var i = 0; i < rules.length; i++){
    // 剔除：命中數 < MIN_HITS，或盈利 <= 0
    if(hits[i] < MIN_HITS || profits[i] <= 0){
      removed++;
      continue;
    }
    kept.push(rules[i]);
  }
  if(removed > 0 && kept.length > 0){
    pushLog(nowTime() + ' ✂️ 剪枝：移除 ' + removed + ' 條（命中<5 或虧損）→ ' + kept.length + ' 條', 'prune');
  }
  return kept;
}

/* ========== 變異 ========== */
function pickRuleIdx(rules){
  var total = 0;
  var weights = new Array(rules.length);
  for(var i = 0; i < rules.length; i++){
    var p = ruleProfit ? ruleProfit[i] : 0;
    var w = 1 + Math.max(0, p / 500);
    weights[i] = w;
    total += w;
  }
  if(total <= 0) return Math.floor(Math.random() * rules.length);
  var r = Math.random() * total, cum = 0;
  for(var i = 0; i < rules.length; i++){
    cum += weights[i];
    if(cum >= r) return i;
  }
  return rules.length - 1;
}

function mutateGen(rules){
  if(rules.length >= HARD_RULE_CAP) return null;
  if(rules.length >= MAX_RULES && Math.random() < 0.85) return null;
  var nr = cloneRules(rules);
  var rule = genRule();
  var pos = Math.random() < 0.7 ? nr.length : Math.floor(Math.random() * (nr.length + 1));
  nr.splice(pos, 0, rule);
  return {rules:nr, generated:true, genRule:rule};
}
function mutateNumeric(rules, intensity){
  var r = cloneRules(rules);
  if(r.length === 0) return {rules:r};
  var nMut = 1 + Math.floor(Math.random() * 2);
  for(var k = 0; k < nMut; k++){
    var idx = pickRuleIdx(r);
    var rule = r[idx];
    if(!rule.groups.length) continue;
    var gi = Math.floor(Math.random() * rule.groups.length);
    if(!rule.groups[gi].length) continue;
    var ci = Math.floor(Math.random() * rule.groups[gi].length);
    var cond = rule.groups[gi][ci];
    var v = cond[2], av = Math.abs(v);
    var step = 1;
    if(av >= 30) step = 2;
    if(av >= 100) step = 5;
    if(av >= 300) step = 10;
    step *= (intensity || 1);
    cond[2] = Math.max(0, v + (Math.floor(Math.random() * 11) - 5) * step);
  }
  return {rules:r};
}
function mutateThen(rules){
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = pickRuleIdx(r);
  var nc = Math.floor(Math.random() * 4);
  r[idx].thenCode = nc; r[idx].then = RESULTS[nc];
  return {rules:r};
}
function mutateOp(rules){
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = pickRuleIdx(r);
  if(!r[idx].groups.length) return {rules:r};
  var gi = Math.floor(Math.random() * r[idx].groups.length);
  if(!r[idx].groups[gi].length) return {rules:r};
  var ci = Math.floor(Math.random() * r[idx].groups[gi].length);
  var old = r[idx].groups[gi][ci][1], nw;
  do { nw = Math.floor(Math.random() * 6); } while(nw === old);
  r[idx].groups[gi][ci][1] = nw;
  return {rules:r};
}
function mutateOn(rules){
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = pickRuleIdx(r);
  r[idx].on = r[idx].on ? 0 : 1;
  return {rules:r};
}
function mutateDelete(rules){
  var r = cloneRules(rules);
  if(r.length <= 1) return {rules:r};
  r.splice(Math.floor(Math.random() * r.length), 1);
  return {rules:r};
}
function mutateSwap(rules){
  var r = cloneRules(rules);
  if(r.length < 2) return {rules:r};
  var i = Math.floor(Math.random() * (r.length - 1));
  var t = r[i]; r[i] = r[i+1]; r[i+1] = t;
  return {rules:r};
}
function mutateAddCond(rules){
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = pickRuleIdx(r);
  var gi = Math.floor(Math.random() * r[idx].groups.length);
  if(r[idx].groups[gi].length >= MAX_CONDS) return {rules:r};
  r[idx].groups[gi].push(genCond());
  return {rules:r};
}
function mutateDelCond(rules){
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = pickRuleIdx(r);
  var gi = Math.floor(Math.random() * r[idx].groups.length);
  if(r[idx].groups[gi].length <= 1) return {rules:r};
  r[idx].groups[gi].splice(Math.floor(Math.random() * r[idx].groups[gi].length), 1);
  return {rules:r};
}
function mutateNewFeat(rules){
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = pickRuleIdx(r);
  if(!r[idx].groups.length) return {rules:r};
  var gi = Math.floor(Math.random() * r[idx].groups.length);
  if(!r[idx].groups[gi].length) return {rules:r};
  var ci = Math.floor(Math.random() * r[idx].groups[gi].length);
  var nf = Math.floor(Math.random() * FCOUNT);
  r[idx].groups[gi][ci][0] = nf;
  r[idx].groups[gi][ci][2] = sampleFeatureValue(nf);
  return {rules:r};
}
function mutateSplit(rules){
  if(rules.length >= HARD_RULE_CAP) return {rules:rules};
  var r = cloneRules(rules);
  if(!r.length) return {rules:r};
  var idx = Math.floor(Math.random() * r.length);
  var copy = cloneRule(r[idx]);
  copy.groups.push(genGroup());
  r.splice(idx + 1, 0, copy);
  return {rules:r};
}
function mutate(rules, intensity){
  var cnt = rules.length;
  var gc;
  if(cnt === 0) gc = 1.0;
  else if(cnt < 3) gc = 0.5;
  else if(cnt < 8) gc = 0.25;
  else if(cnt < MAX_RULES) gc = 0.08;
  else gc = 0;

  if(gc > 0 && Math.random() < gc){
    var g = mutateGen(rules);
    if(g) return g;
  }
  var p = Math.random();
  if(p < 0.32) return mutateNumeric(rules, intensity);
  if(p < 0.44) return mutateThen(rules);
  if(p < 0.52) return mutateOn(rules);
  if(p < 0.58) return mutateSwap(rules);
  if(p < 0.70) return mutateDelete(rules);
  if(p < 0.78) return mutateAddCond(rules);
  if(p < 0.84) return mutateDelCond(rules);
  if(p < 0.92) return mutateOp(rules);
  if(p < 0.97) return mutateNewFeat(rules);
  return mutateSplit(rules);
}

/* ========== 優化迴圈 ========== */
async function optimizeRules(startRules, label, maxPasses){
  var cur = cloneRules(startRules);
  var curFit = fitness(cur);
  var best = cloneRules(cur);
  var bestFit = curFit;
  var verbose = document.getElementById('verbose').checked;
  var pass = 0;
  var sinceImprove = 0;

  pushLog(nowTime() + ' ▶ ' + label + ' 起始分數: ' + curFit.toFixed(0) + '（規則 ' + cur.length + '）', 'gen');
  await yieldUI();

  while(running && pass < maxPasses){
    pass++;
    pushLog(nowTime() + ' ── ' + label + ' 第 ' + pass + ' 輪（分數 ' + curFit.toFixed(0) + '，規則 ' + cur.length + '）──', 'dim');

    var improvedThisPass = false;
    var passStart = Date.now();

    while(running && (Date.now() - passStart) < 2500){
      var chunkStart = Date.now();
      var iterCount = 0;

      while(running && (Date.now() - chunkStart) < CHUNK_MS){
        iterCount++;
        var m = mutate(cur, 1 + Math.floor(pass / 3));
        var cand = m.rules;
        var candFit = fitness(cand);
        var delta = candFit - curFit;

        if(candFit > curFit){
          cur = cand; curFit = candFit;
          improvedThisPass = true; sinceImprove = 0;

          if(m.generated && verbose){
            var now = Date.now();
            if(now - lastNewRuleLogTime > 200){
              pushLog(nowTime() + '   [新增 #' + cur.length + '] ' + fmtRule(m.genRule) + '  分數 ' + candFit.toFixed(0), 'newrule');
              lastNewRuleLogTime = now;
            }
          }
          if(candFit > bestFit){
            bestFit = candFit;
            best = cloneRules(cand);
            var rp = rawProfits(best);
            pushLog(nowTime() + ' ★★★ 新最優：訓練 ' + rp.train + '　驗證 ' + rp.val + '　分數 ' + bestFit.toFixed(0) + '（規則 ' + cur.length + '）', 'best');
          }
        } else {
          sinceImprove++;
          var T = 60 / (1 + sinceImprove / 100);
          if(Math.random() < Math.exp(delta / T)){
            cur = cand; curFit = candFit;
          }
        }
      }

      currentRuleCount = cur.length;
      updateStatsUI();
      await yieldUI();
      if(!running) break;
    }

    // ⭐ 剪枝
    var pruned = pruneRules(cur);
    if(pruned.length < cur.length && pruned.length > 0){
      var pf = fitness(pruned);
      if(pf > curFit - 100){
        cur = pruned;
        curFit = pf;
        if(pf > bestFit){
          bestFit = pf;
          best = cloneRules(cur);
        }
      }
    }

    pushLog(nowTime() + ' 第 ' + pass + ' 輪完成（分數 ' + curFit.toFixed(0) + '，規則 ' + cur.length + '）', improvedThisPass ? 'ok' : 'dim');
    if(!improvedThisPass && sinceImprove > 3000) break;

    await yieldUI();
  }

  pushLog(nowTime() + ' ✓ ' + label + ' 收斂（' + pass + ' 輪）', 'success');
  await yieldUI();
  return {rules:best, fit:bestFit, passes:pass};
}

/* ========== 格式化 ========== */
function fmtCond(c){ return FEATURES[c[0]] + OPS[c[1]] + Math.round(c[2] * 100) / 100; }
function fmtRule(r){
  if(!r.groups || r.groups.length === 0) return '(空)→' + r.then;
  var parts = [];
  for(var g = 0; g < r.groups.length; g++){
    parts.push('(' + r.groups[g].map(fmtCond).join('&') + ')');
  }
  return parts.join('|') + '→' + r.then;
}

/* ========== 診斷 ========== */
function diagnose(rules, useVal){
  var stats = [];
  for(var i = 0; i < rules.length; i++) stats.push({rule:rules[i], hit:0, correct:0, wrong:0, profit:0});
  var fMat = useVal ? valFeat : trainFeat;
  var cArr = useVal ? valCodes : trainCodes;
  var pArr = useVal ? valPayouts : trainPayouts;
  var N = useVal ? valN : trainN;

  for(var i = 0; i < N; i++){
    var f = fMat[i];
    var pred = -1, hr = -1;
    for(var j = 0; j < rules.length; j++){
      if(!rules[j].on) continue;
      if(matchRule(f, rules[j])){ pred = rules[j].thenCode; hr = j; break; }
    }
    if(pred < 0 || hr === -1) continue;
    stats[hr].hit++;
    if(pred === cArr[i]){
      stats[hr].correct++;
      stats[hr].profit += pArr[i*3 + pred] - 100;
    } else {
      stats[hr].wrong++;
      stats[hr].profit -= 100;
    }
  }
  return stats;
}

function renderRuleTable(stats){
  var html = '<table><thead><tr>' +
    '<th>#</th><th>ON</th><th>條件</th><th>指向</th>' +
    '<th>命中</th><th>對</th><th>錯</th><th>盈利</th>' +
    '</tr></thead><tbody>';
  for(var i = 0; i < stats.length; i++){
    var s = stats[i];
    var r = s.rule;
    var ss = fmtRule(r);
    if(ss.length > 100) ss = ss.slice(0, 97) + '...';
    var pcls = s.profit > 0 ? 'profit-pos' : (s.profit < 0 ? 'profit-neg' : '');
    var onTag = r.on ? '<span class="tag-ok">ON</span>' : '<span class="tag-off">OFF</span>';
    var thenTag = '<span class="tag-pred">' + r.then + '</span>';
    var orTag = r.groups.length > 1 ? ' <span class="tag-or">OR×' + r.groups.length + '</span>' : '';
    html += '<tr><td>R' + (i+1) + orTag + '</td><td>' + onTag + '</td>' +
      '<td style="text-align:left;font-size:10px">' + ss + '</td><td>' + thenTag + '</td>' +
      '<td>' + s.hit + '</td><td>' + s.correct + '</td><td>' + s.wrong + '</td>' +
      '<td class="' + pcls + '">' + s.profit + '</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('ruleTable').innerHTML = html;
}

/* ========== 公式生成 ========== */
function sheetOp(opIdx){
  var op = OPS[opIdx];
  if(op === '!=') return '<>';
  if(op === '==') return '=';
  return op;
}
function featToExpr(feat, suffix){
  var s = suffix || '2';
  switch(feat){
    case 'A': case 'B': case 'C': case 'D': case 'E': case 'F':
      return feat + '2:' + feat;
    case '|A-B|': return 'ABS(A2:A-B2:B)';
    case '|A-C|': return 'ABS(A2:A-C2:C)';
    case '|A-D|': return 'ABS(A2:A-D2:D)';
    case '|A-E|': return 'ABS(A2:A-E2:E)';
    case '|A-F|': return 'ABS(A2:A-F2:F)';
    case '|B-C|': return 'ABS(B2:B-C2:C)';
    case '|B-D|': return 'ABS(B2:B-D2:D)';
    case '|B-E|': return 'ABS(B2:B-E2:E)';
    case '|B-F|': return 'ABS(B2:B-F2:F)';
    case '|C-D|': return 'ABS(C2:C-D2:D)';
    case '|C-E|': return 'ABS(C2:C-E2:E)';
    case '|C-F|': return 'ABS(C2:C-F2:F)';
    case '|D-E|': return 'ABS(D2:D-E2:E)';
    case '|D-F|': return 'ABS(D2:D-F2:F)';
    case '|E-F|': return 'ABS(E2:E-F2:F)';
    case 'A-B': return '(A2:A-B2:B)';
    case 'A-C': return '(A2:A-C2:C)';
    case 'B-C': return '(B2:B-C2:C)';
    case 'D-F': return '(D2:D-F2:F)';
    case 'E-D': return '(E2:E-D2:D)';
    case 'A+B': return '(A2:A+B2:B)';
    case 'B+C': return '(B2:B+C2:C)';
    case 'D+E': return '(D2:D+E2:E)';
    case 'E+F': return '(E2:E+F2:F)';
    case 'D+F': return '(D2:D+F2:F)';
    case 'A+C': return '(A2:A+C2:C)';
    case 'A+B+C': return '(A2:A+B2:B+C2:C)';
    case 'D+E+F': return '(D2:D+E2:E+F2:F)';
    case 'A+D': return '(A2:A+D2:D)';
    case 'A/C': return 'IF(C2:C=0,0,A2:A/C2:C)';
    case 'D/F': return 'IF(F2:F=0,0,D2:D/F2:F)';
    case 'D/(D+F)': return 'IF(D2:D+F2:F=0,0,D2:D/(D2:D+F2:F))';
    case 'MAX(A,B,C)': return 'MAX(A2:A,B2:B,C2:C)';
    case 'MIN(A,B,C)': return 'MIN(A2:A,B2:B,C2:C)';
    case 'MAX(D,E,F)': return 'MAX(D2:D,E2:E,F2:F)';
    case 'MIN(D,E,F)': return 'MIN(D2:D,E2:E,F2:F)';
    default: return '0';
  }
}
function buildCondSheet(cond){
  var fi = cond[0], opIdx = cond[1], val = cond[2];
  var op = sheetOp(opIdx);
  var v = Math.round(val * 100) / 100;
  return '(' + featToExpr(FEATURES[fi]) + op + v + ')';
}
function buildGroupSheet(g){
  if(!g.length) return 'TRUE';
  return g.map(buildCondSheet).join('*');
}
function buildRuleSheet(r){
  if(!r.groups.length) return 'FALSE';
  if(r.groups.length === 1) return buildGroupSheet(r.groups[0]);
  return '(' + r.groups.map(function(g){ return '(' + buildGroupSheet(g) + ')'; }).join('+') + ')';
}

/* ⭐ 單一公式模式 */
function genSingleFormula(rules){
  var active = [];
  for(var i = 0; i < rules.length; i++) if(rules[i].on) active.push(rules[i]);
  if(!active.length) return '=ARRAYFORMULA(IF(A2:A="","","skip"))';
  var body = '';
  for(var i = 0; i < active.length; i++){
    var expr = buildRuleSheet(active[i]);
    if(active[i].groups.length > 1){
      body += 'IF((' + expr + ')>0,"' + active[i].then + '",';
    } else {
      body += 'IF(' + expr + ',"' + active[i].then + '",';
    }
  }
  body += '"skip"';
  for(var j = 0; j < active.length; j++) body += ')';
  return '=ARRAYFORMULA(IF((A2:A="")+(B2:B="")+(C2:C="")+(D2:D="")+(E2:E="")+(F2:F=""),"",' + body + '))';
}

/* ⭐ 輔助列模式：每條規則一個欄，最後一個總判斷 */
function genAuxFormulas(rules){
  var active = [];
  for(var i = 0; i < rules.length; i++) if(rules[i].on) active.push(rules[i]);
  if(!active.length) return '（無規則）';

  var lines = [];
  lines.push('=== 輔助列模式使用步驟 ===');
  lines.push('1. 把下方每個公式貼到對應欄位（H、I、J...）的第 2 列，往下拖');
  lines.push('2. 最後的總公式貼到 G2（或任何空欄）');
  lines.push('');
  lines.push('=== 輔助列公式（每條規則一欄） ===');
  lines.push('');

  var colLetters = 'HIJKLMNOPQRSTUVWXYZABCDEF';
  var colMap = [];
  for(var i = 0; i < active.length; i++){
    var r = active[i];
    var col = colLetters[i] || ('AA' + i);
    colMap.push({col: col, then: r.then});
    var expr = buildRuleSheet(r);
    if(r.groups.length > 1){
      lines.push(col + '2 = =IF((' + expr + ')>0,1,0)');
    } else {
      lines.push(col + '2 = =IF(' + expr + ',1,0)');
    }
  }

  lines.push('');
  lines.push('=== 總判斷公式（貼到 G2）===');
  lines.push('');

  var final = '=IF(A2="","",';
  for(var i = 0; i < colMap.length; i++){
    final += 'IF(' + colMap[i].col + '2=1,"' + colMap[i].then + '",';
  }
  final += '"skip"';
  for(var j = 0; j < colMap.length; j++) final += ')';
  lines.push('G2 = ' + final);

  return lines.join('\n');
}

/* ========== 統計 ========== */
function updateStatsUI(gen){
  if(gen !== undefined) document.getElementById('stat-gen').innerHTML = '起點: <b>' + gen + '</b>';
  var el = ((Date.now() - startTime) / 1000).toFixed(0);
  document.getElementById('stat-time').innerHTML = '時間: <b>' + el + 's</b>';
  document.getElementById('stat-evals').innerHTML = '掃描: <b>' + evalCount + '</b>';
  document.getElementById('stat-rules').innerHTML = '規則: <b>' + currentRuleCount + '</b>';
}

/* ========== 主流程 ========== */
async function start(){
  var parsed = parseData(document.getElementById('input').value);
  if(parsed.rows.length === 0){ alert(t('noData')); return; }

  running = true;
  startTime = Date.now();
  evalCount = 0;
  currentRuleCount = 0;
  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('diag').style.display = 'none';
  document.getElementById('best').style.display = 'none';
  document.getElementById('liveStats').style.display = 'flex';
  document.getElementById('progbar').style.width = '0%';

  clearLog();

  var N = parseInt(document.getElementById('strength').value);
  var useVal = document.getElementById('useVal').checked;

  pushLog('═══════════════════════════════════════════════════════════', 'head');
  pushLog('🚀 v21 — 防過擬合 + 公式精簡', 'head');
  pushLog('═══════════════════════════════════════════════════════════', 'head');
  pushLog(nowTime() + ' 原始有效行數：' + parsed.total, 'info');
  pushLog(nowTime() + ' 重複：' + parsed.dups + '（已忽略）', 'warn');
  pushLog(nowTime() + ' 去重後：' + parsed.rows.length + ' 筆', 'success');
  pushLog(nowTime() + ' 規則上限：' + MAX_RULES + '（硬上限 ' + HARD_RULE_CAP + '）', 'info');
  pushLog(nowTime() + ' 最小命中數：' + MIN_HITS, 'info');
  pushLog(nowTime() + ' 驗證分割：' + (useVal ? '開啟（80/20）' : '關閉'), 'info');
  await yieldUI();

  // ⭐ 訓練/驗證分割
  var allRows = parsed.rows.slice();
  // 隨機打亂
  for(var i = allRows.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = allRows[i]; allRows[i] = allRows[j]; allRows[j] = tmp;
  }

  var trainRows, valRows;
  if(useVal && allRows.length >= 50){
    var splitIdx = Math.floor(allRows.length * 0.8);
    trainRows = allRows.slice(0, splitIdx);
    valRows = allRows.slice(splitIdx);
  } else {
    trainRows = allRows;
    valRows = [];
  }

  trainN = trainRows.length;
  valN = valRows.length;

  pushLog(nowTime() + ' 訓練集：' + trainN + ' 筆', 'val');
  pushLog(nowTime() + ' 驗證集：' + valN + ' 筆', valN > 0 ? 'val' : 'warn');
  await yieldUI();

  var tPre = Date.now();
  trainFeat = extractFeatures(trainRows);
  var trm = extractMeta(trainRows);
  trainCodes = trm.codes; trainPayouts = trm.payouts;

  if(valN > 0){
    valFeat = extractFeatures(valRows);
    var vrm = extractMeta(valRows);
    valCodes = vrm.codes; valPayouts = vrm.payouts;
  } else {
    valFeat = null; valCodes = null; valPayouts = null;
  }

  ruleProfit = new Float64Array(200);
  pushLog(nowTime() + ' ✓ 特徵預計算（' + (Date.now() - tPre) + ' ms）', 'success');
  await yieldUI();

  // 階段 1：熱啟動
  pushLog('═══════════════════════════════════════════════════════════', 'head');
  pushLog(nowTime() + ' 階段 1：熱啟動 + 引導', 'head');
  pushLog('═══════════════════════════════════════════════════════════', 'head');
  await yieldUI();

  var seeds = await hotStart();
  if(!running){ finish(); return; }

  var r0 = await optimizeRules(seeds, '引導', 10);
  if(!running){ finish(); return; }
  var globalBest = r0.rules;
  var globalFit = r0.fit;
  currentRuleCount = globalBest.length;

  var rp0 = rawProfits(globalBest);
  pushLog('');
  pushLog(nowTime() + ' ✓ 階段 1：訓練 ' + rp0.train + '　驗證 ' + rp0.val + '　分數 ' + globalFit.toFixed(0), 'success');
  pushLog('');
  updateStatsUI(0);
  document.getElementById('stat-train').innerHTML = '訓練: <b>' + rp0.train + '</b>';
  document.getElementById('stat-val').innerHTML = '驗證: <b>' + rp0.val + '</b>';
  await yieldUI();

  // 階段 2：多起點
  for(var k = 1; k <= N && running; k++){
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog(nowTime() + ' 起點 #' + k + ' / ' + N, 'head');
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    await yieldUI();

    var seedRules = cloneRules(globalBest);
    var nMuts = 3 + Math.floor(Math.random() * 6);
    for(var i = 0; i < nMuts; i++){
      var m = mutate(seedRules, 1);
      seedRules = m.rules;
    }

    var r = await optimizeRules(seedRules, '#' + k, 12);
    if(!running) break;
    currentRuleCount = r.rules.length;

    if(r.fit > globalFit){
      globalFit = r.fit;
      globalBest = r.rules;
      var rp = rawProfits(globalBest);
      pushLog('  ★★★ 新最優：訓練 ' + rp.train + '　驗證 ' + rp.val + '　分數 ' + globalFit.toFixed(0) + '（規則 ' + r.rules.length + '）', 'best');
      document.getElementById('stat-train').innerHTML = '訓練: <b>' + rp.train + '</b>';
      document.getElementById('stat-val').innerHTML = '驗證: <b>' + rp.val + '</b>';
    } else {
      pushLog('  ✗ 分數 ' + r.fit.toFixed(0) + '（低於 ' + globalFit.toFixed(0) + '）', 'dim');
    }
    pushLog('');

    updateStatsUI(k);
    document.getElementById('progbar').style.width = ((k + 1) / (N + 1) * 100).toFixed(1) + '%';
    await yieldUI();
  }

  finish();

  function finish(){
    var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

    var finalP = rawProfits(globalBest);
    var formula = genSingleFormula(globalBest);
    var auxText = genAuxFormulas(globalBest);

    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog('🏆 完成！', 'best');
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog('   訓練集盈利：' + finalP.train, 'info');
    pushLog('   驗證集盈利：' + finalP.val, 'val');
    pushLog('   最終規則數：' + globalBest.length, 'info');
    pushLog('   單一公式字符數：' + formula.length, formula.length > 8000 ? 'warn' : 'info');
    pushLog('   總耗時：' + elapsed + ' 秒', 'info');
    pushLog('═══════════════════════════════════════════════════════════', 'head');

    document.getElementById('best').style.display = 'block';
    document.getElementById('summary').innerHTML = '🏆 <b>' + globalBest.length + '</b> 條規則　訓練盈利 <b>' + finalP.train + '</b>';

    document.getElementById('vTrain').textContent = finalP.train;
    document.getElementById('vVal').textContent = finalP.val;

    var ratio = finalP.train > 0 ? (finalP.val / finalP.train) : 0;
    document.getElementById('vRatio').textContent = (ratio * 100).toFixed(0) + '%';

    var verdict = '';
    if(valN === 0){
      verdict = '⚠ 未啟用驗證分割，無法評估泛化能力';
    } else if(ratio >= 0.7){
      verdict = '✅ 驗證/訓練比 ≥70% → 泛化良好，可放心使用';
    } else if(ratio >= 0.4){
      verdict = '🟡 驗證/訓練比 40~70% → 有些過擬合，建議減少規則數';
    } else if(ratio > 0){
      verdict = '🟠 驗證/訓練比 <40% → 過擬合嚴重，建議降低搜尋強度或加資料';
    } else {
      verdict = '❌ 驗證集虧損 → 規則無法泛化，請用更多資料重跑';
    }
    document.getElementById('valVerdict').textContent = verdict;

    document.getElementById('charInfo').innerHTML =
      '字符數：<b>' + formula.length + '</b>' +
      (formula.length > 30000 ? ' <span style="color:#c00">⚠ 超過 Sheets 上限，建議用輔助列模式</span>' :
       formula.length > 8000 ? ' <span style="color:#e67e22">⚠ 較長，Sheets 可能變慢</span>' :
       ' ✅');

    document.getElementById('txtOut').value = formula;
    document.getElementById('auxOut').value = auxText;

    var stats = diagnose(globalBest, false);
    renderRuleTable(stats);
    document.getElementById('diag').style.display = 'block';

    running = false;
    document.getElementById('btnRun').disabled = false;
    document.getElementById('btnStop').disabled = true;
    document.getElementById('progbar').style.width = '100%';
    updateStatsUI(undefined);
    flushNow();
  }
}

function stop(){
  running = false;
  document.getElementById('btnStop').disabled = true;
  pushLog('⏹ 使用者手動停止', 'warn');
  flushNow();
}
function copyIt(id){
  var el = document.getElementById(id);
  if(!el) return;
  var txt = el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      showMsg('✅ 已複製 ' + txt.length + ' 字元', true);
    }).catch(function(){ fallbackCopy(txt); });
  } else { fallbackCopy(txt); }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg('✅ 已複製 ' + text.length + ' 字元', true);
  else showMsg('❌ 複製失敗', false);
}
function showMsg(text, ok){
  var m = document.getElementById('msg');
  m.textContent = text; m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  setTimeout(function(){ m.style.display = 'none'; }, 3000);
}

(function(){
  document.getElementById('log').textContent = '等待開始...';
})();
</script>
