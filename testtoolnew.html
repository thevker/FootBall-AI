<script>
'use strict';

var TXT = {
  zh: { title: '🚀 v36 — 交叉驗證 + 演化', hRule: '📋 最後一折演化後規則表', noData: '沒有有效數據' },
  en: { title: '🚀 v36 — CV + Evolution', hRule: '📋 Last Fold Evolved Rules', noData: 'No valid data' }
};
var LANG = 'zh';
function t(k){ return (TXT[LANG] && TXT[LANG][k]) || k; }
function setLang(lang){
  LANG = lang;
  document.getElementById('btn-zh').className = 'lang-btn' + (lang==='zh'?' active':'');
  document.getElementById('btn-en').className = 'lang-btn' + (lang==='en'?' active':'');
  document.getElementById('title').textContent = t('title');
  document.getElementById('h-rule').textContent = t('hRule');
}

var FEATURES = [
  'A','B','C','D','E','F',
  '|A-B|','|A-C|','|A-D|','|A-E|','|A-F|',
  '|B-C|','|B-D|','|B-E|','|B-F|',
  '|C-D|','|C-E|','|C-F|',
  '|D-E|','|D-F|','|E-F|',
  'A-B','A-C','B-C','D-F','E-D',
  'A+B','B+C','D+E','E+F','D+F','A+C',
  'A+B+C','D+E+F','A+D',
  'A/C','D/F','D/(D+F)',
  'MAX(A,B,C)','MIN(A,B,C)','MAX(D,E,F)','MIN(D,E,F)'
];
var FCOUNT = FEATURES.length;

var INIT_RULES = [
  {on:1, then:'D', cond:[['B','>=',32],['|A-C|','<=',6]]},
  {on:1, then:'H', cond:[['A','>=',60],['C','<=',11],['D','>=',140],['D','<=',190],['F','>=',400],['F','<=',480]]},
  {on:1, then:'D', cond:[['|A-C|','<=',3],['E','<',380],['|D-F|','<',40]]},
  {on:1, then:'D', cond:[['A','>=',45],['C','<=',20],['|D-F|','<',70],['D','<',400]]},
  {on:1, then:'D', cond:[['|D-F|','<',18]]},
  {on:1, then:'D', cond:[['A','>=',42],['D','>=',155],['D','<',205],['D-F','!=',0],['F-D','>',0],['|A-C|','>=',50]]},
  {on:1, then:'H', cond:[['A','>=',42],['D','>=',155],['D','<',205],['D-F','!=',0]]},
  {on:1, then:'D', cond:[['A','>=',34],['D','>',205],['D','<=',235],['D-F','!=',0]]},
  {on:1, then:'D', cond:[['D','>=',400],['A','>=',42]]},
  {on:1, then:'D', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0],['F','<',200],['|A-C|','<=',5]]},
  {on:1, then:'A', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0],['F','<',200]]},
  {on:1, then:'D', cond:[['D','>=',340],['A','>=',38],['F','<',250],['D-F','>',0]]},
  {on:1, then:'D', cond:[['E','<=',315],['B','>=',27],['|A-C|','<=',25],['D','>=',250],['D','<=',350],['E-D','>',0]]},
  {on:1, then:'D', cond:[['A-C','<',0],['F','>=',490],['F','<=',560],['D','<',200]]},
  {on:1, then:'H', cond:[['A-C','<',0],['F-D','>',0],['F','<',550],['E','>',320]]},
  {on:1, then:'A', cond:[['A-C','<',0],['F','>=',184],['F','<=',216],['C','>=',40]]},
  {on:1, then:'D', cond:[['A-C','<',0],['F-D','>',0],['F','<',300],['C','<',45],['D','<',250]]},
  {on:1, then:'A', cond:[['D-F','>',0],['F','<=',150],['C','>=',65]]},
  {on:1, then:'A', cond:[['D-F','>',0],['D','>',1500],['C','>=',50]]},
  {on:1, then:'D', cond:[['D-F','>',0],['D','>',1500],['A-C','>',0]]},
  {on:1, then:'skip', cond:[['D-F','>',0],['D','>',1500]]},
  {on:1, then:'D', cond:[['D-F','>',0],['A','>=',33],['D','>=',350]]},
  {on:1, then:'H', cond:[['D-F','>',0]]},
  {on:1, then:'H', cond:[['F-D','>',0],['A','>=',50],['F-D','>=',400]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['A','>=',80]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['A-C','<',0]]},
  {on:1, then:'D', cond:[['F-D','>',0],['F','>=',700],['A','<',45]]},
  {on:1, then:'skip', cond:[['F-D','>',0],['F','>=',700]]},
  {on:1, then:'D', cond:[['F-D','>',0],['E','>=',470],['F','>=',500]]},
  {on:1, then:'H', cond:[['F-D','>',0],['A','>=',47],['D','<=',140]]},
  {on:1, then:'A', cond:[['F-D','>',0]]},
  {on:1, then:'H', cond:[['A-C','>',0]]},
  {on:1, then:'A', cond:[['A-C','<',0]]},
  {on:1, then:'skip', cond:[]}
];

var trainFeat = null, testFeat = null;
var trainCodes = null, trainPayouts = null;
var testCodes = null, testPayouts = null;
var trainN = 0, testN = 0;

var running = false;
var startTime = 0;
var evalCount = 0;
var logBuffer = [];
var logTimer = null;
var LOG_MAX = 5000;
var lastSpeedUpdate = 0;

var currentFold = 0;
var totalFolds = 0;
var foldResults = [];
var lastEvolvedRules = null;

var MIN_IMPROVE = 0.5;
var SCAN_RANGE_PCT = 0.2;
var EVO_MIN_IMPROVE = 0.5;

var RESULTS = ['H','D','A','skip'];
var RESULT_CODES = {H:0, D:1, A:2, skip:-1};
var OPS = ['>','>=','<','<=','==','!='];

/* ========== 日誌 ========== */
function nowTime(){
  if(!startTime) return '[00:00.000]';
  var ms = Date.now() - startTime;
  var s = Math.floor(ms / 1000);
  var m = Math.floor(s / 60);
  return '[' + String(m).padStart(2,'0') + ':' + String(s%60).padStart(2,'0') + '.' + String(ms%1000).padStart(3,'0') + ']';
}
function pushLog(text, cls){
  logBuffer.push({ text: text, cls: cls || '' });
  if(!logTimer) logTimer = setTimeout(flushLog, 100);
}
function flushLog(){
  logTimer = null;
  if(logBuffer.length === 0) return;
  var logEl = document.getElementById('log');
  logEl.dataset.hasContent = '1';
  if(!logEl.dataset.started){
    logEl.innerHTML = '';
    logEl.dataset.started = '1';
  }
  var frag = document.createDocumentFragment();
  for(var i = 0; i < logBuffer.length; i++){
    var e = logBuffer[i];
    var div = document.createElement('div');
    if(e.cls) div.className = 'l-' + e.cls;
    div.textContent = e.text;
    frag.appendChild(div);
  }
  logBuffer = [];
  logEl.appendChild(frag);
  while(logEl.children.length > LOG_MAX) logEl.removeChild(logEl.firstChild);
  if(document.getElementById('autoScroll').checked) logEl.scrollTop = logEl.scrollHeight;
}
function flushNow(){
  if(logTimer){ clearTimeout(logTimer); logTimer = null; }
  flushLog();
}
function clearLog(){
  var logEl = document.getElementById('log');
  logEl.innerHTML = '';
  logEl.dataset.hasContent = '1';
  logEl.dataset.started = '1';
  logBuffer = [];
}

function updateProgress(){
  var pct = totalFolds > 0 ? (currentFold / totalFolds) * 100 : 0;
  if(!running && startTime > 0 && document.getElementById('best').style.display === 'block') pct = 100;
  var bar = document.getElementById('progbar');
  var txt = document.getElementById('progText');
  var phaseEl = document.getElementById('progPhase');
  if(bar) bar.style.width = pct.toFixed(1) + '%';
  if(txt) txt.textContent = pct.toFixed(1) + '%';
  if(phaseEl) phaseEl.textContent = currentFold > 0 ? '第 ' + currentFold + '/' + totalFolds + ' 折' : '準備中';
  var statProg = document.getElementById('stat-prog');
  if(statProg) statProg.innerHTML = '進度: <b>' + pct.toFixed(1) + '%</b>';
  var statFold = document.getElementById('stat-fold');
  if(statFold) statFold.innerHTML = '🔄 折: <b>' + currentFold + '/' + totalFolds + '</b>';
}

function updateTestAvg(){
  var stat = document.getElementById('stat-test');
  if(!stat) return;
  if(foldResults.length === 0){ stat.innerHTML = '🩷 測試平均: <b>-</b>'; return; }
  var sum = 0;
  for(var i = 0; i < foldResults.length; i++) sum += foldResults[i].testPerAfterEvo;
  stat.innerHTML = '🩷 測試平均: <b>' + (sum / foldResults.length).toFixed(2) + '</b>';
}

function updateSpeedUI(){
  var now = Date.now();
  if(now - lastSpeedUpdate < 500) return;
  var el = ((now - startTime) / 1000).toFixed(0);
  var speed = el > 0 ? (evalCount / el).toFixed(0) : '0';
  var statSpeed = document.getElementById('stat-speed');
  if(statSpeed) statSpeed.innerHTML = '⚡ 評估/秒: <b>' + speed + '</b>';
  var statTime = document.getElementById('stat-time');
  if(statTime) statTime.innerHTML = '時間: <b>' + el + 's</b>';
  lastSpeedUpdate = now;
}

var yieldResolvers = [];
var yieldChannel = new MessageChannel();
yieldChannel.port1.onmessage = function(){
  var r = yieldResolvers.shift();
  if(r) r();
};
function yieldUI(){
  flushNow();
  updateProgress();
  updateTestAvg();
  updateSpeedUI();
  return new Promise(function(resolve){
    yieldResolvers.push(resolve);
    yieldChannel.port2.postMessage(0);
  });
}

/* ========== 解析 ========== */
function parseData(text){
  var rows = [], seen = {}, dups = 0, total = 0;
  var lines = text.split('\n');
  for(var i = 0; i < lines.length; i++){
    var p = lines[i].trim().split(/\s+/);
    if(p.length < 8) continue;
    var v = p.slice(0,6).map(Number);
    var r = p[7];
    if(v.some(isNaN) || ['H','D','A'].indexOf(r) === -1) continue;
    total++;
    var sig = v.join('|') + '|' + p[6] + '|' + r;
    if(seen[sig]){ dups++; continue; }
    seen[sig] = 1;
    rows.push({A:v[0],B:v[1],C:v[2],D:v[3],E:v[4],F:v[5],result:r});
  }
  return {rows:rows, total:total, dups:dups};
}

/* ========== 特徵提取 ========== */
function extractFeatures(rows){
  var N = rows.length;
  var mat = new Array(N);
  for(var i = 0; i < N; i++){
    var r = rows[i];
    var A=r.A,B=r.B,C=r.C,D=r.D,E=r.E,F=r.F;
    var f = new Float64Array(FCOUNT);
    f[0]=A;f[1]=B;f[2]=C;f[3]=D;f[4]=E;f[5]=F;
    f[6]=Math.abs(A-B);f[7]=Math.abs(A-C);f[8]=Math.abs(A-D);f[9]=Math.abs(A-E);f[10]=Math.abs(A-F);
    f[11]=Math.abs(B-C);f[12]=Math.abs(B-D);f[13]=Math.abs(B-E);f[14]=Math.abs(B-F);
    f[15]=Math.abs(C-D);f[16]=Math.abs(C-E);f[17]=Math.abs(C-F);
    f[18]=Math.abs(D-E);f[19]=Math.abs(D-F);f[20]=Math.abs(E-F);
    f[21]=A-B;f[22]=A-C;f[23]=B-C;f[24]=D-F;f[25]=E-D;
    f[26]=A+B;f[27]=B+C;f[28]=D+E;f[29]=E+F;f[30]=D+F;f[31]=A+C;
    f[32]=A+B+C;f[33]=D+E+F;f[34]=A+D;
    f[35]=C===0?0:A/C;f[36]=F===0?0:D/F;f[37]=(D+F)===0?0:D/(D+F);
    f[38]=Math.max(A,B,C);f[39]=Math.min(A,B,C);
    f[40]=Math.max(D,E,F);f[41]=Math.min(D,E,F);
    mat[i] = f;
  }
  return mat;
}
function extractMeta(rows){
  var N = rows.length;
  var codes = new Int8Array(N);
  var po = new Float64Array(N * 3);
  for(var i = 0; i < N; i++){
    codes[i] = RESULT_CODES[rows[i].result];
    po[i*3]=rows[i].D; po[i*3+1]=rows[i].E; po[i*3+2]=rows[i].F;
  }
  return {codes:codes, payouts:po};
}

/* ========== 評估 ========== */
function evalCond(f, ci, opCode, val){
  var x = f[ci];
  switch(opCode){
    case 0: return x > val;
    case 1: return x >= val;
    case 2: return x < val;
    case 3: return x <= val;
    case 4: return x === val;
    case 5: return x !== val;
  }
  return false;
}
function matchRule(f, rule){
  for(var g = 0; g < rule.groups.length; g++){
    var group = rule.groups[g];
    var ok = true;
    for(var c = 0; c < group.length; c++){
      if(!evalCond(f, group[c][0], group[c][1], group[c][2])){ ok = false; break; }
    }
    if(ok) return true;
  }
  return false;
}

function calcProfitOn(featMat, codes, payoutsArr, N, rules){
  var total = 0;
  for(var i = 0; i < N; i++){
    var f = featMat[i];
    var pred = -1;
    for(var r = 0; r < rules.length; r++){
      var rule = rules[r];
      if(!rule.on) continue;
      if(matchRule(f, rule)){ pred = rule.thenCode; break; }
    }
    if(pred < 0) continue;
    var gp;
    if(pred === codes[i]) gp = payoutsArr[i*3 + pred] - 100;
    else gp = -100;
    total += gp;
  }
  return total;
}

/* ========== 規則結構 ========== */
function cloneRule(r){
  var groups = [];
  for(var g = 0; g < r.groups.length; g++){
    var gs = [];
    for(var c = 0; c < r.groups[g].length; c++){
      var cond = r.groups[g][c];
      gs.push([cond[0], cond[1], cond[2]]);
    }
    groups.push(gs);
  }
  return {on:r.on, then:r.then, thenCode:r.thenCode, groups:groups, _isNew: r._isNew};
}
function cloneRules(rules){
  var out = new Array(rules.length);
  for(var i = 0; i < rules.length; i++) out[i] = cloneRule(rules[i]);
  return out;
}

function convertV15Rules(v15Rules){
  var out = [];
  for(var i = 0; i < v15Rules.length; i++){
    var v15 = v15Rules[i];
    var groups = [[]];
    for(var j = 0; j < v15.cond.length; j++){
      var c = v15.cond[j];
      var featIdx = FEATURES.indexOf(c[0]);
      if(featIdx === -1) featIdx = 0;
      var opIdx = OPS.indexOf(c[1]);
      if(opIdx === -1) opIdx = 1;
      groups[0].push([featIdx, opIdx, c[2]]);
    }
    out.push({
      on: v15.on,
      then: v15.then,
      thenCode: RESULT_CODES[v15.then],
      groups: groups,
      _isNew: 0
    });
  }
  return out;
}

/* ========== 掃描 ========== */
function getStep(val){
  var abs = Math.abs(val);
  if(abs < 20) return 1;
  if(abs < 50) return 2;
  if(abs < 200) return 5;
  if(abs < 500) return 10;
  return 20;
}

function scanOneParam(featMat, codes, payoutsArr, N, rules, ri, gi, ci, rangePct){
  var cond = rules[ri].groups[gi][ci];
  var origVal = cond[2];
  var range = Math.max(1, Math.abs(origVal) * rangePct);
  var step = getStep(origVal);
  var origProfit = calcProfitOn(featMat, codes, payoutsArr, N, rules);
  var bestProfit = origProfit;
  var bestVal = origVal;
  for(var v = origVal - range; v <= origVal + range; v += step){
    if(v < 0) continue;
    if(Math.abs(v - origVal) < 0.001) continue;
    cond[2] = v;
    var profit = calcProfitOn(featMat, codes, payoutsArr, N, rules);
    if(profit > bestProfit){ bestProfit = profit; bestVal = v; }
  }
  cond[2] = origVal;
  return {origValue: origVal, newValue: bestVal, origProfit: origProfit, newProfit: bestProfit, improvement: bestProfit - origProfit};
}

async function coordDescend(featMat, codes, payoutsArr, N, startRules, rangePct, foldLabel){
  var cur = cloneRules(startRules);
  var curProfit = calcProfitOn(featMat, codes, payoutsArr, N, cur);
  var accepted = 0;

  for(var iter = 0; iter < 3; iter++){
    var iterImproved = false;
    var iterAccepted = 0;
    for(var ri = 0; ri < cur.length && running; ri++){
      for(var gi = 0; gi < cur[ri].groups.length; gi++){
        for(var ci = 0; ci < cur[ri].groups[gi].length; ci++){
          if(!running) break;
          var res = scanOneParam(featMat, codes, payoutsArr, N, cur, ri, gi, ci, rangePct);
          if(res.improvement > MIN_IMPROVE * N){
            cur[ri].groups[gi][ci][2] = res.newValue;
            curProfit = res.newProfit;
            iterImproved = true;
            iterAccepted++;
            accepted++;
            if(document.getElementById('verbose').checked){
              pushLog(nowTime() + '   [' + foldLabel + '-掃描] R' + (ri+1) + ' ' + FEATURES[cur[ri].groups[gi][ci][0]] + OPS[cur[ri].groups[gi][ci][1]] + ' ' + Math.round(res.origValue) + '→' + Math.round(res.newValue), 'tune');
            }
          }
        }
      }
    }
    pushLog(nowTime() + '   [' + foldLabel + '-掃描] 第 ' + (iter+1) + ' 輪：接受 ' + iterAccepted, iterImproved ? 'ok' : 'dim');
    await yieldUI();
    if(!iterImproved) break;
  }
  return {rules: cur, profit: curProfit, accepted: accepted};
}

/* ========== 演化 ========== */
function sampleFeatureValue(fi, featMat, N){
  if(N === 0) return Math.random() * 300;
  var n = Math.min(50, N);
  var vals = [];
  for(var i = 0; i < n; i++) vals.push(featMat[Math.floor(Math.random() * N)][fi]);
  var base = vals[Math.floor(Math.random() * vals.length)];
  var spread = Math.max(1, Math.abs(base) * 0.25);
  var v = base + (Math.random() * 2 - 1) * spread;
  if(base > 5 && Math.abs(base - Math.round(base)) < 0.01) v = Math.round(v);
  return Math.max(0, v);
}

function genRandomRule(featMat, N){
  var tIdx = Math.floor(Math.random() * 4);
  var numConds = 1 + Math.floor(Math.random() * 2);
  var group = [];
  for(var i = 0; i < numConds; i++){
    var fi = Math.floor(Math.random() * FCOUNT);
    var op = Math.floor(Math.random() * 4);  // > >= < <=
    var val = sampleFeatureValue(fi, featMat, N);
    group.push([fi, op, val]);
  }
  return {on:1, then: RESULTS[tIdx], thenCode: tIdx, groups: [group], _isNew: 1};
}

function mutateRule(rule, featMat, N){
  var newRule = cloneRule(rule);
  if(newRule.groups.length === 0) return newRule;
  var gi = Math.floor(Math.random() * newRule.groups.length);
  if(newRule.groups[gi].length === 0) return newRule;
  var ci = Math.floor(Math.random() * newRule.groups[gi].length);
  var p = Math.random();
  if(p < 0.6){
    // 改閾值
    var cond = newRule.groups[gi][ci];
    var step = getStep(cond[2]);
    var delta = (Math.floor(Math.random() * 11) - 5) * step;
    cond[2] = Math.max(0, cond[2] + delta);
  } else if(p < 0.8){
    // 改運算符
    var cond2 = newRule.groups[gi][ci];
    var oldOp = cond2[1];
    var newOp;
    do { newOp = Math.floor(Math.random() * 4); } while(newOp === oldOp);
    cond2[1] = newOp;
  } else {
    // 改結果
    var nc = Math.floor(Math.random() * 4);
    newRule.thenCode = nc;
    newRule.then = RESULTS[nc];
  }
  return newRule;
}

async function evolveRules(featMat, codes, payoutsArr, N, startRules, maxIter, foldLabel){
  var cur = cloneRules(startRules);
  var curProfit = calcProfitOn(featMat, codes, payoutsArr, N, cur);
  var curPerGame = N > 0 ? curProfit / N : 0;
  var accepted = 0;

  pushLog(nowTime() + '   [' + foldLabel + '-演化] 起始 ' + curPerGame.toFixed(2) + '/場', 'evo');

  for(var iter = 0; iter < maxIter; iter++){
    var iterImproved = false;
    var iterAccepted = 0;

    for(var attempt = 0; attempt < 50 && running; attempt++){
      var p = Math.random();
      var candRules = cloneRules(cur);
      var action = '';

      if(p < 0.5 && candRules.length > 0){
        // 改一個規則
        var ri = Math.floor(Math.random() * candRules.length);
        candRules[ri] = mutateRule(candRules[ri], featMat, N);
        action = 'mutate R' + (ri+1);
      } else if(p < 0.8){
        // 加新規則
        if(candRules.length >= 50) continue;
        var newRule = genRandomRule(featMat, N);
        var pos = Math.random() < 0.7 ? candRules.length : Math.floor(Math.random() * (candRules.length + 1));
        candRules.splice(pos, 0, newRule);
        action = 'add rule';
      } else {
        // 刪除規則
        if(candRules.length <= 5) continue;
        var ri2 = Math.floor(Math.random() * candRules.length);
        candRules.splice(ri2, 1);
        action = 'del R' + (ri2+1);
      }

      var candProfit = calcProfitOn(featMat, codes, payoutsArr, N, candRules);
      var improvement = candProfit - curProfit;

      // 保守：改善必須 > 0.5/場
      if(improvement > EVO_MIN_IMPROVE * N){
        cur = candRules;
        curProfit = candProfit;
        curPerGame = N > 0 ? curProfit / N : 0;
        iterImproved = true;
        iterAccepted++;
        accepted++;
        if(document.getElementById('verbose').checked && accepted % 3 === 0){
          pushLog(nowTime() + '   [' + foldLabel + '-演化] ' + action + ' → ' + curPerGame.toFixed(2) + '/場', 'evo');
        }
      }
    }

    pushLog(nowTime() + '   [' + foldLabel + '-演化] 第 ' + (iter+1) + '/' + maxIter + ' 輪：接受 ' + iterAccepted + '，規則數 ' + cur.length, iterImproved ? 'ok' : 'dim');
    await yieldUI();

    if(!iterImproved) break;
  }

  return {rules: cur, profit: curProfit, perGame: curPerGame, accepted: accepted};
}

/* ========== 格式化 ========== */
function fmtCond(c){ return FEATURES[c[0]] + OPS[c[1]] + Math.round(c[2] * 100) / 100; }
function fmtRule(r){
  if(!r.groups || r.groups.length === 0) return '(空)→' + r.then;
  var parts = [];
  for(var g = 0; g < r.groups.length; g++){
    parts.push('(' + r.groups[g].map(fmtCond).join('&') + ')');
  }
  return parts.join('|') + '→' + r.then;
}

function diagnose(rules, featMat, codes, payoutsArr, N){
  var stats = [];
  for(var i = 0; i < rules.length; i++) stats.push({rule:rules[i], hit:0, correct:0, wrong:0, profit:0});
  for(var i = 0; i < N; i++){
    var f = featMat[i];
    var pred = -1, hr = -1;
    for(var j = 0; j < rules.length; j++){
      if(!rules[j].on) continue;
      if(matchRule(f, rules[j])){ pred = rules[j].thenCode; hr = j; break; }
    }
    if(pred < 0 || hr === -1) continue;
    stats[hr].hit++;
    if(pred === codes[i]){ stats[hr].correct++; stats[hr].profit += payoutsArr[i*3 + pred] - 100; }
    else { stats[hr].wrong++; stats[hr].profit -= 100; }
  }
  return stats;
}

function renderRuleTable(stats){
  var html = '<table><thead><tr>' +
    '<th>#</th><th>類型</th><th>ON</th><th>條件</th><th>指向</th>' +
    '<th>命中</th><th>對</th><th>錯</th><th>盈利</th>' +
    '</tr></thead><tbody>';
  for(var i = 0; i < stats.length; i++){
    var s = stats[i];
    var r = s.rule;
    var ss = fmtRule(r);
    if(ss.length > 90) ss = ss.slice(0, 87) + '...';
    var pcls = s.profit > 0 ? 'profit-pos' : (s.profit < 0 ? 'profit-neg' : '');
    var onTag = r.on ? '<span class="tag-ok">ON</span>' : '<span class="tag-off">OFF</span>';
    var thenTag = '<span class="tag-pred">' + r.then + '</span>';
    var typeTag = r._isNew ? '<span class="tag-new">➕新</span>' : '<span class="tag-soft">🟡v15</span>';
    html += '<tr><td>R' + (i+1) + '</td><td>' + typeTag + '</td><td>' + onTag + '</td>' +
      '<td style="text-align:left;font-size:10px">' + ss + '</td><td>' + thenTag + '</td>' +
      '<td>' + s.hit + '</td><td>' + s.correct + '</td><td>' + s.wrong + '</td>' +
      '<td class="' + pcls + '">' + s.profit + '</td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('ruleTable').innerHTML = html;
}

/* ========== 公式生成 ========== */
function sheetOp(opIdx){
  var op = OPS[opIdx];
  if(op === '!=') return '<>';
  if(op === '==') return '=';
  return op;
}
function featToExpr(feat){
  switch(feat){
    case 'A': case 'B': case 'C': case 'D': case 'E': case 'F': return feat + '2:' + feat;
    case '|A-B|': return 'ABS(A2:A-B2:B)';
    case '|A-C|': return 'ABS(A2:A-C2:C)';
    case '|A-D|': return 'ABS(A2:A-D2:D)';
    case '|A-E|': return 'ABS(A2:A-E2:E)';
    case '|A-F|': return 'ABS(A2:A-F2:F)';
    case '|B-C|': return 'ABS(B2:B-C2:C)';
    case '|B-D|': return 'ABS(B2:B-D2:D)';
    case '|B-E|': return 'ABS(B2:B-E2:E)';
    case '|B-F|': return 'ABS(B2:B-F2:F)';
    case '|C-D|': return 'ABS(C2:C-D2:D)';
    case '|C-E|': return 'ABS(C2:C-E2:E)';
    case '|C-F|': return 'ABS(C2:C-F2:F)';
    case '|D-E|': return 'ABS(D2:D-E2:E)';
    case '|D-F|': return 'ABS(D2:D-F2:F)';
    case '|E-F|': return 'ABS(E2:E-F2:F)';
    case 'A-B': return '(A2:A-B2:B)';
    case 'A-C': return '(A2:A-C2:C)';
    case 'B-C': return '(B2:B-C2:C)';
    case 'D-F': return '(D2:D-F2:F)';
    case 'E-D': return '(E2:E-D2:D)';
    case 'A+B': return '(A2:A+B2:B)';
    case 'B+C': return '(B2:B+C2:C)';
    case 'D+E': return '(D2:D+E2:E)';
    case 'E+F': return '(E2:E+F2:F)';
    case 'D+F': return '(D2:D+F2:F)';
    case 'A+C': return '(A2:A+C2:C)';
    case 'A+B+C': return '(A2:A+B2:B+C2:C)';
    case 'D+E+F': return '(D2:D+E2:E+F2:F)';
    case 'A+D': return '(A2:A+D2:D)';
    case 'A/C': return 'IF(C2:C=0,0,A2:A/C2:C)';
    case 'D/F': return 'IF(F2:F=0,0,D2:D/F2:F)';
    case 'D/(D+F)': return 'IF(D2:D+F2:F=0,0,D2:D/(D2:D+F2:F))';
    case 'MAX(A,B,C)': return 'MAX(A2:A,B2:B,C2:C)';
    case 'MIN(A,B,C)': return 'MIN(A2:A,B2:B,C2:C)';
    case 'MAX(D,E,F)': return 'MAX(D2:D,E2:E,F2:F)';
    case 'MIN(D,E,F)': return 'MIN(D2:D,E2:E,F2:F)';
    default: return '0';
  }
}
function buildCondSheet(cond){
  var op = sheetOp(cond[1]);
  var v = Math.round(cond[2] * 100) / 100;
  return '(' + featToExpr(FEATURES[cond[0]]) + op + v + ')';
}
function buildGroupSheet(g){
  if(!g.length) return 'TRUE';
  return g.map(buildCondSheet).join('*');
}
function buildRuleSheet(r){
  if(!r.groups.length) return 'FALSE';
  if(r.groups.length === 1) return buildGroupSheet(r.groups[0]);
  return '(' + r.groups.map(function(g){ return '(' + buildGroupSheet(g) + ')'; }).join('+') + ')';
}
function genSingleFormula(rules){
  var active = [];
  for(var i = 0; i < rules.length; i++) if(rules[i].on) active.push(rules[i]);
  if(!active.length) return '=ARRAYFORMULA(IF(A2:A="","","skip"))';
  var body = '';
  for(var i = 0; i < active.length; i++){
    var expr = buildRuleSheet(active[i]);
    if(active[i].groups.length > 1){
      body += 'IF((' + expr + ')>0,"' + active[i].then + '",';
    } else {
      body += 'IF(' + expr + ',"' + active[i].then + '",';
    }
  }
  body += '"skip"';
  for(var j = 0; j < active.length; j++) body += ')';
  return '=ARRAYFORMULA(IF((A2:A="")+(B2:B="")+(C2:C="")+(D2:D="")+(E2:E="")+(F2:F=""),"",' + body + '))';
}

/* ========== 主流程 ========== */
async function start(){
  var parsed = parseData(document.getElementById('input').value);
  if(parsed.rows.length === 0){ alert(t('noData')); return; }
  if(parsed.rows.length < 30){ alert('資料太少（< 30 場）'); return; }

  running = true;
  startTime = Date.now();
  evalCount = 0;
  currentFold = 0;
  foldResults = [];
  lastEvolvedRules = null;
  lastSpeedUpdate = 0;

  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('diag').style.display = 'none';
  document.getElementById('best').style.display = 'none';
  document.getElementById('liveStats').style.display = 'flex';
  document.getElementById('progbar').style.width = '0%';
  document.getElementById('progText').textContent = '0.0%';
  document.getElementById('progPhase').textContent = '準備中';
  updateTestAvg();

  clearLog();

  var N_FOLDS = parseInt(document.getElementById('folds').value);
  var EVO_ITER = parseInt(document.getElementById('evoIter').value);
  SCAN_RANGE_PCT = 0.2;
  totalFolds = N_FOLDS;

  pushLog('═══════════════════════════════════════════════════════════', 'head');
  pushLog('🚀 v36 — 交叉驗證 + 演化（' + N_FOLDS + ' 折）', 'head');
  pushLog('═══════════════════════════════════════════════════════════', 'head');
  pushLog(nowTime() + ' 原始有效行數：' + parsed.total, 'info');
  pushLog(nowTime() + ' 重複：' + parsed.dups + '（已忽略）', 'warn');
  pushLog(nowTime() + ' 去重後：' + parsed.rows.length + ' 筆', 'success');
  pushLog(nowTime() + ' 🔄 ' + N_FOLDS + ' 折交叉驗證', 'fold');
  pushLog(nowTime() + ' 🔍 掃描：±' + (SCAN_RANGE_PCT*100).toFixed(0) + '%', 'init');
  pushLog(nowTime() + ' 🧬 演化：' + EVO_ITER + ' 輪', 'evo');
  pushLog('');

  var allRows = parsed.rows.slice();
  for(var i = allRows.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = allRows[i]; allRows[i] = allRows[j]; allRows[j] = tmp;
  }

  var n = allRows.length;
  var foldSize = Math.floor(n / N_FOLDS);

  for(var fold = 1; fold <= N_FOLDS; fold++){
    if(!running) break;
    currentFold = fold;
    updateProgress();

    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog(nowTime() + ' 🔄 第 ' + fold + '/' + N_FOLDS + ' 折', 'fold');
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    await yieldUI();

    var testStart = (fold - 1) * foldSize;
    var testEnd = (fold === N_FOLDS) ? n : fold * foldSize;
    var trainRows = [], testRows = [];
    for(var i = 0; i < n; i++){
      if(i >= testStart && i < testEnd) testRows.push(allRows[i]);
      else trainRows.push(allRows[i]);
    }

    trainN = trainRows.length;
    testN = testRows.length;

    pushLog(nowTime() + '   訓練 ' + trainN + ' 場 / 測試 ' + testN + ' 場', 'dim');

    trainFeat = extractFeatures(trainRows);
    var trm = extractMeta(trainRows);
    trainCodes = trm.codes; trainPayouts = trm.payouts;

    testFeat = extractFeatures(testRows);
    var tem = extractMeta(testRows);
    testCodes = tem.codes; testPayouts = tem.payouts;

    // === 階段 1：v15 基線 ===
    var v15Rules = convertV15Rules(INIT_RULES);
    var v15TrainPer = trainN > 0 ? calcProfitOn(trainFeat, trainCodes, trainPayouts, trainN, v15Rules) / trainN : 0;
    var v15TestPer = testN > 0 ? calcProfitOn(testFeat, testCodes, testPayouts, testN, v15Rules) / testN : 0;

    pushLog(nowTime() + '   ① v15 基線：訓練 ' + v15TrainPer.toFixed(2) + '/場，測試 ' + v15TestPer.toFixed(2) + '/場', 'base');

    // === 階段 2：掃描 ===
    var scanRes = await coordDescend(trainFeat, trainCodes, trainPayouts, trainN, v15Rules, SCAN_RANGE_PCT, '折' + fold);
    if(!running) break;

    var scanTrainPer = trainN > 0 ? scanRes.profit / trainN : 0;
    var scanTestP = calcProfitOn(testFeat, testCodes, testPayouts, testN, scanRes.rules);
    var scanTestPer = testN > 0 ? scanTestP / testN : 0;

    pushLog(nowTime() + '   ② 掃描後：訓練 ' + scanTrainPer.toFixed(2) + '/場，測試 ' + scanTestPer.toFixed(2) + '/場（改動 ' + scanRes.accepted + '）', 'tune');

    // === 階段 3：演化 ===
    var evoRes = await evolveRules(trainFeat, trainCodes, trainPayouts, trainN, scanRes.rules, EVO_ITER, '折' + fold);
    if(!running) break;

    var evoTrainPer = trainN > 0 ? evoRes.profit / trainN : 0;
    var evoTestP = calcProfitOn(testFeat, testCodes, testPayouts, testN, evoRes.rules);
    var evoTestPer = testN > 0 ? evoTestP / testN : 0;

    pushLog(nowTime() + '   ③ 演化後：訓練 ' + evoTrainPer.toFixed(2) + '/場，測試 ' + evoTestPer.toFixed(2) + '/場（改動 ' + evoRes.accepted + '）', 'evo');
    pushLog('');

    foldResults.push({
      fold: fold,
      trainN: trainN,
      testN: testN,
      v15TestPer: v15TestPer,
      testPerAfterScan: scanTestPer,
      testPerAfterEvo: evoTestPer,
      v15TrainPer: v15TrainPer,
      trainPerAfterScan: scanTrainPer,
      trainPerAfterEvo: evoTrainPer,
      scanAccepted: scanRes.accepted,
      evoAccepted: evoRes.accepted,
      rulesCountAfterEvo: evoRes.rules.length
    });

    lastEvolvedRules = evoRes.rules;

    updateTestAvg();
    await yieldUI();
  }

  finish();

  function finish(){
    var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

    function avg(key){
      var s = 0;
      for(var i = 0; i < foldResults.length; i++) s += foldResults[i][key];
      return foldResults.length > 0 ? s / foldResults.length : 0;
    }
    function std(key){
      var a = avg(key);
      var s = 0;
      for(var i = 0; i < foldResults.length; i++) s += (foldResults[i][key] - a) * (foldResults[i][key] - a);
      return Math.sqrt(foldResults.length > 1 ? s / foldResults.length : 0);
    }

    var v15TestAvg = avg('v15TestPer');
    var scanTestAvg = avg('testPerAfterScan');
    var evoTestAvg = avg('testPerAfterEvo');
    var v15TestStd = std('v15TestPer');
    var scanTestStd = std('testPerAfterScan');
    var evoTestStd = std('testPerAfterEvo');

    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog('🏆 v36 交叉驗證 + 演化 完成', 'stats');
    pushLog('═══════════════════════════════════════════════════════════', 'head');
    pushLog('');
    pushLog('   📊 三段測試集平均：', 'stats');
    pushLog('      ① v15 基線：   ' + v15TestAvg.toFixed(2) + ' ±' + v15TestStd.toFixed(2) + '/場', 'base');
    pushLog('      ② 掃描後：     ' + scanTestAvg.toFixed(2) + ' ±' + scanTestStd.toFixed(2) + '/場', 'tune');
    pushLog('      ③ 演化後：     ' + evoTestAvg.toFixed(2) + ' ±' + evoTestStd.toFixed(2) + '/場', 'evo');
    pushLog('');
    pushLog('   掃描貢獻：' + (scanTestAvg - v15TestAvg >= 0 ? '+' : '') + (scanTestAvg - v15TestAvg).toFixed(2) + '/場', 'tune');
    pushLog('   演化貢獻：' + (evoTestAvg - scanTestAvg >= 0 ? '+' : '') + (evoTestAvg - scanTestAvg).toFixed(2) + '/場', 'evo');
    pushLog('');
    pushLog('   總掃描：' + evalCount + ' 次', 'speed');
    pushLog('   總耗時：' + elapsed + ' 秒', 'speed');
    pushLog('═══════════════════════════════════════════════════════════', 'head');

    document.getElementById('best').style.display = 'block';
    document.getElementById('summary').innerHTML = '🏆 演化後測試平均 <b>' + evoTestAvg.toFixed(2) + '</b> ±' + evoTestStd.toFixed(2);

    /* 誠實判定 */
    var evoDelta = evoTestAvg - scanTestAvg;
    var verdictColor = 'verdict-neutral';
    var verdictText = '';

    if(foldResults.length === 0){
      verdictText = '<div class="big-num verdict-neutral">無資料</div>';
    } else {
      var absEvo = Math.abs(evoTestAvg);
      var ratio = evoTestStd > 0 ? absEvo / evoTestStd : 0;
      var evoContribution = evoDelta;
      var scanContribution = scanTestAvg - v15TestAvg;

      var headerHtml = '<div class="big-num ' + (evoTestAvg > 0 ? 'verdict-pos' : 'verdict-neg') + '">' + evoTestAvg.toFixed(2) + '</div>' +
        '<div style="font-size:13px;color:#666;margin-top:4px">演化後測試每場</div>' +
        '<div style="font-size:12px;color:#666;margin-top:4px">標準差 ±' + evoTestStd.toFixed(2) + '</div>';

      var scanVerdict = '';
      if(scanTestAvg > v15TestAvg + 1 && scanTestAvg > 0){
        scanVerdict = '🟢 掃描有效（+' + scanContribution.toFixed(2) + '/場）';
      } else if(scanTestAvg > v15TestAvg){
        scanVerdict = '🟡 掃描略微有效（+' + scanContribution.toFixed(2) + '/場）';
      } else {
        scanVerdict = '🔴 掃描無效或有害（' + scanContribution.toFixed(2) + '/場）';
      }

      var evoVerdict = '';
      if(evoDelta > 1 && evoTestAvg > 0){
        evoVerdict = '✅ 演化有效（+' + evoDelta.toFixed(2) + '/場）';
      } else if(evoDelta > 0){
        evoVerdict = '🟡 演化略微有效（+' + evoDelta.toFixed(2) + '/場）';
      } else if(evoDelta > -1){
        evoVerdict = '⚪ 演化無效果（' + evoDelta.toFixed(2) + '/場）';
      } else {
        evoVerdict = '❌ 演化過擬合（' + evoDelta.toFixed(2) + '/場）';
      }

      verdictText = headerHtml +
        '<div style="margin-top:10px;font-size:14px">' + scanVerdict + '</div>' +
        '<div style="font-size:14px">' + evoVerdict + '</div>' +
        '<div style="font-size:12px;color:#666;margin-top:6px">' +
        '平均/標準差 = ' + ratio.toFixed(2) + (ratio > 2 ? ' ✅ 顯著' : ratio > 1 ? ' 🟡 弱' : ' ⚠️ 不顯著') +
        '</div>';
    }
    document.getElementById('verdictBox').innerHTML = verdictText;

    // 三段對比表
    var cmpHtml = '<table class="cmp-table"><thead><tr>' +
      '<th>階段</th><th>測試每場</th><th>標準差</th><th>相對前階段</th>' +
      '</tr></thead><tbody>' +
      '<tr><td>① v15 基線</td><td>' + v15TestAvg.toFixed(2) + '</td><td>±' + v15TestStd.toFixed(2) + '</td><td>-</td></tr>' +
      '<tr><td>② 掃描</td><td>' + scanTestAvg.toFixed(2) + '</td><td>±' + scanTestStd.toFixed(2) + '</td>' +
      '<td class="' + (scanTestAvg - v15TestAvg >= 0 ? 'profit-pos' : 'profit-neg') + '">' +
      (scanTestAvg - v15TestAvg >= 0 ? '+' : '') + (scanTestAvg - v15TestAvg).toFixed(2) + '</td></tr>' +
      '<tr style="background:#e0f2fe;font-weight:bold"><td>③ 演化</td><td>' + evoTestAvg.toFixed(2) + '</td><td>±' + evoTestStd.toFixed(2) + '</td>' +
      '<td class="' + (evoTestAvg - scanTestAvg >= 0 ? 'profit-pos' : 'profit-neg') + '">' +
      (evoTestAvg - scanTestAvg >= 0 ? '+' : '') + (evoTestAvg - scanTestAvg).toFixed(2) + '</td></tr>' +
      '</tbody></table>';
    document.getElementById('cmpTable').innerHTML = cmpHtml;

    // 每折明細
    var fHtml = '<table><thead><tr>' +
      '<th>折</th><th>訓練</th><th>測試</th>' +
      '<th>v15 測試</th><th>掃描測試</th><th>演化測試</th>' +
      '<th>掃描 Δ</th><th>演化 Δ</th><th>規則數</th>' +
      '</tr></thead><tbody>';
    for(var i = 0; i < foldResults.length; i++){
      var r = foldResults[i];
      var sDelta = r.testPerAfterScan - r.v15TestPer;
      var eDelta = r.testPerAfterEvo - r.testPerAfterScan;
      fHtml += '<tr>' +
        '<td>#' + r.fold + '</td>' +
        '<td>' + r.trainN + '</td>' +
        '<td>' + r.testN + '</td>' +
        '<td>' + r.v15TestPer.toFixed(2) + '</td>' +
        '<td>' + r.testPerAfterScan.toFixed(2) + '</td>' +
        '<td><b>' + r.testPerAfterEvo.toFixed(2) + '</b></td>' +
        '<td class="' + (sDelta >= 0 ? 'profit-pos' : 'profit-neg') + '">' + (sDelta >= 0 ? '+' : '') + sDelta.toFixed(2) + '</td>' +
        '<td class="' + (eDelta >= 0 ? 'profit-pos' : 'profit-neg') + '">' + (eDelta >= 0 ? '+' : '') + eDelta.toFixed(2) + '</td>' +
        '<td>' + r.rulesCountAfterEvo + '</td>' +
        '</tr>';
    }
    fHtml += '</tbody></table>';
    document.getElementById('foldTable').innerHTML = fHtml;

    if(lastEvolvedRules){
      var formula = genSingleFormula(lastEvolvedRules);
      document.getElementById('charInfo').innerHTML = '字符數：<b>' + formula.length + '</b>';
      document.getElementById('txtOut').value = formula;
      var stats = diagnose(lastEvolvedRules, trainFeat, trainCodes, trainPayouts, trainN);
      renderRuleTable(stats);
      document.getElementById('diag').style.display = 'block';
    }

    running = false;
    document.getElementById('btnRun').disabled = false;
    document.getElementById('btnStop').disabled = true;
    updateProgress();
    updateTestAvg();
    updateSpeedUI();
    flushNow();
  }
}

function stop(){
  running = false;
  document.getElementById('btnStop').disabled = true;
  pushLog('⏹ 使用者手動停止', 'warn');
  updateProgress();
  flushNow();
}
function copyIt(id){
  var el = document.getElementById(id);
  if(!el) return;
  var txt = el.value;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      showMsg('✅ 已複製 ' + txt.length + ' 字元', true);
    }).catch(function(){ fallbackCopy(txt); });
  } else { fallbackCopy(txt); }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok) showMsg('✅ 已複製 ' + text.length + ' 字元', true);
  else showMsg('❌ 複製失敗', false);
}
function showMsg(text, ok){
  var m = document.getElementById('msg');
  m.textContent = text; m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  setTimeout(function(){ m.style.display = 'none'; }, 3000);
}

(function(){
  document.getElementById('log').textContent = '等待開始...';
})();
</script>
